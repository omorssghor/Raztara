<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RAZTARA — Delete</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffffff 0%,#f5fbf8 55%,#eef9f5 100%);
    color:#222;
}

body{
    padding-bottom:90px;
}

/* HEADER */

.header{
    height:62px;
    min-height:62px;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 8px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 7px rgba(0,0,0,.18);
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:27px;
    cursor:pointer;
}

.header-title{
    flex:1;
    font-size:18px;
    font-weight:700;
    margin-left:5px;
}

.header-delete{
    border:0;
    background:#fff;
    color:#087f5b;
    padding:8px 11px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.header-delete:disabled{
    opacity:.5;
}

/* TOP BAR */

.top-bar{
    background:#fff;
    border-bottom:1px solid #ddd;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:8px;
    position:sticky;
    top:62px;
    z-index:90;
}

.top-bar button{
    flex:1;
    border:1px solid #087f5b;
    background:#fff;
    color:#087f5b;
    padding:10px 6px;
    border-radius:9px;
    font-size:13px;
    cursor:pointer;
}

.top-bar button.active{
    background:#087f5b;
    color:#fff;
}

/* INFO */

.info{
    margin:12px;
    background:#fff;
    border-radius:12px;
    padding:12px;
    color:#666;
    font-size:13px;
    line-height:1.5;
    box-shadow:0 1px 5px rgba(0,0,0,.06);
}

/* LIST */

.list{
    padding:0 12px;
}

.message-item{
    background:#fff;
    border-radius:13px;
    margin-bottom:9px;
    padding:11px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
}

.message-item.selected{
    outline:2px solid #087f5b;
    background:#f0fff9;
}

.checkbox-wrap{
    padding-top:2px;
    flex-shrink:0;
}

.message-check{
    width:21px;
    height:21px;
    accent-color:#087f5b;
    cursor:pointer;
}

.message-preview{
    flex:1;
    min-width:0;
}

.sender-line{
    font-size:11px;
    color:#777;
    margin-bottom:5px;
}

.content-text{
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.media-preview{
    max-width:190px;
    max-height:150px;
    border-radius:9px;
    display:block;
    object-fit:cover;
}

.audio-preview{
    width:220px;
    max-width:100%;
}

.file-box{
    display:flex;
    align-items:center;
    gap:8px;
}

.file-icon{
    font-size:27px;
}

.file-name{
    font-size:13px;
    word-break:break-word;
}

.deleted-text{
    color:#888;
    font-style:italic;
    font-size:13px;
}

.message-time{
    margin-top:5px;
    color:#999;
    font-size:10px;
}

.empty{
    text-align:center;
    color:#777;
    padding:45px 15px;
    font-size:14px;
}

.loading{
    text-align:center;
    color:#777;
    padding:40px 15px;
}

/* BOTTOM */

.bottom-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    border-top:1px solid #ddd;
    padding:8px;
    display:flex;
    gap:7px;
    z-index:200;
}

.bottom-bar button{
    flex:1;
    border:0;
    padding:12px 5px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.delete-me{
    background:#eee;
    color:#333;
}

.delete-everyone{
    background:#087f5b;
    color:#fff;
}

.bottom-bar button:disabled{
    opacity:.45;
}

/* MODAL */

 .modal{
    position:fixed;
    inset:0;
    background:rgba(238,249,245,.58);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:500;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:380px;
    background:linear-gradient(145deg,#ffffff,#f3fbf8);
    border:1px solid rgba(8,127,91,.10);
    border-radius:18px;
    padding:22px;
    box-shadow:0 12px 40px rgba(8,127,91,.14);
}

.modal-title{
    font-size:18px;
    font-weight:700;
    color:#18352d;
    margin-bottom:10px;
}

 .modal-text{
    color:#52655f;
    font-size:14px;
    line-height:1.5;
    margin-bottom:18px;
}

.modal-actions{
    display:flex;
    gap:8px;
}

.modal-actions button{
    flex:1;
    border:0;
    background:transparent;
    padding:12px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.cancel-btn{
    color:#52655f;
}

.confirm-btn{
    color:#087f5b;
}

.confirm-danger{
    color:#b3262e;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:10px 17px;
    border-radius:22px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="header">

    <button
        class="back-btn"
        onclick="goBack()">
        ‹
    </button>

    <div class="header-title">
        <span id="pageTitle">
            Delete
        </span>
    </div>

    <button
        id="headerDeleteBtn"
        class="header-delete"
        onclick="deleteForMe()"
        disabled>
        🗑️ Delete
    </button>

</div>

<div class="top-bar">

    <button
        id="markAllBtn"
        onclick="markAll()">
        ☑️ All Mark
    </button>

    <button
        onclick="unmarkAll()">
        ⬜ Unmark All
    </button>

</div>

<div class="info">

    <div id="infoText">
        যেসব মেসেজ Delete করতে চান সেগুলো Mark করুন।
        তারপর Delete অপশন ব্যবহার করুন।
    </div>

</div>

<div id="list" class="list">

    <div class="loading">
        <span id="loadingText">
        </span>
    </div>

</div>

<div class="bottom-bar">

    <button
        id="deleteMeBtn"
        class="delete-me"
        onclick="deleteForMe()"
        disabled>
        🗑️ Delete for Me
    </button>

    <button
        id="deleteEveryoneBtn"
        class="delete-everyone"
        onclick="deleteForEveryone()"
        disabled>
        🗑️ Delete for Everyone
    </button>

</div>

<!-- CONFIRM MODAL -->

<div
    id="confirmModal"
    class="modal"
    onclick="closeModal(event)">

    <div
        class="modal-box"
        onclick="event.stopPropagation()">

        <div
            id="modalTitle"
            class="modal-title">
            Confirm
        </div>

        <div
            id="modalText"
            class="modal-text">
            Are you sure?
        </div>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeModal()">
                Cancel
            </button>

            <button
                id="confirmButton"
                class="confirm-btn"
                onclick="confirmAction()">
                Confirm
            </button>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let conversationId = null;

let messages = [];
let hiddenMessageIds = new Set();
let selectedIds = new Set();

let pendingAction = null;

let currentLanguage =
    localStorage.getItem(
        "raztara_language"
    ) || "bn";

/* =========================================================
   LANGUAGE
========================================================= */

const translations = {

    bn:{
        title:"Delete",
        loading:"",
        allMark:"☑️ All Mark",
        unmarkAll:"⬜ Unmark All",
        info:"যেসব মেসেজ Delete করতে চান সেগুলো Mark করুন। তারপর Delete অপশন ব্যবহার করুন।",
        delete:"🗑️ Delete",
        deleteMe:"🗑️ Delete for Me",
        deleteEveryone:"🗑️ Delete for Everyone",
        noMessages:"কোনো মেসেজ পাওয়া যায়নি",
        loginRequired:"লগইন করুন",
        conversationMissing:"Conversation পাওয়া যায়নি",
        selectMessage:"আগে মেসেজ Mark করুন",
        confirm:"নিশ্চিত করুন",
        cancel:"বাতিল",
        deleteMeConfirm:"আপনি কি Mark করা মেসেজগুলো আপনার Chat থেকে Delete করতে চান?",
        deleteEveryoneConfirm:"শুধু আপনার পাঠানো Mark করা মেসেজগুলো সবার জন্য Delete হবে। আপনি কি নিশ্চিত?",
        deletedMe:"Mark করা মেসেজগুলো আপনার Chat থেকে Delete করা হয়েছে",
        deletedEveryone:"আপনার Mark করা নিজের মেসেজগুলো সবার জন্য Delete করা হয়েছে",
        deleteFailed:"Delete করা যায়নি",
        deletedMessage:"এই মেসেজটি Delete করা হয়েছে",
        you:"আপনি",
        other:"অন্য ব্যক্তি",
        file:"ফাইল"
    },

    en:{
        title:"Delete",
        loading:"",
        allMark:"☑️ All Mark",
        unmarkAll:"⬜ Unmark All",
        info:"Mark the messages you want to delete, then use a Delete option.",
        delete:"🗑️ Delete",
        deleteMe:"🗑️ Delete for Me",
        deleteEveryone:"🗑️ Delete for Everyone",
        noMessages:"No messages found",
        loginRequired:"Please login",
        conversationMissing:"Conversation not found",
        selectMessage:"Mark messages first",
        confirm:"Confirm",
        cancel:"Cancel",
        deleteMeConfirm:"Delete the marked messages from your Chat?",
        deleteEveryoneConfirm:"Only your own marked messages will be deleted for everyone. Continue?",
        deletedMe:"Marked messages were deleted from your Chat",
        deletedEveryone:"Your marked messages were deleted for everyone",
        deleteFailed:"Could not delete",
        deletedMessage:"This message was deleted",
        you:"You",
        other:"Other user",
        file:"File"
    }

};

function t(key){

    return (
        translations[currentLanguage]?.[key] ||
        translations.bn[key] ||
        key
    );
}

/* =========================================================
   PARAMS
========================================================= */

function getParams(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return {

        conversationId:
            params.get("conversation_id") ||
            params.get("conversation"),

        messageId:
            params.get("message_id") ||
            params.get("message")
    };
}

/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getUser();

    if(
        error ||
        !data?.user
    ){

        showToast(
            t("loginRequired")
        );

        setTimeout(()=>{

            window.location.href =
                "index.html";

        },900);

        return null;
    }

    return data.user;
}

/* =========================================================
   LOAD HIDDEN MESSAGES
========================================================= */

async function loadHiddenMessages(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("message_user_deletions")
            .select("message_id")
            .eq(
                "user_id",
                currentUser.id
            );

    if(error){

        console.error(
            "Hidden messages:",
            error
        );

        return;
    }

    hiddenMessageIds =
        new Set(
            (data || [])
                .map(
                    row =>
                        String(
                            row.message_id
                        )
                )
        );
}

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    const list =
        document.getElementById(
            "list"
        );

    list.innerHTML = `
        <div class="loading">
            ${t("loading")}
        </div>
    `;

    if(!conversationId){

        list.innerHTML = `
            <div class="empty">
                ${t("conversationMissing")}
            </div>
        `;

        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select(`
                id,
                conversation_id,
                sender_id,
                content,
                message_type,
                file_url,
                created_at,
                deleted_for_everyone
            `)
            .eq(
                "conversation_id",
                conversationId
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );

    if(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

        return;
    }

    messages =
        (data || []).filter(
            message =>
                !hiddenMessageIds.has(
                    String(message.id)
                )
        );

    renderMessages();
}

/* =========================================================
   RENDER
========================================================= */

function renderMessages(){

    const list =
        document.getElementById(
            "list"
        );

    list.innerHTML = "";

    if(!messages.length){

        list.innerHTML = `
            <div class="empty">
                ${t("noMessages")}
            </div>
        `;

        updateButtons();

        return;
    }

    messages.forEach(
        message =>
            renderMessage(
                message
            )
    );

    updateButtons();
}

/* =========================================================
   RENDER ONE MESSAGE
========================================================= */

function renderMessage(message){

    const list =
        document.getElementById(
            "list"
        );

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "message-item";

    item.dataset.id =
        message.id;

    const checkboxWrap =
        document.createElement(
            "div"
        );

    checkboxWrap.className =
        "checkbox-wrap";

    const checkbox =
        document.createElement(
            "input"
        );

    checkbox.type =
        "checkbox";

    checkbox.className =
        "message-check";

    checkbox.checked =
        selectedIds.has(
            String(message.id)
        );

    checkbox.onchange =
        function(){

            const id =
                String(message.id);

            if(this.checked){

                selectedIds.add(id);

                item.classList.add(
                    "selected"
                );

            }else{

                selectedIds.delete(id);

                item.classList.remove(
                    "selected"
                );
            }

            updateButtons();
        };

    checkboxWrap.appendChild(
        checkbox
    );

    const preview =
        document.createElement(
            "div"
        );

    preview.className =
        "message-preview";

    const sender =
        message.sender_id ===
        currentUser.id
            ? t("you")
            : t("other");

    preview.innerHTML += `
        <div class="sender-line">
            ${escapeHtml(sender)}
        </div>
    `;

    if(message.deleted_for_everyone){

        preview.innerHTML += `
            <div class="deleted-text">
                ${t("deletedMessage")}
            </div>
        `;

    }else{

        const type =
            message.message_type ||
            "text";

        if(type === "text"){

            preview.innerHTML += `
                <div class="content-text">
                    ${escapeHtml(
                        message.content ||
                        ""
                    )}
                </div>
            `;

        }else if(type === "image"){

            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "media-preview";

            img.alt =
                "Image";

            loadMediaPreview(
                message.file_url
            )
            .then(url=>{

                if(url){

                    img.src =
                        url;
                }
            });

            preview.appendChild(
                img
            );

        }else if(type === "video"){

            const video =
                document.createElement(
                    "video"
                );

            video.className =
                "media-preview";

            video.controls =
                true;

            video.playsInline =
                true;

            loadMediaPreview(
                message.file_url
            )
            .then(url=>{

                if(url){

                    video.src =
                        url;
                }
            });

            preview.appendChild(
                video
            );

        }else if(type === "audio"){

            const audio =
                document.createElement(
                    "audio"
                );

            audio.className =
                "audio-preview";

            audio.controls =
                true;

            loadMediaPreview(
                message.file_url
            )
            .then(url=>{

                if(url){

                    audio.src =
                        url;
                }
            });

            preview.appendChild(
                audio
            );

        }else if(type === "file"){

            const fileBox =
                document.createElement(
                    "div"
                );

            fileBox.className =
                "file-box";

            fileBox.innerHTML = `
                <span class="file-icon">
                    📎
                </span>

                <span class="file-name">
                    ${escapeHtml(
                        message.content ||
                        t("file")
                    )}
                </span>
            `;

            preview.appendChild(
                fileBox
            );

        }else{

            preview.innerHTML += `
                <div class="content-text">
                    ${escapeHtml(
                        message.content ||
                        ""
                    )}
                </div>
            `;
        }
    }

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            message.created_at
        );

    preview.appendChild(
        time
    );

    item.appendChild(
        checkboxWrap
    );

    item.appendChild(
        preview
    );

    if(
        selectedIds.has(
            String(message.id)
        )
    ){

        item.classList.add(
            "selected"
        );
    }

    list.appendChild(
        item
    );
}

/* =========================================================
   MEDIA URL
========================================================= */

async function loadMediaPreview(path){

    if(!path){

        return null;
    }

    if(
        path.startsWith("http://") ||
        path.startsWith("https://")
    ){

        return path;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("raztara-media")
            .createSignedUrl(
                path,
                60 * 60
            );

    if(error){

        console.error(
            error
        );

        return null;
    }

    return (
        data?.signedUrl ||
        null
    );
}

/* =========================================================
   ALL MARK
========================================================= */

function markAll(){

    selectedIds.clear();

    messages.forEach(
        message =>
            selectedIds.add(
                String(message.id)
            )
    );

    renderMessages();
}

/* =========================================================
   UNMARK ALL
========================================================= */

function unmarkAll(){

    selectedIds.clear();

    renderMessages();
}

/* =========================================================
   UPDATE BUTTONS
========================================================= */

function updateButtons(){

    const count =
        selectedIds.size;

    const deleteMe =
        document.getElementById(
            "deleteMeBtn"
        );

    const deleteEveryone =
        document.getElementById(
            "deleteEveryoneBtn"
        );

    const headerDelete =
        document.getElementById(
            "headerDeleteBtn"
        );

    deleteMe.disabled =
        count === 0;

    deleteEveryone.disabled =
        count === 0;

    headerDelete.disabled =
        count === 0;
}

/* =========================================================
   DELETE FOR ME
========================================================= */

function deleteForMe(){

    if(!selectedIds.size){

        showToast(
            t("selectMessage")
        );

        return;
    }

    pendingAction =
        "delete_me";

    document.getElementById(
        "modalTitle"
    ).textContent =
        t("confirm");

    document.getElementById(
        "modalText"
    ).textContent =
        t("deleteMeConfirm");

    const button =
        document.getElementById(
            "confirmButton"
        );

    button.textContent =
        t("deleteMe");

    button.className =
        "confirm-btn";

    document.getElementById(
        "confirmModal"
    ).classList.add(
        "show"
    );
}

/* =========================================================
   DELETE FOR EVERYONE
========================================================= */

function deleteForEveryone(){

    if(!selectedIds.size){

        showToast(
            t("selectMessage")
        );

        return;
    }

    const ownIds =
        messages
            .filter(
                message =>
                    selectedIds.has(
                        String(message.id)
                    ) &&
                    message.sender_id ===
                    currentUser.id
            )
            .map(
                message =>
                    message.id
            );

    if(!ownIds.length){

        showToast(
            currentLanguage === "bn"
                ? "আপনার নিজের পাঠানো মেসেজ Mark করুন"
                : "Mark your own messages"
        );

        return;
    }

    pendingAction =
        "delete_everyone";

    document.getElementById(
        "modalTitle"
    ).textContent =
        t("confirm");

    document.getElementById(
        "modalText"
    ).textContent =
        t("deleteEveryoneConfirm");

    const button =
        document.getElementById(
            "confirmButton"
        );

    button.textContent =
        t("deleteEveryone");

    button.className =
        "confirm-danger";

    document.getElementById(
        "confirmModal"
    ).classList.add(
        "show"
    );
}

/* =========================================================
   CONFIRM ACTION
========================================================= */

async function confirmAction(){

    if(
        pendingAction ===
        "delete_me"
    ){

        await performDeleteForMe();

    }else if(
        pendingAction ===
        "delete_everyone"
    ){

        await performDeleteForEveryone();
    }

    pendingAction =
        null;
}

/* =========================================================
   DELETE FOR ME
========================================================= */

async function performDeleteForMe(){

    const ids =
        Array.from(
            selectedIds
        );

    if(!ids.length){

        closeModal();

        return;
    }

    const rows =
        ids.map(
            messageId => ({
                message_id:
                    messageId,

                user_id:
                    currentUser.id
            })
        );

    const {
        error
    } =
        await supabaseClient
            .from("message_user_deletions")
            .upsert(
                rows,
                {
                    onConflict:
                        "message_id,user_id"
                }
            );

    if(error){

        console.error(
            "Delete for me:",
            error
        );

        showToast(
            error.message ||
            t("deleteFailed")
        );

        closeModal();

        return;
    }

    ids.forEach(
        id =>
            hiddenMessageIds.add(
                String(id)
            )
    );

    messages =
        messages.filter(
            message =>
                !selectedIds.has(
                    String(message.id)
                )
        );

    selectedIds.clear();

    closeModal();

    renderMessages();

    showToast(
        t("deletedMe")
    );
}

/* =========================================================
   DELETE FOR EVERYONE
========================================================= */

async function performDeleteForEveryone(){

    const ownIds =
        messages
            .filter(
                message =>
                    selectedIds.has(
                        String(message.id)
                    ) &&
                    message.sender_id ===
                    currentUser.id
            )
            .map(
                message =>
                    message.id
            );

    if(!ownIds.length){

        closeModal();

        showToast(
            currentLanguage === "bn"
                ? "আপনার নিজের পাঠানো মেসেজ Mark করুন"
                : "Mark your own messages"
        );

        return;
    }

    const {
        error
    } =
        await supabaseClient
            .from("messages")
            .update({
                deleted_for_everyone:
                    true,

                deleted_at:
                    new Date().toISOString()
            })
            .in(
                "id",
                ownIds
            )
            .eq(
                "sender_id",
                currentUser.id
            );

    if(error){

        console.error(
            "Delete for everyone:",
            error
        );

        showToast(
            error.message ||
            t("deleteFailed")
        );

        closeModal();

        return;
    }

    messages =
        messages.map(
            message => {

                if(
                    ownIds.includes(
                        message.id
                    )
                ){

                    return {
                        ...message,
                        deleted_for_everyone:
                            true
                    };
                }

                return message;
            }
        );

    selectedIds.clear();

    closeModal();

    renderMessages();

    showToast(
        t("deletedEveryone")
    );
}

/* =========================================================
   MODAL
========================================================= */

function closeModal(event){

    if(
        event &&
        event.target !==
        document.getElementById(
            "confirmModal"
        )
    ){

        return;
    }

    document.getElementById(
        "confirmModal"
    ).classList.remove(
        "show"
    );

    pendingAction =
        null;
}

/* =========================================================
   TIME
========================================================= */

function formatTime(value){

    if(!value){

        return "";
    }

    const date =
        new Date(value);

    if(
        isNaN(
            date.getTime()
        )
    ){

        return "";
    }

    return date.toLocaleString(
        currentLanguage === "bn"
            ? "bn-BD"
            : "en-US",
        {
            day:"numeric",
            month:"short",
            year:"numeric",
            hour:"numeric",
            minute:"2-digit"
        }
    );
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove(
                "show"
            );

        },2500);
}

/* =========================================================
   BACK
========================================================= */

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            "messages.html";
    }
}

/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyLanguage(){

    document.getElementById(
        "pageTitle"
    ).textContent =
        t("title");

    document.getElementById(
        "markAllBtn"
    ).textContent =
        t("allMark");

    document.querySelector(
        ".top-bar button:nth-child(2)"
    ).textContent =
        t("unmarkAll");

    document.getElementById(
        "infoText"
    ).textContent =
        t("info");

    document.getElementById(
        "headerDeleteBtn"
    ).textContent =
        t("delete");

    document.getElementById(
        "deleteMeBtn"
    ).textContent =
        t("deleteMe");

    document.getElementById(
        "deleteEveryoneBtn"
    ).textContent =
        t("deleteEveryone");

    document.getElementById(
        "loadingText"
    ).textContent =
        t("loading");

    document.querySelector(
        "#confirmModal .cancel-btn"
    ).textContent =
        t("cancel");
}

/* =========================================================
   INIT
========================================================= */

async function init(){

    applyLanguage();

    currentUser =
        await getCurrentUser();

    if(!currentUser){

        return;
    }

    const params =
        getParams();

    conversationId =
        params.conversationId;

    if(!conversationId){

        showToast(
            t("conversationMissing")
        );

        return;
    }

    await loadHiddenMessages();

    await loadMessages();

    /*
       যদি chat.html থেকে নির্দিষ্ট message_id
       দিয়ে delete.html খোলা হয়,
       তাহলে সেই message-টি automatically Mark হবে।
    */

    if(params.messageId){

        const exists =
            messages.some(
                message =>
                    String(
                        message.id
                    ) ===
                    String(
                        params.messageId
                    )
            );

        if(exists){

            selectedIds.add(
                String(
                    params.messageId
                )
            );

            renderMessages();
        }
    }
}

/* =========================================================
   START
========================================================= */

init();

</script>
