<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RAZTARA — Tipping</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#f4f7f7;
    color:#222;
}

body{
    padding-bottom:30px;
}

/* HEADER */

.header{
    height:62px;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 8px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 7px rgba(0,0,0,.18);
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:28px;
    cursor:pointer;
}

.header-title{
    font-size:18px;
    font-weight:700;
    margin-left:6px;
}

/* PAGE */

.page{
    padding:20px 14px;
    max-width:520px;
    margin:auto;
}

/* USER */

.user-card{
    background:#fff;
    border-radius:16px;
    padding:18px;
    display:flex;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.user-avatar{
    width:62px;
    height:62px;
    border-radius:50%;
    object-fit:cover;
    background:#d9eeee;
    flex-shrink:0;
}

.user-info{
    margin-left:13px;
    min-width:0;
}

.user-name{
    font-size:18px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-username{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

/* TITLE */

.section-title{
    text-align:center;
    font-size:17px;
    font-weight:700;
    margin:20px 0 13px;
}

/* TIP AMOUNTS */

.amount-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.amount-btn{
    min-height:58px;
    border:1px solid #d9e4e1;
    background:#fff;
    border-radius:13px;
    font-size:16px;
    font-weight:700;
    color:#087f5b;
    cursor:pointer;
    transition:.15s;
}

.amount-btn:active{
    transform:scale(.97);
}

.amount-btn.selected{
    background:#087f5b;
    color:#fff;
    border-color:#087f5b;
}

/* CUSTOM */

.custom-box{
    margin-top:13px;
    background:#fff;
    border-radius:13px;
    padding:13px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.custom-label{
    display:block;
    font-size:13px;
    color:#666;
    margin-bottom:7px;
}

.custom-input{
    width:100%;
    height:46px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:0 13px;
    outline:none;
    font-size:15px;
}

.custom-input:focus{
    border-color:#087f5b;
}

/* MESSAGE */

.message-box{
    margin-top:13px;
    background:#fff;
    border-radius:13px;
    padding:13px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.message-label{
    display:block;
    font-size:13px;
    color:#666;
    margin-bottom:7px;
}

.message-input{
    width:100%;
    min-height:80px;
    resize:none;
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px;
    outline:none;
    font-size:14px;
    font-family:Arial,sans-serif;
}

.message-input:focus{
    border-color:#087f5b;
}

/* TIP BUTTON */

.tip-main-btn{
    width:100%;
    height:50px;
    margin-top:18px;
    border:0;
    border-radius:13px;
    background:#087f5b;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.tip-main-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* INFO */

.info-box{
    margin-top:18px;
    background:#eaf7f2;
    color:#35665a;
    border-radius:12px;
    padding:12px;
    font-size:12px;
    line-height:1.5;
    text-align:center;
}

/* LOADING */

.loading{
    text-align:center;
    padding:40px 10px;
    color:#777;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:10px 17px;
    border-radius:22px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <button
        class="back-btn"
        onclick="goBack()">
        ‹
    </button>

    <div
        id="pageTitle"
        class="header-title">
        💰 Tipping
    </div>

</div>


<!-- PAGE -->

<div class="page">

    <div
        id="loading"
        class="loading">
        
    </div>


    <div
        id="mainContent"
        style="display:none;">


        <!-- USER -->

        <div class="user-card">

            <img
                id="userAvatar"
                class="user-avatar"
                src="https://i.pravatar.cc/150?img=12">

            <div class="user-info">

                <div
                    id="userName"
                    class="user-name">
                    RAZTARA User
                </div>

                <div
                    id="userUsername"
                    class="user-username">
                    @user
                </div>

            </div>

        </div>


        <!-- AMOUNT -->

        <div
            id="amountTitle"
            class="section-title">
            Tip-এর পরিমাণ নির্বাচন করুন
        </div>


        <div class="amount-grid">

            <button
                class="amount-btn"
                data-amount="10"
                onclick="selectAmount(10)">
                ৳10
            </button>

            <button
                class="amount-btn"
                data-amount="20"
                onclick="selectAmount(20)">
                ৳20
            </button>

            <button
                class="amount-btn"
                data-amount="50"
                onclick="selectAmount(50)">
                ৳50
            </button>

            <button
                class="amount-btn"
                data-amount="100"
                onclick="selectAmount(100)">
                ৳100
            </button>

            <button
                class="amount-btn"
                data-amount="200"
                onclick="selectAmount(200)">
                ৳200
            </button>

            <button
                class="amount-btn"
                data-amount="500"
                onclick="selectAmount(500)">
                ৳500
            </button>

        </div>


        <!-- CUSTOM AMOUNT -->

        <div class="custom-box">

            <label
                id="customLabel"
                class="custom-label">
                অথবা নিজের পরিমাণ লিখুন
            </label>

            <input
                id="customAmount"
                class="custom-input"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
                placeholder="৳ Amount"
                oninput="customAmountChanged()">

        </div>


        <!-- MESSAGE -->

        <div class="message-box">

            <label
                id="messageLabel"
                class="message-label">
                ছোট একটি Message (ঐচ্ছিক)
            </label>

            <textarea
                id="tipMessage"
                class="message-input"
                maxlength="200"
                placeholder="আপনার Message লিখুন...">
            </textarea>

        </div>


        <!-- BUTTON -->

        <button
            id="tipMainBtn"
            class="tip-main-btn"
            onclick="sendTip()"
            disabled>
            💰 Tip পাঠান
        </button>


        <!-- INFO -->

        <div
            id="infoBox"
            class="info-box">
            এখনো কোনো টাকা পাঠানো হবে না।
            Payment system পরে যুক্ত করা হবে।
        </div>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let otherUserId = null;
let otherProfile = null;
let selectedAmount = 0;

let currentLanguage =
    localStorage.getItem("raztara_language") || "bn";


/* =========================================================
   TRANSLATIONS
========================================================= */

const translations = {

    bn:{
        title:"💰 Tipping",
        amountTitle:"Tip-এর পরিমাণ নির্বাচন করুন",
        customLabel:"অথবা নিজের পরিমাণ লিখুন",
        messageLabel:"ছোট একটি Message (ঐচ্ছিক)",
        messagePlaceholder:"আপনার Message লিখুন...",
        tipButton:"💰 Tip পাঠান",
        info:"এখনো কোনো টাকা পাঠানো হবে না। Payment system পরে যুক্ত করা হবে।",
        loading:"",
        loginRequired:"লগইন করুন",
        userNotFound:"ব্যবহারকারী পাওয়া যায়নি",
        selectAmount:"আগে Tip-এর পরিমাণ নির্বাচন করুন",
        comingSoon:"Tipping payment system শিগগিরই আসছে"
    },

    en:{
        title:"💰 Tipping",
        amountTitle:"Select Tip Amount",
        customLabel:"Or enter your own amount",
        messageLabel:"Short Message (Optional)",
        messagePlaceholder:"Write your message...",
        tipButton:"💰 Send Tip",
        info:"No money will be sent yet. Payment system will be added later.",
        loading:"",
        loginRequired:"Please login",
        userNotFound:"User not found",
        selectAmount:"Please select a tip amount first",
        comingSoon:"Tipping payment system is coming soon"
    }

};


function t(key){

    return translations[currentLanguage]?.[key]
        || translations.bn[key]
        || key;
}


/* =========================================================
   GET USER ID
========================================================= */

function getOtherUserId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("user") ||
        params.get("user_id") ||
        params.get("id")
    );
}


/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();


    if(
        error ||
        !data?.user
    ){

        showToast(
            t("loginRequired")
        );

        setTimeout(()=>{

            window.location.href =
                "index.html";

        },1000);

        return null;
    }


    return data.user;
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

    if(!otherUserId){

        showToast(
            t("userNotFound")
        );

        return false;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url
        `)
        .eq(
            "id",
            otherUserId
        )
        .maybeSingle();


    if(error){

        console.error(error);

        showToast(
            error.message
        );

        return false;
    }


    if(!data){

        showToast(
            t("userNotFound")
        );

        return false;
    }


    otherProfile =
        data;


    document.getElementById(
        "userName"
    ).textContent =
        data.full_name ||
        data.username ||
        "RAZTARA User";


    document.getElementById(
        "userUsername"
    ).textContent =
        data.username
            ? "@" + data.username
            : "";


    if(data.avatar_url){

        document.getElementById(
            "userAvatar"
        ).src =
            data.avatar_url;
    }


    return true;
}


/* =========================================================
   SELECT AMOUNT
========================================================= */

function selectAmount(amount){

    selectedAmount =
        Number(amount) || 0;


    document
        .querySelectorAll(
            ".amount-btn"
        )
        .forEach(button=>{

            button.classList.toggle(
                "selected",
                Number(
                    button.dataset.amount
                ) === selectedAmount
            );

        });


    document.getElementById(
        "customAmount"
    ).value = "";


    updateTipButton();
}


/* =========================================================
   CUSTOM AMOUNT
========================================================= */

function customAmountChanged(){

    const input =
        document.getElementById(
            "customAmount"
        );


    const amount =
        Number(input.value);


    if(
        amount &&
        amount > 0
    ){

        selectedAmount =
            amount;

    }else{

        selectedAmount =
            0;
    }


    document
        .querySelectorAll(
            ".amount-btn"
        )
        .forEach(button=>{

            button.classList.remove(
                "selected"
            );

        });


    updateTipButton();
}


/* =========================================================
   UPDATE BUTTON
========================================================= */

function updateTipButton(){

    const button =
        document.getElementById(
            "tipMainBtn"
        );


    button.disabled =
        !(
            selectedAmount > 0
        );
}


/* =========================================================
   SEND TIP
========================================================= */

function sendTip(){

    if(
        !currentUser ||
        !otherUserId
    ){

        return;
    }


    if(
        !selectedAmount ||
        selectedAmount <= 0
    ){

        showToast(
            t("selectAmount")
        );

        return;
    }


    /*
       PAYMENT SYSTEM WILL BE
       CONNECTED HERE LATER.
    */

    showToast(
        t("comingSoon")
    );
}


/* =========================================================
   LANGUAGE
========================================================= */

function applyLanguage(){

    document.getElementById(
        "pageTitle"
    ).textContent =
        t("title");


    document.getElementById(
        "amountTitle"
    ).textContent =
        t("amountTitle");


    document.getElementById(
        "customLabel"
    ).textContent =
        t("customLabel");


    document.getElementById(
        "messageLabel"
    ).textContent =
        t("messageLabel");


    document.getElementById(
        "tipMessage"
    ).placeholder =
        t("messagePlaceholder");


    document.getElementById(
        "tipMainBtn"
    ).textContent =
        t("tipButton");


    document.getElementById(
        "infoBox"
    ).textContent =
        t("info");


    document.getElementById(
        "loading"
    ).textContent =
        t("loading");
}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            "messages.html";
    }
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(()=>{

            toast.classList.remove(
                "show"
            );

        },2500);
}


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

    applyLanguage();


    currentUser =
        await getCurrentUser();


    if(!currentUser){

        return;
    }


    otherUserId =
        getOtherUserId();


    if(!otherUserId){

        showToast(
            t("userNotFound")
        );

        return;
    }


    /*
       USER CANNOT TIP HIMSELF
    */

    if(
        currentUser.id ===
        otherUserId
    ){

        showToast(
            currentLanguage === "bn"
                ? "নিজেকে Tip পাঠানো যাবে না"
                : "You cannot tip yourself"
        );

        return;
    }


    const loaded =
        await loadProfile();


    if(!loaded){

        return;
    }


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "mainContent"
    ).style.display =
        "block";
}


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
