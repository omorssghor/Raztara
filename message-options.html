<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RAZTARA — Message Options</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#f4f7f7;
    color:#222;
}

body{
    display:flex;
    flex-direction:column;
}

/* HEADER */

.header{
    height:62px;
    min-height:62px;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 8px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
    box-shadow:0 2px 7px rgba(0,0,0,.18);
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:27px;
    cursor:pointer;
}

.header-title{
    flex:1;
    font-size:18px;
    font-weight:700;
    margin-left:5px;
}

/* CONTENT */

.content{
    position:fixed;
    top:62px;
    bottom:0;
    left:0;
    right:0;
    overflow-y:auto;
    padding:15px;
}

/* MESSAGE PREVIEW */

.preview{
    background:#fff;
    border-radius:14px;
    padding:15px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.preview-title{
    font-size:13px;
    color:#777;
    margin-bottom:10px;
}

.message-box{
    background:#f0f3f2;
    border-radius:12px;
    padding:12px;
    word-break:break-word;
    font-size:15px;
    line-height:1.45;
}

.message-box img,
.message-box video{
    max-width:100%;
    max-height:350px;
    border-radius:10px;
    display:block;
}

.message-box audio{
    width:100%;
    max-width:350px;
}

/* FILE */

.file-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.file-icon{
    font-size:30px;
}

.file-name{
    font-size:14px;
    word-break:break-word;
}

/* OPTIONS */

.options{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.option-btn{
    width:100%;
    border:0;
    background:#fff;
    padding:17px 15px;
    text-align:left;
    font-size:16px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.option-btn:last-child{
    border-bottom:0;
}

.option-btn:active{
    background:#f1f5f4;
}

.option-btn.delete{
    color:#d32f2f;
}

.option-btn.cancel{
    color:#666;
}

/* LOADING */

.loading{
    text-align:center;
    color:#777;
    padding:40px 15px;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#777;
    padding:45px 15px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:10px 17px;
    border-radius:22px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="header">

    <button
        class="back-btn"
        onclick="goBack()">
        ‹
    </button>

    <div class="header-title">
        <span id="pageTitle">
            Message Options
        </span>
    </div>

</div>

<div class="content">

    <div id="loading"
         class="loading">
    </div>

    <div id="mainContent"
         style="display:none;">

        <div class="preview">

            <div
                id="previewTitle"
                class="preview-title">
                Message
            </div>

            <div
                id="messageBox"
                class="message-box">
            </div>

        </div>

        <div class="options">

            <button
                class="option-btn"
                onclick="openShare()">
                📤 <span id="shareText">
                    Share
                </span>
            </button>

            <button
                class="option-btn delete"
                onclick="openDelete()">
                🗑️ <span id="deleteText">
                    Delete
                </span>
            </button>

            <button
                class="option-btn cancel"
                onclick="goBack()">
                ✕ <span id="cancelText">
                    Cancel
                </span>
            </button>

        </div>

    </div>

</div>

<div id="toast"
     class="toast">
</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let messageData = null;

let currentLanguage =
    localStorage.getItem(
        "raztara_language"
    ) || "bn";

/* =========================================================
   LANGUAGE
========================================================= */

const translations = {

    bn:{
        title:"Message Options",
        message:"মেসেজ",
        share:"Share",
        delete:"Delete",
        cancel:"Cancel",
        loading:"",
        loginRequired:"লগইন করুন",
        messageNotFound:"মেসেজ পাওয়া যায়নি",
        deleted:"এই মেসেজটি Delete করা হয়েছে",
        file:"ফাইল"
    },

    en:{
        title:"Message Options",
        message:"Message",
        share:"Share",
        delete:"Delete",
        cancel:"Cancel",
        loading:"",
        loginRequired:"Please login",
        messageNotFound:"Message not found",
        deleted:"This message was deleted",
        file:"File"
    }

};

function t(key){

    return (
        translations[currentLanguage]?.[key] ||
        translations.bn[key] ||
        key
    );
}

/* =========================================================
   PARAMS
========================================================= */

function getParams(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return {

        messageId:
            params.get("message_id") ||
            params.get("message") ||
            params.get("id"),

        conversationId:
            params.get("conversation_id") ||
            params.get("conversation")

    };
}

/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getUser();

    if(
        error ||
        !data?.user
    ){

        showToast(
            t("loginRequired")
        );

        setTimeout(()=>{

            window.location.href =
                "index.html";

        },900);

        return null;
    }

    return data.user;
}

/* =========================================================
   LOAD MESSAGE
========================================================= */

async function loadMessage(){

    const params =
        getParams();

    if(!params.messageId){

        showEmpty(
            t("messageNotFound")
        );

        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("messages")
            .select(`
                id,
                conversation_id,
                sender_id,
                content,
                message_type,
                file_url,
                created_at,
                deleted_for_everyone
            `)
            .eq(
                "id",
                params.messageId
            )
            .maybeSingle();

    if(error){

        console.error(error);

        showEmpty(
            error.message
        );

        return;
    }

    if(!data){

        showEmpty(
            t("messageNotFound")
        );

        return;
    }

    /*
       নিশ্চিত করছি message-টি এই user-এর
       conversation-এরই।
    */

    const {
        data:member,
        error:memberError
    } =
        await supabaseClient
            .from("conversation_members")
            .select("conversation_id")
            .eq(
                "conversation_id",
                data.conversation_id
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .maybeSingle();

    if(
        memberError ||
        !member
    ){

        showEmpty(
            t("messageNotFound")
        );

        return;
    }

    messageData =
        data;

    renderMessage();
}

/* =========================================================
   RENDER MESSAGE
========================================================= */

async function renderMessage(){

    const box =
        document.getElementById(
            "messageBox"
        );

    box.innerHTML = "";

    if(
        messageData.deleted_for_everyone
    ){

        const deleted =
            document.createElement(
                "i"
            );

        deleted.textContent =
            t("deleted");

        box.appendChild(
            deleted
        );

    }else{

        const type =
            messageData.message_type ||
            "text";

        if(type === "text"){

            box.textContent =
                messageData.content ||
                "";

        }else if(type === "image"){

            const img =
                document.createElement(
                    "img"
                );

            img.alt =
                "Image";

            const url =
                await getMediaUrl(
                    messageData.file_url
                );

            if(url){

                img.src =
                    url;

                box.appendChild(
                    img
                );

            }else{

                box.textContent =
                    t("messageNotFound");
            }

        }else if(type === "video"){

            const video =
                document.createElement(
                    "video"
                );

            video.controls =
                true;

            video.playsInline =
                true;

            const url =
                await getMediaUrl(
                    messageData.file_url
                );

            if(url){

                video.src =
                    url;

                box.appendChild(
                    video
                );

            }else{

                box.textContent =
                    t("messageNotFound");
            }

        }else if(type === "audio"){

            const audio =
                document.createElement(
                    "audio"
                );

            audio.controls =
                true;

            const url =
                await getMediaUrl(
                    messageData.file_url
                );

            if(url){

                audio.src =
                    url;

                box.appendChild(
                    audio
                );

            }else{

                box.textContent =
                    t("messageNotFound");
            }

        }else if(type === "file"){

            const fileBox =
                document.createElement(
                    "div"
                );

            fileBox.className =
                "file-box";

            fileBox.innerHTML = `
                <span class="file-icon">
                    📎
                </span>

                <span class="file-name">
                    ${escapeHtml(
                        messageData.content ||
                        t("file")
                    )}
                </span>
            `;

            box.appendChild(
                fileBox
            );

        }else{

            box.textContent =
                messageData.content ||
                "";
        }
    }

    document.getElementById(
        "loading"
    ).style.display =
        "none";

    document.getElementById(
        "mainContent"
    ).style.display =
        "block";
}

/* =========================================================
   MEDIA URL
========================================================= */

async function getMediaUrl(path){

    if(!path){

        return null;
    }

    if(
        path.startsWith("http://") ||
        path.startsWith("https://")
    ){

        return path;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("raztara-media")
            .createSignedUrl(
                path,
                60 * 60
            );

    if(error){

        console.error(error);

        return null;
    }

    return (
        data?.signedUrl ||
        null
    );
}

/* =========================================================
   SHARE
========================================================= */

function openShare(){

    if(!messageData){

        return;
    }

    window.location.href =
        "share.html?conversation_id=" +
        encodeURIComponent(
            messageData.conversation_id
        ) +
        "&message_id=" +
        encodeURIComponent(
            messageData.id
        );
}

/* =========================================================
   DELETE
========================================================= */

function openDelete(){

    if(!messageData){

        return;
    }

    window.location.href =
        "delete.html?conversation_id=" +
        encodeURIComponent(
            messageData.conversation_id
        ) +
        "&message_id=" +
        encodeURIComponent(
            messageData.id
        );
}

/* =========================================================
   EMPTY
========================================================= */

function showEmpty(message){

    document.getElementById(
        "loading"
    ).style.display =
        "none";

    document.getElementById(
        "mainContent"
    ).style.display =
        "block";

    document.getElementById(
        "messageBox"
    ).textContent =
        message;

    document.querySelector(
        ".options"
    ).style.display =
        "none";
}

/* =========================================================
   BACK
========================================================= */

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            "messages.html";
    }
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove(
                "show"
            );

        },2500);
}

/* =========================================================
   LANGUAGE
========================================================= */

function applyLanguage(){

    document.getElementById(
        "pageTitle"
    ).textContent =
        t("title");

    document.getElementById(
        "previewTitle"
    ).textContent =
        t("message");

    document.getElementById(
        "shareText"
    ).textContent =
        t("share");

    document.getElementById(
        "deleteText"
    ).textContent =
        t("delete");

    document.getElementById(
        "cancelText"
    ).textContent =
        t("cancel");

    document.getElementById(
        "loading"
    ).textContent =
        t("loading");
}

/* =========================================================
   INIT
========================================================= */

async function init(){

    applyLanguage();

    currentUser =
        await getCurrentUser();

    if(!currentUser){

        return;
    }

    await loadMessage();
}

/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
