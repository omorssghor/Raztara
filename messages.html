<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#075e54">

<title>RAZTARA — Messages</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#efeae2;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

/* =========================
   APP
========================= */

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:62px;
    min-height:62px;
    background:#075e54;
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:10px;
    box-shadow:0 1px 5px rgba(0,0,0,.25);
    z-index:20;
}

.back-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:27px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back-btn:active{
    background:rgba(255,255,255,.12);
}

.target-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:#d9eeee;
    flex-shrink:0;
}

.target-info{
    min-width:0;
    flex:1;
}

.target-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.target-status{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

/* =========================
   MESSAGE AREA
========================= */

.messages-area{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:12px 8px 10px;
    scroll-behavior:smooth;

    background-color:#efeae2;

    background-image:
        radial-gradient(
            rgba(255,255,255,.25) 1px,
            transparent 1px
        );

    background-size:18px 18px;
}

.messages-area::-webkit-scrollbar{
    width:4px;
}

.messages-area::-webkit-scrollbar-thumb{
    background:rgba(0,0,0,.18);
    border-radius:10px;
}

/* =========================
   DATE
========================= */

.date-separator{
    text-align:center;
    margin:9px 0;
}

.date-separator span{
    display:inline-block;
    padding:6px 12px;
    background:#d9e8df;
    color:#46504b;
    border-radius:9px;
    font-size:11px;
}

/* =========================
   MESSAGE ROW
========================= */

.message-row{
    display:flex;
    width:100%;
    margin:2px 0;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.theirs{
    justify-content:flex-start;
}

.message-bubble{
    position:relative;
    max-width:min(82%,430px);
    padding:8px 9px 5px;
    border-radius:9px;
    box-shadow:0 1px 1px rgba(0,0,0,.10);
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.mine .message-bubble{
    background:#d9fdd3;
    border-top-right-radius:3px;
}

.theirs .message-bubble{
    background:#fff;
    border-top-left-radius:3px;
}

.message-content{
    font-size:15px;
    line-height:1.42;
    white-space:pre-wrap;
}

.deleted-message{
    color:#777;
    font-style:italic;
}

.message-meta{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:4px;
    margin-top:3px;
    min-height:13px;
}

.message-time{
    font-size:10px;
    color:#68716d;
}

.read-status{
    font-size:13px;
    line-height:1;
}

.read-status.read{
    color:#1685d7;
}

.read-status.unread{
    color:#68716d;
}

/* =========================
   MEDIA
========================= */

.message-image{
    display:block;
    width:100%;
    max-width:300px;
    max-height:330px;
    object-fit:cover;
    border-radius:7px;
    cursor:pointer;
}

.message-video{
    display:block;
    width:100%;
    max-width:320px;
    max-height:350px;
    border-radius:7px;
    background:#000;
}

.message-audio{
    width:min(290px,100%);
    display:block;
}

.file-link{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:#075e54;
    padding:5px 2px;
    font-weight:600;
}

.file-icon{
    width:40px;
    height:40px;
    border-radius:9px;
    background:#e3f0ed;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    flex-shrink:0;
}

.file-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* =========================
   COMPOSER
========================= */

.composer{
    min-height:61px;
    padding:7px;
    background:#f0f2f5;
    display:flex;
    align-items:flex-end;
    gap:6px;
    border-top:1px solid #d6d6d6;
    z-index:15;
}

.tool-btn{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:50%;
    background:transparent;
    color:#54656f;
    font-size:21px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tool-btn:active{
    background:#ddd;
}

.text-wrap{
    flex:1;
    min-width:0;
    background:#fff;
    border-radius:22px;
    display:flex;
    align-items:center;
    padding:0 5px 0 13px;
    min-height:43px;
}

#messageInput{
    width:100%;
    border:0;
    outline:none;
    resize:none;
    background:transparent;
    font-size:15px;
    line-height:20px;
    max-height:100px;
    padding:10px 0;
}

.send-btn{
    width:45px;
    height:45px;
    flex:0 0 45px;
    border-radius:50%;
    background:#075e54;
    color:#fff;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.send-btn:active{
    transform:scale(.95);
}

.recording{
    background:#c62828 !important;
}

/* =========================
   INPUT
========================= */

#fileInput{
    display:none;
}

/* =========================
   MENU
========================= */

.message-menu{
    position:fixed;
    display:none;
    z-index:1000;
    min-width:190px;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 35px rgba(0,0,0,.28);
}

.message-menu button{
    width:100%;
    min-height:46px;
    padding:10px 15px;
    background:#fff;
    color:#222;
    text-align:left;
    font-size:14px;
}

.message-menu button:active{
    background:#f0f0f0;
}

.menu-danger{
    color:#c62828 !important;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.92);
}

.overlay img{
    max-width:96%;
    max-height:92%;
    object-fit:contain;
}

.overlay-close{
    position:absolute;
    top:15px;
    right:15px;
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:25px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:78px;
    transform:translateX(-50%);
    max-width:90%;
    padding:10px 15px;
    border-radius:10px;
    background:#222;
    color:#fff;
    font-size:13px;
    z-index:3000;
    display:none;
    text-align:center;
}

.toast.error{
    background:#c62828;
}

.toast.success{
    background:#075e54;
}

/* =========================
   LOADING
========================= */

.loading{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    background:#efeae2;
    color:#075e54;
}

.loader{
    width:40px;
    height:40px;
    border:4px solid #cce2df;
    border-top-color:#075e54;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:500px){

    .message-bubble{
        max-width:86%;
    }

    .message-image{
        max-width:250px;
    }
}

</style>

<script>
"use strict";

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const STORAGE_BUCKET = "chat-files";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================================
   ELEMENTS
========================================================= */

const loadingScreen =
    document.getElementById("loadingScreen");

const messagesArea =
    document.getElementById("messagesArea");

const targetAvatar =
    document.getElementById("targetAvatar");

const targetName =
    document.getElementById("targetName");

const targetStatus =
    document.getElementById("targetStatus");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const emojiBtn =
    document.getElementById("emojiBtn");

const fileBtn =
    document.getElementById("fileBtn");

const fileInput =
    document.getElementById("fileInput");

const voiceBtn =
    document.getElementById("voiceBtn");

const backBtn =
    document.getElementById("backBtn");

const messageMenu =
    document.getElementById("messageMenu");

const imageOverlay =
    document.getElementById("imageOverlay");

const overlayImage =
    document.getElementById("overlayImage");

const closeOverlay =
    document.getElementById("closeOverlay");

const toast =
    document.getElementById("toast");

/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let targetUserId = null;
let targetProfile = null;

let conversationId = null;

let selectedMessage = null;

let messageCache = [];

let realtimeChannel = null;

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

let longPressTimer = null;

/* =========================================================
   URL USER
========================================================= */

function getTargetUserId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return String(
        params.get("user") ||
        params.get("id") ||
        ""
    ).trim();
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(
    message,
    type = "success"
){

    clearTimeout(toastTimer);

    toast.textContent = message;

    toast.className =
        "toast " + type;

    toast.style.display = "block";

    toastTimer = setTimeout(()=>{
        toast.style.display = "none";
    },2600);
}

function showError(message){
    showToast(message,"error");
}

function showSuccess(message){
    showToast(message,"success");
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;
}

/* =========================================================
   DATE / TIME
========================================================= */

function formatTime(dateString){

    const date =
        new Date(dateString);

    return date.toLocaleTimeString(
        "bn-BD",
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );
}

function dateKey(dateString){

    const date =
        new Date(dateString);

    return [
        date.getFullYear(),
        String(date.getMonth()+1).padStart(2,"0"),
        String(date.getDate()).padStart(2,"0")
    ].join("-");
}

function formatDateLabel(dateString){

    const date =
        new Date(dateString);

    const today =
        new Date();

    const yesterday =
        new Date();

    yesterday.setDate(
        yesterday.getDate()-1
    );

    if(
        date.toDateString() ===
        today.toDateString()
    ){
        return "আজ";
    }

    if(
        date.toDateString() ===
        yesterday.toDateString()
    ){
        return "গতকাল";
    }

    return date.toLocaleDateString(
        "bn-BD",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}

/* =========================================================
   PROFILE
========================================================= */

async function loadTargetProfile(){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url,
            online_visibility,
            last_seen_at
        `)
        .eq("id",targetUserId)
        .maybeSingle();

    if(error){
        throw error;
    }

    if(!data){
        throw new Error(
            "এই user-এর profile পাওয়া যায়নি।"
        );
    }

    targetProfile = data;

    targetName.textContent =
        data.full_name ||
        data.username ||
        "RAZTARA User";

    targetAvatar.src =
        data.avatar_url ||
        createAvatar(
            data.full_name ||
            data.username ||
            "R"
        );

    updateTargetStatus();
}

function createAvatar(name){

    const letter =
        String(name || "R")
        .trim()
        .charAt(0)
        .toUpperCase();

    const svg =
        `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="120"
             height="120">
            <rect width="120"
                  height="120"
                  rx="60"
                  fill="#075e54"/>
            <text x="60"
                  y="72"
                  text-anchor="middle"
                  font-size="52"
                  fill="white"
                  font-family="Arial">
                ${letter}
            </text>
        </svg>
        `;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
}

function updateTargetStatus(){

    if(!targetProfile){
        targetStatus.textContent = "";
        return;
    }

    if(
        targetProfile.online_visibility ===
        "nobody"
    ){
        targetStatus.textContent =
            "শেষ দেখা লুকানো";
        return;
    }

    if(targetProfile.last_seen_at){

        const last =
            new Date(
                targetProfile.last_seen_at
            );

        const diff =
            Date.now() - last.getTime();

        if(diff < 2 * 60 * 1000){

            targetStatus.textContent =
                "অনলাইন";

            return;
        }

        targetStatus.textContent =
            "শেষ দেখা " +
            formatTime(
                targetProfile.last_seen_at
            );

        return;
    }

    targetStatus.textContent =
        "অনলাইন";
}

/* =========================================================
   CONVERSATION
========================================================= */

function getConversationStorageKey(){
    if(!currentUser || !targetUserId){
        return "";
    }

    const ids = [
        String(currentUser.id),
        String(targetUserId)
    ].sort();

    return "raztara_conversation_" +
        ids[0] +
        "_" +
        ids[1];
}

function saveConversationId(id){
    if(!id){
        return;
    }

    const key = getConversationStorageKey();

    if(key){
        localStorage.setItem(key,String(id));
    }
}

function getSavedConversationId(){
    const key = getConversationStorageKey();

    if(!key){
        return "";
    }

    return String(
        localStorage.getItem(key) || ""
    ).trim();
}

async function getExistingConversation(){

    const savedId = getSavedConversationId();

    if(savedId){

        const {
            data:savedMember,
            error:savedError
        } = await supabaseClient
            .from("conversation_members")
            .select("conversation_id")
            .eq("conversation_id",savedId)
            .eq("user_id",currentUser.id)
            .maybeSingle();

        if(!savedError && savedMember){
            return savedId;
        }
    }

    const {
        data: memberships,
        error
    } =
        await supabaseClient
        .from("conversation_members")
        .select("conversation_id,user_id")
        .in(
            "user_id",
            [
                currentUser.id,
                targetUserId
            ]
        );

    if(error){
        throw error;
    }

    if(!memberships?.length){
        return null;
    }

    const grouped = new Map();

    for(const row of memberships){

        if(!grouped.has(row.conversation_id)){
            grouped.set(
                row.conversation_id,
                new Set()
            );
        }

        grouped
        .get(row.conversation_id)
        .add(row.user_id);
    }

    const candidateIds = [];

    for(
        const [id,members]
        of grouped.entries()
    ){

        if(
            members.has(currentUser.id) &&
            members.has(targetUserId) &&
            members.size === 2
        ){
            candidateIds.push(id);
        }
    }

    if(!candidateIds.length){
        return null;
    }

    /*
     * Duplicate conversation থাকলে সবচেয়ে বেশি message
     * থাকা conversation-টি পুরোনো আসল chat হিসেবে নেব।
     * এতে নতুন খালি conversation খুলে পুরোনো message হারাবে না।
     */
    const {
        data:rows,
        error:messageError
    } =
        await supabaseClient
        .from("messages")
        .select("conversation_id,created_at")
        .in(
            "conversation_id",
            candidateIds
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );

    if(!messageError && rows?.length){

        const stats = new Map();

        for(const row of rows){

            const current =
                stats.get(row.conversation_id) ||
                {
                    count:0,
                    latest:0
                };

            current.count += 1;

            const time =
                new Date(row.created_at).getTime();

            if(time > current.latest){
                current.latest = time;
            }

            stats.set(
                row.conversation_id,
                current
            );
        }

        candidateIds.sort(
            (a,b)=>{

                const A =
                    stats.get(a) ||
                    {count:0,latest:0};

                const B =
                    stats.get(b) ||
                    {count:0,latest:0};

                return (
                    B.count - A.count ||
                    B.latest - A.latest
                );
            }
        );
    }

    return candidateIds[0];
}

async function createConversation(){

    const {
        data:conversation,
        error
    } =
        await supabaseClient
        .from("conversations")
        .insert({
            is_group:false,
            created_by:currentUser.id
        })
        .select("id")
        .single();

    if(error){
        throw error;
    }

    const {
        error:memberError
    } =
        await supabaseClient
        .from("conversation_members")
        .insert([
            {
                conversation_id:conversation.id,
                user_id:currentUser.id
            },
            {
                conversation_id:conversation.id,
                user_id:targetUserId
            }
        ]);

    if(memberError){

        await supabaseClient
        .from("conversations")
        .delete()
        .eq("id",conversation.id);

        throw memberError;
    }

    return conversation.id;
}

async function getOrCreateConversation(){

    const existing =
        await getExistingConversation();

    if(existing){
        return existing;
    }

    return await createConversation();
}

/* =========================================================
   HIDDEN MESSAGE IDS
========================================================= */

async function getHiddenMessageIds(){

    const {
        data,
        error
    } =
        await supabaseClient
        .from("message_hidden")
        .select("message_id")
        .eq("user_id",currentUser.id);

    if(error){
        throw error;
    }

    return new Set(
        (data || [])
        .map(row=>row.message_id)
    );
}

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    const hiddenIds =
        await getHiddenMessageIds();

    const {
        data,
        error
    } =
        await supabaseClient
        .from("messages")
        .select(`
            id,
            conversation_id,
            sender_id,
            content,
            message_type,
            file_url,
            created_at,
            is_read,
            deleted_for_everyone,
            deleted_at
        `)
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );

    if(error){
        throw error;
    }

    messageCache =
        (data || [])
        .filter(
            message =>
                !hiddenIds.has(message.id)
        );

    renderMessages();
}

/* =========================================================
   RENDER ALL
========================================================= */

function renderMessages(){

    messagesArea.innerHTML = "";

    let lastDate = "";

    for(const message of messageCache){

        const currentDate =
            dateKey(message.created_at);

        if(currentDate !== lastDate){

            addDateSeparator(
                message.created_at
            );

            lastDate = currentDate;
        }

        appendMessageElement(
            message
        );
    }

    scrollToBottom(false);
}

function addDateSeparator(dateString){

    const div =
        document.createElement("div");

    div.className =
        "date-separator";

    const span =
        document.createElement("span");

    span.textContent =
        formatDateLabel(dateString);

    div.appendChild(span);

    messagesArea.appendChild(div);
}

/* =========================================================
   MESSAGE ELEMENT
========================================================= */

function appendMessageElement(
    message,
    scroll = false
){

    const mine =
        message.sender_id ===
        currentUser.id;

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (mine ? "mine" : "theirs");

    row.dataset.messageId =
        message.id;

    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";

    renderMessageContent(
        bubble,
        message
    );

    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";

    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        formatTime(message.created_at);

    meta.appendChild(time);

    if(mine){

        const status =
            document.createElement("span");

        status.className =
            "read-status " +
            (
                message.is_read
                ? "read"
                : "unread"
            );

        status.textContent =
            message.is_read
            ? "✓✓"
            : "✓";

        meta.appendChild(status);
    }

    bubble.appendChild(meta);

    row.appendChild(bubble);

    attachMessageActions(
        row,
        message
    );

    messagesArea.appendChild(row);

    if(scroll){
        scrollToBottom(true);
    }
}

/* =========================================================
   MESSAGE CONTENT
========================================================= */

function renderMessageContent(
    bubble,
    message
){

    if(message.deleted_for_everyone){

        const div =
            document.createElement("div");

        div.className =
            "message-content deleted-message";

        div.textContent =
            "এই মেসেজটি মুছে ফেলা হয়েছে";

        bubble.appendChild(div);

        return;
    }

    const type =
        String(
            message.message_type ||
            "text"
        );

    if(
        type === "image" &&
        message.file_url
    ){

        const img =
            document.createElement("img");

        img.className =
            "message-image";

        img.src =
            message.file_url;

        img.alt =
            "Image";

        img.loading =
            "lazy";

        img.addEventListener(
            "click",
            ()=>{
                openImage(
                    message.file_url
                );
            }
        );

        bubble.appendChild(img);

        if(message.content){

            const text =
                document.createElement("div");

            text.className =
                "message-content";

            text.style.marginTop =
                "5px";

            text.textContent =
                message.content;

            bubble.appendChild(text);
        }

        return;
    }

    if(
        type === "video" &&
        message.file_url
    ){

        const video =
            document.createElement("video");

        video.className =
            "message-video";

        video.src =
            message.file_url;

        video.controls = true;
        video.playsInline = true;

        bubble.appendChild(video);

        return;
    }

    if(
        type === "audio" &&
        message.file_url
    ){

        const audio =
            document.createElement("audio");

        audio.className =
            "message-audio";

        audio.src =
            message.file_url;

        audio.controls = true;
        audio.preload = "metadata";

        bubble.appendChild(audio);

        return;
    }

    if(
        type === "file" &&
        message.file_url
    ){

        const link =
            document.createElement("a");

        link.className =
            "file-link";

        link.href =
            message.file_url;

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        const icon =
            document.createElement("div");

        icon.className =
            "file-icon";

        icon.textContent =
            "📄";

        const name =
            document.createElement("div");

        name.className =
            "file-name";

        name.textContent =
            message.content ||
            "ফাইল খুলুন";

        link.appendChild(icon);
        link.appendChild(name);

        bubble.appendChild(link);

        return;
    }

    const text =
        document.createElement("div");

    text.className =
        "message-content";

    text.textContent =
        message.content ||
        "";

    bubble.appendChild(text);
}

/* =========================================================
   MESSAGE ACTIONS
========================================================= */

function attachMessageActions(
    element,
    message
){

    element.addEventListener(
        "contextmenu",
        event=>{
            event.preventDefault();

            openMessageMenu(
                message,
                event.clientX,
                event.clientY
            );
        }
    );

    element.addEventListener(
        "touchstart",
        event=>{

            if(event.touches.length !== 1){
                return;
            }

            const touch =
                event.touches[0];

            longPressTimer =
                setTimeout(()=>{

                    openMessageMenu(
                        message,
                        touch.clientX,
                        touch.clientY
                    );

                },600);
        },
        {
            passive:true
        }
    );

    element.addEventListener(
        "touchend",
        ()=>{
            clearTimeout(
                longPressTimer
            );
        }
    );

    element.addEventListener(
        "touchmove",
        ()=>{
            clearTimeout(
                longPressTimer
            );
        }
    );
}

/* =========================================================
   MESSAGE MENU
========================================================= */

function openMessageMenu(
    message,
    x,
    y
){

    selectedMessage =
        message;

    messageMenu.style.display =
        "block";

    const rect =
        messageMenu.getBoundingClientRect();

    let left = x;
    let top = y;

    if(
        left + rect.width >
        window.innerWidth - 8
    ){
        left =
            window.innerWidth -
            rect.width -
            8;
    }

    if(
        top + rect.height >
        window.innerHeight - 8
    ){
        top =
            window.innerHeight -
            rect.height -
            8;
    }

    messageMenu.style.left =
        Math.max(8,left) + "px";

    messageMenu.style.top =
        Math.max(8,top) + "px";

    document.body.addEventListener(
        "click",
        closeMenuOnOutside,
        {
            once:true
        }
    );
}

function closeMenuOnOutside(event){

    if(
        !messageMenu.contains(
            event.target
        )
    ){
        closeMessageMenu();
    }
}

function closeMessageMenu(){

    messageMenu.style.display =
        "none";

    selectedMessage =
        null;
}

/* =========================================================
   SHARE
========================================================= */

async function shareMessage(){

    if(!selectedMessage){
        return;
    }

    const message =
        selectedMessage;

    closeMessageMenu();

    const fileUrl =
        String(
            message.file_url ||
            ""
        ).trim();

    const messageText =
        String(
            message.content ||
            ""
        ).trim();

    /*
      গুরুত্বপূর্ণ:
      File/image share করার সময় URL-টি
      সরাসরি url হিসেবে পাঠানো হচ্ছে।
      তাই recipient সরাসরি public chat-files
      URL পাবে।
    */

    if(fileUrl){

        const shareData = {
            title:
                messageText ||
                "RAZTARA",
            text:
                messageText ||
                "RAZTARA file",
            url:
                fileUrl
        };

        try{

            if(
                navigator.share
            ){

                await navigator.share(
                    shareData
                );

                return;
            }

        }catch(error){

            if(
                error &&
                error.name ===
                "AbortError"
            ){
                return;
            }
        }

        try{

            await navigator.clipboard.writeText(
                fileUrl
            );

            showSuccess(
                "ফাইলের সরাসরি link copy হয়েছে।"
            );

        }catch(error){

            showError(
                "File share করা যায়নি।"
            );
        }

        return;
    }

    const shareText =
        messageText ||
        "RAZTARA message";

    try{

        if(
            navigator.share
        ){

            await navigator.share({
                title:"RAZTARA",
                text:shareText
            });

            return;
        }

    }catch(error){

        if(
            error &&
            error.name ===
            "AbortError"
        ){
            return;
        }
    }

    try{

        await navigator.clipboard.writeText(
            shareText
        );

        showSuccess(
            "Message copy হয়েছে।"
        );

    }catch(error){

        showError(
            "Share করা যায়নি।"
        );
    }
}

async function deleteOnlyMe(){

    if(!selectedMessage){
        return;
    }

    const message =
        selectedMessage;

    closeMessageMenu();

    const {
        error
    } =
        await supabaseClient
        .from("message_hidden")
        .upsert(
            {
                message_id:
                    message.id,
                user_id:
                    currentUser.id
            },
            {
                onConflict:
                    "message_id,user_id"
            }
        );

    if(error){

        showError(
            "Message delete করা যায়নি: " +
            error.message
        );

        return;
    }

    messageCache =
        messageCache.filter(
            item =>
                item.id !== message.id
        );

    renderMessages();
}

/* =========================================================
   DELETE EVERYONE
========================================================= */

async function deleteForEveryone(){

    if(!selectedMessage){
        return;
    }

    const message =
        selectedMessage;

    closeMessageMenu();

    if(
        message.sender_id !==
        currentUser.id
    ){

        showError(
            "শুধু নিজের পাঠানো message-এর জন্য এই option ব্যবহার করা যাবে।"
        );

        return;
    }

    const {
        error
    } =
        await supabaseClient
        .from("messages")
        .update({
            content:null,
            file_url:null,
            deleted_for_everyone:true,
            deleted_at:
                new Date().toISOString()
        })
        .eq(
            "id",
            message.id
        )
        .eq(
            "sender_id",
            currentUser.id
        );

    if(error){

        showError(
            "Message delete করা যায়নি: " +
            error.message
        );

        return;
    }

    const local =
        messageCache.find(
            item =>
                item.id === message.id
        );

    if(local){

        local.content = null;
        local.file_url = null;
        local.deleted_for_everyone =
            true;
        local.deleted_at =
            new Date().toISOString();
    }

    renderMessages();
}

/* =========================================================
   ADD LOCAL MESSAGE
========================================================= */

function addLocalMessage(message){

    const exists =
        messageCache.some(
            item =>
                item.id === message.id
        );

    if(exists){
        return;
    }

    const oldLast =
        messageCache[
            messageCache.length - 1
        ];

    const needsDate =
        !oldLast ||
        dateKey(oldLast.created_at) !==
        dateKey(message.created_at);

    messageCache.push(message);

    if(needsDate){

        addDateSeparator(
            message.created_at
        );
    }

    appendMessageElement(
        message,
        true
    );
}

/* =========================================================
   UPLOAD FILE
========================================================= */

async function uploadFile(file){

    if(!file){
        return;
    }

    if(
        file.size >
        50 * 1024 * 1024
    ){

        showError(
            "৫০ MB-এর বেশি file পাঠানো যাবে না।"
        );

        return;
    }

    showSuccess(
        "File upload হচ্ছে..."
    );

    const safeName =
        String(file.name)
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );

    const path =
        currentUser.id +
        "/" +
        Date.now() +
        "_" +
        safeName;

    const {
        error:uploadError
    } =
        await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
            path,
            file,
            {
                cacheControl:"3600",
                upsert:false
            }
        );

    if(uploadError){

        showError(
            "File upload করা যায়নি: " +
            uploadError.message
        );

        return;
    }

    const {
        data:urlData
    } =
        supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(path);

    const fileUrl =
        urlData.publicUrl;

    let messageType =
        "file";

    if(
        file.type.startsWith("image/")
    ){
        messageType = "image";
    }
    else if(
        file.type.startsWith("video/")
    ){
        messageType = "video";
    }

    const {
        data,
        error
    } =
        await supabaseClient
        .from("messages")
        .insert({
            conversation_id:
                conversationId,
            sender_id:
                currentUser.id,
            content:
                file.name,
            message_type:
                messageType,
            file_url:
                fileUrl,
            is_read:false
        })
        .select(`
            id,
            conversation_id,
            sender_id,
            content,
            message_type,
            file_url,
            created_at,
            is_read,
            deleted_for_everyone,
            deleted_at
        `)
        .single();

    if(error){

        showError(
            "File message তৈরি করা যায়নি: " +
            error.message
        );

        return;
    }

    addLocalMessage(data);

    showSuccess(
        "File পাঠানো হয়েছে।"
    );
}

/* =========================================================
   VOICE RECORDING
========================================================= */

function getSupportedAudioMime(){

    const types = [
        "audio/mp4",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus",
        "audio/ogg"
    ];

    for(
        const type of types
    ){

        if(
            window.MediaRecorder &&
            MediaRecorder.isTypeSupported(
                type
            )
        ){
            return type;
        }
    }

    return "";
}

async function toggleRecording(){

    if(isRecording){

        stopRecording();

        return;
    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showError(
            "এই device/browser voice recording support করে না।"
        );

        return;
    }

    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });

        const mimeType =
            getSupportedAudioMime();

        const options =
            mimeType
            ? {mimeType}
            : {};

        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );

        recordedChunks = [];

        mediaRecorder.ondataavailable =
            event=>{

                if(
                    event.data &&
                    event.data.size > 0
                ){
                    recordedChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async ()=>{

                stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

                const finalType =
                    mediaRecorder.mimeType ||
                    mimeType ||
                    "audio/webm";

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                finalType
                        }
                    );

                recordedChunks = [];

                await uploadVoiceBlob(
                    blob,
                    finalType
                );
            };

        mediaRecorder.start();

        isRecording = true;

        voiceBtn.classList.add(
            "recording"
        );

        voiceBtn.textContent =
            "⏹️";

        showSuccess(
            "Voice recording চলছে..."
        );

    }catch(error){

        showError(
            "Microphone permission পাওয়া যায়নি।"
        );
    }
}

function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();
    }

    isRecording = false;

    voiceBtn.classList.remove(
        "recording"
    );

    voiceBtn.textContent =
        "🎙️";
}

async function uploadVoiceBlob(
    blob,
    mimeType
){

    if(!blob || !blob.size){
        return;
    }

    showSuccess(
        "Voice upload হচ্ছে..."
    );

    let extension =
        "webm";

    if(
        mimeType.includes("mp4")
    ){
        extension = "m4a";
    }
    else if(
        mimeType.includes("ogg")
    ){
        extension = "ogg";
    }

    const path =
        currentUser.id +
        "/voice_" +
        Date.now() +
        "." +
        extension;

    const {
        error:uploadError
    } =
        await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
            path,
            blob,
            {
                contentType:
                    mimeType ||
                    "audio/webm",
                cacheControl:"3600",
                upsert:false
            }
        );

    if(uploadError){

        showError(
            "Voice upload করা যায়নি: " +
            uploadError.message
        );

        return;
    }

    const {
        data:urlData
    } =
        supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(path);

    const {
        data,
        error
    } =
        await supabaseClient
        .from("messages")
        .insert({
            conversation_id:
                conversationId,
            sender_id:
                currentUser.id,
            content:
                "Voice message",
            message_type:
                "audio",
            file_url:
                urlData.publicUrl,
            is_read:false
        })
        .select(`
            id,
            conversation_id,
            sender_id,
            content,
            message_type,
            file_url,
            created_at,
            is_read,
            deleted_for_everyone,
            deleted_at
        `)
        .single();

    if(error){

        showError(
            "Voice message পাঠানো যায়নি: " +
            error.message
        );

        return;
    }

    addLocalMessage(data);

    showSuccess(
        "Voice পাঠানো হয়েছে।"
    );
}

/* =========================================================
   READ RECEIPT
========================================================= */

async function markReceivedMessagesRead(){

    if(!conversationId){
        return;
    }

    /*
      RLS-এর কারণে অন্য user-এর message সরাসরি
      arbitrary update করার বদলে database policy +
      trigger দিয়ে নিরাপদভাবে is_read update করা হয়েছে।
    */

    const {
        data:unreadMessages
    } =
        await supabaseClient
        .from("messages")
        .select("id")
        .eq(
            "conversation_id",
            conversationId
        )
        .neq(
            "sender_id",
            currentUser.id
        )
        .eq(
            "is_read",
            false
        );

    if(
        !unreadMessages ||
        unreadMessages.length === 0
    ){
        return;
    }

    const {
        error
    } =
        await supabaseClient
        .from("messages")
        .update({
            is_read:true
        })
        .eq(
            "conversation_id",
            conversationId
        )
        .neq(
            "sender_id",
            currentUser.id
        )
        .eq(
            "is_read",
            false
        );

    if(error){
        console.warn(
            "Read receipt:",
            error.message
        );
    }

    for(
        const message
        of messageCache
    ){

        if(
            message.sender_id !==
            currentUser.id
        ){
            message.is_read = true;
        }
    }

    updateAllMessageStatus();
}

function updateAllMessageStatus(){

    document
    .querySelectorAll(
        ".message-row"
    )
    .forEach(row=>{

        const id =
            row.dataset.messageId;

        const message =
            messageCache.find(
                item =>
                    item.id === id
            );

        if(!message){
            return;
        }

        if(
            message.sender_id !==
            currentUser.id
        ){
            return;
        }

        const status =
            row.querySelector(
                ".read-status"
            );

        if(!status){
            return;
        }

        status.textContent =
            message.is_read
            ? "✓✓"
            : "✓";

        status.classList.toggle(
            "read",
            Boolean(message.is_read)
        );

        status.classList.toggle(
            "unread",
            !message.is_read
        );
    });
}

/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

    if(realtimeChannel){
        supabaseClient
        .removeChannel(
            realtimeChannel
        );
    }

    realtimeChannel =
        supabaseClient
        .channel(
            "messages-" +
            conversationId
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"messages",
                filter:
                    "conversation_id=eq." +
                    conversationId
            },
            payload=>{

                const message =
                    payload.new;

                if(
                    message.sender_id ===
                    currentUser.id
                ){
                    return;
                }

                const already =
                    messageCache.some(
                        item =>
                            item.id ===
                            message.id
                    );

                if(!already){

                    messageCache.push(
                        message
                    );

                    renderMessages();

                    markReceivedMessagesRead();
                }
            }
        )
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"messages",
                filter:
                    "conversation_id=eq." +
                    conversationId
            },
            payload=>{

                const updated =
                    payload.new;

                const index =
                    messageCache.findIndex(
                        item =>
                            item.id ===
                            updated.id
                    );

                if(index === -1){
                    return;
                }

                messageCache[index] =
                    updated;

                renderMessages();
            }
        )
        .subscribe();
}

        "🥰",

    ];

    const emoji =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];

    messageInput.value += emoji;

    messageInput.focus();

/* =========================================================
   BACK
========================================================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            "chat.html"
        )
    ){

        window.history.back();

        return;
    }

    if(
        window.history.length > 1
    ){

        window.history.back();

        return;
    }

    window.location.href =
        "index.html";
}

/* =========================================================
   START
========================================================= */

async function startMessagePage(){

    try{

        targetUserId =
            getTargetUserId();

        if(!targetUserId){

            throw new Error(
                "User ID পাওয়া যায়নি। Profile থেকে আবার Chat খুলুন।"
            );
        }

        const {
            data:authData,
            error:authError
        } =
            await supabaseClient
            .auth
            .getUser();

        if(authError){
            throw authError;
        }

        currentUser =
            authData.user;

        if(!currentUser){

            throw new Error(
                "আপনাকে আগে Login করতে হবে।"
            );
        }

        if(
            currentUser.id ===
            targetUserId
        ){

            throw new Error(
                "নিজের সাথে Chat করা যাবে না।"
            );
        }

        await loadTargetProfile();

        conversationId =
            await getOrCreateConversation();

        await loadMessages();

        subscribeRealtime();

        await markReceivedMessagesRead();

        loadingScreen.style.display =
            "none";

        messageInput.focus();

        setTimeout(
            ()=>{
                scrollToBottom(false);
            },
            100
        );

    }catch(error){

        console.error(
            "RAZTARA chat error:",
            error
        );

        loadingScreen.innerHTML =
            `
            <div style="
                text-align:center;
                padding:25px;
                max-width:420px;
            ">
                <div style="
                    font-size:42px;
                    margin-bottom:12px;
                ">⚠️</div>

                <div style="
                    font-size:16px;
                    color:#b00020;
                    line-height:1.5;
                ">
                    ${escapeHtml(
                        error.message ||
                        "Chat চালু করা যায়নি।"
                    )}
                </div>

                <button
                    onclick="goBack()"
                    style="
                        margin-top:18px;
                        padding:11px 20px;
                        border:0;
                        border-radius:9px;
                        background:#075e54;
                        color:#fff;
                    "
                >
                    ফিরে যান
                </button>
            </div>
            `;
    }
}

startMessagePage();
