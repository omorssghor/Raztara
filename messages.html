<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Messages | RAZTARA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f4f7f9;
    color:#17212b;
}

button,
textarea,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.topbar{
    height:64px;
    flex-shrink:0;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    padding:8px 10px;
    gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    z-index:20;
}

.back-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:transparent;
    color:#fff;
    font-size:28px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.back-btn:active{
    background:rgba(255,255,255,.15);
}

.user-head{
    min-width:0;
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
}

.header-avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:#dfe7e4;
    border:2px solid rgba(255,255,255,.8);
}

.header-info{
    min-width:0;
}

.header-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    font-size:12px;
    opacity:.9;
    margin-top:2px;
}

/* ================= ERROR / STATUS ================= */

.status-box{
    display:none;
    flex-shrink:0;
    padding:9px 12px;
    font-size:13px;
    line-height:1.4;
    background:#fff3cd;
    color:#664d03;
    border-bottom:1px solid #ffe69c;
    z-index:19;
}

.status-box.show{
    display:block;
}

.status-box.error{
    background:#f8d7da;
    color:#842029;
    border-color:#f1aeb5;
}

.status-box.success{
    background:#d1e7dd;
    color:#0f5132;
    border-color:#a3cfbb;
}

/* ================= MESSAGE AREA ================= */

.messages-area{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:12px 10px 10px;
    background:
        radial-gradient(circle at 20% 20%,rgba(8,127,91,.035),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(8,127,91,.035),transparent 25%),
        #f4f7f9;
    scroll-behavior:smooth;
}

.messages-inner{
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.loading{
    text-align:center;
    color:#6c757d;
    padding:25px 10px;
    font-size:14px;
}

.empty{
    text-align:center;
    color:#7b8790;
    padding:30px 15px;
    font-size:14px;
}

.date-separator{
    align-self:center;
    margin:10px 0 12px;
    padding:5px 11px;
    border-radius:14px;
    background:#dfe7e4;
    color:#52616b;
    font-size:11px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
}

/* ================= MESSAGE ROW ================= */

.message-row{
    width:100%;
    display:flex;
    margin:3px 0;
    position:relative;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.other{
    justify-content:flex-start;
}

.bubble{
    position:relative;
    max-width:min(78%,420px);
    padding:8px 10px 5px;
    border-radius:16px;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    user-select:none;
    -webkit-user-select:none;
}

.mine .bubble{
    background:#087f5b;
    color:#fff;
    border-bottom-right-radius:5px;
}

.other .bubble{
    background:#fff;
    color:#17212b;
    border-bottom-left-radius:5px;
}

.message-content{
    font-size:15px;
    line-height:1.42;
    white-space:pre-wrap;
}

.message-meta{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:4px;
    margin-top:3px;
    min-height:13px;
}

.message-time{
    font-size:10px;
    opacity:.72;
    white-space:nowrap;
}

.read-status{
    font-size:11px;
    line-height:1;
}

.media-message{
    display:block;
    max-width:100%;
    width:auto;
    max-height:320px;
    border-radius:11px;
    object-fit:cover;
    cursor:pointer;
}

.video-message{
    display:block;
    max-width:100%;
    width:min(320px,100%);
    max-height:320px;
    border-radius:11px;
    background:#000;
}

.file-message{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:180px;
    padding:7px 4px;
    color:inherit;
    text-decoration:none;
}

.file-icon{
    width:38px;
    height:38px;
    border-radius:10px;
    background:rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    flex-shrink:0;
}

.other .file-icon{
    background:#edf3f1;
}

.file-name{
    min-width:0;
    flex:1;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.audio-message{
    width:min(260px,100%);
    height:42px;
}

.deleted-message{
    font-style:italic;
    opacity:.75;
    font-size:13px;
}

/* ================= COMPOSER ================= */

.composer-wrap{
    flex-shrink:0;
    background:#fff;
    border-top:1px solid #dde5e2;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    z-index:15;
}

.composer{
    display:flex;
    align-items:flex-end;
    gap:6px;
}

.tool-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#edf3f1;
    color:#087f5b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.tool-btn:active{
    transform:scale(.94);
}

.text-box{
    flex:1;
    min-width:0;
    max-height:110px;
    min-height:40px;
    resize:none;
    border:1px solid #d7e0dd;
    border-radius:20px;
    padding:9px 14px;
    outline:none;
    background:#f7f9f8;
    color:#17212b;
    line-height:20px;
}

.text-box:focus{
    border-color:#087f5b;
    background:#fff;
}

.send-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.send-btn:disabled,
.tool-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* ================= VOICE BAR ================= */

.voice-bar{
    display:none;
    align-items:center;
    gap:8px;
    padding:7px 2px 4px;
}

.voice-bar.show{
    display:flex;
}

.voice-time{
    flex:1;
    color:#087f5b;
    font-weight:700;
    font-size:14px;
}

.voice-cancel{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#f8d7da;
    color:#842029;
}

.voice-stop{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#087f5b;
    color:#fff;
}

/* ================= FILE INPUT ================= */

#fileInput{
    display:none;
}

/* ================= MESSAGE MENU ================= */

.message-menu{
    position:fixed;
    display:none;
    width:190px;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.22);
    border:1px solid #e2e8e5;
    z-index:1000;
}

.message-menu.show{
    display:block;
}

.menu-title{
    padding:10px 13px;
    font-size:12px;
    color:#7a858d;
    background:#f7f9f8;
}

.menu-item{
    width:100%;
    min-height:45px;
    padding:10px 13px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    color:#17212b;
    font-size:14px;
}

.menu-item:active{
    background:#eef5f2;
}

.menu-item.danger{
    color:#c0392b;
}

/* ================= PREVIEW ================= */

.preview{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:15px;
}

.preview.show{
    display:flex;
}

.preview img,
.preview video{
    max-width:100%;
    max-height:90vh;
    border-radius:10px;
}

.preview-close{
    position:absolute;
    top:18px;
    right:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:25px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){
    .bubble{
        max-width:82%;
    }

    .media-message{
        max-height:280px;
    }

    .video-message{
        max-height:280px;
    }
}
</style>
</head>

/* =========================================================
   URL PARAMETER
========================================================= */

function getTargetUserId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("user") ||
        params.get("id") ||
        ""
    ).trim();
}


/* =========================================================
   STATUS
========================================================= */

let statusTimer = null;

function showStatus(message,type=""){

    clearTimeout(statusTimer);

    statusBox.textContent = message;

    statusBox.className =
        "status-box show " + type;

    statusTimer =
        setTimeout(()=>{
            statusBox.className =
                "status-box";
        },6000);
}

function showError(message){

    console.error(message);

    showStatus(
        "সমস্যা: " + message,
        "error"
    );
}

function showSuccess(message){

    showStatus(
        message,
        "success"
    );
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   DATE / TIME
========================================================= */

function getLocalDateKey(dateValue){

    const d =
        new Date(dateValue);

    const y =
        d.getFullYear();

    const m =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    return `${y}-${m}-${day}`;
}


function formatDateSeparator(dateValue){

    const d =
        new Date(dateValue);

    const today =
        new Date();

    const yesterday =
        new Date();

    yesterday.setDate(
        yesterday.getDate()-1
    );

    if(
        getLocalDateKey(d) ===
        getLocalDateKey(today)
    ){
        return "আজ";
    }

    if(
        getLocalDateKey(d) ===
        getLocalDateKey(yesterday)
    ){
        return "গতকাল";
    }

    return d.toLocaleDateString(
        "bn-BD",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}


function formatTime(dateValue){

    const d =
        new Date(dateValue);

    return d.toLocaleTimeString(
        "bn-BD",
        {
            hour:"numeric",
            minute:"2-digit",
            hour12:true
        }
    );
}


/* =========================================================
   AVATAR
========================================================= */

function getAvatarUrl(profile){

    if(
        profile &&
        profile.avatar_url
    ){

        if(
            profile.avatar_url.startsWith("http")
        ){
            return profile.avatar_url;
        }

        const {
            data
        } =
        supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(
                profile.avatar_url
            );

        return data.publicUrl;
    }

    return "";
}


function setAvatarImage(img,url,name){

    img.onerror = function(){

        img.onerror = null;

        img.src =
            "data:image/svg+xml;charset=UTF-8," +
            encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
                    <rect width="100" height="100" fill="#dfe7e4"/>
                    <text x="50" y="58" text-anchor="middle"
                    font-size="42" fill="#087f5b">${escapeHtml(
                        (name || "U").charAt(0).toUpperCase()
                    )}</text>
                </svg>`
            );
    };

    if(url){
        img.src = url;
    }else{
        img.onerror();
    }
}


/* =========================================================
   LOAD OTHER PROFILE
========================================================= */

async function loadOtherProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url,
            bio,
            online_visibility,
            last_seen_at
        `)
        .eq("id",otherUserId)
        .maybeSingle();

    if(error){
        throw error;
    }

    if(!data){

        throw new Error(
            "এই user-এর profile পাওয়া যায়নি।"
        );
    }

    otherProfile = data;

    const name =
        data.full_name ||
        data.username ||
        "RAZTARA User";

    headerName.textContent =
        name;

    setAvatarImage(
        headerAvatar,
        getAvatarUrl(data),
        name
    );

    updateHeaderStatus(data);
}


function updateHeaderStatus(profile){

    if(
        profile.online_visibility ===
        "nobody"
    ){

        headerStatus.textContent =
            "RAZTARA";
        return;
    }

    if(profile.last_seen_at){

        const last =
            new Date(
                profile.last_seen_at
            );

        const diff =
            Date.now() -
            last.getTime();

        if(diff < 120000){

            headerStatus.textContent =
                "অনলাইনে";
            return;
        }

        headerStatus.textContent =
            "শেষ দেখা " +
            formatTime(
                profile.last_seen_at
            );

        return;
    }

    headerStatus.textContent =
        "RAZTARA";
}


/* =========================================================
   FIND / CREATE CONVERSATION
========================================================= */

async function getExistingConversation(){

    const {
        data:myRows,
        error:myError
    } =
    await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq("user_id",currentUserId);

    if(myError){
        throw myError;
    }

    const myConversationIds =
        (myRows || [])
            .map(
                row =>
                    row.conversation_id
            );

    if(!myConversationIds.length){
        return null;
    }

    const {
        data:otherRows,
        error:otherError
    } =
    await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq("user_id",otherUserId)
        .in(
            "conversation_id",
            myConversationIds
        );

    if(otherError){
        throw otherError;
    }

    if(!otherRows || !otherRows.length){
        return null;
    }

    const ids =
        otherRows.map(
            row =>
                row.conversation_id
        );

    const {
        data:conversations,
        error
    } =
    await supabaseClient
        .from("conversations")
        .select(`
            id,
            is_group,
            name,
            created_by,
            created_at
        `)
        .in("id",ids)
        .eq("is_group",false);

    if(error){
        throw error;
    }

    if(!conversations || !conversations.length){
        return null;
    }

    /*
      Prefer a conversation where there are
      exactly these two users.
    */

    for(
        const conversation
        of conversations
    ){

        const {
            data:members,
            error:membersError
        } =
        await supabaseClient
            .from("conversation_members")
            .select("user_id")
            .eq(
                "conversation_id",
                conversation.id
            );

        if(membersError){
            continue;
        }

        const memberIds =
            (members || [])
                .map(
                    m =>
                        m.user_id
                );

        if(
            memberIds.length === 2 &&
            memberIds.includes(currentUserId) &&
            memberIds.includes(otherUserId)
        ){
            return conversation.id;
        }
    }

    return null;
}


async function createConversation(){

    const {
        data:conversation,
        error
    } =
    await supabaseClient
        .from("conversations")
        .insert({
            is_group:false,
            created_by:currentUserId
        })
        .select("id")
        .single();

    if(error){
        throw error;
    }

    if(!conversation?.id){

        throw new Error(
            "Conversation তৈরি করা যায়নি।"
        );
    }

    const {
        error:memberError
    } =
    await supabaseClient
        .from("conversation_members")
        .insert([
            {
                conversation_id:
                    conversation.id,
                user_id:
                    currentUserId
            },
            {
                conversation_id:
                    conversation.id,
                user_id:
                    otherUserId
            }
        ]);

    if(memberError){

        /*
          Cleanup conversation if member insert fails.
        */
        await supabaseClient
            .from("conversations")
            .delete()
            .eq(
                "id",
                conversation.id
            );

        throw memberError;
    }

    return conversation.id;
}


async function getOrCreateConversation(){

    let existing =
        await getExistingConversation();

    if(existing){
        return existing;
    }

    return await createConversation();
}

async function loadMessages(){

        `)
        .eq(

            {
                ascending:true
            }
        );

    if(error){
        throw error;
    }

    messageCache =
        new Map();

    const visibleMessages =
        [];

    (data || []).forEach(message=>{

/* =========================================================
   RENDER ALL
========================================================= */

function renderMessages(
    messages,
    scrollBottom=false
){

    messagesInner.innerHTML = "";

    if(!messages.length){

        const empty =
            document.createElement("div");

        empty.className =
            "empty";

        empty.textContent =
            "এখনও কোনো মেসেজ নেই।";

        messagesInner.appendChild(
            empty
        );

    }else{

        let lastDateKey = "";

        messages.forEach(message=>{

            const dateKey =
                getLocalDateKey(
                    message.created_at
                );

            if(
                dateKey !==
                lastDateKey
            ){

                const separator =
                    document.createElement(
                        "div"
                    );

                separator.className =
                    "date-separator";

                separator.textContent =
                    formatDateSeparator(
                        message.created_at
                    );

                messagesInner.appendChild(
                    separator
                );

                lastDateKey =
                    dateKey;
            }

            const row =
                createMessageElement(
                    message
                );

            messagesInner.appendChild(
                row
            );
        });
    }

    if(scrollBottom){
        requestAnimationFrame(
            scrollToBottom
        );
    }
}


/* =========================================================
   CREATE MESSAGE ELEMENT
========================================================= */

function createMessageElement(message){

    messageCache.set(
        message.id,
        message
    );

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (
            message.sender_id === currentUserId
                ? "mine"
                : "other"
        );

    row.dataset.messageId =
        message.id;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    /*
      Long press
    */

    setupLongPress(
        bubble,
        message.id
    );

    /*
      Deleted for everyone
    */

    if(message.deleted_for_everyone){

        const deleted =
            document.createElement("div");

        deleted.className =
            "deleted-message";

        deleted.textContent =
            "এই মেসেজটি মুছে দেওয়া হয়েছে";

        bubble.appendChild(
            deleted
        );

    }else{

        appendMessageContent(
            bubble,
            message
        );
    }

    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";

    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            message.created_at
        );

    meta.appendChild(
        time
    );

    if(
        message.sender_id ===
        currentUserId
    ){

        const read =
            document.createElement("span");

        read.className =
            "read-status";

        read.textContent =
            message.is_read
                ? "✓✓"
                : "✓";

        meta.appendChild(
            read
        );
    }

    bubble.appendChild(
        meta
    );

    row.appendChild(
        bubble
    );

    return row;
}


/* =========================================================
   MESSAGE CONTENT
========================================================= */

function appendMessageContent(
    bubble,
    message
){

    const type =
        message.message_type ||
        "text";

    if(type === "text"){

        const content =
            document.createElement(
                "div"
            );

        content.className =
            "message-content";

        content.textContent =
            message.content || "";

        bubble.appendChild(
            content
        );

        return;
    }

    if(type === "image"){

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "media-message";

        img.src =
            message.file_url || "";

        img.alt =
            "Image";

        img.loading =
            "lazy";

        img.addEventListener(
            "click",
            ()=>{
                openImagePreview(
                    message.file_url
                );
            }
        );

        bubble.appendChild(
            img
        );

        return;
    }

    if(type === "video"){

        const video =
            document.createElement(
                "video"
            );

        video.className =
            "video-message";

        video.src =
            message.file_url || "";

        video.controls =
            true;

        video.playsInline =
            true;

        bubble.appendChild(
            video
        );

        return;
    }

    if(type === "audio"){

        const audio =
            document.createElement(
                "audio"
            );

        audio.className =
            "audio-message";

        audio.src =
            message.file_url || "";

        audio.controls =
            true;

        bubble.appendChild(
            audio
        );

        return;
    }

    if(type === "file"){

        const link =
            document.createElement(
                "a"
            );

        link.className =
            "file-message";

        link.href =
            message.file_url || "#";

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "file-icon";

        icon.textContent =
            "📄";

        const name =
            document.createElement(
                "div"
            );

        name.className =
            "file-name";

        name.textContent =
            message.content ||
            "File";

        link.appendChild(
            icon
        );

        link.appendChild(
            name
        );

        bubble.appendChild(
            link
        );

        return;
    }

    /*
      Fallback
    */

    const fallback =
        document.createElement(
            "div"
        );

    fallback.className =
        "message-content";

    fallback.textContent =
        message.content || "";

    bubble.appendChild(
        fallback
    );
}


/* =========================================================
   APPEND SINGLE MESSAGE
========================================================= */

function appendSingleMessage(
    message,
    scroll=true
){

    if(!message){
        return;
    }

    messageCache.set(
        message.id,
        message
    );

    if(
        hiddenMessageIds.has(
            message.id
        )
    ){
        return;
    }

    const old =
        document.querySelector(
            `[data-message-id="${CSS.escape(message.id)}"]`
        );

    if(old){
        old.replaceWith(
            createMessageElement(message)
        );

        if(scroll){
            scrollToBottom();
        }

        return;
    }

    /*
      Remove empty state.
    */

    const empty =
        messagesInner.querySelector(
            ".empty"
        );

    if(empty){
        empty.remove();
    }

    /*
      Date separator.
    */

    const lastMessage =
        [...messagesInner.querySelectorAll(
            ".message-row"
        )].pop();

    let needDate =
        true;

    if(lastMessage){

        const lastId =
            lastMessage.dataset.messageId;

        const last =
            messageCache.get(
                lastId
            );

        if(last){

            needDate =
                getLocalDateKey(
                    last.created_at
                ) !==
                getLocalDateKey(
                    message.created_at
                );
        }
    }

    if(needDate){

        const separator =
            document.createElement(
                "div"
            );

        separator.className =
            "date-separator";

        separator.dataset.dateFor =
            getLocalDateKey(
                message.created_at
            );

        separator.textContent =
            formatDateSeparator(
                message.created_at
            );

        messagesInner.appendChild(
            separator
        );
    }

    messagesInner.appendChild(
        createMessageElement(
            message
        )
    );

    if(scroll){
        scrollToBottom();
    }
}


/* =========================================================
   REPLACE / UPDATE MESSAGE
========================================================= */

function updateMessageInPlace(
    message
){

    if(!message){
        return;
    }

    messageCache.set(
        message.id,
        message
    );

    const row =
        document.querySelector(
            `[data-message-id="${CSS.escape(message.id)}"]`
        );

    /*
      Only-me deleted
    */

    if(
        hiddenMessageIds.has(
            message.id
        )
    ){

        if(row){
            row.remove();
        }

        return;
    }

    if(row){

        row.replaceWith(
            createMessageElement(
                message
            )
        );

        return;
    }

    appendSingleMessage(
        message,
        false
    );
}

/* =========================================================
   FILE UPLOAD
========================================================= */

async function uploadFile(file){

    if(!file){
        return;
    }

    if(!isPageReady){
        showError(
            "মেসেজ সিস্টেম এখনও প্রস্তুত হয়নি।"
        );
        return;
    }

    if(!conversationId){
        showError(
            "Conversation পাওয়া যায়নি।"
        );
        return;
    }

    const maxSize =
        50 * 1024 * 1024;

    if(file.size > maxSize){

        showError(
            "File সর্বোচ্চ 50 MB হতে পারবে।"
        );

        return;
    }

    showStatus(
        "File upload হচ্ছে..."
    );

    try{

        const extension =
            (
                file.name.split(".").pop() ||
                "file"
            )
            .toLowerCase()
            .replace(/[^a-z0-9]/g,"");

        const safeName =
            (
                file.name
                    .replace(/\s+/g,"_")
                    .replace(/[^a-zA-Z0-9._-]/g,"")
            ) ||
            `file.${extension}`;

        const path =
            `${currentUserId}/${Date.now()}_${crypto.randomUUID()}_${safeName}`;

        const {
            error:uploadError
        } =
        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .upload(
                path,
                file,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:
                        file.type ||
                        "application/octet-stream"
                }
            );

        if(uploadError){
            throw uploadError;
        }

        const {
            data:urlData
        } =
        supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(path);

        const fileUrl =
            urlData?.publicUrl;

        if(!fileUrl){

            throw new Error(
                "Uploaded file-এর URL পাওয়া যায়নি।"
            );
        }

        let messageType =
            "file";

        if(
            file.type &&
            file.type.startsWith("image/")
        ){
            messageType =
                "image";
        }else if(
            file.type &&
            file.type.startsWith("video/")
        ){
            messageType =
                "video";
        }

        const {
            data,
            error
        } =
        await supabaseClient
            .from("messages")
            .insert({
                conversation_id:
                    conversationId,
                sender_id:
                    currentUserId,
                content:
                    file.name,
                message_type:
                    messageType,
                file_url:
                    fileUrl,
                is_read:
                    false
            })
            .select(`
                id,
                conversation_id,
                sender_id,
                content,
                message_type,
                file_url,
                created_at,
                is_read,
                deleted_for_everyone,
                deleted_at
            `)
            .single();

        if(error){
            throw error;
        }

        appendSingleMessage(
            data,
            true
        );

        showSuccess(
            "File পাঠানো হয়েছে।"
        );

    }catch(error){

        showError(
            error.message ||
            "File পাঠানো যায়নি।"
        );
    }
}


/* =========================================================
   VOICE MIME
========================================================= */

function getVoiceMimeType(){

    const types = [
        "audio/mp4",
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus"
    ];

    for(
        const type
        of types
    ){

        try{

            if(
                MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(type)
            ){
                return type;
            }

        }catch(error){
            console.warn(error);
        }
    }

    return "";
}


/* =========================================================
   START VOICE
========================================================= */

async function startVoiceRecording(){

    if(!isPageReady){
        showError(
            "মেসেজ সিস্টেম প্রস্তুত হয়নি।"
        );
        return;
    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showError(
            "এই browser-এ voice recording support নেই।"
        );

        return;
    }

    if(mediaRecorder){

        showError(
            "Voice recording ইতিমধ্যে চলছে।"
        );

        return;
    }

    try{

        voiceStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        voiceMimeType =
            getVoiceMimeType();

        const options =
            voiceMimeType
                ? {mimeType:voiceMimeType}
                : {};

        mediaRecorder =
            new MediaRecorder(
                voiceStream,
                options
            );

        voiceChunks =
            [];

        mediaRecorder.ondataavailable =
            event => {

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    voiceChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async () => {

                const chunks =
                    voiceChunks;

                const mime =
                    voiceMimeType ||
                    mediaRecorder?.mimeType ||
                    "audio/webm";

                cleanupVoiceUI();

                if(!chunks.length){
                    mediaRecorder = null;
                    return;
                }

                const blob =
                    new Blob(
                        chunks,
                        {
                            type:mime
                        }
                    );

                mediaRecorder =
                    null;

                await uploadVoiceBlob(
                    blob,
                    mime
                );
            };

        mediaRecorder.onerror =
            event => {

                console.error(
                    "MediaRecorder error:",
                    event
                );

                showError(
                    "Voice recording-এ সমস্যা হয়েছে।"
                );

                cleanupVoiceUI();

                mediaRecorder =
                    null;
            };

        mediaRecorder.start(
            250
        );

        recordingSeconds =
            0;

        updateVoiceTime();

        recordingTimer =
            setInterval(
                ()=>{
                    recordingSeconds++;
                    updateVoiceTime();
                },
                1000
            );

        voiceBar.classList.add(
            "show"
        );

        voiceBtn.disabled =
            true;

        showStatus(
            "Voice recording চলছে..."
        );

    }catch(error){

        console.error(error);

        cleanupVoiceUI();

        showError(
            error.message ||
            "Microphone permission পাওয়া যায়নি।"
        );
    }
}


/* =========================================================
   VOICE TIME
========================================================= */

function updateVoiceTime(){

    const minutes =
        Math.floor(
            recordingSeconds / 60
        )
        .toString()
        .padStart(2,"0");

    const seconds =
        (
            recordingSeconds % 60
        )
        .toString()
        .padStart(2,"0");

    voiceTime.textContent =
        `🎙️ ${minutes}:${seconds}`;
}


/* =========================================================
   STOP VOICE
========================================================= */

function stopVoiceRecording(){

    if(!mediaRecorder){
        return;
    }

    try{

        mediaRecorder.stop();

    }catch(error){

        console.error(error);
    }
}


/* =========================================================
   CANCEL VOICE
========================================================= */

function cancelVoiceRecording(){

    if(mediaRecorder){

        mediaRecorder.onstop =
            null;

        try{
            mediaRecorder.stop();
        }catch(error){
            console.warn(error);
        }

        mediaRecorder =
            null;
    }

    voiceChunks =
        [];

    cleanupVoiceUI();
}


function cleanupVoiceUI(){

    if(recordingTimer){

        clearInterval(
            recordingTimer
        );

        recordingTimer =
            null;
    }

    if(voiceStream){

        voiceStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        voiceStream =
            null;
    }

    voiceBar.classList.remove(
        "show"
    );

    voiceBtn.disabled =
        false;

    recordingSeconds =
        0;

    updateVoiceTime();
}


/* =========================================================
   UPLOAD VOICE
========================================================= */

async function uploadVoiceBlob(
    blob,
    mimeType
){

    if(!blob || !blob.size){
        return;
    }

    showStatus(
        "Voice পাঠানো হচ্ছে..."
    );

    try{

        let extension =
            "webm";

        if(
            mimeType.includes("mp4")
        ){
            extension =
                "m4a";
        }else if(
            mimeType.includes("ogg")
        ){
            extension =
                "ogg";
        }

        const path =
            `${currentUserId}/voice_${Date.now()}_${crypto.randomUUID()}.${extension}`;

        const {
            error:uploadError
        } =
        await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .upload(
                path,
                blob,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:
                        mimeType
                }
            );

        if(uploadError){
            throw uploadError;
        }

        const {
            data:urlData
        } =
        supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(path);

        const fileUrl =
            urlData?.publicUrl;

        if(!fileUrl){

            throw new Error(
                "Voice URL পাওয়া যায়নি।"
            );
        }

        const {
            data,
            error
        } =
        await supabaseClient
            .from("messages")
            .insert({
                conversation_id:
                    conversationId,
                sender_id:
                    currentUserId,
                content:
                    "Voice message",
                message_type:
                    "audio",
                file_url:
                    fileUrl,
                is_read:
                    false
            })
            .select(`
                id,
                conversation_id,
                sender_id,
                content,
                message_type,
                file_url,
                created_at,
                is_read,
                deleted_for_everyone,
                deleted_at
            `)
            .single();

        if(error){
            throw error;
        }

        appendSingleMessage(
            data,
            true
        );

        showSuccess(
            "Voice পাঠানো হয়েছে।"
        );

    }catch(error){

        showError(
            error.message ||
            "Voice পাঠানো যায়নি।"
        );
    }
}


/* =========================================================
   MESSAGE MENU

function openMessageMenu(
    messageId,
    x,
    y
){

    selectedMessage =
        messageCache.get(
            messageId
        );

    if(!selectedMessage){
        return;
    }

    const isMine =
        selectedMessage.sender_id ===
        currentUserId;

    deleteAllBtn.style.display =
        isMine &&
        !selectedMessage.deleted_for_everyone
            ? "flex"
            : "none";

    /*
      Share is available for all.
    */

    shareBtn.style.display =
        "flex";

    deleteMeBtn.style.display =
        "flex";

    messageMenu.classList.add(
        "show"
    );

    const width =
        190;

    const height =
        145;

    let left =
        Math.min(
            x,
            window.innerWidth - width - 8
        );

    let top =
        Math.min(
            y,
            window.innerHeight - height - 8
        );

    left =
        Math.max(
            8,
            left
        );

    top =
        Math.max(
            8,
            top
        );

    messageMenu.style.left =
        `${left}px`;

    messageMenu.style.top =
        `${top}px`;
}


function closeMessageMenu(){

    messageMenu.classList.remove(
        "show"
    );

    selectedMessage =
        null;
}


/* =========================================================
   LONG PRESS
========================================================= */

function setupLongPress(
    element,
    messageId
){

    let timer = null;
    let startX = 0;
    let startY = 0;

    const cancel = ()=>{
        if(timer){
            clearTimeout(timer);
            timer = null;
        }
    };

    element.addEventListener(
        "touchstart",
        event=>{

            if(
                !event.touches ||
                !event.touches[0]
            ){
                return;
            }

            const touch =
                event.touches[0];

            startX =
                touch.clientX;

            startY =
                touch.clientY;

            timer =
                setTimeout(
                    ()=>{
                        timer = null;

                        openMessageMenu(
                            messageId,
                            startX,
                            startY
                        );
                    },
                    550
                );
        },
        {
            passive:true
        }
    );

    element.addEventListener(
        "touchmove",
        event=>{

            if(
                !event.touches ||
                !event.touches[0]
            ){
                return;
            }

            const touch =
                event.touches[0];

            const dx =
                Math.abs(
                    touch.clientX -
                    startX
                );

            const dy =
                Math.abs(
                    touch.clientY -
                    startY
                );

            if(
                dx > 10 ||
                dy > 10
            ){
                cancel();
            }
        },
        {
            passive:true
        }
    );

    element.addEventListener(
        "touchend",
        cancel,
        {
            passive:true
        }
    );

    element.addEventListener(
        "touchcancel",
        cancel,
        {
            passive:true
        }
    );

    /*
      Desktop right click
    */

    element.addEventListener(
        "contextmenu",
        event=>{

            event.preventDefault();

            openMessageMenu(
                messageId,
                event.clientX,
                event.clientY
            );
        }
    );
}


/* =========================================================
   DELETE ONLY ME
========================================================= */

async function deleteOnlyMe(){

    if(!selectedMessage){
        return;
    }

    const message =
        selectedMessage;

    closeMessageMenu();

    try{

        const {
            error
        } =
        await supabaseClient
            .from("message_hidden")
            .upsert(
                {
                    message_id:
                        message.id,
                    user_id:
                        currentUserId
                },
                {
                    onConflict:
                        "message_id,user_id"
                }
            );

        if(error){
            throw error;
        }

        hiddenMessageIds.add(
            message.id
        );

        const row =
            document.querySelector(
                `[data-message-id="${CSS.escape(message.id)}"]`
            );

        if(row){
            row.remove();
        }

        showSuccess(
            "মেসেজটি শুধু আপনার কাছ থেকে মুছে দেওয়া হয়েছে।"
        );

    }catch(error){

        showError(
            error.message ||
            "মেসেজ মুছতে সমস্যা হয়েছে।"
        );
    }
}


/* =========================================================
   DELETE FOR EVERYONE
========================================================= */

async function deleteForEveryone(){

    if(!selectedMessage){
        return;
    }

    const message =
        selectedMessage;

    if(
        message.sender_id !==
        currentUserId
    ){

        closeMessageMenu();

        showError(
            "শুধু নিজের পাঠানো মেসেজ সবার কাছ থেকে মুছতে পারবেন।"
        );

        return;
    }

    closeMessageMenu();

    const confirmed =
        window.confirm(
            "এই মেসেজটি কি সবার কাছ থেকে মুছে দিতে চান?"
        );

    if(!confirmed){
        return;
    }

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("messages")
            .update({
                content:null,
                file_url:null,
                deleted_for_everyone:true,
                deleted_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                message.id
            )
            .eq(
                "sender_id",
                currentUserId
            )
            .select(`
                id,
                conversation_id,
                sender_id,
                content,
                message_type,
                file_url,
                created_at,
                is_read,
                deleted_for_everyone,
                deleted_at
            `)
            .single();

        if(error){
            throw error;
        }

        updateMessageInPlace(
            data
        );

        showSuccess(
            "মেসেজটি সবার কাছ থেকে মুছে দেওয়া হয়েছে।"
        );

    }catch(error){

        showError(
            error.message ||
            "মেসেজ মুছতে সমস্যা হয়েছে।"
        );
    }
}


/* =========================================================
   SHARE
========================================================= */

async function shareMessage(){

    if(!selectedMessage){
        return;
    }

    const message =
        selectedMessage;

    closeMessageMenu();

    let shareText =
        message.content ||
        "RAZTARA message";

    if(message.file_url){

        shareText +=
            "\n" +
            message.file_url;
    }

    const shareData = {
        title:
            "RAZTARA",
        text:
            shareText
    };

    /*
      Native phone share menu.
      From there user can choose WhatsApp,
      Messenger, Facebook, Telegram, SMS,
      Email etc. depending on installed apps.
    */

    try{

        if(
            navigator.share
        ){

            await navigator.share(
                shareData
            );

            return;
        }

    }catch(error){

        if(
            error &&
            error.name ===
            "AbortError"
        ){
            return;
        }
    }

    /*
      Fallback
    */

    try{

        await navigator.clipboard.writeText(
            shareText
        );

        showSuccess(
            "Share text/link copy হয়েছে।"
        );

    }catch(error){

        showError(
            "Share করা যায়নি।"
        );
    }
}

/* =========================================================
   EMOJI
========================================================= */

function addEmoji(){

    const emojis = [
        "😀",
        "😂",
        "😍",
        "🥰",
        "😎",
        "👍",
        "❤️",
        "🔥",
        "😊",
        "🙏",
        "😢",
        "😮",
        "🎉",
        "👏",
        "💚"
    ];

    const emoji =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];

    insertTextAtCursor(
        emoji
    );
}


function insertTextAtCursor(text){

    const start =
        messageInput.selectionStart;

    const end =
        messageInput.selectionEnd;

    const value =
        messageInput.value;

    messageInput.value =
        value.substring(
            0,
            start
        ) +
        text +
        value.substring(
            end
        );

    messageInput.focus();

    const cursor =
        start +
        text.length;

    messageInput.selectionStart =
        cursor;

    messageInput.selectionEnd =
        cursor;

    autoResizeTextarea();
}


/* =========================================================
   TEXTAREA
========================================================= */

function autoResizeTextarea(){

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            110
        ) +
        "px";
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel =
            null;
    }

    realtimeChannel =
        supabaseClient
            .channel(
                "messages-" +
                conversationId +
                "-" +
                crypto.randomUUID()
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages",
                    filter:
                        `conversation_id=eq.${conversationId}`
                },
                payload=>{

                    const message =
                        payload.new;

                    if(
                        message.sender_id ===
                        currentUserId
                    ){
                        /*
                          Already appended locally.
                        */

                        messageCache.set(
                            message.id,
                            message
                        );

                        return;
                    }

                    appendSingleMessage(
                        message,
                        true
                    );
                }
            )
            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"messages",
                    filter:
                        `conversation_id=eq.${conversationId}`
                },
                payload=>{

                    updateMessageInPlace(
                        payload.new
                    );
                }
            )
            .subscribe(
                status=>{

                    console.log(
                        "Realtime:",
                        status
                    );
                }
            );
}


/* =========================================================
   MARK RECEIVED MESSAGES READ
========================================================= */

async function markReceivedMessagesRead(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from("messages")
            .select("id")
            .eq(
                "conversation_id",
                conversationId
            )
            .eq(
                "sender_id",
                otherUserId
            )
            .eq(
                "is_read",
                false
            );

        if(error){
            console.warn(error);
            return;
        }

        const ids =
            (data || [])
                .map(
                    row =>
                        row.id
                );

        if(!ids.length){
            return;
        }

        await supabaseClient
            .from("messages")
            .update({
                is_read:true
            })
            .in(
                "id",
                ids
            );

    }catch(error){

        console.warn(
            "Mark read:",
            error
        );
    }
}


/* =========================================================
   INITIALIZE
========================================================= */

async function startMessagePage(){

    try{

        disableComposer();

        otherUserId =
            getTargetUserId();

        if(!otherUserId){

            messagesInner.innerHTML =
                `<div class="empty">
                    User ID পাওয়া যায়নি।<br><br>
                    chat.html থেকে user parameter দিয়ে
                    messages.html খুলতে হবে।
                </div>`;

            showError(
                "URL-এ user ID নেই।"
            );

            return;
        }

        const {
            data:userData,
            error:userError
        } =
        await supabaseClient
            .auth
            .getUser();

        if(userError){
            throw userError;
        }

        if(!userData?.user){

            messagesInner.innerHTML =
                `<div class="empty">
                    আগে RAZTARA-তে Login করুন।
                </div>`;

            showError(
                "আপনি Login করা নেই।"
            );

            return;
        }

        currentUser =
            userData.user;

        currentUserId =
            currentUser.id;

        if(
            currentUserId ===
            otherUserId
        ){

            throw new Error(
                "নিজের সাথে conversation করা যাবে না।"
            );
        }

        await loadOtherProfile();

        await loadHiddenMessageIds();

        conversationId =
            await getOrCreateConversation();

        if(!conversationId){

            throw new Error(
                "Conversation তৈরি/খুঁজে পাওয়া যায়নি।"
            );
        }

        await loadMessages();

        subscribeRealtime();

        await markReceivedMessagesRead();

        isPageReady =
            true;

        enableComposer();

        headerStatus.textContent =
            "অনলাইন";

    }catch(error){

        console.error(
            "Message page error:",
            error
        );

        isPageReady =
            false;

        disableComposer();

        messagesInner.innerHTML =
            `<div class="empty">
                মেসেজ পেজ চালু করা যায়নি।<br><br>
                ${escapeHtml(
                    error.message ||
                    "Unknown error"
                )}
            </div>`;

        showError(
            error.message ||
            "Message page চালু করা যায়নি।"
        );
    }
}


/* =========================================================
   COMPOSER ENABLE / DISABLE
========================================================= */

function disableComposer(){

    sendBtn.disabled =
        true;

    fileBtn.disabled =
        true;

    voiceBtn.disabled =
        true;

    emojiBtn.disabled =
        true;

    messageInput.disabled =
        true;
}


function enableComposer(){

    sendBtn.disabled =
        false;

    fileBtn.disabled =
        false;

    voiceBtn.disabled =
        false;

    emojiBtn.disabled =
        false;

    messageInput.disabled =
        false;
}


/* =========================================================
   EVENTS
========================================================= */

backBtn.addEventListener(
    "click",
    ()=>{
        if(
            window.history.length > 1
        ){
            window.history.back();
        }else{
            window.location.href =
                "chat.html";
        }
    }
);


sendBtn.addEventListener(
    "click",
    sendText
);


messageInput.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendText();
        }
    }
);


messageInput.addEventListener(
    "input",
    autoResizeTextarea
);


emojiBtn.addEventListener(
    "click",
    addEmoji
);


fileBtn.addEventListener(
    "click",
    ()=>{
        fileInput.value =
            "";
        fileInput.click();
    }
);


fileInput.addEventListener(
    "change",
    async ()=>{
        const file =
            fileInput.files?.[0];

        if(file){
            await uploadFile(file);
        }

        fileInput.value =
            "";
    }
);


voiceBtn.addEventListener(
    "click",
    startVoiceRecording
);


voiceStop.addEventListener(
    "click",
    stopVoiceRecording
);


voiceCancel.addEventListener(
    "click",
    cancelVoiceRecording
);


shareBtn.addEventListener(
    "click",
    shareMessage
);


deleteMeBtn.addEventListener(
    "click",
    deleteOnlyMe
);


deleteAllBtn.addEventListener(
    "click",
    deleteForEveryone
);


previewClose.addEventListener(
    "click",
    closePreview
);


preview.addEventListener(
    "click",
    event=>{

        if(
            event.target ===
            preview
        ){
            closePreview();
        }
    }
);


/*
  Menu itself must not close
  when clicking inside it.
*/

messageMenu.addEventListener(
    "click",
    event=>{
        event.stopPropagation();
    }
);


/*
  Outside click closes menu.
*/

document.addEventListener(
    "click",
    event=>{

        if(
            !messageMenu.contains(
                event.target
            )
        ){
            closeMessageMenu();
        }
    }
);


/*
  Escape closes preview/menu.
*/

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "Escape"
        ){

            closeMessageMenu();
            closePreview();
        }
    }
);


/*
  When page becomes visible,
  update read status.
*/

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(
            !document.hidden &&
            isPageReady
        ){
            markReceivedMessagesRead();
        }
    }
);


/* =========================================================
   START
========================================================= */

startMessagePage();

</script>
