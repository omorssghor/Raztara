<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Settings | RAZTARA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    overflow-x:hidden;
    overflow-y:auto;
}

body{

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#07131a;
    color:#fff;

    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    -webkit-overflow-scrolling:touch;
}

button{
    font:inherit;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    width:100%;
    height:68px;

    display:flex;
    align-items:center;

    gap:14px;

    padding:
        0
        16px;

    background:#0a1b23;

    border-bottom:
        1px solid #193039;

    position:sticky;
    top:0;

    z-index:20;
}

.backBtn{

    width:42px;
    height:42px;

    flex:none;

    border:0;
    border-radius:50%;

    background:#102b34;

    color:#fff;

    font-size:23px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.backBtn:active{
    transform:scale(.94);
}

.headerTitle{

    font-size:20px;

    font-weight:800;

    white-space:nowrap;
}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:100%;

    padding:
        20px
        14px
        80px;

    min-height:
        calc(100vh - 68px);
}


/* =====================================================
   SECTION TITLE
===================================================== */

.sectionTitle{

    margin:
        10px
        8px
        10px;

    color:#78919a;

    font-size:12px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =====================================================
   SETTINGS BOX
===================================================== */

.settingsBox{

    width:100%;

    background:#0a1c24;

    border:
        1px solid #193039;

    border-radius:18px;

    overflow:hidden;

    margin-bottom:24px;
}


/* =====================================================
   SETTING ITEM
===================================================== */

.settingItem{

    width:100%;

    min-height:70px;

    display:flex;

    align-items:center;

    gap:14px;

    padding:
        12px
        15px;

    border:0;

    border-bottom:
        1px solid #193039;

    background:transparent;

    color:#fff;

    text-align:left;

    appearance:none;

    -webkit-appearance:none;
}

.settingItem:last-child{
    border-bottom:0;
}

.settingItem:active{
    background:#102b34;
}


/* =====================================================
   ICON
===================================================== */

.settingIcon{

    width:43px;
    height:43px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:#102b34;

    font-size:21px;
}


/* =====================================================
   TEXT
===================================================== */

.settingText{

    flex:1;

    min-width:0;
}

.settingName{

    font-size:15px;

    font-weight:700;

    line-height:1.3;
}

.settingDescription{

    margin-top:4px;

    color:#718b94;

    font-size:12px;

    line-height:1.45;
}


/* =====================================================
   ARROW
===================================================== */

.arrow{

    flex:none;

    color:#718b94;

    font-size:24px;

    line-height:1;
}


/* =====================================================
   LANGUAGE
===================================================== */

.languageItem{

    cursor:pointer;
}

.languageValue{

    flex:none;

    color:#00d4a5;

    font-size:12px;

    font-weight:700;

    max-width:65px;

    text-align:right;
}


/* =====================================================
   LOGOUT
===================================================== */

.logoutItem{

    color:#ff8b8b;
}

.logoutItem .settingIcon{

    background:
        rgba(255,70,70,.10);
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    color:#506b74;

    font-size:12px;

    margin-top:35px;

    line-height:1.7;

    padding-bottom:20px;
}


/* =====================================================
   LANGUAGE MODAL
===================================================== */

#languageModal{

    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    background:
        rgba(0,0,0,.68);

    align-items:flex-end;

    justify-content:center;

    padding:0;
}

.languagePanel{

    width:100%;

    max-width:520px;

    background:#0a1c24;

    border-top:
        1px solid #284650;

    border-radius:
        22px
        22px
        0
        0;

    padding:
        20px
        16px
        calc(20px + env(safe-area-inset-bottom));

    box-shadow:
        0 -15px 45px
        rgba(0,0,0,.45);
}

.languagePanelTitle{

    font-size:18px;

    font-weight:800;

    margin-bottom:15px;
}

.languageOption{

    width:100%;

    min-height:58px;

    display:flex;

    align-items:center;

    gap:13px;

    padding:
        12px
        14px;

    margin-top:9px;

    border:
        1px solid #193039;

    border-radius:14px;

    background:#10252e;

    color:#fff;

    text-align:left;
}

.languageOption:active{
    background:#15333d;
}

.languageFlag{

    font-size:23px;

    width:32px;

    text-align:center;
}

.languageName{

    flex:1;

    font-size:15px;

    font-weight:700;
}

.check{

    width:25px;

    text-align:center;

    color:#00d4a5;

    font-size:20px;

    font-weight:800;
}


/* =====================================================
   MESSAGE
===================================================== */

#toast{

    position:fixed;

    left:50%;

    bottom:
        calc(25px + env(safe-area-inset-bottom));

    transform:
        translate(-50%,20px);

    z-index:200;

    max-width:
        calc(100% - 30px);

    padding:
        12px
        16px;

    border-radius:12px;

    background:#102b34;

    border:
        1px solid #284650;

    color:#fff;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    text-align:center;
}

#toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-width:360px){

    .container{

        padding-left:10px;
        padding-right:10px;
        padding-bottom:80px;
    }

    .settingItem{

        gap:11px;

        padding-left:12px;
        padding-right:12px;
    }

    .settingIcon{

        width:40px;
        height:40px;
    }

    .settingName{
        font-size:14px;
    }

    .settingDescription{
        font-size:11px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <button
        class="backBtn"
        type="button"
        onclick="goBack()"
        aria-label="Back"
    >
        ←
    </button>

    <div
        class="headerTitle"
        id="pageTitle"
    >
        ⚙️ Settings
    </div>

</header>


<!-- =====================================================
     MAIN SETTINGS
===================================================== -->

<main class="container">


    <!-- ================= PRIVACY ================= -->

    <div
        class="sectionTitle"
        id="privacySection"
    >
        Privacy
    </div>


    <div class="settingsBox">

        <button
            class="settingItem"
            type="button"
            onclick="openProfilePrivacy()"
        >

            <div class="settingIcon">
                👤
            </div>

            <div class="settingText">

                <div
                    class="settingName"
                    id="profilePrivacyName"
                >
                    Profile Privacy
                </div>

                <div
                    class="settingDescription"
                    id="profilePrivacyDescription"
                >
                    আপনার Profile, Photo, Email, Phone ও Address কে দেখতে পারবে
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>



    <!-- ================= ACCOUNT ================= -->

    <div
        class="sectionTitle"
        id="accountSection"
    >
        Account
    </div>


    <div class="settingsBox">


        <!-- PROFILE -->

        <button
            class="settingItem"
            type="button"
            onclick="openProfile()"
        >

            <div class="settingIcon">
                👤
            </div>

            <div class="settingText">

                <div
                    class="settingName"
                    id="profileName"
                >
                    Profile
                </div>

                <div
                    class="settingDescription"
                    id="profileDescription"
                >
                    আপনার Profile তথ্য পরিবর্তন করুন
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>


        <!-- SECURITY -->

        <button
            class="settingItem"
            type="button"
            onclick="showComingSoon('security')"
        >

            <div class="settingIcon">
                🔐
            </div>

            <div class="settingText">

                <div
                    class="settingName"
                    id="securityName"
                >
                    Security
                </div>

                <div
                    class="settingDescription"
                    id="securityDescription"
                >
                    Password ও Account security
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>



    <!-- ================= APP ================= -->

    <div
        class="sectionTitle"
        id="appSection"
    >
        App
    </div>


    <div class="settingsBox">


        <!-- LANGUAGE -->

        <button
            class="settingItem languageItem"
            type="button"
            onclick="openLanguageModal()"
        >

            <div class="settingIcon">
                🌐
            </div>

            <div class="settingText">

                <div
                    class="settingName"
                    id="languageName"
                >
                    Language / ভাষা
                </div>

                <div
                    class="settingDescription"
                    id="languageDescription"
                >
                    RAZTARA-এর ভাষা পরিবর্তন করুন
                </div>

            </div>

            <div
                class="languageValue"
                id="currentLanguage"
            >
                বাংলা
            </div>

            <div class="arrow">
                ›
            </div>

        </button>


        <!-- NOTIFICATIONS -->

        <button
            class="settingItem"
            type="button"
            onclick="showComingSoon('notifications')"
        >

            <div class="settingIcon">
                🔔
            </div>

            <div class="settingText">

                <div
                    class="settingName"
                    id="notificationsName"
                >
                    Notifications
                </div>

                <div
                    class="settingDescription"
                    id="notificationsDescription"
                >
                    Notification settings
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>


        <!-- ABOUT -->

        <button
            class="settingItem"
            type="button"
            onclick="showComingSoon('about')"
        >

            <div class="settingIcon">
                ℹ️
            </div>

            <div class="settingText">

                <div
                    class="settingName"
                    id="aboutName"
                >
                    About RAZTARA
                </div>

                <div
                    class="settingDescription"
                    id="aboutDescription"
                >
                    RAZTARA সম্পর্কে তথ্য
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>



    <!-- ================= ACCOUNT / LOGOUT ================= -->

    <div
        class="sectionTitle"
        id="accountSection2"
    >
        Account
    </div>


    <div class="settingsBox">

        <button
            class="settingItem logoutItem"
            type="button"
            onclick="logout()"
        >

            <div class="settingIcon">
                🚪
            </div>

            <div class="settingText">

                <div
                    class="settingName"
                    id="logoutName"
                >
                    Logout
                </div>

                <div
                    class="settingDescription"
                    id="logoutDescription"
                >
                    এই Account থেকে Logout করুন
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>



    <!-- ================= FOOTER ================= -->

    <div
        class="footer"
        id="footerText"
    >
        RAZTARA<br>
        Connect • Call • Share
    </div>

</main>



<!-- =====================================================
     LANGUAGE MODAL
===================================================== -->

<div
    id="languageModal"
    onclick="closeLanguageModal(event)"
>


    <div
        class="languagePanel"
        onclick="event.stopPropagation()"
    >


        <div
            class="languagePanelTitle"
            id="languagePanelTitle"
        >
            🌐 ভাষা নির্বাচন করুন
        </div>


        <!-- BANGLA -->

        <button
            class="languageOption"
            type="button"
            onclick="changeLanguage('bn')"
        >

            <div class="languageFlag">
                🇧🇩
            </div>

            <div class="languageName">
                বাংলা
            </div>

            <div
                class="check"
                id="checkBn"
            ></div>

        </button>


        <!-- ENGLISH -->

        <button
            class="languageOption"
            type="button"
            onclick="changeLanguage('en')"
        >

            <div class="languageFlag">
                🇬🇧
            </div>

            <div class="languageName">
                English
            </div>

            <div
                class="check"
                id="checkEn"
            ></div>

        </button>

    </div>

</div>



<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast"></div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   LANGUAGE
===================================================== */

const LANGUAGE_KEY =
    "raztara_language";


let currentLanguage =
    localStorage.getItem(
        LANGUAGE_KEY
    ) || "bn";


const translations = {

    bn: {

        title:
            "⚙️ Settings",

        privacy:
            "Privacy",

        profilePrivacy:
            "Profile Privacy",

        profilePrivacyDescription:
            "আপনার Profile, Photo, Email, Phone ও Address কে দেখতে পারবে",

        account:
            "Account",

        profile:
            "Profile",

        profileDescription:
            "আপনার Profile তথ্য পরিবর্তন করুন",

        security:
            "Security",

        securityDescription:
            "Password ও Account security",

        app:
            "App",

        language:
            "Language / ভাষা",

        languageDescription:
            "RAZTARA-এর ভাষা পরিবর্তন করুন",

        notifications:
            "Notifications",

        notificationsDescription:
            "Notification settings",

        about:
            "About RAZTARA",

        aboutDescription:
            "RAZTARA সম্পর্কে তথ্য",

        logout:
            "Logout",

        logoutDescription:
            "এই Account থেকে Logout করুন",

        selectLanguage:
            "🌐 ভাষা নির্বাচন করুন",

        selectedLanguage:
            "বাংলা",

        securityComing:
            "Security এখনো তৈরি করা হয়নি।",

        notificationsComing:
            "Notifications এখনো তৈরি করা হয়নি।",

        aboutComing:
            "About RAZTARA এখনো তৈরি করা হয়নি।",

        logoutConfirm:
            "আপনি কি Logout করতে চান?"

    },


    en: {

        title:
            "⚙️ Settings",

        privacy:
            "Privacy",

        profilePrivacy:
            "Profile Privacy",

        profilePrivacyDescription:
            "Control who can see your profile, photo, email, phone and address",

        account:
            "Account",

        profile:
            "Profile",

        profileDescription:
            "Edit your profile information",

        security:
            "Security",

        securityDescription:
            "Password and account security",

        app:
            "App",

        language:
            "Language",

        languageDescription:
            "Change the RAZTARA language",

        notifications:
            "Notifications",

        notificationsDescription:
            "Notification settings",

        about:
            "About RAZTARA",

        aboutDescription:
            "Information about RAZTARA",

        logout:
            "Logout",

        logoutDescription:
            "Log out from this account",

        selectLanguage:
            "🌐 Select Language",

        selectedLanguage:
            "English",

        securityComing:
            "Security is not available yet.",

        notificationsComing:
            "Notifications are not available yet.",

        aboutComing:
            "About RAZTARA is not available yet.",

        logoutConfirm:
            "Do you want to logout?"

    }

};


/* =====================================================
   APPLY LANGUAGE
===================================================== */

function applyLanguage(){

    const t =
        translations[currentLanguage];


    document.documentElement.lang =
        currentLanguage;


    document.getElementById(
        "pageTitle"
    ).textContent =
        t.title;


    document.getElementById(
        "privacySection"
    ).textContent =
        t.privacy;


    document.getElementById(
        "profilePrivacyName"
    ).textContent =
        t.profilePrivacy;


    document.getElementById(
        "profilePrivacyDescription"
    ).textContent =
        t.profilePrivacyDescription;


    document.getElementById(
        "accountSection"
    ).textContent =
        t.account;


    document.getElementById(
        "profileName"
    ).textContent =
        t.profile;


    document.getElementById(
        "profileDescription"
    ).textContent =
        t.profileDescription;


    document.getElementById(
        "securityName"
    ).textContent =
        t.security;


    document.getElementById(
        "securityDescription"
    ).textContent =
        t.securityDescription;


    document.getElementById(
        "appSection"
    ).textContent =
        t.app;


    document.getElementById(
        "languageName"
    ).textContent =
        t.language;


    document.getElementById(
        "languageDescription"
    ).textContent =
        t.languageDescription;


    document.getElementById(
        "notificationsName"
    ).textContent =
        t.notifications;


    document.getElementById(
        "notificationsDescription"
    ).textContent =
        t.notificationsDescription;


    document.getElementById(
        "aboutName"
    ).textContent =
        t.about;


    document.getElementById(
        "aboutDescription"
    ).textContent =
        t.aboutDescription;


    document.getElementById(
        "logoutName"
    ).textContent =
        t.logout;


    document.getElementById(
        "logoutDescription"
    ).textContent =
        t.logoutDescription;


    document.getElementById(
        "accountSection2"
    ).textContent =
        t.account;


    document.getElementById(
        "languagePanelTitle"
    ).textContent =
        t.selectLanguage;


    document.getElementById(
        "currentLanguage"
    ).textContent =
        t.selectedLanguage;


    updateLanguageCheck();

}


/* =====================================================
   CHANGE LANGUAGE
===================================================== */

function changeLanguage(language){

    if(
        language !== "bn" &&
        language !== "en"
    ){

        return;

    }


    currentLanguage =
        language;


    localStorage.setItem(
        LANGUAGE_KEY,
        currentLanguage
    );


    applyLanguage();


    closeLanguageModal();

}


/* =====================================================
   LANGUAGE CHECK
===================================================== */

function updateLanguageCheck(){

    const checkBn =
        document.getElementById(
            "checkBn"
        );

    const checkEn =
        document.getElementById(
            "checkEn"
        );


    checkBn.textContent = "";

    checkEn.textContent = "";


    if(currentLanguage === "bn"){

        checkBn.textContent =
            "✓";

    }else{

        checkEn.textContent =
            "✓";

    }

}


/* =====================================================
   LANGUAGE MODAL
===================================================== */

function openLanguageModal(){

    document.getElementById(
        "languageModal"
    ).style.display =
        "flex";

}


function closeLanguageModal(event){

    if(
        event &&
        event.target !==
        document.getElementById(
            "languageModal"
        )
    ){

        return;

    }


    document.getElementById(
        "languageModal"
    ).style.display =
        "none";

}


/* =====================================================
   PROFILE PRIVACY
===================================================== */

function openProfilePrivacy(){

    window.location.href =
        "profile-privacy.html";

}


/* =====================================================
   PROFILE
===================================================== */

function openProfile(){

    window.location.href =
        "profile.html";

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


/* =====================================================
   COMING SOON
===================================================== */

function showComingSoon(type){

    const t =
        translations[currentLanguage];


    if(type === "security"){

        showToast(
            t.securityComing
        );

    }


    if(type === "notifications"){

        showToast(
            t.notificationsComing
        );

    }


    if(type === "about"){

        showToast(
            t.aboutComing
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   REAL SUPABASE LOGOUT
===================================================== */

async function logout(){

    const t =
        translations[currentLanguage];


    const confirmed =
        confirm(
            t.logoutConfirm
        );


    if(!confirmed){

        return;

    }


    try{

        const { error } =
            await supabaseClient.auth.signOut();


        if(error){

            console.error(
                "Logout error:",
                error
            );

            showToast(
                currentLanguage === "bn"
                ?
                "Logout করা যায়নি।"
                :
                "Logout failed."
            );

            return;

        }


        window.location.replace(
            "index.html"
        );


    }catch(error){

        console.error(
            "Logout error:",
            error
        );

        showToast(
            currentLanguage === "bn"
            ?
            "Logout করা যায়নি।"
            :
            "Logout failed."
        );

    }

}


/* =====================================================
   START
===================================================== */

applyLanguage();

</script>

</body>
</html>
