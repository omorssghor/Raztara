<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | RAZTARA</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#07131a;
    color:#fff;
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    height:68px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;

    background:#0a1b23;
    border-bottom:1px solid #193039;

    position:sticky;
    top:0;
    z-index:10;
}

.backBtn{
    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:#102b34;
    color:#fff;

    font-size:22px;

    cursor:pointer;
}

.headerTitle{
    font-size:20px;
    font-weight:800;
}

/* ================= CONTENT ================= */

.container{
    padding:20px 14px 40px;
}

.sectionTitle{
    margin:10px 8px 10px;

    color:#78919a;

    font-size:12px;
    font-weight:700;

    text-transform:uppercase;
    letter-spacing:1px;
}

/* ================= SETTINGS ITEM ================= */

.settingsBox{
    background:#0a1c24;

    border:1px solid #193039;

    border-radius:18px;

    overflow:hidden;

    margin-bottom:24px;
}

.settingItem{
    width:100%;

    min-height:68px;

    display:flex;
    align-items:center;

    gap:14px;

    padding:12px 15px;

    border:0;
    border-bottom:1px solid #193039;

    background:transparent;

    color:#fff;

    text-align:left;

    cursor:pointer;
}

.settingItem:last-child{
    border-bottom:0;
}

.settingItem:hover{
    background:#102b34;
}

.settingIcon{
    width:43px;
    height:43px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:#102b34;

    font-size:21px;
}

.settingText{
    flex:1;
    min-width:0;
}

.settingName{
    font-size:15px;
    font-weight:700;
}

.settingDescription{
    margin-top:4px;

    color:#718b94;

    font-size:12px;
    line-height:1.4;
}

.arrow{
    color:#718b94;
    font-size:22px;
}

/* ================= DANGER ================= */

.logoutItem{
    color:#ff8b8b;
}

.logoutItem .settingIcon{
    background:rgba(255,70,70,.10);
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;

    color:#506b74;

    font-size:12px;

    margin-top:35px;
    line-height:1.7;
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <button
        class="backBtn"
        type="button"
        onclick="goBack()"
        aria-label="Back"
    >
        ←
    </button>

    <div class="headerTitle">
        ⚙️ Settings
    </div>

</header>


<!-- ================= SETTINGS ================= -->

<main class="container">

    <!-- PRIVACY -->

    <div class="sectionTitle">
        Privacy
    </div>

    <div class="settingsBox">

        <button
            class="settingItem"
            type="button"
            onclick="openProfilePrivacy()"
        >

            <div class="settingIcon">
                👤
            </div>

            <div class="settingText">

                <div class="settingName">
                    Profile Privacy
                </div>

                <div class="settingDescription">
                    আপনার Profile, Photo, Email, Phone ও Address কে দেখতে পারবে
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>


    <!-- ACCOUNT -->

    <div class="sectionTitle">
        Account
    </div>

    <div class="settingsBox">

        <button
            class="settingItem"
            type="button"
            onclick="openProfile()"
        >

            <div class="settingIcon">
                👤
            </div>

            <div class="settingText">

                <div class="settingName">
                    Profile
                </div>

                <div class="settingDescription">
                    আপনার Profile তথ্য পরিবর্তন করুন
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>


        <button
            class="settingItem"
            type="button"
            onclick="showComingSoon('Security')"
        >

            <div class="settingIcon">
                🔐
            </div>

            <div class="settingText">

                <div class="settingName">
                    Security
                </div>

                <div class="settingDescription">
                    Password ও Account security
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>


    <!-- APP -->

    <div class="sectionTitle">
        App
    </div>

    <div class="settingsBox">

        <button
            class="settingItem"
            type="button"
            onclick="showComingSoon('Notifications')"
        >

            <div class="settingIcon">
                🔔
            </div>

            <div class="settingText">

                <div class="settingName">
                    Notifications
                </div>

                <div class="settingDescription">
                    Notification settings
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>


        <button
            class="settingItem"
            type="button"
            onclick="showComingSoon('About RAZTARA')"
        >

            <div class="settingIcon">
                ℹ️
            </div>

            <div class="settingText">

                <div class="settingName">
                    About RAZTARA
                </div>

                <div class="settingDescription">
                    RAZTARA সম্পর্কে তথ্য
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>


    <!-- LOGOUT -->

    <div class="sectionTitle">
        Account
    </div>

    <div class="settingsBox">

        <button
            class="settingItem logoutItem"
            type="button"
            onclick="logout()"
        >

            <div class="settingIcon">
                🚪
            </div>

            <div class="settingText">

                <div class="settingName">
                    Logout
                </div>

                <div class="settingDescription">
                    এই Account থেকে Logout করুন
                </div>

            </div>

            <div class="arrow">
                ›
            </div>

        </button>

    </div>


    <div class="footer">
        RAZTARA<br>
        Connect • Call • Share
    </div>

</main>


<script>

/* ================= NAVIGATION ================= */

function openProfilePrivacy(){

    window.location.href =
        "profile-privacy.html";

}


function openProfile(){

    window.location.href =
        "profile.html";

}


function goBack(){

    if(document.referrer){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


/* ================= COMING SOON ================= */

function showComingSoon(name){

    alert(
        name +
        " এখনো তৈরি করা হয়নি।"
    );

}


/* ================= LOGOUT ================= */

async function logout(){

    const confirmLogout =
        confirm(
            "আপনি কি Logout করতে চান?"
        );

    if(!confirmLogout){

        return;

    }

    try{

        if(window.supabase){

            // Supabase client is not loaded on this page.
            // Clear local Supabase session manually.
            Object.keys(localStorage)
                .filter(key =>
                    key.includes("supabase")
                )
                .forEach(key =>
                    localStorage.removeItem(key)
                );

        }

    }catch(error){

        console.error(error);

    }

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
