<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>RAZTARA — Chat Menu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4fbf8;color:#18352d}
.page{height:100dvh;display:flex;flex-direction:column}
.header{height:calc(70px + env(safe-area-inset-top));min-height:calc(70px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;background:#087f5b;color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.back{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:28px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#d9eee7;flex:none}
.headInfo{min-width:0}.name{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;margin-top:3px;opacity:.9}
.scroll{flex:1;overflow-y:auto;padding:12px 0 calc(20px + env(safe-area-inset-bottom))}
.option{width:100%;min-height:64px;padding:13px 18px;border:0;border-bottom:1px solid rgba(8,127,91,.09);background:transparent;text-align:left;color:#18352d;font-size:16px;font-weight:700}
.option:active{background:rgba(8,127,91,.07)}
.danger{color:#b42318}
.small{font-size:13px;color:#647a72;font-weight:500;margin-top:3px}
.hidden{display:none}
</style>
</head>
<body>
<div class="page">
<header class="header">
<button class="back" onclick="goBack()">‹</button>
<img id="avatar" class="avatar" src="https://i.pravatar.cc/100?img=12" alt="">
<div class="headInfo"><div id="name" class="name">RAZTARA User</div><div id="status" class="status">Last seen</div></div>
</header>
<main class="scroll">
<button class="option" onclick="openProfileDetails()">Profile detail<div class="small">User-এর অনুমতি অনুযায়ী profile তথ্য দেখা যাবে</div></button>
<button class="option" onclick="openBackground()">Background<div class="small">এই chat-এর background পরিবর্তন করুন</div></button>
<button class="option" onclick="openGallery()">Gallery<div class="small">এই দুই user-এর ছবি, ভিডিও, voice ও file</div></button>
<button class="option" onclick="blockUser()" id="blockBtn">Block user<div class="small">Block করলে chat ও profile দেখা বন্ধ থাকবে</div></button>
<button class="option" onclick="openPrivacy()">RAZTARA Privacy<div class="small">RAZTARA ব্যবহার ও privacy সম্পর্কে নির্দেশনা</div></button>
<button class="option" onclick="logout()" >Logout</button>
</main>
</div>
<input id="bgInput" class="hidden" type="file" accept="image/*" onchange="saveBackground(this)">
<script>
const supabaseClient=supabase.createClient(
"https://pqyicaqpmojijjskpzcp.supabase.co",
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho"
);
const params=new URLSearchParams(location.search);
const userId=params.get("user")||params.get("user_id")||params.get("id");
let currentUser=null;

async function init(){
  try{
  const s=await supabaseClient.auth.getSession();
  currentUser=s.data?.session?.user||null;
  if(!currentUser){location.href="index.html";return}
  if(!userId)return;
  const r=await supabaseClient.from("profiles").select("*").eq("id",userId).maybeSingle();
  if(r.data){
    document.getElementById("name").textContent=r.data.full_name||r.data.username||"RAZTARA User";
    if(r.data.avatar_url)document.getElementById("avatar").src=r.data.avatar_url;
  }
  }catch(error){
    console.error("Chat menu init error:",error);
  }
}
function chatUrl(){return "chat.html?user="+encodeURIComponent(userId||"")}
function goBack(){if(history.length>1)history.back();else location.href=chatUrl()}
function openProfileDetails(){
  if(!userId){alert("User ID পাওয়া যায়নি।");return;}
  window.location.assign("user-profile.html?user="+encodeURIComponent(userId));
}
function openGallery(){
  if(!userId){alert("User ID পাওয়া যায়নি।");return;}
  window.location.assign("gallery.html?user="+encodeURIComponent(userId));
}
function openPrivacy(){window.location.assign("privacy.html?from=chat&user="+encodeURIComponent(userId||""));}
function openSettings(){location.href="settings.html"}
function openBackground(){
  const input=document.getElementById("bgInput");
  if(!input){alert("Background option পাওয়া যায়নি।");return;}
  input.value="";
  input.click();
}
function saveBackground(input){
 const file=input.files?.[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=e=>{
  const img=new Image();
  img.onload=()=>{
   const max=1600, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
   const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(img.naturalWidth*scale));cv.height=Math.max(1,Math.round(img.naturalHeight*scale));
   cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
   const data=cv.toDataURL("image/jpeg",.82);
   localStorage.setItem("raztara_chat_background_user_"+userId,data);
   localStorage.setItem("raztara_chat_background_"+userId,data);
   input.value="";
   window.location.replace(chatUrl());
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}
async function blockUser(){
 if(!currentUser||!userId)return;
 if(!confirm("আপনি কি এই User-কে Block করতে চান?"))return;
 const {error}=await supabaseClient.from("blocked_users").insert({blocker_id:currentUser.id,blocked_id:userId});
 if(error){alert(error.message);return}
 location.href="index.html";
}
async function logout(){

  const {error} =
    await supabaseClient.auth.signOut();

  if(error){
    alert(error.message);
    return;
  }

  location.replace("index.html");

}
init();
</script>
</body>
</html>
