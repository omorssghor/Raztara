<!DOCTYPE html>
<html lang="bn">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

#authScreen{

.logo{

.authBox h1{text-align:center;color:#087f5b}
.authBox p{text-align:center;color:#777;margin:6px 0 22px}
.field{margin-bottom:12px}
.field input,.field textarea{

}

.sectionTitle{font-size:21px;font-weight:800;margin:10px 0 15px}

.bottomNav{

.bottomNav button.active{color:#087f5b;font-weight:800}
.bottomNav span{display:block;font-size:23px;margin-bottom:2px}

.profileBox{
  background:white;border-radius:20px;padding:22px;text-align:center;
}
.profileLarge{
  width:95px;height:95px;border-radius:50%;object-fit:cover;
  background:#087f5b;color:white;margin:auto;display:flex;

}
.profileBox input,.profileBox textarea{
  width:100%;margin-top:10px;padding:13px;border:1px solid #ddd;

}

#chatScreen{
  position:fixed;inset:0;background:#f3f6f5;z-index:50;display:none;
  flex-direction:column;
}
.chatHeader{
  height:64px;background:white;border-bottom:1px solid #ddd;
  display:flex;align-items:center;gap:10px;padding:0 10px;
}
.chatHeader .info{flex:1}
.chatHeader .info strong{display:block}
.chatHeader .info small{color:#777}
.iconBtn{
  width:40px;height:40px;border-radius:50%;background:#eef5f2;

}
.messages{

}
.msg{
  max-width:78%;padding:10px 12px;border-radius:16px;margin:5px 0;
  word-break:break-word;
}
.msg.me{
  margin-left:auto;background:#087f5b;color:white;border-bottom-right-radius:4px;
}
.msg.other{

}
.msg small{display:block;font-size:10px;opacity:.65;margin-top:4px}
.msg img,.msg video{max-width:100%;border-radius:10px}
.msg audio{max-width:100%}
.chatComposer{
  background:white;border-top:1px solid #ddd;padding:8px;
  display:flex;align-items:center;gap:6px;
}
.chatComposer input{
  flex:1;border:0;background:#f1f3f2;border-radius:20px;
  padding:11px 14px;outline:none;
}
.chatComposer button{
  width:40px;height:40px;border-radius:50%;background:#087f5b;color:white;
}
.chatTools{display:flex;gap:4px}
.chatTools button{background:#eef5f2;color:#087f5b}

.callOverlay{
  position:fixed;inset:0;background:#101514;z-index:100;
  display:none;color:white;flex-direction:column;
}
.callTop{text-align:center;padding:25px}
.callTop .avatar{margin:auto;width:80px;height:80px}
.callTop h2{margin-top:10px}
.callTop p{color:#bfc8c5;margin-top:5px}
.callVideos{
  flex:1;position:relative;overflow:hidden;background:#080a09;
}
#callRemoteVideo{
  width:100%;height:100%;object-fit:cover;background:#080a09;
}
#callLocalVideo{
  position:absolute;right:15px;top:15px;width:120px;height:170px;
  object-fit:cover;border-radius:14px;border:2px solid white;background:#222;
}
.callControls{
  min-height:100px;display:flex;justify-content:center;align-items:center;
  gap:15px;background:#111;padding:20px;
}
.callControls button{
  width:58px;height:58px;border-radius:50%;background:#333;color:white;font-size:22px;
}
.callControls .danger{background:#d92d3b}
.callControls .accept{background:#087f5b}

.callItem{align-items:flex-start}
.callIcon{font-size:25px}
.callText{flex:1}
.callText strong{display:block}
.callText small{color:#777}
.callStatus{font-size:12px;color:#087f5b}

.toast{
  position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
  background:#17221e;color:white;padding:11px 17px;border-radius:12px;
  z-index:200;display:none;max-width:90%;text-align:center;

</style>

<div id="chatScreen">

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL =
  "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const $ = id => document.getElementById(id);

let currentUser = null;
let currentProfile = null;

let currentChatUser = null;
let currentConversationId = null;

let messageChannel = null;
let memberChannel = null;
let callChannel = null;
let callsChannel = null;

let mediaRecorder = null;
let audioChunks = [];
let recording = false;

let currentPage = "chats";

function toast(message){

  $("toast").textContent = message;
  $("toast").style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {
      $("toast").style.display = "none";
    }, 2500);
}

function initials(name){

  if(!name) return "R";

  return name
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function setAvatar(element,url,name){

  if(!element) return;

  if(url){

    element.innerHTML =
      `<img src="${url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;

  }else{

    element.textContent =
      initials(name);
  }
}

/* =========================
AUTH
========================= */

let loginMode = false;

$("switchButton").onclick = () => {

  loginMode = !loginMode;

  $("nameField").classList.toggle(
    "hidden",
    loginMode
  );

  $("usernameField").classList.toggle(
    "hidden",
    loginMode
  );

  $("authButton").textContent =
    loginMode ? "Login" : "Sign Up";

  $("switchText").textContent =
    loginMode
      ? "Don't have an account?"
      : "Already have an account?";

  $("switchButton").textContent =
    loginMode ? "Sign Up" : "Login";
};

$("authButton").onclick = async () => {

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if(!email || !password){

    toast("Email এবং password দিন");
    return;
  }

  try{

    $("authButton").disabled = true;

    if(loginMode){

      const {data,error} =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

      currentUser = data.user;

    }else{

      const fullName =
        $("fullName").value.trim();

      const username =
        $("username").value.trim()
          .toLowerCase()
          .replace(/[^a-z0-9_]/g,"");

      if(!fullName || !username){

        toast("নাম ও username দিন");
        return;
      }

      const {data,error} =
        await supabaseClient.auth.signUp({
          email,
          password
        });

      if(error) throw error;

      if(!data.user){

        toast("Account তৈরি হয়েছে। Email verify করুন।");
        return;
      }

      currentUser = data.user;

      const {error:profileError} =
        await supabaseClient
          .from("profiles")
          .upsert({
            id:data.user.id,
            full_name:fullName,
            username:username
          });

      if(profileError) throw profileError;

      toast("Account তৈরি হয়েছে");
    }

    await initializeApp();

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Login/Signup সমস্যা হয়েছে"
    );

  }finally{

    $("authButton").disabled = false;
  }
};

/* =========================
PROFILE
========================= */

async function loadProfile(){

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error) throw error;

  if(!data){

    const username =
      "user_" +
      currentUser.id
        .replace(/-/g,"")
        .slice(0,8);

    const {data:newProfile,error:createError} =
      await supabaseClient
        .from("profiles")
        .insert({
          id:currentUser.id,
          full_name:
            currentUser.email?.split("@")[0] ||
            "User",
          username
        })
        .select()
        .single();

    if(createError) throw createError;

    currentProfile = newProfile;

  }else{

    currentProfile = data;
  }

  renderProfile();
}

function renderProfile(){

  if(!currentProfile) return;

  $("topName").textContent =
    currentProfile.full_name ||
    currentProfile.username ||
    "";

  setAvatar(
    $("topAvatar"),
    currentProfile.avatar_url,
    currentProfile.full_name
  );

  setAvatar(
    $("profileAvatar"),
    currentProfile.avatar_url,
    currentProfile.full_name
  );

  $("editName").value =
    currentProfile.full_name || "";

  $("editUsername").value =
    currentProfile.username || "";

  $("editBio").value =
    currentProfile.bio || "";
}

$("saveProfileBtn").onclick = async () => {

  try{

    const username =
      $("editUsername").value
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_]/g,"");

    if(!username){

      toast("Username দিন");
      return;
    }

    const {data,error} =
      await supabaseClient
        .from("profiles")
        .update({
          full_name:
            $("editName").value.trim(),
          username,
          bio:
            $("editBio").value.trim(),
          updated_at:
            new Date().toISOString()
        })
        .eq("id",currentUser.id)
        .select()
        .single();

    if(error) throw error;

    currentProfile = data;

    renderProfile();

    toast("Profile saved");

  }catch(error){

    console.error(error);
    toast(error.message);
  }
};

/* =========================
PAGES
========================= */

function showPage(page){

  currentPage = page;

  ["chatsPage","callsPage","profilePage"]
    .forEach(id => $(id).classList.remove("active"));

  ["navChats","navCalls","navProfile"]
    .forEach(id => $(id).classList.remove("active"));

  if(page === "chats"){

    $("chatsPage").classList.add("active");
    $("navChats").classList.add("active");

  }else if(page === "calls"){

    $("callsPage").classList.add("active");
    $("navCalls").classList.add("active");

    loadCallsList();

  }else{

    $("profilePage").classList.add("active");
    $("navProfile").classList.add("active");
  }
}

$("navChats").onclick =
  () => showPage("chats");

$("navCalls").onclick =
  () => showPage("calls");

$("navProfile").onclick =
  () => showPage("profile");

/* =========================
SEARCH USERS
========================= */

let searchTimer;

$("searchInput").oninput = () => {

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(searchUsers,300);
};

async function searchUsers(){

  const q =
    $("searchInput").value.trim();

  if(!q){

    $("searchResults").innerHTML = "";
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .neq("id",currentUser.id)
      .or(
        `username.ilike.%${q}%,full_name.ilike.%${q}%`
      )
      .limit(15);

  if(error){

    console.error(error);
    return;
  }

  $("searchResults").innerHTML =
    (data || []).map(user => `

      <div class="userCard">

        <div class="avatar">
          ${
            user.avatar_url
            ? `<img src="${user.avatar_url}"
                 style="width:100%;height:100%;border-radius:50%;object-fit:cover">`
            : initials(user.full_name)
          }
        </div>

        <div class="userInfo">
          <strong>${escapeHtml(user.full_name || "User")}</strong>
          <small>@${escapeHtml(user.username || "")}</small>
        </div>

        <button class="cardBtn"
          onclick="openChatByUser('${user.id}')">
          Chat
        </button>

      </div>
    `).join("");
}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================
CONVERSATION
========================= */

async function getOrCreateConversation(
  otherUserId
){

  if(!currentUser) return null;

  const {data:myMemberships,error} =
    await supabaseClient
      .from("conversation_members")
      .select("conversation_id")
      .eq("user_id",currentUser.id);

  if(error) throw error;

  const ids =
    (myMemberships || [])
      .map(x => x.conversation_id);

  if(ids.length){

    const {data:matches,error:matchError} =
      await supabaseClient
        .from("conversation_members")
        .select("conversation_id,user_id")
        .in("conversation_id",ids)
        .eq("user_id",otherUserId);

    if(matchError) throw matchError;

    if(matches?.length){

      return matches[0].conversation_id;
    }
  }

  const {data:conversation,error:createError} =
    await supabaseClient
      .from("conversations")
      .insert({
        created_by:currentUser.id,
        is_group:false
      })
      .select()
      .single();

  if(createError) throw createError;

  const conversationId =
    conversation.id;

  const {error:memberError} =
    await supabaseClient
      .from("conversation_members")
      .insert([
        {
          conversation_id:conversationId,
          user_id:currentUser.id
        },
        {
          conversation_id:conversationId,
          user_id:otherUserId
        }
      ]);

  if(memberError) throw memberError;

  return conversationId;
}

async function openChatByUser(userId){

  const {data:user,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",userId)
      .single();

  if(error){

    toast(error.message);
    return;
  }

  const conversationId =
    await getOrCreateConversation(userId);

  await openChat(
    user,
    conversationId
  );
}

async function openChat(
  user,
  conversationId
){

  currentChatUser = user;
  currentConversationId =
    conversationId;

  $("chatScreen").style.display =
    "flex";

  $("chatHeaderName").textContent =
    user.full_name || "User";

  $("chatHeaderUsername").textContent =
    "@" + (user.username || "");

  setAvatar(
    $("chatAvatar"),
    user.avatar_url,
    user.full_name
  );

  await loadMessages();

  subscribeToMessages();
}

$("chatBackBtn").onclick =
  closeChat;

function closeChat(){

  $("chatScreen").style.display =
    "none";

  currentChatUser = null;
  currentConversationId = null;

  if(messageChannel){

    supabaseClient.removeChannel(
      messageChannel
    );

    messageChannel = null;
  }
}

/* =========================
CHAT LIST
========================= */

async function loadChatList(){

  const {data:members,error} =
    await supabaseClient
      .from("conversation_members")
      .select("conversation_id,user_id,joined_at")
      .eq("user_id",currentUser.id)
      .order("joined_at",{ascending:false});

  if(error){

    console.error(error);
    $("chatList").innerHTML =
      `<div class="empty">Chat list load করতে সমস্যা হয়েছে</div>`;
    return;
  }

  if(!members?.length){

    $("chatList").innerHTML =
      `<div class="empty">
        এখনো কোনো chat নেই
      </div>`;

    return;
  }

  const html = [];

  for(const member of members){

    const {data:others} =
      await supabaseClient
        .from("conversation_members")
        .select("user_id")
        .eq("conversation_id",member.conversation_id)
        .neq("user_id",currentUser.id)
        .limit(1);

async function loadMessages(){

function renderMessage(message){

  if(
    document.querySelector(
      `[data-message-id="${message.id}"]`
    )
  ) return;

  const div =
    document.createElement("div");

  div.className =
    "msg " +
    (
      message.sender_id === currentUser.id
      ? "me"
      : "other"
    );

  div.dataset.messageId =
    message.id;

  let content = "";

  if(message.message_type === "image"){

    content =
      `<img src="${escapeHtml(message.file_url)}">`;

  }else if(message.message_type === "video"){

    content =
      `<video src="${escapeHtml(message.file_url)}"
        controls playsinline></video>`;

  }else if(message.message_type === "audio"){

    content =
      `<audio src="${escapeHtml(message.file_url)}"
        controls></audio>`;

  }else if(message.message_type === "file"){

    content =
      `<a href="${escapeHtml(message.file_url)}"
        target="_blank"
        style="color:inherit">
        📎 ${escapeHtml(message.content || "File")}
      </a>`;

  }else if(message.message_type === "location"){

    content =
      `<a href="${escapeHtml(message.file_url)}"
        target="_blank"
        style="color:inherit">
        📍 Location খুলুন
      </a>`;

  }else{

    content =
      escapeHtml(message.content || "");
  }

  const time =
    new Date(message.created_at)
      .toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
      });

  div.innerHTML =
    `${content}<small>${time}</small>`;

  $("messages").appendChild(div);
}

function scrollMessages(){

  $("messages").scrollTop =
    $("messages").scrollHeight;
}

function subscribeToMessages(){

  if(messageChannel){

    supabaseClient.removeChannel(
      messageChannel
    );
  }

  messageChannel =
    supabaseClient
      .channel(
        "messages-" +
        currentConversationId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `conversation_id=eq.${currentConversationId}`
        },
        payload => {

          renderMessage(
            payload.new
          );

          scrollMessages();
        }
      )
      .subscribe();
}

========================= */

$("fileBtn").onclick =
  () => $("fileInput").click();

  async () => {

    const file =
      $("fileInput").files[0];

    if(!file) return;

  };

async function uploadChatFile(file){

  if(!currentConversationId) return;

  if(file.size > 20 * 1024 * 1024){

    toast("File সর্বোচ্চ 20 MB");
    return;
  }

  try{

    const ext =
      file.name.includes(".")
      ? file.name.split(".").pop()
      : "bin";

    const path =
      `${currentUser.id}/${currentConversationId}/${crypto.randomUUID()}.${ext}`;

    const {error:uploadError} =
      await supabaseClient
        .storage
        .from("chat-files")
        .upload(path,file,{
          upsert:false
        });

    if(uploadError) throw uploadError;

    const {data:signed,error:signedError} =
      await supabaseClient
        .storage
        .from("chat-files")
        .createSignedUrl(
          path,
          60 * 60 * 24 * 7
        );

    if(signedError) throw signedError;

    let type = "file";

    if(file.type.startsWith("image/"))
      type = "image";

    else if(file.type.startsWith("video/"))
      type = "video";

    const {error:messageError} =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:
            currentConversationId,
          sender_id:
            currentUser.id,
          content:file.name,
          message_type:type,
          file_url:signed.signedUrl
        });

    if(messageError) throw messageError;

  }catch(error){

    console.error(error);
    toast(
      error.message ||
      "File পাঠানো যায়নি"
    );
  }
}

async function toggleRecording(){

  if(recording){

    mediaRecorder.stop();
    recording = false;

    $("recordBtn").textContent = "🎙️";

    return;
  }

  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });

    audioChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
      e => {

        if(e.data.size > 0)
          audioChunks.push(e.data);
      };

    mediaRecorder.onstop =
      async () => {

        stream.getTracks()
          .forEach(t => t.stop());

        const blob =
          new Blob(
            audioChunks,
            {type:"audio/webm"}
          );

        const file =
          new File(
            [blob],
            `voice-${Date.now()}.webm`,
            {type:"audio/webm"}
          );

        await uploadChatFile(file);
      };

    mediaRecorder.start();

    recording = true;

    $("recordBtn").textContent =
      "⏹️";

    toast("Voice recording চলছে");

  }catch(error){

    console.error(error);
    toast("Microphone permission দিন");
  }
}

async function loadCallsList(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("calls")
      .select("*")
      .or(
        `caller_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order(
        "started_at",
        {ascending:false}
      )
      .limit(100);

  if(error){

    console.error(error);

    $("callsList").innerHTML =
      `<div class="empty">
        Call history load করতে সমস্যা হয়েছে
      </div>`;

    return;
  }

  if(!data?.length){

    $("callsList").innerHTML =
      `<div class="empty">
        এখনো কোনো call history নেই
      </div>`;

    return;
  }

  const otherIds =
    [...new Set(
      data.map(call =>
        call.caller_id === currentUser.id
          ? call.receiver_id
          : call.caller_id
      )
    )];

  let profiles = [];

  if(otherIds.length){

    const result =
      await supabaseClient
        .from("profiles")
        .select("*")
        .in("id",otherIds);

    profiles =
      result.data || [];
  }

  const map =
    new Map(
      profiles.map(x => [x.id,x])
    );

  $("callsList").innerHTML =
    data.map(call => {

      const otherId =
        call.caller_id === currentUser.id
          ? call.receiver_id
          : call.caller_id;

      const user =
        map.get(otherId);

      const outgoing =
        call.caller_id === currentUser.id;

      const icon =
        call.call_type === "video"
          ? "🎥"
          : "📞";

      const statusText =
        call.status === "answered"
          ? "Answered"
          : call.status === "missed"
          ? "Missed"
          : call.status === "rejected"
          ? "Rejected"
          : call.status === "busy"
          ? "Busy"
          : call.status === "ended"
          ? "Ended"
          : call.status;

      const date =
        new Date(call.started_at)
          .toLocaleString();

      return `
        <div class="callItem">

          <div class="callIcon">${icon}</div>

          <div class="callText">

            <strong>
              ${escapeHtml(
                user?.full_name || "Unknown user"
              )}
            </strong>

            <small>
              ${outgoing ? "↗ Outgoing" : "↙ Incoming"}
              · ${date}
            </small>

            <div class="callStatus">
              ${statusText}
              ${
                call.duration_seconds
                ? ` · ${formatDuration(call.duration_seconds)}`
                : ""
              }
            </div>

          </div>

        </div>
      `;

    }).join("");
}

function formatDuration(seconds){

  seconds =
    Number(seconds) || 0;

  const m =
    Math.floor(seconds / 60);

  const s =
    seconds % 60;

  return `${m}:${String(s).padStart(2,"0")}`;
}

function subscribeToCalls(){

/* ==========================================
REAL WEBRTC AUDIO + VIDEO CALL SYSTEM
========================================== */

let peerConnection = null;

let localStream = null;
let remoteStream = null;

let callState = "idle";

let callConversationId = null;
let currentCallId = null;

let incomingOffer = null;
let pendingIceCandidates = [];

let callStartedAt = null;
let callRingTimer = null;

const rtcConfiguration = {

  iceServers:[
    {
      urls:[
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302"
      ]
    }
  ]
};

/* =========================
SEND SIGNAL
========================= */

async function sendCallSignal(
  conversationId,
  type,
  payload={}
){

  if(!currentUser) return;

  const {error} =
    await supabaseClient
      .from("call_signals")
      .insert({
        conversation_id:
          conversationId,
        sender_id:
          currentUser.id,
        signal_type:
          type,
        payload
      });

  if(error){

    console.error(
      "Call signal error:",
      error
    );

    toast(
      "Call connection সমস্যা"
    );
  }
}

/* =========================
CREATE PEER
========================= */

function createPeer(){

  peerConnection =
    new RTCPeerConnection(
      rtcConfiguration
    );

  remoteStream =
    new MediaStream();

  $("callRemoteVideo").srcObject =
    remoteStream;

  peerConnection.ontrack =
    event => {

      event.streams[0]
        .getTracks()
        .forEach(track => {

          remoteStream.addTrack(track);

        });

      $("callRemoteVideo").play()
        .catch(()=>{});
    };

  peerConnection.onicecandidate =
    async event => {

      if(
        event.candidate &&
        callConversationId
      ){

        await sendCallSignal(
          callConversationId,
          "ice",
          {
            candidate:
              event.candidate.toJSON()
          }
        );
      }
    };

  peerConnection.onconnectionstatechange =
    () => {

      const state =
        peerConnection?.connectionState;

      if(state === "connected"){

        $("callStatus").textContent =
          "Connected";
      }

      if(
        state === "failed" ||
        state === "disconnected"
      ){

        endCall("failed");
      }
    };

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );
      });
  }
}

GET MICROPHONE/CAMERA
========================= */

async function getCallMedia(
  mode
){

  const constraints =
    mode === "video"
      ? {
          audio:true,
          video:{
            facingMode:"user",
            width:{ideal:1280},
            height:{ideal:720}
          }
        }
      : {
          audio:true,
          video:false
        };

  localStream =
    await navigator.mediaDevices
      .getUserMedia(constraints);

  $("callLocalVideo").srcObject =
    localStream;

  $("callLocalVideo").style.display =
    mode === "video"
      ? "block"
      : "none";
}

/* =========================
START CALL
========================= */

async function startCall(mode){

  if(
    !currentChatUser ||
    !currentConversationId
  ){

    toast("আগে একটি chat খুলুন");
    return;
  }

  if(callState !== "idle"){

    toast("আপনি ইতিমধ্যে একটি call-এ আছেন");
    return;
  }

  try{

    callState = "calling";

    callConversationId =
      currentConversationId;

    callStartedAt =
      new Date();

    await getCallMedia(mode);

    /* CREATE REAL CALL HISTORY */

    const {data:call,error:callError} =
      await supabaseClient
        .from("calls")
        .insert({
          conversation_id:
            callConversationId,
          caller_id:
            currentUser.id,
          receiver_id:
            currentChatUser.id,
          call_type:
            mode,
          status:"ringing"
        })
        .select()
        .single();

    if(callError) throw callError;

    currentCallId =
      call.id;

    openCallUI(
      mode,
      currentChatUser.full_name,
      currentChatUser.avatar_url,
      false
    );

    createPeer();

    const offer =
      await peerConnection
        .createOffer();

    await peerConnection
      .setLocalDescription(offer);

    await sendCallSignal(
      callConversationId,
      "offer",
      {
        sdp:offer,
        mode,
        call_id:
          currentCallId
      }
    );

    /* 30 SECOND RING TIMEOUT */

    clearTimeout(callRingTimer);

    callRingTimer =
      setTimeout(
        async () => {

          if(callState === "calling"){

            await updateCallStatus(
              "missed"
            );

            await sendCallSignal(
              callConversationId,
              "hangup",
              {
                call_id:
                  currentCallId
              }
            );

            await cleanupCall();

            toast("Call unanswered");

          }

        },
        30000
      );

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Call শুরু করা যায়নি"
    );

    await cleanupCall();
  }
}

/* =========================
ACCEPT INCOMING CALL
========================= */

async function acceptIncomingCall(){

  if(
    !incomingOffer ||
    !callConversationId
  ) return;

  try{

    const mode =
      incomingOffer.mode || "audio";

    callState = "connected";

    $("acceptCallBtn").style.display =
      "none";

    $("rejectCallBtn").style.display =
      "none";

    $("endCallBtn").style.display =
      "block";

    await getCallMedia(mode);

    createPeer();

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          incomingOffer.sdp
        )
      );

    await flushPendingIce();

    const answer =
      await peerConnection
        .createAnswer();

    await peerConnection
      .setLocalDescription(answer);

    await sendCallSignal(
      callConversationId,
      "answer",
      {
        sdp:answer,
        call_id:
          currentCallId
      }
    );

    await updateCallStatus(
      "answered"
    );

    $("callStatus").textContent =
      "Connected";

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Call accept করা যায়নি"
    );

    await cleanupCall();
  }
}

/* =========================
REJECT
========================= */

async function rejectIncomingCall(){

  if(callConversationId){

    await sendCallSignal(
      callConversationId,
      "reject",
      {
        call_id:
          currentCallId
      }
    );

    await updateCallStatus(
      "rejected"
    );
  }

  await cleanupCall();
}

/* =========================
END CALL
========================= */

async function endCall(
  status="ended"
){

  if(callState === "idle"){

    await cleanupCall();
    return;
  }

  const conversationId =
    callConversationId;

  const callId =
    currentCallId;

  if(conversationId){

    await sendCallSignal(
      conversationId,
      "hangup",
      {
        call_id:callId
      }
    );
  }

  await updateCallStatus(status);

  await cleanupCall();
}

/* =========================
UPDATE CALL HISTORY
========================= */

async function updateCallStatus(
  status
){

  if(!currentCallId) return;

  const update = {
    status
  };

  if(status === "answered"){

    update.answered_at =
      new Date().toISOString();

  }

  if(
    status === "ended" ||
    status === "missed" ||
    status === "rejected" ||
    status === "busy" ||
    status === "failed"
  ){

    update.ended_at =
      new Date().toISOString();

    if(callStartedAt){

      update.duration_seconds =
        Math.max(
          0,
          Math.floor(
            (
              Date.now() -
              callStartedAt.getTime()
            ) / 1000
          )
        );
    }
  }

  const {error} =
    await supabaseClient
      .from("calls")
      .update(update)
      .eq("id",currentCallId);

  if(error){

    console.error(
      "Call history update:",
      error
    );
  }

  loadCallsList();
}

/* =========================
ICE QUEUE
========================= */

async function addPendingIce(
  candidate
){

  if(
    peerConnection &&
    peerConnection.remoteDescription
  ){

    try{

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(candidate)
        );

    }catch(error){

      console.error(
        "ICE error:",
        error
      );
    }

  }else{

    pendingIceCandidates.push(
      candidate
    );
  }
}

async function flushPendingIce(){

  const list =
    [...pendingIceCandidates];

  pendingIceCandidates = [];

  for(const candidate of list){

    await addPendingIce(
      candidate
    );
  }
}

/* =========================
HANDLE SIGNAL
========================= */

async function handleCallSignal(
  signal
){

  if(
    !signal ||
    signal.sender_id === currentUser.id
  ) return;

  if(
    !callConversationId
  ){

    callConversationId =
      signal.conversation_id;
  }

  const type =
    signal.signal_type;

  const payload =
    signal.payload || {};

  /* INCOMING OFFER */

  if(type === "offer"){

    if(callState !== "idle"){

      await sendCallSignal(
        signal.conversation_id,
        "busy",
        {
          call_id:
            payload.call_id
        }
      );

      return;
    }

    callState = "ringing";

    callConversationId =
      signal.conversation_id;

    currentCallId =
      payload.call_id || null;

    incomingOffer = {
      sdp:payload.sdp,
      mode:payload.mode || "audio"
    };

    const {data:caller} =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq(
          "id",
          signal.sender_id
        )
        .maybeSingle();

    openCallUI(
      payload.mode || "audio",
      caller?.full_name || "Unknown",
      caller?.avatar_url,
      true
    );

    return;
  }

  /* ANSWER */

  if(type === "answer"){

    if(
      !peerConnection ||
      !payload.sdp
    ) return;

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          payload.sdp
        )
      );

    await flushPendingIce();

    callState =
      "connected";

    clearTimeout(callRingTimer);

    await updateCallStatus(
      "answered"
    );

    $("callStatus").textContent =
      "Connected";

    return;
  }

  /* ICE */

  if(type === "ice"){

    if(payload.candidate){

      await addPendingIce(
        payload.candidate
      );
    }

    return;
  }

  /* REJECT */

  if(type === "reject"){

    clearTimeout(callRingTimer);

    await updateCallStatus(
      "rejected"
    );

    toast("Call rejected");

    await cleanupCall();

    return;
  }

  /* BUSY */

  if(type === "busy"){

    clearTimeout(callRingTimer);

    await updateCallStatus(
      "busy"
    );

    toast("User is busy");

    await cleanupCall();

    return;
  }

  /* HANGUP */

  if(type === "hangup"){

    if(callState === "connected"){

      await updateCallStatus(
        "ended"
      );
    }

    await cleanupCall();
  }
}

/* =========================
CALL REALTIME
========================= */

async function startCallRealtime(){

  if(callChannel){

    await supabaseClient.removeChannel(
      callChannel
    );
  }

  callChannel =
    supabaseClient
      .channel(
        "call-signals-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"call_signals"
        },
        async payload => {

          const signal =
            payload.new;

          if(
            signal.sender_id !==
            currentUser.id
          ){

            await handleCallSignal(
              signal
            );
          }
        }
      )
      .subscribe();
}

/* =========================
CALL BUTTONS
========================= */

$("audioCallBtn").onclick =
  () => startCall("audio");

$("videoCallBtn").onclick =
  () => startCall("video");

$("acceptCallBtn").onclick =
  acceptIncomingCall;

$("rejectCallBtn").onclick =
  rejectIncomingCall;

$("endCallBtn").onclick =
  () => endCall("ended");

/* =========================
CLEANUP
========================= */

async function cleanupCall(){

  clearTimeout(callRingTimer);

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    localStream = null;
  }

  if(peerConnection){

    peerConnection.ontrack = null;
    peerConnection.onicecandidate = null;

    try{
      peerConnection.close();
    }catch(e){}

    peerConnection = null;
  }

  $("callRemoteVideo").srcObject =
    null;

  $("callLocalVideo").srcObject =
    null;

  $("callOverlay").style.display =
    "none";

  $("acceptCallBtn").style.display =
    "none";

  $("rejectCallBtn").style.display =
    "none";

  $("endCallBtn").style.display =
    "block";

  callState = "idle";

  callConversationId = null;
  currentCallId = null;

  incomingOffer = null;

  pendingIceCandidates = [];

  callStartedAt = null;
}

/* =========================
PAGE ERROR HANDLER
========================= */

window.addEventListener(
  "error",
  event => {

    console.error(
      "App error:",
      event.error || event.message
    );
  }
);

window.addEventListener(
  "beforeunload",
  () => {

    if(callState !== "idle"){

      sendCallSignal(
        callConversationId,
        "hangup",
        {
          call_id:
            currentCallId
        }
      );
    }
  }
);

</script>
