<style>

/* =========================================================
   CALL OVERLAY
========================================================= */

<script>
   /* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let currentProfile = null;

let currentChatUser = null;
let currentConversationId = null;

let messageSubscription = null;
let chatListSubscription = null;

let isSignup = false;

let mediaRecorder = null;
let recordingChunks = [];

let currentPage = "chats";


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHtml(value){
  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showToast(message){
  const toast = $("toast");

  if(!toast){
    return;
  }

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.style.display = "none";
  },3000);
}


function initials(name){
  if(!name){
    return "R";
  }

  return name
    .trim()
    .charAt(0)
    .toUpperCase();
}


function formatTime(date){
  if(!date){
    return "";
  }

  const d = new Date(date);

  return d.toLocaleTimeString("bn-BD",{
    hour:"2-digit",
    minute:"2-digit"
  });
}


function formatDate(date){
  if(!date){
    return "";
  }

  const d = new Date(date);

  return d.toLocaleDateString("bn-BD",{
    day:"2-digit",
    month:"short"
  });
}


/* =========================================================
   AUTH UI
========================================================= */

function toggleAuth(){

  isSignup = !isSignup;

  $("authTitle").textContent =
    isSignup ? "Sign Up" : "Login";

  $("authButton").textContent =
    isSignup ? "Create Account" : "Login";

  $("signupFields").classList.toggle(
    "hidden",
    !isSignup
  );

  $("switchText").textContent =
    isSignup
      ? "আগে থেকেই account আছে?"
      : "নতুন account খুলবেন?";

  $("switchButton").textContent =
    isSignup
      ? "Login"
      : "Sign Up";
}


/* =========================================================
   AUTH
========================================================= */

async function handleAuth(){

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if(!email || !password){

    showToast(
      "Email এবং Password দিন"
    );

    return;
  }


  try{

    $("authButton").disabled = true;


    if(isSignup){

      const fullName =
        $("fullName").value.trim();

      const username =
        $("username").value
          .trim()
          .toLowerCase();


      if(!fullName || !username){

        showToast(
          "নাম এবং Username দিন"
        );

        return;
      }


      const { data, error } =
        await supabaseClient.auth.signUp({

          email,
          password,

          options:{
            data:{
              full_name:fullName,
              username:username
            }
          }

        });


      if(error){
        throw error;
      }


      if(data.user){

        currentUser = data.user;

        await createOrUpdateProfile(
          data.user,
          fullName,
          username
        );

      }


      if(data.session){

        await initializeApp();

      }else{

        showToast(
          "Account তৈরি হয়েছে। Email verification লাগতে পারে।"
        );

      }


    }else{

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email,
          password

        });


      if(error){
        throw error;
      }


      currentUser = data.user;

      await initializeApp();

    }


  }catch(error){

    console.error(
      "Auth error:",
      error
    );

    showToast(
      error.message ||
      "Authentication failed"
    );

  }finally{

    $("authButton").disabled = false;

  }

}

async function createOrUpdateProfile(
  user,
  fullName,
  username
){

  const { data:existing } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


  const payload = {

    id:user.id,

    full_name:
      fullName ||
      existing?.full_name ||
      user.user_metadata?.full_name ||
      "User",

    username:
      username ||
      existing?.username ||
      user.user_metadata?.username ||
      "user_" + user.id.slice(0,6)

  };


  const { data,error } =
    await supabaseClient
      .from("profiles")
      .upsert(
        payload,
        {
          onConflict:"id"
        }
      )
      .select()
      .single();


  if(error){

    console.error(
      "Profile error:",
      error
    );

    return null;
  }


  currentProfile = data;

  return data;
}


async function loadProfile(){

  if(!currentUser){
    return null;
  }


  const { data,error } =
    await supabaseClient
      .from("profiles")

      .eq("id",currentUser.id)

    console.error(
      "Load profile error:",

  if(data){

    return data;
  }


  return await createOrUpdateProfile(
    currentUser,

    currentUser.user_metadata?.username
  );

}

/* =========================================================
   CONVERSATIONS
========================================================= */

async function getOrCreateConversation(
  otherUserId
){

  if(!currentUser){
    return null;
  }


  const { data:myMemberships,error } =
    await supabaseClient
      .from("conversation_members")
      .select(
        "conversation_id"
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if(error){
    throw error;
  }


  const conversationIds =
    (myMemberships || [])
      .map(
        item => item.conversation_id
      );


  if(conversationIds.length){

    const { data:matches,error:matchError } =
      await supabaseClient
        .from("conversation_members")
        .select(
          "conversation_id,user_id"
        )
        .in(
          "conversation_id",
          conversationIds
        )
        .eq(
          "user_id",
          otherUserId
        );


    if(matchError){
      throw matchError;
    }


    if(matches && matches.length){

      return matches[0].conversation_id;

    }

  }


  const { data:conversation,error:createError } =
    await supabaseClient
      .from("conversations")
      .insert({})
      .select()
      .single();


  if(createError){
    throw createError;
  }


  const conversationId =
    conversation.id;


  const { error:memberError } =
    await supabaseClient
      .from("conversation_members")
      .insert([

        {
          conversation_id:
            conversationId,

          user_id:
            currentUser.id
        },

        {
          conversation_id:
            conversationId,

          user_id:
            otherUserId
        }

      ]);


  if(memberError){

    await supabaseClient
      .from("conversations")
      .delete()
      .eq(
        "id",
        conversationId
      );

    throw memberError;
  }


  return conversationId;

}

/* =========================================================
   LOAD CHAT LIST
========================================================= */

async function loadChatList(){

  const container =
    $("chatList");


  if(!currentUser){

    container.innerHTML = "";

    return;
  }


  try{

    const { data:members,error } =
      await supabaseClient
        .from("conversation_members")
        .select(
          "conversation_id,user_id"
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(error){
      throw error;
    }


    if(!members || !members.length){

      container.innerHTML = `
        <div class="empty">
          এখনো কোনো chat নেই।
          <br><br>
          উপরের search box দিয়ে user খুঁজে chat শুরু করুন।
        </div>
      `;

      return;
    }


    const conversationIds =
      members.map(
        m => m.conversation_id
      );


    const { data:allMembers,error:memberError } =
      await supabaseClient
        .from("conversation_members")
        .select(
          "conversation_id,user_id"
        )
        .in(
          "conversation_id",
          conversationIds
        );


    if(memberError){
      throw memberError;
    }


    const otherUserIds =
      [...new Set(
        allMembers
          .filter(
            m =>
              m.user_id !==
              currentUser.id
          )
          .map(
            m => m.user_id
          )
      )];


    if(!otherUserIds.length){

      container.innerHTML = `
        <div class="empty">
          কোনো chat পাওয়া যায়নি।
        </div>
      `;

      return;
    }


    const { data:profiles,error:profileError } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .in(
          "id",
          otherUserIds
        );


    if(profileError){
      throw profileError;
    }


    const profileMap = {};

    (profiles || []).forEach(
      profile => {
        profileMap[profile.id] =
          profile;
      }
    );


    container.innerHTML =
      allMembers
        .filter(
          member =>
            member.user_id !==
            currentUser.id
        )
        .map(member => {

          const profile =
            profileMap[
              member.user_id
            ];


          if(!profile){
            return "";
          }


          return `

            <div
              class="chatItem"
              onclick='openChatFromSearch(${JSON.stringify(profile).replace(/'/g,"&#39;")})'
            >

              <div class="avatar">

                ${getAvatarHtml(
                  profile,
                  40
                )}

              </div>


              <div style="flex:1">

                <div class="userName">

                  ${escapeHtml(
                    profile.full_name ||
                    profile.username ||
                    "User"
                  )}

                </div>


                <div class="userUsername">

                  @${escapeHtml(
                    profile.username || ""
                  )}

                </div>

              </div>

            </div>

          `;

        })
        .join("");


  }catch(error){

    console.error(
      "Chat list error:",
      error
    );

    container.innerHTML = `
      <div class="empty">
        Chat list load করতে সমস্যা হয়েছে।
      </div>
    `;

  }

}

   CHAT LIST REALTIME
========================================================= */

function subscribeChatList(){

  if(chatListSubscription){

    supabaseClient
      .removeChannel(
        chatListSubscription
      );

  }


  chatListSubscription =
    supabaseClient

/* =========================================================
   RENDER SINGLE MESSAGE
========================================================= */

function renderMessage(message){

  const mine =
    message.sender_id ===
    currentUser.id;


  const content =
    message.content || "";


  const type =
    message.message_type ||
    "text";


  let body = "";


  if(type === "text"){

    body = `
      <div class="messageText">
        ${escapeHtml(content)}
      </div>
    `;

  }


  else if(type === "image"){

    body = `

      <img
        src="${escapeHtml(
          message.file_url || content
        )}"
        alt="image"
        loading="lazy"
      >

    `;

  }


  else if(type === "video"){

    body = `

      <video
        src="${escapeHtml(
          message.file_url || content
        )}"
        controls
        playsinline
      ></video>

    `;

  }


  else if(type === "audio"){

    body = `

      <audio
        src="${escapeHtml(
          message.file_url || content
        )}"
        controls
      ></audio>

    `;

  }


  else if(type === "file"){

    const fileUrl =
      message.file_url || content;

    const fileName =
      message.file_name ||
      "File";


    body = `

      <div class="fileMessage">

        <div class="fileIcon">
          📄
        </div>

        <div style="flex:1">

          <div class="fileName">
            ${escapeHtml(fileName)}
          </div>

          <button
            class="fileOpen"
            onclick="window.open('${escapeHtml(fileUrl)}','_blank')"
          >
            Open
          </button>

        </div>

      </div>

    `;

  }


  else if(type === "location"){

    body = `

      <div>

        📍 Location shared

        <br>

        <button
          class="fileOpen"
          onclick="window.open('${escapeHtml(content)}','_blank')"
        >
          Open Map
        </button>

      </div>

    `;

  }


  else{

    body = `
      <div class="messageText">
        ${escapeHtml(content)}
      </div>
    `;

  }


  return `

    <div
      class="messageRow ${mine ? "mine" : ""}"
    >

      <div class="message">

        ${body}

        <div class="messageTime">

          ${formatTime(
            message.created_at
          )}

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   MESSAGE REALTIME
========================================================= */

function subscribeMessages(){

  if(messageSubscription){

    supabaseClient
      .removeChannel(
        messageSubscription
      );

  }


  if(!currentConversationId){
    return;
  }


  messageSubscription =
    supabaseClient
      .channel(
        "raztara-messages-" +
        currentConversationId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            currentConversationId
        },
        payload => {

          appendMessage(
            payload.new
          );

        }
      )
      .subscribe();

}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessage(message){

  if(
    !message ||
    message.conversation_id !==
    currentConversationId
  ){

    return;

  }


  const container =
    $("messages");


  const empty =
    container.querySelector(
      ".empty"
    );


  if(empty){
    container.innerHTML = "";
  }


  container.insertAdjacentHTML(
    "beforeend",
    renderMessage(message)
  );


  scrollMessagesToBottom();

}


function scrollMessagesToBottom(){

  const container =
    $("messages");


  if(!container){
    return;
  }


  setTimeout(()=>{

    container.scrollTop =
      container.scrollHeight;

  },50);

}

/* =========================================================
   FILE UPLOAD
========================================================= */

async function uploadSelectedFile(event){

  const file =
    event.target.files?.[0];


  event.target.value = "";


  if(!file){
    return;
  }


  if(!currentConversationId){

    showToast(
      "আগে একটি chat খুলুন"
    );

    return;
  }


  const maxSize =
    6 * 1024 * 1024;


  if(file.size > maxSize){

    showToast(
      "File সর্বোচ্চ 6 MB হতে পারবে"
    );

    return;
  }


  try{

    showToast(
      "File upload হচ্ছে..."
    );


    const safeName =
      file.name
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


    const path =
      currentUser.id +
      "/" +
      Date.now() +
      "_" +
      safeName;


    const { error:uploadError } =
      await supabaseClient
        .storage
        .from("post-images")
        .upload(
          path,
          file,
          {
            upsert:false
          }
        );


    if(uploadError){
      throw uploadError;
    }


    const { data:urlData } =
      supabaseClient
        .storage
        .from("post-images")
        .getPublicUrl(path);


    const fileUrl =
      urlData.publicUrl;


    let messageType =
      "file";


    if(
      file.type.startsWith(
        "image/"
      )
    ){

      messageType =
        "image";

    }else if(
      file.type.startsWith(
        "video/"
      )
    ){

      messageType =
        "video";

    }


    const { error:messageError } =
      await supabaseClient
        .from("messages")
        .insert({

          conversation_id:
            currentConversationId,

          sender_id:
            currentUser.id,

          content:
            fileUrl,

          message_type:
            messageType,

          file_url:
            fileUrl,

          file_name:
            file.name

        });


    if(messageError){
      throw messageError;
    }


    showToast(
      "File পাঠানো হয়েছে"
    );


  }catch(error){

    console.error(
      "Upload error:",
      error
    );

    showToast(
      error.message ||
      "File upload করা যায়নি"
    );

  }

}


/* =========================================================
   VOICE RECORDING
========================================================= */

async function toggleRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state === "recording"
  ){

    mediaRecorder.stop();

    return;
  }


  if(!currentConversationId){

    showToast(
      "আগে একটি chat খুলুন"
    );

    return;
  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    recordingChunks = [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =
      event => {

        if(event.data.size > 0){

          recordingChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        $("recordBtn")
          .classList
          .remove(
            "recording"
          );


        const blob =
          new Blob(
            recordingChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );


        await uploadVoice(
          blob
        );

      };


    mediaRecorder.start();


    $("recordBtn")
      .classList

async function uploadVoice(blob){

            currentUser.id,

          message_type:

          file_name:

      throw messageError;
    }


    showToast(

async function shareLocation(){

  if(!currentConversationId){

    showToast(
      "আগে একটি chat খুলুন"
    );

    return;
  }


  if(!navigator.geolocation){

    showToast(
      "এই browser location support করে না"
    );

    return;
  }


  showToast(
    "Location নেওয়া হচ্ছে..."
  );


  navigator.geolocation.getCurrentPosition(

    async position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      const mapUrl =
        "https://www.google.com/maps?q=" +
        lat +
        "," +
        lng;


      try{

        const { error } =
          await supabaseClient
            .from("messages")
            .insert({

              conversation_id:
                currentConversationId,

              sender_id:
                currentUser.id,

              content:
                mapUrl,

              message_type:
                "location"

            });


        if(error){
          throw error;
        }


        showToast(
          "Location পাঠানো হয়েছে"
        );


      }catch(error){

        console.error(
          "Location error:",
          error
        );

        showToast(
          "Location পাঠানো যায়নি"
        );

      }

    },

    error => {

      console.error(
        error
      );

      showToast(
        "Location permission দিন"
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

}

   /* =========================================================
   WEBRTC CALL SYSTEM
========================================================= */

let callPeer = null;
let callLocalStream = null;
let callRemoteStream = null;

let callConversationId = null;
let callMode = null;
let callState = "idle";

let callSubscription = null;

let pendingCall = null;
let pendingIceCandidates = [];


/* =========================================================
   START AUDIO CALL
========================================================= */

async function startAudioCall(){

  await startRaztaraCall(
    "audio"
  );

}


/* =========================================================
   START VIDEO CALL
========================================================= */

async function startVideoCall(){

  await startRaztaraCall(
    "video"
  );

}


/* =========================================================
   START CALL
========================================================= */

async function startRaztaraCall(
  mode
){

  if(!currentUser){

    showToast(
      "আগে Login করুন"
    );

    return;
  }


  if(!currentChatUser){

    showToast(
      "যার সাথে call করবেন তাকে নির্বাচন করুন"
    );

    return;
  }


  if(!currentConversationId){

    showToast(
      "Conversation পাওয়া যায়নি"
    );

    return;
  }


  if(
    callState !==
    "idle"
  ){

    showToast(
      "আপনি ইতিমধ্যে একটি call-এ আছেন"
    );

    return;
  }


  try{

    callMode =
      mode;

    callConversationId =
      currentConversationId;

    callState =
      "calling";


    showRaztaraCallUI(
      false
    );


    $("callTitle").textContent =
      currentChatUser.full_name ||
      currentChatUser.username ||
      "User";


    $("callStatus").textContent =
      mode === "video"
        ? "Video calling..."
        : "Calling...";


    callLocalStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:true,

          video:
            mode === "video"

        });


    if(mode === "video"){

      $("callVideos")
        .classList
        .remove("hidden");


      $("callLocalVideo").srcObject =
        callLocalStream;

    }


    createRaztaraPeer();


    const offer =
      await callPeer
        .createOffer();


    await callPeer
      .setLocalDescription(
        offer
      );


    await sendRaztaraCallSignal(
      "offer",
      {
        offer:offer,
        mode:mode
      }
    );


  }catch(error){

    console.error(
      "Start call error:",
      error
    );


    showToast(
      error.message ||
      "Call শুরু করা যায়নি"
    );


    await endRaztaraCall();

  }

}


/* =========================================================
   CREATE PEER
========================================================= */

function createRaztaraPeer(){

  callRemoteStream =
    new MediaStream();


  $("callRemoteVideo").srcObject =
    callRemoteStream;


  callPeer =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        },
        {
          urls:
            "stun:stun1.l.google.com:19302"
        }
      ]

    });


  callLocalStream
    ?.getTracks()
    .forEach(
      track => {

        callPeer.addTrack(
          track,
          callLocalStream
        );

      }
    );


  callPeer.ontrack =
    event => {

      event.streams[0]
        ?.getTracks()
        .forEach(
          track => {

            callRemoteStream
              .addTrack(track);

          }
        );


      $("callRemoteVideo")
        .srcObject =
        callRemoteStream;

    };


  callPeer.onicecandidate =
    async event => {

      if(
        event.candidate &&
        callConversationId
      ){

        await sendRaztaraCallSignal(
          "ice",
          {
            candidate:
              event.candidate
          }
        );

      }

    };


  callPeer.onconnectionstatechange =
    () => {

      const state =
        callPeer.connectionState;


      console.log(
        "Call connection:",
        state
      );


      if(
        state ===
        "connected"
      ){

        callState =
          "connected";


        $("callStatus").textContent =
          "Connected";


      }


      if(
        state ===
        "failed"
      ){

        showToast(
          "Call connection failed"
        );

        endRaztaraCall();

      }


      if(
        state ===
        "disconnected"
      ){

        setTimeout(
          () => {

            if(
              callState ===
              "connected"
            ){

              endRaztaraCall();

            }

          },
          3000
        );

      }

    };

}


/* =========================================================
   SEND CALL SIGNAL
========================================================= */

async function sendRaztaraCallSignal(
  type,
  payload
){

  if(
    !currentUser ||
    !callConversationId
  ){

    return;
  }


  try{

    const { error } =
      await supabaseClient
        .from("call_signals")
        .insert({

          conversation_id:
            callConversationId,

          sender_id:
            currentUser.id,

          type:
            type,

          payload:
            payload

        });


    if(error){
      throw error;
    }


  }catch(error){

    console.error(
      "Call signal error:",
      error
    );

  }

}


/* =========================================================
   CALL SIGNALING SUBSCRIPTION
========================================================= */

function startRaztaraCallSignaling(){

  if(!currentUser){
    return;
  }


  if(callSubscription){

    supabaseClient
      .removeChannel(
        callSubscription
      );

  }


  callSubscription =
    supabaseClient
      .channel(
        "raztara-call-signals-" +
        currentUser.id
      )
      .on(

        "postgres_changes",

        {
          event:"INSERT",
          schema:"public",
          table:"call_signals"
        },

        async payload => {

          await handleRaztaraCallSignal(
            payload.new
          );

        }

      )
      .subscribe();

}


/* =========================================================
   HANDLE CALL SIGNAL
========================================================= */

async function handleRaztaraCallSignal(
  signal
){

  if(!signal){
    return;
  }


  if(
    signal.sender_id ===
    currentUser.id
  ){

    return;
  }


  const payload =
    signal.payload || {};


  if(
    signal.type ===
    "offer"
  ){

    await receiveRaztaraOffer(
      signal
    );

    return;
  }


  if(
    signal.type ===
    "answer"
  ){

    if(
      !callPeer ||
      !payload.answer
    ){

      return;
    }


    try{

      await callPeer
        .setRemoteDescription(
          new RTCSessionDescription(
            payload.answer
          )
        );


      callState =
        "connected";


      $("callStatus").textContent =
        "Connected";


      await addPendingIce();

    }catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

    return;
  }


  if(
    signal.type ===
    "ice"
  ){

    if(
      !payload.candidate
    ){

      return;
    }


    if(
      callPeer &&
      callPeer.remoteDescription
    ){

      try{

        await callPeer
          .addIceCandidate(
            new RTCIceCandidate(
              payload.candidate
            )
          );

      }catch(error){

        console.error(
          "ICE error:",
          error
        );

      }

    }else{

      pendingIceCandidates
        .push(
          payload.candidate
        );

    }

    return;
  }


  if(
    signal.type ===
    "reject"
  ){

    showToast(
      "Call rejected"
    );


    await endRaztaraCall();

    return;
  }


  if(
    signal.type ===
    "end"
  ){

    await endRaztaraCall();

    return;
  }

}


/* =========================================================
   RECEIVE OFFER
========================================================= */

async function receiveRaztaraOffer(
  signal
){

  const payload =
    signal.payload || {};


  if(!payload.offer){
    return;
  }


  if(
    callState !==
    "idle"
  ){

    return;
  }


  const senderProfile =
    await getProfileById(
      signal.sender_id
    );


  pendingCall = {

    signal:signal,

    senderId:
      signal.sender_id,

    conversationId:
      signal.conversation_id,

    offer:
      payload.offer,

    mode:
      payload.mode ||
      "audio",

    profile:
      senderProfile

  };


  callConversationId =
    signal.conversation_id;

  callMode =
    pendingCall.mode;

  callState =
    "incoming";


  showRaztaraCallUI(
    true
  );


  const profile =
    senderProfile || {};


  $("callTitle").textContent =
    profile.full_name ||
    profile.username ||
    "Incoming Call";


  $("callStatus").textContent =
    pendingCall.mode === "video"
      ? "Incoming video call..."
      : "Incoming audio call...";


  $("callIncomingAvatar").textContent =
    initials(
      profile.full_name ||
      profile.username ||
      "R"
    );

}


/* =========================================================
   GET PROFILE
========================================================= */

async function getProfileById(

){

  try{

/* =========================================================
   SHOW CALL UI
========================================================= */

function showRaztaraCallUI(
  incoming
){

  $("callOverlay")
    .classList
    .remove("hidden");


  $("callVideos")
    .classList
    .toggle(
      "hidden",

    );

    $("callActions").innerHTML = `

      <button

      >
        🔴 End

    `;

  }else{

    $("callActions").innerHTML = `

      <button
        class="callAction accept"
        onclick="acceptRaztaraCall()"
      >
        📞 Accept
      </button>

      <button
        class="callAction reject"
        onclick="rejectRaztaraCall()"
      >
        ❌ Reject
      </button>

    `;

  }

}


/* =========================================================
   ACCEPT CALL
========================================================= */

async function acceptRaztaraCall(){

  if(!pendingCall){

    return;
  }


  try{

    callState =
      "connecting";


    $("callStatus").textContent =
      "Connecting...";


    callLocalStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:true,

          video:
            pendingCall.mode ===
            "video"

        });


    if(
      pendingCall.mode ===
      "video"
    ){

      $("callVideos")
        .classList
        .remove("hidden");


      $("callLocalVideo")
        .srcObject =
        callLocalStream;

    }


    createRaztaraPeer();


    await callPeer
      .setRemoteDescription(

        new RTCSessionDescription(
          pendingCall.offer
        )

      );


    await addPendingIce();


    const answer =
      await callPeer
        .createAnswer();


    await callPeer
      .setLocalDescription(
        answer
      );


    await sendRaztaraCallSignal(
      "answer",
      {
        answer:answer
      }
    );


    callState =
      "connected";


    $("callStatus").textContent =
      "Connected";


    pendingCall =
      null;


  }catch(error){

    console.error(
      "Accept call error:",
      error
    );


    showToast(
      error.message ||
      "Call accept করা যায়নি"
    );


    await endRaztaraCall();

  }

}


/* =========================================================
   REJECT CALL
========================================================= */

async function rejectRaztaraCall(){

  if(
    pendingCall &&
    callConversationId
  ){

    await sendRaztaraCallSignal(
      "reject",
      {}
    );

  }


  pendingCall =
    null;


  await endRaztaraCall();

}


/* =========================================================
   ADD PENDING ICE
========================================================= */

async function addPendingIce(){

  if(
    !callPeer ||
    !callPeer.remoteDescription
  ){

    return;
  }


  if(
    !pendingIceCandidates.length
  ){

    return;
  }


  const candidates =
    [...pendingIceCandidates];


  pendingIceCandidates =
    [];


  for(
    const candidate of candidates
  ){

    try{

      await callPeer
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    }catch(error){

      console.error(
        "Pending ICE error:",
        error
      );

    }

  }

}


/* =========================================================
   END CALL
========================================================= */

async function endRaztaraCall(
  sendSignal = true
){

  try{

    if(
      sendSignal &&
      callConversationId &&
      currentUser &&
      callState !== "idle"
    ){

      await sendRaztaraCallSignal(
        "end",
        {}
      );

    }

  }catch(error){

    console.error(
      "End signal error:",
      error
    );

  }


  if(callPeer){

    try{

      callPeer.close();

    }catch(error){

      console.error(
        error
      );

    }

  }


  if(callLocalStream){

    callLocalStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  if(callRemoteStream){

    callRemoteStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  callPeer =
    null;

  callLocalStream =
    null;

  callRemoteStream =
    null;

  callConversationId =
    null;

  callMode =
    null;

  callState =
    "idle";

  pendingCall =
    null;

  pendingIceCandidates =
    [];


  $("callRemoteVideo").srcObject =
    null;

  $("callLocalVideo").srcObject =
    null;


  $("callOverlay")
    .classList
    .add("hidden");


  $("callVideos")
    .classList
    .add("hidden");


  $("callActions").innerHTML =
    "";


  $("callStatus").textContent =
    "Connecting...";

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if(callPeer){

      try{
        callPeer.close();
      }catch{}

    }


    if(callLocalStream){

      callLocalStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);


/* =========================================================
   GLOBAL ERROR HANDLER
========================================================= */

window.addEventListener(
  "error",
  event => {

    console.error(
      "Global error:",
      event.error
    );

  }
);
