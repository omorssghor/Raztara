<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Home</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f7f7;
    color:#222;
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    height:64px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.menu-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:white;
    font-size:27px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-title{
    font-size:21px;
    font-weight:800;
    letter-spacing:.5px;
}

.profile-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    padding:0;
    cursor:pointer;
}

.profile-img{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.8);
    background:#ddd;
}

/* ================= MAIN ================= */

.main{
    max-width:700px;
    margin:auto;
    padding:15px 12px 90px;
}

/* Search */

.search-box{
    background:white;
    border-radius:13px;
    height:48px;
    display:flex;
    align-items:center;
    padding:0 14px;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
    margin-bottom:12px;
}

.search-icon{
    font-size:19px;
    margin-right:9px;
    color:#777;
}

.search-box input{
    border:0;
    outline:none;
    width:100%;
    font-size:15px;
    background:transparent;
}

/* ================= CHAT LIST ================= */

.section-title{
    font-size:14px;
    color:#777;
    padding:8px 5px;
    font-weight:600;
}

.chat-list{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.chat-item{
    min-height:76px;
    display:flex;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    transition:.15s;
}

.chat-item:last-child{
    border-bottom:0;
}

.chat-item:active{
    background:#f1f5f5;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    margin-right:12px;
    flex-shrink:0;
}

.chat-info{
    flex:1;
    min-width:0;
}

.chat-name{
    font-size:16px;
    font-weight:700;
    color:#222;
    margin-bottom:5px;
}

.last-message{
    color:#777;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-time{
    font-size:11px;
    color:#999;
    align-self:flex-start;
    margin-top:4px;
}

/* Empty */

.empty{
    display:none;
    text-align:center;
    padding:45px 20px;
    color:#888;
    background:white;
    border-radius:14px;
}

.empty-icon{
    font-size:42px;
    margin-bottom:10px;
}

/* ================= SIDE MENU ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    z-index:200;
}

.overlay.active{
    display:block;
}

.side-menu{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:290px;
    max-width:85%;
    background:white;
    box-shadow:5px 0 20px rgba(0,0,0,.2);
    transform:translateX(-100%);
    transition:.25s;
}

.overlay.active .side-menu{
    transform:translateX(0);
}

.menu-header{
    background:#075e54;
    color:white;
    padding:30px 20px 22px;
}

.menu-avatar{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ddd;
    object-fit:cover;
    border:2px solid white;
    margin-bottom:10px;
}

.menu-title{
    font-size:18px;
    font-weight:700;
}

.menu-subtitle{
    font-size:12px;
    opacity:.8;
    margin-top:3px;
}

.menu-list{
    padding:10px 0;
}

.menu-item{
    width:100%;
    border:0;
    background:white;
    text-align:left;
    padding:15px 20px;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    color:#333;
}

.menu-item:hover{
    background:#f4f7f7;
}

.menu-icon{
    width:25px;
    text-align:center;
    font-size:20px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:center;
    z-index:150;
    box-shadow:0 -2px 8px rgba(0,0,0,.08);
}

.nav-btn{
    flex:1;
    max-width:230px;
    border:0;
    background:white;
    color:#777;
    font-size:12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.nav-icon{
    font-size:23px;
}

.nav-btn.active{
    color:#075e54;
    font-weight:700;
}

/* ================= MOBILE ================= */

@media(max-width:480px){

    .header{
        height:60px;
        padding:0 12px;
    }

    .logo-title{
        font-size:20px;
    }

    .main{
        padding:12px 9px 88px;
    }

    .chat-item{
        padding:10px 12px;
    }

    .avatar{
        width:50px;
        height:50px;
    }

    .bottom-nav{
        height:65px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <button
        class="menu-btn"
        onclick="openMenu()"
        aria-label="Menu"
    >
        ☰
    </button>

    <div class="logo-title">
        RAZTARA
    </div>

    <button
        class="profile-btn"
        onclick="openProfile()"
        aria-label="Profile"
    >
        <img
            id="headerProfile"
            class="profile-img"
            src="https://i.pravatar.cc/100?img=12"
            alt="Profile"
        >
    </button>

</header>


<!-- ================= MAIN ================= -->

<main class="main">

    <!-- Search -->

    <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
            type="search"
            id="searchInput"
            placeholder="Search people or chats..."
            oninput="searchChats()"
        >

    </div>


    <div class="section-title">
        Chats
    </div>


    <!-- Chat List -->

    <div class="chat-list" id="chatList">

        <div
            class="chat-item"
            data-name="Rahim"
            onclick="openChat('Rahim')"
        >

            <div class="avatar">
                👨
            </div>

            <div class="chat-info">

                <div class="chat-name">
                    Rahim
                </div>

                <div class="last-message">
                    Hello, how are you?
                </div>

            </div>

            <div class="chat-time">
                10:30 AM
            </div>

        </div>


        <div
            class="chat-item"
            data-name="Karim"
            onclick="openChat('Karim')"
        >

            <div class="avatar">
                👨‍💼
            </div>

            <div class="chat-info">

                <div class="chat-name">
                    Karim
                </div>

                <div class="last-message">
                    See you later.
                </div>

            </div>

            <div class="chat-time">
                9:15 AM
            </div>

        </div>


        <div
            class="chat-item"
            data-name="Sumaiya"
            onclick="openChat('Sumaiya')"
        >

            <div class="avatar">
                👩
            </div>

            <div class="chat-info">

                <div class="chat-name">
                    Sumaiya
                </div>

                <div class="last-message">
                    Photo sent
                </div>

            </div>

            <div class="chat-time">
                Yesterday
            </div>

        </div>


        <div
            class="chat-item"
            data-name="Hasan"
            onclick="openChat('Hasan')"
        >

            <div class="avatar">
                👨‍🔧
            </div>

            <div class="chat-info">

                <div class="chat-name">
                    Hasan
                </div>

                <div class="last-message">
                    Call me when you are free.
                </div>

            </div>

            <div class="chat-time">
                Yesterday
            </div>

        </div>

    </div>


    <!-- Empty search result -->

    <div
        class="empty"
        id="emptyResult"
    >

        <div class="empty-icon">
            🔍
        </div>

        <div>
            No chats found
        </div>

    </div>

</main>


<!-- ================= SIDE MENU ================= -->

<div
    class="overlay"
    id="menuOverlay"
    onclick="closeMenu(event)"
>

    <aside class="side-menu">

        <div class="menu-header">

            <img
                id="menuProfile"
                class="menu-avatar"
                src="https://i.pravatar.cc/100?img=12"
                alt="Profile"
            >

            <div class="menu-title">
                RAZTARA User
            </div>

            <div class="menu-subtitle">
                Connect • Call • Share
            </div>

        </div>


        <div class="menu-list">

            <button
                class="menu-item"
                onclick="openProfile()"
            >
                <span class="menu-icon">👤</span>
                Profile
            </button>


            <button
                class="menu-item"
                onclick="openCalls()"
            >
                <span class="menu-icon">📞</span>
                Calls
            </button>


            <button
                class="menu-item"
                onclick="showSettings()"
            >
                <span class="menu-icon">⚙️</span>
                Settings
            </button>


            <button
                class="menu-item"
                onclick="logout()"
            >
                <span class="menu-icon">🚪</span>
                Logout
            </button>

        </div>

    </aside>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <button
        class="nav-btn active"
        onclick="goHome()"
    >
        <span class="nav-icon">💬</span>
        Chats
    </button>


    <button
        class="nav-btn"
        onclick="openCalls()"
    >
        <span class="nav-icon">📞</span>
        Calls
    </button>


    <button
        class="nav-btn"
        onclick="openProfile()"
    >
        <span class="nav-icon">👤</span>
        Profile
    </button>

</nav>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================= LOGIN CHECK ================= */

async function checkLogin(){

    const { data, error } =
        await supabaseClient.auth.getSession();

    if(error || !data.session){

        window.location.href = "login.html";

        return;
    }

    const user = data.session.user;

    console.log("Logged in:", user.email);

}

checkLogin();


/* ================= MENU ================= */

function openMenu(){

    document
    .getElementById("menuOverlay")
    .classList.add("active");

}


function closeMenu(event){

    if(event.target.id === "menuOverlay"){

        document
        .getElementById("menuOverlay")
        .classList.remove("active");

    }

}


/* ================= NAVIGATION ================= */

function goHome(){

    window.location.href = "index.html";

}


function openProfile(){

    window.location.href = "profile.html";

}


function openCalls(){

    window.location.href = "calls.html";

}


function openChat(name){

    window.location.href =
        "chat.html?user=" +
        encodeURIComponent(name);

}


/* ================= SEARCH ================= */

function searchChats(){

    const input =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const items =
        document.querySelectorAll(".chat-item");

    let found = 0;

    items.forEach(function(item){

        const name =
            item
            .getAttribute("data-name")
            .toLowerCase();

        if(name.includes(input)){

            item.style.display = "flex";
            found++;

        }else{

            item.style.display = "none";

        }

    });


    const empty =
        document.getElementById("emptyResult");

    if(found === 0){

        empty.style.display = "block";

    }else{

        empty.style.display = "none";

    }

}


/* ================= SETTINGS ================= */

function showSettings(){

    document
    .getElementById("menuOverlay")
    .classList.remove("active");

    alert("Settings page will be added next.");

}


/* ================= REAL LOGOUT ================= */

async function logout(){

    const confirmLogout =
        confirm("Are you sure you want to logout?");

    if(!confirmLogout){

        return;

    }


    const { error } =
        await supabaseClient.auth.signOut();


    if(error){

        alert(
            "Logout failed: " +
            error.message
        );

        return;

    }


    window.location.href = "login.html";

}


</script>

</body>
</html>
