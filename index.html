  /* =========================================================
   RAZTARA
   PART 2
   SUPABASE + AUTH + PROFILE + CHAT + MESSAGES
   ========================================================= */


/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
  "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   GLOBALS
   ========================= */

let currentUser = null;

let currentProfile = null;

let currentConversationId = null;

let currentChatUserId = null;

let currentChatProfile = null;

let messageSubscription = null;

let chatListSubscription = null;

let searchTimer = null;

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


/* =========================
   HELPERS
   ========================= */

function $(id){
  return document.getElementById(id);
}


function showToast(message){

  const toast = $("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      ()=>{
        toast.classList.remove("show");
      },
      2500
    );

}


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function avatarUrl(profile){

  if(
    profile &&
    profile.avatar_url
  ){
    return profile.avatar_url;
  }

  return "";
}


function avatarHtml(profile,className="avatar"){

  const url =
    avatarUrl(profile);

  if(url){

    return `
      <img
        class="${className}"
        src="${escapeHtml(url)}"
        alt=""
      >
    `;

  }

  const name =
    profile?.full_name ||
    profile?.username ||
    "U";

  return `
    <div class="${className}">
      ${escapeHtml(
        name
          .trim()
          .charAt(0)
          .toUpperCase()
      )}
    </div>
  `;

}


function formatTime(date){

  if(!date){
    return "";
  }

  return new Date(date)
    .toLocaleTimeString(
      "bn-BD",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================
   AUTH UI
   ========================= */

let isSignup = false;


$("switchButton").addEventListener(
  "click",
  ()=>{
    isSignup =
      !isSignup;

    $("signupFields")
      .classList.toggle(
        "hidden",
        !isSignup
      );

    $("authButton")
      .textContent =

        ? "Sign Up"

    $("switchButton")

/* =========================
   PROFILE
   ========================= */

async function ensureProfile(user){

  const {
    data:existing,
    error:selectError
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq(
      "id",
      user.id
    )
    .maybeSingle();

  if(selectError){
    throw selectError;
  }


  if(existing){

    currentProfile =
      existing;

    return existing;

  }


  const metadata =
    user.user_metadata || {};


  const baseUsername =
    metadata.username ||
    (
      user.email
        ?.split("@")[0] ||
      "user"
    );


  const username =
    baseUsername
      .toLowerCase()
      .replace(
        /[^a-z0-9_]/g,
        ""
      )
      .slice(0,25) ||
    "user";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .insert({
      id:user.id,

      username:

        username,

      full_name:
        metadata.full_name ||
        "Raztara User",

      bio:""

    })
    .select()
    .single();


  if(error){

    /*
      Username duplicate হলে অন্য username
      দিয়ে আবার চেষ্টা
    */

    if(error.code === "23505"){

      const randomUsername =
        username +
        Math.floor(
          Math.random()*9999
        );

      const retry =
        await supabaseClient
          .from("profiles")
          .insert({
            id:user.id,

            username:
              randomUsername,

            full_name:
              metadata.full_name ||
              "Raztara User",

            bio:""
          })
          .select()
          .single();

      if(retry.error){
        throw retry.error;
      }

      currentProfile =
        retry.data;

      return retry.data;

    }

    throw error;
  }


  currentProfile =
    data;

  return data;

}

async function searchUsers(query){

    return;

  const clean =
    query
      .replace(/%/g,"")
      .replace(/,/g,"")
      .trim();


  if(!clean){
    return;
  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .or(
        `username.ilike.%${clean}%,full_name.ilike.%${clean}%`
      )
      .neq(
        "id",
        currentUser.id
      )
      .limit(15);


    if(error){
      throw error;
    }


    if(!data || !data.length){

      $("searchResults")

                  user.username
                )}
              </div>

                class="searchUsername"
              >

          </div>

        `
      )
      .join("");

  }catch(error){

    console.error(
      "Search error:",

    );

    showToast(
      "User search সমস্যা"
    );

  }

}

/* =========================
   CONVERSATION
   ========================= */

async function getOrCreateConversation(
  otherUserId
){

  if(
    !currentUser ||
    !otherUserId
  ){
    return null;
  }


  /*
    প্রথমে আমার conversation বের করি
  */

  const {
    data:myMemberships,
    error
  } =
  await supabaseClient
    .from("conversation_members")
    .select(
      "conversation_id"
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){
    throw error;
  }


  const conversationIds =
    (myMemberships || [])
      .map(
        item =>
          item.conversation_id
      );


  /*
    Existing conversation আছে কি না
  */

  if(
    conversationIds.length
  ){

    const {
      data:matches,
      error:matchError
    } =
    await supabaseClient
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .in(
        "conversation_id",
        conversationIds
      )
      .eq(
        "user_id",
        otherUserId
      );


    if(matchError){
      throw matchError;
    }


    if(
      matches &&
      matches.length
    ){

      return
        matches[0]
          .conversation_id;

    }

  }


  /*
    নতুন conversation
  */

  const {
    data:conversation,
    error:createError
  } =
  await supabaseClient
    .from("conversations")
    .insert({
      created_by:
        currentUser.id,

      is_group:
        false
    })
    .select()
    .single();


  if(createError){
    throw createError;
  }


  const conversationId =
    conversation.id;


  /*
    দুইজনকে member করি
  */

  const {
    error:memberError
  } =
  await supabaseClient
    .from("conversation_members")
    .insert([

      {
        conversation_id:
          conversationId,

        user_id:
          currentUser.id
      },

      {
        conversation_id:
          conversationId,

        user_id:
          otherUserId
      }

    ]);


  if(memberError){

    console.error(
      "Member error:",
      memberError
    );

    throw memberError;

  }


  return conversationId;

}

/* =========================
   CHAT LIST
   ========================= */

async function loadChatList(){

  if(!currentUser){
    return;
  }


  try{

    const {
      data:myMemberships,
      error
    } =
    await supabaseClient
      .from("conversation_members")
      .select(
        "conversation_id"
      )
      .eq(
        "user_id",
        currentUser.id
      );


    if(error){
      throw error;
    }


    if(
      !myMemberships ||
      !myMemberships.length
    ){

      $("chatList")
        .innerHTML = `
          <div class="empty">
            এখনো কোনো chat নেই
          </div>
        `;

      return;

    }


    const ids =
      myMemberships
        .map(
          x =>
            x.conversation_id
        );


    const {
      data:members,
      error:memberError
    } =
    await supabaseClient
      .from("conversation_members")
      .select(
        "conversation_id,user_id"
      )
      .in(
        "conversation_id",
        ids
      );


    if(memberError){
      throw memberError;
    }


    const otherIds =
      [
        ...new Set(
          (members || [])
            .filter(
              m =>
                m.user_id !==
                currentUser.id
            )
            .map(
              m =>
                m.user_id
            )
        )
      ];


    if(!otherIds.length){

      $("chatList")
        .innerHTML = `
          <div class="empty">
            কোনো user পাওয়া যায়নি
          </div>
        `;

      return;

    }


    const {
      data:profiles,
      error:profileError
    } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        otherIds
      );


    if(profileError){
      throw profileError;
    }


    const profileMap =
      new Map(
        (profiles || [])
          .map(
            p =>
              [p.id,p]
          )
      );


    const conversationMap =
      new Map();


    (members || [])
      .forEach(
        m=>{

          if(
            m.user_id !==
            currentUser.id
          ){

            conversationMap.set(
              m.user_id,
              m.conversation_id
            );

          }

        }
      );


    $("chatList")
      .innerHTML =
      (profiles || [])
        .map(
          profile=>`

            <div
              class="chatItem"
              onclick="
                openChatWithUser(
                  '${profile.id}'
                )
              "
            >

              ${avatarHtml(
                profile
              )}

              <div
                class="chatInfo"
              >

                <div
                  class="chatName"
                >
                  ${escapeHtml(
                    profile.full_name ||
                    profile.username ||
                    "User"
                  )}
                </div>

                <div
                  class="chatLast"
                >
                  @${escapeHtml(
                    profile.username ||
                    ""
                  )}
                </div>

              </div>

            </div>

          `
        )
        .join("");


  }catch(error){

    console.error(
      "Chat list error:",
      error
    );

    $("chatList")
      .innerHTML = `
        <div class="empty">
          Chat list load করতে সমস্যা হয়েছে
        </div>
      `;

  }

}


/* =========================
   CHAT LIST REALTIME
   ========================= */

function subscribeChatList(){

  if(chatListSubscription){

    supabaseClient
      .removeChannel(
        chatListSubscription
      );

  }


  chatListSubscription =
    supabaseClient
      .channel(
        "raztara-chat-list-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:
            "conversation_members"
        },
        async ()=>{
          await loadChatList();
        }
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages"
        },
        async ()=>{
          await loadChatList();
        }
      )
      .subscribe();

}


/* =========================
   MESSAGES
   ========================= */

async function loadMessages(){

  if(
    !currentConversationId
  ){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select("*")
    .eq(
      "conversation_id",
      currentConversationId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){
    throw error;
  }


  $("messages")
    .innerHTML = "";


  (data || [])
    .forEach(
      message =>
        renderMessage(
          message
        )
    );


  scrollMessages();

}


function scrollMessages(){

  const box =
    $("messages");

  box.scrollTop =
    box.scrollHeight;

}


function renderMessage(
  message
){

  const mine =
    message.sender_id ===
    currentUser.id;


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "messageRow " +
    (
      mine
        ? "mine"
        : ""
    );


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "messageBubble";


  let body = "";


  if(
    message.message_type ===
    "image"
  ){

    body = `
      <img
        class="messageImage"
        src="${escapeHtml(
          message.file_url
        )}"
        alt="image"
      >
    `;

  }
  else if(
    message.message_type ===
    "audio"
  ){

    body = `
      <audio
        class="messageAudio"
        controls
        src="${escapeHtml(
          message.file_url
        )}"
      ></audio>
    `;

  }
  else if(
    message.message_type ===
    "video"
  ){

    body = `
      <video
        controls
        style="
          max-width:230px;
          border-radius:12px;
        "
        src="${escapeHtml(
          message.file_url
        )}"
      ></video>
    `;

  }
  else if(
    message.message_type ===
    "file"
  ){

    body = `
      <a
        class="messageFile"
        href="${escapeHtml(
          message.file_url
        )}"
        target="_blank"
        rel="noopener"
      >
        📎
        ${escapeHtml(
          message.content ||
          "File"
        )}
      </a>
    `;

  }
  else if(
    message.message_type ===
    "location"
  ){

    body = `
      <a
        class="locationBtn"
        href="${escapeHtml(
          message.content
        )}"
        target="_blank"
        rel="noopener"
      >
        📍 Location খুলুন
      </a>
    `;

  }
  else{

    body =
      escapeHtml(
        message.content
      )
      .replace(
        /\n/g,
        "<br>"
      );

  }


  bubble.innerHTML =
    `
      <div>
        ${body}
      </div>

      <div class="messageTime">
        ${formatTime(
          message.created_at
        )}
      </div>
    `;


  row.appendChild(
    bubble
  );


  $("messages")
    .appendChild(
      row
    );

}


function subscribeMessages(){

  if(messageSubscription){

    supabaseClient
      .removeChannel(
        messageSubscription
      );

  }


  if(
    !currentConversationId
  ){
    return;
  }


  const conversationId =
    currentConversationId;


  messageSubscription =
    supabaseClient
      .channel(
        "raztara-messages-" +
        conversationId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload=>{

          renderMessage(
            payload.new
          );

          scrollMessages();

        }
      )
      .subscribe();

}

  try{

    input.value = "";


    const {
      error
    } =
    await supabaseClient
      .from("messages")
      .insert({

$("recordBtn")

    toggleRecording
  );


async function toggleRecording(){

  if(isRecording){

    stopRecording();

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder
      .ondataavailable =
      event=>{

        if(
          event.data &&
          event.data.size
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder
      .onstop =
      async ()=>{

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        const blob =
          new Blob(
            audioChunks,
            {
              type:
                "audio/webm"
            }
          );


        await uploadVoice(
          blob
        );

      };


    mediaRecorder.start();

    isRecording =
      true;

    $("recordBtn")
      .textContent =
      "⏹️";

    showToast(
      "Recording চলছে..."
    );

  }catch(error){

    console.error(
      error
    );

    showToast(
      "Microphone permission দিন"
    );

  }

}


function stopRecording(){

  if(
    mediaRecorder &&
    isRecording
  ){

    mediaRecorder.stop();

    isRecording =
      false;

    $("recordBtn")
      .textContent =
      "🎙️";

  }

}

/* =========================
   START CALL
   ========================= */

async function startRaztaraCall(
  mode
){

  if(
    !currentUser ||
    !currentChatUserId ||
    !currentConversationId
  ){

    showToast(
      "আগে একটি chat খুলুন"
    );

    return;

  }


  if(
    callState !==
    "idle"
  ){

    showToast(
      "একটি call ইতিমধ্যে চলছে"
    );

    return;

  }


  try{

    callMode =
      mode;

    callConversationId =
      currentConversationId;

    callState =
      "calling";


    const constraints =
      mode === "video"
        ? {
            audio:true,
            video:true
          }
        : {
            audio:true,
            video:false
          };


    callLocalStream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    showRaztaraCallUI(
      "outgoing"
    );


    await createRaztaraPeer();


    await startRaztaraCallSignaling();


    callPeer =
      createPeerObject();


    /*
      createPeerObject আবার local stream
      ও ICE handler setup করবে।
    */

    callPeer =
      callPeer;


    const offer =
      await callPeer
        .createOffer();


    await callPeer
      .setLocalDescription(
        offer
      );


    await sendRaztaraCallSignal(
      "offer",
      {
        sdp:
          offer.sdp,

        type:
          offer.type,

        mode:
          mode
      }
    );


    $("callStatus")
      .textContent =
      "Calling...";


  }catch(error){

    console.error(
      "Start call error:",
      error
    );

    showToast(
      error.message ||
      "Call শুরু করা যায়নি"
    );

    await cleanupCall();

  }

}


/* =========================
   PEER CREATION
   ========================= */

async function createRaztaraPeer(){

  if(callPeer){

    try{
      callPeer.close();
    }catch(e){}

  }


  callPeer =
    createPeerObject();

  return callPeer;

}


function createPeerObject(){

  const peer =
    new RTCPeerConnection(
      rtcConfiguration
    );


  callRemoteStream =
    new MediaStream();


  $("callRemoteVideo")
    .srcObject =
    callRemoteStream;


  if(callLocalStream){

    $("callLocalVideo")
      .srcObject =
      callLocalStream;


    callLocalStream
      .getTracks()
      .forEach(
        track=>{

          peer.addTrack(
            track,
            callLocalStream
          );

        }
      );

  }


  peer.ontrack =
    event=>{

      event.streams[0]
        ?.getTracks()
        .forEach(
          track=>{

            callRemoteStream
              .addTrack(
                track
              );

          }
        );


      $("callRemoteVideo")
        .srcObject =
        callRemoteStream;

    };


  peer.onicecandidate =
    async event=>{

      if(
        event.candidate &&
        callConversationId
      ){

        try{

          await sendRaztaraCallSignal(
            "ice",
            {
              candidate:
                event.candidate
            }
          );

        }catch(error){

          console.error(
            "ICE send error:",
            error
          );

        }

      }

    };


  peer.onconnectionstatechange =
    ()=>{

      const state =
        peer.connectionState;


      if(
        state ===
        "connected"
      ){

        callState =
          "connected";

        $("callStatus")
          .textContent =
          "Connected";

      }


      if(
        state ===
        "failed"
      ){

        showToast(
          "Call connection failed"
        );

        cleanupCall();

      }


      if(
        state ===
        "disconnected"
      ){

        $("callStatus")
          .textContent =
          "Disconnected";

      }

    };


  return peer;

}


/* =========================
   SIGNALING SUBSCRIPTION
   ========================= */

async function startRaztaraCallSignaling(){

  if(callSubscription){

    try{

      await supabaseClient
        .removeChannel(
          callSubscription
        );

    }catch(e){}

    callSubscription =
      null;

  }


  if(
    !callConversationId
  ){
    return;
  }


  const conversationId =
    callConversationId;


  callSubscription =
    supabaseClient
      .channel(
        "raztara-call-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:
            "call_signals",

          filter:
            "conversation_id=eq." +
            conversationId
        },
        async payload=>{

          if(
            !payload.new
          ){
            return;
          }


          if(
            payload.new.sender_id ===
            currentUser.id
          ){
            return;
          }


          await handleRaztaraCallSignal(
            payload.new
          );

        }
      )
      .subscribe();

}


/* =========================
   SEND SIGNAL
   ========================= */

async function sendRaztaraCallSignal(
  signalType,
  payload
){

  if(
    !currentUser ||
    !callConversationId
  ){
    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("call_signals")
    .insert({
      conversation_id:
        callConversationId,

      sender_id:
        currentUser.id,

      signal_type:
        signalType,

      payload:
        payload || {}
    });


  if(error){

    console.error(
      "Call signal error:",
      error
    );

    throw error;

  }

}


/* =========================
   RECEIVE SIGNAL
   ========================= */

async function handleRaztaraCallSignal(
  signal
){

  if(
    !signal ||
    !signal.signal_type
  ){
    return;
  }


  /*
    Incoming offer
  */

  if(
    signal.signal_type ===
    "offer"
  ){

    if(
      callState !==
      "idle"
    ){

      /*
        আমি already call-এ থাকলে busy পাঠাই
      */

      try{

        const oldConversation =
          callConversationId;

        callConversationId =
          signal.conversation_id;

        await sendRaztaraCallSignal(
          "busy",
          {}
        );

        callConversationId =
          oldConversation;

      }catch(error){

        console.error(
          error
        );

      }

      return;

    }


    await receiveRaztaraOffer(
      signal
    );

    return;

  }


  /*
    Answer
  */

  if(
    signal.signal_type ===
    "answer"
  ){

    if(
      !callPeer
    ){
      return;
    }


    try{

      const description =
        new RTCSessionDescription({
          type:
            signal.payload.type,

          sdp:
            signal.payload.sdp
        });


      await callPeer
        .setRemoteDescription(
          description
        );


      callState =
        "connected";

      $("callStatus")
        .textContent =
        "Connected";

      await flushPendingIce();

    }catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

    return;

  }


  /*
    ICE
  */

  if(
    signal.signal_type ===
    "ice"
  ){

    const candidate =
      signal.payload
        ?.candidate;


    if(!candidate){
      return;
    }


    if(
      callPeer &&
      callPeer.remoteDescription
    ){

      try{

        await callPeer
          .addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          );

      }catch(error){

        console.error(
          "ICE error:",
          error
        );

      }

    }else{

      pendingIceCandidates
        .push(
          candidate
        );

    }

    return;

  }


  /*
    Busy
  */

  if(
    signal.signal_type ===
    "busy"
  ){

    $("callStatus")
      .textContent =
      "User is busy";

    showToast(
      "User এখন অন্য call-এ আছেন"
    );

    setTimeout(
      ()=>{
        cleanupCall();
      },
      1200
    );

    return;

  }


  /*
    Reject
  */

  if(
    signal.signal_type ===
    "reject"
  ){

    $("callStatus")
      .textContent =
      "Call rejected";

    showToast(
      "Call reject করা হয়েছে"
    );

    setTimeout(
      ()=>{
        cleanupCall();
      },
      1000
    );

    return;

  }


  /*
    Hangup
  */

  if(
    signal.signal_type ===
    "hangup"
  ){

    showToast(
      "Call শেষ হয়েছে"
    );

    await cleanupCall();

    return;

  }

}


/* =========================
   RECEIVE OFFER
   ========================= */

async function receiveRaztaraOffer(
  signal
){

  try{

    pendingCall =
      signal;


    callConversationId =
      signal.conversation_id;


    callMode =
      signal.payload?.mode ||
      "audio";


    callState =
      "incoming";


    const senderProfile =
      await getProfileById(
        signal.sender_id
      );


    pendingCall.senderProfile =
      senderProfile;


    showRaztaraCallUI(
      "incoming",
      senderProfile
    );


    await startRaztaraCallSignaling();


  }catch(error){

    console.error(
      "Receive offer error:",
      error
    );

    await cleanupCall();

  }

}


/* =========================
   ACCEPT
   ========================= */

async function acceptRaztaraCall(){

  if(
    !pendingCall
  ){
    return;
  }


  try{

    const signal =
      pendingCall;


    callMode =
      signal.payload?.mode ||
      "audio";


    const constraints =
      callMode === "video"
        ? {
            audio:true,
            video:true
          }
        : {
            audio:true,
            video:false
          };


    callLocalStream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    $("acceptCallBtn")
      .classList.add(
        "hidden"
      );

    $("rejectCallBtn")
      .classList.add(
        "hidden"
      );

    $("endCallBtn")
      .classList.remove(
        "hidden"
      );


    await createRaztaraPeer();


    const remoteDescription =
      new RTCSessionDescription({
        type:
          signal.payload.type,

        sdp:
          signal.payload.sdp
      });


    await callPeer
      .setRemoteDescription(
        remoteDescription
      );


    await flushPendingIce();


    const answer =
      await callPeer
        .createAnswer();


    await callPeer
      .setLocalDescription(
        answer
      );


    callState =
      "connected";


    $("callStatus")
      .textContent =
      "Connecting...";


    await sendRaztaraCallSignal(
      "answer",
      {
        type:
          answer.type,

        sdp:
          answer.sdp
      }
    );


    pendingCall =
      null;


  }catch(error){

    console.error(
      "Accept call error:",
      error
    );

    showToast(
      error.message ||
      "Call accept করা যায়নি"
    );

    await cleanupCall();

  }

}


/* =========================
   REJECT
   ========================= */

async function rejectRaztaraCall(){

  if(
    !pendingCall
  ){
    await cleanupCall();
    return;
  }


  try{

    callConversationId =
      pendingCall
        .conversation_id;


    await sendRaztaraCallSignal(
      "reject",
      {}
    );

  }catch(error){

    console.error(
      error
    );

  }


  pendingCall =
    null;


  await cleanupCall();

}


/* =========================
   ICE QUEUE
   ========================= */

async function flushPendingIce(){

  if(
    !callPeer ||
    !callPeer.remoteDescription
  ){
    return;
  }


  if(
    !pendingIceCandidates.length
  ){
    return;
  }


  const list =
    [
      ...pendingIceCandidates
    ];


  pendingIceCandidates =
    [];


  for(
    const candidate of list
  ){

    try{

      await callPeer
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    }catch(error){

      console.error(
        "Queued ICE error:",
        error
      );

    }

  }

}


/* =========================
   CALL UI
   ========================= */

function showRaztaraCallUI(
  type,
  profile=null
){

  const overlay =
    $("callOverlay");


  overlay.classList
    .add("show");


  const name =
    profile?.full_name ||
    profile?.username ||
    currentChatProfile?.full_name ||
    currentChatProfile?.username ||
    "User";


  $("callTitle")
    .textContent =
    name;


  $("callIncomingAvatar")
    .innerHTML =
    profile
      ? avatarHtml(
          profile,
          "avatar"
        )
      : "👤";


  $("callRemoteVideo")
    .style.display =
    callMode ===
    "video"
      ? "block"
      : "none";


  $("callLocalVideo")
    .style.display =
    callMode ===
    "video"
      ? "block"
      : "none";


  $("callAudioAvatar")
    .style.display =
    callMode ===
    "video"
      ? "none"
      : "flex";


  if(type === "incoming"){

    $("callStatus")
      .textContent =
      (
        callMode ===
        "video"
          ? "Incoming video call"
          : "Incoming audio call"
      );


    $("acceptCallBtn")
      .classList.remove(
        "hidden"
      );

    $("rejectCallBtn")
      .classList.remove(
        "hidden"
      );

    $("endCallBtn")
      .classList.add(
        "hidden"
      );

  }else{

    $("callStatus")
      .textContent =
      "Calling...";


    $("acceptCallBtn")
      .classList.add(
        "hidden"
      );

    $("rejectCallBtn")
      .classList.add(
        "hidden"
      );

    $("endCallBtn")
      .classList.remove(
        "hidden"
      );

  }


  if(callLocalStream){

    $("callLocalVideo")
      .srcObject =
      callLocalStream;

  }

}


/* =========================
   END CALL
   ========================= */

async function endRaztaraCall(){

  try{

    if(
      callConversationId &&
      currentUser
    ){

      await sendRaztaraCallSignal(
        "hangup",
        {}
      );

    }

  }catch(error){

    console.error(
      "Hangup error:",
      error
    );

  }


  await cleanupCall();

}


/* =========================
   CLEANUP
   ========================= */

async function cleanupCall(){

  callState =
    "idle";


  pendingCall =
    null;


  pendingIceCandidates =
    [];


  if(callSubscription){

    try{

      await supabaseClient
        .removeChannel(
          callSubscription
        );

    }catch(error){

      console.error(
        error
      );

    }

    callSubscription =
      null;

  }


  if(callPeer){

    try{

      callPeer.ontrack =
        null;

      callPeer.onicecandidate =
        null;

      callPeer.close();

    }catch(error){

      console.error(
        error
      );

    }

    callPeer =
      null;

  }


  if(callLocalStream){

    callLocalStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    callLocalStream =
      null;

  }


  if(callRemoteStream){

    callRemoteStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    callRemoteStream =
      null;

  }


  $("callRemoteVideo")
    .srcObject =
    null;

  $("callLocalVideo")
    .srcObject =
    null;


  $("callOverlay")
    .classList
    .remove(
      "show"
    );


  $("acceptCallBtn")
    .classList
    .remove(
      "hidden"
    );

  $("rejectCallBtn")
    .classList
    .remove(
      "hidden"
    );

  $("endCallBtn")
    .classList
    .add(
      "hidden"
    );


  callConversationId =
    null;

  callMode =
    null;

}


/* =========================
   GLOBAL ERROR
   ========================= */

window.addEventListener(
  "error",
  event=>{

    console.error(
      "Global error:",
      event.error ||
      event.message
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  event=>{

    console.error(
      "Unhandled promise:",
      event.reason
    );

  }
);

   END RAZTARA
