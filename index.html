<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RAZTARA | Connect • Call • Share</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}


/* =========================
   LOGIN SCREEN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#f5f5f5;
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px 22px;
    border-radius:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.login-logo{
    text-align:center;
    color:#075e54;
    font-size:31px;
    font-weight:bold;
    margin-bottom:7px;
}

.login-subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:15px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
    font-size:15px;
}

.input-box input:focus{
    border-color:#075e54;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:48px;
}

.show-password{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
}

.login-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#075e54;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-button:disabled{
    opacity:.6;
}

.login-links{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
}

.login-links a{
    color:#075e54;
    text-decoration:none;
    font-size:14px;
}

.register-button{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:1px solid #075e54;
    border-radius:9px;
    background:white;
    color:#075e54;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.login-message{
    text-align:center;
    margin-top:14px;
    font-size:14px;
}


/* =========================
   APP SCREEN
========================= */

#appScreen{
    display:none;
    min-height:100vh;
}


/* HEADER */

.header{
    height:60px;
    background:#075e54;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:20;
}

.menu-button{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
    cursor:pointer;
}

.header-logo{
    font-size:22px;
    font-weight:bold;
}

.profile-button{
    width:40px;
    height:40px;
    border-radius:50%;

    background:#ddd;
    color:#555;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    cursor:pointer;
}


/* CONTENT */

.content{
    max-width:600px;
    margin:auto;

    padding:74px 12px 82px;
}


/* SEARCH */

.search-box{
    width:100%;
    padding:13px 17px;

    border:0;
    border-radius:25px;

    background:white;

    box-shadow:0 1px 6px rgba(0,0,0,.10);

    outline:none;
    font-size:15px;

    margin-bottom:12px;
}


/* CHAT LIST */

.chat-list{
    background:white;
    border-radius:11px;
    overflow:hidden;
}

.chat{
    display:flex;
    align-items:center;

    padding:14px;

    border-bottom:1px solid #eee;

    cursor:pointer;
}

.chat:last-child{
    border-bottom:none;
}

.chat-avatar{
    width:50px;
    height:50px;

    border-radius:50%;

    background:#ddd;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    margin-right:12px;
}

.chat-info{
    flex:1;
}

.chat-name{
    font-size:16px;
    font-weight:bold;
    margin-bottom:5px;
}

.chat-message{
    color:#777;
    font-size:14px;
}


/* BOTTOM NAV */

.bottom-nav{
    height:65px;

    position:fixed;
    bottom:0;
    left:0;
    right:0;

    background:white;

    border-top:1px solid #ddd;

    display:flex;
    justify-content:space-around;
    align-items:center;

    z-index:20;
}

.nav-button{
    border:0;
    background:none;

    color:#444;

    font-size:13px;

    cursor:pointer;

    text-align:center;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}


/* SIDE MENU */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.4);

    z-index:30;

    display:none;
}

.overlay.active{
    display:block;
}

.side-menu{
    position:fixed;

    top:0;
    left:-280px;

    width:280px;
    height:100vh;

    background:white;

    z-index:40;

    box-shadow:3px 0 12px rgba(0,0,0,.2);

    transition:.25s;

    padding-top:70px;
}

.side-menu.active{
    left:0;
}

.menu-item{
    padding:17px 20px;

    border-bottom:1px solid #eee;

    cursor:pointer;

    font-size:16px;
}

.menu-item:hover{
    background:#f5f5f5;
}

</style>

</head>


<body>


<!-- ==================================================
     LOGIN SCREEN
================================================== -->

<div id="loginScreen">

    <div class="login-box">

        <div class="login-logo">
            RAZTARA
        </div>

        <div class="login-subtitle">
            Connect • Call • Share
        </div>


        <div class="input-box">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                autocomplete="email"
            >

        </div>


        <div class="input-box password-box">

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
            >

            <span
                class="show-password"
                onclick="togglePassword()"
            >
                👁️
            </span>

        </div>


        <button
            class="login-button"
            id="loginButton"
            onclick="loginUser()"
        >
            LOGIN
        </button>


        <div class="login-links">

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>


        <button
            class="register-button"
            onclick="goRegistration()"
        >
            CREATE ACCOUNT
        </button>


        <div
            class="login-message"
            id="loginMessage"
        ></div>

    </div>

</div>



<!-- ==================================================
     RAZTARA APP SCREEN
================================================== -->

<div id="appScreen">


    <!-- HEADER -->

    <div class="header">

        <div
            class="menu-button"
            onclick="openMenu()"
        >
            ☰
        </div>


        <div class="header-logo">
            RAZTARA
        </div>


        <div
            class="profile-button"
            onclick="openProfile()"
        >
            👤
        </div>

    </div>



    <!-- MAIN -->

    <div class="content">


        <input
            type="text"
            class="search-box"
            id="searchBox"
            placeholder="Search people..."
            oninput="searchPeople()"
        >


        <div
            class="chat-list"
            id="chatList"
        >


            <div
                class="chat"
                onclick="openChat()"
            >

                <div class="chat-avatar">
                    👤
                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        Rahim
                    </div>

                    <div class="chat-message">
                        Hello...
                    </div>

                </div>

            </div>


            <div
                class="chat"
                onclick="openChat()"
            >

                <div class="chat-avatar">
                    👤
                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        Karim
                    </div>

                    <div class="chat-message">
                        Hi
                    </div>

                </div>

            </div>


            <div
                class="chat"
                onclick="openChat()"
            >

                <div class="chat-avatar">
                    👤
                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        Sumaiya
                    </div>

                    <div class="chat-message">
                        How are you?
                    </div>

                </div>

            </div>


            <div
                class="chat"
                onclick="openChat()"
            >

                <div class="chat-avatar">
                    👤
                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        Hasan
                    </div>

                    <div class="chat-message">
                        Good morning
                    </div>

                </div>

            </div>


        </div>

    </div>



    <!-- SIDE MENU OVERLAY -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeMenu()"
    ></div>


    <!-- SIDE MENU -->

    <div
        class="side-menu"
        id="sideMenu"
    >

        <div
            class="menu-item"
            onclick="openProfile()"
        >
            👤 Profile
        </div>


        <div
            class="menu-item"
            onclick="openCalls()"
        >
            📞 Calls
        </div>


        <div
            class="menu-item"
            onclick="openSettings()"
        >
            ⚙️ Settings
        </div>


        <div
            class="menu-item"
            onclick="logout()"
        >
            🚪 Logout
        </div>

    </div>



    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

        <button
            class="nav-button"
            onclick="goChats()"
        >
            <span class="nav-icon">💬</span>
            Chats
        </button>


        <button
            class="nav-button"
            onclick="goCalls()"
        >
            <span class="nav-icon">📞</span>
            Calls
        </button>


        <button
            class="nav-button"
            onclick="openProfile()"
        >
            <span class="nav-icon">👤</span>
            Profile
        </button>

    </div>


</div>



<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==================================================
   START
================================================== */

async function startApp(){

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();


    if(data && data.session){

        showApp();

    }else{

        showLogin();

    }

}


/* ==================================================
   SHOW LOGIN
================================================== */

function showLogin(){

    document
        .getElementById("loginScreen")
        .style.display = "flex";

    document
        .getElementById("appScreen")
        .style.display = "none";

}


/* ==================================================
   SHOW APP
================================================== */

function showApp(){

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("appScreen")
        .style.display = "block";

}


/* ==================================================
   LOGIN
================================================== */

async function loginUser(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    const message =
        document
        .getElementById("loginMessage");


    const button =
        document
        .getElementById("loginButton");


    if(!email || !password){

        message.style.color = "red";

        message.innerText =
            "Email এবং Password দিন।";

        return;

    }


    button.disabled = true;

    button.innerText =
        "LOGGING IN...";


    const {
        data,
        error
    } =
    await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

    });


    if(error){

        message.style.color = "red";

        message.innerText =
            error.message;

        button.disabled = false;

        button.innerText =
            "LOGIN";

        return;

    }


    message.innerText = "";

    showApp();


    button.disabled = false;

    button.innerText =
        "LOGIN";

}


/* ==================================================
   PASSWORD SHOW / HIDE
================================================== */

function togglePassword(){

    const password =
        document
        .getElementById("loginPassword");


    if(password.type === "password"){

        password.type = "text";

    }else{

        password.type = "password";

    }

}


/* ==================================================
   REGISTRATION
================================================== */

function goRegistration(){

    window.location.href =
        "registration.html";

}


/* ==================================================
   FORGOT PASSWORD
================================================== */

function goForgotPassword(){

    window.location.href =
        "forgot-password.html";

}


/* ==================================================
   MENU
================================================== */

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("active");

    document
        .getElementById("overlay")
        .classList.add("active");

}


function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("active");

    document
        .getElementById("overlay")
        .classList.remove("active");

}


/* ==================================================
   SEARCH
================================================== */

function searchPeople(){

    const value =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase();


    const chats =
        document.querySelectorAll(".chat");


    chats.forEach(function(chat){

        const name =
            chat
            .querySelector(".chat-name")
            .innerText
            .toLowerCase();


        if(name.includes(value)){

            chat.style.display =
                "flex";

        }else{

            chat.style.display =
                "none";

        }

    });

}


/* ==================================================
   FUTURE PAGES
================================================== */

function openChat(){

    alert(
        "Chat page আমরা পরের ধাপে তৈরি করব।"
    );

}


function openCalls(){

    closeMenu();

    alert(
        "Calls page আমরা পরের ধাপে তৈরি করব।"
    );

}


function goCalls(){

    alert(
        "Calls page আমরা পরের ধাপে তৈরি করব।"
    );

}


function openProfile(){

    closeMenu();

    alert(
        "Profile page আমরা পরের ধাপে তৈরি করব।"
    );

}


function openSettings(){

    closeMenu();

    alert(
        "Settings page আমরা পরের ধাপে তৈরি করব।"
    );

}


function goChats(){

    closeMenu();

}


/* ==================================================
   LOGOUT
================================================== */

async function logout(){

    closeMenu();


    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );


    if(!confirmLogout){

        return;

    }


    const {
        error
    } =
    await supabaseClient.auth.signOut();


    if(error){

        alert(
            "Logout failed: " +
            error.message
        );

        return;

    }


    showLogin();

}


/* ==================================================
   AUTH STATE
================================================== */

supabaseClient.auth.onAuthStateChange(
    function(event, session){

        if(session){

            showApp();

        }else{

            showLogin();

        }

    }
);


/* START */

startApp();

</script>

</body>
</html>
