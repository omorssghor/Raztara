<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAZTARA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#07131a;
    color:#fff;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px 18px;
    background:
        radial-gradient(circle at top,#123b48 0%,#07131a 45%,#050b0f 100%);
}

.loginBox{
    width:100%;
    max-width:410px;
    padding:34px 24px 28px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    background:rgba(10,27,35,.92);
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    margin-bottom:34px;
}

.logoIcon{
    width:76px;
    height:76px;
    margin:auto;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(135deg,#00d4a5,#008fa8);
    box-shadow:0 12px 30px rgba(0,212,165,.25);
}

.logo h1{
    margin-top:17px;
    font-size:30px;
    letter-spacing:3px;
}

.logo p{
    margin-top:7px;
    color:#8fa7af;
    font-size:13px;
}

.inputGroup{
    margin-bottom:17px;
}

.inputGroup label{
    display:block;
    margin-bottom:8px;
    color:#b9cbd0;
    font-size:13px;
}

.inputBox{
    position:relative;
}

.inputBox input{
    width:100%;
    height:54px;
    padding:0 48px 0 16px;
    border:none;
    outline:none;
    border-radius:15px;
    color:#fff;
    background:#10252e;
    border:1px solid #203b45;
}

.inputBox input:focus{
    border-color:#00cda6;
    box-shadow:0 0 0 3px rgba(0,205,166,.10);
}

.eye{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:#8fa7af;
    font-size:20px;
}

.forgot{
    display:block;
    text-align:right;
    margin:3px 2px 20px;
    color:#00d4a5;
    text-decoration:none;
    font-size:13px;
}

.loginBtn{
    width:100%;
    height:54px;
    border:0;
    border-radius:15px;
    color:#001510;
    font-weight:800;
    background:linear-gradient(135deg,#00e0ad,#00aebd);
    box-shadow:0 12px 25px rgba(0,212,165,.18);
}

.loginBtn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:25px 0;
    color:#66808a;
    font-size:12px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#20343c;
}

.createBtn{
    width:100%;
    height:52px;
    border-radius:15px;
    border:1px solid #00b998;
    background:transparent;
    color:#00d4a5;
    font-weight:700;
}

.message{
    display:none;
    margin-bottom:16px;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:rgba(255,70,70,.10);
    border:1px solid rgba(255,70,70,.25);
    color:#ff9c9c;
}

.success{
    background:rgba(0,212,165,.10);
    border:1px solid rgba(0,212,165,.25);
    color:#72f1d2;
}

/* ================= APP ================= */

#appScreen{
    display:none;
    min-height:100vh;
    background:#07131a;
}

.appHeader{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    border-bottom:1px solid #193039;
    background:#0a1b23;
    position:sticky;
    top:0;
    z-index:10;
}

.menuBtn,
.profileBtn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#102b34;
    color:#fff;
    font-size:21px;
}

.profileBtn img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
}

.appTitle{
    font-size:21px;
    letter-spacing:2px;
    font-weight:800;
}

.search{
    margin:16px;
}

.search input{
    width:100%;
    height:48px;
    border:1px solid #1c3741;
    outline:none;
    border-radius:15px;
    padding:0 16px;
    color:#fff;
    background:#0d222b;
}

.chatList{
    padding:0 10px 90px;
}

.chat{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 8px;
    border-bottom:1px solid #142b33;
}

.avatar{
    width:52px;
    height:52px;
    flex:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#00cda6,#087d99);
    font-weight:800;
}

.chatInfo{
    flex:1;
    min-width:0;
}

.chatTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.chatName{
    font-weight:700;
}

.chatTime{
    color:#718b94;
    font-size:11px;
}

.lastMessage{
    margin-top:5px;
    color:#78919a;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.badge{
    min-width:20px;
    height:20px;
    padding:0 6px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#00cda6;
    color:#001510;
    font-size:11px;
    font-weight:800;
}

.bottomNav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:72px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:#091a22;
    border-top:1px solid #1b343d;
}

.navBtn{
    border:0;
    background:none;
    color:#718b94;
    text-align:center;
    font-size:12px;
}

.navBtn span{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.navBtn.active{
    color:#00d4a5;
}

/* ================= SIDE MENU ================= */

#sideMenu{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.6);
}

.menuPanel{
    width:285px;
    height:100%;
    background:#0a1c24;
    padding:22px 16px;
    box-shadow:10px 0 40px rgba(0,0,0,.35);
}

.menuLogo{
    font-size:24px;
    font-weight:800;
    margin-bottom:28px;
    color:#00d4a5;
}

.menuItem{
    width:100%;
    padding:15px 12px;
    border:0;
    border-radius:12px;
    background:transparent;
    color:#fff;
    text-align:left;
    margin-bottom:5px;
}

.menuItem:hover{
    background:#102b34;
}

.logout{
    margin-top:20px;
    color:#ff8585;
}

@media(max-width:360px){
    .loginBox{
        padding:28px 18px 24px;
    }

    .logo h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN SCREEN ================= -->

<section id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            <div class="logoIcon">R</div>
            <h1>RAZTARA</h1>
            <p>Connect • Call • Share</p>
        </div>

        <div id="message" class="message"></div>

        <div class="inputGroup">
            <label>Email</label>
            <div class="inputBox">
                <input
                    id="email"
                    type="email"
                    placeholder="আপনার Email লিখুন"
                    autocomplete="email"
                >
            </div>
        </div>

        <div class="inputGroup">
            <label>Password</label>
            <div class="inputBox">
                <input
                    id="password"
                    type="password"
                    placeholder="আপনার Password লিখুন"
                    autocomplete="current-password"
                >

                <button
                    class="eye"
                    type="button"
                    onclick="togglePassword()"
                    id="eyeBtn"
                >👁️</button>
            </div>
        </div>

        <a href="forgot-password.html" class="forgot">
            Forgot Password?
        </a>

        <button
            class="loginBtn"
            id="loginBtn"
            onclick="loginUser()"
        >
            LOGIN
        </button>

        <div class="divider">অথবা</div>

        <button
            class="createBtn"
            onclick="goRegistration()"
        >
            ✚ Create Account
        </button>

    </div>

</section>


<!-- ================= APP SCREEN ================= -->

<section id="appScreen">

    <header class="appHeader">

        <button class="menuBtn" onclick="openMenu()">
            ☰
        </button>

        <div class="appTitle">
            RAZTARA
        </div>

        <div id="headerUserName"></div>

        <button
            class="profileBtn"
            type="button"
            onclick="openProfile()"
        >
            <img
                id="headerProfilePhoto"
                src="https://i.pravatar.cc/100?img=12"
                alt="Profile"
            >
        </button>

    </header>

    <div class="search">
        <input
            id="userSearch"
            type="search"
            placeholder="🔍 Search people or chats"
            oninput="filterUsers()"
        >
    </div>

    <!-- Real registered users -->
    <div class="chatList" id="chatList">

        <div style="padding:20px;text-align:center;color:#777;">
            Users loading...
        </div>

    </div>

    <nav class="bottomNav">

        <button class="navBtn active">
            <span>💬</span>
            Chats
        </button>

        <button class="navBtn">
            <span>📞</span>
            Calls
        </button>

        <a href="profile.html" class="navBtn">
            <span>👤</span>
            Profile
        </a>

    </nav>

</section>

<!-- ================= SIDE MENU ================= -->

<div id="sideMenu" onclick="closeMenu(event)">

    <div class="menuPanel" onclick="event.stopPropagation()">

        <div class="menuLogo">
            RAZTARA
        </div>

        <button class="menuItem">
            👤 Profile
        </button>

        <button class="menuItem">
            💬 Chats
        </button>

        <button class="menuItem">
            📞 Calls
        </button>

        <button class="menuItem">
            ⚙️ Settings
        </button>

        <button
            class="menuItem logout"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>

</div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentProfile = null;

/* ================= ELEMENTS ================= */

const loginScreen =
document.getElementById("loginScreen");
/* ================= LOAD USERS ================= */

let allUsers = [];

async function loadUsers(){

    const chatList =
        document.getElementById("chatList");

    if(!chatList) return;

    const { data: authData, error: authError } =
        await supabaseClient.auth.getUser();

    if(authError || !authData.user){

        chatList.innerHTML =
            `<div style="padding:20px;text-align:center;color:#777;">
                Login required
            </div>`;

        return;
    }

    const myId = authData.user.id;

    const { data: users, error } =
        await supabaseClient
            .from("profiles")
            .select(
                "id, username, full_name, avatar_url, bio"
            )
            .neq("id", myId)
            .order("full_name", {
                ascending: true
            });

    if(error){

        console.error(
            "Users load error:",
            error
        );

        chatList.innerHTML =
            `<div style="padding:20px;text-align:center;color:#d00;">
                Users load করা যাচ্ছে না।
            </div>`;

        return;
    }

    allUsers = users || [];

    displayUsers(allUsers);
}


function displayUsers(users){

    const chatList =
        document.getElementById("chatList");

    if(!chatList) return;

    if(users.length === 0){

        chatList.innerHTML =
            `<div style="padding:20px;text-align:center;color:#777;">
                অন্য কোনো User পাওয়া যায়নি।
            </div>`;

        return;
    }

    chatList.innerHTML = "";

    users.forEach(user => {

        const name =
            user.full_name ||
            user.username ||
            "User";

        const firstLetter =
            name.charAt(0).toUpperCase();

        const avatarHTML =
            user.avatar_url
            ?
            `<img
                src="${user.avatar_url}"
                alt="Profile"
            >`
            :
            firstLetter;

        const chat =
            document.createElement("div");

        chat.className = "chat";

        chat.innerHTML = `

            <div class="avatar">
                ${avatarHTML}
            </div>

            <div class="chatInfo">

                <div class="chatTop">

                    <div class="chatName">
                        ${name}
                    </div>

                </div>

                <div class="lastMessage">
                    ${user.bio || "Start a conversation"}
                </div>

            </div>

        `;

        chat.onclick = function(){

            openChat(user.id);

        };

        chatList.appendChild(chat);

    });
}


function filterUsers(){

    const search =
        document
        .getElementById("userSearch")
        .value
        .toLowerCase()
        .trim();

    const filtered =
        allUsers.filter(user => {

            const name =
                (
                    user.full_name ||
                    user.username ||
                    ""
                ).toLowerCase();

            return name.includes(search);

        });

    displayUsers(filtered);
}


function openChat(userId){

    window.location.href =
        "chat.html?user=" +
        encodeURIComponent(userId);

}
const appScreen =
document.getElementById("appScreen");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const messageBox =
document.getElementById("message");


/* ================= MESSAGE ================= */

function showMessage(text,type="error"){

    messageBox.textContent = text;

    messageBox.className =
        "message " + type;

    messageBox.style.display = "block";
}

function hideMessage(){

    messageBox.style.display = "none";
}


/* ================= PASSWORD ================= */

function togglePassword(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        document.getElementById("eyeBtn").textContent = "🙈";

    }else{

        passwordInput.type = "password";

        document.getElementById("eyeBtn").textContent = "👁️";
    }
}


/* ================= SHOW LOGIN ================= */

function showLogin(){

    loginScreen.style.display = "flex";

    appScreen.style.display = "none";
}


/* ================= SHOW APP ================= */

async function loadMyProfile(){

    const { data, error } =
        await supabaseClient.auth.getUser();

    if(error || !data.user) return;

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("id, username, full_name, avatar_url, bio")
            .eq("id", data.user.id)
            .maybeSingle();

    if(profileError){
        console.error("Profile load error:", profileError);
        return;
    }

    currentProfile = profile || {
        id: data.user.id,
        username: null,
        full_name: data.user.user_metadata?.full_name || null,
        avatar_url: null,
        bio: null
    };

    if(currentProfile.avatar_url){

        const photo =
            document.getElementById("headerProfilePhoto");

        if(photo){
            photo.src = currentProfile.avatar_url;
        }
    }

    const nameElement =
        document.getElementById("headerUserName");

    if(nameElement){
        nameElement.textContent =
            currentProfile.full_name ||
            currentProfile.username ||
            "User";
    }
}


function updateHomeProfile(){

    if(!currentProfile) return;

    const photo =
        document.getElementById("headerProfilePhoto");

    if(photo && currentProfile.avatar_url){
        photo.src = currentProfile.avatar_url;
    }

    const nameElement =
        document.getElementById("headerUserName");

    if(nameElement){
        nameElement.textContent =
            currentProfile.full_name ||
            currentProfile.username ||
            "User";
    }
}


function openProfile(){

    window.location.href = "profile.html";

}


function showApp(){

    loginScreen.style.display = "none";

    appScreen.style.display = "block";

    loadMyProfile();
    
    loadUsers();

}


/* ================= LOGIN ================= */

async function loginUser(){

    hideMessage();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email){

        showMessage("Email লিখুন।");

        emailInput.focus();

        return;
    }

    if(!password){

        showMessage("Password লিখুন।");

        passwordInput.focus();

        return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent = "LOGIN হচ্ছে...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if(error){

        loginBtn.disabled = false;

        loginBtn.textContent = "LOGIN";

        showMessage(
            getLoginError(error.message)
        );

        return;
    }

    if(data.session){

        loginBtn.disabled = false;

        loginBtn.textContent = "LOGIN";

        showApp();
    }
}


/* ================= ERROR ================= */

function getLoginError(error){

    const text =
        String(error || "").toLowerCase();

    if(text.includes("invalid login credentials")){

        return "Email অথবা Password সঠিক নয়।";
    }

    if(text.includes("email not confirmed")){

        return "আপনার Email এখনো verify করা হয়নি।";
    }

    if(text.includes("too many requests")){

        return "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
    }

    return error || "Login করা যায়নি। আবার চেষ্টা করুন।";
}


/* ================= REGISTRATION ================= */

function goRegistration(){

    window.location.href =
        "registration.html";
}


/* ================= LOGOUT ================= */

async function logout(){

    await supabaseClient.auth.signOut();

    closeMenu();

    emailInput.value = "";

    passwordInput.value = "";

    showLogin();

    showMessage(
        "আপনি Logout করেছেন।",
        "success"
    );
}


/* ================= MENU ================= */

function openMenu(){

    document.getElementById(
        "sideMenu"
    ).style.display = "block";
}

function closeMenu(event){

    if(
        event &&
        event.target !==
        document.getElementById("sideMenu")
    ){
        return;
    }

    document.getElementById(
        "sideMenu"
    ).style.display = "none";
}


/* ================= SESSION ================= */

async function startApp(){

    const { data } =
        await supabaseClient.auth.getSession();

    if(data && data.session){

        showApp();

    }else{

        showLogin();
    }
}


/* ================= AUTH LISTENER ================= */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if(session){

            showApp();

        }else{

            showLogin();
        }
    }
);


/* ================= START ================= */

startApp();

</script>

</body>
</html>
