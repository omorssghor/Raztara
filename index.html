<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.header{
    height:60px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
}

.menu-btn{
    font-size:27px;
    cursor:pointer;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.profile-img{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#555;
    font-size:20px;
    cursor:pointer;
}

.content{
    padding:75px 12px 80px;
    max-width:600px;
    margin:auto;
}

.search{
    width:100%;
    padding:13px 16px;
    border:none;
    border-radius:25px;
    background:white;
    box-shadow:0 1px 5px rgba(0,0,0,.1);
    outline:none;
    font-size:15px;
    margin-bottom:12px;
}

.chat-list{
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.chat{
    display:flex;
    align-items:center;
    padding:14px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.chat:last-child{
    border-bottom:none;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:12px;
    font-size:22px;
}

.chat-info{
    flex:1;
}

.chat-name{
    font-weight:bold;
    margin-bottom:5px;
}

.chat-message{
    color:#777;
    font-size:14px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:10;
}

.nav-btn{
    border:none;
    background:none;
    font-size:14px;
    cursor:pointer;
    color:#444;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.side-menu{
    position:fixed;
    top:0;
    left:-280px;
    width:280px;
    height:100%;
    background:white;
    z-index:30;
    box-shadow:3px 0 10px rgba(0,0,0,.2);
    transition:.3s;
    padding-top:70px;
}

.side-menu.active{
    left:0;
}

.menu-item{
    padding:17px 20px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    font-size:16px;
}

.menu-item:hover{
    background:#f5f5f5;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    z-index:20;
    display:none;
}

.overlay.active{
    display:block;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="menu-btn" onclick="openMenu()">☰</div>

    <div class="logo">
        RAZTARA
    </div>

    <div class="profile-img" onclick="openProfile()">
        👤
    </div>

</div>


<!-- MAIN CONTENT -->
<div class="content">

    <input
        type="text"
        class="search"
        id="searchBox"
        placeholder="Search people..."
        oninput="searchPeople()"
    >

    <div class="chat-list" id="chatList">

        <div class="chat">
            <div class="avatar">👤</div>

            <div class="chat-info">
                <div class="chat-name">Rahim</div>
                <div class="chat-message">Hello...</div>
            </div>
        </div>

        <div class="chat">
            <div class="avatar">👤</div>

            <div class="chat-info">
                <div class="chat-name">Karim</div>
                <div class="chat-message">Hi</div>
            </div>
        </div>

        <div class="chat">
            <div class="avatar">👤</div>

            <div class="chat-info">
                <div class="chat-name">Sumaiya</div>
                <div class="chat-message">How are you?</div>
            </div>
        </div>

        <div class="chat">
            <div class="avatar">👤</div>

            <div class="chat-info">
                <div class="chat-name">Hasan</div>
                <div class="chat-message">Good morning</div>
            </div>
        </div>

    </div>

</div>


<!-- SIDE MENU -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="side-menu" id="sideMenu">

    <div class="menu-item" onclick="openProfile()">
        👤 Profile
    </div>

    <div class="menu-item" onclick="openCalls()">
        📞 Calls
    </div>

    <div class="menu-item" onclick="openSettings()">
        ⚙️ Settings
    </div>

    <div class="menu-item" onclick="logout()">
        🚪 Logout
    </div>

</div>


<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <button class="nav-btn" onclick="goChats()">
        <span class="nav-icon">💬</span>
        Chats
    </button>

    <button class="nav-btn" onclick="goCalls()">
        <span class="nav-icon">📞</span>
        Calls
    </button>

    <button class="nav-btn" onclick="openProfile()">
        <span class="nav-icon">👤</span>
        Profile
    </button>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   LOGIN CHECK
============================== */

(async function(){

    const result =
        await supabaseClient.auth.getSession();

    const session =
        result.data.session;

    if(!session){

        window.location.replace("login.html");

        return;
    }

    console.log(
        "Logged in:",
        session.user.email
    );

})();


/* ==============================
   MENU
============================== */

function openMenu(){

    document
        .getElementById("sideMenu")
        .classList.add("active");

    document
        .getElementById("overlay")
        .classList.add("active");
}


function closeMenu(){

    document
        .getElementById("sideMenu")
        .classList.remove("active");

    document
        .getElementById("overlay")
        .classList.remove("active");
}


/* ==============================
   PROFILE
============================== */

function openProfile(){

    closeMenu();

    window.location.href =
        "profile.html";
}


/* ==============================
   CALLS
============================== */

function openCalls(){

    closeMenu();

    window.location.href =
        "calls.html";
}


function goCalls(){

    window.location.href =
        "calls.html";
}


/* ==============================
   CHATS
============================== */

function goChats(){

    window.location.href =
        "index.html";
}


/* ==============================
   SETTINGS
============================== */

function openSettings(){

    closeMenu();

    alert(
        "Settings page will be added next."
    );
}


/* ==============================
   SEARCH
============================== */

function searchPeople(){

    const search =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase();

    const chats =
        document.querySelectorAll(".chat");

    chats.forEach(function(chat){

        const name =
            chat
            .querySelector(".chat-name")
            .innerText
            .toLowerCase();

        if(name.includes(search)){

            chat.style.display =
                "flex";

        }else{

            chat.style.display =
                "none";
        }

    });
}


/* ==============================
   LOGOUT
============================== */

async function logout(){

    closeMenu();

    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );

    if(!confirmLogout){
        return;
    }

    const result =
        await supabaseClient.auth.signOut();

    if(result.error){

        alert(
            "Logout failed: " +
            result.error.message
        );

        return;
    }

    window.location.replace(
        "login.html"
    );
}

</script>

</body>
</html>
