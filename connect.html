<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAZTARA — Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#075e54;--green2:#128c7e;--bg:#f0f2f5;--text:#172b2f;--muted:#6b7c80;--white:#fff}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
.header{position:fixed;top:0;left:0;right:0;height:64px;padding-top:env(safe-area-inset-top);height:calc(64px + env(safe-area-inset-top));background:var(--green);color:#fff;display:flex;align-items:center;padding-left:10px;padding-right:12px;z-index:20;box-shadow:0 1px 5px #0002}
.back{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:34px;line-height:1}
.titlebox{flex:1}
.title{font-size:19px;font-weight:750}
.sub{font-size:11px;opacity:.78;margin-top:2px}
.headbtn{width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:22px}
.main{position:fixed;top:calc(64px + env(safe-area-inset-top));bottom:calc(68px + env(safe-area-inset-bottom));left:0;right:0;overflow-y:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
.searchwrap{position:sticky;top:0;z-index:5;padding-bottom:10px;background:linear-gradient(var(--bg) 82%,transparent)}
.searchbox{height:48px;background:#fff;border-radius:25px;display:flex;align-items:center;padding:0 15px;box-shadow:0 1px 4px #00000010}
.searchicon{font-size:20px;color:#7b8b8e;margin-right:9px}
.searchbox input{width:100%;border:0;outline:0;background:transparent;font-size:16px;color:var(--text)}
.searchbox input::placeholder{color:#879598}
.section{font-size:12px;font-weight:750;color:var(--muted);padding:7px 5px 8px;text-transform:uppercase;letter-spacing:.3px}
.user{background:#fff;border-radius:16px;padding:11px;margin-bottom:9px;display:flex;align-items:center;gap:11px;box-shadow:0 1px 4px #0000000d}
.avatarwrap{position:relative;flex:none}
.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#dce8e6;display:block}
.dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#22c55e;border:3px solid #fff}
.info{min-width:0;flex:1}
.name{font-size:16px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.username{font-size:12px;color:var(--green2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bio{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action{min-width:86px;height:38px;border:0;border-radius:20px;padding:0 13px;font-weight:700;font-size:13px}
.connect{background:var(--green);color:#fff}
.pending{background:#e8eeee;color:#55706e}
.accept{background:var(--green2);color:#fff}
.message{background:#e5f3ef;color:var(--green);border:1px solid #c6e2dc}
.action:disabled{opacity:.7;cursor:default}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}
.emptyicon{font-size:42px;margin-bottom:9px}
.loader{text-align:center;padding:35px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;display:flex;border-top:1px solid #dfe6e5;z-index:20}
.navbtn{flex:1;border:0;background:#fff;color:#607274;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px}
.navbtn span{font-size:21px;line-height:20px}
.navbtn.active{color:var(--green);font-weight:750}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:#26383a;color:#fff;padding:10px 15px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.main{max-width:720px;margin:auto}.header{padding-left:max(10px,calc((100vw - 720px)/2 + 10px));padding-right:max(12px,calc((100vw - 720px)/2 + 12px))}.bottom{max-width:720px;left:50%;right:auto;width:720px;transform:translateX(-50%)}}
</style>
</head>
<body>

<header class="header">
  <button class="back" onclick="goHome()" aria-label="Back">‹</button>
  <div class="titlebox">
    <div class="title">Connect</div>
    <div class="sub" id="countText">নতুন মানুষ খুঁজুন</div>
  </div>
  <button class="headbtn" onclick="loadData()" aria-label="Refresh">↻</button>
</header>

<main class="main" id="main">
  <div class="searchwrap">
    <div class="searchbox">
      <div class="searchicon">⌕</div>
      <input id="search" type="search" placeholder="নাম বা Username খুঁজুন..." autocomplete="off">
    </div>
  </div>
  <div class="section">RAZTARA Users</div>
  <div id="list"><div class="loader">Loading...</div></div>
</main>

<nav class="bottom">
  <button class="navbtn" onclick="goHome()"><span>⌂</span>Home</button>
  <button class="navbtn active"><span>♧</span>Connect</button>
  <button class="navbtn" onclick="location.href='profile.html'"><span>◉</span>Profile</button>
</nav>

<div id="toast" class="toast"></div>

<script>
const sb=supabase.createClient(
  "https://pqyicaqpmojijjskpzcp.supabase.co",
  "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho"
);

let me="";
let users=[];
let relations=[];
let busy=new Set();
let toastTimer=null;

function goHome(){ location.href="index.html"; }

function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&#92;",""":"&quot;","'":"&#039;"
  }[c]));
}

function avatarUrl(u){
  if(u.avatar_url) return u.avatar_url;
  return "https://ui-avatars.com/api/?name="+encodeURIComponent((u.full_name||u.username||"R").slice(0,1))+"&background=075e54&color=fff&bold=true";
}

function isOnline(u){
  if(!u.last_seen_at) return false;
  return (Date.now()-new Date(u.last_seen_at).getTime())<90000;
}

function relationFor(id){
  return relations.find(r=>r.requester_id===id || r.addressee_id===id) || null;
}

function showToast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2600);
}

async function init(){
  const {data,error}=await sb.auth.getUser();
  if(error || !data.user){location.href="login.html";return;}
  me=data.user.id;
  document.getElementById("search").addEventListener("input",render);
  await loadData();
}

async function loadData(){
  const list=document.getElementById("list");
  list.innerHTML='<div class="loader">Loading...</div>';

  const p=await sb
    .from("profiles")
    .select("id,username,full_name,avatar_url,bio,last_seen_at")
    .neq("id",me)
    .order("full_name",{ascending:true});

  if(p.error){
    list.innerHTML='<div class="empty"><div class="emptyicon">⚠️</div><div>Profile লোড করা যাচ্ছে না।</div></div>';
    showToast(p.error.message);
    return;
  }

  const f=await sb
    .from("friendships")
    .select("id,requester_id,addressee_id,status,created_at")
    .or("requester_id.eq."+me+",addressee_id.eq."+me);

  if(f.error){
    list.innerHTML='<div class="empty"><div class="emptyicon">⚠️</div><div>Connect data লোড করা যাচ্ছে না।</div></div>';
    showToast(f.error.message);
    return;
  }

  users=p.data||[];
  relations=f.data||[];
  document.getElementById("countText").textContent=users.length+" জন User";
  render();
}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const filtered=users.filter(u=>{
    const name=(u.full_name||"").toLowerCase();
    const username=(u.username||"").toLowerCase();
    return !q || name.includes(q) || username.includes(q);
  });

  const list=document.getElementById("list");

  if(!filtered.length){
    list.innerHTML='<div class="empty"><div class="emptyicon">🔎</div><div>কোনো User পাওয়া যায়নি</div><div style="font-size:12px;margin-top:6px">নাম বা Username দিয়ে আবার খুঁজুন</div></div>';
    return;
  }

  list.innerHTML=filtered.map(u=>{
    const r=relationFor(u.id);
    let label="Connect", cls="connect", action="sendRequest('"+u.id+"')", disabled="";
    if(r && r.status==="accepted"){
      label="Message";
      cls="message";
      action="openChat('"+u.id+"')";
    }else if(r && r.status==="pending" && r.requester_id===me){
      label="Pending";
      cls="pending";
      disabled="disabled";
    }else if(r && r.status==="pending" && r.addressee_id===me){
      label="Accept";
      cls="accept";
      action="acceptRequest('"+r.id+"')";
    }else if(r && r.status==="rejected"){
      label="Connect";
      cls="connect";
      action="sendRequest('"+u.id+"')";
    }

    const online=isOnline(u);
    return '<div class="user">'+
      '<div class="avatarwrap"><img class="avatar" src="'+esc(avatarUrl(u))+'" alt="">'+(online?'<span class="dot"></span>':'')+'</div>'+
      '<div class="info">'+
        '<div class="name">'+esc(u.full_name||"RAZTARA User")+'</div>'+
        '<div class="username">'+esc(u.username?"@"+u.username:"@user")+'</div>'+
        (u.bio?'<div class="bio">'+esc(u.bio)+'</div>':'')+
      '</div>'+
      '<button class="action '+cls+'" '+disabled+' onclick="'+action+'">'+label+'</button>'+
    '</div>';
  }).join("");
}

async function sendRequest(id){
  if(busy.has(id)) return;
  busy.add(id);
  render();

  const old=relations.find(r=>r.requester_id===me && r.addressee_id===id);
  if(old){busy.delete(id);return;}

  const {data,error}=await sb.from("friendships").insert({
    requester_id:me,
    addressee_id:id,
    status:"pending"
  }).select().single();

  busy.delete(id);

  if(error){
    showToast(error.message);
    return;
  }

  if(data) relations.push(data);
  render();
  showToast("Connect request পাঠানো হয়েছে");
}

async function acceptRequest(id){
  if(busy.has(id)) return;
  busy.add(id);

  const {data,error}=await sb
    .from("friendships")
    .update({status:"accepted"})
    .eq("id",id)
    .eq("addressee_id",me)
    .select()
    .single();

  busy.delete(id);

  if(error){
    showToast(error.message);
    return;
  }

  const index=relations.findIndex(r=>r.id===id);
  if(index>=0 && data) relations[index]=data;
  render();
  showToast("Connect accepted");
}

async function openChat(id){
  if(!id) return;

  const r=relations.find(x=>
    x.status==="accepted" &&
    (x.requester_id===id || x.addressee_id===id)
  );

  if(!r){
    showToast("আগে Connect করুন");
    return;
  }

  showToast("Chat প্রস্তুত হচ্ছে...");

  const {data,error}=await sb.rpc("get_or_create_direct_conversation",{
    other_user_id:id
  });

  if(error){
    showToast(error.message);
    return;
  }

  const conversationId=typeof data==="string"?data:(data?.id||"");
  localStorage.setItem("raztara_last_chat_user_id",id);
  if(conversationId) localStorage.setItem("raztara_last_conversation_id",conversationId);

  location.href="chat.html?user="+encodeURIComponent(id)+(conversationId?"&conversation="+encodeURIComponent(conversationId):"");
}

init();
</script>
</body>
</html>
