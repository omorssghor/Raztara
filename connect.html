<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAZTARA — Connect</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f2f5}.h{height:60px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 12px;gap:15px;position:fixed;top:0;left:0;right:0}.h button{background:none;border:0;color:#fff;font-size:28px}.main{padding:75px 12px 80px}.search{width:100%;padding:13px;border:0;border-radius:22px;font-size:16px}.u{background:#fff;margin-top:10px;padding:10px;border-radius:14px;display:flex;align-items:center;gap:10px}.a{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#075e54}.i{flex:1}.n{font-weight:700}.x{font-size:12px;color:#667781;margin-top:3px}.b{border:0;border-radius:18px;padding:9px 12px;background:#075e54;color:#fff}.p{background:#e7efed;color:#075e54}.nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;display:flex}.nav button{flex:1;border:0;background:#fff;color:#075e54}</style></head><body><header class="h"><button onclick="location.href='index.html'">‹</button><b>Connect</b></header><main class="main"><input id="q" class="search" placeholder="নাম বা Username খুঁজুন..." oninput="show()"><div id="list">Loading...</div></main><nav class="nav"><button onclick="location.href='index.html'">⌂ Home</button><button>♧ Connect</button><button onclick="location.href='profile.html'">◉ Profile</button></nav><script>const sb=supabase.createClient("https://pqyicaqpmojijjskpzcp.supabase.co","sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho");let me,users=[],rels=[];async function init(){const x=await sb.auth.getUser();if(!x.data.user){location.href='login.html';return}me=x.data.user.id;const p=await sb.from('profiles').select('id,username,full_name,avatar_url,bio').neq('id',me).order('full_name');users=p.data||[];const f=await sb.from('friendships').select('id,requester_id,addressee_id,status').or('requester_id.eq.'+me+',addressee_id.eq.'+me);rels=f.data||[];show()}function show(){const q=document.getElementById('q').value.toLowerCase();document.getElementById('list').innerHTML=users.filter(u=>(u.full_name||'').toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q)).map(u=>{const r=rels.find(z=>z.requester_id===u.id||z.addressee_id===u.id);let label='Connect',cl='b',fn="send('"+u.id+"')";if(r&&r.status==='accepted'){label='Connected';cl='b p';fn="open('"+u.id+"')"}else if(r&&r.requester_id===me){label='Pending';cl='b p';fn=''}else if(r){label='Accept';fn="accept('"+r.id+"')"}return '<div class="u"><img class="a" src="'+(u.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent((u.full_name||'U').charAt(0))+'&background=075e54&color=fff')+'"><div class="i"><div class="n">'+esc(u.full_name||'RAZTARA User')+'</div><div class="x">'+(u.username?'@'+esc(u.username):'@user')+'</div></div><button class="'+cl+'" onclick="'+fn+'">'+label+'</button></div>'}).join('')||'<p style="text-align:center;color:#667781">কোনো User পাওয়া যায়নি।</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function send(id){const x=await sb.from('friendships').insert({requester_id:me,addressee_id:id,status:'pending'});if(x.error){alert(x.error.message);return}init()}async function accept(id){const x=await sb.from('friendships').update({status:'accepted'}).eq('id',id).eq('addressee_id',me);if(x.error){alert(x.error.message);return}init()}function open(id){location.href='chat.html?user='+encodeURIComponent(id)}init();</script></body></html>
