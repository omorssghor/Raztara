<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Blocked Users | RAZTARA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;
}

body{

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#07131a;

    color:#fff;
}

.page{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}


/* HEADER */

.header{

    width:100%;

    height:68px;
    min-height:68px;

    flex:none;

    display:flex;
    align-items:center;

    gap:14px;

    padding:0 16px;

    background:#0a1b23;

    border-bottom:1px solid #193039;

    z-index:20;
}

.backBtn{

    width:42px;
    height:42px;

    flex:none;

    border:0;

    border-radius:50%;

    background:#102b34;

    color:#fff;

    font-size:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    -webkit-tap-highlight-color:transparent;
}

.backBtn:active{

    transform:scale(.94);
}

.headerTitle{

    font-size:20px;

    font-weight:800;

    white-space:nowrap;
}


/* CONTENT */

.scrollArea{

    flex:1;

    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    padding:
        18px
        14px
        30px;
}


/* INFO */

.info{

    color:#78919a;

    font-size:13px;

    line-height:1.5;

    padding:
        4px 8px 14px;
}


/* LIST */

.list{

    width:100%;

    background:#0a1c24;

    border:1px solid #193039;

    border-radius:18px;

    overflow:hidden;
}


/* USER */

.userItem{

    width:100%;

    min-height:76px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        12px 14px;

    border-bottom:1px solid #193039;
}

.userItem:last-child{

    border-bottom:0;
}


/* AVATAR */

.avatar{

    width:50px;
    height:50px;

    flex:none;

    border-radius:50%;

    object-fit:cover;

    background:#102b34;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#7f969e;

    font-size:22px;

    font-weight:800;
}


/* USER TEXT */

.userInfo{

    flex:1;

    min-width:0;
}

.userName{

    font-size:15px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.userUsername{

    margin-top:3px;

    color:#718b94;

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* UNBLOCK */

.unblockBtn{

    flex:none;

    min-width:82px;

    height:38px;

    padding:
        0 12px;

    border-radius:11px;

    border:
        1px solid rgba(0,212,165,.28);

    background:
        rgba(0,212,165,.10);

    color:#00d4a5;

    font-size:13px;

    font-weight:800;

    -webkit-tap-highlight-color:transparent;
}

.unblockBtn:active{

    transform:scale(.96);

    background:
        rgba(0,212,165,.17);
}


/* EMPTY */

.empty{

    display:none;

    text-align:center;

    padding:
        70px 20px;

    color:#718b94;
}

.emptyIcon{

    font-size:48px;

    margin-bottom:14px;
}

.emptyTitle{

    color:#fff;

    font-size:16px;

    font-weight:800;

    margin-bottom:6px;
}

.emptyText{

    font-size:13px;

    line-height:1.5;
}


/* LOADING */

.loading{

    text-align:center;

    padding:50px 20px;

    color:#718b94;

    font-size:13px;
}


/* TOAST */

#toast{

    position:fixed;

    left:50%;

    bottom:
        calc(25px + env(safe-area-inset-bottom));

    transform:
        translate(-50%,20px);

    z-index:200;

    max-width:
        calc(100% - 30px);

    padding:
        12px 16px;

    border-radius:12px;

    background:#102b34;

    border:1px solid #284650;

    color:#fff;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    text-align:center;
}

#toast.show{

    opacity:1;

    transform:
        translate(-50%,0);
}


@media(max-width:360px){

    .scrollArea{

        padding-left:10px;
        padding-right:10px;
    }

    .userItem{

        gap:9px;

        padding-left:11px;
        padding-right:11px;
    }

    .avatar{

        width:46px;
        height:46px;
    }

    .unblockBtn{

        min-width:75px;

        padding-left:9px;
        padding-right:9px;
    }

}

</style>

</head>

<body>


<div class="page">


    <!-- HEADER -->

    <header class="header">

        <button
            class="backBtn"
            type="button"
            onclick="goBack()"
            aria-label="Back"
        >
            ←
        </button>

        <div
            class="headerTitle"
            id="pageTitle"
        >
            🚫 Blocked Users
        </div>

    </header>


    <!-- CONTENT -->

    <main class="scrollArea">


        <div
            class="info"
            id="infoText"
        >
            আপনি যাদের Block করেছেন তারা এখানে দেখা যাবে।
        </div>


        <div
            class="loading"
            id="loading"
        >
        </div>


        <div
            class="list"
            id="blockedList"
        ></div>


        <div
            class="empty"
            id="emptyState"
        >

            <div class="emptyIcon">
                🛡️
            </div>

            <div
                class="emptyTitle"
                id="emptyTitle"
            >
                কোনো Blocked User নেই
            </div>

            <div
                class="emptyText"
                id="emptyText"
            >
                আপনি কাউকে Block করলে তারা এখানে দেখা যাবে।
            </div>

        </div>


    </main>

</div>


<div id="toast"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   LANGUAGE
===================================================== */

const LANGUAGE_KEY =
    "raztara_language";

let currentLanguage =
    localStorage.getItem(
        LANGUAGE_KEY
    ) || "bn";


const translations = {

    bn: {

        title:
            "🚫 Blocked Users",

        info:
            "আপনি যাদের Block করেছেন তারা এখানে দেখা যাবে।",

        loading:
            "",

        emptyTitle:
            "কোনো Blocked User নেই",

        emptyText:
            "আপনি কাউকে Block করলে তারা এখানে দেখা যাবে।",

        unblock:
            "Unblock",

        unblockConfirm:
            "এই User-কে Unblock করতে চান?",

        unblockSuccess:
            "User Unblock করা হয়েছে।",

        unblockError:
            "Unblock করা যায়নি।",

        login:
            "অনুগ্রহ করে Login করুন।",

        loadError:
            "Blocked Users লোড করা যায়নি।",

        noName:
            "RAZTARA User"

    },

    en: {

        title:
            "🚫 Blocked Users",

        info:
            "Users you have blocked will appear here.",

        loading:
            "",

        emptyTitle:
            "No Blocked Users",

        emptyText:
            "Users you block will appear here.",

        unblock:
            "Unblock",

        unblockConfirm:
            "Do you want to unblock this user?",

        unblockSuccess:
            "User has been unblocked.",

        unblockError:
            "Could not unblock user.",

        login:
            "Please login first.",

        loadError:
            "Could not load blocked users.",

        noName:
            "RAZTARA User"

    }

};


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const blockedList =
    document.getElementById(
        "blockedList"
    );

const emptyState =
    document.getElementById(
        "emptyState"
    );


/* =====================================================
   LANGUAGE
===================================================== */

function applyLanguage(){

    const t =
        translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage;

    document.getElementById(
        "pageTitle"
    ).textContent =
        t.title;

    document.getElementById(
        "infoText"
    ).textContent =
        t.info;

    document.getElementById(
        "loading"
    ).textContent =
        t.loading;

    document.getElementById(
        "emptyTitle"
    ).textContent =
        t.emptyTitle;

    document.getElementById(
        "emptyText"
    ).textContent =
        t.emptyText;

}


/* =====================================================
   GET CURRENT USER
===================================================== */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();

    if(error){

        console.error(
            "Auth error:",
            error
        );

        return null;

    }

    return data?.user || null;

}


/* =====================================================
   LOAD BLOCKED USERS
===================================================== */

async function loadBlockedUsers(){

    const t =
        translations[currentLanguage];

    loading.style.display =
        "block";

    blockedList.innerHTML = "";

    emptyState.style.display =
        "none";


    const user =
        await getCurrentUser();


    if(!user){

        loading.style.display =
            "none";

        showToast(
            t.login
        );

        setTimeout(
            function(){

                window.location.replace(
                    "index.html"
                );

            },
            1000
        );

        return;

    }


    try{

        const {
            data: blockedRows,
            error
        } =
            await supabaseClient
                .from("blocked_users")
                .select(
                    "id, blocked_id, created_at"
                )
                .eq(
                    "blocker_id",
                    user.id
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(
                "Blocked users error:",
                error
            );

            loading.style.display =
                "none";

            showToast(
                t.loadError
            );

            return;

        }


        if(
            !blockedRows ||
            blockedRows.length === 0
        ){

            loading.style.display =
                "none";

            emptyState.style.display =
                "block";

            return;

        }


        const blockedIds =
            blockedRows.map(
                function(row){

                    return row.blocked_id;

                }
            );


        const {
            data: profiles,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "id, username, full_name, avatar_url"
                )
                .in(
                    "id",
                    blockedIds
                );


        if(profileError){

            console.error(
                "Profiles error:",
                profileError
            );

        }


        const profileMap =
            new Map();


        (profiles || []).forEach(
            function(profile){

                profileMap.set(
                    profile.id,
                    profile
                );

            }
        );


        blockedRows.forEach(
            function(row){

                const profile =
                    profileMap.get(
                        row.blocked_id
                    ) || {};


                renderBlockedUser(
                    row,
                    profile
                );

            }
        );


        loading.style.display =
            "none";


    }catch(error){

        console.error(
            "Load error:",
            error
        );

        loading.style.display =
            "none";

        showToast(
            t.loadError
        );

    }

}


/* =====================================================
   RENDER USER
===================================================== */

function renderBlockedUser(
    row,
    profile
){

    const t =
        translations[currentLanguage];


    const item =
        document.createElement(
            "div"
        );

    item.className =
        "userItem";


    /* AVATAR */

    let avatarElement;


    if(profile.avatar_url){

        avatarElement =
            document.createElement(
                "img"
            );

        avatarElement.className =
            "avatar";

        avatarElement.src =
            profile.avatar_url;

        avatarElement.alt =
            "";

        avatarElement.onerror =
            function(){

                this.style.display =
                    "none";

                const fallback =
                    document.createElement(
                        "div"
                    );

                fallback.className =
                    "avatar";

                fallback.textContent =
                    getInitial(
                        profile.full_name ||
                        profile.username ||
                        t.noName
                    );

                item.insertBefore(
                    fallback,
                    item.children[1]
                );

            };

    }else{

        avatarElement =
            document.createElement(
                "div"
            );

        avatarElement.className =
            "avatar";

        avatarElement.textContent =
            getInitial(
                profile.full_name ||
                profile.username ||
                t.noName
            );

    }


    /* USER INFO */

    const userInfo =
        document.createElement(
            "div"
        );

    userInfo.className =
        "userInfo";


    const userName =
        document.createElement(
            "div"
        );

    userName.className =
        "userName";

    userName.textContent =
        profile.full_name ||
        profile.username ||
        t.noName;


    const userUsername =
        document.createElement(
            "div"
        );

    userUsername.className =
        "userUsername";

    if(profile.username){

        userUsername.textContent =
            "@" + profile.username;

    }else{

        userUsername.textContent =
            "";

    }


    userInfo.appendChild(
        userName
    );

    userInfo.appendChild(
        userUsername
    );


    /* UNBLOCK */

    const unblockButton =
        document.createElement(
            "button"
        );

    unblockButton.type =
        "button";

    unblockButton.className =
        "unblockBtn";

    unblockButton.textContent =
        t.unblock;


    unblockButton.onclick =
        function(){

            unblockUser(
                row.id,
                unblockButton
            );

        };


    item.appendChild(
        avatarElement
    );

    item.appendChild(
        userInfo
    );

    item.appendChild(
        unblockButton
    );


    blockedList.appendChild(
        item
    );

}


/* =====================================================
   INITIAL
===================================================== */

function getInitial(name){

    if(!name){

        return "R";

    }

    return name
        .trim()
        .charAt(0)
        .toUpperCase();

}


/* =====================================================
   UNBLOCK
===================================================== */

async function unblockUser(
    blockRowId,
    button
){

    const t =
        translations[currentLanguage];


    const confirmed =
        confirm(
            t.unblockConfirm
        );


    if(!confirmed){

        return;

    }


    button.disabled =
        true;

    button.style.opacity =
        ".55";


    try{

        const {
            error
        } =
            await supabaseClient
                .from("blocked_users")
                .delete()
                .eq(
                    "id",
                    blockRowId
                );


        if(error){

            console.error(
                "Unblock error:",
                error
            );

            button.disabled =
                false;

            button.style.opacity =
                "1";

            showToast(
                t.unblockError
            );

            return;

        }


        showToast(
            t.unblockSuccess
        );


        await loadBlockedUsers();


    }catch(error){

        console.error(
            "Unblock error:",
            error
        );

        button.disabled =
            false;

        button.style.opacity =
            "1";

        showToast(
            t.unblockError
        );

    }

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(
        window.history.length > 1
    ){

        history.back();

    }else{

        window.location.href =
            "settings.html";

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   START
===================================================== */

applyLanguage();

loadBlockedUsers();

</script>

</body>
</html>
