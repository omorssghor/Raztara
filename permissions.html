<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>RAZTARA — Permission</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#17302d}.box{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:100%;max-width:390px;background:#fff;border-radius:20px;padding:30px 22px;text-align:center;box-shadow:0 8px 30px #00000012}.icon{font-size:50px}.title{font-size:25px;font-weight:800;color:#075e54;margin:12px 0}.txt{font-size:14px;line-height:1.6;color:#6d7976;margin-bottom:22px}.btn{width:100%;height:52px;border:0;border-radius:13px;background:#075e54;color:white;font-weight:800;font-size:15px}.status{font-size:13px;color:#687572;margin-top:14px;line-height:1.5}</style></head><body><div class="box"><div class="card"><div class="icon">🔐</div><div class="title">RAZTARA Permission</div><div class="txt">একবারে Camera, Microphone এবং Notification permission দিন। এরপর RAZTARA নিজে থেকে বারবার permission চাইবে না।</div><button class="btn" id="btn" onclick="grant()">ALLOW & CONTINUE</button><div class="status" id="status">Continue চাপুন।</div></div></div><script>
async function grant(){
 const b=document.getElementById("btn"),s=document.getElementById("status");b.disabled=true;s.textContent="Camera ও Microphone permission নেওয়া হচ্ছে...";
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true,video:true});st.getTracks().forEach(t=>t.stop())}catch(e){s.textContent="Permission দেওয়া হয়নি। iPhone Settings → Safari → Camera/Microphone থেকে Allow করুন।";b.disabled=false;return}
 s.textContent="Notification permission নেওয়া হচ্ছে...";
 try{if("Notification"in window&&Notification.permission==="default")await Notification.requestPermission()}catch(e){}
 localStorage.setItem("raztara_permissions_done","1");s.textContent="সম্পন্ন। RAZTARA খুলছে...";setTimeout(()=>location.replace("index.html"),500);
}
if(localStorage.getItem("raztara_permissions_done")==="1")location.replace("index.html");
</script></body></html>
