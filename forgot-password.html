<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#075e54,#128c7e);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 24px;
    box-shadow:0 15px 45px rgba(0,0,0,.20);
}

.logo{
    width:72px;
    height:72px;
    margin:0 auto 16px;
    border-radius:20px;
    background:#075e54;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.title{
    text-align:center;
    color:#075e54;
    font-size:27px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:8px 0 28px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    color:#333;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    height:51px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fafafa;
    padding:0 14px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#128c7e;
    background:#fff;
    box-shadow:0 0 0 3px rgba(18,140,126,.10);
}

.reset-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:#075e54;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:3px;
}

.reset-btn:active{
    transform:scale(.98);
}

.message{
    display:none;
    margin-top:15px;
    padding:12px 13px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#d93025;
}

.success{
    background:#eaf8f2;
    color:#087f5b;
}

.back-login{
    width:100%;
    height:48px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fff;
    color:#075e54;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:18px;
}

.back-login:hover{
    background:#f5fafa;
}

.footer{
    text-align:center;
    color:#eee;
    font-size:12px;
    margin-top:20px;
}

@media(max-width:400px){

    .card{
        padding:27px 19px;
        border-radius:20px;
    }

    .title{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">RZ</div>

        <div class="title">
            Forgot Password?
        </div>

        <div class="subtitle">
            Enter your registered email address and
            we will send you a password reset link.
        </div>

        <form id="forgotForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <button
                type="submit"
                class="reset-btn"
            >
                SEND RESET LINK
            </button>

            <div
                id="errorMessage"
                class="message error"
            ></div>

            <div
                id="successMessage"
                class="message success"
            ></div>

        </form>

        <button
            class="back-login"
            onclick="goToLogin()"
        >
            ← BACK TO LOGIN
        </button>

    </div>

    <div class="footer">
        © 2026 RAZTARA • Connect • Call • Share
    </div>

</div>


<script>

function goToLogin(){

    window.location.href = "login.html";

}


document
.getElementById("forgotForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const error =
        document.getElementById("errorMessage");

    const success =
        document.getElementById("successMessage");


    error.style.display = "none";
    success.style.display = "none";


    if(email === ""){

        error.textContent =
            "Please enter your email address.";

        error.style.display = "block";

        return;
    }


    success.textContent =
        "Password reset system will be connected to Supabase in the next step.";

    success.style.display = "block";

});

</script>

</body>
</html>
