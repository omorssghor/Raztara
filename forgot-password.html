<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Forgot Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#075e54,#128c7e);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 24px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.logo{
    width:72px;
    height:72px;
    margin:0 auto 16px;
    border-radius:20px;
    background:#075e54;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.title{
    text-align:center;
    color:#075e54;
    font-size:27px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    line-height:1.5;
    margin:8px 0 28px;
}

.group{margin-bottom:18px}

label{
    display:block;
    color:#333;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    height:51px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fafafa;
    padding:0 14px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#128c7e;
    background:#fff;
}

.btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:#075e54;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.btn:disabled{
    opacity:.65;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#d93025;
}

.success{
    background:#eaf8f2;
    color:#087f5b;
}

.back{
    width:100%;
    height:48px;
    border:1px solid #ddd;
    border-radius:12px;
    background:#fff;
    color:#075e54;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:18px;
}

.footer{
    text-align:center;
    color:#eee;
    font-size:12px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">RZ</div>

<div class="title">Forgot Password?</div>

<div class="subtitle">
Enter your email address and we will send you
a password reset link.
</div>

<form id="forgotForm">

<div class="group">

<label>Email Address</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>

</div>


<button
    type="submit"
    class="btn"
    id="resetBtn"
>
SEND RESET LINK
</button>


<div id="message" class="message"></div>

</form>


<button
    class="back"
    onclick="goLogin()"
>
← BACK TO LOGIN
</button>

</div>

<div class="footer">
© 2026 RAZTARA • Connect • Call • Share
</div>

</div>


<script>

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function goLogin(){

    window.location.href =
        "login.html";

}


document
.getElementById("forgotForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email")
        .value.trim();

    const button =
        document.getElementById("resetBtn");

    const message =
        document.getElementById("message");


    button.disabled = true;
    button.textContent = "SENDING...";

    message.style.display = "none";


    const redirectUrl =
        new URL(
            "update-password.html",
            window.location.href
        ).href;


    const {error} =
        await supabaseClient.auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:redirectUrl
            }
        );


    if(error){

        message.className =
            "message error";

        message.textContent =
            error.message;

        message.style.display = "block";

    }else{

        message.className =
            "message success";

        message.textContent =
            "If this email is registered, a password reset link has been sent. Please check your email.";

        message.style.display = "block";

    }


    button.disabled = false;
    button.textContent = "SEND RESET LINK";

});

</script>

</body>
</html>
