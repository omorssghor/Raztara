<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAZTARA - Forgot Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#07131a;
    color:#fff;
}

.box{
    width:100%;
    max-width:410px;
    padding:30px 23px;
    border-radius:25px;
    background:#0a1c24;
    border:1px solid #1c3741;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.icon{
    width:70px;
    height:70px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    background:linear-gradient(135deg,#00d4a5,#008fa8);
    font-size:32px;
    font-weight:800;
}

h1{
    margin-top:15px;
    font-size:25px;
    letter-spacing:2px;
}

.sub{
    margin-top:7px;
    color:#8299a1;
    font-size:13px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#b7c9ce;
    font-size:13px;
}

input{
    width:100%;
    height:54px;
    padding:0 15px;
    border-radius:14px;
    border:1px solid #24404a;
    outline:none;
    background:#10252e;
    color:#fff;
}

input:focus{
    border-color:#00d4a5;
}

button{
    width:100%;
    height:54px;
    margin-top:17px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#00e0ad,#00aebd);
    color:#001510;
    font-weight:800;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    color:#00d4a5;
    text-decoration:none;
    font-size:14px;
}

.message{
    display:none;
    margin-bottom:16px;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
}

.success{
    display:block;
    color:#75efd4;
    background:rgba(0,212,165,.10);
    border:1px solid rgba(0,212,165,.25);
}

.error{
    display:block;
    color:#ff9b9b;
    background:rgba(255,70,70,.10);
    border:1px solid rgba(255,70,70,.25);
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        <div class="icon">R</div>
        <h1>RAZTARA</h1>
        <div class="sub">Reset your password</div>
    </div>

    <div id="message" class="message"></div>

    <label>Email</label>

    <input
        id="email"
        type="email"
        placeholder="আপনার Email লিখুন"
        autocomplete="email"
    >

    <button id="resetBtn" onclick="sendReset()">
        SEND RESET LINK
    </button>

    <a class="back" href="index.html">
        ← Login-এ ফিরে যান
    </a>

</div>

<script>

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function message(text,type){

    const box =
    document.getElementById("message");

    box.textContent = text;

    box.className =
    "message " + type;
}

async function sendReset(){

    const email =
    document.getElementById("email")
    .value
    .trim();

    const btn =
    document.getElementById("resetBtn");

    if(!email){

        message(
            "আপনার Email লিখুন।",
            "error"
        );

        return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";

    /*
      বর্তমান website যে URL-এ চলছে,
      তার একই folder-এর update-password.html
      এ reset করার পরে পাঠাবে।
    */

    const updateUrl =
        new URL(
            "update-password.html",
            window.location.href
        ).href;

    const { error } =
    await supabaseClient.auth
    .resetPasswordForEmail(
        email,
        {
            redirectTo: updateUrl
        }
    );

    btn.disabled = false;
    btn.textContent = "SEND RESET LINK";

    if(error){

        message(
            error.message,
            "error"
        );

        return;
    }

    message(
        "Password reset link আপনার Email-এ পাঠানো হয়েছে। Email খুলে Reset link-এ চাপুন।",
        "success"
    );
}

</script>

</body>
</html>
