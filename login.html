<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>RAZTARA — Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#d9dbd5;color:#111b21}body{display:flex;justify-content:center}.app{width:100%;max-width:520px;min-height:100dvh;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}.card{width:100%;max-width:410px}.logo{text-align:center;margin-bottom:28px}.logoMark{width:76px;height:76px;margin:0 auto 12px;border-radius:24px;background:linear-gradient(135deg,#128c7e,#075e54);display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:800;box-shadow:0 8px 24px #075e5433}.brand{font-size:30px;font-weight:800;color:#075e54;letter-spacing:.4px}.tagline{margin-top:5px;color:#667781;font-size:13px}.form{display:flex;flex-direction:column;gap:13px}.field{height:52px;border:1px solid #d7dde0;border-radius:15px;background:#f7f9fa;display:flex;align-items:center;padding:0 14px;gap:10px}.field:focus-within{border-color:#128c7e;background:#fff;box-shadow:0 0 0 3px #128c7e18}.ico{font-size:18px;color:#667781;width:22px;text-align:center}.field input{border:0;outline:0;background:transparent;width:100%;font-size:15px;color:#111b21}.password button{border:0;background:none;color:#667781;font-size:19px;padding:4px;cursor:pointer}.forgot{text-align:right;margin-top:-3px}.forgot button,.switch button{border:0;background:none;color:#075e54;font-weight:700;font-size:13px;cursor:pointer}.primary{height:52px;border:0;border-radius:15px;background:#075e54;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 5px 15px #075e5430}.primary:disabled{opacity:.65}.divider{display:flex;align-items:center;gap:12px;color:#9aa5aa;font-size:12px;margin:3px 0}.divider:before,.divider:after{content:"";height:1px;background:#e5e8ea;flex:1}.secondary{height:52px;border:1px solid #075e54;border-radius:15px;background:#fff;color:#075e54;font-size:15px;font-weight:800;cursor:pointer}.switch{text-align:center;color:#667781;font-size:13px;margin-top:3px}.status{min-height:18px;text-align:center;font-size:12px;color:#d32f2f}.status.ok{color:#087f5b}.footer{text-align:center;color:#9aa5aa;font-size:11px;margin-top:28px}
</style></head><body><main class="app"><section class="card"><div class="logo"><div class="logoMark">R</div><div class="brand">RAZTARA</div><div class="tagline">Connect • Chat • Call</div></div><form class="form" onsubmit="login(event)"><div class="field"><span class="ico">📧</span><input id="email" type="email" autocomplete="email" placeholder="Email" required></div><div class="field password"><span class="ico">🔒</span><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" onclick="togglePassword()">👁</button></div><div class="forgot"><button type="button" onclick="forgotPassword()">Forgot Password?</button></div><div id="status" class="status"></div><button id="loginBtn" class="primary" type="submit">LOGIN</button><div class="divider">OR</div><button class="secondary" type="button" onclick="location.href='registration.html'">CREATE ACCOUNT</button><div class="switch">নতুন RAZTARA অ্যাকাউন্ট তৈরি করুন</div></form><div class="footer">© RAZTARA</div></section></main><script>
const SUPABASE_URL="https://pqyicaqpmojijjskpzcp.supabase.co",SUPABASE_KEY="sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function checkExistingSession(){const{data}=await supabaseClient.auth.getSession();if(data.session)location.href="index.html"}checkExistingSession();
function msg(t,ok=false){const e=document.getElementById("status");e.textContent=t;e.className="status"+(ok?" ok":"")}
function togglePassword(){const e=document.getElementById("password");e.type=e.type==="password"?"text":"password"}
async function login(e){e.preventDefault();const btn=document.getElementById("loginBtn");btn.disabled=true;btn.textContent="LOGGING IN...";msg("Login হচ্ছে...",true);const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const{error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){msg(error.message);btn.disabled=false;btn.textContent="LOGIN";return}msg("Login সফল হয়েছে।",true);setTimeout(()=>location.href="index.html",400)}
async function forgotPassword(){const email=document.getElementById("email").value.trim();if(!email){msg("আগে আপনার Email লিখুন");return}msg("Reset link পাঠানো হচ্ছে...",true);const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace(/login\.html$/,"update-password.html")});if(error){msg(error.message);return}msg("আপনার Email-এ reset link পাঠানো হয়েছে।",true)}
</script></body></html>
