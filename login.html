<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAZTARA | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#075e54,#128c7e);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{width:100%;max-width:430px}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 24px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.logo{
    width:72px;height:72px;
    margin:0 auto 15px;
    border-radius:20px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.title{
    text-align:center;
    color:#075e54;
    font-size:28px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin:6px 0 28px;
}

.group{margin-bottom:17px}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    height:50px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 14px;
    font-size:15px;
    outline:none;
    background:#fafafa;
}

input:focus{
    border-color:#128c7e;
    background:#fff;
}

.password-box{position:relative}

.password-box input{padding-right:50px}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    font-size:20px;
    cursor:pointer;
}

.forgot{
    display:block;
    width:100%;
    border:0;
    background:none;
    color:#075e54;
    text-align:right;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin:-5px 0 18px;
}

.btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:#075e54;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.btn:disabled{
    opacity:.65;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0;
    color:#aaa;
    font-size:13px;
}

.divider:before,
.divider:after{
    content:"";
    height:1px;
    background:#ddd;
    flex:1;
}

.register{
    width:100%;
    height:50px;
    border:1px solid #075e54;
    border-radius:13px;
    background:white;
    color:#075e54;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#d93025;
}

.success{
    background:#eaf8f2;
    color:#087f5b;
}

.footer{
    text-align:center;
    color:#eee;
    font-size:12px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">RZ</div>

<div class="title">RAZTARA</div>

<div class="subtitle">Connect • Call • Share</div>

<form id="loginForm">

<div class="group">
<label>Email</label>
<input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>
</div>

<div class="group">

<label>Password</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
>

<button
    type="button"
    class="eye"
    onclick="togglePassword()"
>👁</button>

</div>
</div>

<button
    type="button"
    class="forgot"
    onclick="goForgot()"
>
Forgot Password?
</button>

<button
    type="submit"
    class="btn"
    id="loginBtn"
>
LOGIN
</button>

<div id="message" class="message"></div>

</form>

<div class="divider">OR</div>

<button
    class="register"
    onclick="goRegistration()"
>
CREATE NEW ACCOUNT
</button>

</div>

<div class="footer">
© 2026 RAZTARA • Connect • Call • Share
</div>

</div>

<script>

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function checkExistingSession(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(data.session){

        window.location.href = "index.html";

    }

}

checkExistingSession();


function togglePassword(){

    const input =
        document.getElementById("password");

    const button =
        document.querySelector(".eye");

    if(input.type === "password"){

        input.type = "text";
        button.textContent = "🙈";

    }else{

        input.type = "password";
        button.textContent = "👁";

    }
}


function goForgot(){

    window.location.href =
        "forgot-password.html";

}


function goRegistration(){

    window.location.href =
        "registration.html";

}


document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const button =
        document.getElementById("loginBtn");

    const message =
        document.getElementById("message");

    message.style.display = "none";

    button.disabled = true;
    button.textContent = "LOGGING IN...";

    const {data,error} =
        await supabaseClient.auth
        .signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        message.className =
            "message error";

        message.textContent =
            error.message;

        message.style.display = "block";

        button.disabled = false;
        button.textContent = "LOGIN";

        return;
    }

    if(data.session){

        window.location.href =
            "index.html";

    }

});

</script>

</body>
</html>
