<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#087f5b"
>

<title>RAZTARA - Login</title>


<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    linear-gradient(
      145deg,
      #e9f8f2,
      #f8fbfa
    );

  color:#222;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;
}


/* =========================
   LOGIN CONTAINER
========================= */

.login-wrapper{

  width:100%;

  max-width:420px;

}


/* =========================
   BRAND
========================= */

.brand{

  text-align:center;

  margin-bottom:25px;
}

.logo{

  width:76px;

  height:76px;

  margin:0 auto 13px;

  border-radius:24px;

  background:
    linear-gradient(
      145deg,
      #087f5b,
      #0aa876
    );

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:30px;

  font-weight:800;

  box-shadow:
    0 10px 25px
    rgba(8,127,91,.20);
}

.brand h1{

  font-size:29px;

  font-weight:800;

  color:#087f5b;

  letter-spacing:.5px;
}

.brand p{

  margin-top:5px;

  color:#777;

  font-size:14px;
}


/* =========================
   LOGIN CARD
========================= */

.login-card{

  background:#ffffff;

  border-radius:24px;

  padding:25px 20px 22px;

  box-shadow:
    0 12px 40px
    rgba(0,0,0,.08);

  border:1px solid
    rgba(0,0,0,.04);
}


/* =========================
   TITLE
========================= */

.login-title{

  text-align:center;

  font-size:21px;

  font-weight:700;

  margin-bottom:20px;

  color:#222;
}


/* =========================
   INPUT
========================= */

.input-group{

  margin-bottom:14px;
}

.input-label{

  display:block;

  font-size:13px;

  font-weight:600;

  color:#555;

  margin-bottom:7px;
}

.input-box{

  height:52px;

  width:100%;

  display:flex;

  align-items:center;

  background:#f5f7f6;

  border:1px solid #e1e6e4;

  border-radius:14px;

  transition:.2s;
}

.input-box:focus-within{

  background:#ffffff;

  border-color:#087f5b;

  box-shadow:
    0 0 0 3px
    rgba(8,127,91,.10);
}

.input-icon{

  width:48px;

  text-align:center;

  font-size:19px;

  color:#087f5b;
}

.input-box input{

  flex:1;

  height:100%;

  min-width:0;

  border:0;

  outline:0;

  background:transparent;

  font-size:15px;

  color:#222;

  padding-right:10px;
}

.input-box input::placeholder{

  color:#999;
}


/* =========================
   PASSWORD EYE
========================= */

.password-toggle{

  width:45px;

  height:45px;

  background:transparent;

  color:#777;

  font-size:18px;

  cursor:pointer;
}


/* =========================
   FORGOT PASSWORD
========================= */

.forgot-row{

  text-align:right;

  margin:2px 2px 18px;
}

.forgot-button{

  border:0;

  background:transparent;

  color:#087f5b;

  font-size:13px;

  font-weight:600;

  cursor:pointer;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-button{

  width:100%;

  height:52px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #087f5b,
      #0aa876
    );

  color:white;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 7px 18px
    rgba(8,127,91,.20);

  transition:.2s;
}

.login-button:active{

  transform:scale(.98);
}


/* =========================
   DIVIDER
========================= */

.divider{

  display:flex;

  align-items:center;

  gap:10px;

  margin:21px 0;

  color:#aaa;

  font-size:12px;
}

.divider::before,
.divider::after{

  content:"";

  height:1px;

  background:#e5e8e7;

  flex:1;
}


/* =========================
   REGISTRATION BUTTON
========================= */

.registration-button{

  width:100%;

  height:50px;

  border-radius:14px;

  border:1.5px solid #087f5b;

  background:#ffffff;

  color:#087f5b;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

  transition:.2s;
}

.registration-button:active{

  background:#eaf7f2;

  transform:scale(.98);
}


/* =========================
   MESSAGE
========================= */

.message{

  display:none;

  margin-bottom:14px;

  padding:11px 12px;

  border-radius:10px;

  font-size:13px;

  text-align:center;
}

.message.error{

  display:block;

  background:#fff1f1;

  color:#c62828;

  border:1px solid #ffd5d5;
}


/* =========================
   FOOTER
========================= */

.footer{

  text-align:center;

  margin-top:20px;

  color:#999;

  font-size:12px;
}


/* =========================
   LOADING
========================= */

.login-button.loading{

  opacity:.7;

  pointer-events:none;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:600px){

  body{

    padding:40px 20px;
  }

  .login-card{

    padding:30px;
  }

}

</style>

</head>


<body>


<div class="login-wrapper">


  <!-- =====================
       BRAND
  ====================== -->

  <div class="brand">

    <div class="logo">
      R
    </div>

    <h1>
      RAZTARA
    </h1>

    <p>
      Connect • Call • Share
    </p>

  </div>



  <!-- =====================
       LOGIN CARD
  ====================== -->

  <div class="login-card">


    <div class="login-title">
      Welcome Back
    </div>


    <!-- ERROR MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- EMAIL -->

    <div class="input-group">

      <label class="input-label">
        Email
      </label>

      <div class="input-box">

        <span class="input-icon">
          📧
        </span>

        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

      </div>

    </div>


    <!-- PASSWORD -->

    <div class="input-group">

      <label class="input-label">
        Password
      </label>

      <div class="input-box">

        <span class="input-icon">
          🔒
        </span>

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

        <button
          id="passwordToggle"
          class="password-toggle"
          type="button"
          aria-label="Show password"
        >
          👁
        </button>

      </div>

    </div>


    <!-- FORGOT -->

    <div class="forgot-row">

      <button
        id="forgotButton"
        class="forgot-button"
        type="button"
      >
        Forgot password?
      </button>

    </div>


    <!-- LOGIN -->

    <button
      id="loginButton"
      class="login-button"
      type="button"
    >
      LOGIN
    </button>


    <!-- DIVIDER -->

    <div class="divider">
      OR
    </div>


    <!-- REGISTRATION -->

    <button
      id="registrationButton"
      class="registration-button"
      type="button"
    >
      REGISTRATION
    </button>


  </div>


  <div class="footer">
    © 2026 RAZTARA
  </div>


</div>



<script>


/* =========================
   PASSWORD SHOW / HIDE
========================= */

const password =
  document.getElementById(
    "password"
  );

const passwordToggle =
  document.getElementById(
    "passwordToggle"
  );


passwordToggle.addEventListener(
  "click",
  function(){

    if(
      password.type ===
      "password"
    ){

      password.type = "text";

      passwordToggle.textContent =
        "🙈";

    }else{

      password.type = "password";

      passwordToggle.textContent =
        "👁";

    }

  }
);


/* =========================
   FORGOT PASSWORD
========================= */

document
  .getElementById(
    "forgotButton"
  )
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "forgot-password.html";

    }
  );


/* =========================
   REGISTRATION
========================= */

document
  .getElementById(
    "registrationButton"
  )
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "registration.html";

    }
  );


/* =========================
   LOGIN
========================= */

document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    function(){

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const pass =
        password
          .value
          .trim();

      const message =
        document.getElementById(
          "message"
        );


      if(!email){

        message.textContent =
          "Please enter your email.";

        message.className =
          "message error";

        return;
      }


      if(!pass){

        message.textContent =
          "Please enter your password.";

        message.className =
          "message error";

        return;
      }


      /*
        Supabase Login
        আমরা পরের ধাপে এখানে
        যুক্ত করব।
      */

      message.textContent =
        "Login system পরের ধাপে যুক্ত হবে।";

      message.className =
        "message error";

    }
  );

</script>


</body>
</html>
