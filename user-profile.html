<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RAZTARA — Profile</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Noto Sans Bengali",Arial,sans-serif;
    background:#f3f7f5;
    color:#17231e;
}

.page{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* =========================
   TOP BAR
========================= */

.topBar{
    height:68px;
    min-height:68px;

    padding:
        env(safe-area-inset-top)
        10px
        0
        10px;

    background:#087f5b;
    color:white;

    display:flex;
    align-items:center;
    gap:10px;

    box-shadow:0 2px 8px rgba(0,0,0,.15);

    z-index:10;
}

.backButton{
    width:44px;
    height:44px;
    min-width:44px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.14);
    color:white;

    font-size:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.backButton:active{
    transform:scale(.94);
}

.pageTitle{
    font-size:18px;
    font-weight:700;
}

/* =========================
   CONTENT
========================= */

.scrollArea{
    flex:1;
    min-height:0;

    overflow-y:auto;
    -webkit-overflow-scrolling:touch;

    padding:20px 14px;
}

/* =========================
   PROFILE HEADER
========================= */

.profileCard{
    background:white;
    border-radius:20px;

    padding:25px 18px;

    text-align:center;

    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.avatar{
    width:100px;
    height:100px;

    margin:0 auto 14px;

    border-radius:50%;

    background:#d9eee7;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#087f5b;
    font-size:45px;
    font-weight:700;

    overflow:hidden;

    border:3px solid #e7f3ef;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    font-size:21px;
    font-weight:700;

    word-break:break-word;
}

.username{
    margin-top:4px;

    color:#6d7772;

    font-size:14px;
}

.status{
    margin-top:9px;

    display:inline-flex;
    align-items:center;
    gap:6px;

    padding:6px 12px;

    border-radius:20px;

    background:#edf7f3;
    color:#087f5b;

    font-size:13px;
}

.statusDot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#087f5b;
}

/* =========================
   INFO CARD
========================= */

.infoCard{
    margin-top:14px;

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.infoRow{
    min-height:60px;

    padding:10px 15px;

    display:flex;
    align-items:center;

    gap:12px;

    border-bottom:1px solid #edf1ef;
}

.infoRow:last-child{
    border-bottom:0;
}

.infoIcon{
    width:38px;
    height:38px;
    min-width:38px;

    border-radius:12px;

    background:#edf5f2;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;
}

.infoContent{
    min-width:0;
    flex:1;
}

.infoLabel{
    font-size:12px;
    color:#7a8580;

    margin-bottom:3px;
}

.infoValue{
    font-size:15px;

    word-break:break-word;
}

.private{
    color:#929b97;
    font-style:italic;
}

/* =========================
   BOTTOM
========================= */

.bottomBar{
    padding:
        8px
        12px
        calc(8px + env(safe-area-inset-bottom))
        12px;

    background:white;

    border-top:1px solid #e2e8e5;

    display:flex;
    gap:8px;

    box-shadow:0 -2px 10px rgba(0,0,0,.05);
}

.bottomButton{
    flex:1;

    height:46px;

    border:0;
    border-radius:13px;

    background:#edf5f2;
    color:#087f5b;

    font-size:14px;
    font-weight:600;

    cursor:pointer;
}

.bottomButton:active{
    transform:scale(.97);
}

.bottomButton.primary{
    background:#087f5b;
    color:white;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:50px 20px;

    color:#6d7772;
}

.error{
    text-align:center;
    padding:40px 20px;

    color:#b42318;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

    .scrollArea{
        padding:15px 10px;
    }

    .profileCard{
        padding:22px 14px;
    }

    .avatar{
        width:90px;
        height:90px;
    }

    .bottomButton{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- TOP -->
    <header class="topBar">

        <button
            class="backButton"
            type="button"
            onclick="goBack()">
            ←
        </button>

        <div class="pageTitle">
            Profile
        </div>

    </header>


    <!-- CONTENT -->
    <main class="scrollArea">

        <div id="profileContent">

            <div class="loading">
                Profile loading...
            </div>

        </div>

    </main>


    <!-- BOTTOM -->
    <footer class="bottomBar">

        <button
            class="bottomButton"
            type="button"
            onclick="goBack()">
            ← Back
        </button>

        <button
            class="bottomButton primary"
            type="button"
            onclick="startChat()">
            💬 Message
        </button>

    </footer>

</div>


<script>

/*
    এখন database code নেই।
    পরের ধাপে Supabase profile data
    এই page-এর সাথে যুক্ত করব।
*/


function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href = "index.html";

    }

}


function startChat(){

    const params =
        new URLSearchParams(window.location.search);

    const userId =
        params.get("user");

    if(!userId){

        alert("User পাওয়া যায়নি।");
        return;

    }

    window.location.href =
        "chat.html?user=" +
        encodeURIComponent(userId);

}


/*
    Temporary profile UI
    শুধু design পরীক্ষা করার জন্য।
*/

function showDemoProfile(){

    const content =
        document.getElementById("profileContent");

    content.innerHTML = `

        <section class="profileCard">

            <div class="avatar">
                👤
            </div>

            <div class="name">
                Chat User
            </div>

            <div class="username">
                @username
            </div>

            <div class="status">

                <span class="statusDot"></span>

                Online

            </div>

        </section>


        <section class="infoCard">

            <div class="infoRow">

                <div class="infoIcon">
                    👤
                </div>

                <div class="infoContent">

                    <div class="infoLabel">
                        Name
                    </div>

                    <div class="infoValue">
                        Chat User
                    </div>

                </div>

            </div>


            <div class="infoRow">

                <div class="infoIcon">
                    📱
                </div>

                <div class="infoContent">

                    <div class="infoLabel">
                        Phone
                    </div>

                    <div class="infoValue">
                        Private
                    </div>

                </div>

            </div>


            <div class="infoRow">

                <div class="infoIcon">
                    ✉️
                </div>

                <div class="infoContent">

                    <div class="infoLabel">
                        Email
                    </div>

                    <div class="infoValue private">
                        Private
                    </div>

                </div>

            </div>


            <div class="infoRow">

                <div class="infoIcon">
                    📍
                </div>

                <div class="infoContent">

                    <div class="infoLabel">
                        Address
                    </div>

                    <div class="infoValue private">
                        Private
                    </div>

                </div>

            </div>


            <div class="infoRow">

                <div class="infoIcon">
                    📝
                </div>

                <div class="infoContent">

                    <div class="infoLabel">
                        Bio
                    </div>

                    <div class="infoValue">
                        No bio available
                    </div>

                </div>

            </div>

        </section>

    `;

}


/* Demo profile দেখানো */
showDemoProfile();

</script>

</body>
</html>
