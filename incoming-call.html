<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>RAZTARA — Incoming Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#app{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
    background:
        radial-gradient(
            circle at center,
            #18352d,
            #050505 70%
        );
}

#waiting{
    text-align:center;
    color:#aaa;
    font-size:17px;
}

#callBox{
    width:100%;
    max-width:400px;
    text-align:center;
    display:none;
}

#avatar{
    width:125px;
    height:125px;
    margin:0 auto 20px;

    border-radius:50%;

    background:#087f5b;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border:3px solid
        rgba(255,255,255,.2);
}

#avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

#avatarEmoji{
    font-size:55px;
}

#callerName{
    font-size:27px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    margin-bottom:10px;
}

#callType{
    color:#aaa;
    font-size:17px;
    margin-bottom:40px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:45px;
}

button{
    width:72px;
    height:72px;

    border:0;
    border-radius:50%;

    color:#fff;
    font-size:28px;

    cursor:pointer;
}

#reject{
    background:#e53935;
}

#accept{
    background:#20b76b;
}

#status{
    margin-top:35px;
    color:#aaa;
    font-size:15px;
}

</style>

</head>

<body>

<div id="app">

    <div id="waiting">
        RAZTARA কলের অপেক্ষায়...
    </div>

    <div id="callBox">

        <div id="avatar">

            <span id="avatarEmoji">
                👤
            </span>

            <img id="avatarImage">

        </div>

        <div id="callerName">
            RAZTARA User
        </div>

        <div id="callType">
            Incoming call
        </div>

        <div class="buttons">

            <button
                id="reject"
                onclick="rejectCall()"
            >
                ☎
            </button>

            <button
                id="accept"
                onclick="acceptCall()"
            >
                ✓
            </button>

        </div>

        <div id="status"></div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let incomingCall = null;

let callChannel = null;

let alreadyHandling = false;


/* =====================================================
   DOM
===================================================== */

const waiting =
    document.getElementById("waiting");

const callBox =
    document.getElementById("callBox");

const callerName =
    document.getElementById("callerName");

const callType =
    document.getElementById("callType");

const avatarImage =
    document.getElementById("avatarImage");

const avatarEmoji =
    document.getElementById("avatarEmoji");

const statusText =
    document.getElementById("status");


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();

    if(
        error ||
        !data?.session?.user
    ){

        document.getElementById("waiting")
            .textContent =
            "প্রথমে RAZTARA-তে Login করুন।";

        return false;
    }

    currentUser =
        data.session.user;

    return true;
}


/* =====================================================
   SHOW INCOMING CALL
===================================================== */

async function showIncomingCall(call){

    if(alreadyHandling){

        return;
    }

    alreadyHandling = true;

    incomingCall = call;

    waiting.style.display =
        "none";

    callBox.style.display =
        "block";


    /* CALL TYPE */

    if(call.call_type === "video"){

        callType.textContent =
            "📹 Incoming video call";

    }else{

        callType.textContent =
            "📞 Incoming audio call";
    }


    callerName.textContent =
        "RAZTARA User";


    /* CALLER PROFILE */

    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                full_name,
                username,
                avatar_url
            `)
            .eq(
                "id",
                call.caller_id
            )
            .maybeSingle();


    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );
    }


    const name =
        data?.full_name ||
        data?.username ||
        "RAZTARA User";


    callerName.textContent =
        name;


    if(data?.avatar_url){

        avatarImage.src =
            data.avatar_url;

        avatarImage.style.display =
            "block";

        avatarEmoji.style.display =
            "none";

    }else{

        avatarImage.style.display =
            "none";

        avatarEmoji.style.display =
            "block";
    }
}


/* =====================================================
   LISTEN FOR CALL
===================================================== */

function listenForCalls(){

    callChannel =
        supabaseClient
            .channel(
                "incoming-calls-" +
                currentUser.id
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"calls",
                    filter:
                        "receiver_id=eq." +
                        currentUser.id
                },

                payload => {

                    console.log(
                        "INCOMING CALL:",
                        payload.new
                    );


                    const call =
                        payload.new;


                    if(
                        !call ||
                        call.receiver_id !==
                            currentUser.id
                    ){

                        return;
                    }


                    if(
                        call.status !==
                        "ringing"
                    ){

                        return;
                    }


                    showIncomingCall(
                        call
                    );
                }
            )

            .subscribe(
                status => {

                    console.log(
                        "CALL CHANNEL:",
                        status
                    );

                    if(
                        status ===
                        "SUBSCRIBED"
                    ){

                        statusText.textContent =
                            "কলের অপেক্ষায়...";
                    }

                }
            );
}


/* =====================================================
   ACCEPT
===================================================== */

async function acceptCall(){

    if(!incomingCall){

        return;
    }


    statusText.textContent =
        "কল গ্রহণ করা হচ্ছে...";


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:"answered",

                answered_at:
                    new Date()
                        .toISOString()

            })
            .eq(
                "id",
                incomingCall.id
            );


    if(error){

        console.error(
            "ACCEPT ERROR:",
            error
        );

        statusText.textContent =
            "কল গ্রহণ করা যায়নি।";

        return;
    }


    /*
      এখন আসল call.html খুলবে
    */

    window.location.href =
        "call.html?call=" +
        encodeURIComponent(
            incomingCall.id
        );
}


/* =====================================================
   REJECT
===================================================== */

async function rejectCall(){

    if(!incomingCall){

        return;
    }


    statusText.textContent =
        "কল বাতিল করা হচ্ছে...";


    await supabaseClient
        .from("calls")
        .update({

            status:"rejected",

            ended_at:
                new Date()
                    .toISOString()

        })
        .eq(
            "id",
            incomingCall.id
        );


    incomingCall = null;

    alreadyHandling = false;

    callBox.style.display =
        "none";

    waiting.style.display =
        "block";

    statusText.textContent =
        "";
}


/* =====================================================
   INIT
===================================================== */

async function init(){

    const ok =
        await loadUser();

    if(!ok){

        return;
    }


    listenForCalls();
}


window.addEventListener(
    "load",
    init
);

</script>

</body>
</html>
