<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>Edit Profile | Raztara</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

.header{
    height:60px;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:100;
}

.back{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:30px;
    border-radius:50%;
}

.back:active{
    background:rgba(255,255,255,.15);
}

.header-title{
    font-size:20px;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:650px;
    margin:20px auto;
    padding:0 15px 40px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:22px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.loading{
    text-align:center;
    padding:45px 10px;
    color:#777;
}

.photo-section{
    text-align:center;
    margin-bottom:24px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    background:#e8eeee;
    border:4px solid #087f5b;
}

.photo-button{
    display:inline-block;
    margin-top:12px;
    padding:10px 15px;
    border-radius:9px;
    background:#e8f5f1;
    color:#087f5b;
    cursor:pointer;
    font-size:14px;
}

#photoInput{
    display:none;
}

.note{
    margin-top:6px;
    font-size:12px;
    color:#777;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    border:1px solid #d4dddd;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    outline:none;
    background:#fff;
}

input:focus,
textarea:focus{
    border-color:#087f5b;
}

input:disabled{
    background:#f1f3f3;
    color:#777;
}

textarea{
    min-height:105px;
    resize:vertical;
}

.status{
    min-height:22px;
    margin:12px 0;
    text-align:center;
    font-size:14px;
}

.status.error{
    color:#d93025;
}

.status.success{
    color:#087f5b;
}

.status.loading{
    color:#777;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    border:none;
    border-radius:10px;
    padding:13px 16px;
    font-size:15px;
    cursor:pointer;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.primary{
    flex:1;
    background:#087f5b;
    color:#fff;
}

.secondary{
    flex:1;
    background:#e9efed;
    color:#222;
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<header class="header">

    <a
        href="profile.html"
        class="back"
        aria-label="Back"
    >
        ‹
    </a>

    <div class="header-title">
        Edit Profile
    </div>

</header>


<main class="container">

    <section class="card">

        <div
            id="loadingBox"
            class="loading"
        >
            Profile loading...
        </div>


        <form
            id="editForm"
            class="hidden"
        >

            <!-- PHOTO -->

            <div class="photo-section">

                <img
                    id="editAvatar"
                    class="avatar"
                    src=""
                    alt="Profile Photo"
                >

                <br>

                <label
                    for="photoInput"
                    class="photo-button"
                >
                    📷 Change Photo
                </label>

                <input
                    id="photoInput"
                    type="file"
                    accept="image/*"
                >

                <div class="note">
                    Maximum photo size: 6 MB
                </div>

            </div>


            <!-- NAME -->

            <div class="form-group">

                <label for="nameInput">
                    Name
                </label>

                <input
                    id="nameInput"
                    type="text"
                    autocomplete="name"
                    maxlength="100"
                    placeholder="Your name"
                >

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="usernameInput">
                    Username
                </label>

                <input
                    id="usernameInput"
                    type="text"
                    autocomplete="username"
                    maxlength="30"
                    placeholder="username"
                >

                <div class="note">
                    3–30 characters: letters, numbers, _, -, .
                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="emailInput">
                    Email
                </label>

                <input
                    id="emailInput"
                    type="email"
                    disabled
                >

                <div class="note">
                    Login email এখান থেকে পরিবর্তন হবে না।
                </div>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phoneInput">
                    Phone
                </label>

                <input
                    id="phoneInput"
                    type="tel"
                    autocomplete="tel"
                    maxlength="30"
                    placeholder="Phone number"
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="addressInput">
                    Address
                </label>

                <textarea
                    id="addressInput"
                    autocomplete="street-address"
                    maxlength="500"
                    placeholder="Your address"
                ></textarea>

            </div>


            <!-- BIO -->

            <div class="form-group">

                <label for="bioInput">
                    Bio
                </label>

                <textarea
                    id="bioInput"
                    maxlength="1000"
                    placeholder="Write something about yourself..."
                ></textarea>

            </div>


            <div
                id="status"
                class="status"
            >
            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    id="saveButton"
                    class="primary"
                >
                    💾 Save
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    class="secondary"
                >
                    Cancel
                </button>

            </div>

        </form>

    </section>

</main>


<script>

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentProfile = null;
let currentPhone = null;
let currentAddress = null;

let selectedPhoto = null;


function $(id){
    return document.getElementById(id);
}


/* ================================
   DEFAULT AVATAR
================================ */

function defaultAvatar(name){

    const first =
        String(name || "User")
        .trim()
        .charAt(0)
        .toUpperCase() || "U";

    return (
        "https://ui-avatars.com/api/" +
        "?name=" +
        encodeURIComponent(first) +
        "&background=087f5b" +
        "&color=ffffff" +
        "&size=256"
    );
}


/* ================================
   STATUS
================================ */

function setStatus(
    message,
    type=""
){

    $("status").textContent =
        message;

    $("status").className =
        "status " + type;
}


/* ================================
   LOAD CURRENT USER
================================ */

async function loadProfile(){

    try{

        const {
            data:{
                user
            },
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if(error || !user){

            window.location.replace(
                "index.html"
            );

            return;
        }


        currentUser = user;


        /* ==========================
           PROFILE
        ========================== */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url,
            bio,
            online_visibility,
            last_seen_at
        `)
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


        if(profileError){

            throw new Error(
                "Profile load করতে সমস্যা হয়েছে: " +
                profileError.message
            );
        }


        if(!profile){

            throw new Error(
                "আপনার Profile পাওয়া যায়নি।"
            );
        }


        currentProfile =
            profile;


        /* ==========================
           PHONE
        ========================== */

        const {
            data:phoneData
        } =
        await supabaseClient
        .from("profile_phone")
        .select(
            "phone, visibility"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


        currentPhone =
            phoneData || null;


        /* ==========================
           ADDRESS
        ========================== */

        const {
            data:addressData
        } =
        await supabaseClient
        .from("profile_address")
        .select(
            "address, visibility"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


        currentAddress =
            addressData || null;


        /* ==========================
           FILL FORM
        ========================== */

        const name =
            currentProfile.full_name ||
            currentProfile.username ||
            "User";


        $("editAvatar").src =
            currentProfile.avatar_url ||
            defaultAvatar(name);


        $("nameInput").value =
            currentProfile.full_name ||
            "";


        $("usernameInput").value =
            currentProfile.username ||
            "";


        $("emailInput").value =
            currentUser.email ||
            "";


        $("phoneInput").value =
            currentPhone &&
            currentPhone.phone
                ? currentPhone.phone
                : "";


        $("addressInput").value =
            currentAddress &&
            currentAddress.address
                ? currentAddress.address
                : "";


        $("bioInput").value =
            currentProfile.bio ||
            "";


        $("loadingBox")
            .classList.add(
                "hidden"
            );

        $("editForm")
            .classList.remove(
                "hidden"
            );


    }catch(error){

        $("loadingBox")
            .textContent =
            error.message ||
            "Profile load করতে সমস্যা হয়েছে।";

        $("loadingBox")
            .style.color =
            "#d93025";
    }
}


/* ================================
   PHOTO
================================ */

$("photoInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(!file){
            return;
        }


        if(
            !file.type ||
            !file.type.startsWith(
                "image/"
            )
        ){

            setStatus(
                "শুধু Image file নির্বাচন করুন।",
                "error"
            );

            this.value = "";
            selectedPhoto = null;

            return;
        }


        if(
            file.size >
            6 * 1024 * 1024
        ){

            setStatus(
                "ছবির size সর্বোচ্চ 6 MB হতে পারবে।",
                "error"
            );

            this.value = "";
            selectedPhoto = null;

            return;
        }


        selectedPhoto =
            file;


        const previewUrl =
            URL.createObjectURL(
                file
            );


        $("editAvatar").src =
            previewUrl;


        setStatus(
            "নতুন photo নির্বাচন করা হয়েছে।",
            "success"
        );
    }
);


/* ================================
   SAVE
================================ */

$("editForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!currentUser){
            return;
        }


        const saveButton =
            $("saveButton");


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        setStatus(
            "Profile save হচ্ছে...",
            "loading"
        );


        let uploadedPath = null;


        try{

            /* ======================
               INPUTS
            ====================== */

            const fullName =
                $("nameInput")
                .value
                .trim();


            const username =
                $("usernameInput")
                .value
                .trim()
                .replace(
                    /^@+/,
                    ""
                )
                .toLowerCase();


            const phone =
                $("phoneInput")
                .value
                .trim();


            const address =
                $("addressInput")
                .value
                .trim();


            const bio =
                $("bioInput")
                .value
                .trim();


            /* ======================
               USERNAME VALIDATION
            ====================== */

            if(username){

                if(
                    !/^[a-z0-9_.-]{3,30}$/i
                    .test(username)
                ){

                    throw new Error(
                        "Username 3–30 characters হতে হবে। শুধু letters, numbers, _, -, . ব্যবহার করুন।"
                    );
                }
            }


            /* ======================
               AVATAR
            ====================== */

            let avatarUrl =
                currentProfile.avatar_url ||
                null;


            if(selectedPhoto){

                let extension =
                    selectedPhoto.name
                    .split(".")
                    .pop()
                    .toLowerCase();


                if(
                    !/^[a-z0-9]+$/
                    .test(extension)
                ){

                    extension =
                        "jpg";
                }


                const filePath =
                    currentUser.id +
                    "/profile-" +
                    Date.now() +
                    "." +
                    extension;


                const {
                    data:uploadData,
                    error:uploadError
                } =
                await supabaseClient
                .storage
                .from("avatars")
                .upload(
                    filePath,
                    selectedPhoto,
                    {
                        cacheControl:
                            "3600",

                        contentType:
                            selectedPhoto.type,

                        upsert:false
                    }
                );


                if(uploadError){

                    throw new Error(
                        "Profile photo upload করা যায়নি: " +
                        uploadError.message
                    );
                }


                uploadedPath =
                    uploadData.path;


                const {
                    data:publicData
                } =
                supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(
                    uploadedPath
                );


                avatarUrl =
                    publicData.publicUrl;
            }


            /* ======================
               UPDATE PROFILE
            ====================== */

            const {
                error:profileError
            } =
            await supabaseClient
            .from("profiles")
            .update({

                full_name:
                    fullName || null,

                username:
                    username || null,

                bio:
                    bio || null,

                avatar_url:
                    avatarUrl,

                updated_at:
                    new Date()
                    .toISOString()

            })
            .eq(
                "id",
                currentUser.id
            );


            if(profileError){

                if(
                    profileError.code ===
                    "23505"
                ){

                    throw new Error(
                        "এই Username ইতিমধ্যে অন্য একজন ব্যবহার করছে।"
                    );
                }


                throw new Error(
                    "Profile save করতে সমস্যা হয়েছে: " +
                    profileError.message
                );
            }


            /* ======================
               PHONE
            ====================== */

            const phoneVisibility =
                currentPhone &&
                currentPhone.visibility
                    ? currentPhone.visibility
                    : "public";


            const {
                error:phoneError
            } =
            await supabaseClient
            .from("profile_phone")
            .upsert(
                {
                    user_id:
                        currentUser.id,

                    phone:
                        phone || null,

                    visibility:
                        phoneVisibility,

                    updated_at:
                        new Date()
                        .toISOString()
                },
                {
                    onConflict:
                        "user_id"
                }
            );


            if(phoneError){

                throw new Error(
                    "Phone save করতে সমস্যা হয়েছে: " +
                    phoneError.message
                );
            }


            /* ======================
               ADDRESS
            ====================== */

            const addressVisibility =
                currentAddress &&
                currentAddress.visibility
                    ? currentAddress.visibility
                    : "public";


            const {
                error:addressError
            } =
            await supabaseClient
            .from("profile_address")
            .upsert(
                {
                    user_id:
                        currentUser.id,

                    address:
                        address || null,

                    visibility:
                        addressVisibility,

                    updated_at:
                        new Date()
                        .toISOString()
                },
                {
                    onConflict:
                        "user_id"
                }
            );


            if(addressError){

                throw new Error(
                    "Address save করতে সমস্যা হয়েছে: " +
                    addressError.message
                );
            }


            /* ======================
               SUCCESS
            ====================== */

            selectedPhoto = null;

            $("photoInput").value =
                "";


            setStatus(
                "Profile সফলভাবে Save হয়েছে।",
                "success"
            );


            /*
               Profile page-এ ফিরে যাবে
            */

            setTimeout(
                function(){

                    window.location.replace(
                        "profile.html"
                    );

                },
                700
            );


        }catch(error){

            /*
               Upload হয়েছে কিন্তু
               Database save ব্যর্থ হলে
               uploaded file delete করার চেষ্টা
            */

            if(uploadedPath){

                try{

                    await supabaseClient
                    .storage
                    .from("avatars")
                    .remove([
                        uploadedPath
                    ]);

                }catch(removeError){
                    /* Ignore cleanup error */
                }
            }


            setStatus(
                error.message ||
                "Profile save করতে সমস্যা হয়েছে।",
                "error"
            );


        }finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "💾 Save";
        }
    }
);


/* ================================
   CANCEL
================================ */

$("cancelButton")
.addEventListener(
    "click",
    function(){

        window.location.replace(
            "profile.html"
        );
    }
);


/* ================================
   START
================================ */

loadProfile();

</script>

</body>
</html>
