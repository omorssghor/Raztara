<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#075e54,#128c7e);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:30px 24px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.logo{
    width:72px;
    height:72px;
    margin:0 auto 15px;
    border-radius:20px;
    background:#075e54;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.title{
    text-align:center;
    color:#075e54;
    font-size:28px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin:6px 0 27px;
}

.group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

input{
    width:100%;
    height:50px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 14px;
    font-size:15px;
    outline:none;
    background:#fafafa;
}

input:focus{
    border-color:#128c7e;
    background:#fff;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    font-size:20px;
    cursor:pointer;
}

.btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:#075e54;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
}

.btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#d93025;
}

.success{
    background:#eaf8f2;
    color:#087f5b;
}

.login{
    width:100%;
    border:0;
    background:none;
    color:#075e54;
    font-weight:700;
    margin-top:20px;
    font-size:14px;
    cursor:pointer;
}

.footer{
    text-align:center;
    color:#eee;
    font-size:12px;
    margin-top:20px;
}


/* =========================
   VERIFICATION SCREEN
========================= */

#verificationBox{
    display:none;
}

.verify-title{
    text-align:center;
    color:#075e54;
    font-size:24px;
    font-weight:800;
    margin-bottom:8px;
}

.verify-text{
    text-align:center;
    color:#777;
    font-size:14px;
    line-height:1.6;
    margin-bottom:22px;
}

.email-show{
    color:#075e54;
    font-weight:700;
    word-break:break-all;
}

.otp-input{
    text-align:center;
    letter-spacing:8px;
    font-size:25px;
    font-weight:800;
    padding-left:20px;
}

.verify-btn{
    margin-top:16px;
}

.resend{
    width:100%;
    border:0;
    background:none;
    color:#075e54;
    font-weight:700;
    font-size:14px;
    margin-top:17px;
    cursor:pointer;
}

.resend:disabled{
    color:#999;
    cursor:not-allowed;
}

.change-email{
    width:100%;
    border:0;
    background:none;
    color:#777;
    font-size:13px;
    margin-top:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<!-- =========================
     REGISTRATION
========================= -->

<div id="registrationBox">

<div class="logo">
RZ
</div>

<div class="title">
Create Account
</div>

<div class="subtitle">
Join RAZTARA and connect with people
</div>

<form id="registrationForm">

<div class="group">

<label>
Full Name
</label>

<input
    type="text"
    id="name"
    placeholder="Enter your full name"
    autocomplete="name"
    required
>

</div>


<div class="group">

<label>
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>

</div>


<div class="group">

<label>
Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Minimum 6 characters"
    autocomplete="new-password"
    minlength="6"
    required
>

<button
    type="button"
    class="eye"
    onclick="togglePassword('password',this)"
>
👁
</button>

</div>

</div>


<div class="group">

<label>
Confirm Password
</label>

<div class="password-box">

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm your password"
    autocomplete="new-password"
    required
>

<button
    type="button"
    class="eye"
    onclick="togglePassword('confirmPassword',this)"
>
👁
</button>

</div>

</div>


<button
    type="submit"
    class="btn"
    id="registerBtn"
>
CREATE ACCOUNT
</button>


<div id="message" class="message"></div>

</form>


<button
    class="login"
    onclick="goLogin()"
>
Already have an account? Login
</button>

</div>


<!-- =========================
     VERIFICATION
========================= -->

<div id="verificationBox">

<div class="logo">
✓
</div>

<div class="verify-title">
Verify Your Email
</div>

<div class="verify-text">

We sent a verification code to

<div
    class="email-show"
    id="verifyEmail"
>
</div>

<br>

Enter the 6-digit code from your email.

</div>


<div class="group">

<label>
Verification Code
</label>

<input
    type="text"
    id="otp"
    class="otp-input"
    inputmode="numeric"
    autocomplete="one-time-code"
    maxlength="6"
    placeholder="000000"
>

</div>


<button
    type="button"
    class="btn verify-btn"
    id="verifyBtn"
    onclick="verifyCode()"
>
VERIFY EMAIL
</button>


<div
    id="verifyMessage"
    class="message"
></div>


<button
    type="button"
    class="resend"
    id="resendBtn"
    onclick="resendCode()"
>
RESEND CODE
</button>


<button
    type="button"
    class="change-email"
    onclick="changeEmail()"
>
← Change Email
</button>

</div>

</div>


<div class="footer">
© 2026 RAZTARA • Connect • Call • Share
</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   GLOBAL DATA
========================================= */

let verificationEmail = "";
let verificationName = "";
let verificationPassword = "";

let resendTimer = null;
let resendSeconds = 60;


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

function togglePassword(id,button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        button.textContent = "🙈";

    }else{

        input.type = "password";
        button.textContent = "👁";

    }
}


/* =========================================
   LOGIN
========================================= */

function goLogin(){

    window.location.href =
        "login.html";

}


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(element,type,text){

    element.className =
        "message " + type;

    element.textContent =
        text;

    element.style.display =
        "block";
}


/* =========================================
   REGISTRATION
========================================= */

document
.getElementById("registrationForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const name =
            document
            .getElementById("name")
            .value
            .trim();

        const email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const password =
            document
            .getElementById("password")
            .value;

        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;

        const button =
            document
            .getElementById("registerBtn");

        const message =
            document
            .getElementById("message");


        message.style.display =
            "none";


        /* PASSWORD CHECK */

        if(password.length < 6){

            showMessage(
                message,
                "error",
                "Password must be at least 6 characters."
            );

            return;
        }


        /* CONFIRM PASSWORD */

        if(password !== confirmPassword){

            showMessage(
                message,
                "error",
                "Passwords do not match."
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "CREATING ACCOUNT...";


        /*
         * SAVE DATA TEMPORARILY
         */

        verificationEmail =
            email;

        verificationName =
            name;

        verificationPassword =
            password;


        /*
         * REDIRECT AFTER VERIFICATION
         */

        const redirectUrl =
            new URL(
                "login.html",
                window.location.href
            ).href;


        /*
         * SUPABASE SIGN UP
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email:email,

            password:password,

            options:{

                emailRedirectTo:
                    redirectUrl,

                data:{
                    full_name:name
                }

            }

        });


        /* ERROR */

        if(error){

            showMessage(
                message,
                "error",
                error.message
            );

            button.disabled = false;

            button.textContent =
                "CREATE ACCOUNT";

            return;
        }


        /*
         * IF SESSION EXISTS
         */

        if(data.session){

            showMessage(
                message,
                "success",
                "Account created successfully. Opening RAZTARA..."
            );

            setTimeout(function(){

                window.location.href =
                    "index.html";

            },1000);

            return;
        }


        /*
         * OPEN VERIFICATION SCREEN
         */

        document
        .getElementById("registrationBox")
        .style.display =
            "none";

        document
        .getElementById("verificationBox")
        .style.display =
            "block";


        document
        .getElementById("verifyEmail")
        .textContent =
            verificationEmail;


        /*
         * START TIMER
         */

        startResendTimer();

    }
);


/* =========================================
   VERIFY OTP
========================================= */

async function verifyCode(){

    const otpInput =
        document
        .getElementById("otp");

    const verifyBtn =
        document
        .getElementById("verifyBtn");

    const message =
        document
        .getElementById("verifyMessage");


    const token =
        otpInput
        .value
        .trim();


    message.style.display =
        "none";


    /*
     * CODE CHECK
     */

    if(!/^\d{6}$/.test(token)){

        showMessage(
            message,
            "error",
            "Please enter the 6-digit verification code."
        );

        return;
    }


    verifyBtn.disabled = true;

    verifyBtn.textContent =
        "VERIFYING...";


    /*
     * SUPABASE OTP VERIFY
     */

    const {
        data,
        error
    } =
    await supabaseClient.auth.verifyOtp({

        email:
            verificationEmail,

        token:
            token,

        type:
            "email"

    });


    /*
     * ERROR
     */

    if(error){

        showMessage(
            message,
            "error",
            error.message ||
            "Invalid or expired verification code."
        );

        verifyBtn.disabled = false;

        verifyBtn.textContent =
            "VERIFY EMAIL";

        return;
    }


    /*
     * SUCCESS
     */

    showMessage(
        message,
        "success",
        "Email verified successfully! Opening RAZTARA..."
    );


    verifyBtn.textContent =
        "VERIFIED ✓";


    clearInterval(resendTimer);


    setTimeout(function(){

        window.location.href =
            "index.html";

    },1200);

}


/* =========================================
   RESEND CODE
========================================= */

async function resendCode(){

    const resendBtn =
        document
        .getElementById("resendBtn");

    const message =
        document
        .getElementById("verifyMessage");


    if(!verificationEmail){

        showMessage(
            message,
            "error",
            "Email address not found."
        );

        return;
    }


    resendBtn.disabled = true;

    resendBtn.textContent =
        "SENDING...";


    /*
     * SEND NEW OTP
     */

    const {
        error
    } =
    await supabaseClient.auth.resend({

        type:
            "signup",

        email:
            verificationEmail

    });


    if(error){

        showMessage(
            message,
            "error",
            error.message
        );

        resendBtn.disabled = false;

        resendBtn.textContent =
            "RESEND CODE";

        return;
    }


    showMessage(
        message,
        "success",
        "A new verification code has been sent to your email."
    );


    startResendTimer();

}


/* =========================================
   RESEND TIMER
========================================= */

function startResendTimer(){

    const resendBtn =
        document
        .getElementById("resendBtn");


    clearInterval(resendTimer);


    resendSeconds = 60;

    resendBtn.disabled = true;

    resendBtn.textContent =
        "RESEND CODE (" +
        resendSeconds +
        "s)";


    resendTimer =
        setInterval(function(){

            resendSeconds--;


            if(resendSeconds <= 0){

                clearInterval(resendTimer);

                resendBtn.disabled =
                    false;

                resendBtn.textContent =
                    "RESEND CODE";

                return;
            }


            resendBtn.textContent =
                "RESEND CODE (" +
                resendSeconds +
                "s)";

        },1000);

}


/* =========================================
   CHANGE EMAIL
========================================= */

function changeEmail(){

    clearInterval(resendTimer);


    document
    .getElementById("verificationBox")
    .style.display =
        "none";


    document
    .getElementById("registrationBox")
    .style.display =
        "block";


    document
    .getElementById("verifyMessage")
    .style.display =
        "none";


    document
    .getElementById("otp")
    .value =
        "";


    const button =
        document
        .getElementById("registerBtn");

    button.disabled =
        false;

    button.textContent =
        "CREATE ACCOUNT";

}

</script>

</body>
</html>
