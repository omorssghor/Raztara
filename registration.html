<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>RAZTARA | Create Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{
    min-height:100vh;
    background:#f5f7f7;
    color:#172321;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.page{width:100%;max-width:520px;margin:auto;min-height:100vh;background:#fff}
.topbar{
    height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;
    border-bottom:1px solid #edf0ef;background:#fff;
    position:sticky;top:0;z-index:5;
}
.back{
    width:42px;height:42px;border:0;background:#f1f5f4;border-radius:50%;
    color:#075e54;font-size:23px;cursor:pointer
}
.brand{font-size:20px;font-weight:800;color:#075e54;letter-spacing:.4px}
.content{padding:24px 20px 32px}
h1{text-align:center;font-size:27px;color:#172321;margin-top:2px}
.sub{text-align:center;color:#7a8582;font-size:14px;margin:7px 0 23px}
.photo-wrap{text-align:center;margin-bottom:22px}
.photo{
    width:86px;height:86px;border-radius:50%;margin:auto;background:#e8f2f0;
    color:#075e54;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;overflow:hidden;border:3px solid #fff;
    box-shadow:0 3px 14px rgba(0,0,0,.08)
}
.photo img{width:100%;height:100%;object-fit:cover;display:none}
.photo-label{
    display:inline-block;margin-top:9px;color:#075e54;font-size:13px;font-weight:700;cursor:pointer
}
.photo-label input{display:none}
.group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;color:#3d4946;margin:0 0 7px 3px}
.field{
    height:51px;border:1px solid #dfe6e4;border-radius:13px;background:#fafbfb;
    display:flex;align-items:center;padding:0 14px;gap:10px;transition:.15s
}
.field:focus-within{border-color:#128c7e;background:#fff;box-shadow:0 0 0 3px rgba(18,140,126,.08)}
.icon{font-size:17px;width:22px;text-align:center}
input{
    width:100%;height:100%;border:0;outline:0;background:transparent;
    font-size:15px;color:#172321
}
input::placeholder{color:#9aa4a1}
.password{position:relative}
.password input{padding-right:42px}
.eye{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border:0;background:transparent;font-size:18px;cursor:pointer
}
.hint{font-size:11px;color:#8a9491;margin:5px 3px 0}
.terms{display:flex;align-items:flex-start;gap:9px;margin:7px 2px 17px;font-size:13px;color:#68726f;line-height:1.45}
.terms input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:#075e54}
.terms a{color:#075e54;font-weight:700;text-decoration:none}
.btn{
    width:100%;height:52px;border:0;border-radius:13px;background:#075e54;color:#fff;
    font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 5px 14px rgba(7,94,84,.18)
}
.btn:disabled{opacity:.65;cursor:not-allowed}
.message{display:none;margin-top:13px;padding:11px 12px;border-radius:11px;font-size:13px;line-height:1.45}
.error{background:#fff0f0;color:#c62828}.success{background:#eaf8f2;color:#087f5b}
.login{text-align:center;margin-top:18px;color:#7a8582;font-size:13px}
.login button{border:0;background:none;color:#075e54;font-weight:800;font-size:13px;cursor:pointer}
.footer{text-align:center;color:#9aa4a1;font-size:11px;padding:0 20px 25px}
#verificationBox{display:none}
.verify-icon{
    width:70px;height:70px;border-radius:50%;background:#e8f2f0;color:#075e54;
    display:flex;align-items:center;justify-content:center;font-size:32px;margin:5px auto 17px
}
.verify-title{text-align:center;font-size:24px;font-weight:800}
.verify-text{text-align:center;color:#7a8582;font-size:14px;line-height:1.6;margin:8px 0 23px}
.email-show{color:#075e54;font-weight:800;word-break:break-all}
.otp{height:56px;text-align:center;letter-spacing:9px;font-size:24px;font-weight:800}
.verify-btn{margin-top:2px}
.resend,.change{
    width:100%;border:0;background:none;cursor:pointer;font-weight:700;font-size:13px
}
.resend{color:#075e54;margin-top:17px}.resend:disabled{color:#999}
.change{color:#7a8582;margin-top:12px}
@media(min-width:521px){
    body{padding:20px 0;background:#f5f7f7}
    .page{min-height:calc(100vh - 40px);border-radius:20px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.08)}
}
</style>
</head>

<body>
<div class="page">
    <div class="topbar">
        <button class="back" type="button" onclick="goLogin()">←</button>
        <div class="brand">RAZTARA</div>
    </div>

    <main class="content">
        <div id="registrationBox">
            <h1>Create Account</h1>
            <div class="sub">RAZTARA-তে যোগ দিন</div>

            <div class="photo-wrap">
                <div class="photo">
                    <span id="photoIcon">👤</span>
                    <img id="photoPreview" alt="Profile photo">
                </div>
                <label class="photo-label">
                    Profile Photo
                    <input type="file" id="photoInput" accept="image/*">
                </label>
            </div>

            <form id="registrationForm">
                <div class="group">
                    <label>Full Name</label>
                    <div class="field"><span class="icon">👤</span>
                        <input id="name" type="text" placeholder="আপনার পুরো নাম" autocomplete="name" required>
                    </div>
                </div>

                <div class="group">
                    <label>Username</label>
                    <div class="field"><span class="icon">🔖</span>
                        <input id="username" type="text" placeholder="যেমন: raju123" autocomplete="username" minlength="3" maxlength="30" required>
                    </div>
                    <div class="hint">৩–৩০ অক্ষর, ইংরেজি অক্ষর, সংখ্যা ও _ ব্যবহার করুন</div>
                </div>

                <div class="group">
                    <label>Email</label>
                    <div class="field"><span class="icon">📧</span>
                        <input id="email" type="email" placeholder="আপনার ইমেইল" autocomplete="email" required>
                    </div>
                </div>

                <div class="group">
                    <label>Password</label>
                    <div class="field password"><span class="icon">🔒</span>
                        <input id="password" type="password" placeholder="কমপক্ষে ৬ অক্ষর" autocomplete="new-password" minlength="6" required>
                        <button class="eye" type="button" onclick="togglePassword('password',this)">👁</button>
                    </div>
                </div>

                <div class="group">
                    <label>Confirm Password</label>
                    <div class="field password"><span class="icon">🔒</span>
                        <input id="confirmPassword" type="password" placeholder="পাসওয়ার্ড আবার লিখুন" autocomplete="new-password" required>
                        <button class="eye" type="button" onclick="togglePassword('confirmPassword',this)">👁</button>
                    </div>
                </div>

                <label class="terms">
                    <input id="terms" type="checkbox" required>
                    <span>আমি RAZTARA-এর <a href="#" onclick="return false">Terms</a> ও <a href="#" onclick="return false">Privacy</a>-তে সম্মত।</span>
                </label>

                <button class="btn" id="registerBtn" type="submit">CREATE ACCOUNT</button>
                <div id="message" class="message"></div>
            </form>

            <div class="login">Already have an account?
                <button type="button" onclick="goLogin()">Login</button>
            </div>
        </div>

        <div id="verificationBox">
            <div class="verify-icon">✓</div>
            <div class="verify-title">Verify Your Email</div>
            <div class="verify-text">
                আপনার ইমেইলে একটি verification code পাঠানো হয়েছে।
                <div class="email-show" id="verifyEmail"></div>
                <br>ইমেইল থেকে ৬ সংখ্যার কোডটি এখানে দিন।
            </div>

            <div class="group">
                <label>Verification Code</label>
                <div class="field"><span class="icon">🔐</span>
                    <input id="otp" class="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
                </div>
            </div>

            <button class="btn verify-btn" id="verifyBtn" type="button" onclick="verifyCode()">VERIFY EMAIL</button>
            <div id="verifyMessage" class="message"></div>
            <button class="resend" id="resendBtn" type="button" onclick="resendCode()">RESEND CODE</button>
            <button class="change" type="button" onclick="changeEmail()">← Change Email</button>
        </div>
    </main>

    <div class="footer">© 2026 RAZTARA • Connect • Chat • Call</div>
</div>

<script>
const SUPABASE_URL="https://pqyicaqpmojijjskpzcp.supabase.co";
const SUPABASE_KEY="sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let verificationEmail="";
let resendTimer=null;
let resendSeconds=60;

function goLogin(){window.location.href="login.html"}

function togglePassword(id,button){
    const input=document.getElementById(id);
    if(input.type==="password"){input.type="text";button.textContent="🙈"}
    else{input.type="password";button.textContent="👁"}
}

function showMessage(element,type,text){
    element.className="message "+type;
    element.textContent=text;
    element.style.display="block";
}

document.getElementById("photoInput").addEventListener("change",function(){
    const file=this.files[0];
    if(!file)return;
    if(!file.type.startsWith("image/"))return;
    if(file.size>6*1024*1024){alert("Profile photo must be 6 MB or smaller.");this.value="";return}
    const reader=new FileReader();
    reader.onload=function(e){
        document.getElementById("photoPreview").src=e.target.result;
        document.getElementById("photoPreview").style.display="block";
        document.getElementById("photoIcon").style.display="none";
    };
    reader.readAsDataURL(file);
});

document.getElementById("username").addEventListener("input",function(){
    this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,"");
});

document.getElementById("otp").addEventListener("input",function(){
    this.value=this.value.replace(/\D/g,"").slice(0,6);
});

document.getElementById("registrationForm").addEventListener("submit",async function(e){
    e.preventDefault();

    const name=document.getElementById("name").value.trim();
    const username=document.getElementById("username").value.trim().toLowerCase();
    const email=document.getElementById("email").value.trim().toLowerCase();
    const password=document.getElementById("password").value;
    const confirmPassword=document.getElementById("confirmPassword").value;
    const button=document.getElementById("registerBtn");
    const message=document.getElementById("message");

    message.style.display="none";

    if(!/^[a-z0-9_]{3,30}$/.test(username)){
        showMessage(message,"error","Username ৩–৩০ অক্ষরের হতে হবে এবং শুধু ইংরেজি অক্ষর, সংখ্যা ও _ ব্যবহার করতে পারবেন।");
        return;
    }
    if(password.length<6){
        showMessage(message,"error","Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
        return;
    }
    if(password!==confirmPassword){
        showMessage(message,"error","দুইটি Password একই নয়।");
        return;
    }
    if(!document.getElementById("terms").checked){
        showMessage(message,"error","Terms ও Privacy-তে সম্মতি দিন।");
        return;
    }

    button.disabled=true;
    button.textContent="CREATING ACCOUNT...";

    const redirectUrl=new URL("login.html",window.location.href).href;

    const {data,error}=await supabaseClient.auth.signUp({
        email,
        password,
        options:{
            emailRedirectTo:redirectUrl,
            data:{
                full_name:name,
                username:username
            }
        }
    });

    if(error){
        showMessage(message,"error",error.message);
        button.disabled=false;
        button.textContent="CREATE ACCOUNT";
        return;
    }

    verificationEmail=email;

    if(data.session){
        showMessage(message,"success","Account তৈরি হয়েছে। RAZTARA খুলছে...");
        setTimeout(()=>window.location.href="index.html",900);
        return;
    }

    document.getElementById("registrationBox").style.display="none";
    document.getElementById("verificationBox").style.display="block";
    document.getElementById("verifyEmail").textContent=email;
    startResendTimer();
});

async function verifyCode(){
    const token=document.getElementById("otp").value.trim();
    const button=document.getElementById("verifyBtn");
    const message=document.getElementById("verifyMessage");

    message.style.display="none";

    if(!/^\d{6}$/.test(token)){
        showMessage(message,"error","৬ সংখ্যার verification code দিন।");
        return;
    }

    button.disabled=true;
    button.textContent="VERIFYING...";

    const {error}=await supabaseClient.auth.verifyOtp({
        email:verificationEmail,
        token,
        type:"email"
    });

    if(error){
        showMessage(message,"error",error.message||"Code সঠিক নয় বা মেয়াদ শেষ হয়েছে।");
        button.disabled=false;
        button.textContent="VERIFY EMAIL";
        return;
    }

    showMessage(message,"success","Email verified হয়েছে। RAZTARA খুলছে...");
    clearInterval(resendTimer);
    button.textContent="VERIFIED ✓";
    setTimeout(()=>window.location.href="index.html",1000);
}

async function resendCode(){
    const button=document.getElementById("resendBtn");
    const message=document.getElementById("verifyMessage");

    if(!verificationEmail)return;

    button.disabled=true;
    button.textContent="SENDING...";

    const {error}=await supabaseClient.auth.resend({
        type:"signup",
        email:verificationEmail
    });

    if(error){
        showMessage(message,"error",error.message);
        button.disabled=false;
        button.textContent="RESEND CODE";
        return;
    }

    showMessage(message,"success","নতুন verification email পাঠানো হয়েছে।");
    startResendTimer();
}

function startResendTimer(){
    const button=document.getElementById("resendBtn");
    clearInterval(resendTimer);
    resendSeconds=60;
    button.disabled=true;
    button.textContent="RESEND CODE ("+resendSeconds+"s)";

    resendTimer=setInterval(()=>{
        resendSeconds--;
        if(resendSeconds<=0){
            clearInterval(resendTimer);
            button.disabled=false;
            button.textContent="RESEND CODE";
        }else{
            button.textContent="RESEND CODE ("+resendSeconds+"s)";
        }
    },1000);
}

function changeEmail(){
    clearInterval(resendTimer);
    document.getElementById("verificationBox").style.display="none";
    document.getElementById("registrationBox").style.display="block";
    document.getElementById("verifyMessage").style.display="none";
    document.getElementById("otp").value="";
    const button=document.getElementById("registerBtn");
    button.disabled=false;
    button.textContent="CREATE ACCOUNT";
}
</script>
</body>
</html>
