<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RAZTARA — Share</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#f4f7f7;
    color:#222;
}

body{
    padding-bottom:30px;
}

.header{
    height:62px;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 8px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 7px rgba(0,0,0,.18);
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:27px;
    cursor:pointer;
}

.header-title{
    font-size:18px;
    font-weight:700;
    margin-left:5px;
}

.container{
    padding:18px 14px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.preview{
    width:100%;
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f4f3;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:16px;
}

.preview img,
.preview video{
    width:100%;
    max-height:350px;
    object-fit:contain;
    display:block;
}

.preview audio{
    width:90%;
}

.text-preview{
    width:100%;
    padding:20px;
    font-size:16px;
    line-height:1.5;
    word-break:break-word;
    white-space:pre-wrap;
}

.file-preview{
    width:100%;
    padding:25px 15px;
    text-align:center;
}

.file-icon{
    font-size:50px;
    display:block;
    margin-bottom:10px;
}

.file-name{
    font-size:15px;
    font-weight:600;
    word-break:break-word;
}

.message-info{
    margin-top:12px;
    color:#777;
    font-size:12px;
    text-align:center;
}

.share-btn{
    width:100%;
    border:0;
    background:#087f5b;
    color:#fff;
    padding:14px;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:18px;
}

.share-btn:disabled{
    opacity:.5;
}

.copy-btn{
    width:100%;
    border:1px solid #087f5b;
    background:#fff;
    color:#087f5b;
    padding:13px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.loading{
    text-align:center;
    padding:35px 10px;
    color:#777;
}

.error{
    text-align:center;
    padding:25px 10px;
    color:#c62828;
    line-height:1.5;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:10px 17px;
    border-radius:22px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="header">

    <button
        class="back-btn"
        onclick="goBack()">
        ‹
    </button>

    <div class="header-title">
        <span id="pageTitle">
            Share
        </span>
    </div>

</div>

<div class="container">

    <div id="content">

        <div class="card">

            <div class="loading">
                <span id="loadingText">
                </span>
            </div>

        </div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let messageData = null;
let mediaUrl = null;

let currentLanguage =
    localStorage.getItem(
        "raztara_language"
    ) || "bn";

/* =========================================================
   LANGUAGE
========================================================= */

const translations = {

    bn:{
        share:"শেয়ার",
        loading:"",
        message:"মেসেজ",
        image:"ছবি",
        video:"ভিডিও",
        file:"ফাইল",
        audio:"ভয়েস",
        shareNow:"শেয়ার করুন",
        copyLink:"লিংক কপি করুন",
        copied:"লিংক কপি হয়েছে",
        loginRequired:"লগইন করুন",
        messageNotFound:"মেসেজ পাওয়া যায়নি",
        shareFailed:"শেয়ার করা যায়নি",
        preparing:"শেয়ারের জন্য প্রস্তুত হচ্ছে...",
        noShareSupport:"এই ডিভাইসে সরাসরি Share চালু করা যাচ্ছে না।",
        linkReady:"শেয়ার করার লিংক প্রস্তুত।",
        fileName:"ফাইল"
    },

    en:{
        share:"Share",
        loading:"",
        message:"Message",
        image:"Image",
        video:"Video",
        file:"File",
        audio:"Voice",
        shareNow:"Share",
        copyLink:"Copy Link",
        copied:"Link copied",
        loginRequired:"Please login",
        messageNotFound:"Message not found",
        shareFailed:"Could not share",
        preparing:"Preparing for sharing...",
        noShareSupport:"Direct sharing is not supported on this device.",
        linkReady:"Share link is ready.",
        fileName:"File"
    }

};

function t(key){

    return (
        translations[currentLanguage]?.[key] ||
        translations.bn[key] ||
        key
    );
}

/* =========================================================
   GET PARAMS
========================================================= */

function getParams(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return {

        messageId:
            params.get("message_id") ||
            params.get("message") ||
            params.get("id"),

        conversationId:
            params.get("conversation_id") ||
            params.get("conversation")

    };
}

/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getUser();

    if(
        error ||
        !data?.user
    ){

        showToast(
            t("loginRequired")
        );

        setTimeout(()=>{

            window.location.href =
                "index.html";

        },900);

        return null;
    }

    return data.user;
}

/* =========================================================
   MEDIA URL
========================================================= */

async function getMediaUrl(path){

    if(!path){

        return null;
    }

    if(
        path.startsWith("http://") ||
        path.startsWith("https://")
    ){

        return path;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from("raztara-media")
            .createSignedUrl(
                path,
                60 * 60 * 24 * 7
            );

    if(error){

        console.error(
            "Signed URL error:",
            error
        );

        return null;
    }

    return (
        data?.signedUrl ||
        null
    );
}

/* =========================================================
   LOAD MESSAGE
========================================================= */

async function loadMessage(){

    const {
        messageId,
        conversationId
    } = getParams();

    if(!messageId){

        showError(
            t("messageNotFound")
        );

        return;
    }

    let query =
        supabaseClient
            .from("messages")
            .select(`
                id,
                conversation_id,
                sender_id,
                content,
                message_type,
                file_url,
                created_at,
                deleted_for_everyone
            `)
            .eq(
                "id",
                messageId
            );

    if(conversationId){

        query =
            query.eq(
                "conversation_id",
                conversationId
            );
    }

    const {
        data,
        error
    } = await query.maybeSingle();

    if(error){

        console.error(error);

        showError(
            error.message
        );

        return;
    }

    if(!data){

        showError(
            t("messageNotFound")
        );

        return;
    }

    messageData = data;

    await renderMessage();
}

/* =========================================================
   RENDER MESSAGE
========================================================= */

async function renderMessage(){

    const content =
        document.getElementById(
            "content"
        );

    const type =
        messageData.message_type ||
        "text";

    let title =
        t("message");

    if(type === "image"){

        title = t("image");

    }else if(type === "video"){

        title = t("video");

    }else if(type === "file"){

        title = t("file");

    }else if(type === "audio"){

        title = t("audio");
    }

    document.getElementById(
        "pageTitle"
    ).textContent =
        t("share") +
        " — " +
        title;

    let preview = "";

    if(
        messageData.deleted_for_everyone
    ){

        preview = `
            <div class="text-preview">
                This message was deleted
            </div>
        `;

    }else if(type === "text"){

        preview = `
            <div class="text-preview">
                ${escapeHtml(
                    messageData.content ||
                    ""
                )}
            </div>
        `;

    }else{

        content.innerHTML = `
            <div class="card">

                <div class="loading">
                    ${t("preparing")}
                </div>

            </div>
        `;

        mediaUrl =
            await getMediaUrl(
                messageData.file_url
            );

        if(!mediaUrl){

            showError(
                t("shareFailed")
            );

            return;
        }

        if(type === "image"){

            preview = `
                <div class="preview">
                    <img
                        src="${escapeAttribute(
                            mediaUrl
                        )}"
                        alt="Image">
                </div>
            `;

        }else if(type === "video"){

            preview = `
                <div class="preview">
                    <video
                        src="${escapeAttribute(
                            mediaUrl
                        )}"
                        controls
                        playsinline>
                    </video>
                </div>
            `;

        }else if(type === "audio"){

            preview = `
                <div class="preview">
                    <audio
                        src="${escapeAttribute(
                            mediaUrl
                        )}"
                        controls>
                    </audio>
                </div>
            `;

        }else if(type === "file"){

            preview = `
                <div class="preview">

                    <div class="file-preview">

                        <span class="file-icon">
                            📎
                        </span>

                        <div class="file-name">
                            ${escapeHtml(
                                messageData.content ||
                                t("fileName")
                            )}
                        </div>

                    </div>

                </div>
            `;
        }
    }

    content.innerHTML = `

        <div class="card">

            ${preview}

            <div class="message-info">
                ${title}
            </div>

            <button
                id="shareButton"
                class="share-btn"
                onclick="shareNow()">

                📤 ${t("shareNow")}

            </button>

            ${
                mediaUrl
                ? `
                <button
                    class="copy-btn"
                    onclick="copyShareLink()">

                    🔗 ${t("copyLink")}

                </button>
                `
                : ""
            }

        </div>

    `;
}

/* =========================================================
   SHARE
========================================================= */

async function shareNow(){

    if(!messageData){

        return;
    }

    const button =
        document.getElementById(
            "shareButton"
        );

    if(button){

        button.disabled = true;
    }

    try{

        const type =
            messageData.message_type ||
            "text";

        /* TEXT */

        if(type === "text"){

            const shareText =
                messageData.content ||
                "";

            if(
                navigator.share
            ){

                await navigator.share({
                    title:"RAZTARA",
                    text:shareText
                });

            }else{

                await copyText(
                    shareText
                );

                showToast(
                    t("copied")
                );
            }

            return;
        }

        /* MEDIA / FILE */

        if(!mediaUrl){

            mediaUrl =
                await getMediaUrl(
                    messageData.file_url
                );
        }

        if(!mediaUrl){

            showToast(
                t("shareFailed")
            );

            return;
        }

        const file =
            await createShareFile();

        if(
            file &&
            navigator.share &&
            navigator.canShare
        ){

            try{

                const shareData = {
                    title:"RAZTARA",
                    files:[file]
                };

                if(
                    navigator.canShare(
                        shareData
                    )
                ){

                    await navigator.share(
                        shareData
                    );

                    return;
                }

            }catch(fileShareError){

                if(
                    fileShareError.name ===
                    "AbortError"
                ){

                    return;
                }

                console.warn(
                    "File share failed:",
                    fileShareError
                );
            }
        }

        /* FALLBACK TO URL */

        if(navigator.share){

            await navigator.share({

                title:"RAZTARA",
                text:
                    messageData.content ||
                    "RAZTARA",

                url:mediaUrl

            });

        }else{

            await copyText(
                mediaUrl
            );

            showToast(
                t("copied")
            );
        }

    }catch(error){

        if(
            error &&
            error.name ===
            "AbortError"
        ){

            return;
        }

        console.error(
            "Share error:",
            error
        );

        showToast(
            t("shareFailed")
        );

    }finally{

        if(button){

            button.disabled = false;
        }
    }
}

/* =========================================================
   CREATE FILE FOR NATIVE SHARE
========================================================= */

async function createShareFile(){

    if(!mediaUrl){

        return null;
    }

    try{

        const response =
            await fetch(
                mediaUrl
            );

        if(!response.ok){

            return null;
        }

        const blob =
            await response.blob();

        const type =
            messageData.message_type;

        let extension = "bin";

        if(type === "image"){

            extension =
                getExtensionFromType(
                    blob.type,
                    "jpg"
                );

        }else if(type === "video"){

            extension =
                getExtensionFromType(
                    blob.type,
                    "mp4"
                );

        }else if(type === "audio"){

            extension =
                getExtensionFromType(
                    blob.type,
                    "webm"
                );

        }else if(type === "file"){

            extension =
                getFileExtension(
                    messageData.content
                ) ||
                getExtensionFromType(
                    blob.type,
                    "bin"
                );
        }

        let filename =
            "RAZTARA_" +
            Date.now() +
            "." +
            extension;

        if(
            type === "file" &&
            messageData.content
        ){

            const original =
                getSafeFileName(
                    messageData.content
                );

            if(original){

                filename = original;
            }
        }

        return new File(
            [blob],
            filename,
            {
                type:
                    blob.type ||
                    "application/octet-stream"
            }
        );

    }catch(error){

        console.error(
            "Create share file error:",
            error
        );

        return null;
    }
}

/* =========================================================
   COPY SHARE LINK
========================================================= */

async function copyShareLink(){

    if(!mediaUrl){

        return;
    }

    await copyText(
        mediaUrl
    );

    showToast(
        t("copied")
    );
}

async function copyText(text){

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        await navigator.clipboard.writeText(
            text
        );

        return;
    }

    const textarea =
        document.createElement(
            "textarea"
        );

    textarea.value = text;

    textarea.style.position =
        "fixed";

    textarea.style.opacity =
        "0";

    document.body.appendChild(
        textarea
    );

    textarea.select();

    document.execCommand(
        "copy"
    );

    textarea.remove();
}

/* =========================================================
   EXTENSION
========================================================= */

function getExtensionFromType(
    mime,
    fallback
){

    if(!mime){

        return fallback;
    }

    const map = {

        "image/jpeg":"jpg",
        "image/jpg":"jpg",
        "image/png":"png",
        "image/gif":"gif",
        "image/webp":"webp",
        "image/heic":"heic",
        "image/heif":"heif",

        "video/mp4":"mp4",
        "video/webm":"webm",
        "video/quicktime":"mov",

        "audio/webm":"webm",
        "audio/mp4":"m4a",
        "audio/mpeg":"mp3",
        "audio/wav":"wav"

    };

    return map[mime] ||
        fallback;
}

function getFileExtension(
    filename
){

    if(!filename){

        return "";
    }

    const clean =
        filename.split("?")[0];

    const parts =
        clean.split(".");

    if(parts.length < 2){

        return "";
    }

    return parts
        .pop()
        .replace(
            /[^a-zA-Z0-9]/g,
            ""
        )
        .toLowerCase();
}

function getSafeFileName(
    filename
){

    if(!filename){

        return "";
    }

    return filename
        .split("/")
        .pop()
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );
}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}

function escapeAttribute(value){

    return escapeHtml(
        value
    );
}

/* =========================================================
   ERROR
========================================================= */

function showError(message){

    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="card">

            <div class="error">
                ${escapeHtml(
                    message
                )}
            </div>

        </div>

    `;
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove(
                "show"
            );

        },2500);
}

/* =========================================================
   BACK
========================================================= */

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            "messages.html";
    }
}

/* =========================================================
   INIT
========================================================= */

async function init(){

    currentUser =
        await getCurrentUser();

    if(!currentUser){

        return;
    }

    await loadMessage();
}

/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
