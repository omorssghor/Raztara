ki<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7f9;
    color:#222;
}

.header{
    height:60px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:0 15px;
}

.back{
    color:white;
    text-decoration:none;
    font-size:34px;
}

.header-title{
    flex:1;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:auto;
    padding:25px 16px 40px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.avatar-box{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:125px;
    height:125px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #075e54;
    background:#ddd;
}

.default-avatar{
    width:125px;
    height:125px;
    border-radius:50%;
    background:#075e54;
    color:white;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    border:4px solid #075e54;
}

/* PROFILE VIEW */

.profile-info{
    margin-top:10px;
}

.info-row{
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.info-label{
    color:#777;
    font-size:13px;
    margin-bottom:5px;
}

.info-value{
    font-size:16px;
    font-weight:500;
    word-break:break-word;
}

.bio-box{
    margin-top:18px;
    padding:15px;
    background:#f5f7f9;
    border-radius:12px;
}

.bio-label{
    color:#777;
    font-size:13px;
    margin-bottom:7px;
}

.bio-text{
    font-size:15px;
    line-height:1.6;
    white-space:pre-wrap;
}

/* BUTTON */

.edit-btn,
.save-btn{
    width:100%;
    border:0;
    background:#075e54;
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.edit-btn{
    background:#075e54;
}

.cancel-btn{
    width:100%;
    border:1px solid #ccc;
    background:white;
    color:#444;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

/* EDIT FORM */

.edit-form{
    display:none;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#555;
}

.field input,
.field textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

.field input:focus,
.field textarea:focus{
    border-color:#075e54;
}

.field input:disabled{
    background:#f1f1f1;
    color:#777;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.change-photo{
    display:inline-block;
    margin-top:12px;
    background:#075e54;
    color:white;
    padding:10px 18px;
    border-radius:25px;
    cursor:pointer;
    font-size:14px;
}

#photoInput{
    display:none;
}

.logout-btn{
    width:100%;
    border:1px solid #d9534f;
    background:white;
    color:#d9534f;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.status{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    min-height:20px;
}

.loading{
    text-align:center;
    padding:40px 10px;
    color:#666;
}
</style>
</head>

<body>

<div class="header">

    <a class="back" href="index.html">‹</a>

    <div class="header-title">
        My Profile
    </div>

    <div style="width:30px;"></div>

</div>


<div class="container">

    <div id="loadingBox" class="loading">
        Profile লোড হচ্ছে...
    </div>


    <div id="profileCard" class="card" style="display:none;">

        <!-- =========================
             PROFILE VIEW
        ========================== -->

        <div id="profileView">

            <div class="avatar-box">

                <img
                    id="viewAvatar"
                    class="avatar"
                    style="display:none;"
                    alt="Profile Photo"
                >

                <div
                    id="viewDefaultAvatar"
                    class="default-avatar"
                >
                    👤
                </div>

            </div>


            <div class="profile-info">

                <div class="info-row">

                    <div class="info-label">
                        Name
                    </div>

                    <div
                        id="viewName"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Username
                    </div>

                    <div
                        id="viewUsername"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Email
                    </div>

                    <div
                        id="viewEmail"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="bio-box">

                    <div class="bio-label">
                        Bio
                    </div>

                    <div
                        id="viewBio"
                        class="bio-text"
                    >
                        -
                    </div>

                </div>

            </div>


            <button
                class="edit-btn"
                onclick="openEdit()"
            >
                ✏️ Edit Profile
            </button>


            <button
                class="logout-btn"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>


        <!-- =========================
             EDIT PROFILE
        ========================== -->

        <div id="editForm" class="edit-form">

            <div class="avatar-box">

                <img
                    id="editAvatar"
                    class="avatar"
                    style="display:none;"
                    alt="Profile Photo"
                >

                <div
                    id="editDefaultAvatar"
                    class="default-avatar"
                >
                    👤
                </div>

                <br>

                <label
                    for="photoInput"
                    class="change-photo"
                >
                    🖼️ Change Photo
                </label>

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*"
                >

            </div>


            <div class="field">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    id="nameInput"
                    placeholder="আপনার নাম"
                >

            </div>


            <div class="field">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="Username"
                >

            </div>


            <div class="field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="emailInput"
                    disabled
                >

            </div>


            <div class="field">

                <label>
                    Bio
                </label>

                <textarea
                    id="bioInput"
                    placeholder="আপনার সম্পর্কে কিছু লিখুন..."
                ></textarea>

            </div>


            <button
                id="saveButton"
                class="save-btn"
                onclick="saveProfile()"
            >
                💾 Save / Update
            </button>


            <button
                class="cancel-btn"
                onclick="closeEdit()"
            >
                Cancel
            </button>


            <div
                id="status"
                class="status"
            ></div>

        </div>

    </div>

</div>


<script>

/* ===============================
   SUPABASE
================================ */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentProfile = null;
let selectedPhoto = null;


/* ===============================
   START
================================ */

window.addEventListener(
    "load",
    loadProfile
);


/* ===============================
   LOAD PROFILE
================================ */

async function loadProfile(){

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();


        if(error){
            throw error;
        }


        currentUser = data.user;


        if(!currentUser){

            window.location.href =
                "index.html";

            return;
        }


        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select(
                "id, username, full_name, avatar_url, bio"
            )
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(profileError){
            throw profileError;
        }


        if(!profile){

            showStatus(
                "Profile record পাওয়া যায়নি।",
                "red"
            );

            return;
        }


        currentProfile = profile;


        /* VIEW */

        document.getElementById(
            "viewName"
        ).innerText =
            profile.full_name ||
            "নাম দেওয়া হয়নি";


        document.getElementById(
            "viewUsername"
        ).innerText =
            profile.username
            ? "@" + profile.username
            : "Username দেওয়া হয়নি";


        document.getElementById(
            "viewEmail"
        ).innerText =
            currentUser.email ||
            "";


        document.getElementById(
            "viewBio"
        ).innerText =
            profile.bio ||
            "কোনো Bio দেওয়া হয়নি";


        /* EDIT FORM */

        document.getElementById(
            "nameInput"
        ).value =
            profile.full_name || "";


        document.getElementById(
            "usernameInput"
        ).value =
            profile.username || "";


        document.getElementById(
            "emailInput"
        ).value =
            currentUser.email || "";


        document.getElementById(
            "bioInput"
        ).value =
            profile.bio || "";


        setAvatar(
            "viewAvatar",
            "viewDefaultAvatar",
            profile.avatar_url
        );


        setAvatar(
            "editAvatar",
            "editDefaultAvatar",
            profile.avatar_url
        );


        document.getElementById(
            "loadingBox"
        ).style.display =
            "none";


        document.getElementById(
            "profileCard"
        ).style.display =
            "block";


    }catch(error){

        console.error(
            "PROFILE LOAD ERROR:",
            error
        );

        document.getElementById(
            "loadingBox"
        ).innerHTML =
            "Profile লোড করতে সমস্যা হয়েছে:<br>" +
            error.message;
    }
}


/* ===============================
   AVATAR
================================ */

function setAvatar(
    imageId,
    defaultId,
    url
){

    const image =
        document.getElementById(imageId);

    const defaultAvatar =
        document.getElementById(defaultId);


    if(url){

        image.src = url;

        image.style.display =
            "inline-block";

        defaultAvatar.style.display =
            "none";

    }else{

        image.style.display =
            "none";

        defaultAvatar.style.display =
            "inline-flex";
    }
}


/* ===============================
   OPEN EDIT
================================ */

function openEdit(){

    document.getElementById(
        "profileView"
    ).style.display =
        "none";


    document.getElementById(
        "editForm"
    ).style.display =
        "block";


    document.getElementById(
        "status"
    ).innerText =
        "";
}


/* ===============================
   CLOSE EDIT
================================ */

function closeEdit(){

    document.getElementById(
        "editForm"
    ).style.display =
        "none";


    document.getElementById(
        "profileView"
    ).style.display =
        "block";


    selectedPhoto = null;

    document.getElementById(
        "photoInput"
    ).value = "";
}


/* ===============================
   PHOTO SELECT
================================ */

document.getElementById(
    "photoInput"
).addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){
            selectedPhoto = null;
            return;
        }


        if(!file.type.startsWith("image/")){

            showStatus(
                "শুধু ছবি নির্বাচন করুন।",
                "red"
            );

            event.target.value = "";

            selectedPhoto = null;

            return;
        }


        if(
            file.size >
            6 * 1024 * 1024
        ){

            showStatus(
                "ছবির সাইজ ৬ MB-এর বেশি হতে পারবে না।",
                "red"
            );

            event.target.value = "";

            selectedPhoto = null;

            return;
        }


        selectedPhoto = file;


        const previewURL =
            URL.createObjectURL(file);


        setAvatar(
            "editAvatar",
            "editDefaultAvatar",
            previewURL
        );

    }
);


/* ===============================
   SAVE PROFILE
================================ */

async function saveProfile(){

    if(!currentUser){

        showStatus(
            "আপনি লগইন করা নেই।",
            "red"
        );

        return;
    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;


    saveButton.innerText =
        "Saving...";


    try{

        const fullName =
            document.getElementById(
                "nameInput"
            ).value.trim();


        const username =
            document.getElementById(
                "usernameInput"
            ).value.trim();


        const bio =
            document.getElementById(
                "bioInput"
            ).value.trim();


        let avatarURL =
            currentProfile.avatar_url ||
            null;

       /* =========================
   PHOTO UPLOAD
========================= */

if(selectedPhoto){

    alert("ছবি Upload শুরু হচ্ছে...");

    console.log("FILE INFO:", {
        name: selectedPhoto.name,
        type: selectedPhoto.type,
        size: selectedPhoto.size
    });

    if(
        !selectedPhoto.type ||
        !selectedPhoto.type.startsWith("image/")
    ){
        throw new Error(
            "দয়া করে একটি ছবি নির্বাচন করুন।"
        );
    }

    const filePath =
        currentUser.id +
        "/profile-" +
        Date.now() +
        ".jpg";

    console.log("FILE PATH:", filePath);

    try {

        const result =
            await supabaseClient
            .storage
            .from("avatars")
            .upload(
                filePath,
                selectedPhoto,
                {
                    cacheControl: "3600",
                    contentType: selectedPhoto.type,
                    upsert: false
                }
            );

        console.log("STORAGE RESULT:", result);

        if(result.error){

            alert(
                "❌ Storage Upload Error:\n\n" +
                result.error.message
            );

            throw result.error;
        }

        alert("✅ ছবি Upload সফল হয়েছে!");

        const {
            data: publicData
        } =
            supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(
                filePath
            );

        avatarURL =
            publicData.publicUrl;

        console.log(
            "PUBLIC URL:",
            avatarURL
        );

    } catch(uploadError){

        console.error(
            "❌ AVATAR UPLOAD FAILED:",
            uploadError
        );

        alert(
            "❌ ছবি Upload করা যায়নি:\n\n" +
            (uploadError.message ||
             "Unknown upload error")
        );

        throw uploadError;
    }
}

        /* =========================
           PROFILE UPDATE ONLY
        ========================== */

        const updateData = {

            full_name:
                fullName,

            username:
                username || null,

            bio:
                bio || null,

            updated_at:
                new Date().toISOString()
        };


        if(avatarURL){

            updateData.avatar_url =
                avatarURL;
        }


        const {
            data: updatedProfile,
            error: updateError
        } = await supabaseClient
            .from("profiles")
            .update(updateData)
            .eq(
                "id",
                currentUser.id
            )
            .select(
                "id, username, full_name, avatar_url, bio"
            )
            .single();


        if(updateError){
            throw updateError;
        }


        currentProfile =
            updatedProfile;


        /* =========================
           UPDATE VIEW
        ========================== */

        document.getElementById(
            "viewName"
        ).innerText =
            updatedProfile.full_name ||
            "নাম দেওয়া হয়নি";


        document.getElementById(
            "viewUsername"
        ).innerText =
            updatedProfile.username
            ? "@" +
              updatedProfile.username
            : "Username দেওয়া হয়নি";


        document.getElementById(
            "viewBio"
        ).innerText =
            updatedProfile.bio ||
            "কোনো Bio দেওয়া হয়নি";


        setAvatar(
            "viewAvatar",
            "viewDefaultAvatar",
            updatedProfile.avatar_url
        );


        setAvatar(
            "editAvatar",
            "editDefaultAvatar",
            updatedProfile.avatar_url
        );


        selectedPhoto = null;


        document.getElementById(
            "photoInput"
        ).value = "";


        /* =========================
           SAVE SUCCESS
        ========================== */

        document.getElementById(
            "editForm"
        ).style.display =
            "none";


        document.getElementById(
            "profileView"
        ).style.display =
            "block";


    }catch(error){

        console.error(
            "PROFILE UPDATE ERROR:",
            error
        );


        showStatus(
            "❌ Profile Update করতে সমস্যা হয়েছে: " +
            error.message,
            "red"
        );

    }finally{

        saveButton.disabled =
            false;

        saveButton.innerText =
            "💾 Save / Update";
    }
}


/* ===============================
   STATUS
================================ */

function showStatus(
    message,
    color
){

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        message;


    status.style.color =
        color === "green"
        ? "#16803c"
        : "#d93025";
}


/* ===============================
   LOGOUT
================================ */

async function logout(){

    const {
        error
    } =
        await supabaseClient.auth.signOut();


    if(error){

        alert(
            "Logout করতে সমস্যা হয়েছে: " +
            error.message
        );

        return;
    }


    window.location.href =
        "index.html";
}

</script>

</body>
</html>
