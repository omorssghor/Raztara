<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075e54">

<title>RAZTARA | Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7f8;
    color:#222;
}

.header{
    height:62px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header h2{
    font-size:20px;
}

.back{
    position:absolute;
    left:16px;
    top:10px;
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:34px;
    line-height:1;
}

.container{
    max-width:600px;
    margin:0 auto;
    padding:25px 18px 40px;
}

.profile-card{
    background:white;
    border-radius:18px;
    padding:25px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.photo-area{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #075e54;
    background:#e8eeee;
}

.photo-button{
    display:inline-block;
    margin-top:12px;
    padding:10px 18px;
    background:#e9f5f3;
    color:#075e54;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
}

#photoInput{
    display:none;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#333;
}

.field input,
.field textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:#fff;
}

.field input:focus,
.field textarea:focus{
    border-color:#075e54;
}

.field input[readonly]{
    background:#f1f3f4;
    color:#666;
}

.field textarea{
    min-height:100px;
    resize:vertical;
}

.save-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    background:#075e54;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.logout-btn{
    width:100%;
    margin-top:14px;
    padding:13px;
    border:1px solid #e53935;
    border-radius:10px;
    background:white;
    color:#e53935;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:9px;
    text-align:center;
    font-size:14px;
}

.success{
    background:#e8f5e9;
    color:#1b5e20;
}

.error{
    background:#ffebee;
    color:#b71c1c;
}

.loading{
    text-align:center;
    padding:40px 10px;
    color:#666;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<header class="header">

    <a class="back" href="index.html">‹</a>

    <h2>👤 My Profile</h2>

</header>


<main class="container">

    <div id="loading" class="loading">
        Profile loading...
    </div>


    <div id="profileCard" class="profile-card hidden">

        <div id="message" class="message"></div>


        <div class="photo-area">

            <img
                id="avatar"
                class="avatar"
                src=""
                alt="Profile Photo"
            >

            <br>

            <label class="photo-button" for="photoInput">
                🖼️ Change Photo
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
            >

        </div>


        <div class="field">

            <label for="fullName">
                📝 Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Your name"
            >

        </div>


        <div class="field">

            <label for="username">
                🔤 Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

        </div>


        <div class="field">

            <label for="email">
                📧 Email
            </label>

            <input
                type="email"
                id="email"
                readonly
            >

        </div>


        <div class="field">

            <label for="bio">
                ✍️ Bio
            </label>

            <textarea
                id="bio"
                placeholder="Write something about yourself..."
            ></textarea>

        </div>


        <button
            id="saveBtn"
            class="save-btn"
            onclick="saveProfile()"
        >
            💾 Save / Update
        </button>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>

</main>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let selectedPhoto = null;


/* =========================
   DEFAULT AVATAR
========================= */

const defaultAvatar =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="200"
height="200"
viewBox="0 0 200 200">

<rect width="200"
height="200"
rx="100"
fill="#e8eeee"/>

<circle
cx="100"
cy="75"
r="38"
fill="#075e54"/>

<path
d="M35 180
C40 135 65 115 100 115
C135 115 160 135 165 180
Z"
fill="#075e54"/>

</svg>
`);


/* =========================
   MESSAGE
========================= */

function showMessage(text, type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " +
        (type === "success"
            ? "success"
            : "error");

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 4000);
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    try{

        /*
         * getUser() ব্যবহার করছি যাতে
         * Supabase থেকে বর্তমান authenticated
         * user নিশ্চিতভাবে পাওয়া যায়।
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth.getUser();


        if(error){
            throw error;
        }


        if(!data || !data.user){

            window.location.href =
                "index.html";

            return;
        }


        currentUser =
            data.user;


        /*
         * Profile row খুঁজে বের করা
         */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "id,full_name,username,avatar_url,bio"
            )
            .eq("id", currentUser.id)
            .maybeSingle();


        if(profileError){
            throw profileError;
        }


        /*
         * Email
         */

        document.getElementById("email")
            .value =
            currentUser.email || "";


        /*
         * Profile পাওয়া গেলে
         */

        if(profile){

            document.getElementById("fullName")
                .value =
                profile.full_name || "";

            document.getElementById("username")
                .value =
                profile.username || "";

            document.getElementById("bio")
                .value =
                profile.bio || "";


            if(profile.avatar_url){

                document.getElementById("avatar")
                    .src =
                    profile.avatar_url;

            }else{

                document.getElementById("avatar")
                    .src =
                    defaultAvatar;
            }


        }else{

            /*
             * Profile এখনো তৈরি হয়নি
             */

            document.getElementById("avatar")
                .src =
                defaultAvatar;
        }


        document.getElementById("loading")
            .classList.add("hidden");

        document.getElementById("profileCard")
            .classList.remove("hidden");


    }catch(error){

        console.error(
            "Profile loading error:",
            error
        );

        document.getElementById("loading")
            .innerHTML =
            "Profile load করতে সমস্যা হয়েছে।<br><br>" +
            (error.message || "Unknown error");
    }
}


/* =========================
   PHOTO SELECT
========================= */

document.getElementById("photoInput")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];

        if(!file){
            return;
        }


        /*
         * 6 MB maximum
         */

        if(file.size > 6 * 1024 * 1024){

            showMessage(
                "ছবির সাইজ ৬ MB-এর বেশি হতে পারবে না।",
                "error"
            );

            event.target.value = "";

            return;
        }


        selectedPhoto = file;


        /*
         * আগে local preview দেখানো
         */

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                document.getElementById("avatar")
                    .src =
                    e.target.result;
            };

        reader.readAsDataURL(file);
    }
);


/* =========================
   UPLOAD PHOTO
========================= */

async function uploadPhoto(){

    if(!selectedPhoto){
        return null;
    }


    const extension =
        selectedPhoto.name
            .split(".")
            .pop()
            .toLowerCase();


    /*
     * প্রত্যেক user-এর নিজের folder
     */

    const filePath =
        currentUser.id +
        "/profile." +
        extension;


    const {
        error: uploadError
    } =
    await supabaseClient
        .storage
        .from("avatars")
        .upload(
            filePath,
            selectedPhoto,
            {
                upsert:true,
                contentType:
                    selectedPhoto.type
            }
        );


    if(uploadError){
        throw uploadError;
    }


    /*
     * Public URL
     */

    const {
        data
    } =
    supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(filePath);


    if(!data || !data.publicUrl){

        throw new Error(
            "ছবির URL পাওয়া যায়নি।"
        );
    }


    return data.publicUrl;
}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

    if(!currentUser){

        showMessage(
            "Login session পাওয়া যায়নি। আবার Login করুন।",
            "error"
        );

        return;
    }

    const saveBtn =
        document.getElementById("saveBtn");

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try{

        /* বর্তমান authenticated user নিশ্চিত করা */
        const {
            data: userData,
            error: userError
        } = await supabaseClient.auth.getUser();

        if(userError){
            throw userError;
        }

        if(!userData || !userData.user){
            throw new Error(
                "Login session পাওয়া যায়নি।"
            );
        }

        currentUser = userData.user;


        /* Form data */

        const fullName =
            document.getElementById("fullName")
            .value
            .trim();

        const username =
            document.getElementById("username")
            .value
            .trim();

        const bio =
            document.getElementById("bio")
            .value
            .trim();


        /* নতুন ছবি থাকলে upload */

        let avatarUrl = null;

        if(selectedPhoto){

            avatarUrl =
                await uploadPhoto();
        }


        /* শুধুমাত্র UPDATE */

        const updateData = {

            full_name:
                fullName || null,

            username:
                username || null,

            bio:
                bio || null,

            updated_at:
                new Date().toISOString()
        };


        if(avatarUrl){

            updateData.avatar_url =
                avatarUrl;
        }


        const {
            error: updateError
        } =
        await supabaseClient
            .from("profiles")
            .update(updateData)
            .eq("id", currentUser.id);


        if(updateError){
            throw updateError;
        }


        /* Photo reset */

        selectedPhoto = null;

        document.getElementById("photoInput")
            .value = "";


        /* আবার Profile load */

        await loadProfile();


        showMessage(
            "✅ Profile সফলভাবে Update হয়েছে।",
            "success"
        );


    }catch(error){

        console.error(
            "Profile update error:",
            error
        );

        showMessage(
            "Profile Update করতে সমস্যা হয়েছে: " +
            (error.message || "Unknown error"),
            "error"
        );

    }finally{

        saveBtn.disabled = false;
        saveBtn.textContent =
            "💾 Save / Update";
    }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

    const {
        error
    } =
    await supabaseClient.auth.signOut();


    if(error){

        showMessage(
            "Logout করতে সমস্যা হয়েছে।",
            "error"
        );

        return;
    }


    window.location.href =
        "index.html";
}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
