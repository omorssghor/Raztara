<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>Profile | Raztara</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                 "Noto Sans Bengali",Arial,sans-serif;
    background:#f5f7f6;
    color:#17201c;
}

/* =========================
   HEADER
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    background:#087f5b;
    color:white;
    display:flex;
    align-items:center;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.back-btn{
    width:58px;
    height:62px;
    border:0;
    background:transparent;
    color:white;
    font-size:30px;
    cursor:pointer;
}

.top-title{
    font-size:20px;
    font-weight:700;
}

/* =========================
   MIDDLE SCROLL AREA
========================= */

.main{
    position:fixed;
    top:62px;
    bottom:78px;
    left:0;
    right:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 15px 30px;
    -webkit-overflow-scrolling:touch;
}

/* =========================
   PROFILE HEADER
========================= */

.profile-card{
    background:white;
    border-radius:18px;
    padding:24px 18px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.avatar-wrap{
    width:110px;
    height:110px;
    margin:0 auto 14px;
    position:relative;
}

.avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:#e5eae8;
    border:4px solid white;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.profile-name{
    font-size:24px;
    font-weight:750;
    word-break:break-word;
}

.profile-username{
    margin-top:5px;
    color:#68746f;
    font-size:15px;
}

.online-row{
    margin-top:9px;
    font-size:14px;
    color:#087f5b;
    font-weight:600;
}

.hidden{
    display:none !important;
}

/* =========================
   INFO
========================= */

.info-card{
    margin-top:15px;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.info-row{
    display:flex;
    gap:13px;
    padding:17px 16px;
    border-bottom:1px solid #edf0ee;
}

.info-row:last-child{
    border-bottom:0;
}

.info-icon{
    width:34px;
    flex:0 0 34px;
    font-size:22px;
    text-align:center;
}

.info-content{
    min-width:0;
    flex:1;
}

.info-label{
    font-size:12px;
    color:#7a8580;
    margin-bottom:4px;
}

.info-value{
    font-size:16px;
    line-height:1.45;
    word-break:break-word;
}

.bio{
    white-space:pre-wrap;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:78px;
    background:white;
    border-top:1px solid #e1e6e3;
    display:flex;
    z-index:1000;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
    padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
    flex:1;
    border:0;
    background:white;
    color:#53605b;
    font-size:12px;
    font-weight:650;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
}

.nav-btn span{
    font-size:23px;
    line-height:1;
}

.nav-btn.active{
    color:#087f5b;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:2000;
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    max-height:92vh;
    background:white;
    border-radius:22px 22px 0 0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    animation:slideUp .2s ease;
}

@keyframes slideUp{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.modal-header{
    height:62px;
    flex:0 0 62px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    border-bottom:1px solid #e7ebe9;
}

.modal-title{
    font-size:19px;
    font-weight:750;
}

.close-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#f0f3f1;
    font-size:25px;
    color:#44504b;
    cursor:pointer;
}

.modal-body{
    overflow-y:auto;
    padding:18px;
    -webkit-overflow-scrolling:touch;
}

/* =========================
   EDIT AVATAR
========================= */

.edit-avatar-area{
    text-align:center;
    margin-bottom:20px;
}

.edit-avatar{
    width:92px;
    height:92px;
    border-radius:50%;
    object-fit:cover;
    background:#e5eae8;
    border:3px solid #087f5b;
}

.photo-btn{
    display:inline-block;
    margin-top:10px;
    padding:9px 15px;
    border-radius:10px;
    background:#e8f5f0;
    color:#087f5b;
    font-weight:700;
    cursor:pointer;
}

#photoInput{
    display:none;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:650;
    color:#3e4945;
}

.form-input,
.form-textarea{
    width:100%;
    border:1px solid #d6ded9;
    border-radius:11px;
    padding:12px 13px;
    font-size:16px;
    outline:none;
    background:#fff;
    color:#17201c;
}

.form-input:focus,
.form-textarea:focus{
    border-color:#087f5b;
    box-shadow:0 0 0 3px rgba(8,127,91,.10);
}

.form-textarea{
    min-height:105px;
    resize:vertical;
}

.email-box{
    background:#f2f5f3;
    color:#68746f;
}

/* =========================
   MODAL FOOTER
========================= */

.modal-footer{
    flex:0 0 auto;
    display:flex;
    gap:10px;
    padding:13px 18px calc(13px + env(safe-area-inset-bottom));
    border-top:1px solid #e7ebe9;
    background:white;
}

.modal-btn{
    flex:1;
    min-height:48px;
    border:0;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.cancel-btn{
    background:#edf1ef;
    color:#3f4945;
}

.save-btn{
    background:#087f5b;
    color:white;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:50px 20px;
    color:#69756f;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #dce6e1;
    border-top-color:#087f5b;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(20px);
    background:#17201c;
    color:white;
    padding:12px 17px;
    border-radius:12px;
    font-size:14px;
    z-index:5000;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){
    .main{
        max-width:650px;
        margin:auto;
    }

    .bottom-nav{
        max-width:650px;
        left:50%;
        transform:translateX(-50%);
        border-left:1px solid #e1e6e3;
        border-right:1px solid #e1e6e3;
    }

    .topbar{
        max-width:650px;
        left:50%;
        right:auto;
        width:100%;
        transform:translateX(-50%);
    }
}
</style>
</head>

<body>

<!-- =========================
     TOP HEADER
========================= -->

<header class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Back">‹</button>
    <div class="top-title">Profile</div>
</header>


<!-- =========================
     MAIN SCROLL
========================= -->

<main class="main">

    <div id="loadingBox" class="loading">
        <div class="spinner"></div>
        <div>Profile লোড হচ্ছে...</div>
    </div>

    <div id="profileContent" style="display:none;">

        <!-- PROFILE HEADER -->

        <section class="profile-card">

            <div class="avatar-wrap">

                    id="profileAvatar"
                    class="avatar"
                    src=""
                    alt="Profile"
                >

            <div id="profileName" class="profile-name">

            </div>

            <div id="profileUsername" class="profile-username">

            <div id="onlineRow" class="online-row">

        <section class="info-card">

            <div class="info-row">

                        —

                    <div id="profileEmail" class="info-value">

                    </div>
                </div>
            </div>


            <div class="info-row">

                        —

                </div>

</main>


<!-- =========================

========================= -->

<nav class="bottom-nav" id="bottomNav">

        <span>🏠</span>
        Home
    </button>

    <button class="nav-btn" id="editBtn">

        Edit Profile
    </button>

    <button class="nav-btn" id="logoutBtn">
        <span>🚪</span>

    </button>

</nav>


<!-- =========================
     EDIT PROFILE MODAL
========================= -->

<div class="modal" id="editModal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">

<!-- =========================
     TOAST
========================= -->

<div class="toast" id="toast"></div>


<script>
/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;
let currentProfile = null;
let selectedPhoto = null;
let isOwnProfile = true;


/* =====================================================
   HELPERS
===================================================== */

function $(id){
    return document.getElementById(id);
}


function showToast(message){
    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2800);
}


function escapeHtml(value){
    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function formatLastSeen(dateValue){

    if(!dateValue){
        return "Offline";
    }

    const date = new Date(dateValue);

    if(Number.isNaN(date.getTime())){
        return "Offline";
    }

    return date.toLocaleString(
        "bn-BD",
        {
            day:"numeric",
            month:"short",
            hour:"numeric",
            minute:"2-digit"
        }
    );
}


function defaultAvatar(name){

    const first =
        String(name || "R")
            .trim()
            .charAt(0)
            .toUpperCase() || "R";

    return "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(first) +
        "&background=087f5b&color=ffffff&size=256";
}


/* =====================================================
   GET TARGET USER
===================================================== */

function getTargetUserId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("user");
}


/* =====================================================
   AUTH
===================================================== */

async function getLoggedInUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if(error){
        throw error;
    }

    if(!data || !data.user){
        window.location.href = "login.html";
        return null;
    }

    return data.user;
}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    try{

        currentUser =
            await getLoggedInUser();

        if(!currentUser){
            return;
        }


        const targetUserId =
            getTargetUserId();


        const profileUserId =
            targetUserId || currentUser.id;


        isOwnProfile =
            profileUserId === currentUser.id;


        /* ---------------------------------------------
           LOAD PROFILE
        --------------------------------------------- */

        const {
            data: profile,
            error: profileError
        } = await supabaseClient

            .from("profiles")

            .select(`
                id,
                username,
                full_name,
                avatar_url,
                bio,
                online_visibility,
                last_seen_at,
                phone,
                address
            `)

            .eq("id", profileUserId)

            .maybeSingle();


        if(profileError){
            throw profileError;
        }


        if(!profile){

            throw new Error(
                "Profile পাওয়া যায়নি।"
            );

        }


        currentProfile = profile;


        /* ---------------------------------------------
           DISPLAY
        --------------------------------------------- */

        const name =
            profile.full_name ||
            profile.username ||
            "Raztara User";


        $("profileName").textContent =
            name;


        $("profileUsername").textContent =
            profile.username
                ? "@" + profile.username
                : "Username নেই";


        $("profilePhone").textContent =
            profile.phone || "Phone নেই";


        /*
          Email profiles table-এ নেই।
          Supabase Auth user object থেকে নেওয়া হচ্ছে।
        */

        if(isOwnProfile){

            $("profileEmail").textContent =
                currentUser.email || "Email নেই";

        }else{

            /*
              অন্য user-এর email কখনো দেখাব না।
            */

            $("profileEmail").textContent =
                "Private";

        }


        $("profileAddress").textContent =
            profile.address || "Address নেই";


        $("profileBio").textContent =
            profile.bio || "Bio নেই";


        $("profileAvatar").src =
            profile.avatar_url ||
            defaultAvatar(name);


        $("editAvatar").src =
            profile.avatar_url ||
            defaultAvatar(name);


        /* ---------------------------------------------
           ONLINE / LAST SEEN PRIVACY
        --------------------------------------------- */

        await updateOnlineVisibility();


        /* ---------------------------------------------
           OWN PROFILE CONTROLS
        --------------------------------------------- */

        if(isOwnProfile){

            $("editBtn").style.display =
                "flex";

            $("logoutBtn").style.display =
                "flex";

        }else{

            /*
              অন্য user-এর profile হলে
              Edit + Logout থাকবে না।
            */

            $("editBtn").style.display =
                "none";

            $("logoutBtn").style.display =
                "none";

        }


        /* ---------------------------------------------
           FINISH
        --------------------------------------------- */

        $("loadingBox").style.display =
            "none";

        $("profileContent").style.display =
            "block";


        fillEditForm();


    }catch(error){

        console.error(
            "Profile load error:",
            error
        );

        $("loadingBox").innerHTML =
            "<div style='color:#c62828;font-weight:700'>" +
            "Profile লোড করতে সমস্যা হয়েছে।" +
            "</div>" +
            "<div style='margin-top:8px;font-size:13px;color:#666'>" +
            escapeHtml(error.message) +
            "</div>";

    }

}


/* =====================================================
   ONLINE VISIBILITY
===================================================== */

async function updateOnlineVisibility(){

    if(!currentProfile){
        return;
    }


    /*
      নিজের profile হলে নিজের last seen দেখা যাবে।
    */

    if(isOwnProfile){

        $("onlineRow").classList.remove(
            "hidden"
        );

        $("profileLastSeen").textContent =
            "Online";

        return;

    }


    const visibility =
        currentProfile.online_visibility ||
        "everyone";


    /* ---------------------------------------------
       EVERYONE
    --------------------------------------------- */

    if(visibility === "everyone"){

        $("onlineRow").classList.remove(
            "hidden"
        );

        $("profileLastSeen").textContent =
            currentProfile.last_seen_at
                ? "Last seen " +
                  formatLastSeen(
                      currentProfile.last_seen_at
                  )
                : "Offline";

        return;
    }


    /* ---------------------------------------------
       NOBODY
    --------------------------------------------- */

    if(visibility === "nobody"){

        $("onlineRow").classList.add(
            "hidden"
        );

        return;
    }


    /* ---------------------------------------------
       FRIENDS
    --------------------------------------------- */

    if(visibility === "friends"){

        const {
            data,
            error
        } = await supabaseClient

            .from("friendships")

            .select("id")

            .eq("status","accepted")

            .or(
                "and(requester_id.eq." +
                currentUser.id +
                ",addressee_id.eq." +
                currentProfile.id +
                "),and(requester_id.eq." +
                currentProfile.id +
                ",addressee_id.eq." +
                currentUser.id +
                ")"
            )

            .limit(1);


        if(
            !error &&
            Array.isArray(data) &&
            data.length > 0
        ){

            $("onlineRow").classList.remove(
                "hidden"
            );

            $("profileLastSeen").textContent =
                currentProfile.last_seen_at
                    ? "Last seen " +
                      formatLastSeen(
                          currentProfile.last_seen_at
                      )
                    : "Offline";

        }else{

            $("onlineRow").classList.add(
                "hidden"
            );

        }

    }

}


/* =====================================================
   EDIT FORM
===================================================== */

function fillEditForm(){

    if(!currentProfile){
        return;
    }

    $("editFullName").value =
        currentProfile.full_name || "";

    $("editUsername").value =
        currentProfile.username || "";

    $("editPhone").value =
        currentProfile.phone || "";

    $("editAddress").value =
        currentProfile.address || "";

    $("editBio").value =
        currentProfile.bio || "";

    $("editEmail").value =
        currentUser.email || "";

}


/* =====================================================
   OPEN EDIT MODAL
===================================================== */

function openEditModal(){

    if(!isOwnProfile){
        return;
    }

    selectedPhoto = null;

    $("photoInput").value = "";

    fillEditForm();

    $("editModal").classList.add(
        "show"
    );

    document.body.style.overflow =
        "hidden";
}


/* =====================================================
   CLOSE EDIT MODAL
===================================================== */

function closeEditModal(){

    $("editModal").classList.remove(
        "show"
    );

    document.body.style.overflow =
        "hidden";

    selectedPhoto = null;

    $("photoInput").value = "";

}


/* =====================================================
   PHOTO SELECT
===================================================== */

$("photoInput").addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];

        if(!file){
            return;
        }


        /* Maximum 6 MB */

        if(file.size > 6 * 1024 * 1024){

            showToast(
                "ছবির size সর্বোচ্চ 6 MB হতে পারবে।"
            );

            this.value = "";

            return;
        }


        if(!file.type.startsWith("image/")){

            showToast(
                "শুধু image file নির্বাচন করুন।"
            );

            this.value = "";

            return;
        }


        selectedPhoto = file;


        const reader =
            new FileReader();


        reader.onload = function(event){

            $("editAvatar").src =
                event.target.result;

        };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   UPLOAD PROFILE PHOTO
===================================================== */

async function uploadProfilePhoto(){

    if(!selectedPhoto){
        return currentProfile.avatar_url || null;
    }


    const extension =
        selectedPhoto.name
            .split(".")
            .pop()
            .toLowerCase();


    const safeExtension =
        /^[a-z0-9]+$/.test(extension)
            ? extension
            : "jpg";


    const filePath =
        currentUser.id +
        "/profile-" +
        Date.now() +
        "-" +
        crypto.randomUUID() +
        "." +
        safeExtension;


    const {
        error: uploadError
    } = await supabaseClient

        .storage

        .from("avatars")

        .upload(
            filePath,
            selectedPhoto,
            {
                cacheControl:"3600",
                contentType:
                    selectedPhoto.type,
                upsert:false
            }
        );


    if(uploadError){
        throw uploadError;
    }


    const {
        data
    } = supabaseClient

        .storage

        .from("avatars")

        .getPublicUrl(filePath);


    return data.publicUrl;

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(){

    if(!currentUser || !currentProfile){
        return;
    }


    const saveButton =
        $("saveProfileBtn");


    const originalText =
        saveButton.textContent;


    try{

        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";


        const fullName =
            $("editFullName").value.trim();


        let username =
            $("editUsername").value.trim();


        const phone =
            $("editPhone").value.trim();


        const address =
            $("editAddress").value.trim();


        const bio =
            $("editBio").value.trim();


        /*
          Username empty হলে null
        */

        if(username === ""){
            username = null;
        }


        /*
          Username basic validation
        */

        if(username){

            if(!/^[a-zA-Z0-9_.-]+$/.test(username)){

                throw new Error(
                    "Username-এ শুধু English letter, number, _, . অথবা - ব্যবহার করুন।"
                );

            }

        }


        /* ---------------------------------------------
           PHOTO
        --------------------------------------------- */

        let avatarUrl =
            currentProfile.avatar_url || null;


        if(selectedPhoto){

            avatarUrl =
                await uploadProfilePhoto();

        }


        /* ---------------------------------------------
           UPDATE PROFILE
        --------------------------------------------- */

        const {
            error: updateError
        } = await supabaseClient

            .from("profiles")

            .update({

                full_name:
                    fullName || null,

                username:
                    username,

                phone:
                    phone || null,

                address:
                    address || null,

                bio:
                    bio || null,

                avatar_url:
                    avatarUrl,

                updated_at:
                    new Date().toISOString()

            })

            .eq(
                "id",
                currentUser.id
            );


        if(updateError){

            /*
              Duplicate username
            */

            if(
                updateError.code === "23505"
            ){

                throw new Error(
                    "এই username ইতিমধ্যে অন্য একজন ব্যবহার করছেন।"
                );

            }

            throw updateError;

        }


        /* ---------------------------------------------
           RELOAD PROFILE
        --------------------------------------------- */

        const {
            data: updatedProfile,
            error: reloadError
        } = await supabaseClient

            .from("profiles")

            .select(`
                id,
                username,
                full_name,
                avatar_url,
                bio,
                online_visibility,
                last_seen_at,
                phone,
                address
            `)

            .eq(
                "id",
                currentUser.id
            )

            .single();


        if(reloadError){
            throw reloadError;
        }


        currentProfile =
            updatedProfile;


        /* ---------------------------------------------
           UPDATE UI
        --------------------------------------------- */

        $("profileName").textContent =
            currentProfile.full_name ||
            currentProfile.username ||
            "Raztara User";


        $("profileUsername").textContent =
            currentProfile.username
                ? "@" + currentProfile.username
                : "Username নেই";


        $("profilePhone").textContent =
            currentProfile.phone ||
            "Phone নেই";


        $("profileEmail").textContent =
            currentUser.email ||
            "Email নেই";


        $("profileAddress").textContent =
            currentProfile.address ||
            "Address নেই";


        $("profileBio").textContent =
            currentProfile.bio ||
            "Bio নেই";


        const newAvatar =
            currentProfile.avatar_url ||
            defaultAvatar(
                currentProfile.full_name ||
                currentProfile.username
            );


        $("profileAvatar").src =
            newAvatar;


        $("editAvatar").src =
            newAvatar;


        await updateOnlineVisibility();


        closeEditModal();


        showToast(
            "Profile সফলভাবে Save হয়েছে।"
        );


    }catch(error){

        console.error(
            "Profile save error:",
            error
        );

        showToast(
            "Profile Save করতে সমস্যা হয়েছে: " +
            error.message
        );


    }finally{

        saveButton.disabled = false;

        saveButton.textContent =
            originalText;

    }

}
