<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7f9;
    color:#222;
}

.header{
    height:60px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:0 15px;
}

.back{
    color:white;
    text-decoration:none;
    font-size:34px;
    line-height:1;
}

.header-title{
    flex:1;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:auto;
    padding:25px 18px 40px;
}

.profile-card{
    background:white;
    border-radius:18px;
    padding:25px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.avatar-box{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #075e54;
    background:#ddd;
}

.default-avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#075e54;
    color:white;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
    border:4px solid #075e54;
}

.change-photo{
    display:inline-block;
    margin-top:12px;
    background:#075e54;
    color:white;
    padding:10px 18px;
    border-radius:25px;
    cursor:pointer;
    font-size:14px;
}

#photoInput{
    display:none;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#555;
}

.field input,
.field textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

.field input:focus,
.field textarea:focus{
    border-color:#075e54;
}

.field input:disabled{
    background:#f1f1f1;
    color:#777;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.save-btn{
    width:100%;
    border:0;
    background:#075e54;
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
}

.logout-btn{
    width:100%;
    border:1px solid #d9534f;
    background:white;
    color:#d9534f;
    padding:13px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.status{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    min-height:20px;
}

.loading{
    text-align:center;
    padding:40px 10px;
    color:#666;
}
</style>
</head>

<body>

<div class="header">
    <a class="back" href="index.html">‹</a>
    <div class="header-title">My Profile</div>
    <div style="width:30px;"></div>
</div>

<div class="container">

    <div id="loadingBox" class="loading">
        Profile লোড হচ্ছে...
    </div>

    <div id="profileCard" class="profile-card" style="display:none;">

        <div class="avatar-box">

            <img
                id="avatarImage"
                class="avatar"
                style="display:none;"
                alt="Profile Photo"
            >

            <div
                id="defaultAvatar"
                class="default-avatar"
            >
                👤
            </div>

            <br>

            <label for="photoInput" class="change-photo">
                🖼️ Change Photo
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
            >

        </div>

        <div class="field">
            <label>Name</label>
            <input
                type="text"
                id="nameInput"
                placeholder="আপনার নাম"
            >
        </div>

        <div class="field">
            <label>Username</label>
            <input
                type="text"
                id="usernameInput"
                placeholder="Username"
            >
        </div>

        <div class="field">
            <label>Email</label>
            <input
                type="email"
                id="emailInput"
                disabled
            >
        </div>

        <div class="field">
            <label>Bio</label>
            <textarea
                id="bioInput"
                placeholder="আপনার সম্পর্কে কিছু লিখুন..."
            ></textarea>
        </div>

        <button
            id="saveButton"
            class="save-btn"
            onclick="saveProfile()"
        >
            💾 Save / Update
        </button>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

        <div id="status" class="status"></div>

    </div>

</div>

<script>

/* ===============================
   SUPABASE
================================ */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ===============================
   GLOBAL USER
================================ */

let currentUser = null;
let selectedPhoto = null;


/* ===============================
   START
================================ */

window.addEventListener("load", loadProfile);


/* ===============================
   LOAD PROFILE
================================ */

async function loadProfile(){

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if(error){
            throw error;
        }

        currentUser = data.user;

        if(!currentUser){

            window.location.href = "index.html";
            return;
        }


        /*
         * IMPORTANT:
         * এখানে শুধু SELECT হচ্ছে।
         * INSERT / UPSERT কিছুই নেই।
         */

        const {
            data: profile,
            error: profileError
        } = await supabaseClient
            .from("profiles")
            .select("id, username, full_name, avatar_url, bio")
            .eq("id", currentUser.id)
            .maybeSingle();


        if(profileError){
            throw profileError;
        }


        /*
         * Profile row না থাকলে
         * এখন আমরা INSERT করব না।
         */

        if(!profile){

            showStatus(
                "Profile record পাওয়া যায়নি।",
                "red"
            );

            document.getElementById("loadingBox").style.display =
                "none";

            document.getElementById("profileCard").style.display =
                "block";

            document.getElementById("emailInput").value =
                currentUser.email || "";

            return;
        }


        /* Fill profile */

        document.getElementById("nameInput").value =
            profile.full_name || "";

        document.getElementById("usernameInput").value =
            profile.username || "";

        document.getElementById("emailInput").value =
            currentUser.email || "";

        document.getElementById("bioInput").value =
            profile.bio || "";


        /* Avatar */

        if(profile.avatar_url){

            document.getElementById("avatarImage").src =
                profile.avatar_url;

            document.getElementById("avatarImage").style.display =
                "inline-block";

            document.getElementById("defaultAvatar").style.display =
                "none";

        }else{

            document.getElementById("avatarImage").style.display =
                "none";

            document.getElementById("defaultAvatar").style.display =
                "inline-flex";
        }


        document.getElementById("loadingBox").style.display =
            "none";

        document.getElementById("profileCard").style.display =
            "block";

    }catch(error){

        console.error("PROFILE LOAD ERROR:", error);

        document.getElementById("loadingBox").innerHTML =
            "Profile লোড করতে সমস্যা হয়েছে:<br>" +
            error.message;
    }
}


/* ===============================
   PHOTO SELECT
================================ */

document.getElementById("photoInput")
.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file){
        selectedPhoto = null;
        return;
    }

    if(!file.type.startsWith("image/")){

        showStatus(
            "শুধু ছবি নির্বাচন করুন।",
            "red"
        );

        event.target.value = "";
        selectedPhoto = null;

        return;
    }


    /* 6 MB limit */

    if(file.size > 6 * 1024 * 1024){

        showStatus(
            "ছবির সাইজ ৬ MB-এর বেশি হতে পারবে না।",
            "red"
        );

        event.target.value = "";
        selectedPhoto = null;

        return;
    }


    selectedPhoto = file;


    /* Preview */

    const previewURL =
        URL.createObjectURL(file);

    document.getElementById("avatarImage").src =
        previewURL;

    document.getElementById("avatarImage").style.display =
        "inline-block";

    document.getElementById("defaultAvatar").style.display =
        "none";

});


/* ===============================
   SAVE PROFILE
================================ */

async function saveProfile(){

    if(!currentUser){

        showStatus(
            "আপনি লগইন করা নেই।",
            "red"
        );

        return;
    }


    const saveButton =
        document.getElementById("saveButton");

    saveButton.disabled = true;

    saveButton.innerText =
        "Saving...";


    try{

        const fullName =
            document.getElementById("nameInput")
            .value
            .trim();

        const username =
            document.getElementById("usernameInput")
            .value
            .trim();

        const bio =
            document.getElementById("bioInput")
            .value
            .trim();


        let avatarURL = null;


        /* =================================
           PHOTO UPLOAD
        ================================= */

        if(selectedPhoto){

            const extension =
                selectedPhoto.name
                .split(".")
                .pop()
                .toLowerCase();

            const filePath =
                currentUser.id +
                "/profile." +
                extension;


            const {
                error: uploadError
            } = await supabaseClient
                .storage
                .from("avatars")
                .upload(
                    filePath,
                    selectedPhoto,
                    {
                        upsert: true,
                        contentType: selectedPhoto.type
                    }
                );


            if(uploadError){
                throw uploadError;
            }


            const {
                data: publicData
            } = supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(filePath);


            avatarURL =
                publicData.publicUrl +
                "?t=" +
                Date.now();
        }


        /* =================================
           UPDATE DATA
           
           IMPORTANT:
           এখানে INSERT নেই।
           UPSERT নেই।
           
           শুধু UPDATE।
        ================================= */

        const updateData = {

            full_name: fullName,

            username:
                username || null,

            bio:
                bio || null,

            updated_at:
                new Date().toISOString()
        };


        if(avatarURL){

            updateData.avatar_url =
                avatarURL;
        }


        console.log(
            "PROFILE UPDATE ONLY",
            currentUser.id,
            updateData
        );


        const {
            data: updatedProfile,
            error: updateError
        } = await supabaseClient
            .from("profiles")
            .update(updateData)
            .eq("id", currentUser.id)
            .select("id, username, full_name, avatar_url, bio")
            .single();


        if(updateError){
            throw updateError;
        }


        if(!updatedProfile){

            throw new Error(
                "Profile update হয়েছে বলে কোনো row পাওয়া যায়নি।"
            );
        }


        /* Update screen */

        document.getElementById("nameInput").value =
            updatedProfile.full_name || "";

        document.getElementById("usernameInput").value =
            updatedProfile.username || "";

        document.getElementById("bioInput").value =
            updatedProfile.bio || "";


        if(updatedProfile.avatar_url){

            document.getElementById("avatarImage").src =
                updatedProfile.avatar_url;

            document.getElementById("avatarImage").style.display =
                "inline-block";

            document.getElementById("defaultAvatar").style.display =
                "none";
        }


        selectedPhoto = null;

        document.getElementById("photoInput").value = "";


        showStatus(
            "✅ Profile সফলভাবে Update হয়েছে।",
            "green"
        );


    }catch(error){

        console.error(
            "PROFILE UPDATE ERROR:",
            error
        );

        showStatus(
            "❌ Profile Save করতে সমস্যা হয়েছে: " +
            error.message,
            "red"
        );

    }finally{

        saveButton.disabled = false;

        saveButton.innerText =
            "💾 Save / Update";
    }
}


/* ===============================
   STATUS
================================ */

function showStatus(message, color){

    const status =
        document.getElementById("status");

    status.innerText =
        message;

    status.style.color =
        color === "green"
        ? "#16803c"
        : "#d93025";
}


/* ===============================
   LOGOUT
================================ */

async function logout(){

    const {
        error
    } = await supabaseClient.auth.signOut();

    if(error){

        showStatus(
            "Logout করতে সমস্যা হয়েছে: " +
            error.message,
            "red"
        );

        return;
    }

    window.location.href =
        "index.html";
}

</script>

</body>
</html>
