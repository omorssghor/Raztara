<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7f9;
    color:#222;
}

/* =========================
   TOP FIXED BAR
========================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:60px;
    background:#075e54;
    color:white;

    display:flex;
    align-items:center;

    padding:0 15px;

    z-index:1000;
}

.back{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    text-decoration:none;

    font-size:34px;
    line-height:1;
}

.header-title{
    flex:1;

    text-align:center;

    font-size:20px;
    font-weight:bold;
}

.header-space{
    width:45px;
}

/* =========================
   SCROLL AREA
========================= */

.main{
    position:fixed;

    top:60px;
    bottom:72px;
    left:0;
    right:0;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    padding:20px 15px 30px;
}

/* =========================
   PROFILE CARD
========================= */

.card{
    width:100%;
    max-width:500px;

    margin:0 auto;

    background:white;

    border-radius:18px;

    padding:25px 20px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);
}

/* =========================
   AVATAR
========================= */

.avatar-box{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:125px;
    height:125px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #075e54;

    background:#ddd;
}

.default-avatar{
    width:125px;
    height:125px;

    border-radius:50%;

    background:#075e54;

    color:white;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    font-size:52px;

    border:4px solid #075e54;
}

/* =========================
   PROFILE INFORMATION
========================= */

.profile-info{
    margin-top:10px;
}

.info-row{
    padding:15px 0;

    border-bottom:1px solid #eee;
}

.info-label{
    color:#777;

    font-size:13px;

    margin-bottom:6px;
}

.info-value{
    font-size:16px;

    font-weight:500;

    word-break:break-word;

    line-height:1.5;
}

.bio-box{
    margin-top:18px;

    padding:15px;

    background:#f5f7f9;

    border-radius:12px;
}

.bio-label{
    color:#777;

    font-size:13px;

    margin-bottom:7px;
}

.bio-text{
    font-size:15px;

    line-height:1.6;

    white-space:pre-wrap;

    word-break:break-word;
}

/* =========================
   LOADING
========================= */

.loading{
    max-width:500px;

    margin:auto;

    text-align:center;

    padding:40px 10px;

    color:#666;
}

/* =========================
   STATUS
========================= */

.status{
    text-align:center;

    margin-top:15px;

    font-size:14px;

    color:#d93025;
}

/* =========================
   BOTTOM FIXED BAR
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:72px;

    background:white;

    border-top:1px solid #ddd;

    display:flex;

    z-index:1000;

    box-shadow:
        0 -3px 12px rgba(0,0,0,.08);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.bottom-btn{
    flex:1;

    height:72px;

    border:0;

    background:white;

    color:#555;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.bottom-btn .icon{
    font-size:23px;

    line-height:1;
}

.bottom-btn:active{
    background:#f1f5f4;
}

.bottom-btn.edit{
    color:#075e54;
}

.bottom-btn.logout{
    color:#d93025;
}

/* =========================
   EDIT PAGE
========================= */

#editPage{
    display:none;
}

.edit-card{
    width:100%;

    max-width:500px;

    margin:0 auto;

    background:white;

    border-radius:18px;

    padding:25px 20px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.08);
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;

    font-size:14px;

    font-weight:bold;

    margin-bottom:7px;

    color:#555;
}

.field input,
.field textarea{
    width:100%;

    padding:13px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:15px;

    outline:none;

    font-family:Arial,sans-serif;
}

.field input:focus,
.field textarea:focus{
    border-color:#075e54;
}

.field input:disabled{
    background:#f1f1f1;

    color:#777;
}

textarea{
    min-height:110px;

    resize:vertical;
}

.change-photo{
    display:inline-block;

    margin-top:12px;

    background:#075e54;

    color:white;

    padding:10px 18px;

    border-radius:25px;

    cursor:pointer;

    font-size:14px;
}

#photoInput{
    display:none;
}

.save-btn{
    width:100%;

    border:0;

    background:#075e54;

    color:white;

    padding:14px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:8px;
}

.save-btn:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.cancel-btn{
    width:100%;

    border:1px solid #ccc;

    background:white;

    color:#444;

    padding:13px;

    border-radius:10px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:400px){

    .card,
    .edit-card{
        padding:22px 16px;
    }

    .header-title{
        font-size:18px;
    }

    .bottom-btn{
        font-size:12px;
    }

}
</style>
</head>

<body>

<!-- ==================================================
     PROFILE PAGE
================================================== -->

<div id="profilePage">

    <!-- TOP FIXED -->

    <div class="header">

        <a
            class="back"
            href="index.html"
            aria-label="Back"
        >
            ‹
        </a>

        <div class="header-title">
            My Profile
        </div>

        <div class="header-space"></div>

    </div>


    <!-- SCROLL ONLY THIS AREA -->

    <main class="main">

        <div
            id="loadingBox"
            class="loading"
        >
            Profile লোড হচ্ছে...
        </div>


        <div

            class="card"

        >

            <!-- PHOTO -->

            <div class="avatar-box">

                <img
                    id="viewAvatar"
                    class="avatar"
                    style="display:none;"
                    alt="Profile Photo"
                >

                <div
                    id="viewDefaultAvatar"
                    class="default-avatar"

                    👤
                </div>

            </div>


            <!-- INFORMATION -->

            <div class="profile-info">

                <div class="info-row">

                    <div class="info-label">
                        Name
                    </div>

                    <div
                        id="viewName"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Username
                    </div>

                    <div
                        id="viewUsername"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Phone
                    </div>

                    <div
                        id="viewPhone"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Email
                    </div>

                    <div
                        id="viewEmail"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-row">

                    <div class="info-label">
                        Address
                    </div>

                    <div
                        id="viewAddress"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="bio-box">

                    <div class="bio-label">
                        Bio
                    </div>

                    <div
                        id="viewBio"
                        class="bio-text"
                    >
                        -

                </div>

            </div>

        </div>


        <div
            id="profileStatus"
            class="status"
        ></div>

    </main>


    <!-- BOTTOM FIXED -->

    <nav class="bottom-nav">

        <button
            class="bottom-btn"
            onclick="goHome()"
        >

            <span class="icon">
                🏠
            </span>

            <span>
                Home
            </span>

        </button>


        <button
            class="bottom-btn edit"
            onclick="openEditPage()"
        >

            <span class="icon">
                ✏️
            </span>

            <span>
                Edit Profile
            </span>

        </button>


        <button
            class="bottom-btn logout"
            onclick="logout()"
        >

            <span class="icon">
                🚪
            </span>

            <span>
                Logout
            </span>

        </button>

    </nav>

</div>


<!-- ==================================================
     EDIT PROFILE PAGE
================================================== -->

<div id="editPage">

    <!-- TOP FIXED -->

    <div class="header">

        <button
            class="back"
            onclick="backToProfile()"
            aria-label="Back"
            style="
                border:0;
                background:transparent;
                cursor:pointer;
            "
        >
            ‹
        </button>

        <div class="header-title">
            Edit Profile
        </div>

        <div class="header-space"></div>

    </div>


    <!-- SCROLL AREA -->

    <main class="main">

        <div class="edit-card">

            <!-- PHOTO -->

            <div class="avatar-box">

                <img
                    id="editAvatar"
                    class="avatar"
                    style="display:none;"
                    alt="Profile Photo"
                >

                <div

                </div>

                <br>

                <label

                </label>

                <input

            <!-- NAME -->

            <!-- USERNAME -->

            <div class="field">

                <label>
                    Username
                </label>

                <input
                    type="text"

                >

            </div>


            <!-- PHONE -->

            <div class="field">

                <label>
                    Phone
                </label>

                <input
                    type="tel"

            <!-- EMAIL -->

            <div class="field">

                <input

            </div>


            <!-- ADDRESS -->

            <div class="field">

                <label>
                    Address

                <textarea

                ></textarea>

            <div class="field">

                <label>
                    Bio
                </label>

                <textarea
                    id="bioInput"

            <button
                id="saveButton"

    <!-- BOTTOM FIXED -->

    <nav class="bottom-nav">

        <button
            class="bottom-btn"
            onclick="goHome()"
        >

            <span class="icon">
                🏠
            </span>

            <span>
                Home
            </span>

        </button>


        <button
            class="bottom-btn edit"
            onclick="backToProfile()"
        >

            <span class="icon">
                👤
            </span>

            <span>
                Profile
            </span>

        </button>


        <button
            class="bottom-btn logout"
            onclick="logout()"
        >

            <span class="icon">
                🚪
            </span>

            <span>
                Logout
            </span>

        </button>

    </nav>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   VARIABLES
================================================== */

let currentUser = null;

let currentProfile = null;

let selectedPhoto = null;


/* ==================================================
   START
================================================== */

window.addEventListener(
    "load",
    loadProfile
);


/* ==================================================
   LOAD PROFILE
================================================== */

async function loadProfile(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error){
            throw error;
        }


        currentUser =
            data.user;


        if(!currentUser){

            window.location.href =
                "index.html";

            return;
        }


        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                username,
                full_name,
                phone,
                email,
                address,
                avatar_url,
                bio
            `)
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(profileError){
            throw profileError;
        }


        if(!profile){

            throw new Error(
                "Profile record পাওয়া যায়নি।"
            );
        }


        currentProfile =
            profile;


        fillProfile(profile);


        fillEditForm(profile);


        document.getElementById(
            "loadingBox"
        ).style.display =
            "none";


        document.getElementById(
            "profileCard"
        ).style.display =
            "block";


    }catch(error){

        console.error(
            "PROFILE LOAD ERROR:",
            error
        );


        document.getElementById(
            "loadingBox"
        ).innerHTML =
            "Profile লোড করতে সমস্যা হয়েছে:<br>" +
            error.message;
    }
}


/* ==================================================
   FILL PROFILE VIEW
================================================== */

function fillProfile(profile){

    document.getElementById(
        "viewName"
    ).innerText =
        profile.full_name ||
        "নাম দেওয়া হয়নি";


    document.getElementById(
        "viewUsername"
    ).innerText =
        profile.username
        ? "@" + profile.username
        : "Username দেওয়া হয়নি";


    document.getElementById(
        "viewPhone"
    ).innerText =
        profile.phone ||
        "Phone দেওয়া হয়নি";


    document.getElementById(
        "viewEmail"
    ).innerText =
        currentUser.email ||
        profile.email ||
        "Email দেওয়া হয়নি";


    document.getElementById(
        "viewAddress"
    ).innerText =
        profile.address ||
        "ঠিকানা দেওয়া হয়নি";


    document.getElementById(
        "viewBio"
    ).innerText =
        profile.bio ||
        "কোনো Bio দেওয়া হয়নি";


    setAvatar(
        "viewAvatar",
        "viewDefaultAvatar",
        profile.avatar_url
    );
}


/* ==================================================
   FILL EDIT FORM
================================================== */

function fillEditForm(profile){

    document.getElementById(
        "nameInput"
    ).value =
        profile.full_name || "";


    document.getElementById(
        "usernameInput"
    ).value =
        profile.username || "";


    document.getElementById(
        "phoneInput"
    ).value =
        profile.phone || "";


    document.getElementById(
        "emailInput"
    ).value =
        currentUser.email ||
        profile.email ||
        "";


    document.getElementById(
        "addressInput"
    ).value =
        profile.address || "";


    document.getElementById(
        "bioInput"
    ).value =
        profile.bio || "";


    setAvatar(
        "editAvatar",
        "editDefaultAvatar",
        profile.avatar_url
    );
}


/* ==================================================
   AVATAR
================================================== */

function setAvatar(
    imageId,
    defaultId,
    url
){

    const image =
        document.getElementById(
            imageId
        );


    const defaultAvatar =
        document.getElementById(
            defaultId
        );


    if(url){

        image.src =
            url;


        image.style.display =
            "inline-block";


        defaultAvatar.style.display =
            "none";

    }else{

        image.style.display =
            "none";


        defaultAvatar.style.display =
            "inline-flex";
    }
}


/* ==================================================
   GO HOME
================================================== */

function goHome(){

    window.location.href =
        "index.html";
}


/* ==================================================
   OPEN EDIT PAGE
================================================== */

function openEditPage(){

    if(!currentProfile){
        return;
    }


    fillEditForm(
        currentProfile
    );


    selectedPhoto =
        null;


    document.getElementById(
        "photoInput"
    ).value =
        "";


    document.getElementById(
        "editStatus"
    ).innerText =
        "";


    document.getElementById(
        "profilePage"
    ).style.display =
        "none";


    document.getElementById(
        "editPage"
    ).style.display =
        "block";


    window.scrollTo(
        0,
        0
    );
}


/* ==================================================
   BACK TO PROFILE
================================================== */

function backToProfile(){

    document.getElementById(
        "editPage"
    ).style.display =
        "none";


    document.getElementById(
        "profilePage"
    ).style.display =
        "block";


    if(currentProfile){

        fillProfile(
            currentProfile
        );

        fillEditForm(
            currentProfile
        );
    }


    selectedPhoto =
        null;


    document.getElementById(
        "photoInput"
    ).value =
        "";
}


/* ==================================================
   PHOTO SELECT
================================================== */

document.getElementById(
    "photoInput"
).addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){

            selectedPhoto =
                null;

            return;
        }


        if(
            !file.type ||
            !file.type.startsWith(
                "image/"
            )
        ){

            showEditStatus(
                "শুধু ছবি নির্বাচন করুন।"
            );

            event.target.value =
                "";

            selectedPhoto =
                null;

            return;
        }


        if(
            file.size >
            6 * 1024 * 1024
        ){

            showEditStatus(
                "ছবির সাইজ ৬ MB-এর বেশি হতে পারবে না।"
            );

            event.target.value =
                "";

            selectedPhoto =
                null;

            return;
        }


        selectedPhoto =
            file;


        const previewURL =
            URL.createObjectURL(
                file
            );


        setAvatar(
            "editAvatar",
            "editDefaultAvatar",
            previewURL
        );
    }
);


/* ==================================================
   SAVE PROFILE
================================================== */

async function saveProfile(){

    if(!currentUser){

        showEditStatus(
            "আপনি লগইন করা নেই।"
        );

        return;
    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;


    saveButton.innerText =
        "Saving...";


    try{

        const fullName =
            document.getElementById(
                "nameInput"
            ).value.trim();


        const username =
            document.getElementById(
                "usernameInput"
            ).value.trim();


        const phone =
            document.getElementById(
                "phoneInput"
            ).value.trim();


        const address =
            document.getElementById(
                "addressInput"
            ).value.trim();


        const bio =
            document.getElementById(
                "bioInput"
            ).value.trim();


        let avatarURL =
            currentProfile.avatar_url ||
            null;


        /* =========================
           PHOTO UPLOAD
        ========================= */

        if(selectedPhoto){

            const extension =
                (
                    selectedPhoto.name
                    .split(".")
                    .pop() ||
                    "jpg"
                )
                .toLowerCase();


            const filePath =
                currentUser.id +
                "/profile-" +
                Date.now() +
                "-" +
                crypto.randomUUID() +
                "." +
                extension;


            const {
                error:uploadError
            } =
            await supabaseClient
                .storage
                .from("avatars")
                .upload(
                    filePath,
                    selectedPhoto,
                    {
                        cacheControl:"3600",

                        contentType:
                            selectedPhoto.type,

                        upsert:false
                    }
                );


            if(uploadError){
                throw uploadError;
            }


            const {
                data:publicData
            } =
            supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(
                    filePath
                );


            avatarURL =
                publicData.publicUrl;
        }


        /* =========================
           UPDATE
        ========================= */

        const updateData = {

            full_name:
                fullName,

            username:
                username || null,

            phone:
                phone || null,

            address:
                address || null,

            bio:
                bio || null,

            updated_at:
                new Date().toISOString()
        };


        if(avatarURL){

            updateData.avatar_url =
                avatarURL;
        }


        const {
            data:updatedProfile,
            error:updateError
        } =
        await supabaseClient
            .from("profiles")
            .update(updateData)
            .eq(
                "id",
                currentUser.id
            )
            .select(`
                id,
                username,
                full_name,
                phone,
                email,
                address,
                avatar_url,
                bio
            `)
            .single();


        if(updateError){
            throw updateError;
        }


        currentProfile =
            updatedProfile;


        selectedPhoto =
            null;


        document.getElementById(
            "photoInput"
        ).value =
            "";


        /* =========================
           UPDATE PROFILE PAGE
        ========================= */

        fillProfile(
            updatedProfile
        );


        fillEditForm(
            updatedProfile
        );


        /* =========================
           RETURN PROFILE
        ========================= */

        document.getElementById(
            "editPage"
        ).style.display =
            "none";


        document.getElementById(
            "profilePage"
        ).style.display =
            "block";


    }catch(error){

        console.error(
            "PROFILE UPDATE ERROR:",
            error
        );


        showEditStatus(
            "❌ Profile Update করতে সমস্যা হয়েছে: " +
            error.message
        );

    }finally{

        saveButton.disabled =
            false;


        saveButton.innerText =
            "💾 Save";
    }
}


/* ==================================================
   EDIT STATUS
================================================== */

function showEditStatus(message){

    const status =
        document.getElementById(
            "editStatus"
        );


    status.innerText =
        message;


    status.style.color =
        "#d93025";
}


/* ==================================================
   LOGOUT
================================================== */

async function logout(){

    const {
        error
    } =
    await supabaseClient
        .auth
        .signOut();


    if(error){

        alert(
            "Logout করতে সমস্যা হয়েছে: " +
            error.message
        );

        return;
    }


    window.location.href =
        "index.html";
}

</script>
