<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075e54">

<title>RAZTARA | Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f0f2f5;
    color:#222;
}

.header{
    height:60px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:21px;
    font-weight:bold;
}

.back{
    position:absolute;
    left:18px;
    font-size:25px;
    cursor:pointer;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px 15px 40px;
}

.profile-card{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.photo-area{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #075e54;
    background:#e9edef;
}

.photo-button{
    display:inline-block;
    margin-top:12px;
    background:#075e54;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

#photoInput{
    display:none;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
    font-size:14px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#075e54;
}

textarea{
    height:100px;
    resize:none;
}

.email-box{
    background:#f5f6f6;
}

.save-btn{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:none;
    border-radius:9px;
    background:#075e54;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
}

.logout-btn{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:1px solid #d9534f;
    border-radius:9px;
    background:white;
    color:#d9534f;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-size:14px;
}

.success{
    background:#e8f5e9;
    color:#176b2c;
}

.error{
    background:#ffebee;
    color:#b71c1c;
}

.loading{
    text-align:center;
    padding:50px 20px;
    font-size:17px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="header">
    <div class="back" onclick="goBack()">‹</div>
    RAZTARA Profile
</div>

<div id="loading" class="loading">
    Profile loading...
</div>

<div id="profileContainer" class="container hidden">

    <div class="profile-card">

        <div class="photo-area">

            <img
                id="avatar"
                class="avatar"
                src="https://ui-avatars.com/api/?name=RAZTARA&background=075e54&color=fff&size=240"
                alt="Profile Photo"
            >

            <br>

            <label for="photoInput" class="photo-button">
                🖼️ Change Photo
            </label>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
            >

        </div>

        <label for="fullName">Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your name"
        >

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            class="email-box"
            readonly
        >

        <label for="bio">Bio</label>
        <textarea
            id="bio"
            placeholder="Write something about yourself..."
        ></textarea>

        <button
            id="saveBtn"
            class="save-btn"
            onclick="saveProfile()"
        >
            💾 SAVE PROFILE
        </button>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 LOGOUT
        </button>

        <div id="message" class="message"></div>

    </div>
</div>


<script>

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let selectedPhoto = null;


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();

    if(error){
        showError(error.message);
        return;
    }

    if(!session){

        window.location.href = "index.html";
        return;
    }

    currentUser = session.user;

    document.getElementById("email").value =
        currentUser.email || "";

    const {
        data: profile,
        error: profileError
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();

    if(profileError){

        console.error(profileError);

        showError(
            "Profile load করতে সমস্যা হয়েছে: " +
            profileError.message
        );

        return;
    }

    if(profile){

        document.getElementById("fullName").value =
            profile.full_name || "";

        document.getElementById("username").value =
            profile.username || "";

        document.getElementById("bio").value =
            profile.bio || "";

        if(profile.avatar_url){

            document.getElementById("avatar").src =
                profile.avatar_url;
        }
    }

    document.getElementById("loading")
        .classList.add("hidden");

    document.getElementById("profileContainer")
        .classList.remove("hidden");
}


/* =========================
   PHOTO SELECT
========================= */

document.getElementById("photoInput")
.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    if(file.size > 5 * 1024 * 1024){

        showError(
            "Photo 5 MB-এর বেশি হতে পারবে না।"
        );

        this.value = "";
        return;
    }

    selectedPhoto = file;

    const previewURL =
        URL.createObjectURL(file);

    document.getElementById("avatar").src =
        previewURL;

});


/* =========================
   UPLOAD PHOTO
========================= */

async function uploadPhoto(){

    if(!selectedPhoto){
        return null;
    }

    const extension =
        selectedPhoto.name
        .split(".")
        .pop()
        .toLowerCase();

    const filePath =
        currentUser.id +
        "/profile." +
        extension;

    const {
        error: uploadError
    } = await supabaseClient
        .storage
        .from("avatars")
        .upload(
            filePath,
            selectedPhoto,
            {
                upsert:true,
                contentType:selectedPhoto.type
            }
        );

    if(uploadError){

        throw uploadError;
    }

    const {
        data
    } = supabaseClient
        .storage
        .from("avatars")
        .getPublicUrl(filePath);

    return data.publicUrl +
        "?v=" +
        Date.now();
}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

    if(!currentUser){
        return;
    }

    const saveBtn =
        document.getElementById("saveBtn");

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    hideMessage();

    try{

        const fullName =
            document
            .getElementById("fullName")
            .value
            .trim();

        const username =
            document
            .getElementById("username")
            .value
            .trim();

        const bio =
            document
            .getElementById("bio")
            .value
            .trim();

        let avatarUrl = null;

        if(selectedPhoto){

            avatarUrl =
                await uploadPhoto();
        }

        const updateData = {

            id: currentUser.id,

            full_name:
                fullName || null,

            username:
                username || null,

            bio:
                bio || null,

            updated_at:
                new Date().toISOString()
        };

        if(avatarUrl){

            updateData.avatar_url =
                avatarUrl;
        }

        const {
            error
        } = await supabaseClient
            .from("profiles")
            .upsert(
                updateData,
                {
                    onConflict:"id"
                }
            );

        if(error){

            throw error;
        }

        selectedPhoto = null;

        document.getElementById("photoInput")
            .value = "";

        showSuccess(
            "✅ Profile সফলভাবে Save হয়েছে।"
        );

    }catch(error){

        console.error(error);

        showError(
            "Profile Save করতে সমস্যা হয়েছে: " +
            error.message
        );

    }finally{

        saveBtn.disabled = false;
        saveBtn.textContent = "💾 SAVE PROFILE";
    }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

    const {
        error
    } = await supabaseClient.auth.signOut();

    if(error){

        showError(error.message);
        return;
    }

    window.location.href = "index.html";
}


/* =========================
   BACK
========================= */

function goBack(){

    if(document.referrer){

        history.back();

    }else{

        window.location.href = "index.html";
    }
}


/* =========================
   MESSAGES
========================= */

function showSuccess(text){

    const box =
        document.getElementById("message");

    box.className =
        "message success";

    box.textContent = text;

    box.style.display = "block";
}

function showError(text){

    const box =
        document.getElementById("message");

    box.className =
        "message error";

    box.textContent = text;

    box.style.display = "block";
}

function hideMessage(){

    document.getElementById("message")
        .style.display = "none";
}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
