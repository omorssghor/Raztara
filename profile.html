<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f5f7f8;
    color:#172026;
    overflow:hidden;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    background:#087f5b;
    color:white;
    display:flex;
    align-items:center;
    z-index:100;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.back-btn{
    width:52px;
    height:62px;
    border:0;
    background:transparent;
    color:white;
    font-size:27px;
    cursor:pointer;
}

.top-title{
    font-size:19px;
    font-weight:700;
}

.main{
    position:fixed;
    top:62px;
    left:0;
    right:0;
    bottom:78px;
    overflow-y:auto;
    padding:18px 14px 30px;
    -webkit-overflow-scrolling:touch;
}

.profile-card{
    background:white;
    border-radius:18px;
    padding:22px 16px;
    text-align:center;
    box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.avatar-wrap{
    position:relative;
    width:104px;
    height:104px;
    margin:0 auto 13px;
}

.avatar{
    width:104px;
    height:104px;
    border-radius:50%;
    object-fit:cover;
    background:#e5e9eb;
    border:3px solid #087f5b;
}

.online-dot{
    position:absolute;
    right:3px;
    bottom:5px;
    width:19px;
    height:19px;
    border-radius:50%;
    background:#20c76b;
    border:3px solid white;
    display:none;
}

.profile-name{
    font-size:22px;
    font-weight:800;
    margin-top:5px;
    word-break:break-word;
}

.username{
    color:#6b757c;
    font-size:14px;
    margin-top:3px;
}

.bio{
    color:#4c565c;
    font-size:15px;
    margin:13px auto 0;
    line-height:1.5;
    max-width:600px;
    white-space:pre-wrap;
    word-break:break-word;
}

.status{
    margin-top:9px;
    font-size:13px;
    color:#087f5b;
    font-weight:600;
}

.details-card{
    margin-top:14px;
    background:white;
    border-radius:18px;
    padding:5px 16px;
    box-shadow:0 2px 12px rgba(0,0,0,.07);
}

.detail-row{
    min-height:62px;
    display:flex;
    align-items:center;
    gap:13px;
    border-bottom:1px solid #edf0f1;
}

.detail-row:last-child{
    border-bottom:0;
}

.detail-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#e8f6f1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
}

.detail-info{
    min-width:0;
    flex:1;
}

.detail-label{
    font-size:12px;
    color:#788187;
    margin-bottom:3px;
}

.detail-value{
    font-size:15px;
    color:#20292e;
    word-break:break-word;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:78px;
    background:white;
    border-top:1px solid #e3e7e8;
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:100;
    padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
    flex:1;
    height:70px;
    border:0;
    background:transparent;
    color:#6b7479;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.nav-btn .icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.nav-btn.active{
    color:#087f5b;
}

.logout-btn{
    color:#d93636;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    z-index:500;
    display:none;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    background:white;
    border-radius:22px 22px 0 0;
    padding:18px 16px 28px;
    animation:slideUp .22s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%);}
    to{transform:translateY(0);}
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modal-title{
    font-size:20px;
    font-weight:800;
}

.close-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f3;
    font-size:23px;
    cursor:pointer;
}

.edit-avatar-area{
    text-align:center;
    margin-bottom:20px;
}

.edit-avatar{
    width:92px;
    height:92px;
    border-radius:50%;
    object-fit:cover;
    background:#e7eaeb;
    border:3px solid #087f5b;
}

.photo-label{
    display:inline-block;
    margin-top:9px;
    color:#087f5b;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
}

#photoInput{
    display:none;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:#4d585e;
    margin-bottom:6px;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #d8dddf;
    border-radius:12px;
    padding:12px 13px;
    font-size:15px;
    outline:none;
    background:white;
    color:#172026;
}

.field input:focus,
.field textarea:focus{
    border-color:#087f5b;
    box-shadow:0 0 0 3px rgba(8,127,91,.10);
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.email-readonly{
    background:#f1f3f4 !important;
    color:#6b7479 !important;
}

.save-btn{
    width:100%;
    height:50px;
    border:0;
    border-radius:13px;
    background:#087f5b;
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:5px;
}

.save-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.loading{
    padding:50px 20px;
    text-align:center;
    color:#69747a;
    font-size:15px;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #dce7e3;
    border-top-color:#087f5b;
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.toast{
    position:fixed;
    left:50%;
    bottom:92px;
    transform:translateX(-50%) translateY(20px);
    background:#20282c;
    color:white;
    padding:11px 17px;
    border-radius:11px;
    font-size:14px;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.success{
    background:#087f5b;
}

.toast.error{
    background:#c62828;
}

.hidden{
    display:none !important;
}

function showToast(message,type=""){

const toast=$("toast");

toast.textContent=message;

toast.className="toast show "+type;

clearTimeout(window.__toastTimer);

window.__toastTimer=setTimeout(()=>{

function defaultAvatar(name="User"){

const letter=
String(name||"U")
.trim()
.charAt(0)
.toUpperCase()||"U";

return "https://ui-avatars.com/api/?name="+
encodeURIComponent(letter)+
"&background=087f5b&color=ffffff&size=256";

}


function formatLastSeen(value){

if(!value){
return t("notAvailable");
}

const date=new Date(value);

if(Number.isNaN(date.getTime())){
return t("notAvailable");
}

return date.toLocaleString(
currentLanguage==="bn"?"bn-BD":"en-US",
{
dateStyle:"medium",
timeStyle:"short"
}
);

}

/* =========================================================

========================================================= */

async function loadCurrentUser(){

const {data,error}=await supabaseClient.auth.getUser();

if(error){
throw error;
}

if(!data || !data.user){

window.location.href="login.html";

return null;

}

currentUser=data.user;

return currentUser;

}


/* =========================================================
   FRIEND CHECK
========================================================= */

async function areUsersFriends(userA,userB){

if(!userA || !userB){
return false;
}

if(userA===userB){
return true;
}

const {data,error}=await supabaseClient
.from("friendships")
.select("id")
.eq("status","accepted")
.or(
"and(requester_id.eq."+userA+",addressee_id.eq."+userB+"),and(requester_id.eq."+userB+",addressee_id.eq."+userA+")"
)
.limit(1);

if(error){

console.warn("Friend check error:",error);

return false;

}

return Array.isArray(data)&&data.length>0;

}


/* =========================================================
   LOAD PHONE
========================================================= */

async function loadPhone(targetUserId){

const {data,error}=await supabaseClient
.from("profile_phone")
.select("user_id, phone, visibility")
.eq("user_id",targetUserId)
.maybeSingle();

if(error){
throw error;
}

if(!data){

return{
phone:null,
visibility:"only_me"
};

}

return data;

}

.select("user_id, address, visibility")
.eq("user_id",targetUserId)
.maybeSingle();

if(error){
throw error;
}

if(!data){

return{
address:null,
visibility:"only_me"
};

}

return data;

}

   নতুন
========================================================= */

throw new Error("User not logged in");
}

const {data:profile,error:profileError}=await supabaseClient
.from("profiles")
.select(`

username,
full_name,
avatar_url,
bio,
online_visibility,
last_seen_at,
updated_at
`)
.eq("id",currentUser.id)

}

/* =========================================================
   FIELD VISIBILITY
========================================================= */

async function canViewPrivateField(ownerId,visibility){

if(ownerId===currentUser.id){
return true;
}

if(visibility==="public"){
return true;
}

if(visibility==="friend"){

return await areUsersFriends(
currentUser.id,
ownerId
);

}

return false;

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

try{

$("loadingBox").classList.remove("hidden");
$("profileContent").classList.add("hidden");

const params=new URLSearchParams(
window.location.search
);

const targetUserId=
params.get("user")||
currentUser.id;

isOwnProfile=
targetUserId===currentUser.id;


const {
data:profile,
error:profileError
}=await supabaseClient
.from("profiles")
.select(`
id,
username,
full_name,
avatar_url,
bio,
online_visibility,
last_seen_at,
updated_at
`)
.eq("id",targetUserId)
.maybeSingle();

if(profileError){
throw profileError;
}

if(!profile){

throw new Error(
"এই user-এর profile পাওয়া যায়নি।"
);

}

currentProfile=profile;

currentPhone=
await loadPhone(targetUserId);

currentAddress=
await loadAddress(targetUserId);


let isFriend=false;

if(!isOwnProfile){

isFriend=
await areUsersFriends(
currentUser.id,
targetUserId
);

}


const name=
profile.full_name||
profile.username||
"User";


$("profileName").textContent=name;

$("profileUsername").textContent=
profile.username
?"@"+profile.username
:t("noUsername");

$("detailUsername").textContent=
profile.username
?"@"+profile.username
:t("noUsername");

$("profileBio").textContent=
profile.bio||"";


const avatar=
profile.avatar_url||
defaultAvatar(name);

$("profileAvatar").src=avatar;

$("profileAvatar").onerror=()=>{

$("profileAvatar").src=
defaultAvatar(name);

};


if(isOwnProfile){

$("detailEmail").textContent=
currentUser.email||
t("noEmail");

}else{

$("detailEmail").textContent=t("private");

}


const phoneVisible=
await canViewPrivateField(
targetUserId,
currentPhone.visibility
);

if(phoneVisible&&currentPhone.phone){

$("detailPhone").textContent=
currentPhone.phone;

}else{

$("detailPhone").textContent=t("private");

}


const addressVisible=
await canViewPrivateField(
targetUserId,
currentAddress.visibility
);

if(addressVisible&&currentAddress.address){

$("detailAddress").textContent=
currentAddress.address;

}else{

$("detailAddress").textContent=t("private");

}


let statusAllowed=false;

if(isOwnProfile){

statusAllowed=true;

}else if(
profile.online_visibility==="everyone"
){

statusAllowed=true;

}else if(
profile.online_visibility==="friends"&&
isFriend
){

statusAllowed=true;

}


if(statusAllowed){

$("detailLastSeen").textContent=
formatLastSeen(profile.last_seen_at);

if(profile.online_visibility!=="nobody"){

$("profileStatus").textContent=
t("onlineStatus");

$("onlineDot").style.display="block";

}

}else{

$("detailLastSeen").textContent=t("private");
$("profileStatus").textContent="";
$("onlineDot").style.display="none";

}


if(isOwnProfile){

$("topTitle").textContent=t("myProfile");

$("bottomNav").classList.remove("hidden");

}else{

$("topTitle").textContent=name;

$("bottomNav").classList.add("hidden");

}


applyLanguage();

$("loadingBox").classList.add("hidden");

$("profileContent").classList.remove("hidden");


}catch(error){

console.error("Profile load error:",error);

$("loadingBox").innerHTML=`

<div style="
color:#c62828;
font-weight:700;
margin-bottom:10px;
">
${t("loadError")}
</div>

<div style="
color:#666;
font-size:14px;
line-height:1.5;
">
${String(error.message||"")}
</div>

<button
type="button"
onclick="location.reload()"
style="
margin-top:16px;
border:0;
background:#087f5b;
color:white;
padding:10px 18px;
border-radius:10px;
font-weight:700;
">
${t("retry")}
</button>

`;

}

}

/* =========================================================
   PHOTO
========================================================= */

$("photoInput").addEventListener(
"change",
event=>{

const file=
event.target.files&&
event.target.files[0];

if(!file){
return;
}

if(!file.type.startsWith("image/")){

showToast(
t("photoOnly"),
"error"
);

event.target.value="";

return;

}

if(file.size>6*1024*1024){

showToast(
t("photoSize"),
"error"
);

event.target.value="";

return;

}

selectedPhoto=file;

const reader=new FileReader();

reader.onload=e=>{

$("editAvatar").src=e.target.result;

};

reader.readAsDataURL(file);

}
);


/* =========================================================
   USERNAME
========================================================= */

function validateUsername(username){

return /^[a-zA-Z0-9_]{3,30}$/.test(username);

}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadProfilePhoto(){

if(!selectedPhoto){

return currentProfile.avatar_url||null;

}

const originalName=
selectedPhoto.name||"";

const parts=
originalName.split(".");

let extension=
parts.length>1
?parts.pop().toLowerCase()
:"jpg";

extension=
extension.replace(/[^a-z0-9]/g,"");

if(!extension){
extension="jpg";
}

const filePath=
currentUser.id+
"/profile-"+
Date.now()+
"-"+
crypto.randomUUID()+
"."+
extension;

const {error:uploadError}=
await supabaseClient
.storage
.from("avatars")
.upload(
filePath,
selectedPhoto,
{
cacheControl:"3600",
contentType:
selectedPhoto.type||
"image/jpeg",
upsert:false
}
);

if(uploadError){
throw uploadError;
}

const {data}=
supabaseClient
.storage
.from("avatars")
.getPublicUrl(filePath);

return data.publicUrl;

}


/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(){

if(!currentUser){
return;
}

const saveButton=
$("saveProfileBtn");

try{

saveButton.disabled=true;

saveButton.textContent=t("saving");


const fullName=
$("fullNameInput")
.value
.trim();

const username=
$("usernameInput")
.value
.trim()
.toLowerCase();

const phone=
$("phoneInput")
.value
.trim();

const address=
$("addressInput")
.value
.trim();

const bio=
$("bioInput")
.value
.trim();


if(!username){

throw new Error(
t("usernameRequired")
);

}

if(!validateUsername(username)){

throw new Error(
t("usernameInvalid")
);

}


/* PHOTO */

let avatarUrl=
currentProfile.avatar_url||null;

if(selectedPhoto){

avatarUrl=
await uploadProfilePhoto();

}


/* PROFILE */

const {
error:profileUpdateError
}=
await supabaseClient
.from("profiles")
.update({

full_name:
fullName||null,

username:
username,

bio:
bio||null,

avatar_url:
avatarUrl,

updated_at:
new Date().toISOString()

})
.eq(
"id",
currentUser.id
);

if(profileUpdateError){

if(profileUpdateError.code==="23505"){

throw new Error(
t("usernameTaken")
);

}

throw profileUpdateError;

}


/* PHONE */

const {
error:phoneError
}=
await supabaseClient
.from("profile_phone")
.upsert(
{
user_id:currentUser.id,
phone:phone||null,
updated_at:new Date().toISOString()
},
{
onConflict:"user_id"
}
);

if(phoneError){
throw phoneError;
}


/* ADDRESS */

const {
error:addressError
}=
await supabaseClient
.from("profile_address")
.upsert(
{
user_id:currentUser.id,
address:address||null,
updated_at:new Date().toISOString()
},
{
onConflict:"user_id"
}
);

if(addressError){
throw addressError;
}


/* =====================================================
   ★ SAVE-এর পর সরাসরি Supabase থেকে আবার পড়ি
===================================================== */

const fresh=
await getFreshProfileData();

currentProfile=
fresh.profile;

currentPhone=
fresh.phone;

currentAddress=
fresh.address;


/* EDIT BOX-এ FRESH DATA */

$("fullNameInput").value=
currentProfile.full_name||"";

$("usernameInput").value=
currentProfile.username||"";

$("emailInput").value=
currentUser.email||"";

$("phoneInput").value=
currentPhone.phone||"";

$("addressInput").value=
currentAddress.address||"";

$("bioInput").value=
currentProfile.bio||"";


const newName=
currentProfile.full_name||
currentProfile.username||
"User";

$("editAvatar").src=
currentProfile.avatar_url||
defaultAvatar(newName);


showToast(
t("saveSuccess"),
"success"
);


/* PROFILE DISPLAY-ও refresh */

await loadProfile();


/* Modal বন্ধ */

closeEditModal();


}catch(error){

console.error(
"Profile save error:",
error
);

showToast(
t("saveError")+
(error.message||"Unknown error"),
"error"
);

}finally{

saveButton.disabled=false;

saveButton.textContent=t("save");

}

}


/* =========================================================
   SAVE BUTTON
========================================================= */

$("saveProfileBtn").addEventListener(
"click",
saveProfile
);
