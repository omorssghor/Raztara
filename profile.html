<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>Profile | Raztara</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

.header{
    height:60px;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:100;
}

.back{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:30px;
    border-radius:50%;
}

.back:active{
    background:rgba(255,255,255,.15);
}

.header-title{
    font-size:20px;
    font-weight:bold;
}

.container{
    width:100%;
    max-width:650px;
    margin:20px auto;
    padding:0 15px 30px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:22px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.loading{
    text-align:center;
    padding:45px 10px;
    color:#777;
}

.profile-top{
    text-align:center;
}

.avatar{
    width:115px;
    height:115px;
    border-radius:50%;
    object-fit:cover;
    background:#e8eeee;
    border:4px solid #fff;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.profile-name{
    margin-top:12px;
    font-size:24px;
    font-weight:bold;
}

.profile-username{
    margin-top:5px;
    color:#087f5b;
    font-size:15px;
}

.profile-bio{
    margin:13px auto 0;
    color:#666;
    line-height:1.55;
    white-space:pre-wrap;
    max-width:500px;
}

.info-list{
    margin-top:25px;
}

.info-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.info-row:last-child{
    border-bottom:none;
}

.info-icon{
    width:30px;
    font-size:19px;
}

.info-content{
    flex:1;
    min-width:0;
}

.info-label{
    color:#888;
    font-size:12px;
    margin-bottom:4px;
}

.info-value{
    font-size:15px;
    word-break:break-word;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
}

button{
    border:none;
    border-radius:10px;
    padding:13px 16px;
    font-size:15px;
    cursor:pointer;
}

.primary{
    flex:1;
    background:#087f5b;
    color:#fff;
}

.danger{
    width:100%;
    margin-top:10px;
    background:#fff0f0;
    color:#d93025;
}

.status{
    min-height:20px;
    margin-top:15px;
    text-align:center;
    font-size:14px;
}

.error{
    color:#d93025;
}

.success{
    color:#087f5b;
}

.hidden{
    display:none !important;
}
</style>
</head>

<body>

<header class="header">

    <a href="index.html" class="back" aria-label="Back">
        ‹
    </a>

    <div class="header-title" id="pageTitle">
        Profile
    </div>

</header>


<main class="container">

    <section class="card">

        <div id="loadingBox" class="loading">
            Profile loading...
        </div>


        <div id="profileContent" class="hidden">

            <div class="profile-top">

                <img
                    id="profileAvatar"
                    class="avatar"
                    src=""
                    alt="Profile Photo"
                >

                <div
                    id="profileName"
                    class="profile-name"
                >
                    —
                </div>

                <div
                    id="profileUsername"
                    class="profile-username"
                >
                </div>

                <div
                    id="profileBio"
                    class="profile-bio hidden"
                >
                </div>

            </div>


            <div class="info-list">

                <!-- Email -->
                <div
                    id="emailRow"
                    class="info-row"
                >
                    <div class="info-icon">
                        ✉️
                    </div>

                    <div class="info-content">
                        <div class="info-label">
                            Email
                        </div>

                        <div
                            id="profileEmail"
                            class="info-value"
                        >
                            —
                        </div>
                    </div>
                </div>


                <!-- Phone -->
                <div
                    id="phoneRow"
                    class="info-row"
                >
                    <div class="info-icon">
                        📱
                    </div>

                    <div class="info-content">
                        <div class="info-label">
                            Phone
                        </div>

                        <div
                            id="profilePhone"
                            class="info-value"
                        >
                            Private
                        </div>
                    </div>
                </div>


                <!-- Address -->
                <div
                    id="addressRow"
                    class="info-row"
                >
                    <div class="info-icon">
                        📍
                    </div>

                    <div class="info-content">
                        <div class="info-label">
                            Address
                        </div>

                        <div
                            id="profileAddress"
                            class="info-value"
                        >
                            Private
                        </div>
                    </div>
                </div>


                <!-- Last Seen -->
                <div
                    id="onlineRow"
                    class="info-row"
                >
                    <div class="info-icon">
                        🟢
                    </div>

                    <div class="info-content">
                        <div class="info-label">
                            Last seen
                        </div>

                        <div
                            id="profileLastSeen"
                            class="info-value"
                        >
                            —
                        </div>
                    </div>
                </div>

            </div>


            <div
                id="profileStatus"
                class="status"
            >
            </div>


            <!-- ONLY OWN PROFILE -->
            <div id="ownButtons" class="hidden">

                <div class="buttons">

                    <button
                        type="button"
                        class="primary"
                        id="editButton"
                    >
                        ✏️ Edit Profile
                    </button>

                </div>


                <button
                    type="button"
                    class="danger"
                    id="logoutButton"
                >
                    🚪 Logout
                </button>

            </div>

        </div>

    </section>

</main>


<script>

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let currentProfile = null;
let currentPhone = null;
let currentAddress = null;

let isOwnProfile = false;


const params =
    new URLSearchParams(
        window.location.search
    );

const requestedUserId =
    params.get("user");


function $(id){
    return document.getElementById(id);
}


/* ================================
   DEFAULT AVATAR
================================ */

function defaultAvatar(name){

    const first =
        String(name || "User")
        .trim()
        .charAt(0)
        .toUpperCase() || "U";

    return (
        "https://ui-avatars.com/api/" +
        "?name=" +
        encodeURIComponent(first) +
        "&background=087f5b" +
        "&color=ffffff" +
        "&size=256"
    );
}


/* ================================
   FORMAT LAST SEEN
================================ */

function formatLastSeen(value){

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "Unknown";
    }

    return date.toLocaleString(
        "bn-BD",
        {
            day:"numeric",
            month:"short",
            hour:"numeric",
            minute:"2-digit"
        }
    );
}


/* ================================
   FRIEND CHECK
================================ */

async function isAcceptedFriend(){

    if(isOwnProfile){
        return true;
    }

    if(
        !currentProfile ||
        currentProfile.online_visibility !== "friends"
    ){
        return false;
    }

    const { data, error } =
        await supabaseClient
        .from("friendships")
        .select("id")
        .eq("status","accepted")
        .or(
            `and(requester_id.eq.${currentUser.id},addressee_id.eq.${currentProfile.id}),and(requester_id.eq.${currentProfile.id},addressee_id.eq.${currentUser.id})`
        )
        .limit(1);

    if(error){
        return false;
    }

    return (
        Array.isArray(data) &&
        data.length > 0
    );
}


/* ================================
   LAST SEEN RENDER
================================ */

async function renderLastSeen(){

    const row =
        $("onlineRow");

    if(isOwnProfile){

        row.classList.remove(
            "hidden"
        );

        $("profileLastSeen")
            .textContent = "Online";

        return;
    }


    const visibility =
        currentProfile.online_visibility ||
        "everyone";


    /* Everyone */
    if(
        visibility === "everyone"
    ){

        row.classList.remove(
            "hidden"
        );

    }


    /* Friends */
    else if(
        visibility === "friends"
    ){

        const friend =
            await isAcceptedFriend();

        if(!friend){

            row.classList.add(
                "hidden"
            );

            return;
        }

        row.classList.remove(
            "hidden"
        );

    }


    /* Nobody */
    else{

        row.classList.add(
            "hidden"
        );

        return;
    }


    if(
        currentProfile.last_seen_at
    ){

        $("profileLastSeen")
            .textContent =
            "Last seen " +
            formatLastSeen(
                currentProfile.last_seen_at
            );

    }else{

        $("profileLastSeen")
            .textContent =
            "Offline";
    }
}


/* ================================
   RENDER PROFILE
================================ */

async function renderProfile(){

    const profile =
        currentProfile;


    const name =
        profile.full_name ||
        profile.username ||
        "User";


    /* Avatar */

    $("profileAvatar").src =
        profile.avatar_url ||
        defaultAvatar(name);

    $("profileAvatar").alt =
        name;


    /* Name */

    $("profileName")
        .textContent = name;


    /* Username */

    if(profile.username){

        $("profileUsername")
            .textContent =
            "@" + profile.username;

    }else{

        $("profileUsername")
            .textContent = "";
    }


    /* Bio */

    if(profile.bio){

        $("profileBio")
            .textContent =
            profile.bio;

        $("profileBio")
            .classList.remove(
                "hidden"
            );

    }else{

        $("profileBio")
            .textContent = "";

        $("profileBio")
            .classList.add(
                "hidden"
            );
    }


    /* Email */

    if(isOwnProfile){

        $("profileEmail")
            .textContent =
            currentUser.email ||
            "Not available";

        $("emailRow")
            .classList.remove(
                "hidden"
            );

    }else{

        $("emailRow")
            .classList.add(
                "hidden"
            );
    }


    /* Phone */

    if(
        currentPhone &&
        currentPhone.phone
    ){

        $("profilePhone")
            .textContent =
            currentPhone.phone;

    }else{

        $("profilePhone")
            .textContent =
            "Private";
    }


    /* Address */

    if(
        currentAddress &&
        currentAddress.address
    ){

        $("profileAddress")
            .textContent =
            currentAddress.address;

    }else{

        $("profileAddress")
            .textContent =
            "Private";
    }


    /* Last seen */

    await renderLastSeen();


    /* Own buttons */

    if(isOwnProfile){

        $("ownButtons")
            .classList.remove(
                "hidden"
            );

    }else{

        $("ownButtons")
            .classList.add(
                "hidden"
            );
    }
}


/* ================================
   LOAD PROFILE
================================ */

async function loadProfile(){

    try{

        const {
            data:{
                user
            },
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if(error || !user){

            window.location.replace(
                "index.html"
            );

            return;
        }


        currentUser = user;


        const targetId =
            requestedUserId ||
            currentUser.id;


        isOwnProfile =
            targetId ===
            currentUser.id;


        $("pageTitle")
            .textContent =
            isOwnProfile
                ? "My Profile"
                : "Profile";


        /* ==========================
           PROFILE
        ========================== */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url,
            bio,
            online_visibility,
            last_seen_at
        `)
        .eq("id",targetId)
        .maybeSingle();


        if(profileError){

            throw new Error(
                "Profile load করতে সমস্যা হয়েছে: " +
                profileError.message
            );
        }


        if(!profile){

            throw new Error(
                "এই Profile পাওয়া যায়নি।"
            );
        }


        currentProfile =
            profile;


        /* ==========================
           PHONE
        ========================== */

        const {
            data:phoneData
        } =
        await supabaseClient
        .from("profile_phone")
        .select(
            "phone, visibility"
        )
        .eq("user_id",targetId)
        .maybeSingle();


        currentPhone =
            phoneData || null;


        /* ==========================
           ADDRESS
        ========================== */

        const {
            data:addressData
        } =
        await supabaseClient
        .from("profile_address")
        .select(
            "address, visibility"
        )
        .eq("user_id",targetId)
        .maybeSingle();


        currentAddress =
            addressData || null;


        /* Render */

        await renderProfile();


        $("loadingBox")
            .classList.add(
                "hidden"
            );

        $("profileContent")
            .classList.remove(
                "hidden"
            );


    }catch(error){

        $("loadingBox")
            .textContent =
            error.message ||
            "Profile load করতে সমস্যা হয়েছে।";

        $("loadingBox")
            .style.color =
            "#d93025";
    }
}


/* ================================
   EDIT BUTTON
================================ */

$("editButton")
.addEventListener(
    "click",
    function(){

        if(!isOwnProfile){
            return;
        }

        window.location.href =
            "edit-profile.html";
    }
);


/* ================================
   LOGOUT
================================ */

$("logoutButton")
.addEventListener(
    "click",
    async function(){

        if(!isOwnProfile){
            return;
        }

        const button =
            $("logoutButton");

        button.disabled = true;
        button.textContent =
            "Logging out...";


        const {
            error
        } =
        await supabaseClient
        .auth
        .signOut();


        if(error){

            button.disabled = false;
            button.textContent =
                "🚪 Logout";

            $("profileStatus")
                .textContent =
                "Logout করতে সমস্যা হয়েছে: " +
                error.message;

            $("profileStatus")
                .className =
                "status error";

            return;
        }


        window.location.replace(
            "index.html"
        );
    }
);


/* ================================
   START
================================ */

loadProfile();

</script>

</body>
</html>
