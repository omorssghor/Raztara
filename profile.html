<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>RAZTARA — Profile</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f2f5;color:#172321}
body{overflow:hidden}.app{height:100dvh;max-width:520px;margin:auto;background:#f7f9f8;position:relative}
.top{height:64px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 14px;gap:10px;position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(520px,100%);z-index:10;box-shadow:0 2px 7px #0002}
.back{width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:29px}.title{font-size:19px;font-weight:800}.menu{margin-left:auto;width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:24px}
.main{position:absolute;top:64px;bottom:72px;left:0;right:0;overflow:auto;padding:18px 14px 28px;-webkit-overflow-scrolling:touch}
.hero{background:#fff;border-radius:20px;padding:25px 18px 20px;text-align:center;box-shadow:0 2px 12px #0000000d}
.avatar{width:108px;height:108px;border-radius:50%;object-fit:cover;background:#dfe9e6;border:4px solid #e8f4f1}
.name{font-size:23px;font-weight:800;margin-top:12px}.username{font-size:14px;color:#71807c;margin-top:4px}.bio{font-size:14px;color:#52615d;line-height:1.5;margin:12px auto 0;max-width:390px;white-space:pre-wrap}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#087f5b;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.actions{display:flex;gap:10px;margin-top:17px}.action{flex:1;height:45px;border:1px solid #d7e1de;border-radius:12px;background:#fff;color:#075e54;font-weight:800}.action.primary{background:#075e54;color:#fff;border-color:#075e54}
.section{background:#fff;border-radius:18px;margin-top:14px;padding:7px 16px;box-shadow:0 2px 12px #0000000d}.row{min-height:61px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #edf1ef}.row:last-child{border:0}.ico{width:36px;height:36px;border-radius:50%;background:#e8f3f0;display:flex;align-items:center;justify-content:center;font-size:17px}.info{min-width:0}.label{font-size:11px;color:#84908d}.value{font-size:14px;margin-top:3px;word-break:break-word}
.nav{height:72px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid #e2e8e5;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;color:#6d7875;font-size:11px;font-weight:700}.nav button span{display:block;font-size:23px;margin-bottom:3px}.nav .active{color:#075e54}
.loading{text-align:center;padding:60px 20px;color:#6d7875}.spin{width:30px;height:30px;border:3px solid #dce8e4;border-top-color:#075e54;border-radius:50%;margin:0 auto 12px;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,15px);background:#202a27;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#c62828}
@media(min-width:521px){body{padding:20px 0}.app{height:calc(100dvh - 40px);border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #0002}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="back" onclick="history.length>1?history.back():location.href='index.html'">‹</button>
<div class="title">Profile</div><button class="menu">⋮</button>
</header>
<main class="main">
<div id="loading" class="loading"><div class="spin"></div>Profile লোড হচ্ছে...</div>
<div id="content" style="display:none">
<section class="hero">
<img id="avatar" class="avatar" alt="Profile">
<div id="name" class="name">—</div>
<div id="username" class="username">@—</div>
<div id="bio" class="bio"></div>
<div id="status" class="status"><span class="dot"></span> Online</div>
<div class="actions">
<button class="action primary" onclick="openEdit()">✏️ Edit Profile</button>
<button class="action" onclick="location.href='index.html'">💬 Message</button>
</div>
</section>
<section class="section">
<div class="row"><div class="ico">📧</div><div class="info"><div class="label">Email</div><div id="email" class="value">Private</div></div></div>
<div class="row"><div class="ico">📱</div><div class="info"><div class="label">Phone</div><div id="phone" class="value">Private</div></div></div>
<div class="row"><div class="ico">📍</div><div class="info"><div class="label">Address</div><div id="address" class="value">Private</div></div></div>
<div class="row"><div class="ico">🕒</div><div class="info"><div class="label">Last seen</div><div id="lastSeen" class="value">—</div></div></div>
</section>
</div>
</main>
<nav class="nav">
<button onclick="location.href='index.html'"><span>⌂</span>Home</button>
<button onclick="location.href='chat.html'"><span>💬</span>Chat</button>
<button onclick="location.href='call.html'"><span>📞</span>Calls</button>
<button class="active"><span>👤</span>Profile</button>
</nav>
<div id="toast" class="toast"></div>
</div>
<script>
const SUPABASE_URL="https://pqyicaqpmojijjskpzcp.supabase.co";
const SUPABASE_KEY="sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function toast(t,e=false){$("toast").textContent=t;$("toast").className="toast show"+(e?" error":"");setTimeout(()=>$("toast").className="toast",2800)}
function avatar(name,url){return url||"https://ui-avatars.com/api/?name="+encodeURIComponent((name||"U").charAt(0))+"&background=075e54&color=fff&size=256"}
async function load(){
 try{
  const {data:{user},error:ue}=await sb.auth.getUser();
  if(ue||!user){location.href="login.html";return}
  const {data:p,error:pe}=await sb.from("profiles").select("id,username,full_name,avatar_url,bio,last_seen_at,online_visibility").eq("id",user.id).single();
  if(pe)throw pe;
  const {data:ph}=await sb.from("profile_phone").select("phone,visibility").eq("user_id",user.id).maybeSingle();
  const {data:ad}=await sb.from("profile_address").select("address,visibility").eq("user_id",user.id).maybeSingle();
  const n=p.full_name||p.username||"RAZTARA User";
  $("avatar").src=avatar(n,p.avatar_url);$("name").textContent=n;$("username").textContent=p.username?"@"+p.username:"@user";$("bio").textContent=p.bio||"";
  $("email").textContent=user.email||"Private";
  $("phone").textContent=ph?.phone||"Private";$("address").textContent=ad?.address||"Private";
  $("lastSeen").textContent=p.last_seen_at?new Date(p.last_seen_at).toLocaleString("bn-BD",{dateStyle:"medium",timeStyle:"short"}):"—";
  $("loading").style.display="none";$("content").style.display="block";
 }catch(e){$("loading").innerHTML="<b>Profile load করতে সমস্যা হয়েছে</b><br><small>"+(e.message||"Unknown error")+"</small><br><button onclick='location.reload()' style='margin-top:14px;padding:9px 15px;border:0;border-radius:9px;background:#075e54;color:#fff'>আবার চেষ্টা করুন</button>"}
}
function openEdit(){location.href="edit-profile.html"}
load();
</script>
</body>
</html>
