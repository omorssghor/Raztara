<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>RAZTARA | My Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f9;
  color:#222;
  overflow:hidden;
}


/* =========================
   TOP BAR
========================= */

.topbar{

  position:fixed;

  top:0;
  left:0;
  right:0;

  height:60px;

  background:#075e54;

  color:white;

  display:flex;

  align-items:center;

  z-index:1000;

  box-shadow:
    0 2px 8px rgba(0,0,0,.18);
}

.back-btn{

  width:55px;
  height:60px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  text-decoration:none;

  font-size:34px;
}

.top-title{

  flex:1;

  text-align:center;

  font-size:20px;

  font-weight:bold;
}

.top-space{

  width:55px;
}


/* =========================
   SCROLL AREA
========================= */

.scroll-area{

  position:fixed;

  top:60px;
  bottom:65px;

  left:0;
  right:0;

  overflow-y:auto;

  padding:
    20px
    15px
    30px;
}


/* =========================
   PROFILE CARD
========================= */

.profile-card{

  width:100%;
  max-width:520px;

  margin:0 auto;

  background:white;

  border-radius:18px;

  padding:25px 20px 30px;

  box-shadow:
    0 3px 15px rgba(0,0,0,.08);
}


/* =========================
   AVATAR
========================= */

.avatar-area{

  text-align:center;

  margin-bottom:25px;
}

.avatar{

  width:125px;
  height:125px;

  border-radius:50%;

  object-fit:cover;

  border:4px solid #075e54;

  background:#ddd;
}

.default-avatar{

  width:125px;
  height:125px;

  margin:auto;

  border-radius:50%;

  background:#075e54;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:52px;

  border:4px solid #075e54;
}


/* =========================
   PROFILE INFO
========================= */

.info-row{

  padding:15px 0;

  border-bottom:
    1px solid #eeeeee;
}

.info-label{

  font-size:13px;

  color:#777;

  margin-bottom:6px;
}

.info-value{

  font-size:16px;

  font-weight:500;

  word-break:break-word;

  line-height:1.5;
}

.bio-box{

  margin-top:18px;

  padding:15px;

  border-radius:12px;

  background:#f5f7f9;
}

.bio-label{

  color:#777;

  font-size:13px;

  margin-bottom:7px;
}

.bio-text{

  font-size:15px;

  line-height:1.6;

  white-space:pre-wrap;
}


/* =========================
   EDIT BUTTON
========================= */

.edit-btn{

  width:100%;

  border:0;

  background:#075e54;

  color:white;

  padding:14px;

  border-radius:10px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  margin-top:22px;
}

.edit-btn:active{

  transform:scale(.98);
}


/* =========================
   LOGOUT
========================= */

.logout-btn{

  width:100%;

  border:
    1px solid #d9534f;

  background:white;

  color:#d9534f;

  padding:13px;

  border-radius:10px;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

  margin-top:12px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:65px;

  background:white;

  display:flex;

  align-items:center;

  justify-content:space-around;

  border-top:
    1px solid #ddd;

  z-index:1000;

  box-shadow:
    0 -2px 8px rgba(0,0,0,.08);
}

.nav-btn{

  flex:1;

  height:65px;

  border:0;

  background:white;

  color:#777;

  font-size:12px;

  cursor:pointer;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:3px;
}

.nav-icon{

  font-size:22px;
}

.nav-btn.active{

  color:#075e54;

  font-weight:bold;
}


/* =========================
   MODAL
========================= */

.modal{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.55);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:3000;
}

.modal.show{

  display:flex;
}

.modal-box{

  width:100%;

  max-width:520px;

  max-height:
    calc(100vh - 30px);

  background:white;

  border-radius:
    20px 20px 0 0;

  overflow-y:auto;

  padding:20px;

  animation:
    modalUp .22s ease;
}

@keyframes modalUp{

  from{

    transform:
      translateY(100%);
  }

  to{

    transform:
      translateY(0);
  }
}


/* =========================
   MODAL HEADER
========================= */

.modal-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;
}

.modal-title{

  font-size:19px;

  font-weight:bold;

  color:#075e54;
}

.modal-close{

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:#f1f1f1;

  font-size:22px;

  cursor:pointer;
}


/* =========================
   EDIT PHOTO
========================= */

.edit-photo-area{

  text-align:center;

  margin-bottom:22px;
}

.edit-avatar{

  width:110px;
  height:110px;

  border-radius:50%;

  object-fit:cover;

  border:4px solid #075e54;

  background:#ddd;
}

.change-photo{

  display:inline-block;

  margin-top:12px;

  background:#075e54;

  color:white;

  padding:10px 18px;

  border-radius:25px;

  cursor:pointer;

  font-size:14px;
}

#photoInput{

  display:none;
}


/* =========================
   FORM
========================= */

.field{

  margin-bottom:17px;
}

.field label{

  display:block;

  font-size:14px;

  font-weight:bold;

  color:#555;

  margin-bottom:7px;
}

.field input,
.field textarea{

  width:100%;

  padding:13px;

  border:
    1px solid #ddd;

  border-radius:10px;

  outline:none;

  font-size:15px;

  font-family:Arial,sans-serif;
}

.field input:focus,
.field textarea:focus{

  border-color:#075e54;
}

.field input:disabled{

  background:#f1f1f1;

  color:#777;
}

.field textarea{

  min-height:95px;

  resize:vertical;
}


/* =========================
   MODAL BUTTONS
========================= */

.save-btn{

  width:100%;

  border:0;

  background:#075e54;

  color:white;

  padding:14px;

  border-radius:10px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

  margin-top:5px;
}

.cancel-btn{

  width:100%;

  border:
    1px solid #ccc;

  background:white;

  color:#444;

  padding:13px;

  border-radius:10px;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

  margin-top:10px;
}


/* =========================
   STATUS
========================= */

.status{

  text-align:center;

  font-size:14px;

  min-height:20px;

  margin-top:12px;
}


/* =========================
   LOADING
========================= */

.loading{

  text-align:center;

  padding:50px 10px;

  color:#666;
}

</style>

</head>

<body>


<!-- =========================
     FIXED TOP
========================= -->

<div class="topbar">

  <a
    href="index.html"
    class="back-btn"
  >
    ‹
  </a>

  <div class="top-title">
    My Profile
  </div>

  <div class="top-space"></div>

</div>


<!-- =========================
     SCROLL ONLY
========================= -->

<div class="scroll-area">

  <div
    id="loadingBox"
    class="loading"
  >
    Profile লোড হচ্ছে...
  </div>


  <div
    id="profileCard"
    class="profile-card"
    style="display:none;"
  >


    <!-- PROFILE PHOTO -->

    <div class="avatar-area">

      <img
        id="viewAvatar"
        class="avatar"
        style="display:none;"

      >

      <div
        id="viewDefaultAvatar"
        class="default-avatar"

        👤
      </div>

    </div>


    <!-- NAME -->

    <div class="info-row">

      <div class="info-label">
        Name
      </div>

      <div
        id="viewName"
        class="info-value"
      >
        -
      </div>

    </div>


    <!-- USERNAME -->

    <div class="info-row">

      <div class="info-label">
        Username
      </div>

      <div
        id="viewUsername"
        class="info-value"
      >
        -
      </div>

    </div>


    <!-- PHONE -->

    <div class="info-row">

      <div class="info-label">
        Phone
      </div>

      <div
        id="viewPhone"
        class="info-value"
      >
        -
      </div>

    </div>


    <!-- EMAIL -->

    <div class="info-row">

      <div class="info-label">
        Email
      </div>

      <div
        id="viewEmail"
        class="info-value"
      >
        -
      </div>

    </div>


    <!-- ADDRESS -->

    <div class="info-row">

      <div class="info-label">
        Address
      </div>

      <div
        id="viewAddress"
        class="info-value"
      >
        -
      </div>

    </div>


    <!-- BIO -->

    <div class="bio-box">

      <div class="bio-label">
        Bio
      </div>

      <div
        id="viewBio"
        class="bio-text"
      >
        -
      </div>

    </div>


    <!-- EDIT -->

</div>


<!-- =========================
     FIXED BOTTOM
========================= -->

<div class="bottom-nav">

  <button
    class="nav-btn"
    onclick="goHome()"
  >

    <span class="nav-icon">

    </span>

    Home

  </button>


  <button
    class="nav-btn"
    onclick="goChat()"
  >

    <span class="nav-icon">
      💬
    </span>

    Chat

  </button>


  <button
    class="nav-btn active"
  >

    <span class="nav-icon">

    </span>

    Profile

  </button>

</div>


<!-- =========================
     EDIT MODAL
========================= -->

<div
  id="editModal"
  class="modal"
  onclick="closeModalOutside(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >


    <div class="modal-header">

      <div class="modal-title">
        ✏️ Edit Profile
      </div>

      <button
        class="modal-close"
        onclick="closeEditModal()"
      >

      </button>

    </div>


    <!-- PHOTO -->

    <div class="edit-photo-area">

      <img
        id="editAvatar"
        class="edit-avatar"
        style="display:none;"
        alt="Profile"
      >

      <div
        id="editDefaultAvatar"
        class="default-avatar"
        style="

          height:110px;
          margin:auto;
          font-size:45px;
        "
      >
        👤
      </div>

      <br>

      <label
        for="photoInput"

      >
        🖼️ Change Photo
      </label>

      <input
        type="file"
        id="photoInput"

      >

    </div>


    <!-- NAME -->

    <div class="field">

      <label>
        Name
      </label>

      <input
        id="nameInput"
        type="text"
        placeholder="আপনার নাম"

    </div>


    <!-- USERNAME -->

    <div class="field">

      <label>
        Username
      </label>

        id="usernameInput"

    </div>


    <!-- PHONE -->

    <div class="field">

      <label>
        Phone
      </label>

        placeholder="01XXXXXXXXX"
      >

    </div>


    <!-- EMAIL -->

    <div class="field">

      <label>
        Email
      </label>

      <input
        id="emailInput"
        type="email"

      >

    </div>


    <!-- ADDRESS -->

    <div class="field">

      <label>
        Address
      </label>

      <textarea
        id="addressInput"
        placeholder="আপনার ঠিকানা"
      ></textarea>

    </div>


    <!-- BIO -->

    <div class="field">

      <label>
        Bio
      </label>

      <textarea
        id="bioInput"
        placeholder="আপনার সম্পর্কে কিছু লিখুন..."
      ></textarea>

    <button
      id="saveButton"
      class="save-btn"
      onclick="saveProfile()"
    >
      💾 Save
    </button>


    <button

      onclick="closeEditModal()"
    >
      Cancel
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>


<script>

/* ===============================
   SUPABASE
================================ */

const SUPABASE_URL =
  "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const STORAGE_BUCKET =
  "avatars";


let currentUser = null;

let currentProfile = null;

let selectedPhoto = null;


/* ===============================
   START
================================ */

window.addEventListener(
  "load",
  loadProfile
);


/* ===============================
   LOAD PROFILE
================================ */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if(error){

      throw error;
    }


    currentUser =
      data.user;


    if(!currentUser){

      window.location.href =
        "index.html";

      return;
    }


    const {
      data:profile,
      error:profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          username,
          full_name,
          avatar_url,
          bio,
          phone,
          address
        `)
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if(profileError){

      throw profileError;
    }


    if(!profile){

      throw new Error(
        "Profile record পাওয়া যায়নি।"
      );
    }


    currentProfile =
      profile;


    renderProfile();


    fillEditForm();


    document.getElementById(
      "loadingBox"
    ).style.display =
      "none";


    document.getElementById(
      "profileCard"
    ).style.display =
      "block";


  }catch(error){

    console.error(
      "PROFILE LOAD ERROR:",
      error
    );


    document.getElementById(
      "loadingBox"
    ).innerHTML =
      "Profile লোড করতে সমস্যা হয়েছে:<br><br>" +
      error.message;
  }
}


/* ===============================
   RENDER PROFILE
================================ */

function renderProfile(){

  const p =
    currentProfile;


  document.getElementById(
    "viewName"
  ).textContent =
    p.full_name ||
    "নাম দেওয়া হয়নি";


  document.getElementById(
    "viewUsername"
  ).textContent =
    p.username
      ? "@" + p.username
      : "Username দেওয়া হয়নি";


  document.getElementById(
    "viewPhone"
  ).textContent =
    p.phone ||
    "Phone দেওয়া হয়নি";


  document.getElementById(
    "viewEmail"
  ).textContent =
    currentUser.email ||
    "Email নেই";


  document.getElementById(
    "viewAddress"
  ).textContent =
    p.address ||
    "ঠিকানা দেওয়া হয়নি";


  document.getElementById(
    "viewBio"
  ).textContent =
    p.bio ||
    "কোনো Bio দেওয়া হয়নি";


  setAvatar(
    "viewAvatar",
    "viewDefaultAvatar",
    p.avatar_url
  );
}


/* ===============================
   FILL EDIT FORM
================================ */

function fillEditForm(){

  const p =
    currentProfile;


  document.getElementById(
    "nameInput"
  ).value =
    p.full_name || "";


  document.getElementById(
    "usernameInput"
  ).value =
    p.username || "";


  document.getElementById(
    "phoneInput"
  ).value =
    p.phone || "";


  document.getElementById(
    "emailInput"
  ).value =
    currentUser.email || "";


  document.getElementById(
    "addressInput"
  ).value =
    p.address || "";


  document.getElementById(
    "bioInput"
  ).value =
    p.bio || "";


  setAvatar(
    "editAvatar",
    "editDefaultAvatar",
    p.avatar_url
  );
}


/* ===============================
   AVATAR
================================ */

function setAvatar(
  imageId,
  defaultId,
  url
){

  const image =
    document.getElementById(
      imageId
    );

  const defaultAvatar =
    document.getElementById(
      defaultId
    );


  if(url){

    image.src =
      url;

    image.style.display =
      "inline-block";

    defaultAvatar.style.display =
      "none";

  }else{

    image.style.display =
      "none";

    defaultAvatar.style.display =
      "flex";
  }
}


/* ===============================
   OPEN MODAL
================================ */

function openEditModal(){

  fillEditForm();

  selectedPhoto =
    null;

  document.getElementById(
    "photoInput"
  ).value =
    "";


  document.getElementById(
    "status"
  ).textContent =
    "";


  document.getElementById(
    "editModal"
  ).classList.add(
    "show"
  );


  document.body.style.overflow =
    "hidden";
}


/* ===============================
   CLOSE MODAL
================================ */

function closeEditModal(){

  document.getElementById(
    "editModal"
  ).classList.remove(
    "show"
  );


  document.body.style.overflow =
    "hidden";


  selectedPhoto =
    null;


  document.getElementById(
    "photoInput"
  ).value =
    "";
}


/* ===============================
   OUTSIDE MODAL
================================ */

function closeModalOutside(event){

  if(
    event.target.id ===
    "editModal"
  ){

    closeEditModal();
  }
}


/* ===============================
   PHOTO SELECT
================================ */

document.getElementById(
  "photoInput"
).addEventListener(
  "change",
  function(event){

    const file =
      event.target.files?.[0];


    if(!file){

      selectedPhoto =
        null;

      return;
    }


    if(
      !file.type ||
      !file.type.startsWith(
        "image/"
      )
    ){

      showStatus(
        "শুধু ছবি নির্বাচন করুন।",
        "red"
      );

      event.target.value =
        "";

      selectedPhoto =
        null;

      return;
    }


    if(
      file.size >
      6 * 1024 * 1024
    ){

      showStatus(
        "ছবির সাইজ ৬ MB-এর বেশি হতে পারবে না।",
        "red"
      );

      event.target.value =
        "";

      selectedPhoto =
        null;

      return;
    }


    selectedPhoto =
      file;


    const previewURL =
      URL.createObjectURL(
        file
      );


    setAvatar(
      "editAvatar",
      "editDefaultAvatar",
      previewURL
    );

  }
);


/* ===============================
   SAVE PROFILE
================================ */

async function saveProfile(){

  if(!currentUser){

    showStatus(
      "আপনি লগইন করা নেই।",
      "red"
    );

    return;
  }


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Saving...";


  try{

    const fullName =
      document.getElementById(
        "nameInput"
      ).value.trim();


    const username =
      document.getElementById(
        "usernameInput"
      ).value.trim();


    const phone =
      document.getElementById(
        "phoneInput"
      ).value.trim();


    const address =
      document.getElementById(
        "addressInput"
      ).value.trim();


    const bio =
      document.getElementById(
        "bioInput"
      ).value.trim();


    let avatarURL =
      currentProfile.avatar_url ||
      null;


    /* =========================
       PHOTO UPLOAD
    ========================== */

    if(selectedPhoto){

      const ext =
        (
          selectedPhoto.name
            .split(".")
            .pop() ||
          "jpg"
        ).toLowerCase();


      const filePath =
        currentUser.id +
        "/profile-" +
        Date.now() +
        "-" +
        crypto.randomUUID() +
        "." +
        ext;


      const {
        error:uploadError
      } =
        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .upload(
            filePath,
            selectedPhoto,
            {
              cacheControl:
                "3600",

              contentType:
                selectedPhoto.type,

              upsert:false
            }
          );


      if(uploadError){

        throw uploadError;
      }


      const {
        data:publicData
      } =
        supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .getPublicUrl(
            filePath
          );


      avatarURL =
        publicData.publicUrl;
    }


    /* =========================
       UPDATE PROFILE
    ========================== */

    const updateData = {

      full_name:
        fullName || null,

      username:
        username || null,

      phone:
        phone || null,

      address:
        address || null,

      bio:
        bio || null,

      updated_at:
        new Date().toISOString()
    };


    if(avatarURL){

      updateData.avatar_url =
        avatarURL;
    }


    const {
      data:updatedProfile,
      error:updateError
    } =
      await supabaseClient
        .from("profiles")
        .update(
          updateData
        )
        .eq(
          "id",
          currentUser.id
        )
        .select(`
          id,
          username,
          full_name,
          avatar_url,
          bio,
          phone,
          address
        `)
        .single();


    if(updateError){

      throw updateError;
    }


    currentProfile =
      updatedProfile;


    /* =========================
       UPDATE PAGE
    ========================== */

    renderProfile();

    fillEditForm();


    selectedPhoto =
      null;


    document.getElementById(
      "photoInput"
    ).value =
      "";


    showStatus(
      "Profile সফলভাবে Save হয়েছে।",
      "green"
    );


    setTimeout(
      () => {

        closeEditModal();

      },
      600
    );


  }catch(error){

    console.error(
      "PROFILE UPDATE ERROR:",
      error
    );


    showStatus(
      "❌ Profile Update করতে সমস্যা হয়েছে: " +
      (
        error?.message ||
        "Unknown error"
      ),
      "red"
    );


  }finally{

    saveButton.disabled =
      false;

    saveButton.textContent =
      "💾 Save";
  }
}


/* ===============================
   STATUS
================================ */

function showStatus(
  message,
  color
){

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.style.color =
    color === "green"
      ? "#16803c"
      : "#d93025";
}


/* ===============================
   LOGOUT
================================ */

async function logout(){

  const {
    error
  } =
    await supabaseClient
      .auth
      .signOut();


  if(error){

    alert(
      "Logout করতে সমস্যা হয়েছে:\n" +
      error.message
    );

    return;
  }


  window.location.href =
    "index.html";
}

================================ */

function goHome(){

  window.location.href =

}


function goChat(){

  window.location.href =
    "chat.html";
}
