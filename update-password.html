<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA | Update Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#075e54,#128c7e);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:#fff;
    border-radius:24px;
    padding:32px 24px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.logo{
    width:72px;
    height:72px;
    margin:0 auto 16px;
    border-radius:20px;
    background:#075e54;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.title{
    text-align:center;
    color:#075e54;
    font-size:27px;
    font-weight:800;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin:8px 0 28px;
}

.group{margin-bottom:17px}

label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
}

.password-box{position:relative}

input{
    width:100%;
    height:50px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:0 50px 0 14px;
    font-size:15px;
    outline:none;
    background:#fafafa;
}

input:focus{
    border-color:#128c7e;
    background:#fff;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    font-size:20px;
    cursor:pointer;
}

.btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:#075e54;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.btn:disabled{
    opacity:.65;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:#fff0f0;
    color:#d93025;
}

.success{
    background:#eaf8f2;
    color:#087f5b;
}

.footer{
    text-align:center;
    color:#eee;
    font-size:12px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">RZ</div>

<div class="title">New Password</div>

<div class="subtitle">
Create a new password for your RAZTARA account.
</div>

<form id="passwordForm">

<div class="group">

<label>New Password</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Minimum 6 characters"
    minlength="6"
    required
>

<button
    type="button"
    class="eye"
    onclick="togglePassword('password',this)"
>👁</button>

</div>
</div>


<div class="group">

<label>Confirm Password</label>

<div class="password-box">

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm new password"
    required
>

<button
    type="button"
    class="eye"
    onclick="togglePassword('confirmPassword',this)"
>👁</button>

</div>
</div>


<button
    type="submit"
    class="btn"
    id="updateBtn"
>
UPDATE PASSWORD
</button>


<div id="message" class="message"></div>

</form>

</div>

<div class="footer">
© 2026 RAZTARA • Connect • Call • Share
</div>

</div>


<script>

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function togglePassword(id,button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        button.textContent = "🙈";

    }else{

        input.type = "password";
        button.textContent = "👁";

    }
}


supabaseClient.auth.onAuthStateChange(
    async function(event){

        if(event === "PASSWORD_RECOVERY"){

            console.log("Password recovery session ready.");

        }

    }
);


document
.getElementById("passwordForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;

    const button =
        document.getElementById("updateBtn");

    const message =
        document.getElementById("message");


    message.style.display = "none";


    if(password.length < 6){

        message.className =
            "message error";

        message.textContent =
            "Password must be at least 6 characters.";

        message.style.display = "block";

        return;
    }


    if(password !== confirmPassword){

        message.className =
            "message error";

        message.textContent =
            "Passwords do not match.";

        message.style.display = "block";

        return;
    }


    button.disabled = true;
    button.textContent = "UPDATING...";


    const {error} =
        await supabaseClient.auth
        .updateUser({
            password:password
        });


    if(error){

        message.className =
            "message error";

        message.textContent =
            error.message;

        message.style.display = "block";

        button.disabled = false;
        button.textContent = "UPDATE PASSWORD";

        return;
    }


    message.className =
        "message success";

    message.textContent =
        "Password updated successfully. Please login again.";

    message.style.display = "block";


    await supabaseClient.auth.signOut();


    setTimeout(function(){

        window.location.href =
            "login.html";

    },1500);

});

</script>

</body>
</html>
