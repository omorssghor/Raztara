<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAZTARA - New Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#07131a;
    color:#fff;
}

.box{
    width:100%;
    max-width:410px;
    padding:30px 23px;
    border-radius:25px;
    background:#0a1c24;
    border:1px solid #1c3741;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.icon{
    width:70px;
    height:70px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    background:linear-gradient(135deg,#00d4a5,#008fa8);
    font-size:32px;
    font-weight:800;
}

h1{
    margin-top:15px;
    font-size:25px;
    letter-spacing:2px;
}

.sub{
    margin-top:7px;
    color:#8299a1;
    font-size:13px;
}

.group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#b7c9ce;
    font-size:13px;
}

.inputBox{
    position:relative;
}

input{
    width:100%;
    height:54px;
    padding:0 48px 0 15px;
    border-radius:14px;
    border:1px solid #24404a;
    outline:none;
    background:#10252e;
    color:#fff;
}

input:focus{
    border-color:#00d4a5;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    width:auto;
    height:auto;
    margin:0;
    padding:5px;
    border:0;
    background:none;
    color:#8ca4ac;
    font-size:20px;
}

.save{
    width:100%;
    height:54px;
    margin-top:5px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#00e0ad,#00aebd);
    color:#001510;
    font-weight:800;
}

.message{
    display:none;
    margin-bottom:16px;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
}

.success{
    display:block;
    color:#75efd4;
    background:rgba(0,212,165,.10);
    border:1px solid rgba(0,212,165,.25);
}

.error{
    display:block;
    color:#ff9b9b;
    background:rgba(255,70,70,.10);
    border:1px solid rgba(255,70,70,.25);
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        <div class="icon">R</div>
        <h1>RAZTARA</h1>
        <div class="sub">Create a new password</div>
    </div>

    <div id="message" class="message"></div>

    <div class="group">

        <label>New Password</label>

        <div class="inputBox">

            <input
                id="password"
                type="password"
                placeholder="নতুন Password"
            >

            <button
                class="eye"
                type="button"
                onclick="togglePassword('password','eye1')"
                id="eye1"
            >
                👁️
            </button>

        </div>

    </div>


    <div class="group">

        <label>Confirm Password</label>

        <div class="inputBox">

            <input
                id="confirmPassword"
                type="password"
                placeholder="Password আবার লিখুন"
            >

            <button
                class="eye"
                type="button"
                onclick="togglePassword('confirmPassword','eye2')"
                id="eye2"
            >
                👁️
            </button>

        </div>

    </div>


    <button
        class="save"
        id="saveBtn"
        onclick="updatePassword()"
    >
        SAVE NEW PASSWORD
    </button>

</div>

<script>

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* Password recovery session */

let recoveryReady = false;


/* Supabase recovery event */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if(event === "PASSWORD_RECOVERY"){

            recoveryReady = true;

            message(
                "আপনার নতুন Password সেট করুন।",
                "success"
            );
        }
    }
);


/* Check existing recovery session */

async function checkRecovery(){

    const { data } =
    await supabaseClient.auth.getSession();

    if(data && data.session){

        recoveryReady = true;

    }else{

        /*
          Supabase automatically processes
          the recovery link when the page loads.
        */

        setTimeout(async () => {

            const result =
            await supabaseClient.auth.getSession();

            if(result.data.session){

                recoveryReady = true;

            }

        },1000);
    }
}


/* Password show/hide */

function togglePassword(id,eyeId){

    const input =
    document.getElementById(id);

    const eye =
    document.getElementById(eyeId);

    if(input.type === "password"){

        input.type = "text";

        eye.textContent = "🙈";

    }else{

        input.type = "password";

        eye.textContent = "👁️";
    }
}


/* Message */

function message(text,type){

    const box =
    document.getElementById("message");

    box.textContent = text;

    box.className =
    "message " + type;
}


/* Update password */

async function updatePassword(){

    const password =
    document.getElementById("password")
    .value;

    const confirmPassword =
    document.getElementById("confirmPassword")
    .value;

    const btn =
    document.getElementById("saveBtn");


    if(password.length < 6){

        message(
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",
            "error"
        );

        return;
    }


    if(password !== confirmPassword){

        message(
            "দুইটি Password একই নয়।",
            "error"
        );

        return;
    }


    btn.disabled = true;

    btn.textContent = "Saving...";


    const { error } =
    await supabaseClient.auth.updateUser({
        password: password
    });


    if(error){

        btn.disabled = false;

        btn.textContent =
        "SAVE NEW PASSWORD";

        message(
            error.message,
            "error"
        );

        return;
    }


    message(
        "Password সফলভাবে পরিবর্তন হয়েছে। এখন Login করুন।",
        "success"
    );


    await supabaseClient.auth.signOut();


    setTimeout(() => {

        window.location.href =
        "index.html";

    },1800);
}


checkRecovery();

</script>

</body>
</html>
