<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#087f5b">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="RAZTARA"
>

<title>RAZTARA</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#087f5b;
}

.app{
  width:100%;
  height:100%;
  min-height:100dvh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:white;
  text-align:center;

  padding:25px;
}

.logo{
  width:110px;
  height:110px;

  border-radius:28px;

  background:white;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-bottom:25px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.20);
}

.logo span{
  font-size:40px;
  font-weight:bold;
  color:#087f5b;
}

h1{
  font-size:34px;
  letter-spacing:2px;
  margin-bottom:10px;
}

p{
  font-size:16px;
  opacity:.9;
  margin-bottom:30px;
}

button{
  width:min(300px,90%);

  border:0;
  border-radius:14px;

  padding:15px 25px;

  background:white;
  color:#087f5b;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 8px 20px rgba(0,0,0,.18);
}

button:active{
  transform:scale(.97);
}

.status{
  margin-top:20px;
  font-size:13px;
  opacity:.8;
}

</style>
</head>

<body>

<div class="app">

  <div class="logo">
    <span>R</span>
  </div>

  <h1>RAZTARA</h1>

  <p>Connect • Chat • Call • Share</p>

  <button onclick="openRAZTARA()">
    🚀 Open RAZTARA
  </button>

  <div class="status" id="status">
    RAZTARA প্রস্তুত হচ্ছে...
  </div>

</div>

<script>

const RAZTARA_URL =
  "https://omorssghor.github.io/Raztara/";

function openRAZTARA(){

  window.location.href = RAZTARA_URL;

}

setTimeout(function(){

  document.getElementById("status").textContent =
    "RAZTARA Ready";

},1200);

</script>

</body>
</html>
