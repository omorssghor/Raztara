<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RAZTARA — Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f3f6f8;
    color:#17212b;
    min-height:100vh;
}

button{
    font:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:20;
    height:64px;
    background:#087f5b;
    color:white;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 14px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:30px;
    line-height:1;
    cursor:pointer;
}

.header-info{
    min-width:0;
    flex:1;
}

.header-title{
    font-size:19px;
    font-weight:700;
}

.header-subtitle{
    font-size:12px;
    opacity:.85;
    margin-top:2px;
}

.delete-all-btn{
    border:0;
    background:#b42318;
    color:white;
    border-radius:10px;
    padding:9px 11px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.page{
    max-width:900px;
    margin:auto;
    padding:14px;
}

.profile-card{
    background:white;
    border-radius:16px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    margin-bottom:14px;
}

.profile-avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    object-fit:cover;
    background:#e5e7eb;
}

.profile-name{
    font-size:17px;
    font-weight:700;
}

.profile-status{
    font-size:12px;
    color:#6b7280;
    margin-top:3px;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    background:white;
    padding:8px;
    border-radius:15px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.tab{
    border:0;
    background:#f1f5f7;
    color:#475569;
    border-radius:10px;
    padding:10px 4px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
}

.tab.active{
    background:#087f5b;
    color:white;
}

.folder{
    display:none;
}

.folder.active{
    display:block;
}

.folder-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.folder-title{
    font-size:18px;
    font-weight:800;
}

.folder-count{
    font-size:12px;
    color:#64748b;
}

.media-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.media-card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    position:relative;
}

.media-preview{
    width:100%;
    aspect-ratio:1/1;
    background:#e8edf0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
}

.media-preview img,
.media-preview video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.file-preview{
    padding:18px;
    text-align:center;
    width:100%;
}

.file-icon{
    font-size:46px;
    margin-bottom:8px;
}

.file-name{
    font-size:13px;
    font-weight:700;
    word-break:break-word;
}

.audio-preview{
    width:100%;
    padding:20px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
}

.audio-icon{
    font-size:45px;
}

.audio-preview audio{
    width:95%;
}

.media-info{
    padding:9px;
}

.media-sender{
    font-size:11px;
    color:#64748b;
    margin-bottom:3px;
}

.media-time{
    font-size:10px;
    color:#94a3b8;
}

.media-actions{
    padding:0 9px 10px;
}

.delete-btn{
    width:100%;
    border:0;
    background:#fee2e2;
    color:#b42318;
    border-radius:9px;
    padding:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.empty{
    background:white;
    border-radius:15px;
    padding:35px 15px;
    text-align:center;
    color:#64748b;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.empty-icon{
    font-size:42px;
    margin-bottom:8px;
}

.loading{
    text-align:center;
    padding:35px;
    color:#64748b;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    font-size:13px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#17212b;
    color:white;
    padding:11px 16px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(0,0,0,.94);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.lightbox.show{
    display:flex;
}

.lightbox-content{
    max-width:100%;
    max-height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.lightbox-content img,
.lightbox-content video{
    max-width:100%;
    max-height:85vh;
    object-fit:contain;
}

.lightbox-close{
    position:absolute;
    right:15px;
    top:15px;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:25px;
    cursor:pointer;
}

@media(min-width:700px){
    .media-grid{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:420px){
    .delete-all-btn{
        padding:8px;
        font-size:11px;
    }

    .tabs{
        gap:5px;
    }

    .tab{
        font-size:11px;
        padding:9px 2px;
    }
}
</style>
</head>

<body>

<header class="header">

    <button class="back-btn" onclick="goBack()">‹</button>

    <div class="header-info">
        <div class="header-title">📁 Gallery</div>
        <div class="header-subtitle" id="headerSubtitle">
            ছবি, ভিডিও, ফাইল ও ভয়েস
        </div>
    </div>

    <button class="delete-all-btn" onclick="deleteAllMedia()">
        🗑️ সব মুছুন
    </button>

</header>

<main class="page">

    <div id="errorBox" class="error"></div>

    <div class="profile-card">
        <img id="profileAvatar" class="profile-avatar" alt="">

        <div>
            <div id="profileName" class="profile-name">লোড হচ্ছে...</div>
            <div id="profileStatus" class="profile-status">
                Gallery
            </div>
        </div>
    </div>

    <div class="tabs">

        <button class="tab active" data-type="image" onclick="switchTab('image')">
            🖼️ ছবি <span id="count-image">0</span>
        </button>

        <button class="tab" data-type="video" onclick="switchTab('video')">
            🎥 ভিডিও <span id="count-video">0</span>
        </button>

        <button class="tab" data-type="file" onclick="switchTab('file')">
            📄 ফাইল <span id="count-file">0</span>
        </button>

        <button class="tab" data-type="audio" onclick="switchTab('audio')">
            🎙️ ভয়েস <span id="count-audio">0</span>
        </button>

    </div>

    <section id="folder-image" class="folder active">

        <div class="folder-header">
            <div class="folder-title">🖼️ ছবি</div>
            <div id="folder-count-image" class="folder-count">0 টি</div>
        </div>

        <div id="grid-image"></div>

    </section>

    <section id="folder-video" class="folder">

        <div class="folder-header">
            <div class="folder-title">🎥 ভিডিও</div>
            <div id="folder-count-video" class="folder-count">0 টি</div>
        </div>

        <div id="grid-video"></div>

    </section>

    <section id="folder-file" class="folder">

        <div class="folder-header">
            <div class="folder-title">📄 ফাইল</div>
            <div id="folder-count-file" class="folder-count">0 টি</div>
        </div>

        <div id="grid-file"></div>

    </section>

    <section id="folder-audio" class="folder">

        <div class="folder-header">
            <div class="folder-title">🎙️ ভয়েস</div>
            <div id="folder-count-audio" class="folder-count">0 টি</div>
        </div>

        <div id="grid-audio"></div>

    </section>

</main>

<div id="toast" class="toast"></div>

<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <div id="lightboxContent" class="lightbox-content"></div>
</div>

<script>

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STORAGE_BUCKET = "chat-files";

let currentUser = null;
let otherUserId = null;
let conversationId = null;

let allMedia = {
    image: [],
    video: [],
    file: [],
    audio: []
};

let hiddenMessageIds = new Set();

let profileMap = {};

const params = new URLSearchParams(location.search);

otherUserId =
    params.get("user") ||
    params.get("id") ||
    "";


/* =========================
   BASIC UI
========================= */

function showError(message){

    const box = document.getElementById("errorBox");

    box.textContent = message;
    box.style.display = "block";
}

function hideError(){

    const box = document.getElementById("errorBox");

    box.textContent = "";
    box.style.display = "none";
}

function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer = setTimeout(()=>{
        toast.classList.remove("show");
    },2500);
}

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   BACK
========================= */

function goBack(){

    if(history.length > 1){
        history.back();
    }else{
        location.href =
            "chat.html?user=" +
            encodeURIComponent(otherUserId);
    }
}


/* =========================
   PROFILE
========================= */

async function loadOtherProfile(){

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url,
            online_visibility,
            last_seen_at
        `)
        .eq("id",otherUserId)
        .maybeSingle();

    if(error){
        throw error;
    }

    if(!data){
        throw new Error("User profile পাওয়া যায়নি।");
    }

    profileMap[data.id] = data;

    const name =
        data.full_name ||
        data.username ||
        "RAZTARA User";

    document.getElementById("profileName").textContent =
        name;

    document.getElementById("headerSubtitle").textContent =
        name + " — Gallery";

    const avatar =
        data.avatar_url ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name);

    document.getElementById("profileAvatar").src =
        avatar;

    document.getElementById("profileStatus").textContent =
        "এই conversation-এর media";
}


/* =========================
   FIND 1-TO-1 CONVERSATION
========================= */

async function findConversation(){

    const {data:myRows,error:myError} =
        await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq("user_id",currentUser.id);

    if(myError){
        throw myError;
    }

    if(!myRows || !myRows.length){
        return null;
    }

    const myConversationIds =
        myRows.map(row => row.conversation_id);

    const {data:otherRows,error:otherError} =
        await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq("user_id",otherUserId)
        .in("conversation_id",myConversationIds);

    if(otherError){
        throw otherError;
    }

    if(!otherRows || !otherRows.length){
        return null;
    }

    const possibleIds =
        otherRows.map(row => row.conversation_id);

    const {data:conversations,error:conversationError} =
        await supabaseClient
        .from("conversations")
        .select("id,is_group")
        .in("id",possibleIds)
        .eq("is_group",false);

    if(conversationError){
        throw conversationError;
    }

    if(!conversations || !conversations.length){
        return null;
    }

    return conversations[0].id;
}


/* =========================
   LOAD HIDDEN MESSAGES
========================= */

async function loadHiddenMessages(){

    const {data,error} =
        await supabaseClient
        .from("message_hidden")
        .select("message_id")
        .eq("user_id",currentUser.id);

    if(error){
        throw error;
    }

    hiddenMessageIds =
        new Set(
            (data || []).map(row => row.message_id)
        );
}


/* =========================
   LOAD MEDIA
========================= */

async function loadMedia(){

    allMedia = {
        image: [],
        video: [],
        file: [],
        audio: []
    };

    if(!conversationId){

        renderAll();

        return;
    }

    const {data,error} =
        await supabaseClient
        .from("messages")
        .select(`
            id,
            conversation_id,
            sender_id,
            content,
            message_type,
            file_url,
            created_at,
            deleted_for_everyone
        `)
        .eq("conversation_id",conversationId)
        .in("message_type",[
            "image",
            "video",
            "file",
            "audio"
        ])
        .eq("deleted_for_everyone",false)
        .not("file_url","is",null)
        .order("created_at",{ascending:false});

    if(error){
        throw error;
    }

    const visible =
        (data || []).filter(message => {

            if(!message.file_url){
                return false;
            }

            if(hiddenMessageIds.has(message.id)){
                return false;
            }

            return [
                "image",
                "video",
                "file",
                "audio"
            ].includes(message.message_type);
        });

    visible.forEach(message => {

        if(allMedia[message.message_type]){
            allMedia[message.message_type].push(message);
        }

    });

    await loadSenderProfiles(visible);

    renderAll();
}


/* =========================
   LOAD SENDERS
========================= */

async function loadSenderProfiles(messages){

    const ids = [
        ...new Set(
            messages.map(message => message.sender_id)
        )
    ];

    if(!ids.length){
        return;
    }

    const {data,error} =
        await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url
        `)
        .in("id",ids);

    if(error){
        throw error;
    }

    profileMap = {};

    (data || []).forEach(profile => {
        profileMap[profile.id] = profile;
    });
}


/* =========================
   FORMAT DATE
========================= */

function formatTime(dateValue){

    const date = new Date(dateValue);

    return date.toLocaleString(
        "bn-BD",
        {
            hour:"numeric",
            minute:"2-digit",
            day:"numeric",
            month:"short"
        }
    );
}


/* =========================
   FILE NAME
========================= */

function getFileName(url){

    try{

        const clean =
            String(url).split("?")[0];

        const parts =
            clean.split("/");

        return decodeURIComponent(
            parts[parts.length - 1] ||
            "RAZTARA File"
        );

    }catch(error){

        return "RAZTARA File";
    }
}


/* =========================
   RENDER
========================= */

function renderAll(){

    const types =
        ["image","video","file","audio"];

    types.forEach(type => {

        const list =
            allMedia[type] || [];

        document.getElementById(
            "count-" + type
        ).textContent = list.length;

        document.getElementById(
            "folder-count-" + type
        ).textContent =
            list.length + " টি";

        renderFolder(type,list);

    });
}


function renderFolder(type,list){

    const container =
        document.getElementById(
            "grid-" + type
        );

    if(!list.length){

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    ${getEmptyIcon(type)}
                </div>
                <div>
                    এই folder-এ এখনো কিছু নেই।
                </div>
            </div>
        `;

        return;
    }

    container.innerHTML = `
        <div class="media-grid">
            ${list.map(message =>
                renderMediaCard(type,message)
            ).join("")}
        </div>
    `;
}


function getEmptyIcon(type){

    if(type === "image") return "🖼️";
    if(type === "video") return "🎥";
    if(type === "file") return "📄";
    if(type === "audio") return "🎙️";

    return "📁";
}


/* =========================
   MEDIA CARD
========================= */

function renderMediaCard(type,message){

    const profile =
        profileMap[message.sender_id];

    const senderName =
        profile?.full_name ||
        profile?.username ||
        (
            message.sender_id === currentUser.id
            ? "আপনি"
            : "User"
        );

    let preview = "";

    if(type === "image"){

        preview = `
            <div
                class="media-preview"
                onclick="openImage('${escapeAttr(message.file_url)}')"
            >
                <img
                    src="${escapeAttr(message.file_url)}"
                    alt="RAZTARA image"
                    loading="lazy"
                >
            </div>
        `;

    }else if(type === "video"){

        preview = `
            <div
                class="media-preview"
                onclick="openVideo('${escapeAttr(message.file_url)}')"
            >
                <video
                    src="${escapeAttr(message.file_url)}"
                    muted
                    playsinline
                    preload="metadata"
                ></video>
            </div>
        `;

    }else if(type === "audio"){

        preview = `
            <div class="audio-preview">

                <div class="audio-icon">
                    🎙️
                </div>

                <audio
                    controls
                    preload="metadata"
                    src="${escapeAttr(message.file_url)}"
                ></audio>

            </div>
        `;

    }else{

        const fileName =
            getFileName(message.file_url);

        preview = `
            <div
                class="media-preview"
                onclick="openFile('${escapeAttr(message.file_url)}')"
            >
                <div class="file-preview">

                    <div class="file-icon">
                        📄
                    </div>

                    <div class="file-name">
                        ${escapeHtml(fileName)}
                    </div>

                </div>
            </div>
        `;
    }

    return `
        <article class="media-card">

            ${preview}

            <div class="media-info">

                <div class="media-sender">
                    ${escapeHtml(senderName)}
                </div>

                <div class="media-time">
                    ${escapeHtml(
                        formatTime(message.created_at)
                    )}
                </div>

            </div>

            <div class="media-actions">

                <button
                    class="delete-btn"
                    onclick="deleteForMe('${message.id}')"
                >
                    🗑️ আমার Gallery থেকে মুছুন
                </button>

            </div>

        </article>
    `;
}


function escapeAttr(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}


/* =========================
   DELETE ONE — ONLY ME
========================= */

async function deleteForMe(messageId){

    const confirmed =
        confirm(
            "এই media শুধু আপনার Gallery থেকে মুছে যাবে। অন্য ব্যক্তির Gallery-তে থাকবে।\n\nমুছবেন?"
        );

    if(!confirmed){
        return;
    }

    const {error} =
        await supabaseClient
        .from("message_hidden")
        .insert({
            message_id:messageId,
            user_id:currentUser.id
        });

    if(error){

        /*
         * একই message আগে থেকেই hidden থাকলে
         * Gallery-তে থাকার কথা নয়।
         * তাই duplicate হলে শুধু reload করা হবে।
         */
        if(
            !String(error.message || "")
            .toLowerCase()
            .includes("duplicate")
        ){

            showError(
                "Media মুছতে সমস্যা হয়েছে: " +
                error.message
            );

            return;
        }
    }

    hiddenMessageIds.add(messageId);

    removeFromLocalLists(messageId);

    renderAll();

    showToast(
        "শুধু আপনার Gallery থেকে media মুছে গেছে।"
    );
}


function removeFromLocalLists(messageId){

    Object.keys(allMedia).forEach(type => {

        allMedia[type] =
            allMedia[type].filter(
                message => message.id !== messageId
            );

    });
}


/* =========================
   DELETE ALL — ONLY ME
========================= */

async function deleteAllMedia(){

    const allMessages = [
        ...allMedia.image,
        ...allMedia.video,
        ...allMedia.file,
        ...allMedia.audio
    ];

    if(!allMessages.length){

        showToast("Gallery-তে মুছার মতো কিছু নেই।");

        return;
    }

    const confirmed =
        confirm(
            "Gallery-এর সব ছবি, ভিডিও, ফাইল ও ভয়েস শুধু আপনার ID থেকে মুছে যাবে।\n\nঅন্য ব্যক্তির Gallery থেকে কিছুই মুছবে না।\n\nসব মুছবেন?"
        );

    if(!confirmed){
        return;
    }

    let successCount = 0;
    let failedCount = 0;

    /*
     * message_hidden-এ unique constraint নেই।
     * তাই upsert নয়, একে একে INSERT করছি।
     */
    for(const message of allMessages){

        const {error} =
            await supabaseClient
            .from("message_hidden")
            .insert({
                message_id:message.id,
                user_id:currentUser.id
            });

        if(error){

            const errorText =
                String(error.message || "")
                .toLowerCase();

            /*
             * duplicate হলে আগে থেকেই hidden ধরা হবে।
             */
            if(errorText.includes("duplicate")){
                successCount++;
            }else{
                failedCount++;
            }

        }else{

            successCount++;
        }

    }

    if(failedCount > 0){

        showError(
            successCount +
            " টি media hide হয়েছে, কিন্তু " +
            failedCount +
            " টি hide করা যায়নি।"
        );

    }else{

        showToast(
            "আপনার Gallery-এর সব media মুছে গেছে।"
        );
    }

    hiddenMessageIds = new Set(
        allMessages.map(message => message.id)
    );

    allMedia = {
        image:[],
        video:[],
        file:[],
        audio:[]
    };

    renderAll();
}


/* =========================
   TABS
========================= */

function switchTab(type){

    document.querySelectorAll(".tab")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.type === type
            );

        });

    document.querySelectorAll(".folder")
        .forEach(folder => {

            folder.classList.remove("active");

        });

    const folder =
        document.getElementById(
            "folder-" + type
        );

    if(folder){
        folder.classList.add("active");
    }
}


/* =========================
   LIGHTBOX
========================= */

function openImage(url){

    const lightbox =
        document.getElementById("lightbox");

    const content =
        document.getElementById("lightboxContent");

    content.innerHTML = `
        <img
            src="${escapeAttr(url)}"
            alt="RAZTARA"
        >
    `;

    lightbox.classList.add("show");
}


function openVideo(url){

    const lightbox =
        document.getElementById("lightbox");

    const content =
        document.getElementById("lightboxContent");

    content.innerHTML = `
        <video
            src="${escapeAttr(url)}"
            controls
            autoplay
            playsinline
        ></video>
    `;

    lightbox.classList.add("show");
}


function openFile(url){

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


function closeLightbox(event){

    if(
        event &&
        event.target &&
        event.target.closest(".lightbox-content")
    ){
        return;
    }

    document
        .getElementById("lightbox")
        .classList.remove("show");

    document
        .getElementById("lightboxContent")
        .innerHTML = "";
}


/* =========================
   ESCAPE
========================= */

document.addEventListener("keydown",event => {

    if(event.key === "Escape"){
        closeLightbox();
    }

});


/* =========================
   INITIALIZE
========================= */

async function init(){

    try{

        hideError();

        if(!otherUserId){

            showError(
                "Gallery খুলতে User ID পাওয়া যায়নি।"
            );

            return;
        }

        const {
            data:{
                user
            },
            error:authError
        } =
            await supabaseClient.auth.getUser();

        if(authError){
            throw authError;
        }

        if(!user){

            showError(
                "আপনি Login করা অবস্থায় নেই।"
            );

            return;
        }

        currentUser = user;

        if(currentUser.id === otherUserId){

            showError(
                "নিজের সাথে Gallery খোলা যাবে না।"
            );

            return;
        }

        await loadOtherProfile();

        await loadHiddenMessages();

        conversationId =
            await findConversation();

        await loadMedia();

    }catch(error){

        console.error(
            "Gallery init error:",
            error
        );

        showError(
            "Gallery লোড করতে সমস্যা হয়েছে: " +
            (error.message || "Unknown error")
        );

    }

}

init();

</script>
