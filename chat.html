<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RAZTARA Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:#eef2f3;
    color:#102b34;
}

/* =========================
   HEADER
========================= */

.chatHeader{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:7px 10px;
    gap:9px;
    z-index:1000;
    box-shadow:0 1px 4px rgba(0,0,0,.18);
}

.backBtn,
.callBtn,
.moreBtn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.backBtn{
    font-size:30px;
}

.callBtn{
    font-size:21px;
}

.moreBtn{
    font-size:24px;
}

.chatAvatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
    flex-shrink:0;
}

.chatUserInfo{
    flex:1;
    min-width:0;
}

.chatUserName{
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chatUserStatus{
    font-size:11px;
    opacity:.9;
    margin-top:3px;
    white-space:nowrap;
}

/* =========================
   MESSAGE AREA
========================= */

.messages{
    position:fixed;
    top:62px;
    bottom:66px;
    left:0;
    right:0;
    overflow-y:auto;
    padding:12px 10px 15px;
    -webkit-overflow-scrolling:touch;
    background:
        linear-gradient(
            rgba(238,242,243,.92),
            rgba(238,242,243,.92)
        );
}

.dateSeparator{
    display:flex;
    justify-content:center;
    margin:9px 0 12px;
}

.dateSeparator span{
    background:#d9e5e2;
    color:#52645f;
    padding:5px 11px;
    border-radius:12px;
    font-size:11px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
}

.message{
    max-width:82%;
    padding:7px 9px 5px;
    margin-bottom:7px;
    border-radius:12px;
    font-size:15px;
    line-height:1.38;
    word-break:break-word;
    position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.06);
}

.message.me{
    margin-left:auto;
    background:#d9fdd3;
    border-bottom-right-radius:3px;
}

.message.other{
    margin-right:auto;
    background:white;
    border-bottom-left-radius:3px;
}

.messageContent{
    display:block;
}

.messageText{
    white-space:pre-wrap;
}

.messageTime{
    font-size:10px;
    color:#71807c;
    margin-top:4px;
    text-align:right;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:3px;
}

.seenIcon{
    font-size:13px;
    line-height:10px;
    color:#6d7a76;
}

.seenIcon.seen{
    color:#1689d7;
}

/* =========================
   IMAGE
========================= */

.chatImage{
    display:block;
    width:auto;
    max-width:250px;
    max-height:310px;
    border-radius:9px;
    cursor:pointer;
    object-fit:cover;
}

/* =========================
   VIDEO
========================= */

.chatVideo{
    display:block;
    width:250px;
    max-width:100%;
    max-height:320px;
    border-radius:9px;
}

/* =========================
   FILE
========================= */

.fileBox{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:190px;
    max-width:270px;
    padding:8px;
    background:rgba(255,255,255,.65);
    border-radius:9px;
}

.fileIcon{
    font-size:28px;
}

.fileInfo{
    min-width:0;
}

.fileName{
    font-weight:bold;
    color:#075e54;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.fileOpen{
    font-size:11px;
    color:#777;
    margin-top:2px;
}

/* =========================
   AUDIO
========================= */

.audioMessage{
    width:230px;
    max-width:100%;
}

/* =========================
   EMPTY
========================= */

.emptyChat{
    text-align:center;
    color:#777;
    margin-top:35vh;
    font-size:14px;
}

/* =========================
   INPUT
========================= */

.chatInputArea{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:66px;
    background:#f0f2f5;
    border-top:1px solid #d7dddd;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px;
    z-index:1000;
}

.attachBtn,
.voiceBtn,
.sendBtn{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size:19px;
}

.attachBtn,
.voiceBtn{
    background:white;
}

.sendBtn{
    background:#075e54;
    color:white;
}

.messageInput{
    flex:1;
    min-width:0;
    height:43px;
    border:0;
    outline:none;
    border-radius:22px;
    padding:0 15px;
    font-size:15px;
    background:white;
}

/* =========================
   ATTACHMENT PREVIEW
========================= */

.previewArea{
    position:fixed;
    left:8px;
    right:8px;
    bottom:73px;
    background:white;
    border-radius:12px;
    padding:9px;
    box-shadow:0 2px 12px rgba(0,0,0,.18);
    z-index:999;
    display:none;
}

.previewTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

.previewTitle{
    font-weight:bold;
    font-size:13px;
}

.previewClose{
    border:0;
    background:#eee;
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
}

.previewContent{
    max-height:170px;
    overflow:auto;
}

.previewImage{
    max-width:170px;
    max-height:140px;
    border-radius:8px;
}

.previewVideo{
    max-width:220px;
    max-height:140px;
    border-radius:8px;
}

/* =========================
   MENU
========================= */

.menuOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.28);
    z-index:1500;
    display:none;
}

.chatMenu{
    position:absolute;
    top:55px;
    right:8px;
    width:190px;
    background:white;
    border-radius:9px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,.2);
}

.menuItem{
    width:100%;
    border:0;
    background:white;
    text-align:left;
    padding:13px 15px;
    font-size:14px;
    cursor:pointer;
}

.menuItem:hover{
    background:#f1f5f4;
}

.menuItem.danger{
    color:#c62828;
}

/* =========================
   LONG PRESS MENU
========================= */

.messageMenu{
    position:fixed;
    z-index:2000;
    background:white;
    border-radius:9px;
    box-shadow:0 4px 18px rgba(0,0,0,.25);
    overflow:hidden;
    display:none;
}

.messageMenu button{
    border:0;
    background:white;
    padding:12px 18px;
    font-size:14px;
    cursor:pointer;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:9px 15px;
    border-radius:18px;
    font-size:12px;
    z-index:3000;
    display:none;
    max-width:85%;
    text-align:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .message{
        max-width:86%;
    }

    .chatImage{
        max-width:220px;
    }

    .chatVideo{
        width:220px;
    }

    .messageInput{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="chatHeader">

    <button
        class="backBtn"
        type="button"
        onclick="goBack()"
        aria-label="Back"
    >‹</button>

    <img
        id="chatAvatar"
        class="chatAvatar"
        src="https://i.pravatar.cc/100?img=1"
        alt="Profile"
    >

    <div class="chatUserInfo">

        <div
            id="chatUserName"
            class="chatUserName"
        >
            Chat
        </div>

        <div
            id="chatUserStatus"
            class="chatUserStatus"
        >
            Offline
        </div>

    </div>

    <button
        class="callBtn"
        type="button"
        onclick="startCall()"
        aria-label="Call"
    >📞</button>

    <button
        class="moreBtn"
        type="button"
        onclick="toggleChatMenu(event)"
        aria-label="More"
    >⋮</button>

</header>


<!-- =========================
     MESSAGES
========================= -->

<main
    id="messages"
    class="messages"
>

    <div
        id="emptyChat"
        class="emptyChat"
    >
        কোনো মেসেজ নেই
    </div>

</main>


<!-- =========================
     PREVIEW
========================= -->

<div
    id="previewArea"
    class="previewArea"
>

    <div class="previewTop">

        <div
            id="previewTitle"
            class="previewTitle"
        >
            Attachment
        </div>

        <button
            class="previewClose"
            type="button"
            onclick="clearAttachment()"
        >
            ✕
        </button>

    </div>

    <div
        id="previewContent"
        class="previewContent"
    ></div>

</div>


<!-- =========================
     INPUT
========================= -->

<div class="chatInputArea">

    <button
        class="attachBtn"
        type="button"
        onclick="chooseAttachment()"
    >
        📎
    </button>

    <input
        id="messageInput"
        class="messageInput"
        type="text"
        placeholder="Message"
        autocomplete="off"
    >

    <button
        id="voiceBtn"
        class="voiceBtn"
        type="button"
        onclick="toggleVoiceRecording()"
    >
        🎤
    </button>

    <button
        class="sendBtn"
        type="button"
        onclick="sendMessage()"
    >
        ➤
    </button>

</div>


<!-- =========================
     CHAT MENU
========================= -->

<div
    id="menuOverlay"
    class="menuOverlay"
    onclick="closeChatMenu(event)"
>

    <div
        id="chatMenu"
        class="chatMenu"
        onclick="event.stopPropagation()"
    >

        <button
            class="menuItem"
            type="button"
            onclick="viewProfile()"
        >
            👤 Profile
        </button>

        <button
            class="menuItem"
            type="button"
            onclick="blockUser()"
        >
            🚫 Block
        </button>

        <button
            class="menuItem"
            type="button"
            onclick="unblockUser()"
        >
            🔓 Unblock
        </button>

        <button
            class="menuItem danger"
            type="button"
            onclick="deleteChat()"
        >
            🗑️ Delete chat
        </button>

    </div>

</div>


<!-- =========================
     MESSAGE MENU
========================= -->

<div
    id="messageMenu"
    class="messageMenu"
>

    <button
        type="button"
        onclick="deleteSelectedMessage()"
    >
        🗑️ Delete message
    </button>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;
let chatUserId = null;
let chatUserProfile = null;
let conversationId = null;

let realtimeChannel = null;
let presenceChannel = null;

let selectedFile = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

let selectedMessageId = null;
let longPressTimer = null;

let deletedChatKey = "";


/* =====================================================
   INIT
===================================================== */

async function initChat(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getUser();

        if(error || !data.user){

            window.location.href =
                "index.html";

            return;
        }

        currentUser =
            data.user;

        const params =
            new URLSearchParams(
                window.location.search
            );

        chatUserId =
            params.get("user");

        if(!chatUserId){

            document.getElementById(
                "chatUserName"
            ).textContent =
                "New Chat";

            return;
        }

        if(chatUserId === currentUser.id){

            document.getElementById(
                "chatUserName"
            ).textContent =
                "Invalid User";

            return;
        }

        deletedChatKey =
            "raztara_deleted_chat_" +
            currentUser.id +
            "_" +
            chatUserId;

        if(
            localStorage.getItem(
                deletedChatKey
            ) === "1"
        ){

            localStorage.removeItem(
                deletedChatKey
            );
        }

        await loadChatUser();

        conversationId =
            await getConversationId();

        if(!conversationId){

            showToast(
                "Conversation তৈরি করা যায়নি।"
            );

            return;
        }

        await loadMessages();

        await markMessagesAsRead();

        startRealtimeChat();

        startOnlinePresence();

        await updateMyLastSeen();

        setInterval(
            updateMyLastSeen,
            30000
        );

    }catch(error){

        console.error(
            "INIT ERROR:",
            error
        );

        showToast(
            "Chat চালু করতে সমস্যা হয়েছে।"
        );
    }
}


/* =====================================================
   LOAD USER
===================================================== */

async function loadChatUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,username,full_name,avatar_url,bio,online_visibility,last_seen_at"
        )
        .eq(
            "id",
            chatUserId
        )
        .maybeSingle();

    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        return;
    }

    if(!data){

        document.getElementById(
            "chatUserName"
        ).textContent =
            "User পাওয়া যায়নি";

        return;
    }

    chatUserProfile =
        data;

    document.getElementById(
        "chatUserName"
    ).textContent =
        data.full_name ||
        data.username ||
        "User";

    const avatar =
        document.getElementById(
            "chatAvatar"
        );

    avatar.src =
        data.avatar_url ||
        "https://i.pravatar.cc/100?img=1";

    avatar.onerror =
        function(){

            this.onerror = null;

            this.src =
                "https://i.pravatar.cc/100?img=1";
        };

    await updateHeaderStatus();
}


/* =====================================================
   CONVERSATION
===================================================== */

async function getConversationId(){

    const {
        data,
        error
    } =
    await supabaseClient
        .rpc(
            "get_or_create_direct_conversation",
            {
                other_user_id:
                    chatUserId
            }
        );

    if(error){

        console.error(
            "CONVERSATION ERROR:",
            error
        );

        return null;
    }

    return data;
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

    if(!conversationId){
        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient
        .from("messages")
        .select(
            "id,conversation_id,sender_id,content,message_type,file_url,created_at,is_read"
        )
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );

    if(error){

        console.error(
            "LOAD MESSAGE ERROR:",
            error
        );

        showToast(
            "মেসেজ লোড করা যায়নি।"
        );

        return;
    }

    const container =
        document.getElementById(
            "messages"
        );

    container
        .querySelectorAll(
            ".message,.dateSeparator"
        )
        .forEach(
            el => el.remove()
        );

    const empty =
        document.getElementById(
            "emptyChat"
        );

    if(!data || !data.length){

        empty.style.display =
            "block";

        return;
    }

    empty.style.display =
        "none";

    let previousDate = "";

    data.forEach(
        message => {

            const dateKey =
                getDateKey(
                    message.created_at
                );

            if(
                dateKey !==
                previousDate
            ){

                addDateSeparator(
                    message.created_at
                );

                previousDate =
                    dateKey;
            }

            addMessageToScreen(
                message
            );
        }
    );

    scrollToBottom();
}


/* =====================================================
   DATE SEPARATOR
===================================================== */

function getDateKey(date){

    const d =
        new Date(date);

    return [
        d.getFullYear(),
        d.getMonth(),
        d.getDate()
    ].join("-");
}


function addDateSeparator(date){

    const container =
        document.getElementById(
            "messages"
        );

    const div =
        document.createElement("div");

    div.className =
        "dateSeparator";

    const span =
        document.createElement("span");

    span.textContent =
        formatDateSeparator(
            date
        );

    div.appendChild(span);

    container.appendChild(div);
}


function formatDateSeparator(date){

    const d =
        new Date(date);

    const now =
        new Date();

    const yesterday =
        new Date();

    yesterday.setDate(
        now.getDate() - 1
    );

    if(
        d.toDateString() ===
        now.toDateString()
    ){

        return "আজ";
    }

    if(
        d.toDateString() ===
        yesterday.toDateString()
    ){

        return "গতকাল";
    }

    return d.toLocaleDateString(
        "bn-BD",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessageToScreen(message){

    const container =
        document.getElementById(
            "messages"
        );

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            message.sender_id ===
            currentUser.id
            ? "me"
            : "other"
        );

    div.dataset.messageId =
        message.id;

    const content =
        document.createElement("div");

    content.className =
        "messageContent";


    /* IMAGE */

    if(
        message.message_type ===
        "image" &&
        message.file_url
    ){

        const img =
            document.createElement("img");

        img.className =
            "chatImage";

        img.src =
            message.file_url;

        img.alt =
            message.content ||
            "Image";

        img.loading =
            "lazy";

        img.onclick =
            function(){

                window.open(
                    message.file_url,
                    "_blank"
                );
            };

        content.appendChild(img);
    }


    /* VIDEO */

    else if(
        message.message_type ===
        "video" &&
        message.file_url
    ){

        const video =
            document.createElement("video");

        video.className =
            "chatVideo";

        video.src =
            message.file_url;

        video.controls =
            true;

        video.playsInline =
            true;

        content.appendChild(video);
    }


    /* AUDIO */

    else if(
        message.message_type ===
        "audio" &&
        message.file_url
    ){

        const audio =
            document.createElement("audio");

        audio.className =
            "audioMessage";

        audio.src =
            message.file_url;

        audio.controls =
            true;

        content.appendChild(audio);
    }


    /* FILE */

    else if(
        message.message_type ===
        "file" &&
        message.file_url
    ){

        const fileBox =
            document.createElement("a");

        fileBox.className =
            "fileBox";

        fileBox.href =
            message.file_url;

        fileBox.target =
            "_blank";

        fileBox.rel =
            "noopener";

        const icon =
            document.createElement("div");

        icon.className =
            "fileIcon";

        icon.textContent =
            "📎";

        const info =
            document.createElement("div");

        info.className =
            "fileInfo";

        const name =
            document.createElement("div");

        name.className =
            "fileName";

        name.textContent =
            message.content ||
            "File";

        const open =
            document.createElement("div");

        open.className =
            "fileOpen";

        open.textContent =
            "Open file";

        info.appendChild(name);
        info.appendChild(open);

        fileBox.appendChild(icon);
        fileBox.appendChild(info);

        content.appendChild(fileBox);
    }


    /* TEXT */

    else{

        const text =
            document.createElement("div");

        text.className =
            "messageText";

        text.textContent =
            message.content ||
            "";

        content.appendChild(text);
    }


    div.appendChild(content);


    /* TIME */

    const time =
        document.createElement("div");

    time.className =
        "messageTime";

    time.appendChild(
        document.createTextNode(
            new Date(
                message.created_at
            ).toLocaleTimeString(
                "bn-BD",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )
        )
    );


    /* SEEN */

    if(
        message.sender_id ===
        currentUser.id
    ){

        const seen =
            document.createElement(
                "span"
            );

        seen.className =
            "seenIcon " +
            (
                message.is_read
                ? "seen"
                : ""
            );

        seen.textContent =
            message.is_read
            ? "✓✓"
            : "✓";

        time.appendChild(
            seen
        );
    }


    div.appendChild(time);

    addLongPress(div,message);

    container.appendChild(div);
}


/* =====================================================
   LONG PRESS
===================================================== */

function addLongPress(
    element,
    message
){

    element.addEventListener(
        "pointerdown",
        function(event){

            if(event.button !== 0){
                return;
            }

            longPressTimer =
                setTimeout(
                    function(){

                        showMessageMenu(
                            event,
                            message
                        );

                    },
                    550
                );
        }
    );

    [
        "pointerup",
        "pointerleave",
        "pointercancel"
    ].forEach(
        type => {

            element.addEventListener(
                type,
                function(){

                    clearTimeout(
                        longPressTimer
                    );
                }
            );
        }
    );
}

    let y =
        event.clientY;

    if(
        x + 180 >

        x =

    if(
        y + 55 >
        window.innerHeight
    ){

        y =

    }

    menu.style.top =
        Math.max(5,y) + "px";
}

/* =====================================================
   SEND FILE
===================================================== */

async function sendSelectedFile(){

    const file =
        selectedFile;

    if(!file){
        return;
    }

    if(!conversationId){

        showToast(
            "Conversation পাওয়া যায়নি।"
        );

        return;
    }

    if(
        await isUserBlocked()
    ){

        showToast(
            "এই User-কে আপনি Block করেছেন।"
        );

        return;
    }

    const safeName =
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );

    const filePath =
        currentUser.id +
        "/" +
        Date.now() +
        "_" +
        safeName;

    showToast(
        "ফাইল Upload হচ্ছে..."
    );

    const {
        error: uploadError
    } =
    await supabaseClient
        .storage
        .from("chat-files")
        .upload(
            filePath,
            file,
            {
                upsert:false,
                contentType:
                    file.type ||
                    "application/octet-stream"
            }
        );

    if(uploadError){

        console.error(
            "UPLOAD ERROR:",
            uploadError
        );

        showToast(
            "ফাইল Upload করা যায়নি।"
        );

        return;
    }


    /*
       chat-files bucket Public হলে
       Public URL ব্যবহার হবে।
    */

    const {
        data: publicData
    } =
    supabaseClient
        .storage
        .from("chat-files")
        .getPublicUrl(
            filePath
        );

    const fileUrl =
        publicData &&
        publicData.publicUrl;


    if(!fileUrl){

        showToast(
            "ফাইল URL তৈরি করা যায়নি।"
        );

        return;
    }


    let messageType =
        "file";

    if(
        file.type.startsWith(
            "image/"
        )
    ){

        messageType =
            "image";

    }else if(
        file.type.startsWith(
            "video/"
        )
    ){

        messageType =
            "video";
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("messages")
        .insert({

            conversation_id:
                conversationId,

            sender_id:
                currentUser.id,

            content:
                file.name,

            message_type:
                messageType,

            file_url:
                fileUrl,

            is_read:
                false
        })
        .select()
        .single();


    if(error){

        console.error(
            "FILE MESSAGE ERROR:",
            error
        );

        showToast(
            "Upload হয়েছে, কিন্তু Message পাঠানো যায়নি।"
        );

        return;
    }


    addMessageToScreen(
        data
    );

    hideEmpty();

    clearAttachment();

    scrollToBottom();

    showToast(
        "ফাইল পাঠানো হয়েছে।"
    );
}


/* =====================================================
   VOICE RECORDING
===================================================== */

async function toggleVoiceRecording(){

    if(isRecording){

        stopVoiceRecording();

    }else{

        await startVoiceRecording();
    }
}


async function startVoiceRecording(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showToast(
            "এই Browser-এ Voice recording নেই।"
        );

        return;
    }

    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });

        audioChunks =
            [];

        mediaRecorder =
            new MediaRecorder(
                stream
            );

        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async function(){

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );

                await sendVoiceBlob(
                    blob
                );
            };

        mediaRecorder.start();

        isRecording =
            true;

        document.getElementById(
            "voiceBtn"
        ).textContent =
            "⏹️";

        showToast(
            "Voice recording চলছে... আবার চাপলে Send হবে।"
        );

    }catch(error){

        console.error(
            "VOICE ERROR:",
            error
        );

        showToast(
            "Microphone permission দিন।"
        );
    }
}


function stopVoiceRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();
    }

    isRecording =
        false;

    document.getElementById(
        "voiceBtn"
    ).textContent =
        "🎤";
}

/* =====================================================
   REALTIME
===================================================== */

function startRealtimeChat(){

    if(!conversationId){
        return;
    }

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;
    }

    realtimeChannel =
        supabaseClient
            .channel(
                "chat-" +
                conversationId
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                async payload => {

                    if(
                        payload.new.sender_id ===
                        currentUser.id
                    ){

                        return;
                    }

                    addMessageToScreen(
                        payload.new
                    );

                    hideEmpty();

                    await markMessagesAsRead();

                    scrollToBottom();
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                payload => {

                    updateMessageOnScreen(
                        payload.new
                    );
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"DELETE",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                payload => {

                    const element =
                        document.querySelector(
                            '[data-message-id="' +
                            payload.old.id +
                            '"]'
                        );

                    if(element){

                        element.remove();
                    }
                }
            )

            .subscribe(
                status => {

                    console.log(
                        "REALTIME:",
                        status
                    );
                }
            );
}

        );

}


/* =====================================================
   ONLINE / OFFLINE
===================================================== */

function startOnlinePresence(){

    if(presenceChannel){

        supabaseClient.removeChannel(
            presenceChannel
        );
    }

    presenceChannel =
        supabaseClient
            .channel(
                "presence-raztara"
            );

    presenceChannel
        .on(
            "presence",
            {
                event:"sync"
            },
            () => {

                updateHeaderStatus();
            }
        )
        .on(
            "presence",
            {
                event:"join"
            },
            () => {

                updateHeaderStatus();
            }
        )
        .on(
            "presence",
            {
                event:"leave"
            },
            () => {

                updateHeaderStatus();
            }
        )
        .subscribe(
            async status => {

                if(
                    status ===
                    "SUBSCRIBED"
                ){

                    await presenceChannel.track({
                        user_id:
                            currentUser.id,

                        online_at:
                            new Date().toISOString()
                    });

                    await updateMyLastSeen();

                    updateHeaderStatus();
                }
            }
        );
}


async function updateMyLastSeen(){

    if(!currentUser){
        return;
    }

    const {
        error
    } =
    await supabaseClient
        .from("profiles")
        .update({
            last_seen_at:
                new Date().toISOString()
        })
        .eq(
            "id",
            currentUser.id
        );

    if(error){

        console.error(
            "LAST SEEN UPDATE:",
            error
        );
    }
}


async function isUserOnline(){

    if(
        !presenceChannel
    ){

        return false;
    }

    const state =
        presenceChannel.presenceState();

    return Object.values(
        state
    ).some(
        entries =>
            entries.some(
                entry =>
                    entry.user_id ===
                    chatUserId
            )
    );
}


async function updateHeaderStatus(){

    if(!chatUserProfile){
        return;
    }

    const statusElement =
        document.getElementById(
            "chatUserStatus"
        );

    const online =
        await isUserOnline();

    if(online){

        statusElement.textContent =
            "Online";

        return;
    }

    if(
        chatUserProfile.last_seen_at
    ){

        statusElement.textContent =
            "Last seen " +
            formatLastSeen(
                chatUserProfile.last_seen_at
            );

    }else{

        statusElement.textContent =
            "Offline";
    }
}


function formatLastSeen(date){

    return new Date(
        date
    ).toLocaleString(
        "bn-BD",
        {
            day:"numeric",
            month:"short",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

}


function scrollToBottom(){

    const container =
        document.getElementById(
            "messages"
        );

    requestAnimationFrame(
        () => {

            container.scrollTop =
                container.scrollHeight;
        }
    );
}


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.style.display =
        "block";

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(
            function(){

                toast.style.display =
                    "none";

            },
            2200
        );
}


/* =====================================================
   START
===================================================== */

initChat();

</script>

</body>
</html>
