<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">
<title>Chat | RAZTARA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f0f2f5;
    color:#222;
    height:100vh;
    overflow:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.chatApp{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:#efeae2;
}

/* HEADER */
.chatHeader{
    height:64px;
    background:#087f5b;
    color:white;
    display:flex;
    align-items:center;
    padding:8px 10px;
    gap:10px;
    flex-shrink:0;
}

.backBtn{
    width:42px;
    height:42px;
    background:transparent;
    color:white;
    font-size:32px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.userAvatar{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
    flex-shrink:0;
}

.userInfo{
    min-width:0;
    flex:1;
}

.userName{
    font-size:17px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.userStatus{
    font-size:12px;
    opacity:.95;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.callBtn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:transparent;
    color:white;
    font-size:22px;
}

/* MESSAGES */
.messages{
    flex:1;
    overflow-y:auto;
    padding:12px 10px 10px;
    display:flex;
    flex-direction:column;
    gap:4px;
    -webkit-overflow-scrolling:touch;
}

.emptyChat{
    margin:auto;
    text-align:center;
    color:#777;
    background:rgba(255,255,255,.8);
    padding:15px 20px;
    border-radius:12px;
}

.dateSeparator{
    align-self:center;
    background:#d8e6dd;
    color:#4b6257;
    font-size:12px;
    padding:6px 12px;
    border-radius:12px;
    margin:9px 0 5px;
}

.messageRow{
    display:flex;
    width:100%;
}

.messageRow.mine{
    justify-content:flex-end;
}

.messageRow.theirs{
    justify-content:flex-start;
}

.messageBubble{
    max-width:82%;
    min-width:70px;
    padding:7px 9px 5px;
    border-radius:10px;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
    position:relative;
    word-break:break-word;
}

.mine .messageBubble{
    background:#d9fdd3;
    border-top-right-radius:3px;
}

.theirs .messageBubble{
    background:white;
    border-top-left-radius:3px;
}

.messageText{
    font-size:15px;
    line-height:1.4;
    white-space:pre-wrap;
}

.messageMeta{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:4px;
    margin-top:3px;
    font-size:10px;
    color:#667;
}

.readStatus{
    font-weight:700;
    font-size:14px;
}

.readStatus.seen{
    color:#087fcb;
}

.messageMedia{
    max-width:100%;
    border-radius:8px;
    display:block;
    margin-bottom:4px;
}

.messageImage{
    max-height:320px;
}

.messageVideo{
    max-height:320px;
}

.fileLink{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:#075e54;
    font-weight:600;
    padding:8px;
    background:rgba(255,255,255,.5);
    border-radius:8px;
}

.audioPlayer{
    width:230px;
    max-width:100%;
}

/* ATTACHMENT PREVIEW */
.previewArea{
    display:none;
    background:white;
    border-top:1px solid #ddd;
    padding:8px 10px;
}

.previewArea.show{
    display:flex;
    align-items:center;
    gap:10px;
}

.previewContent{
    flex:1;
    min-width:0;
}

.previewImage,
.previewVideo{
    max-width:90px;
    max-height:70px;
    border-radius:7px;
    object-fit:cover;
}

.previewFile{
    font-size:13px;
    color:#444;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.previewCancel{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#eee;
    color:#444;
    font-size:20px;
}

/* COMPOSER */
.composer{
    background:#f0f2f5;
    padding:7px;
    display:flex;
    align-items:flex-end;
    gap:6px;
    flex-shrink:0;
    border-top:1px solid #ddd;
}

.attachBtn,
.voiceBtn,
.sendBtn{
    width:43px;
    height:43px;
    border-radius:50%;
    flex-shrink:0;
}

.attachBtn{
    background:transparent;
    font-size:24px;
}

.voiceBtn{
    background:white;
    font-size:20px;
}

.voiceBtn.recording{
    background:#e53935;
    color:white;
}

.sendBtn{
    background:#087f5b;
    color:white;
    font-size:19px;
}

.textInputWrap{
    flex:1;
    background:white;
    border-radius:22px;
    padding:0 14px;
    display:flex;
    align-items:center;
    min-height:43px;
}

#messageInput{
    width:100%;
    border:0;
    outline:0;
    resize:none;
    max-height:110px;
    padding:11px 0;
    background:transparent;
    font-size:15px;
}

/* LOADING */
.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* HIDDEN FILE */
#fileInput{
    display:none;
}

/* MOBILE */
@media(min-width:700px){
    .chatApp{
        max-width:760px;
        margin:auto;
        box-shadow:0 0 15px rgba(0,0,0,.15);
    }
}
</style>
</head>

<body>

<div class="chatApp">

    <!-- HEADER -->
    <header class="chatHeader">

        <button class="backBtn" onclick="goBack()" aria-label="Back">
            ‹
        </button>

        <img
            id="chatUserAvatar"
            class="userAvatar"
            src="https://i.pravatar.cc/100?img=12"
            alt="User"
        >

        <div class="userInfo">
            <div id="chatUserName" class="userName">
                Loading...
            </div>

            <div id="chatUserStatus" class="userStatus">
                Checking status...
            </div>
        </div>

        <button
            class="callBtn"
            onclick="startCall()"
            aria-label="Call"
            title="Call">
            📞
        </button>

    </header>

    <!-- MESSAGES -->
    <main id="messages" class="messages">
        <div class="loading">
            Messages loading...
        </div>
    </main>

    <!-- PREVIEW -->
    <div id="previewArea" class="previewArea">
        <div id="previewContent" class="previewContent"></div>

        <button
            class="previewCancel"
            onclick="cancelPendingAttachment()">
            ×
        </button>
    </div>

    <!-- COMPOSER -->
    <div class="composer">

        <button
            class="attachBtn"
            onclick="document.getElementById('fileInput').click()"
            title="Attach">
            📎
        </button>

        <input
            id="fileInput"
            type="file"
            accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar"
            onchange="handleFileSelect(event)"
        >

        <div class="textInputWrap">
            <textarea
                id="messageInput"
                rows="1"
                placeholder="মেসেজ লিখুন..."
                oninput="autoResize(this)"
                onkeydown="handleEnter(event)"
            ></textarea>
        </div>

        <button
            id="voiceBtn"
            class="voiceBtn"
            onclick="toggleVoiceRecording()"
            title="Voice message">
            🎤
        </button>

        <button
            class="sendBtn"
            onclick="sendMessage()"
            title="Send">
            ➤
        </button>

    </div>

</div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;
let chatUser = null;
let conversationId = null;

let messagesChannel = null;
let presenceChannel = null;

let pendingFile = null;
let pendingVoiceBlob = null;
let pendingVoiceMime = null;

let mediaRecorder = null;
let voiceChunks = [];
let isRecording = false;

let onlineUsers = new Set();

let lastDateKey = null;


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    try{

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if(!session){
            window.location.href = "index.html";
            return;
        }

        currentUser = session.user;

        const params = new URLSearchParams(
            window.location.search
        );

        const userId = params.get("user");

        if(!userId){
            alert("Chat user পাওয়া যায়নি।");
            window.location.href = "index.html";
            return;
        }

        if(userId === currentUser.id){
            alert("নিজের সাথে chat করা যাবে না।");
            window.location.href = "index.html";
            return;
        }

        await loadChatUser(userId);

        await getOrCreateConversation();

        await loadMessages();

        subscribeToMessages();

        await setupPresence();

        await updateMyLastSeen();

    }catch(error){

        console.error(error);

        alert(
            "Chat চালু করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।"
        );
    }
});


/* =========================================================
   LOAD CHAT USER
========================================================= */

async function loadChatUser(userId){

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url,
            bio,
            last_seen_at
        `)
        .eq("id", userId)
        .single();

    if(error){
        console.error(error);
        throw error;
    }

    chatUser = data;

    document.getElementById("chatUserName").textContent =
        data.full_name ||
        data.username ||
        "User";

    document.getElementById("chatUserAvatar").src =
        data.avatar_url ||
        "https://i.pravatar.cc/100?img=12";

    updateUserStatus();
}


/* =========================================================
   CREATE / FIND CONVERSATION
========================================================= */

async function getOrCreateConversation(){

    /*
       First try to find a conversation
       where current user and target user are members.
    */

    const {
        data: myMemberships,
        error: membershipError
    } = await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq("user_id", currentUser.id);

    if(membershipError){
        console.error(membershipError);
        throw membershipError;
    }

    const ids =
        (myMemberships || []).map(
            item => item.conversation_id
        );

    if(ids.length > 0){

        const {
            data: otherMemberships,
            error: otherError
        } = await supabaseClient
            .from("conversation_members")
            .select("conversation_id")
            .eq("user_id", chatUser.id)
            .in("conversation_id", ids);

        if(otherError){
            console.error(otherError);
            throw otherError;
        }

        const possibleIds =
            (otherMemberships || []).map(
                item => item.conversation_id
            );

        if(possibleIds.length > 0){

            const {
                data: conversations,
                error: conversationError
            } = await supabaseClient
                .from("conversations")
                .select("id,is_group")
                .in("id", possibleIds)
                .eq("is_group", false)
                .order("created_at", {
                    ascending:true
                });

            if(conversationError){
                console.error(conversationError);
                throw conversationError;
            }

            if(conversations && conversations.length){

                conversationId =
                    conversations[0].id;

                return;
            }
        }
    }


    /*
       No existing conversation.
       IMPORTANT:
       created_by MUST be currentUser.id
       because of Supabase RLS.
    */

    const {
        data: newConversation,
        error: createError
    } = await supabaseClient
        .from("conversations")
        .insert({
            created_by: currentUser.id,
            is_group: false
        })
        .select("id")
        .single();

    if(createError){
        console.error(createError);
        throw createError;
    }

    conversationId =
        newConversation.id;


    /*
       Add current user.
    */

    const {
        error: addMeError
    } = await supabaseClient
        .from("conversation_members")
        .insert({
            conversation_id: conversationId,
            user_id: currentUser.id
        });

    if(addMeError){
        console.error(addMeError);

        /*
           If it already exists, continue.
        */
        if(addMeError.code !== "23505"){
            throw addMeError;
        }
    }


    /*
       Add other user.
    */

    const {
        error: addOtherError
    } = await supabaseClient
        .from("conversation_members")
        .insert({
            conversation_id: conversationId,
            user_id: chatUser.id
        });

    if(addOtherError){
        console.error(addOtherError);

        if(addOtherError.code !== "23505"){
            throw addOtherError;
        }
    }
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    const messagesBox =
        document.getElementById("messages");

    messagesBox.innerHTML =
        `<div class="loading">Messages loading...</div>`;

    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select(`
            id,
            conversation_id,
            sender_id,
            content,
            message_type,
            file_url,
            created_at,
            is_read
        `)
        .eq("conversation_id", conversationId)
        .order("created_at", {
            ascending:true
        });

    if(error){
        console.error(error);
        throw error;
    }

    messagesBox.innerHTML = "";

    lastDateKey = null;

    if(!data || data.length === 0){

        messagesBox.innerHTML =
            `<div class="emptyChat">
                এখনো কোনো মেসেজ নেই।<br>
                প্রথম মেসেজটি পাঠান।
            </div>`;

        return;
    }

    for(const message of data){

        renderDateSeparator(
            message.created_at
        );

        renderMessage(
            message,
            false
        );
    }

    /*
       Incoming unread messages are marked as read
       only when the chat page is visible.
    */

    if(document.visibilityState === "visible"){
        await markIncomingMessagesAsRead(data);
    }

    scrollToBottom(false);
}


/* =========================================================
   RENDER DATE SEPARATOR
========================================================= */

function renderDateSeparator(createdAt){

    const date =
        new Date(createdAt);

    const key =
        date.getFullYear() +
        "-" +
        String(date.getMonth()+1).padStart(2,"0") +
        "-" +
        String(date.getDate()).padStart(2,"0");

    if(key === lastDateKey){
        return;
    }

    lastDateKey = key;

    const separator =
        document.createElement("div");

    separator.className =
        "dateSeparator";

    separator.textContent =
        formatDateSeparator(date);

    document
        .getElementById("messages")
        .appendChild(separator);
}


/* =========================================================
   DATE TEXT
========================================================= */

function formatDateSeparator(date){

    const now =
        new Date();

    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const target =
        new Date(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );

    const difference =
        Math.round(
            (today - target) /
            (1000 * 60 * 60 * 24)
        );

    if(difference === 0){
        return "আজ";
    }

    if(difference === 1){
        return "গতকাল";
    }

    const weekdays = [
        "রবিবার",
        "সোমবার",
        "মঙ্গলবার",
        "বুধবার",
        "বৃহস্পতিবার",
        "শুক্রবার",
        "শনিবার"
    ];

    const months = [
        "জানুয়ারি",
        "ফেব্রুয়ারি",
        "মার্চ",
        "এপ্রিল",
        "মে",
        "জুন",
        "জুলাই",
        "আগস্ট",
        "সেপ্টেম্বর",
        "অক্টোবর",
        "নভেম্বর",
        "ডিসেম্বর"
    ];

    return (
        weekdays[date.getDay()] +
        " • " +
        date.getDate() +
        " " +
        months[date.getMonth()] +
        " " +
        date.getFullYear()
    );
}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(message, scroll=true){

    const messagesBox =
        document.getElementById("messages");

    const row =
        document.createElement("div");

    const mine =
        message.sender_id === currentUser.id;

    row.className =
        "messageRow " +
        (mine ? "mine" : "theirs");

    row.dataset.messageId =
        message.id;


    const bubble =
        document.createElement("div");

    bubble.className =
        "messageBubble";


    /* MEDIA */

    if(message.file_url){

        if(message.message_type === "image"){

            const img =
                document.createElement("img");

            img.src =
                message.file_url;

            img.className =
                "messageMedia messageImage";

            img.loading = "lazy";

            img.onclick = () => {
                window.open(
                    message.file_url,
                    "_blank"
                );
            };

            bubble.appendChild(img);
        }


        else if(message.message_type === "video"){

            const video =
                document.createElement("video");

            video.src =
                message.file_url;

            video.controls = true;

            video.playsInline = true;

            video.className =
                "messageMedia messageVideo";

            bubble.appendChild(video);
        }


        else if(message.message_type === "audio"){

            const audio =
                document.createElement("audio");

            audio.src =
                message.file_url;

            audio.controls = true;

            audio.className =
                "audioPlayer";

            bubble.appendChild(audio);
        }


        else if(message.message_type === "file"){

            const link =
                document.createElement("a");

            link.href =
                message.file_url;

            link.target = "_blank";

            link.rel = "noopener";

            link.className =
                "fileLink";

            link.innerHTML =
                "📄 <span>" +
                escapeHtml(
                    message.content ||
                    "File"
                ) +
                "</span>";

            bubble.appendChild(link);
        }
    }


    /* LOCATION */

    if(message.message_type === "location"){

        const link =
            document.createElement("a");

        link.href =
            message.content;

        link.target = "_blank";

        link.rel = "noopener";

        link.className =
            "fileLink";

        link.innerHTML =
            "📍 Location খুলুন";

        bubble.appendChild(link);
    }


    /* TEXT */

    if(
        message.content &&
        message.message_type !== "file" &&
        message.message_type !== "location"
    ){

        const text =
            document.createElement("div");

        text.className =
            "messageText";

        text.textContent =
            message.content;

        bubble.appendChild(text);
    }


    /* META */

    const meta =
        document.createElement("div");

    meta.className =
        "messageMeta";

    const time =
        document.createElement("span");

    time.textContent =
        formatTime(
            message.created_at
        );

    meta.appendChild(time);


    if(mine){

        const status =
            document.createElement("span");

        status.className =
            "readStatus";

        if(message.is_read){

            status.classList.add("seen");

            status.textContent =
                "✓✓";

        }else{

            status.textContent =
                "✓";
        }

        meta.appendChild(status);
    }


    bubble.appendChild(meta);

    row.appendChild(bubble);

    messagesBox.appendChild(row);


    if(scroll){
        scrollToBottom(true);
    }
}


/* =========================================================
   TIME
========================================================= */

function formatTime(createdAt){

    const date =
        new Date(createdAt);

    return date.toLocaleTimeString(
        "bn-BD",
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

    if(!currentUser || !conversationId){
        return;
    }

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();


    /*
       Attachment / voice first.
    */

    if(pendingFile){

        await sendPendingFile();

        return;
    }


    if(pendingVoiceBlob){

        await sendPendingVoice();

        return;
    }


    if(!text){
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({
            conversation_id: conversationId,
            sender_id: currentUser.id,
            content: text,
            message_type: "text",
            is_read: false
        });

    if(error){

        console.error(error);

        alert(
            "Message পাঠানো যায়নি।"
        );

        return;
    }

    input.value = "";

    autoResize(input);
}


/* =========================================================
   REALTIME MESSAGES
========================================================= */

function subscribeToMessages(){

    if(messagesChannel){
        supabaseClient
            .removeChannel(messagesChannel);
    }

    messagesChannel =
        supabaseClient
            .channel(
                "chat-messages-" +
                conversationId
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                async payload => {

                    const message =
                        payload.new;

                    /*
                       Avoid duplicate rendering if
                       the same message already exists.
                    */

                    if(
                        document.querySelector(
                            `[data-message-id="${message.id}"]`
                        )
                    ){
                        return;
                    }

                    const empty =
                        document.querySelector(
                            ".emptyChat"
                        );

                    if(empty){
                        empty.remove();
                    }

                    renderDateSeparator(
                        message.created_at
                    );

                    renderMessage(
                        message,
                        true
                    );


                    /*
                       If message is from other user
                       and page is visible, mark read.
                    */

                    if(
                        message.sender_id !==
                        currentUser.id &&
                        document.visibilityState ===
                        "visible"
                    ){

                        await markMessageAsRead(
                            message.id
                        );
                    }
                }
            )
            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                payload => {

                    const message =
                        payload.new;

                    updateRenderedMessageStatus(
                        message
                    );
                }
            )
            .subscribe();
}


/* =========================================================
   READ RECEIPTS
========================================================= */

async function markIncomingMessagesAsRead(
    messages
){

    const unreadIds =
        messages
            .filter(
                message =>
                    message.sender_id !==
                    currentUser.id &&
                    !message.is_read
            )
            .map(
                message => message.id
            );

    for(const id of unreadIds){

        await markMessageAsRead(id);
    }
}


async function markMessageAsRead(messageId){

    const {
        error
    } = await supabaseClient
        .from("messages")
        .update({
            is_read:true
        })
        .eq("id", messageId)
        .eq("conversation_id", conversationId)
        .eq("is_read", false);

    if(error){
        console.error(
            "Read receipt error:",
            error
        );
    }
}


function updateRenderedMessageStatus(
    message
){

    const row =
        document.querySelector(
            `[data-message-id="${message.id}"]`
        );

    if(!row){
        return;
    }

    if(
        message.sender_id !==
        currentUser.id
    ){
        return;
    }

    const status =
        row.querySelector(
            ".readStatus"
        );

    if(!status){
        return;
    }

    if(message.is_read){

        status.textContent =
            "✓✓";

        status.classList.add(
            "seen"
        );

    }else{

        status.textContent =
            "✓";

        status.classList.remove(
            "seen"
        );
    }
}


/* =========================================================
   PRESENCE / ONLINE
========================================================= */

async function setupPresence(){

    if(presenceChannel){

        await supabaseClient
            .removeChannel(
                presenceChannel
            );
    }


    presenceChannel =
        supabaseClient
            .channel(
                "raztara-online",
                {
                    config:{
                        presence:{
                            key:currentUser.id
                        }
                    }
                }
            );


    presenceChannel
        .on(
            "presence",
            {
                event:"sync"
            },
            () => {

                const state =
                    presenceChannel.presenceState();

                onlineUsers =
                    new Set(
                        Object.keys(state)
                    );

                updateUserStatus();
            }
        )
        .on(
            "presence",
            {
                event:"join"
            },
            ({ key }) => {

                onlineUsers.add(key);

                updateUserStatus();
            }
        )
        .on(
            "presence",
            {
                event:"leave"
            },
            ({ key }) => {

                onlineUsers.delete(key);

                updateUserStatus();
            }
        );


    const status =
        await new Promise(resolve => {

            presenceChannel.subscribe(
                async status => {

                    if(status === "SUBSCRIBED"){

                        await presenceChannel.track({
                            user_id:currentUser.id,
                            online_at:new Date().toISOString()
                        });

                        resolve(status);
                    }
                }
            );
        });

    return status;
}


/* =========================================================
   STATUS
========================================================= */

function updateUserStatus(){

    if(!chatUser){
        return;
    }

    const statusElement =
        document.getElementById(
            "chatUserStatus"
        );


    if(
        onlineUsers.has(
            chatUser.id
        )
    ){

        statusElement.textContent =
            "🟢 Online";

        return;
    }


    if(chatUser.last_seen_at){

        statusElement.textContent =
            "Offline • শেষ দেখা " +
            formatLastSeen(
                chatUser.last_seen_at
            );

    }else{

        statusElement.textContent =
            "Offline";
    }
}


function formatLastSeen(dateString){

    const date =
        new Date(dateString);

    const now =
        new Date();

    const sameDay =
        date.toDateString() ===
        now.toDateString();

    if(sameDay){

        return (
            "আজ " +
            formatTime(dateString)
        );
    }


    const yesterday =
        new Date();

    yesterday.setDate(
        yesterday.getDate() - 1
    );

    if(
        date.toDateString() ===
        yesterday.toDateString()
    ){

        return (
            "গতকাল " +
            formatTime(dateString)
        );
    }


    return (
        date.toLocaleDateString(
            "bn-BD"
        ) +
        " " +
        formatTime(dateString)
    );
}

/* =========================================================
   FILE SELECT
========================================================= */

function handleFileSelect(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file){
        return;
    }


    if(file.size > 6 * 1024 * 1024){

        alert(
            "File সর্বোচ্চ 6 MB হতে হবে।"
        );

        event.target.value = "";

        return;
    }


    pendingFile = file;

    pendingVoiceBlob = null;

    showFilePreview(file);
}


function showFilePreview(file){

    const area =
        document.getElementById(
            "previewArea"
        );

    const content =
        document.getElementById(
            "previewContent"
        );

    content.innerHTML = "";


    if(file.type.startsWith("image/")){

        const img =
            document.createElement("img");

        img.src =
            URL.createObjectURL(file);

        img.className =
            "previewImage";

        content.appendChild(img);

    }


    else if(file.type.startsWith("video/")){

        const video =
            document.createElement("video");

        video.src =
            URL.createObjectURL(file);

        video.controls = true;

        video.className =
            "previewVideo";

        content.appendChild(video);

    }


    else{

        const div =
            document.createElement("div");

        div.className =
            "previewFile";

        div.textContent =
            "📄 " + file.name;

        content.appendChild(div);
    }


    area.classList.add("show");
}


/* =========================================================
   SEND FILE
========================================================= */

async function sendPendingFile(){

    if(!pendingFile){
        return;
    }

    const file =
        pendingFile;

    try{

        const extension =
            file.name.includes(".")
                ? file.name
                    .split(".")
                    .pop()
                    .toLowerCase()
                : "file";

        const filePath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2) +
            "." +
            extension;


        const {
            error: uploadError
        } = await supabaseClient
            .storage
            .from("chat-files")
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:
                        file.type ||
                        "application/octet-stream"
                }
            );


        if(uploadError){
            console.error(uploadError);

            alert(
                "File upload করা যায়নি।"
            );

            return;
        }


        const {
            data: publicData
        } = supabaseClient
            .storage
            .from("chat-files")
            .getPublicUrl(filePath);


        const publicUrl =
            publicData.publicUrl;


        let messageType =
            "file";

        if(
            file.type.startsWith(
                "image/"
            )
        ){
            messageType = "image";

        }else if(
            file.type.startsWith(
                "video/"
            )
        ){
            messageType = "video";
        }


        const {
            error: messageError
        } = await supabaseClient
            .from("messages")
            .insert({
                conversation_id:
                    conversationId,
                sender_id:
                    currentUser.id,
                content:
                    file.name,
                message_type:
                    messageType,
                file_url:
                    publicUrl,
                is_read:false
            });


        if(messageError){

            console.error(
                messageError
            );

            alert(
                "File message পাঠানো যায়নি।"
            );

            return;
        }


        cancelPendingAttachment();

    }catch(error){

        console.error(error);

        alert(
            "File পাঠাতে সমস্যা হয়েছে।"
        );
    }
}


/* =========================================================
   CANCEL PREVIEW
========================================================= */

function cancelPendingAttachment(){

    pendingFile = null;

    pendingVoiceBlob = null;

    pendingVoiceMime = null;


    const fileInput =

}


/* =========================================================
   VOICE RECORDING
========================================================= */

async function toggleVoiceRecording(){

    if(isRecording){

        stopVoiceRecording();

        return;
    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        alert(
            "আপনার browser voice recording support করছে না।"
        );

        return;
    }


    try{

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });


        let mimeType = "";

        if(
            window.MediaRecorder &&
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ){

            mimeType =
                "audio/webm";

        }else if(
            window.MediaRecorder &&
            MediaRecorder.isTypeSupported(
                "audio/mp4"
            )
        ){

            mimeType =
                "audio/mp4";
        }


        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    { mimeType }
                  )
                : new MediaRecorder(
                    stream
                  );


        voiceChunks = [];

        isRecording = true;


        const voiceBtn =
            document.getElementById(
                "voiceBtn"
            );

        voiceBtn.classList.add(
            "recording"
        );

        voiceBtn.textContent =
            "⏹️";


        mediaRecorder.ondataavailable =
            event => {

                if(event.data.size > 0){

                    voiceChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            () => {

                const actualType =
                    mediaRecorder.mimeType ||
                    mimeType ||
                    "audio/webm";

                pendingVoiceBlob =
                    new Blob(
                        voiceChunks,
                        {
                            type:actualType
                        }
                    );

                pendingVoiceMime =
                    actualType;


                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                showVoicePreview();
            };


        mediaRecorder.start();

    }catch(error){

        console.error(error);

        alert(
            "Microphone permission দেওয়া হয়নি অথবা recording চালু করা যায়নি।"
        );
    }
}


function stopVoiceRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ){

        mediaRecorder.stop();
    }

    isRecording = false;

    const voiceBtn =
        document.getElementById(
            "voiceBtn"
        );

    voiceBtn.classList.remove(
        "recording"
    );

    voiceBtn.textContent =
        "🎤";
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            /*
               Update own last seen.
            */

            await updateMyLastSeen();


            /*
               Mark currently unread incoming
               messages as read.
            */

            if(conversationId){

                const {
                    data
                } = await supabaseClient
                    .from("messages")
                    .select(`
                        id,
                        sender_id,
                        is_read
                    `)
                    .eq(
                        "conversation_id",
                        conversationId
                    )
                    .eq(
                        "sender_id",
                        chatUser?.id
                    )
                    .eq(
                        "is_read",
                        false
                    );

                if(data){

                    for(
                        const message of data
                    ){

                        await markMessageAsRead(
                            message.id
                        );
                    }
                }
            }
        }
    }
);
