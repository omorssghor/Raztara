<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RAZTARA — Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#f4f7f7;
}

body{
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    height:62px;
    min-height:62px;
    background:#087f5b;
    color:#fff;
    display:flex;
    align-items:center;
    padding:0 8px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
    box-shadow:0 2px 7px rgba(0,0,0,.18);
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:27px;
    cursor:pointer;
    flex-shrink:0;
}

.user-area{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    cursor:pointer;
    padding-left:3px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#d9eeee;
    flex-shrink:0;
}

.user-info{
    min-width:0;
    margin-left:9px;
}

.user-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    font-size:11px;
    opacity:.9;
    margin-top:3px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:1px;
}

.header-action{
    width:39px;
    height:42px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* THREE DOT */
.menu{
    position:fixed;
    top:57px;
    right:7px;
    width:185px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 5px 25px rgba(0,0,0,.22);
    overflow:hidden;
    z-index:300;
    display:none;
}

.menu.show{
    display:block;
}

.menu button{
    width:100%;
    border:0;
    background:#fff;
    text-align:left;
    padding:14px 16px;
    font-size:15px;
    color:#222;
    cursor:pointer;
}

.menu button:hover{
    background:#f1f5f4;
}

/* CHAT */
.chat-board{
    position:fixed;
    top:62px;
    bottom:67px;
    left:0;
    right:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:12px 9px 15px;
    -webkit-overflow-scrolling:touch;
}

.messages{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.empty-chat{
    text-align:center;
    color:#777;
    font-size:14px;
    padding:35px 15px;
}

.date-divider{
    width:100%;
    text-align:center;
    margin:10px 0 5px;
}

.date-divider span{
    display:inline-block;
    background:#e2e8e6;
    color:#555;
    padding:5px 12px;
    border-radius:15px;
    font-size:11px;
}

.message-row{
    width:100%;
    display:flex;
}

.message-row.me{
    justify-content:flex-end;
}

.message-row.other{
    justify-content:flex-start;
}

.message{
    max-width:78%;
    padding:8px 10px;
    border-radius:13px;
    position:relative;
    word-break:break-word;
    font-size:15px;
    line-height:1.35;
}

.message-row.me .message{
    background:#d5f8e9;
    border-bottom-right-radius:4px;
}

.message-row.other .message{
    background:#fff;
    border-bottom-left-radius:4px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.message img,
.message video{
    max-width:100%;
    border-radius:9px;
    display:block;
}

.message audio{
    max-width:220px;
}

.file-box{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 0;
}

.file-icon{
    font-size:24px;
}

.file-name{
    font-size:13px;
}

.message-time{
    display:block;
    text-align:right;
    font-size:9px;
    color:#777;
    margin-top:4px;
}

/* COMPOSER */
.composer{
    height:67px;
    min-height:67px;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:7px 6px;
    gap:4px;
    z-index:100;
}

.media-btn{
    width:37px;
    height:43px;
    border:0;
    background:transparent;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
}

.input-wrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    background:#f0f2f2;
    border-radius:23px;
    padding:0 12px;
}

.message-input{
    width:100%;
    height:43px;
    border:0;
    outline:0;
    background:transparent;
    font-size:15px;
}

.send-btn{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:#087f5b;
    color:#fff;
    font-size:19px;
    cursor:pointer;
    flex-shrink:0;
}

.send-btn:disabled{
    opacity:.5;
}

input[type=file]{
    display:none;
}

/* SHEET */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:400;
    display:none;
}

.overlay.show{
    display:block;
}

.sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    background:#fff;
    border-radius:18px 18px 0 0;
    max-height:80vh;
    overflow-y:auto;
    padding:18px;
}

.sheet-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:14px;
}

.sheet-row{
    padding:14px 5px;
    border-bottom:1px solid #eee;
    font-size:15px;
}

.recording{
    position:fixed;
    left:10px;
    right:10px;
    bottom:75px;
    background:#087f5b;
    color:#fff;
    border-radius:13px;
    padding:12px;
    display:none;
    z-index:250;
    text-align:center;
}

.recording.show{
    display:block;
}

.recording button{
    margin-top:7px;
    border:0;
    background:#fff;
    color:#087f5b;
    border-radius:18px;
    padding:7px 18px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:10px 17px;
    border-radius:22px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.profile-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.profile-head img{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
}

.profile-name{
    font-size:17px;
    font-weight:700;
}

.profile-username{
    color:#777;
    font-size:13px;
    margin-top:3px;
}
</style>
</head>

<body>

<div class="header">

    <button class="back-btn" onclick="goBack()">‹</button>

    <div class="user-area" onclick="openProfile()">

        <img id="userAvatar"
             class="avatar"
             src="https://i.pravatar.cc/150?img=12">

        <div class="user-info">

            <div id="userName"
                 class="user-name">
                RAZTARA User
            </div>

            <div id="userStatus"
                 class="user-status">
                ...
            </div>

        </div>
    </div>

    <div class="header-actions">

        <button class="header-action"
                onclick="focusMessage()"
                title="Message">
            💬
        </button>

        <button class="header-action"
                onclick="startCall('audio')"
                title="Audio Call">
            📞
        </button>

        <button class="header-action"
                onclick="startCall('video')"
                title="Video Call">
            📹
        </button>

        <button class="header-action"
                onclick="toggleMenu()"
                title="More">
            ⋮
        </button>

    </div>
</div>


<div id="menu" class="menu">

    <button onclick="openProfile();closeMenu()">
        👤 Profile
    </button>

    <button onclick="openGallery();closeMenu()">
        🖼️ Gallery
    </button>

    <button onclick="blockUser();closeMenu()">
        🚫 <span id="blockMenuText">Block</span>
    </button>

</div>


<div id="chatBoard" class="chat-board">

    <div id="messages" class="messages">

        <div class="loading" id="loading">
            Loading...
        </div>

    </div>

</div>


<div class="composer">

    <button class="media-btn"
            onclick="document.getElementById('photoInput').click()">
        🖼️
    </button>

    <button class="media-btn"
            onclick="document.getElementById('videoInput').click()">
        🎥
    </button>

    <button class="media-btn"
            onclick="document.getElementById('fileInput').click()">
        📎
    </button>

    <button id="voiceBtn"
            class="media-btn"
            onclick="toggleRecording()">
        🎙️
    </button>

    <div class="input-wrap">

        <input id="messageInput"
               class="message-input"
               type="text"
               autocomplete="off"
               placeholder="Message...">

    </div>

    <button id="sendBtn"
            class="send-btn"
            onclick="sendText()">
        ➤
    </button>

</div>


<input id="photoInput"
       type="file"
       accept="image/*"
       onchange="handleFile(this.files[0],'image')">

<input id="videoInput"
       type="file"
       accept="video/*"
       onchange="handleFile(this.files[0],'video')">

<input id="fileInput"
       type="file"
       onchange="handleFile(this.files[0],'file')">


<div id="recordingBox" class="recording">

    <div>
        🎙️
        <span id="recordingText">
            Recording...
        </span>
    </div>

    <button onclick="stopRecording()">
        Send Voice
    </button>

</div>


<div id="profileOverlay"
     class="overlay"
     onclick="closeProfile(event)">

    <div class="sheet"
         onclick="event.stopPropagation()">

        <div class="sheet-title">
            Profile
        </div>

        <div class="profile-head">

            <img id="sheetAvatar"
                 src="https://i.pravatar.cc/150?img=12">

            <div>

                <div id="sheetName"
                     class="profile-name">
                    RAZTARA User
                </div>

                <div id="sheetUsername"
                     class="profile-username">
                    @user
                </div>

            </div>

        </div>

        <div id="profileInfoRows"></div>

        <button onclick="goUserProfile()"
                style="
                width:100%;
                margin-top:15px;
                border:0;
                background:#087f5b;
                color:#fff;
                padding:12px;
                border-radius:10px;
                font-size:15px;">
            View Profile
        </button>

        <button onclick="closeProfile()"
                style="
                width:100%;
                margin-top:8px;
                border:0;
                background:#eee;
                padding:12px;
                border-radius:10px;
                font-size:15px;">
            Close
        </button>

    </div>
</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let otherUserId = null;
let otherProfile = null;
let conversationId = null;

let realtimeChannel = null;

let blocked = false;

let mediaRecorder = null;
let audioChunks = [];
let recordingStream = null;

let currentLanguage =
    localStorage.getItem("raztara_language") || "bn";


/* =========================================================
   LANGUAGE
========================================================= */

const translations = {

    bn:{
        message:"মেসেজ...",
        online:"অনলাইন",
        profile:"প্রোফাইল",
        gallery:"গ্যালারি",
        block:"ব্লক",
        loading:"লোড হচ্ছে...",
        noMessages:"এখনও কোনো মেসেজ নেই",
        recording:"রেকর্ড হচ্ছে...",
        sendVoice:"ভয়েস পাঠান",
        viewProfile:"প্রোফাইল দেখুন",
        close:"বন্ধ করুন",
        blockedCannotSend:"এই ব্যক্তিকে ব্লক করা হয়েছে।",
        blockConfirm:"আপনি কি এই ব্যক্তিকে Block করতে চান?",
        blockSuccess:"ব্যক্তিকে Block করা হয়েছে",
        loginRequired:"লগইন করুন",
        callFailed:"কল শুরু করা যায়নি",
        noProfile:"প্রোফাইল পাওয়া যায়নি"
    },

    en:{
        message:"Message...",
        online:"Online",
        profile:"Profile",
        gallery:"Gallery",
        block:"Block",
        loading:"Loading...",
        noMessages:"No messages yet",
        recording:"Recording...",
        sendVoice:"Send Voice",
        viewProfile:"View Profile",
        close:"Close",
        blockedCannotSend:"This person is blocked.",
        blockConfirm:"Do you want to block this person?",
        blockSuccess:"User blocked",
        loginRequired:"Please login",
        callFailed:"Could not start call",
        noProfile:"Profile not found"
    }

};


function t(key){

    return translations[currentLanguage]?.[key]
        || translations.bn[key]
        || key;
}


/* =========================================================
   AUTH
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if(error || !data?.user){

        showToast(t("loginRequired"));

        setTimeout(()=>{
            window.location.href =
                "index.html";
        },1000);

        return null;
    }

    return data.user;
}


/* =========================================================
   GET OTHER USER
========================================================= */

function getOtherUserId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("user") ||
        params.get("user_id") ||
        params.get("id")
    );
}


/* =========================================================
   BLOCK CHECK
   IMPORTANT:
   BLOCKED USER CHAT WILL NOT OPEN
========================================================= */

async function checkBlockStatus(){

    if(!currentUser || !otherUserId){

        return false;
    }


    /* I BLOCKED THIS USER */

    const {
        data:myBlock,
        error:myBlockError
    } = await supabaseClient
        .from("blocked_users")
        .select("id")
        .eq("blocker_id",currentUser.id)
        .eq("blocked_id",otherUserId)
        .maybeSingle();

    if(myBlockError){

        console.error(
            "My block check:",
            myBlockError
        );
    }

    if(myBlock){

        blocked = true;

        return true;
    }


    /* THIS USER BLOCKED ME */

    const {
        data:theirBlock,
        error:theirBlockError
    } = await supabaseClient
        .from("blocked_users")
        .select("id")
        .eq("blocker_id",otherUserId)
        .eq("blocked_id",currentUser.id)
        .maybeSingle();

    if(theirBlockError){

        console.error(
            "Their block check:",
            theirBlockError
        );
    }

    if(theirBlock){

        blocked = true;

        return true;
    }


    blocked = false;

    return false;
}


/* =========================================================
   BLOCK USER
   UNBLOCK IS ONLY FROM SETTINGS
========================================================= */

async function blockUser(){

    if(!currentUser || !otherUserId){

        return;
    }


    const alreadyBlocked =
        await checkBlockStatus();

    if(alreadyBlocked){

        return;
    }


    const ok =
        confirm(
            t("blockConfirm")
        );

    if(!ok){

        return;
    }


    const {
        error
    } = await supabaseClient
        .from("blocked_users")
        .insert({
            blocker_id:currentUser.id,
            blocked_id:otherUserId
        });


    if(error){

        console.error(error);

        showToast(error.message);

        return;
    }


    blocked = true;

    showToast(
        t("blockSuccess")
    );


    /*
       BLOCK করার পর Chat আর থাকবে না।
       Settings → Blocked Users থেকে Unblock করতে হবে।
    */

    setTimeout(()=>{

        window.location.href =
            "messages.html";

    },500);
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadOtherProfile(){

    if(!otherUserId){

        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select(`
            id,
            username,
            full_name,
            avatar_url,
            bio,
            phone,
            address,
            online_visibility,
            last_seen_at
        `)
        .eq("id",otherUserId)
        .maybeSingle();


    if(error){

        console.error(error);

        otherProfile = null;

        return;
    }


    otherProfile = data;


    const name =
        data?.full_name ||
        data?.username ||
        "RAZTARA User";


    document.getElementById(
        "userName"
    ).textContent = name;


    document.getElementById(
        "sheetName"
    ).textContent = name;


    document.getElementById(
        "sheetUsername"
    ).textContent =
        data?.username
            ? "@" + data.username
            : "";


    if(data?.avatar_url){

        document.getElementById(
            "userAvatar"
        ).src = data.avatar_url;

        document.getElementById(
            "sheetAvatar"
        ).src = data.avatar_url;
    }


    updateOnlineStatus(data);
}


/* =========================================================
   PRIVACY
========================================================= */

async function getPrivacy(){

    if(!otherUserId){

        return {
            profile_photo:"public",
            profile_info:"public",
            email:"only_me",
            phone:"public",
            address:"public",
            bio:"public"
        };
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("profile_privacy")
        .select(`
            profile_photo,
            profile_info,
            email,
            phone,
            address,
            bio
        `)
        .eq("user_id",otherUserId)
        .maybeSingle();


    if(error){

        console.error(
            "Privacy error:",
            error
        );

        return {
            profile_photo:"public",
            profile_info:"public",
            email:"only_me",
            phone:"public",
            address:"public",
            bio:"public"
        };
    }


    return data || {
        profile_photo:"public",
        profile_info:"public",
        email:"only_me",
        phone:"public",
        address:"public",
        bio:"public"
    };
}


/* =========================================================
   FRIEND CHECK
========================================================= */

async function areFriends(){

    if(!currentUser || !otherUserId){

        return false;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("friendships")
        .select("id")
        .eq("status","accepted")
        .or(
            `and(requester_id.eq.${currentUser.id},addressee_id.eq.${otherUserId}),and(requester_id.eq.${otherUserId},addressee_id.eq.${currentUser.id})`
        )
        .limit(1);


    if(error){

        return false;
    }


    return !!(
        data &&
        data.length
    );
}


/* =========================================================
   PRIVACY CHECK
========================================================= */

async function canSeePrivacyValue(value){

    if(value === "public"){

        return true;
    }


    if(value === "only_me"){

        return false;
    }


    if(value === "friend"){

        return await areFriends();
    }


    return false;
}


/* =========================================================
   APPLY PROFILE PRIVACY
========================================================= */

async function applyProfilePrivacy(){

    if(!otherProfile){

        return;
    }


    const privacy =
        await getPrivacy();


    const canSeePhoto =
        await canSeePrivacyValue(
            privacy.profile_photo
        );


    if(!canSeePhoto){

        document.getElementById(
            "userAvatar"
        ).src =
            "https://i.pravatar.cc/150?img=12";

        document.getElementById(
            "sheetAvatar"
        ).src =
            "https://i.pravatar.cc/150?img=12";
    }


    const canSeeInfo =
        await canSeePrivacyValue(
            privacy.profile_info
        );


    const rows =
        document.getElementById(
            "profileInfoRows"
        );


    rows.innerHTML = "";


    if(canSeeInfo){

        if(otherProfile.bio){

            const canSeeBio =
                await canSeePrivacyValue(
                    privacy.bio
                );

            if(canSeeBio){

                rows.innerHTML += `
                    <div class="sheet-row">
                        <b>Bio</b><br>
                        ${escapeHtml(
                            otherProfile.bio
                        )}
                    </div>
                `;
            }
        }


        if(otherProfile.phone){

            const canSeePhone =
                await canSeePrivacyValue(
                    privacy.phone
                );

            if(canSeePhone){

                rows.innerHTML += `
                    <div class="sheet-row">
                        📞 ${escapeHtml(
                            otherProfile.phone
                        )}
                    </div>
                `;
            }
        }


        if(otherProfile.address){

            const canSeeAddress =
                await canSeePrivacyValue(
                    privacy.address
                );

            if(canSeeAddress){

                rows.innerHTML += `
                    <div class="sheet-row">
                        📍 ${escapeHtml(
                            otherProfile.address
                        )}
                    </div>
                `;
            }
        }

    }else{

        rows.innerHTML = `
            <div class="sheet-row">
                🔒
                ${
                    currentLanguage === "bn"
                    ? "এই প্রোফাইলের তথ্য ব্যক্তিগত"
                    : "This profile information is private"
                }
            </div>
        `;
    }
}


/* =========================================================
   ONLINE STATUS
========================================================= */

function updateOnlineStatus(profile){

    const status =
        document.getElementById(
            "userStatus"
        );


    /*
       এখনো Offline পরিবর্তনের কাজ করা হয়নি।
       এই ধাপে শুধু Block system পরিবর্তন করা হয়েছে।
    */

    if(!profile){

        status.textContent = "";

        return;
    }


    if(profile.online_visibility === false){

        status.textContent = "";

        return;
    }


    if(profile.last_seen_at){

        const last =
            new Date(
                profile.last_seen_at
            );

        const diff =
            Date.now() -
            last.getTime();


        if(diff < 120000){

            status.textContent =
                t("online");

            return;
        }
    }


    status.textContent = "";
}


/* =========================================================
   FIND CONVERSATION
========================================================= */

async function findConversation(){

    if(!currentUser || !otherUserId){

        return null;
    }


    const {
        data:myMembers,
        error:myError
    } = await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq(
            "user_id",
            currentUser.id
        );


    if(myError){

        console.error(myError);

        return null;
    }


    if(!myMembers?.length){

        return null;
    }


    const ids =
        myMembers.map(
            x=>x.conversation_id
        );


    const {
        data:otherMembers,
        error:otherError
    } = await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq(
            "user_id",
            otherUserId
        )
        .in(
            "conversation_id",
            ids
        );


    if(otherError){

        console.error(otherError);

        return null;
    }


    if(!otherMembers?.length){

        return null;
    }


    const commonIds =
        otherMembers.map(
            x=>x.conversation_id
        );


    const {
        data:conversations,
        error:conversationError
    } = await supabaseClient
        .from("conversations")
        .select(
            "id,is_group"
        )
        .in(
            "id",
            commonIds
        )
        .eq(
            "is_group",
            false
        )
        .limit(1);


    if(conversationError){

        console.error(
            conversationError
        );

        return null;
    }


    return conversations?.[0]?.id || null;
}


/* =========================================================
   CREATE CONVERSATION
========================================================= */

async function createConversation(){

    const {
        data,
        error
    } = await supabaseClient
        .from("conversations")
        .insert({
            is_group:false,
            created_by:currentUser.id
        })
        .select("id")
        .single();


    if(error){

        console.error(error);

        throw error;
    }


    const newConversationId =
        data.id;


    const {
        error:memberError
    } = await supabaseClient
        .from("conversation_members")
        .insert([
            {
                conversation_id:
                    newConversationId,

                user_id:
                    currentUser.id
            },
            {
                conversation_id:
                    newConversationId,

                user_id:
                    otherUserId
            }
        ]);


    if(memberError){

        console.error(memberError);

        throw memberError;
    }


    return newConversationId;
}

async function loadMessages(){

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = `
        <div class="loading">
            ${t("loading")}
        </div>
    `;


    if(!conversationId){

        container.innerHTML = `
            <div class="empty-chat">
                ${t("noMessages")}
            </div>
        `;

        return;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select(`
            id,
            conversation_id,
            sender_id,
            content,
            message_type,
            file_url,
            created_at,
            deleted_for_everyone
        `)
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty-chat">
                ${error.message}
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    if(!data?.length){

        container.innerHTML = `
            <div class="empty-chat">
                ${t("noMessages")}
            </div>
        `;

        return;
    }


    data.forEach(
        message=>{
            appendMessage(
                message,
                false
            );
        }
    );


    scrollToBottom();
}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessage(
    message,
    scroll=true
){

    if(
        document.querySelector(
            `[data-message-id="${message.id}"]`
        )
    ){

        return;
    }


    const container =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message-row " +
        (
            message.sender_id ===
            currentUser.id
                ? "me"
                : "other"
        );


    row.dataset.messageId =
        message.id;


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message";


    if(message.deleted_for_everyone){

        box.innerHTML =
            `<i>This message was deleted</i>`;

    }else{

        const type =
            message.message_type ||
            "text";


        if(type === "text"){

            box.innerHTML =
                escapeHtml(
                    message.content ||
                    ""
                );

        }else if(type === "image"){

            const img =
                document.createElement(
                    "img"
                );

            img.alt = "Image";


            getMediaUrl(
                message.file_url
            )
            .then(url=>{

                if(url){

                    img.src = url;
                }
            });


            box.appendChild(img);

        }else if(type === "video"){

            const video =
                document.createElement(
                    "video"
                );

            video.controls = true;
            video.playsInline = true;


            getMediaUrl(
                message.file_url
            )
            .then(url=>{

                if(url){

                    video.src = url;
                }
            });


            box.appendChild(video);

        }else if(type === "audio"){

            const audio =
                document.createElement(
                    "audio"
                );

            audio.controls = true;


            getMediaUrl(
                message.file_url
            )
            .then(url=>{

                if(url){

                    audio.src = url;
                }
            });


            box.appendChild(audio);

        }else if(type === "file"){

            const fileBox =
                document.createElement(
                    "div"
                );

            fileBox.className =
                "file-box";


            fileBox.innerHTML = `
                <span class="file-icon">
                    📎
                </span>

                <span class="file-name">
                    ${escapeHtml(
                        message.content ||
                        "File"
                    )}
                </span>
            `;


            fileBox.onclick =
                async()=>{

                    const url =
                        await getMediaUrl(
                            message.file_url
                        );


                    if(url){

                        window.open(
                            url,
                            "_blank"
                        );
                    }
                };


            box.appendChild(
                fileBox
            );

        }else{

            box.innerHTML =
                escapeHtml(
                    message.content ||
                    ""
                );
        }
    }


    const time =
        document.createElement(
            "span"
        );


    time.className =
        "message-time";


    time.textContent =
        formatTime(
            message.created_at
        );


    box.appendChild(
        time
    );


    row.appendChild(
        box
    );


    container.appendChild(
        row
    );


    if(scroll){

        scrollToBottom();
    }
}


/* =========================================================
   MEDIA URL
========================================================= */

async function getMediaUrl(path){

    if(!path){

        return null;
    }


    if(
        path.startsWith("http://") ||
        path.startsWith("https://")
    ){

        return path;
    }


    const {
        data,
        error
    } = await supabaseClient
        .storage
        .from("raztara-media")
        .createSignedUrl(
            path,
            60*60*24*7
        );


    if(error){

        console.error(error);

        return null;
    }


    return data?.signedUrl ||
        null;
}

/* =========================================================
   FILE HANDLER
========================================================= */

async function handleFile(
    file,
    type
){

    if(!file){

        return;
    }


    if(!conversationId){

        return;
    }


    if(blocked){

        showToast(
            t("blockedCannotSend")
        );

        return;
    }


    try{

        const path =
            await uploadChatFile(
                file
            );


        if(!path){

            return;
        }


        const {
            data,
            error
        } = await supabaseClient
            .from("messages")
            .insert({
                conversation_id:
                    conversationId,

                sender_id:
                    currentUser.id,

                content:
                    type === "file"
                        ? file.name
                        : null,

                message_type:
                    type,

                file_url:
                    path
            })
            .select()
            .single();


        if(error){

            console.error(error);

            showToast(
                error.message
            );

            return;
        }


        if(data){

            appendMessage(
                data,
                true
            );
        }

    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Upload failed"
        );
    }
}


/* =========================================================
   UPLOAD
========================================================= */

async function uploadChatFile(file){

    if(!currentUser ||
       !conversationId){

        return null;
    }


    const maxSize =
        6 * 1024 * 1024;


    if(file.size > maxSize){

        throw new Error(
            "Maximum file size is 6 MB"
        );
    }


    const safeName =
        file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


    const uniqueName =
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2) +
        "_" +
        safeName;


    const path =
        currentUser.id +
        "/" +
        conversationId +
        "/" +
        uniqueName;


    const {
        error
    } = await supabaseClient
        .storage
        .from("raztara-media")
        .upload(
            path,
            file,
            {
                upsert:false,
                contentType:file.type
            }
        );


    if(error){

        throw error;
    }


    return path;
}


/* =========================================================
   VOICE RECORDING
========================================================= */

async function toggleRecording(){

    if(mediaRecorder){

        stopRecording();

        return;
    }


    if(blocked){

        showToast(
            t("blockedCannotSend")
        );

        return;
    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showToast(
            "Voice recording is not supported"
        );

        return;
    }


    try{

        recordingStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true
                });


        audioChunks = [];


        mediaRecorder =
            new MediaRecorder(
                recordingStream
            );


        mediaRecorder.ondataavailable =
            event=>{

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            async()=>{

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );


                await sendVoiceBlob(
                    blob
                );


                if(recordingStream){

                    recordingStream
                        .getTracks()
                        .forEach(
                            track=>{
                                track.stop();
                            }
                        );

                    recordingStream =
                        null;
                }


                mediaRecorder =
                    null;
            };


        mediaRecorder.start();


        document
            .getElementById(
                "recordingBox"
            )
            .classList.add(
                "show"
            );


        document
            .getElementById(
                "recordingText"
            )
            .textContent =
                t("recording");


        document
            .getElementById(
                "voiceBtn"
            )
            .textContent =
                "⏹️";

    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Microphone permission required"
        );
    }
}


function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();
    }


    document
        .getElementById(
            "recordingBox"
        )
        .classList.remove(
            "show"
        );


    document
        .getElementById(
            "voiceBtn"
        )
        .textContent =
            "🎙️";
}


async function sendVoiceBlob(
    blob
){

    if(
        !blob ||
        !conversationId
    ){

        return;
    }


    try{

        const extension =
            blob.type.includes("mp4")
                ? "m4a"
                : "webm";


        const file =
            new File(
                [blob],
                "voice_" +
                Date.now() +
                "." +
                extension,
                {
                    type:blob.type
                }
            );


        const path =
            await uploadChatFile(
                file
            );


        if(!path){

            return;
        }


        const {
            data,
            error
        } = await supabaseClient
            .from("messages")
            .insert({
                conversation_id:
                    conversationId,

                sender_id:
                    currentUser.id,

                content:
                    null,

                message_type:
                    "audio",

                file_url:
                    path
            })
            .select()
            .single();


        if(error){

            console.error(error);

            showToast(
                error.message
            );

            return;
        }


        if(data){

            appendMessage(
                data,
                true
            );
        }

    }catch(error){

        console.error(error);

        showToast(
            error.message ||
            "Voice upload failed"
        );
    }
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

    if(!conversationId){

        return;
    }


    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );
    }


    realtimeChannel =
        supabaseClient
            .channel(
                "chat-" +
                conversationId +
                "-" +
                Date.now()
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },
                payload=>{

                    /*
                       Block হওয়ার পরে realtime message
                       এলে আর দেখানো হবে না।
                    */

                    if(blocked){

                        return;
                    }


                    appendMessage(
                        payload.new,
                        true
                    );
                }
            )
            .subscribe();
}

/* =========================================================
   TIME
========================================================= */

function formatTime(value){

    if(!value){

        return "";
    }


    const date =
        new Date(value);


    return date.toLocaleTimeString(
        currentLanguage === "bn"
            ? "bn-BD"
            : "en-US",
        {
            hour:"numeric",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

}

/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

    applyLanguage();


    currentUser =
        await getCurrentUser();


    if(!currentUser){

        return;
    }


    otherUserId =
        getOtherUserId();


    if(!otherUserId){

        showToast(
            t("noProfile")
        );

        return;
    }


    /*
       IMPORTANT:
       Profile বা Conversation load করার আগেই
       Block check হচ্ছে।
       
       তাই blocked ID-এর profile/chat
       আর খুলবে না।
    */

    const isBlocked =
        await checkBlockStatus();


    if(isBlocked){

        window.location.replace(
            "messages.html"
        );

        return;
    }


    await loadOtherProfile();


    await applyProfilePrivacy();


    conversationId =
        await findConversation();


    if(!conversationId){

        try{

            conversationId =
                await createConversation();

        }catch(error){

            console.error(
                "Conversation create error:",
                error
            );

            showToast(
                error.message
            );

            return;
        }
    }


    await loadMessages();


    subscribeRealtime();


    applyLanguage();
}


/* =========================================================
   START
========================================================= */

init();
