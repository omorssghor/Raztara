<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RAZTARA — Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Noto Sans Bengali",Arial,sans-serif;
    background:#f3f7f5;
    color:#17231e;
}

/* =========================
   MAIN
========================= */

.chatPage{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:#f3f7f5;
}

/* =========================
   TOP BAR
========================= */

.chatTop{
    height:68px;
    min-height:68px;
    padding:
        env(safe-area-inset-top)
        10px
        0
        10px;

    background:#087f5b;
    color:white;

    display:flex;
    align-items:center;
    gap:8px;

    box-shadow:0 2px 8px rgba(0,0,0,.15);
    z-index:10;
}

.topButton{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.14);
    color:white;

    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.topButton:active{
    transform:scale(.94);
    background:rgba(255,255,255,.25);
}

.userButton{
    flex:1;
    min-width:0;

    border:0;
    background:transparent;
    color:white;

    display:flex;
    align-items:center;
    gap:10px;

    text-align:left;
    cursor:pointer;
}

.userAvatar{
    width:42px;
    height:42px;
    min-width:42px;

    border-radius:50%;
    background:#d9eee7;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#087f5b;
    font-size:20px;
    font-weight:700;

    overflow:hidden;
}

.userAvatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.userInfo{
    min-width:0;
}

.userName{
    font-size:16px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.userStatus{
    margin-top:2px;
    font-size:12px;
    opacity:.85;
}

/* =========================
   CHAT AREA
========================= */

.chatBody{
    flex:1;
    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
    overflow:hidden;
}

.emptyChat{
    width:100%;
    max-width:360px;

    padding:28px 20px;

    text-align:center;

    background:white;
    border-radius:20px;

    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.emptyIcon{
    font-size:46px;
    margin-bottom:12px;
}

.emptyTitle{
    font-size:18px;
    font-weight:700;
    margin-bottom:7px;
}

.emptyText{
    color:#6d7772;
    font-size:14px;
    line-height:1.6;
}

/* =========================
   BOTTOM AREA
========================= */

.chatBottom{
    padding:
        8px
        10px
        calc(8px + env(safe-area-inset-bottom))
        10px;

    background:white;
    border-top:1px solid #e2e8e5;

    display:flex;
    align-items:center;
    gap:7px;

    box-shadow:0 -2px 10px rgba(0,0,0,.05);
}

.bottomButton{
    width:44px;
    height:44px;
    min-width:44px;

    border:0;
    border-radius:50%;

    background:#edf5f2;
    color:#087f5b;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.bottomButton:active{
    transform:scale(.93);
    background:#dcece6;
}

.messageBox{
    flex:1;
    min-width:0;

    height:44px;

    border:1px solid #d9e3df;
    border-radius:22px;

    padding:0 16px;

    outline:none;

    background:#f7faf9;
    color:#17231e;

    font-size:15px;
}

.messageBox:focus{
    border-color:#087f5b;
    background:white;
}

.sendButton{
    width:44px;
    height:44px;
    min-width:44px;

    border:0;
    border-radius:50%;

    background:#087f5b;
    color:white;

    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.sendButton:active{
    transform:scale(.93);
}

/* =========================
   MORE MENU
========================= */

.menu{
    position:fixed;

    top:72px;
    right:10px;

    width:210px;

    background:white;
    border-radius:16px;

    padding:7px;

    box-shadow:0 8px 30px rgba(0,0,0,.18);

    z-index:50;

    display:none;
}

.menu.show{
    display:block;
}

.menuButton{
    width:100%;
    min-height:46px;

    border:0;
    border-radius:11px;

    background:white;

    display:flex;
    align-items:center;

    gap:10px;

    padding:0 12px;

    font-size:14px;
    color:#17231e;

    text-align:left;

    cursor:pointer;
}

.menuButton:active{
    background:#edf5f2;
}

.menuIcon{
    width:25px;
    text-align:center;
    font-size:18px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:40;

    display:none;
}

.overlay.show{
    display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

    .chatTop{
        padding-left:6px;
        padding-right:6px;
    }

    .topButton{
        width:40px;
        height:40px;
    }

    .userAvatar{
        width:38px;
        height:38px;
        min-width:38px;
    }

    .bottomButton{
        width:40px;
        height:40px;
        min-width:40px;
    }

    .sendButton{
        width:40px;
        height:40px;
        min-width:40px;
    }
}
</style>
</head>

<body>

<div class="chatPage">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="chatTop">

        <button
            class="topButton"
            type="button"
            aria-label="Back"
            onclick="goBack()">
            ←
        </button>

        <button
            class="userButton"
            type="button"
            onclick="openProfile()">

            <div class="userAvatar">
                👤
            </div>

            <div class="userInfo">

                <div class="userName">
                    Chat User
                </div>

                <div class="userStatus">
                    Online
                </div>

            </div>

        </button>

        <button
            class="topButton"
            type="button"
            aria-label="Audio Call"
            onclick="openAudioCall()">
            📞
        </button>

        <button
            class="topButton"
            type="button"
            aria-label="Video Call"
            onclick="openVideoCall()">
            🎥
        </button>

        <button
            class="topButton"
            type="button"
            aria-label="More"
            onclick="toggleMenu()">
            ⋮
        </button>

    </header>


    <!-- =========================
         CHAT BODY
    ========================== -->

    <main class="chatBody">

        <div class="emptyChat">

            <div class="emptyIcon">
                💬
            </div>

            <div class="emptyTitle">
                নতুন Chat
            </div>

            <div class="emptyText">
                এখানে আপনার মেসেজগুলো দেখা যাবে।
                প্রতিটি Chat-এর button আলাদাভাবে তৈরি করা হবে।
            </div>

        </div>

    </main>


    <!-- =========================
         BOTTOM MESSAGE BAR
    ========================== -->

    <footer class="chatBottom">

        <button
            class="bottomButton"
            type="button"
            aria-label="Emoji"
            onclick="openEmoji()">
            😊
        </button>

        <button
            class="bottomButton"
            type="button"
            aria-label="Attachment"
            onclick="openAttachment()">
            📎
        </button>

        <input
            class="messageBox"
            id="messageInput"
            type="text"
            placeholder="মেসেজ লিখুন..."
            autocomplete="off">

        <button
            class="bottomButton"
            type="button"
            aria-label="Voice"
            onclick="openVoice()">
            🎤
        </button>

        <button
            class="sendButton"
            type="button"
            aria-label="Send"
            onclick="sendMessage()">
            ➤
        </button>

    </footer>

</div>


<!-- =========================
     OVERLAY
========================= -->

<div
    class="overlay"
    id="menuOverlay"
    onclick="closeMenu()">
</div>


<!-- =========================
     MORE MENU
========================= -->

<div
    class="menu"
    id="moreMenu">

    <button
        class="menuButton"
        type="button"
        onclick="openProfile()">

        <span class="menuIcon">👤</span>
        <span>Profile</span>

    </button>

    <button
        class="menuButton"
        type="button"
        onclick="openChatSearch()">

        <span class="menuIcon">🔍</span>
        <span>Search</span>

    </button>

    <button
        class="menuButton"
        type="button"
        onclick="openMedia()">

        <span class="menuIcon">🖼️</span>
        <span>Media & Files</span>

    </button>

    <button
        class="menuButton"
        type="button"
        onclick="openChatSettings()">

        <span class="menuIcon">⚙️</span>
        <span>Chat Settings</span>

    </button>

</div>


<script>

/* =========================
   BASIC BUTTON ACTIONS
   এখন শুধু navigation placeholder
========================= */

function goBack(){

    if(history.length > 1){
        history.back();
    }else{
        window.location.href = "index.html";
    }

}


function openProfile(){

    closeMenu();

    window.location.href = "user-profile.html";
}


function openAudioCall(){

    window.location.href = "audio-call.html";
}


function openVideoCall(){

    window.location.href = "video-call.html";
}


function openVoice(){

    window.location.href = "voice.html";
}


function openAttachment(){

    window.location.href = "attachment.html";
}


function openEmoji(){

    window.location.href = "emoji.html";
}


function openMedia(){

    closeMenu();

    window.location.href = "media.html";
}


function openChatSearch(){

    closeMenu();

    window.location.href = "chat-search.html";
}


function openChatSettings(){

    closeMenu();

    window.location.href = "chat-settings.html";
}


/* =========================
   SEND
========================= */

function sendMessage(){

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    /*
      এখন message database-এ যাবে না।
      পরে আলাদা message system তৈরি করব।
    */

    input.value = "";

}


/* =========================
   MORE MENU
========================= */

function toggleMenu(){

    const menu =
        document.getElementById("moreMenu");

    const overlay =
        document.getElementById("menuOverlay");

    const isOpen =
        menu.classList.contains("show");

    if(isOpen){

        closeMenu();

    }else{

        menu.classList.add("show");
        overlay.classList.add("show");

    }

}


function closeMenu(){

    document
        .getElementById("moreMenu")
        .classList.remove("show");

    document
        .getElementById("menuOverlay")
        .classList.remove("show");

}


/* =========================
   ENTER TO SEND
========================= */

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    });

</script>

</body>
</html>
