<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RAZTARA — Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Noto Sans Bengali",Arial,sans-serif;
    background:#f3f7f5;
    color:#17231e;
}

.chatPage{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:#f3f7f5;
}

/* =========================
   TOP BAR
========================= */

.chatTop{
    height:68px;
    min-height:68px;
    padding:
        env(safe-area-inset-top)
        10px
        0
        10px;

    background:#087f5b;
    color:white;

    display:flex;
    align-items:center;
    gap:8px;

    box-shadow:0 2px 8px rgba(0,0,0,.15);
    z-index:10;
}

.topButton{
    width:44px;
    height:44px;
    min-width:44px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.14);
    color:white;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.topButton:active{
    transform:scale(.94);
    background:rgba(255,255,255,.25);
}

/* =========================
   USER
========================= */

.userButton{
    flex:1;
    min-width:0;

    border:0;
    background:transparent;
    color:white;

    display:flex;
    align-items:center;
    gap:10px;

    text-align:left;
    cursor:pointer;
}

.userAvatar{
    width:42px;
    height:42px;
    min-width:42px;

    border-radius:50%;

    background:#d9eee7;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#087f5b;
    font-size:20px;
    font-weight:700;

    overflow:hidden;

    border:2px solid rgba(255,255,255,.65);
}

.userAvatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.userInfo{
    min-width:0;
}

.userName{
    font-size:16px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.userStatus{
    margin-top:2px;

    font-size:12px;
    opacity:.85;

    white-space:nowrap;
}

/* =========================
   CHAT BODY
========================= */

.chatBody{
    flex:1;
    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    overflow:hidden;
}

.emptyChat{
    width:100%;
    max-width:360px;

    padding:28px 20px;

    text-align:center;

    background:white;
    border-radius:20px;

    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.emptyIcon{
    font-size:46px;
    margin-bottom:12px;
}

.emptyTitle{
    font-size:18px;
    font-weight:700;
    margin-bottom:7px;
}

.emptyText{
    color:#6d7772;
    font-size:14px;
    line-height:1.6;
}

/* =========================
   MESSAGE BUTTON
========================= */

.openMessageButton{
    margin-top:18px;

    width:100%;
    height:48px;

    border:0;
    border-radius:24px;

    background:#087f5b;
    color:white;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    box-shadow:0 4px 12px rgba(8,127,91,.22);
}

.openMessageButton:active{
    transform:scale(.97);
}

/* =========================
   BOTTOM
========================= */

.chatBottom{
    padding:
        8px
        10px
        calc(8px + env(safe-area-inset-bottom))
        10px;

    background:white;

    border-top:1px solid #e2e8e5;

    display:flex;
    align-items:center;
    gap:7px;

    box-shadow:0 -2px 10px rgba(0,0,0,.05);
}

.bottomButton{
    width:44px;
    height:44px;
    min-width:44px;

    border:0;
    border-radius:50%;

    background:#edf5f2;
    color:#087f5b;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.bottomButton:active{
    transform:scale(.93);
    background:#dcece6;
}

.messageBox{
    flex:1;
    min-width:0;

    height:44px;

    border:1px solid #d9e3df;
    border-radius:22px;

    padding:0 16px;

    outline:none;

    background:#f7faf9;
    color:#17231e;

    font-size:15px;
}

.messageBox:focus{
    border-color:#087f5b;
    background:white;
}

.sendButton{
    width:44px;
    height:44px;
    min-width:44px;

    border:0;
    border-radius:50%;

    background:#087f5b;
    color:white;

    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.sendButton:active{
    transform:scale(.93);
}

/* =========================
   MORE MENU
========================= */

.menu{
    position:fixed;

    top:72px;
    right:10px;

    width:210px;

    background:white;

    border-radius:16px;

    padding:7px;

    box-shadow:0 8px 30px rgba(0,0,0,.18);

    z-index:50;

    display:none;
}

.menu.show{
    display:block;
}

.menuButton{
    width:100%;
    min-height:46px;

    border:0;
    border-radius:11px;

    background:white;

    display:flex;
    align-items:center;

    gap:10px;

    padding:0 12px;

    font-size:14px;
    color:#17231e;

    text-align:left;

    cursor:pointer;
}

.menuButton:active{
    background:#edf5f2;
}

.menuIcon{
    width:25px;
    text-align:center;
    font-size:18px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:40;

    display:none;
}

.overlay.show{
    display:block;
}

/* =========================
   STATUS
========================= */

.pageMessage{
    position:fixed;

    left:50%;
    bottom:90px;

    transform:translateX(-50%);

    width:calc(100% - 30px);
    max-width:420px;

    padding:12px 15px;

    border-radius:12px;

    background:#fff3cd;
    color:#664d03;

    font-size:14px;
    text-align:center;

    box-shadow:0 5px 20px rgba(0,0,0,.12);

    display:none;

    z-index:100;
}

.pageMessage.show{
    display:block;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:380px){

    .chatTop{
        padding-left:6px;
        padding-right:6px;
    }

    .topButton{
        width:40px;
        height:40px;
        min-width:40px;
    }

    .userAvatar{
        width:38px;
        height:38px;
        min-width:38px;
    }

    .bottomButton{
        width:40px;
        height:40px;
        min-width:40px;
    }

    .sendButton{
        width:40px;
        height:40px;
        min-width:40px;
    }
}
</style>
</head>

<body>

<div class="chatPage">

    <!-- TOP BAR -->

    <header class="chatTop">

        <button
            class="topButton"
            type="button"
            aria-label="Back"
            onclick="goBack()">
            ←
        </button>

        <button
            class="userButton"
            type="button"
            onclick="openProfile()">

            <div
                class="userAvatar"
                id="chatUserAvatar">
                👤
            </div>

            <div class="userInfo">

                <div
                    class="userName"
                    id="chatUserName">
                    Chat User
                </div>

                <div
                    class="userStatus"
                    id="chatUserStatus">
                    Loading...
                </div>

            </div>

        </button>

        <button
            class="topButton"
            type="button"
            aria-label="Audio Call"
            onclick="openAudioCall()">
            📞
        </button>

        <button
            class="topButton"
            type="button"
            aria-label="Video Call"
            onclick="openVideoCall()">
            🎥
        </button>

        <button
            class="topButton"
            type="button"
            aria-label="More"
            onclick="toggleMenu()">
            ⋮
        </button>

    </header>


    <!-- CHAT BODY -->

    <main class="chatBody">

        <div class="emptyChat">

            <div class="emptyIcon">
                💬
            </div>

            <div class="emptyTitle">
                মেসেজ
            </div>

            <div class="emptyText">
                এই ব্যক্তির সাথে মেসেজ করতে নিচের
                বাটনে চাপুন।
            </div>

            <button
                class="openMessageButton"
                type="button"
                onclick="openMessages()">
                💬 মেসেজ খুলুন
            </button>

        </div>

    </main>


    <!-- BOTTOM -->

    <footer class="chatBottom">

        <button
            class="bottomButton"
            type="button"
            aria-label="Emoji"
            onclick="openEmoji()">
            😊
        </button>

        <button
            class="bottomButton"
            type="button"
            aria-label="Attachment"
            onclick="openAttachment()">
            📎
        </button>

        <input
            class="messageBox"
            id="messageInput"
            type="text"
            placeholder="মেসেজ লিখুন..."
            autocomplete="off">

        <button
            class="bottomButton"
            type="button"
            aria-label="Voice"
            onclick="openVoice()">
            🎤
        </button>

        <button
            class="sendButton"
            type="button"
            aria-label="Send"
            onclick="sendMessage()">
            ➤
        </button>

    </footer>

</div>


<!-- OVERLAY -->

<div
    class="overlay"
    id="menuOverlay"
    onclick="closeMenu()">
</div>


<!-- MORE MENU -->

<div
    class="menu"
    id="moreMenu">

    <button
        class="menuButton"
        type="button"
        onclick="openProfile()">

        <span class="menuIcon">👤</span>
        <span>Profile</span>

    </button>

    <button
        class="menuButton"
        type="button"
        onclick="openChatSearch()">

        <span class="menuIcon">🔍</span>
        <span>Search</span>

    </button>

    <button
        class="menuButton"
        type="button"
        onclick="openMedia()">

        <span class="menuIcon">🖼️</span>
        <span>Media & Files</span>

    </button>

    <button
        class="menuButton"
        type="button"
        onclick="openChatSettings()">

        <span class="menuIcon">⚙️</span>
        <span>Chat Settings</span>

    </button>

</div>


<!-- STATUS -->

<div
    class="pageMessage"
    id="pageMessage">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CHAT USER ID
===================================================== */

const chatParams =
    new URLSearchParams(
        window.location.search
    );

const otherUserId =
    String(
        chatParams.get("user") || ""
    ).trim();


/* =====================================================
   MESSAGE
===================================================== */

function showPageMessage(message){

    const box =
        document.getElementById(
            "pageMessage"
        );

    if(!box){
        return;
    }

    box.textContent = message;

    box.classList.add("show");

    setTimeout(function(){

        box.classList.remove("show");

    },3000);
}


/* =====================================================
   USER ID CHECK
===================================================== */

function requireUserId(){

    if(!otherUserId){

        showPageMessage(
            "এই Chat-এর user ID পাওয়া যায়নি।"
        );

        return false;
    }

    return true;
}


/* =====================================================
   AVATAR URL
===================================================== */

function getAvatarUrl(value){

    const raw =
        String(value || "").trim();

    if(!raw){
        return "";
    }

    if(
        raw.startsWith("http://") ||
        raw.startsWith("https://")
    ){

        return raw;
    }

    const result =
        supabaseClient.storage
            .from("avatars")
            .getPublicUrl(raw);

    return result?.data?.publicUrl || "";
}


/* =====================================================
   SHOW AVATAR
===================================================== */

function showUserAvatar(url){

    const avatar =
        document.getElementById(
            "chatUserAvatar"
        );

    if(!avatar){
        return;
    }

    avatar.innerHTML = "";

    if(!url){

        avatar.textContent = "👤";

        return;
    }

    const img =
        document.createElement("img");

    img.src = url;
    img.alt = "User";
    img.loading = "eager";
    img.referrerPolicy = "no-referrer";

    img.onerror = function(){

        avatar.innerHTML = "";
        avatar.textContent = "👤";

    };

    avatar.appendChild(img);
}


/* =====================================================
   LOAD CHAT USER
===================================================== */

async function loadChatUser(){

    if(!otherUserId){

        document.getElementById(
            "chatUserName"
        ).textContent = "Chat User";

        document.getElementById(
            "chatUserStatus"
        ).textContent = "User ID পাওয়া যায়নি";

        showUserAvatar("");

        return;
    }


    const {
        data,
        error
    } = await supabaseClient

        .from("profiles")

        .select(`
            id,
            username,
            full_name,
            avatar_url,
            online_visibility,
            last_seen_at
        `)

        .eq("id", otherUserId)

        .maybeSingle();


    if(error){

        console.error(
            "Chat user load error:",
            error
        );

        document.getElementById(
            "chatUserStatus"
        ).textContent =
            "User তথ্য পাওয়া যায়নি";

        return;
    }


    if(!data){

        document.getElementById(
            "chatUserName"
        ).textContent =
            "Unknown User";

        document.getElementById(
            "chatUserStatus"
        ).textContent =
            "Profile পাওয়া যায়নি";

        showUserAvatar("");

        return;
    }


    const name =
        String(
            data.full_name ||
            data.username ||
            "Chat User"
        ).trim();


    document.getElementById(
        "chatUserName"
    ).textContent = name;


    const avatarUrl =
        getAvatarUrl(
            data.avatar_url
        );


    showUserAvatar(
        avatarUrl
    );


    /* =========================
       ONLINE STATUS
    ========================== */

    const status =
        document.getElementById(
            "chatUserStatus"
        );


    if(!status){
        return;
    }


    if(data.last_seen_at){

        const lastSeen =
            new Date(
                data.last_seen_at
            );

        const difference =
            Date.now() -
            lastSeen.getTime();


        if(
            difference >= 0 &&
            difference < 120000
        ){

            status.textContent =
                "Online";

        }else{

            status.textContent =
                "Last seen recently";

        }

    }else{

        status.textContent =
            "Online";

    }

}


/* =====================================================
   OPEN MESSAGES
===================================================== */

function openMessages(){

    if(!requireUserId()){
        return;
    }


    const url =
        "messages.html?user=" +
        encodeURIComponent(
            otherUserId
        );


    window.location.href =
        url;
}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage(){

    if(!requireUserId()){
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        String(
            input.value || ""
        ).trim();


    if(!text){

        openMessages();

        return;
    }


    /*
      এখানে সরাসরি database-এ insert করছি না।
      প্রথমে messages.html খুলবে।
      messages.html-ই actual messaging system চালাবে।
    */

    openMessages();

}


/* =====================================================
   PROFILE
===================================================== */

function openProfile(){

    closeMenu();

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "user-profile.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   AUDIO CALL
===================================================== */

function openAudioCall(){

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "audio-call.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   VIDEO CALL
===================================================== */

function openVideoCall(){

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "video-call.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   VOICE
===================================================== */

function openVoice(){

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "voice.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   ATTACHMENT
===================================================== */

function openAttachment(){

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "attachment.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   EMOJI
===================================================== */

function openEmoji(){

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "emoji.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   MEDIA
===================================================== */

function openMedia(){

    closeMenu();

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "media.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   CHAT SEARCH
===================================================== */

function openChatSearch(){

    closeMenu();

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "chat-search.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   CHAT SETTINGS
===================================================== */

function openChatSettings(){

    closeMenu();

    if(!requireUserId()){
        return;
    }

    window.location.href =
        "chat-settings.html?user=" +
        encodeURIComponent(
            otherUserId
        );
}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(
        document.referrer &&
        history.length > 1
    ){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


/* =====================================================
   MORE MENU
===================================================== */

function toggleMenu(){

    const menu =
        document.getElementById(
            "moreMenu"
        );

    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    const isOpen =
        menu.classList.contains(
            "show"
        );


    if(isOpen){

        closeMenu();

    }else{

        menu.classList.add(
            "show"
        );

        overlay.classList.add(
            "show"
        );

    }

}


function closeMenu(){

    const menu =
        document.getElementById(
            "moreMenu"
        );

    const overlay =
        document.getElementById(
            "menuOverlay"
        );


    if(menu){

        menu.classList.remove(
            "show"
        );

    }


    if(overlay){

        overlay.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   ENTER TO OPEN MESSAGES
===================================================== */

const messageInput =
    document.getElementById(
        "messageInput"
    );


if(messageInput){

    messageInput.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                openMessages();

            }

        }
    );

}


/* =====================================================
   START
===================================================== */

loadChatUser();

</script>

</body>
</html>
