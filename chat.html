<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075e54">
<title>RAZTARA — Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f7f8;
}

#loading{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    color:#075e54;
    font-size:16px;
}

.loader{
    width:38px;
    height:38px;
    border:4px solid #d8eeee;
    border-top-color:#075e54;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

#error{
    display:none;
    padding:30px;
    text-align:center;
    color:#b00020;
    font-size:16px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="loading">
    <div class="loader"></div>
    <div>Chat চালু হচ্ছে...</div>
</div>

<div id="error"></div>

<script>
"use strict";

const params = new URLSearchParams(window.location.search);

const otherUserId = String(
    params.get("user") ||
    params.get("id") ||
    ""
).trim();

function showError(message){
    document.getElementById("loading").style.display = "none";

    const errorBox = document.getElementById("error");
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function openMessages(){

    if(!otherUserId){
        showError("Chat user পাওয়া যায়নি। আবার Profile থেকে Chat খুলুন।");
        return;
    }

    const url =
        "messages.html?user=" +
        encodeURIComponent(otherUserId);

    /*
      replace ব্যবহার করা হয়েছে যাতে
      chat.html মাঝখানের history entry না হয়।
    */
    window.location.replace(url);
}

openMessages();
</script>

</body>
</html>
