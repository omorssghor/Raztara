<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAZTARA Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f6;
    color:#102b34;
}

.chatHeader{
    height:62px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:8px 12px;
    gap:10px;
    position:sticky;
    top:0;
    z-index:10;
}

.backBtn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:white;
    font-size:27px;
    cursor:pointer;
}

.chatAvatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#ddd;
    display:block;
}

.chatUserInfo{
    flex:1;
    min-width:0;
}

.chatUserName{
    font-size:16px;
    font-weight:bold;
}

.chatUserStatus{
    font-size:12px;
    opacity:.8;
    margin-top:3px;
}

.callBtn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:white;
    font-size:21px;
}

.messages{
    min-height:calc(100vh - 122px);
    padding:15px 12px 80px;
    overflow-y:auto;
}

.message{
    max-width:78%;
    padding:9px 12px;
    margin-bottom:8px;
    border-radius:12px;
    font-size:15px;
    line-height:1.4;
    word-break:break-word;
}

.message.me{
    margin-left:auto;
    background:#d9fdd3;
    border-bottom-right-radius:3px;
}

.message.other{
    margin-right:auto;
    background:white;
    border-bottom-left-radius:3px;
}

.messageTime{
    font-size:10px;
    color:#777;
    margin-top:4px;
    text-align:right;
}

.chatInputArea{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    min-height:60px;
    background:#f0f2f5;
    border-top:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px;
}

.attachBtn,
.voiceBtn,
.sendBtn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-size:19px;
}

.attachBtn{
    background:white;
}

.voiceBtn{
    background:white;
}

.sendBtn{
    background:#075e54;
    color:white;
}

.messageInput{
    flex:1;
    min-width:0;
    height:42px;
    border:0;
    outline:0;
    border-radius:22px;
    padding:0 15px;
    font-size:15px;
    background:white;
}

.emptyChat{
    text-align:center;
    color:#777;
    margin-top:40vh;
    font-size:14px;
}

</style>
</head>

<body>

<header class="chatHeader">

    <button
        class="backBtn"
        type="button"
        onclick="goBack()"
    >
        ‹
    </button>

    <img
        id="chatAvatar"
        class="chatAvatar"
        src="https://i.pravatar.cc/100?img=1"
        alt="Profile"
    >

    <div class="chatUserInfo">

        <div
            id="chatUserName"
            class="chatUserName"
        >
            Chat
        </div>

        <div
            id="chatUserStatus"
            class="chatUserStatus"
        >
            RAZTARA
        </div>

    </div>

    <button
        class="callBtn"
        type="button"
        onclick="startCall()"
    >
        📞
    </button>

</header>


<main
    id="messages"
    class="messages"
>

    <div
        id="emptyChat"
        class="emptyChat"
    >
        কোনো মেসেজ নেই
    </div>

</main>


<div class="chatInputArea">

    <button
        class="attachBtn"
        type="button"
        onclick="openAttachment()"
    >
        📎
    </button>

    <input
        id="messageInput"
        class="messageInput"
        type="text"
        placeholder="Message"
        autocomplete="off"
    >

    <button
        class="voiceBtn"
        type="button"
        onclick="startVoice()"
    >
        🎤
    </button>

    <button
        class="sendBtn"
        type="button"
        onclick="sendMessage()"
    >
        ➤
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;

let chatUserId = null;

let chatUserProfile = null;


/* =========================
   INIT CHAT
========================= */

async function initChat(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if(error || !data.user){

        window.location.href =
            "index.html";

        return;
    }


    currentUser =
        data.user;


    const params =
        new URLSearchParams(
            window.location.search
        );


    chatUserId =
        params.get("user");


    if(!chatUserId){

        document.getElementById(
            "chatUserName"
        ).textContent =
            "New Chat";

        return;
    }


    /* নিজের সাথে chat বন্ধ */

    if(chatUserId === currentUser.id){

        document.getElementById(
            "chatUserName"
        ).textContent =
            "Invalid User";

        return;
    }


    await loadChatUser(
        chatUserId
    );
const conversationId =
    await getConversationId(
        chatUserId
    );

startRealtimeChat(
    conversationId
);
}


/* =========================
   LOAD SELECTED USER
========================= */

async function loadChatUser(
    userId
){

    console.log(
        "CHAT USER ID:",
        userId
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id, username, full_name, avatar_url, bio"
        )
        .eq(
            "id",
            userId
        )
        .maybeSingle();


    if(error){

        console.error(
            "Profile load error:",
            error
        );

        document.getElementById(
            "chatUserName"
        ).textContent =
            "Profile Load Error";

        return;
    }


    if(!data){

        document.getElementById(
            "chatUserName"
        ).textContent =
            "User পাওয়া যায়নি";

        return;
    }


    /*
       খুব গুরুত্বপূর্ণ:
       এখানে শুধু URL-এর user ID-এর
       profile ব্যবহার হচ্ছে।
    */

    chatUserProfile =
        data;


    /* USER NAME */

    const userName =
        data.full_name ||
        data.username ||
        "User";


    document.getElementById(
        "chatUserName"
    ).textContent =
        userName;


    /* USER STATUS */

    document.getElementById(
        "chatUserStatus"
    ).textContent =
        data.username
        ? "@" + data.username
        : "RAZTARA";


    /* USER PROFILE PHOTO */

    const avatar =
        document.getElementById(
            "chatAvatar"
        );


    if(data.avatar_url){

        /*
           Supabase Storage থেকে
           ওই User-এর নিজের ছবি
        */

        avatar.src =
            data.avatar_url;

    }else{

        /*
           ওই User-এর ছবি না থাকলে
           শুধু default avatar
        */

        avatar.src =
            "https://i.pravatar.cc/100?img=1";

    }


    /*
       ছবি লোড হতে না পারলে
       অন্য কারও ছবি দেখাবে না
    */

    avatar.onerror =
        function(){

            this.onerror = null;

            this.src =
                "https://i.pravatar.cc/100?img=1";

        };


    await loadMessages(
        userId
    );

}


/* =========================
   GET CONVERSATION
========================= */

async function getConversationId(
    userId
){

    const {
        data,
        error
    } =
    await supabaseClient
        .rpc(
            "get_or_create_direct_conversation",
            {
                other_user_id:
                    userId
            }
        );


    if(error){

        console.error(
            "Conversation error:",
            error
        );

        return null;
    }


    return data;

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(
    userId
){

    const conversationId =
        await getConversationId(
            userId
        );


    if(!conversationId){

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("messages")
    .select(
        "id, sender_id, content, message_type, file_url, created_at"
    )
        )
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Message load error:",
            error
        );

        return;
    }


    const container =
        document.getElementById(
            "messages"
        );


    const empty =
        document.getElementById(
            "emptyChat"
        );


    container
        .querySelectorAll(
            ".message"
        )
        .forEach(
            el =>
                el.remove()
        );


    if(data && data.length){

        empty.style.display =
            "none";


        data.forEach(
            message => {

                addMessageToScreen(
                    message
                );

            }
        );

    }else{

        empty.style.display =
            "block";

    }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToScreen(message){

    const container =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            message.sender_id === currentUser.id
            ? "me"
            : "other"
        );

    /* =========================
       IMAGE
    ========================= */

    if(message.message_type === "image" && message.file_url){

        const img =
            document.createElement("img");

        img.src =
            message.file_url;

        img.style.maxWidth =
            "240px";

        img.style.maxHeight =
            "300px";

        img.style.borderRadius =
            "10px";

        img.style.display =
            "block";

        img.style.cursor =
            "pointer";

        img.onclick =
            function(){

                window.open(
                    message.file_url,
                    "_blank"
                );

            };

        div.appendChild(img);

    }

    /* =========================
       VIDEO
    ========================= */

    else if(
        message.message_type === "video" &&
        message.file_url
    ){

        const video =
            document.createElement("video");

        video.src =
            message.file_url;

        video.controls =
            true;

        video.style.maxWidth =
            "260px";

        video.style.borderRadius =
            "10px";

        div.appendChild(video);

    }

    /* =========================
       FILE
    ========================= */

    else if(
        message.message_type === "file" &&
        message.file_url
    ){

        const link =
            document.createElement("a");

        link.href =
            message.file_url;

        link.target =
            "_blank";

        link.textContent =
            "📎 " +
            (message.content || "File");

        link.style.color =
            "#075e54";

        link.style.fontWeight =
            "bold";

        link.style.textDecoration =
            "none";

        div.appendChild(link);

    }

    /* =========================
       NORMAL TEXT
    ========================= */

    else{

        const content =
            document.createElement("div");

        content.textContent =
            message.content || "";

        div.appendChild(content);

    }


    /* =========================
       TIME
    ========================= */

    const time =
        document.createElement("div");

    time.className =
        "messageTime";

    time.textContent =
        new Date(
            message.created_at
        ).toLocaleTimeString(
            "bn-BD",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    div.appendChild(time);

    container.appendChild(div);

    container.scrollTop =
        container.scrollHeight;
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const content =
        input.value.trim();


    if(!content){

        return;
    }


    if(!chatUserId){

        alert(
            "প্রথমে একজন User নির্বাচন করুন।"
        );

        return;
    }


    const conversationId =
        await getConversationId(
            chatUserId
        );


    if(!conversationId){

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
        .from("messages")
        .insert({

            conversation_id:
                conversationId,

            sender_id:
                currentUser.id,

            content:
                content,

            message_type:
                "text"

        })
        .select()
        .single();


    if(error){

        console.error(
            "Send message error:",
            error
        );

        alert(
            "মেসেজ পাঠানো যায়নি।"
        );

        return;
    }


    input.value = "";


    addMessageToScreen(
        data
    );

}


/* =========================
   ENTER SEND
========================= */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* =========================
   BACK
========================= */

function goBack(){

    window.location.href =
        "index.html";

}


/* =========================
   CALL
========================= */

function startCall(){

    alert(
        "Call feature পরের ধাপে যোগ করা হবে।"
    );

}


/* =========================
   ATTACHMENT
========================= */

async function openAttachment(){

    const input =
        document.createElement("input");

    input.type = "file";

    input.accept =
        "image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt";

    input.onchange = async function(){

        const file =
            input.files[0];

        if(!file){
            return;
        }

        if(!currentUser){
            alert("আগে Login করুন।");
            return;
        }

        const filePath =
            currentUser.id +
            "/" +
            Date.now() +
            "_" +
            file.name.replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );

        try{

            const {
                data,
                error
            } =
            await supabaseClient
                .storage
                .from("chat-files")
                .upload(
                    filePath,
                    file,
                    {
                        upsert:false
                    }
                );

            if(error){

                console.error(
                    "File upload error:",
                    error
                );

                alert(
                    "ফাইল Upload করা যায়নি।"
                );

                return;
            }

            console.log(
                "FILE UPLOADED:",
                data
            );

            const { data: signedData, error: signedError } =
    await supabaseClient
        .storage
        .from("chat-files")
        .createSignedUrl(
            filePath,
            60 * 60 * 24
        );

if(signedError){

    console.error(
        "Signed URL error:",
        signedError
    );

    alert(
        "ছবির URL তৈরি করা যায়নি।"
    );

    return;
}

const { data: publicData } =
    supabaseClient
        .storage
        .from("chat-files")
        .getPublicUrl(filePath);

const fileUrl =
    publicData.publicUrl;
const conversationId =
    await getConversationId(
        chatUserId
    );

if(!conversationId){

    alert("Conversation পাওয়া যায়নি।");
    return;

}

const {
    data: messageData,
    error: messageError
} =
await supabaseClient
    .from("messages")
    .insert({

        conversation_id:
            conversationId,

        sender_id:
            currentUser.id,

        content:
            file.name,

        message_type:
            file.type.startsWith("image/")
            ? "image"
            : file.type.startsWith("video/")
            ? "video"
            : "file",

        file_url:
            fileUrl

    })
    .select()
    .single();

if(messageError){

    console.error(
        "File message error:",
        messageError
    );

    alert(
        "ফাইল Upload হয়েছে, কিন্তু Chat-এ পাঠানো যায়নি।"
    );

    return;
}

addMessageToScreen(
    messageData
);

            alert(
                "ফাইল সফলভাবে Upload হয়েছে।"
            );

        }catch(error){

            console.error(
                "Upload error:",
                error
            );

            alert(
                "ফাইল Upload করার সময় সমস্যা হয়েছে।"
            );

        }

    };

    input.click();

}

/* =========================
   REALTIME CHAT
========================= */

let realtimeChannel = null;

function startRealtimeChat(conversationId){

    if(!conversationId){
        console.error("No conversation ID");
        return;
    }

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;
    }

    const channelName =
        "chat-" +
        conversationId +
        "-" +
        Date.now();

    realtimeChannel =
        supabaseClient
            .channel(channelName)

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages",
                    filter:
                        "conversation_id=eq." +
                        conversationId
                },

                (payload) => {

                    console.log(
                        "REALTIME NEW MESSAGE:",
                        payload.new
                    );

                    if(
                        payload.new.sender_id ===
                        currentUser.id
                    ){
                        return;
                    }

                    addMessageToScreen(
                        payload.new
                    );
                }
            )

            .subscribe((status, error) => {

                console.log(
                    "REALTIME STATUS:",
                    status
                );

                if(error){

                    console.error(
                        "REALTIME ERROR:",
                        error
                    );

                }

            });
}
/* =========================
   VOICE
========================= */

function startVoice(){

    alert(
        "Voice message পরের ধাপে যোগ করা হবে।"
    );

}


/* =========================
   START
========================= */

initChat();

</script>

</body>
</html>
