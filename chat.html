<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>RAZTARA — Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    margin:0;
    background:#f3f7f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    Roboto,"Noto Sans Bengali",Arial,sans-serif;
    color:#17231e;
}

.loading{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:14px;
}

.loader{
    width:42px;
    height:42px;

    border:4px solid #d9eee7;
    border-top-color:#087f5b;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

.loadingText{
    font-size:15px;
    color:#087f5b;
    font-weight:600;
}

.errorBox{
    display:none;

    position:fixed;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:calc(100% - 40px);
    max-width:420px;

    background:white;

    border-radius:18px;

    padding:24px 20px;

    text-align:center;

    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.errorBox.show{
    display:block;
}

.errorIcon{
    font-size:42px;
    margin-bottom:12px;
}

.errorTitle{
    font-size:18px;
    font-weight:700;
    margin-bottom:8px;
}

.errorText{
    color:#66736d;
    font-size:14px;
    line-height:1.6;
}

.backButton{
    margin-top:18px;

    width:100%;
    height:46px;

    border:0;
    border-radius:23px;

    background:#087f5b;
    color:white;

    font-size:15px;
    font-weight:700;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div
    class="loading"
    id="loading">

    <div class="loader"></div>

    <div class="loadingText">
        Chat চালু হচ্ছে...
    </div>

</div>

<div
    class="errorBox"
    id="errorBox">

    <div class="errorIcon">
        ⚠️
    </div>

    <div class="errorTitle">
        Chat খোলা যাচ্ছে না
    </div>

    <div
        class="errorText"
        id="errorText">
    </div>

    <button
        class="backButton"
        type="button"
        onclick="goHome()">
        ফিরে যান
    </button>

</div>

<script>
"use strict";

/* =====================================================
   GET USER ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const otherUserId =
    String(
        params.get("user") ||
        params.get("id") ||
        ""
    ).trim();


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("errorBox");

    const errorText =
        document.getElementById("errorText");

    if(loading){
        loading.style.display = "none";
    }

    if(errorText){
        errorText.textContent = message;
    }

    if(errorBox){
        errorBox.classList.add("show");
    }
}


/* =====================================================
   HOME
===================================================== */

function goHome(){

    window.location.href = "index.html";

}


/* =====================================================
   OPEN REAL MESSAGE PAGE
===================================================== */

function openRealMessages(){

    if(!otherUserId){

        showError(
            "এই Chat-এর user ID পাওয়া যায়নি। " +
            "দয়া করে আবার Profile থেকে Chat খুলুন।"
        );

        return;
    }

    /*
       chat.html এখন আর নিজে কোনো chat UI দেখাবে না।

       সরাসরি messages.html-এ যাবে।
    */

    const target =
        "messages.html?user=" +
        encodeURIComponent(
            otherUserId
        );

    /*
       replace ব্যবহার করা হয়েছে যাতে
       chat.html আলাদা history entry না রাখে।
    */

    window.location.replace(target);

}


/* =====================================================
   START
===================================================== */

openRealMessages();

</script>

</body>
</html>
