<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#087f5b">
<title>RAZTARA Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#087f5b;
  --green2:#0b9b70;
  --light:#f2f5f5;
  --white:#fff;
  --text:#172126;
  --muted:#748087;
  --line:#e2e8e8;
  --danger:#d83f3f;
  --blue:#2878d4;
  --keyboard-offset:0px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:var(--light);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    Arial,
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= HEADER ================= */

.chatHeader{
  position:fixed;
  z-index:100;
  top:0;
  left:0;
  right:0;

  height:calc(62px + env(safe-area-inset-top));

  padding:
    env(safe-area-inset-top)
    10px
    0
    10px;

  display:flex;
  align-items:center;
  gap:9px;

  background:var(--green);
  color:#fff;

  box-shadow:0 2px 12px #0002;
}

.backBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ffffff18;
  color:#fff;
  font-size:31px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.chatAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
  border:2px solid #ffffff55;
}

.chatUserInfo{
  min-width:0;
  flex:1;
}

.chatUserName{
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chatUserStatus{
  font-size:11px;
  opacity:.9;
  margin-top:2px;
  white-space:nowrap;
}

.headerBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ffffff18;
  color:#fff;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= MENU ================= */

.chatMenu{
  position:fixed;
  z-index:300;
  top:calc(58px + env(safe-area-inset-top));
  right:9px;

  width:190px;

  background:#fff;
  border-radius:15px;
  box-shadow:0 12px 35px #0003;
  padding:7px;

  display:none;
}

.chatMenu.show{
  display:block;
}

.menuItem{
  width:100%;
  text-align:left;
  padding:12px;
  border-radius:10px;
  background:#fff;
  color:#172126;
  font-weight:700;
}

.menuItem:active{
  background:#eef3f3;
}

.menuDanger{
  color:var(--danger);
}

/* ================= MESSAGES ================= */

.messages{
  position:fixed;
  z-index:1;

  top:calc(62px + env(safe-area-inset-top));
  bottom:calc(
    72px +
    env(safe-area-inset-bottom) +
    var(--keyboard-offset)
  );

  left:0;
  right:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding:12px 10px 18px;

  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.messagesInner{
  max-width:850px;
  margin:0 auto;
  min-height:100%;
}

.messageRow{
  position:relative;

  display:flex;
  width:100%;

  margin:5px 0;

  touch-action:pan-y;
}

.messageRow.me{
  justify-content:flex-end;
}

.messageRow.other{
  justify-content:flex-start;
}

.messageBubble{
  position:relative;

  max-width:min(78%,520px);

  padding:8px 9px 5px;

  border-radius:17px;

  background:#fff;

  box-shadow:0 1px 3px #0000000d;

  user-select:none;
  -webkit-user-select:none;

  transition:
    transform .16s ease,
    opacity .16s ease;
}

.messageRow.me .messageBubble{
  background:#d8f8ea;
  border-bottom-right-radius:5px;
}

.messageRow.other .messageBubble{
  border-bottom-left-radius:5px;
}

.messageBubble.swiping{
  transition:none;
}

.messageText{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:15px;
  line-height:1.48;
}

.messageImage,
.messageVideo{
  display:block;
  max-width:100%;
  max-height:330px;
  border-radius:12px;
  object-fit:contain;
  background:#000;
}

.messageAudio{
  width:230px;
  max-width:100%;
}

.fileBox{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px;
  background:#ffffffaa;
  border-radius:12px;
}

.fileIcon{
  font-size:28px;
}

.fileInfo{
  min-width:0;
}

.fileName{
  font-weight:800;
  font-size:13px;
  word-break:break-word;
}

.fileOpen{
  color:var(--blue);
  font-size:12px;
  font-weight:700;
  text-decoration:none;
}

.locationBox{
  display:flex;
  align-items:center;
  gap:9px;

  padding:11px;

  background:#fff;
  border-radius:12px;

  color:var(--blue);
  text-decoration:none;
  font-weight:800;
}

.messageCaption{
  margin-top:6px;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
}

.messageMeta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;

  margin-top:3px;

  color:#6e797d;
  font-size:10px;
}

.messageRow.me .messageMeta{
  color:#51836f;
}

.readTick{
  font-size:12px;
  letter-spacing:-4px;
  padding-right:3px;
}

.shareBtn{
  width:25px;
  height:25px;

  border-radius:50%;

  background:#00000008;
  color:#5e6b70;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:12px;
}

.shareBtn:active{
  background:#00000015;
}

.swipeHint{
  position:absolute;
  top:50%;
  transform:translateY(-50%);

  opacity:0;
  pointer-events:none;

  font-size:20px;
}

.messageRow.other .swipeHint{
  right:-35px;
}

.messageRow.me .swipeHint{
  left:-35px;
}

.emptyChat{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#899397;
  text-align:center;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:25px;
  color:#7b878b;
}

/* ================= INPUT ================= */

.chatInputArea{
  position:fixed;
  z-index:100;

  left:0;
  right:0;

  bottom:var(--keyboard-offset);

  min-height:72px;

  padding:
    7px
    8px
    calc(7px + env(safe-area-inset-bottom))
    8px;

  background:#fff;

  display:flex;
  align-items:flex-end;
  gap:7px;

  border-top:1px solid var(--line);

  box-shadow:0 -2px 12px #00000008;
}

.attachBtn,
.voiceBtn,
.sendBtn{
  flex:0 0 42px;

  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
}

.attachBtn{
  background:#edf3f2;
  color:#445;
}

.voiceBtn{
  background:#edf3f2;
}

.voiceBtn.recording{
  background:#ffe1e1;
  color:#d00;
  animation:pulse 1s infinite;
}

.sendBtn{
  background:var(--green);
  color:#fff;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
  }
}

.inputBox{
  flex:1;
  min-width:0;
}

.messageInput{
  width:100%;

  min-height:42px;
  max-height:120px;

  border:1px solid var(--line);
  border-radius:22px;

  outline:none;

  padding:10px 14px;

  background:#f6f8f8;

  font-size:15px;
}

.messageInput:focus{
  border-color:#9fcdbd;
  background:#fff;
}

/* ================= ATTACH MENU ================= */

.attachMenu{
  position:fixed;
  z-index:250;

  left:8px;
  bottom:
    calc(
      76px +
      env(safe-area-inset-bottom) +
      var(--keyboard-offset)
    );

  width:220px;

  background:#fff;

  border-radius:17px;

  padding:8px;

  box-shadow:0 12px 35px #0003;

  display:none;
}

.attachMenu.show{
  display:block;
}

.attachItem{
  width:100%;

  display:flex;
  align-items:center;
  gap:10px;

  padding:12px;

  border-radius:11px;

  background:#fff;

  text-align:left;

  font-weight:700;
}

.attachItem:active{
  background:#eef3f3;
}

/* ================= MODAL ================= */

.modalBackdrop{
  position:fixed;
  z-index:500;

  inset:0;

  background:#0006;

  display:none;

  align-items:flex-end;
  justify-content:center;
}

.modalBackdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:620px;

  max-height:88vh;

  background:#fff;

  border-radius:22px 22px 0 0;

  padding:
    14px
    14px
    calc(14px + env(safe-area-inset-bottom));

  overflow-y:auto;
}

.modalHandle{
  width:45px;
  height:5px;
  border-radius:20px;
  background:#d5dada;
  margin:0 auto 13px;
}

.modalTitle{
  font-size:18px;
  font-weight:900;
  margin-bottom:12px;
}

.modalBtn{
  width:100%;

  padding:13px;

  margin-top:7px;

  border-radius:12px;

  background:#f1f4f4;

  text-align:left;

  font-weight:800;
}

.modalBtn.green{
  background:#dff7ed;
  color:#087f5b;
}

.modalBtn.danger{
  background:#ffe4e4;
  color:#c93131;
}

.modalBtn.cancel{
  background:#172126;
  color:#fff;
  text-align:center;
}

/* ================= SHARE MODAL ================= */

.shareActions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.shareAction{
  padding:13px 8px;

  border-radius:13px;

  background:#f0f4f4;

  font-weight:800;

  text-align:center;
}

.shareAction.green{
  background:#dff7ed;
  color:#087f5b;
}

.shareAction.blue{
  background:#e4efff;
  color:#236bb7;
}

.shareUsersSearch{
  width:100%;

  border:1px solid var(--line);
  border-radius:12px;

  padding:11px;

  outline:none;

  margin-bottom:9px;
}

.shareUserList{
  max-height:48vh;
  overflow-y:auto;
}

.shareUser{
  width:100%;

  display:flex;
  align-items:center;

  gap:10px;

  padding:10px;

  background:#fff;

  border-radius:12px;

  text-align:left;
}

.shareUser:active{
  background:#eef3f3;
}

.shareUserAvatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}

.shareUserInfo{
  min-width:0;
  flex:1;
}

.shareUserName{
  font-weight:900;
}

.shareUserUsername{
  font-size:11px;
  color:var(--muted);
}

/* ================= TOAST ================= */

.toast{
  position:fixed;

  z-index:1000;

  left:50%;
  bottom:
    calc(
      88px +
      env(safe-area-inset-bottom) +
      var(--keyboard-offset)
    );

  transform:translateX(-50%) translateY(10px);

  max-width:90%;

  padding:11px 15px;

  border-radius:13px;

  background:#172126;
  color:#fff;

  font-size:13px;
  font-weight:700;

  opacity:0;

  pointer-events:none;

  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= PROFILE PHOTO ================= */

.photoModal{
  align-items:center;
}

.photoModal .modal{
  background:transparent;
  box-shadow:none;
  max-width:100%;
  padding:20px;
  overflow:visible;
}

.bigPhoto{
  width:100%;
  max-height:75vh;
  object-fit:contain;
  border-radius:15px;
}

.closePhoto{
  display:block;
  margin:12px auto 0;

  width:42px;
  height:42px;

  border-radius:50%;

  background:#fff;
  color:#111;

  font-size:20px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:520px){
  .messageBubble{
    max-width:84%;
  }

  .shareActions{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(min-width:700px){
  .chatInputArea{
    padding-left:max(8px,calc((100vw - 850px)/2));
    padding-right:max(8px,calc((100vw - 850px)/2));
  }

  .messages{
    padding-left:20px;
    padding-right:20px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="chatHeader">

  <button class="backBtn" onclick="goBack()">‹</button>

  <img
    id="chatAvatar"
    class="chatAvatar"
    src="https://i.pravatar.cc/100?img=1"
    onclick="openUserProfilePhoto()"
    alt="Profile"
  >

  <div class="chatUserInfo">
    <div id="chatUserName" class="chatUserName">Chat</div>
    <div id="chatUserStatus" class="chatUserStatus">Offline</div>
  </div>

  <button
    class="headerBtn"
    onclick="startCall()"
    title="Call"
  >📞</button>

  <button
    class="headerBtn"
    onclick="toggleChatMenu(event)"
  >⋮</button>

</header>

<!-- ================= CHAT MENU ================= -->

<div id="chatMenu" class="chatMenu">

  <button class="menuItem" onclick="viewProfile()">
    👤 Profile
  </button>

  <button
    id="blockMenuItem"
    class="menuItem"
    onclick="toggleBlock()"
  >
    🚫 Block
  </button>

  <button
    id="unblockMenuItem"
    class="menuItem"
    onclick="toggleBlock()"
    style="display:none"
  >
    ✅ Unblock
  </button>

  <button
    class="menuItem menuDanger"
    onclick="deleteChatDialog()"
  >
    🗑️ Delete Chat
  </button>

</div>

<!-- ================= MESSAGES ================= -->

<main id="messages" class="messages">

  <div id="messagesInner" class="messagesInner">

    <div class="loading">
      Loading...
    </div>

  </div>

</main>

<!-- ================= ATTACH MENU ================= -->

<div id="attachMenu" class="attachMenu">

  <button class="attachItem" onclick="pickImage()">
    🖼️ Photo
  </button>

  <button class="attachItem" onclick="pickVideo()">
    🎬 Video
  </button>

  <button class="attachItem" onclick="pickFile()">
    📄 File
  </button>

  <button class="attachItem" onclick="sendLocation()">
    📍 Location
  </button>

</div>

<input
  id="imageInput"
  type="file"
  accept="image/*"
  hidden
  onchange="handleFileSelect(this,'image')"
>

<input
  id="videoInput"
  type="file"
  accept="video/*"
  hidden
  onchange="handleFileSelect(this,'video')"
>

<input
  id="fileInput"
  type="file"
  hidden
  onchange="handleFileSelect(this,'file')"
>

<!-- ================= BOTTOM ================= -->

<div class="chatInputArea">

  <button
    class="attachBtn"
    onclick="toggleAttachMenu()"
  >📎</button>

  <div class="inputBox">
    <input
      id="messageInput"
      class="messageInput"
      type="text"
      placeholder="Message"
      autocomplete="off"
      enterkeyhint="send"
    >
  </div>

  <button
    id="voiceBtn"
    class="voiceBtn"
    onclick="toggleVoiceRecording()"
  >🎤</button>

  <button
    class="sendBtn"
    onclick="sendMessage()"
  >➤</button>

</div>

<!-- ================= MESSAGE OPTIONS ================= -->

<div id="messageOptionsModal" class="modalBackdrop">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalTitle">
      Message options
    </div>

    <button
      class="modalBtn green"
      onclick="shareSelectedMessage()"
    >
      📤 Share / Forward
    </button>

    <button
      class="modalBtn"
      onclick="deleteSelectedMessageOnlyMe()"
    >
      🗑️ Delete for me
    </button>

    <button
      id="deleteSelectedAllBtn"
      class="modalBtn danger"
      onclick="deleteSelectedMessageForEveryone()"
    >
      🗑️ Delete for everyone
    </button>

    <button
      class="modalBtn cancel"
      onclick="closeModal('messageOptionsModal')"
    >
      Cancel
    </button>

  </div>

</div>

<!-- ================= SHARE OPTIONS ================= -->

<div id="shareModal" class="modalBackdrop">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalTitle">
      📤 Share
    </div>

    <div class="shareActions">

      <button
        class="shareAction green"
        onclick="openForwardUsers()"
      >
        💬 RAZTARA
      </button>

      <button
        class="shareAction"
        onclick="shareNative()"
      >
        📱 Other Apps
      </button>

      <button
        class="shareAction"
        onclick="shareWhatsApp()"
      >
        🟢 WhatsApp
      </button>

      <button
        class="shareAction"
        onclick="shareTelegram()"
      >
        🔵 Telegram
      </button>

      <button
        class="shareAction"
        onclick="shareSMS()"
      >
        💬 SMS
      </button>

      <button
        class="shareAction"
        onclick="shareEmail()"
      >
        ✉️ Email
      </button>

      <button
        class="shareAction"
        onclick="shareFacebook()"
      >
        🔵 Facebook
      </button>

      <button
        class="shareAction"
        onclick="shareNative()"
      >
        👥 Messenger / IMO
      </button>

    </div>

    <button
      class="modalBtn cancel"
      onclick="closeModal('shareModal')"
    >
      Cancel
    </button>

  </div>

</div>

<!-- ================= FORWARD USERS ================= -->

<div id="forwardModal" class="modalBackdrop">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalTitle">
      💬 RAZTARA user-কে Forward
    </div>

    <input
      id="shareUserSearch"
      class="shareUsersSearch"
      placeholder="নাম বা username খুঁজুন..."
      oninput="filterShareUsers()"
    >

    <div
      id="shareUserList"
      class="shareUserList"
    ></div>

    <button
      class="modalBtn cancel"
      onclick="closeModal('forwardModal')"
    >
      Cancel
    </button>

  </div>

</div>

<!-- ================= DELETE CHAT ================= -->

<div id="deleteChatModal" class="modalBackdrop">

  <div class="modal">

    <div class="modalHandle"></div>

    <div class="modalTitle">
      🗑️ Delete Chat
    </div>

    <button
      class="modalBtn"
      onclick="deleteChatOnlyMe()"
    >
      🗑️ Delete for me
    </button>

    <button
      class="modalBtn danger"
      onclick="deleteChatForEveryone()"
    >
      🗑️ Delete for everyone
    </button>

    <button
      class="modalBtn cancel"
      onclick="closeModal('deleteChatModal')"
    >
      Cancel
    </button>

  </div>

</div>

<!-- ================= PHOTO ================= -->

<div id="photoModal" class="modalBackdrop photoModal">

  <div class="modal">

    <img
      id="bigPhoto"
      class="bigPhoto"
      src=""
      alt="Profile"
    >

    <button
      class="closePhoto"
      onclick="closeModal('photoModal')"
    >
      ✕
    </button>

  </div>

</div>

<!-- ================= TOAST ================= -->

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const STORAGE_BUCKET = "chat-files";

/* =========================================================
   STATE
========================================================= */

const params = new URLSearchParams(location.search);

let conversationId =
  params.get("conversation") ||
  params.get("conversation_id") ||
  "";

let otherUserId =
  params.get("user") ||
  params.get("user_id") ||
  "";

let currentUser = null;
let otherUser = null;

let messagesCache = new Map();

let selectedMessage = null;

let shareTargetMessage = null;

let shareUsers = [];

let presenceChannel = null;
let typingChannel = null;
let messagesChannel = null;

let isBlocked = false;

let mediaRecorder = null;
let mediaStream = null;
let recordedChunks = [];
let recordingMime = "";

let typingTimer = null;
let typingSent = false;

let longPressTimer = null;

let isLoadingMessages = false;

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeUrl(url){
  try{
    const u = new URL(url);

    if(
      u.protocol === "https:" ||
      u.protocol === "http:"
    ){
      return u.href;
    }

    return "#";
  }catch{
    return "#";
  }
}

function toast(message){
  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(el._timer);

  el._timer =
    setTimeout(() => {
      el.classList.remove("show");
    },2300);
}

function closeModal(id){
  $(id)?.classList.remove("show");
}

function openModal(id){

    setupKeyboardHandling();

    await loadBlockedState();

    await loadMessages();

    subscribeMessages();

    setupPresence();

    setupTyping();

    updateBlockButtons();

    await updateMyLastSeen();

      updateMyLastSeen,

    );

  }catch(error){

/* =========================================================
   BLOCK
========================================================= */

async function loadBlockedState(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("blocked_users")
      .select("id,blocker_id,blocked_id")
      .eq("blocker_id",currentUser.id)
      .eq("blocked_id",otherUserId)
      .maybeSingle();

  if(error){
    console.error(error);
  }

  isBlocked = !!data;

  /*
    Opposite-side block is enforced by DB.
    If message/call fails with blocked error,
    frontend also handles it.
  */

  updateBlockButtons();
}

function updateBlockButtons(){

  const blockBtn =
    $("blockMenuItem");

  const unblockBtn =
    $("unblockMenuItem");

  if(!blockBtn || !unblockBtn){
    return;
  }

  if(isBlocked){

    blockBtn.style.display = "none";
    unblockBtn.style.display = "block";

  }else{

    blockBtn.style.display = "block";
    unblockBtn.style.display = "none";
  }
}

async function toggleBlock(){

  closeMenus();

  try{

    if(isBlocked){

      const {
        error
      } =
        await supabaseClient
          .from("blocked_users")
          .delete()
          .eq("blocker_id",currentUser.id)
          .eq("blocked_id",otherUserId);

      if(error){
        throw error;
      }

      isBlocked = false;

      toast("Unblocked");

    }else{

      const {
        error
      } =
        await supabaseClient
          .from("blocked_users")
          .insert({
            blocker_id:currentUser.id,
            blocked_id:otherUserId
          });

      if(error){
        throw error;
      }

      isBlocked = true;

      toast("User blocked");
    }

    updateBlockButtons();

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Block পরিবর্তন করা যায়নি"
    );
  }
}

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  if(isLoadingMessages){
    return;
  }

  isLoadingMessages = true;

  const inner = $("messagesInner");

  inner.innerHTML =
    `<div class="loading">Loading...</div>`;

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .select("*")
        .eq("conversation_id",conversationId)
        .order("created_at",{ascending:true});

    if(error){
      throw error;
    }

    messagesCache.clear();

    const ids =
      (data || []).map(m => m.id);

    let hiddenIds = new Set();

    if(ids.length){

      const {
        data:hidden
      } =
        await supabaseClient
          .from("message_user_deletions")
          .select("message_id")
          .eq("user_id",currentUser.id)
          .in("message_id",ids);

      hiddenIds =
        new Set(
          (hidden || [])
            .map(x => x.message_id)
        );
    }

    inner.innerHTML = "";

    let count = 0;

    for(const message of (data || [])){

      if(hiddenIds.has(message.id)){
        continue;
      }

      messagesCache.set(
        message.id,
        message
      );

      renderMessage(message);

      count++;
    }

    if(!count){

      inner.innerHTML =
        `<div class="emptyChat">
          এখনো কোনো message নেই।
        </div>`;
    }

    scrollToBottom();

    await markMessagesRead();

  }catch(error){

    console.error(error);

    inner.innerHTML =
      `<div class="emptyChat">
        Message load করতে সমস্যা হয়েছে।
      </div>`;

  }finally{

    isLoadingMessages = false;
  }
}

/* =========================================================
   REALTIME
========================================================= */

function subscribeMessages(){

  if(messagesChannel){
    supabaseClient.removeChannel(
      messagesChannel
    );
  }

  messagesChannel =
    supabaseClient
      .channel(
        "messages-" +
        conversationId +
        "-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          const message =
            payload.new;

          if(
            messagesCache.has(message.id)
          ){
            return;
          }

          messagesCache.set(
            message.id,
            message
          );

          const empty =
            $("messagesInner")
              .querySelector(".emptyChat");

          if(empty){
            empty.remove();
          }

          renderMessage(message);

          if(
            message.sender_id !==
            currentUser.id
          ){
            markMessagesRead();
          }

          scrollToBottom();
        }
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          const message =
            payload.new;

          messagesCache.set(
            message.id,
            message
          );

          const old =
            document.querySelector(
              `[data-message-id="${message.id}"]`
            );

          if(old){
            old.remove();
          }

          renderMessage(message);
        }
      )
      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          const id =
            payload.old?.id;

          if(!id){
            return;
          }

          messagesCache.delete(id);

          const row =
            document.querySelector(
              `[data-message-id="${id}"]`
            );

          if(row){
            row.remove();
          }

          if(
            !$("messagesInner")
              .querySelector(".messageRow")
          ){

            $("messagesInner").innerHTML =
              `<div class="emptyChat">
                এখন কোনো message নেই।
              </div>`;
          }
        }
      )
      .subscribe();
}

/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(message){

  if(
    document.querySelector(
      `[data-message-id="${message.id}"]`
    )
  ){
    return;
  }

  const row =
    document.createElement("div");

  row.className =
    "messageRow " +
    (
      message.sender_id === currentUser.id
      ? "me"
      : "other"
    );

  row.dataset.messageId =
    message.id;

  const bubble =
    document.createElement("div");

  bubble.className =
    "messageBubble";

  bubble.innerHTML =
    buildMessageContent(message);

  row.appendChild(bubble);

  setupSwipe(row,message);

  setupLongPress(
    row,
    message
  );

  $("messagesInner")
    .appendChild(row);

  return row;
}

/* =========================================================
   MESSAGE CONTENT
========================================================= */

function buildMessageContent(message){

  const type =
    message.message_type || "text";

  const content =
    message.content || "";

  const url =
    message.file_url || "";

  let html = "";

  if(type === "text"){

    html +=
      `<div class="messageText">
        ${esc(content)}
      </div>`;

  }else if(type === "image"){

    if(url){

      html +=
        `<img
          class="messageImage"
          src="${safeUrl(url)}"
          alt="image"
          loading="lazy"
          onclick="openMedia('${esc(url)}')"
        >`;
    }

    if(content){

      html +=
        `<div class="messageCaption">
          ${esc(content)}
        </div>`;
    }

  }else if(type === "video"){

    if(url){

      html +=
        `<video
          class="messageVideo"
          controls
          playsinline
          preload="metadata"
          src="${safeUrl(url)}"
        ></video>`;
    }

    if(content){

      html +=
        `<div class="messageCaption">
          ${esc(content)}
        </div>`;
    }

  }else if(type === "audio"){

    if(url){

      html +=
        `<audio
          class="messageAudio"
          controls
          preload="metadata"
          src="${safeUrl(url)}"
        ></audio>`;
    }

    if(content){

      html +=
        `<div class="messageCaption">
          ${esc(content)}
        </div>`;
    }

  }else if(type === "file"){

    const name =
      content ||
      "File";

    html +=
      `<div class="fileBox">

        <div class="fileIcon">📄</div>

        <div class="fileInfo">

          <div class="fileName">
            ${esc(name)}
          </div>

          <a
            class="fileOpen"
            href="${safeUrl(url)}"
            target="_blank"
            rel="noopener"
          >
            Open file
          </a>

        </div>

      </div>`;

  }else if(type === "location"){

    let lat = "";
    let lng = "";

    try{

      const obj =
        JSON.parse(content);

      lat = obj.lat;
      lng = obj.lng;

    }catch{

      const parts =
        content.split(",");

      lat = parts[0];
      lng = parts[1];
    }

    const mapUrl =
      `https://www.google.com/maps?q=${encodeURIComponent(lat + "," + lng)}`;

    html +=
      `<a
        class="locationBox"
        href="${safeUrl(mapUrl)}"
        target="_blank"
        rel="noopener"
      >
        📍 View location
      </a>`;
  }

  const time =
    formatTime(message.created_at);

  const read =
    message.sender_id === currentUser.id
      ? (
          message.is_read
          ? `<span class="readTick">✓✓</span>`
          : `<span class="readTick">✓</span>`
        )
      : "";

  html +=
    `<div class="messageMeta">

      <span>${esc(time)}</span>

      ${read}

      <button
        class="shareBtn"
        onclick="event.stopPropagation();shareMessageById('${message.id}')"
        title="Share"
      >
        ↗
      </button>

    </div>`;

  return html;
}

function formatTime(date){

  if(!date){
    return "";
  }

  return new Date(date)
    .toLocaleTimeString(
      "bn-BD",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );
}

/* =========================================================
   SWIPE
========================================================= */

function setupSwipe(row,message){

  const bubble =
    row.querySelector(".messageBubble");

  let startX = 0;
  let startY = 0;
  let moved = false;

  row.addEventListener(
    "touchstart",
    event => {

      if(
        event.touches.length !== 1
      ){
        return;
      }

      startX =
        event.touches[0].clientX;

      startY =
        event.touches[0].clientY;

      moved = false;
    },
    {
      passive:true
    }
  );

  row.addEventListener(
    "touchmove",
    event => {

      if(
        event.touches.length !== 1
      ){
        return;
      }

      const dx =
        event.touches[0].clientX -
        startX;

      const dy =
        event.touches[0].clientY -
        startY;

      if(
        Math.abs(dy) >
        Math.abs(dx)
      ){
        return;
      }

      if(
        Math.abs(dx) < 10
      ){
        return;
      }

      moved = true;

      const limited =
        Math.max(
          -85,
          Math.min(85,dx)
        );

      bubble.style.transform =
        `translateX(${limited}px)`;
    },
    {
      passive:true
    }
  );

  row.addEventListener(
    "touchend",
    event => {

      bubble.style.transform = "";

      if(!moved){
        return;
      }

      const endX =
        event.changedTouches[0].clientX;

      const dx =
        endX - startX;

      if(dx > 65){

        shareMessage(message);

      }else if(dx < -65){

        openMessageOptions(message);
      }
    },
    {
      passive:true
    }
  );
}

/* =========================================================
   LONG PRESS
========================================================= */

function setupLongPress(row,message){

  const start = () => {

    clearTimeout(longPressTimer);

    longPressTimer =
      setTimeout(() => {

        if(navigator.vibrate){
          navigator.vibrate(25);
        }

        openMessageOptions(message);

      },550);
  };

  const cancel = () => {
    clearTimeout(longPressTimer);
  };

  row.addEventListener(
    "touchstart",
    start,
    {passive:true}
  );

  row.addEventListener(
    "touchend",
    cancel,
    {passive:true}
  );

  row.addEventListener(
    "touchmove",
    cancel,
    {passive:true}
  );

  row.addEventListener(
    "touchcancel",
    cancel,
    {passive:true}
  );
}

/* =========================================================
   SHARE TEXT
========================================================= */

function getShareData(message){

  if(!message){

    return {
      text:"RAZTARA",
      url:""
    };
  }

  const type =
    message.message_type || "text";

  let text = "";
  let url =
    message.file_url || "";

  if(type === "text"){

    text =
      message.content || "";

  }else if(type === "location"){

    try{

      const obj =
        JSON.parse(
          message.content || "{}"
        );

      const mapUrl =
        `https://www.google.com/maps?q=${encodeURIComponent(
          obj.lat + "," + obj.lng
        )}`;

      text =
        "📍 RAZTARA location";

      url =
        mapUrl;

    }catch{

      text =
        "📍 RAZTARA location";
    }

  }else{

    text =
      message.content ||
      "RAZTARA shared content";
  }

  return {
    text,
    url
  };
}

/* =========================================================
   NATIVE SHARE
========================================================= */

async function shareNative(){

  const {
    text,
    url
  } =
    getShareData(
      shareTargetMessage
    );

  closeModal("shareModal");

  try{

    if(navigator.share){

      const data = {
        title:"RAZTARA",
        text:text || "RAZTARA"
      };

      if(url){
        data.url = url;
      }

      await navigator.share(data);

      return;
    }

    await navigator.clipboard.writeText(
      [text,url]
        .filter(Boolean)
        .join("\n")
    );

    toast(
      "Share link/text copied"
    );

  }catch(error){

    if(
      error?.name !==
      "AbortError"
    ){

      console.error(error);

      toast(
        "Share করা যায়নি"
      );
    }
  }
}

async function forwardToUser(userId){

  if(!shareTargetMessage){
    return;
  }

  try{

    const {
      data:targetConversation,
      error:conversationError
    } =
      await supabaseClient.rpc(
        "get_or_create_direct_conversation",
        {
          other_user_id:userId
        }
      );

    if(conversationError){
      throw conversationError;
    }

    const message =
      shareTargetMessage;

    /*
      Existing message schema ব্যবহার করছি।
      কোনো নতুন forwarded column দরকার নেই।
    */

    let content =
      message.content || null;

    /*
      Location JSON unchanged রাখা হচ্ছে,
      যাতে receiver আবার map খুলতে পারে।
    */

async function handleFileSelect(input,type){

  const file =
    input.files?.[0];

  input.value = "";

  if(!file){
    return;
  }

  if(isBlocked){

    toast(
      "Blocked user-কে message পাঠানো যাবে না"
    );

    return;
  }

  /*
    6 MB limit
  */

  if(file.size > 6 * 1024 * 1024){

    toast(
      "File সর্বোচ্চ 6 MB হতে পারবে"
    );

    return;
  }

  try{

    toast("Upload হচ্ছে...");

    const ext =
      (
        file.name.split(".").pop() ||
        "bin"
      ).toLowerCase();

    const path =
      `${currentUser.id}/${conversationId}/${Date.now()}-${crypto.randomUUID()}.${ext}`;

    const {
      error:uploadError
    } =
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );

    if(uploadError){
      throw uploadError;
    }

    const {
      data:publicData
    } =
      supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(path);

    const fileUrl =
      publicData.publicUrl;

    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:
            conversationId,

          sender_id:
            currentUser.id,

          content:
            type === "file"
              ? file.name
              : null,

          message_type:
            type,

          file_url:
            fileUrl,

          is_read:false
        });

    if(error){
      throw error;
    }

  }catch(error){

    console.error(error);

    if(
      String(error?.message || "")
        .toLowerCase()
        .includes("blocked")
    ){

      toast(
        "User blocked আছে"
      );

    }else{

      toast(
        error?.message ||
        "Upload করা যায়নি"
      );

  }

/* =========================================================
   VOICE RECORDING
========================================================= */

function getSupportedAudioMime(){

  const types = [

    /*
      iPhone/Safari first
    */

    "audio/mp4",

    "audio/aac",

    /*
      Other browsers
    */

    "audio/webm;codecs=opus",

    "audio/webm",

    "audio/ogg;codecs=opus",

    "audio/ogg"

  ];

  if(
    !window.MediaRecorder
  ){
    return "";
  }

  for(const type of types){

    try{

      if(
        MediaRecorder.isTypeSupported(type)
      ){
        return type;
      }

    }catch{}
  }

  return "";
}

async function toggleVoiceRecording(){

  if(mediaRecorder){

    stopVoiceRecording();

  }else{

    await startVoiceRecording();
  }
}

async function startVoiceRecording(){

  if(isBlocked){

    toast(
      "Blocked user-কে voice পাঠানো যাবে না"
    );

    return;
  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    toast(
      "এই browser-এ microphone support নেই"
    );

    return;
  }

  if(
    !window.MediaRecorder
  ){

    toast(
      "এই iPhone/browser-এ voice recording support নেই"
    );

    return;
  }

  try{

    mediaStream =
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });

    recordingMime =
      getSupportedAudioMime();

    if(!recordingMime){

      mediaStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      mediaStream = null;

      toast(
        "Audio format support পাওয়া যায়নি"
      );

      return;
    }

    recordedChunks = [];

    const options = {
      mimeType:
        recordingMime
    };

    mediaRecorder =
      new MediaRecorder(
        mediaStream,
        options
      );

    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size
        ){

          recordedChunks.push(
            event.data
          );
        }
      };

    mediaRecorder.onerror =
      event => {

        console.error(
          "Recorder error:",
          event
        );

        toast(
          "Voice recording error"
        );
      };

    mediaRecorder.onstop =
      async () => {

        const chunks =
          [...recordedChunks];

        const mime =
          recordingMime ||
          mediaRecorder?.mimeType ||
          "audio/mp4";

        cleanupRecorder();

        if(!chunks.length){

          toast(
            "কোনো voice পাওয়া যায়নি"
          );

          return;
        }

        const blob =
          new Blob(
            chunks,
            {
              type:mime
            }
          );

        await uploadVoice(
          blob,
          mime
        );
      };

    mediaRecorder.start(
      250
    );

    $("voiceBtn")
      .classList.add("recording");

    $("voiceBtn").textContent =
      "⏹";

    toast(
      "Recording চলছে..."
    );

  }catch(error){

    console.error(error);

    cleanupRecorder();

    if(
      error?.name ===
      "NotAllowedError"
    ){

      toast(
        "Microphone permission দিন"
      );

    }else{

      toast(
        "Voice recording শুরু করা যায়নি"
      );
    }
  }
}

function stopVoiceRecording(){

  if(!mediaRecorder){
    return;
  }

  try{

    if(
      mediaRecorder.state !==
      "inactive"
    ){

      mediaRecorder.stop();
    }

  }catch(error){

    console.error(error);

    cleanupRecorder();
  }
}

function cleanupRecorder(){

  $("voiceBtn")
    .classList.remove("recording");

  $("voiceBtn").textContent =
    "🎤";

  if(mediaStream){

    mediaStream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  mediaStream = null;

  mediaRecorder = null;
}

async function uploadVoice(blob,mime){

  if(isBlocked){

    toast(
      "User blocked আছে"
    );

    return;
  }

  try{

    toast(
      "Voice upload হচ্ছে..."
    );

    let extension = "m4a";

    if(
      mime.includes("webm")
    ){
      extension = "webm";
    }else if(
      mime.includes("ogg")
    ){
      extension = "ogg";
    }else if(
      mime.includes("aac")
    ){
      extension = "aac";
    }

    const path =
      `${currentUser.id}/${conversationId}/voice-${Date.now()}-${crypto.randomUUID()}.${extension}`;

    const {
      error:uploadError
    } =
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          path,
          blob,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:mime
          }
        );

    if(uploadError){
      throw uploadError;
    }

    const {
      data
    } =
      supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(path);

    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          conversation_id:
            conversationId,

          sender_id:
            currentUser.id,

          content:null,

          message_type:
            "audio",

          file_url:
            data.publicUrl,

          is_read:false
        });

    if(error){
      throw error;
    }

  }catch(error){

    console.error(error);

    toast(
      error?.message ||
      "Voice send করা যায়নি"
    );
  }
}

function setupTyping(){

  if(typingChannel){
    supabaseClient.removeChannel(
      typingChannel
    );
  }

  typingChannel =
    supabaseClient
      .channel(
        "raztara-typing:" +
        conversationId
      )
      .on(
        "broadcast",
        {
          event:"typing"
        },
        payload => {

          if(
            payload?.payload?.user_id ===
            currentUser.id
          ){
            return;
          }

          if(
            payload?.payload?.typing
          ){

            showTyping();

          }else{

            restoreStatus();
          }
        }
      )
      .subscribe();
}

function handleTyping(){

  if(!typingChannel){
    return;
  }

  if(!typingSent){

    typingSent = true;

    typingChannel.send({
      type:"broadcast",
      event:"typing",
      payload:{
        user_id:
          currentUser.id,

        typing:true
      }
    });
  }

  clearTimeout(
    typingTimer
  );

  typingTimer =
    setTimeout(() => {

      typingSent = false;

      typingChannel.send({
        type:"broadcast",
        event:"typing",
        payload:{
          user_id:
            currentUser.id,

          typing:false
        }
      });

    },1000);
}

function showTyping(){

  $("chatUserStatus").textContent =
    "Typing...";

  clearTimeout(
    $("chatUserStatus")._typingTimer
  );

  $("chatUserStatus")._typingTimer =

      restoreStatus,
      1800
    );
}

function restoreStatus(){

  updateStatusFromPresence();
}

/* =========================================================
   PRESENCE
========================================================= */

function setupPresence(){

  if(presenceChannel){

    supabaseClient.removeChannel(
      presenceChannel
    );
  }

  presenceChannel =
    supabaseClient
      .channel(
        "raztara-online",
        {
          config:{
            presence:{
              key:
                currentUser.id
            }
          }
        }
      )
      .on(
        "presence",
        {
          event:"sync"
        },
        updateStatusFromPresence
      )
      .on(
        "presence",
        {
          event:"join"
        },
        updateStatusFromPresence
      )
      .on(
        "presence",
        {
          event:"leave"
        },
        updateStatusFromPresence
      )
      .subscribe(
        async status => {

          if(
            status === "SUBSCRIBED"
          ){

            await presenceChannel.track({
              user_id:
                currentUser.id,

              online_at:
                new Date().toISOString()
            });

            updateStatusFromPresence();
          }
        }
      );
}

function updateStatusFromPresence(){

  if(!otherUser){
    return;
  }

  if(
    $("chatUserStatus").textContent ===
    "Typing..."
  ){
    return;
  }

  let online = false;

  try{

    if(presenceChannel){

      const state =
        presenceChannel
          .presenceState();

      online =
        !!state[
          otherUserId
        ];
    }

  }catch{}

  if(online){

    $("chatUserStatus").textContent =
      "Online";

    return;
  }

  const lastSeen =
    otherUser.last_seen_at;

  if(lastSeen){

    $("chatUserStatus").textContent =
      "Last seen " +
      formatLastSeen(lastSeen);

  }else{

    $("chatUserStatus").textContent =
      "Offline";
  }
}

function formatLastSeen(date){

  const d =
    new Date(date);

  return d.toLocaleString(
    "bn-BD",
    {
      day:"numeric",
      month:"short",
      hour:"numeric",
      minute:"2-digit"
    }
  );
}

  /*
    Image-এর জন্য simple browser view.
  */

  window.open(
    safeUrl(url),
    "_blank",
    "noopener"
  );
}

/* =========================================================
   CHAT MENU
========================================================= */

function toggleChatMenu(event){

  event?.stopPropagation();

  $("attachMenu")
    .classList.remove("show");

  $("chatMenu")
    .classList.toggle("show");
}

function setupOutsideClick(){

  document.addEventListener(
    "click",
    event => {

      const menu =
        $("chatMenu");

      const attach =
        $("attachMenu");

      if(
        !menu.contains(event.target) &&
        !event.target.closest(".headerBtn")
      ){

        menu.classList.remove(
          "show"
        );
      }

      if(
        !attach.contains(event.target) &&
        !event.target.closest(".attachBtn")
      ){

        attach.classList.remove(
          "show"
        );
      }
    }
  );

  document
    .querySelectorAll(".modalBackdrop")
    .forEach(backdrop => {

      backdrop.addEventListener(
        "click",
        event => {

          if(
            event.target ===
            backdrop
          ){

            backdrop.classList.remove(
              "show"
            );
          }
        }
      );
    });
}

/* =========================================================
   iPHONE KEYBOARD
========================================================= */

function setupKeyboardHandling(){

  const viewport =
    window.visualViewport;

  if(!viewport){
    return;
  }

  const update =
    () => {

      const keyboard =
        Math.max(
          0,
          window.innerHeight -
          viewport.height -
          viewport.offsetTop
        );

      /*
        Small values are browser UI,
        not keyboard.
      */

      const offset =
        keyboard > 80
          ? keyboard
          : 0;

      document.documentElement
        .style
        .setProperty(
          "--keyboard-offset",
          offset + "px"
        );

      requestAnimationFrame(
        () => {

          const messages =
            $("messages");

          if(messages){

            messages.scrollTop =
              messages.scrollHeight;
          }
        }
      );
    };

  viewport.addEventListener(
    "resize",
    update
  );

  viewport.addEventListener(
    "scroll",
    update
  );

  update();
}

/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom(){

  requestAnimationFrame(() => {

    const el =
      $("messages");

    if(el){

      el.scrollTop =
        el.scrollHeight;
    }
  });
}

/* =========================================================
   NAVIGATION
========================================================= */

function goBack(){

  if(
    document.referrer &&
    history.length > 1
  ){

    history.back();

  }else{

    location.href =
      "index.html";
  }
}

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "pagehide",
  async () => {

    try{

      if(presenceChannel){

        await presenceChannel.untrack();
      }

    }catch{}
  }
);

/* =========================================================
   START
========================================================= */

init();
