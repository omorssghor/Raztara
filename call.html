<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_KEY

/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let callId = null;

let callData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let signalChannel = null;

let callChannel = null;

let pendingIceCandidates = [];

let pendingSignals = [];

let isAccepted = false;

let isMuted = false;

let isCameraOff = false;

let currentFacingMode = "user";

let initialized = false;

let signalSubscribed = false;

let startingCall = false;

let remoteDescriptionSet = false;

let remoteProfile = null;

let timerInterval = null;

let callStartedAt = null;

let callAnsweredAt = null;

let endingCall = false;


/* =====================================================
   DOM
===================================================== */

const loading =
    document.getElementById("loading");

const audioScreen =
    document.getElementById("audioScreen");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const remoteAudio =
    document.getElementById("remoteAudio");

const incoming =
    document.getElementById("incoming");

const callStatus =
    document.getElementById("callStatus");

const callTimer =
    document.getElementById("callTimer");

const userName =
    document.getElementById("userName");

const avatarImage =
    document.getElementById("avatarImage");

const avatarEmoji =
    document.getElementById("avatarEmoji");

const incomingName =
    document.getElementById("incomingName");

const incomingAvatarImage =
    document.getElementById(
        "incomingAvatarImage"
    );

const incomingEmoji =
    document.getElementById(
        "incomingEmoji"
    );

const incomingTitle =
    document.getElementById(
        "incomingTitle"
    );

const cameraBtn =
    document.getElementById("cameraBtn");

const muteBtn =
    document.getElementById("muteBtn");

const switchBtn =
    document.getElementById("switchBtn");


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            ()=>{
                toast.style.display =
                    "none";
            },
            3000
        );
}


/* =====================================================
   CALL ID
===================================================== */

function getCallId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("call") ||
        params.get("call_id") ||
        params.get("callId") ||
        params.get("id")
    );
}


/* =====================================================
   CURRENT USER
===================================================== */

async function loadCurrentUser(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if(
            !error &&
            data?.session?.user
        ){

            currentUser =
                data.session.user;

            return true;
        }


        const {
            data:userData,
            error:userError
        } =
            await supabaseClient
                .auth
                .getUser();


        if(
            userError ||
            !userData?.user
        ){

            throw new Error(
                "User ID পাওয়া যায়নি"
            );
        }


        currentUser =
            userData.user;

        return true;

    }catch(error){

        console.error(
            "AUTH ERROR:",
            error
        );

        showToast(
            "User ID পাওয়া যায়নি। আবার Login করুন।"
        );


        setTimeout(
            ()=>{
                window.location.href =
                    "index.html";
            },
            1500
        );


        return false;
    }
}


/* =====================================================
   LOAD CALL
===================================================== */

async function loadCall(){

    if(!callId){

        showToast(
            "Call ID পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1500
        );

        return false;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("calls")
            .select(`
                id,
                conversation_id,
                caller_id,
                receiver_id,
                call_type,
                status,
                started_at,
                answered_at,
                ended_at,
                duration_seconds
            `)
            .eq(
                "id",
                callId
            )
            .single();


    if(error){

        console.error(
            "CALL LOAD ERROR:",
            error
        );

        showToast(
            error.message ||
            "Call তথ্য পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1800
        );

        return false;
    }


    callData =
        data;


    if(
        currentUser.id !==
            callData.caller_id &&
        currentUser.id !==
            callData.receiver_id
    ){

        showToast(
            "এই Call-এর সাথে আপনার সম্পর্ক নেই।"
        );

        setTimeout(
            goBack,
            1800
        );

        return false;
    }


    callStartedAt =
        callData.started_at
            ? new Date(
                callData.started_at
              )
            : null;


    callAnsweredAt =
        callData.answered_at
            ? new Date(
                callData.answered_at
              )
            : null;


    return true;
}


/* =====================================================
   ROLE
===================================================== */

function isCaller(){

    return (
        currentUser.id ===
        callData.caller_id
    );
}


function isReceiver(){

    return (
        currentUser.id ===
        callData.receiver_id
    );
}


/* =====================================================
   LOAD OTHER USER PROFILE
===================================================== */

async function loadRemoteProfile(){

    const otherUserId =
        isCaller()
            ? callData.receiver_id
            : callData.caller_id;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                full_name,
                username,
                avatar_url
            `)
            .eq(
                "id",
                otherUserId
            )
            .maybeSingle();


    if(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        return;
    }


    remoteProfile =
        data;


    const name =
        data?.full_name ||
        data?.username ||
        "RAZTARA User";


    userName.textContent =
        name;


    incomingName.textContent =
        name;


    if(data?.avatar_url){

        avatarImage.src =
            data.avatar_url;

        avatarImage.style.display =
            "block";

        avatarEmoji.style.display =
            "none";


        incomingAvatarImage.src =
            data.avatar_url;

        incomingAvatarImage.style.display =
            "block";

        incomingEmoji.style.display =
            "none";

    }else{

        avatarImage.style.display =
            "none";

        avatarEmoji.style.display =
            "block";


        incomingAvatarImage.style.display =
            "none";

        incomingEmoji.style.display =
            "block";
    }
}


/* =====================================================
   WEBRTC CONFIG
===================================================== */

const rtcConfig = {

    iceServers:[

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]
};


/* =====================================================
   CREATE PEER
===================================================== */

function createPeerConnection(){

    if(peerConnection){

        return peerConnection;
    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    remoteAudio.srcObject =
        remoteStream;


    remoteVideo.srcObject =
        remoteStream;


    peerConnection.onicecandidate =
        async event => {

            if(
                event.candidate
            ){

                await sendSignal(
                    "ice",
                    event.candidate.toJSON
                        ? event.candidate.toJSON()
                        : event.candidate
                );
            }
        };


    peerConnection.ontrack =
        event => {

            const stream =
                event.streams &&
                event.streams[0];


            if(stream){

                stream
                    .getTracks()
                    .forEach(
                        track => {

                            if(
                                !remoteStream
                                    .getTracks()
                                    .some(
                                        t =>
                                            t.id ===
                                            track.id
                                    )
                            ){

                                remoteStream
                                    .addTrack(
                                        track
                                    );
                            }

                        }
                    );

            }else{

                if(
                    !remoteStream
                        .getTracks()
                        .some(
                            t =>
                                t.id ===
                                event.track.id
                        )
                ){

                    remoteStream.addTrack(
                        event.track
                    );
                }
            }


            if(
                callData.call_type ===
                "video"
            ){

                remoteVideo.style.display =
                    "block";

                audioScreen.style.display =
                    "none";


                remoteVideo
                    .play()
                    .catch(
                        ()=>{}
                    );

            }else{

                remoteAudio
                    .play()
                    .catch(
                        ()=>{}
                    );
            }


            callStatus.textContent =
                "Connected";
        };


    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection
                    ?.connectionState;


            console.log(
                "WEBRTC:",
                state
            );


            if(
                state ===
                "connected"
            ){

                callStatus.textContent =
                    "Connected";

                startTimerIfNeeded();
            }


            if(
                state ===
                "connecting"
            ){

                callStatus.textContent =
                    "Connecting...";
            }


            if(
                state ===
                "disconnected"
            ){

                callStatus.textContent =
                    "Connection lost";
            }


            if(
                state ===
                "failed"
            ){

                callStatus.textContent =
                    "Connection failed";

                showToast(
                    "Call connection failed।"
                );
            }


            if(
                state ===
                "closed"
            ){

                callStatus.textContent =
                    "Call ended";
            }
        };


    return peerConnection;
}


/* =====================================================
   LOCAL MEDIA
===================================================== */

async function getLocalMedia(){

    if(localStream){

        return localStream;
    }


    const isVideo =
        callData.call_type ===
        "video";


    try{

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        isVideo
                            ? {
                                facingMode:
                                    currentFacingMode
                              }
                            : false
                });


        const pc =
            createPeerConnection();


        localStream
            .getTracks()
            .forEach(
                track => {

                    pc.addTrack(
                        track,
                        localStream
                    );
                }
            );


        if(isVideo){

            localVideo.srcObject =
                localStream;

            localVideo.style.display =
                "block";

            cameraBtn.style.display =
                "flex";

            switchBtnShow(true);


            localVideo
                .play()
                .catch(
                    ()=>{}
                );

        }else{

            cameraBtn.style.display =
                "none";

            switchBtnShow(false);
        }


        return localStream;

    }catch(error){

        console.error(
            "MEDIA ERROR:",
            error
        );


        if(
            error.name ===
            "NotAllowedError"
        ){

            showToast(
                "Microphone/Camera permission দিন।"
            );

        }else if(
            error.name ===
            "NotFoundError"
        ){

            showToast(
                "Microphone/Camera পাওয়া যায়নি।"
            );

        }else{

            showToast(
                "Microphone/Camera চালু করা যায়নি।"
            );
        }


        throw error;
    }
}


/* =====================================================
   SWITCH BUTTON
===================================================== */

function switchBtnShow(show){

    switchBtn.style.display =
        show
            ? "flex"
            : "none";
}


/* =====================================================
   SEND SIGNAL
===================================================== */

async function sendSignal(
    type,
    data
){

    if(
        !callData ||
        !currentUser
    ){

        return false;
    }


    try{

        const {
            error
        } =
            await supabaseClient
                .from("call_signals")
                .insert({

                    conversation_id:
                        callData.conversation_id,

                    sender_id:
                        currentUser.id,

                    signal_type:
                        type,

                    payload:{
                        call_id:
                            callId,

                        data:
                            data
                    }
                });


        if(error){

            console.error(
                "SIGNAL ERROR:",
                error
            );

            return false;
        }


        return true;

    }catch(error){

        console.error(
            "SIGNAL ERROR:",
            error
        );

        return false;
    }
}


/* =====================================================
   SUBSCRIBE SIGNALS
===================================================== */

function subscribeSignals(){

    return new Promise(
        resolve => {

            signalChannel =
                supabaseClient
                    .channel(
                        "call-signals-" +
                        callId +
                        "-" +
                        currentUser.id
                    );


            signalChannel
                .on(
                    "postgres_changes",
                    {
                        event:"INSERT",
                        schema:"public",
                        table:"call_signals",
                        filter:
                            "conversation_id=eq." +
                            callData.conversation_id
                    },
                    payload => {

                        const row =
                            payload.new;


                        if(
                            row.sender_id ===
                            currentUser.id
                        ){

                            return;
                        }


                        if(
                            row.payload?.call_id !==
                            callId
                        ){

                            return;
                        }


                        handleSignal(row);
                    }
                )
                .subscribe(
                    status => {

                        console.log(
                            "SIGNAL CHANNEL:",
                            status
                        );


                        if(
                            status ===
                            "SUBSCRIBED"
                        ){

                            signalSubscribed =
                                true;

                            resolve(true);
                        }


                        if(
                            status ===
                            "CHANNEL_ERROR" ||
                            status ===
                            "TIMED_OUT"
                        ){

                            signalSubscribed =
                                false;

                            resolve(false);
                        }
                    }
                );
        }
    );
}


/* =====================================================
   HANDLE SIGNAL
===================================================== */

async function handleSignal(signal){

    const type =
        signal.signal_type;

    const data =
        signal.payload?.data;


    console.log(
        "RECEIVED:",
        type
    );


    if(type === "hangup"){

        endCallLocal(
            "Call ended",
            false
        );

        return;
    }


    if(type === "reject"){

        endCallLocal(
            "Call rejected",
            false
        );

        return;
    }


    if(type === "offer"){

        if(!isAccepted){

            pendingSignals.push(
                signal
            );

            return;
        }


        await handleOffer(data);

        return;
    }


    if(type === "answer"){

        await handleAnswer(data);

        return;
    }


    if(type === "ice"){

        if(
            !peerConnection ||
            !remoteDescriptionSet
        ){

            pendingIceCandidates.push(
                data
            );

            return;
        }


        await addIceCandidateSafe(
            data
        );
    }
}


/* =====================================================
   ADD ICE
===================================================== */

async function addIceCandidateSafe(candidate){

    if(!candidate){

        return;
    }


    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){

        pendingIceCandidates.push(
            candidate
        );

        return;
    }


    try{

        await peerConnection
            .addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

    }catch(error){

        console.error(
            "ICE ERROR:",
            error
        );
    }
}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(offer){

    if(!offer){

        return;
    }


    try{

        createPeerConnection();


        await getLocalMedia();


        if(remoteDescriptionSet){

            return;
        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );


        remoteDescriptionSet =
            true;


        await flushPendingIce();


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await sendSignal(
            "answer",
            peerConnection
                .localDescription
                ?.toJSON
                    ? peerConnection
                        .localDescription
                        .toJSON()
                    : peerConnection
                        .localDescription
        );


        callStatus.textContent =
            "Connecting...";

    }catch(error){

        console.error(
            "OFFER ERROR:",
            error
        );

        showToast(
            "Call connection তৈরি করা যায়নি।"
        );
    }
}


/* =====================================================
   HANDLE ANSWER
===================================================== */

async function handleAnswer(answer){

    try{

        if(!peerConnection){

            return;
        }


        if(
            peerConnection
                .signalingState !==
            "have-local-offer"
        ){

            return;
        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );


        remoteDescriptionSet =
            true;


        await flushPendingIce();


        callStatus.textContent =
            "Connected";

    }catch(error){

        console.error(
            "ANSWER ERROR:",
            error
        );
    }
}


/* =====================================================
   FLUSH ICE
===================================================== */

async function flushPendingIce(){

    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){

        return;
    }


    const list =
        [
            ...pendingIceCandidates
        ];


    pendingIceCandidates = [];


    for(
        const candidate of list
    ){

        await addIceCandidateSafe(
            candidate
        );
    }
}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =====================================================
   WAIT SIGNAL
===================================================== */

function waitForSignalSubscription(){

    return new Promise(
        resolve => {

            let count = 0;


            const timer =
                setInterval(
                    ()=>{

                        if(
                            signalSubscribed
                        ){

                            clearInterval(
                                timer
                            );

                            resolve(true);

                            return;
                        }


                        count++;


                        if(
                            count >= 60
                        ){

                            clearInterval(
                                timer
                            );

                            resolve(false);
                        }

                    },
                    100
                );
        }
    );
}


/* =====================================================
   LOAD OLD SIGNALS
===================================================== */

async function loadExistingSignals(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("call_signals")
                .select(`
                    id,
                    conversation_id,
                    sender_id,
                    signal_type,
                    payload,
                    created_at
                `)
                .eq(
                    "conversation_id",
                    callData.conversation_id
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );


        if(error){

            console.error(
                "OLD SIGNAL ERROR:",
                error
            );

            return;
        }


        if(!data){

            return;
        }


        for(
            const signal of data
        ){

            if(
                signal.sender_id ===
                currentUser.id
            ){

                continue;
            }


            if(
                signal.payload?.call_id !==
                callId
            ){

                continue;
            }


            if(
                signal.signal_type ===
                "offer"
            ){

                if(
                    isAccepted &&
                    !remoteDescriptionSet
                ){

                    await handleOffer(
                        signal.payload?.data
                    );
                }

            }else if(
                signal.signal_type ===
                "ice"
            ){

                await addIceCandidateSafe(
                    signal.payload?.data
                );
            }

        }

    }catch(error){

        console.error(
            "LOAD SIGNAL ERROR:",
            error
        );
    }
}


/* =====================================================
   OUTGOING CALL
===================================================== */

async function startOutgoingCall(){

    if(startingCall){

        return;
    }


    startingCall =
        true;


    try{

        isAccepted =
            true;


        incoming.style.display =
            "none";


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";


        createPeerConnection();


        await getLocalMedia();


        if(!signalSubscribed){

            const ready =
                await waitForSignalSubscription();


            if(!ready){

                throw new Error(
                    "Signal connection failed"
                );
            }
        }


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await sendSignal(
            "offer",
            peerConnection
                .localDescription
                ?.toJSON
                    ? peerConnection
                        .localDescription
                        .toJSON()
                    : peerConnection
                        .localDescription
        );


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";

    }catch(error){

        console.error(
            "OUTGOING ERROR:",
            error
        );

        showToast(
            "Call শুরু করা যায়নি।"
        );

    }finally{

        startingCall =
            false;
    }
}


/* =====================================================
   ACCEPT CALL
===================================================== */

async function acceptCall(){

    if(isAccepted){

        return;
    }


    try{

        isAccepted =
            true;


        incoming.style.display =
            "none";


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Connecting video..."
                : "Connecting...";


        createPeerConnection();


        await getLocalMedia();


        /* ANSWER TIME SAVE */

        const answeredNow =
            new Date();


        callAnsweredAt =
            answeredNow;


        await supabaseClient
            .from("calls")
            .update({

                status:"answered",

                answered_at:
                    answeredNow.toISOString()

            })
            .eq(
                "id",
                callId
            );


        startTimerIfNeeded();


        const offers =
            [
                ...pendingSignals
            ];


        pendingSignals = [];


        for(
            const signal of offers
        ){

            if(
                signal.signal_type ===
                "offer"
            ){

                await handleOffer(
                    signal.payload?.data
                );
            }
        }


        if(
            !remoteDescriptionSet
        ){

            await loadExistingSignals();
        }

    }catch(error){

        console.error(
            "ACCEPT ERROR:",
            error
        );

        showToast(
            "Call গ্রহণ করা যায়নি।"
        );
    }
}


/* =====================================================
   CALL STATUS REALTIME
===================================================== */

function subscribeCallStatus(){

    callChannel =
        supabaseClient
            .channel(
                "call-status-" +
                callId +
                "-" +
                currentUser.id
            );


    callChannel
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"calls",
                filter:
                    "id=eq." +
                    callId
            },
            payload => {

                const row =
                    payload.new;


                const status =
                    row?.status;


                if(
                    row?.answered_at &&
                    !callAnsweredAt
                ){

                    callAnsweredAt =
                        new Date(
                            row.answered_at
                        );

                    startTimerIfNeeded();
                }


                if(
                    status ===
                    "answered"
                ){

                    callStatus.textContent =
                        "Connected";

                    startTimerIfNeeded();
                }


                if(
                    status ===
                    "rejected"
                ){

                    endCallLocal(
                        "Call rejected",
                        false
                    );
                }


                if(
                    status ===
                    "ended"
                ){

                    stopTimer();

                    endCallLocal(
                        "Call ended",
                        false
                    );
                }

            }
        )
        .subscribe();
}


/* =====================================================
   TIMER
===================================================== */

function formatDuration(totalSeconds){

    totalSeconds =
        Math.max(
            0,
            Math.floor(
                totalSeconds
            )
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    if(hours > 0){

        return (
            String(hours)
                .padStart(2,"0")
            + ":" +
            String(minutes)
                .padStart(2,"0")
            + ":" +
            String(seconds)
                .padStart(2,"0")
        );
    }


    return (
        String(minutes)
            .padStart(2,"0")
        + ":" +
        String(seconds)
            .padStart(2,"0")
    );
}


function startTimerIfNeeded(){

    if(
        !callAnsweredAt ||
        timerInterval
    ){

        return;
    }


    callTimer.style.display =
        "block";


    function updateTimer(){

        const seconds =
            (
                Date.now() -
                callAnsweredAt.getTime()
            ) / 1000;


        callTimer.textContent =
            formatDuration(seconds);
    }


    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            1000
        );
}


function stopTimer(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;
    }
}


/* =====================================================
   SAVE END
===================================================== */

async function saveCallEnd(){

    if(
        !callId ||
        !callData
    ){

        return;
    }


    const endedNow =
        new Date();


    let durationSeconds =
        0;


    if(callAnsweredAt){

        durationSeconds =
            Math.max(
                0,
                Math.floor(
                    (
                        endedNow.getTime() -
                        callAnsweredAt.getTime()
                    ) / 1000
                )
            );
    }


    const {
        error
    } =
        await supabaseClient
            .from("calls")
            .update({

                status:"ended",

                ended_at:
                    endedNow.toISOString(),

                duration_seconds:
                    durationSeconds

            })
            .eq(
                "id",
                callId
            );


    if(error){

        console.error(
            "CALL END SAVE ERROR:",
            error
        );
    }
}


/* =====================================================
   UPDATE CALL STATUS
===================================================== */

async function updateCallStatus(status){

    try{

        const {
            error
        } =
            await supabaseClient
                .from("calls")
                .update({
                    status:status
                })
                .eq(
                    "id",
                    callId
                );


        if(error){

            console.error(
                "UPDATE CALL ERROR:",
                error
            );
        }

    }catch(error){

        console.error(
            "UPDATE CALL ERROR:",
            error
        );
    }
}


/* =====================================================
   REJECT
===================================================== */

async function rejectCall(){

    if(endingCall){

        return;
    }


    endingCall =
        true;


    try{

        await sendSignal(
            "reject",
            {
                rejected:true
            }
        );


        await updateCallStatus(
            "rejected"
        );

    }catch(error){

        console.error(error);
    }


    endCallLocal(
        "Call rejected",
        false
    );
}


/* =====================================================
   HANGUP
===================================================== */

async function hangup(){

    if(endingCall){

        return;
    }


    endingCall =
        true;


    try{

        await sendSignal(
            "hangup",
            {
                ended:true
            }
        );


        await saveCallEnd();

    }catch(error){

        console.error(
            "HANGUP ERROR:",
            error
        );
    }


    endCallLocal(
        "Call ended",
        false
    );
}


/* =====================================================
   END LOCAL
===================================================== */

function endCallLocal(
    message,
    shouldSave = false
){

    if(shouldSave){

        saveCallEnd()
            .catch(
                ()=>{}
            );
    }


    stopTimer();


    callStatus.textContent =
        message;


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream =
            null;
    }


    if(remoteStream){

        remoteStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(error){}

        peerConnection =
            null;
    }


    remoteDescriptionSet =
        false;


    if(signalChannel){

        try{

            supabaseClient
                .removeChannel(
                    signalChannel
                );

        }catch(error){}

        signalChannel =
            null;
    }


    if(callChannel){

        try{

            supabaseClient
                .removeChannel(
                    callChannel
                );

        }catch(error){}

        callChannel =
            null;
    }


    setTimeout(
        goBack,
        1000
    );
}


/* =====================================================
   MUTE
===================================================== */

function toggleMute(){

    if(!localStream){

        return;
    }


    const tracks =
        localStream
            .getAudioTracks();


    if(!tracks.length){

        return;
    }


    isMuted =
        !isMuted;


    tracks.forEach(
        track => {

            track.enabled =
                !isMuted;
        }
    );


    muteBtn.textContent =
        isMuted
            ? "🔇"
            : "🎙️";


    muteBtn.classList.toggle(
        "off",
        isMuted
    );
}


/* =====================================================
   CAMERA
===================================================== */

function toggleCamera(){

    if(!localStream){

        return;
    }


    const tracks =
        localStream
            .getVideoTracks();


    if(!tracks.length){

        return;
    }


    isCameraOff =
        !isCameraOff;


    tracks.forEach(
        track => {

            track.enabled =
                !isCameraOff;
        }
    );


    cameraBtn.textContent =
        isCameraOff
            ? "🚫"
            : "📹";


    cameraBtn.classList.toggle(
        "off",
        isCameraOff
    );
}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

    if(
        callData.call_type !==
        "video"
    ){

        return;
    }


    if(!peerConnection){

        return;
    }


    currentFacingMode =
        currentFacingMode ===
        "user"
            ? "environment"
            : "user";


    try{

        const newStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{
                        facingMode:
                            currentFacingMode
                    }
                });


        const newTrack =
            newStream
                .getVideoTracks()[0];


        const sender =
            peerConnection
                .getSenders()
                .find(
                    s =>
                        s.track &&
                        s.track.kind ===
                        "video"
                );


        if(sender){

            await sender
                .replaceTrack(
                    newTrack
                );
        }


        const oldTrack =
            localStream
                ?.getVideoTracks()[0];


        if(oldTrack){

            oldTrack.stop();

            localStream.removeTrack(
                oldTrack
            );
        }


        if(localStream){

            localStream.addTrack(
                newTrack
            );
        }


        localVideo.srcObject =
            localStream;


        localVideo
            .play()
            .catch(
                ()=>{}
            );

    }catch(error){

        console.error(
            "SWITCH CAMERA ERROR:",
            error
        );

        showToast(
            "Camera পরিবর্তন করা যায়নি।"
        );
    }
}


/* =====================================================
   UI
===================================================== */

function prepareUI(){

    if(
        callData.call_type ===
        "video"
    ){

        cameraBtn.style.display =
            "flex";

        switchBtnShow(true);

    }else{

        cameraBtn.style.display =
            "none";

        switchBtnShow(false);
    }


    if(isCaller()){

        incoming.style.display =
            "none";


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";

    }else{

        incoming.style.display =
            "flex";


        incomingTitle.textContent =
            callData.call_type ===
            "video"
                ? "Incoming video call"
                : "Incoming audio call";


        callStatus.textContent =
            "Incoming call...";
    }
}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        window.history.back();

    }else{

        window.location.href =
            "chat.html";
    }
}


/* =====================================================
   INIT
===================================================== */

async function init(){

    if(initialized){

        return;
    }


    initialized =
        true;


    loading.style.display =
        "flex";


    callId =
        getCallId();


    if(!callId){

        loading.style.display =
            "none";

        showToast(
            "Call ID পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1500
        );

        return;
    }


    const userLoaded =
        await loadCurrentUser();


    if(!userLoaded){

        return;
    }


    const callLoaded =
        await loadCall();


    if(!callLoaded){

        return;
    }


    await loadRemoteProfile();


    prepareUI();


    const signalReady =
        await subscribeSignals();


    if(!signalReady){

        loading.style.display =
            "none";

        showToast(
            "Call signal connection তৈরি হয়নি।"
        );

        return;
    }


    subscribeCallStatus();


    loading.style.display =
        "none";


    /*
      Caller হলে সরাসরি Call শুরু।
    */

    if(isCaller()){

        await startOutgoingCall();

    }else{

        /*
          Receiver-এর জন্য পুরোনো offer
          থাকলে রেখে দিচ্ছি।
        */

        callStatus.textContent =
            "Incoming call...";
    }
}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    init
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        stopTimer();


        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        if(peerConnection){

            try{

                peerConnection.close();

            }catch(error){}
        }
    }
);
