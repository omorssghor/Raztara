<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>RAZTARA — Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    position:relative;
    color:#fff;
}

/* =========================
   REMOTE VIDEO
========================= */

#remoteVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
    z-index:1;
}

/* =========================
   LOCAL VIDEO
========================= */

#localVideo{
    position:absolute;
    top:20px;
    right:15px;
    width:120px;
    height:170px;
    object-fit:cover;
    border-radius:15px;
    border:2px solid rgba(255,255,255,.7);
    background:#222;
    z-index:5;
    display:none;
}

/* =========================
   AUDIO AVATAR
========================= */

#audioAvatar{
    position:absolute;
    inset:0;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle at center,
            #263238 0%,
            #111 45%,
            #000 100%
        );
}

.avatarCircle{
    width:120px;
    height:120px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#087f5b;
    color:#fff;

    font-size:55px;
    font-weight:bold;

    box-shadow:
        0 0 0 8px rgba(8,127,91,.18),
        0 0 50px rgba(8,127,91,.35);
}

#audioName{
    margin-top:18px;
    font-size:22px;
    font-weight:bold;
}

#audioStatus{
    margin-top:8px;
    color:#bbb;
    font-size:14px;
}

/* =========================
   TOP BAR
========================= */

.topBar{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:80px;

    z-index:10;

    padding:
        env(safe-area-inset-top)
        15px
        10px
        15px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            rgba(0,0,0,.65),
            transparent
        );
}

.callInfo{
    display:flex;
    flex-direction:column;
}

#name{
    font-size:17px;
    font-weight:bold;
}

#status{
    margin-top:4px;
    font-size:13px;
    color:#ddd;
}

.callType{
    padding:8px 12px;
    border-radius:20px;
    background:rgba(0,0,0,.45);
    font-size:12px;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    z-index:20;

    padding:
        15px
        15px
        calc(20px + env(safe-area-inset-bottom))
        15px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );
}

.controlBtn{
    width:55px;
    height:55px;

    border:none;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    color:#fff;
    background:#333;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.controlBtn:active{
    transform:scale(.94);
}

.controlBtn.active{
    background:#087f5b;
}

.endBtn{
    background:#e53935;
}

.endBtn:active{
    background:#c62828;
}

/* =========================
   INCOMING CALL
========================= */

#incomingBox{
    position:absolute;
    inset:0;

    z-index:50;

    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        rgba(0,0,0,.88);

    padding:25px;
}

.incomingTitle{
    font-size:25px;
    font-weight:bold;
}

.incomingType{
    margin-top:8px;
    color:#bbb;
}

.incomingButtons{
    margin-top:35px;

    display:flex;
    gap:25px;
}

.incomingBtn{
    width:70px;
    height:70px;

    border:none;
    border-radius:50%;

    color:#fff;

    font-size:28px;

    cursor:pointer;
}

.acceptBtn{
    background:#087f5b;
}

.rejectBtn{
    background:#e53935;
}

/* =========================
   LOADING
========================= */

#loading{
    position:absolute;
    inset:0;

    z-index:40;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    font-size:15px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:absolute;

    left:50%;
    bottom:110px;

    transform:translateX(-50%);

    z-index:100;

    padding:10px 16px;

    border-radius:20px;

    background:rgba(0,0,0,.8);

    color:#fff;

    font-size:13px;

    display:none;

    max-width:85%;

    text-align:center;
}

.hidden{
    display:none !important;
}

</style>

<!-- =========================

========================= -->

<div id="incomingBox">

    <div class="avatarCircle">

    </div>

    <div

    </div>

     LOADING
========================= -->

    Loading call...
</div>


<!-- =========================
     TOAST
========================= -->

<div id="toast"></div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let callId = null;

let conversationId = null;

let callData = null;

let callType = "audio";

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let signalChannel = null;

let callChannel = null;

let ended = false;

let isMuted = false;

let isCameraOff = false;

let usingFrontCamera = true;


/* =====================================================
   SIGNAL QUEUE
===================================================== */

let pendingSignals = [];

let pendingIceCandidates = [];

let remoteDescriptionSet = false;

let queuedSignalIds = new Set();

let handledSignalIds = new Set();


/* =====================================================
   ELEMENTS
===================================================== */

const remoteVideo =
    document.getElementById("remoteVideo");

const remoteAudio =
    document.getElementById("remoteAudio");

const localVideo =
    document.getElementById("localVideo");

const audioAvatar =
    document.getElementById("audioAvatar");

const audioName =
    document.getElementById("audioName");

const audioStatus =
    document.getElementById("audioStatus");

const nameEl =
    document.getElementById("name");

const statusEl =
    document.getElementById("status");

const callTypeLabel =
    document.getElementById("callTypeLabel");

const loading =
    document.getElementById("loading");

const incomingBox =
    document.getElementById("incomingBox");

const incomingName =
    document.getElementById("incomingName");

const incomingType =
    document.getElementById("incomingType");

const avatarLetter =
    document.getElementById("avatarLetter");

const toast =
    document.getElementById("toast");


/* =====================================================
   URL PARAMETER
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

callId =
    params.get("call_id") ||
    params.get("callId") ||
    params.get("id");

conversationId =
    params.get("conversation_id") ||
    params.get("conversationId");


/* =====================================================
   INIT
===================================================== */

async function init(){

    try{

        setStatus("Loading...");

        if(!callId){

            showToast(
                "Call ID পাওয়া যায়নি"
            );

            setTimeout(
                goBack,
                1000
            );

            return;
        }


        /* =========================
           CURRENT USER
        ========================= */

        const {
            data: userData,
            error: userError
        } =
            await supabaseClient
                .auth
                .getUser();


        if(
            userError ||
            !userData ||
            !userData.user
        ){

            showToast(
                "Login করুন"
            );

            setTimeout(
                goBack,
                1000
            );

            return;
        }


        currentUser =
            userData.user;


        /* =========================
           LOAD CALL
        ========================= */

        const loaded =
            await loadCall();


        if(!loaded){
            return;
        }


        /* =========================
           PROFILE
        ========================= */

        await loadProfile();


        /* =========================
           SUBSCRIPTIONS
        ========================= */

        await subscribeSignals();

        await subscribeCallStatus();


        loading.style.display =
            "none";


        /* =========================
           CALLER / RECEIVER
        ========================= */

        if(
            callData.caller_id ===
            currentUser.id
        ){

            await startOutgoingCall();

        }else{

            showIncomingCall();

        }

    }catch(error){

        console.error(
            "Init error:",
            error
        );

        showToast(
            error.message ||
            "Call শুরু করা যায়নি"
        );

    }

}


/* =====================================================
   LOAD CALL
===================================================== */

async function loadCall(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("calls")
            .select(`
                id,
                conversation_id,
                caller_id,
                receiver_id,
                call_type,
                status
            `)
            .eq(
                "id",
                callId
            )
            .single();


    if(error){

        console.error(
            "Load call:",
            error
        );

        showToast(
            "Call information পাওয়া যায়নি"
        );

        setTimeout(
            goBack,
            1200
        );

        return false;
    }


    callData = data;


    if(
        currentUser.id !==
        data.caller_id &&
        currentUser.id !==
        data.receiver_id
    ){

        showToast(
            "এই call-এ আপনার access নেই"
        );

        setTimeout(
            goBack,
            1200
        );

        return false;
    }


    conversationId =
        data.conversation_id;


    callType =
        (
            data.call_type ||
            "audio"
        ).toLowerCase();


    if(
        callType !== "video"
    ){

        callType = "audio";
    }


    callTypeLabel.textContent =
        callType === "video"
            ? "Video"
            : "Audio";


    incomingType.textContent =
        callType === "video"
            ? "Video Call"
            : "Audio Call";


    /* =========================
       AUDIO / VIDEO UI
    ========================= */

    if(callType === "video"){

        audioAvatar.style.display =
            "none";

        remoteVideo.style.display =
            "block";

        document.getElementById(
            "cameraBtn"
        ).style.display =
            "flex";

        document.getElementById(
            "switchBtn"
        ).style.display =
            "flex";

    }else{

        audioAvatar.style.display =
            "flex";

        remoteVideo.style.display =
            "none";

        localVideo.style.display =
            "none";

        document.getElementById(
            "cameraBtn"
        ).style.display =
            "none";

        document.getElementById(
            "switchBtn"
        ).style.display =
            "none";
    }


    return true;
}


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    const otherUserId =
        callData.caller_id === currentUser.id
            ? callData.receiver_id
            : callData.caller_id;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(`
                id,
                username,
                full_name,
                avatar_url
            `)
            .eq(
                "id",
                otherUserId
            )
            .maybeSingle();


    if(error){

        console.error(
            "Profile error:",
            error
        );

        return;
    }


    if(!data){
        return;
    }


    const displayName =
        data.full_name ||
        data.username ||
        "RAZTARA User";


    nameEl.textContent =
        displayName;

    audioName.textContent =
        displayName;

    incomingName.textContent =
        displayName;


    avatarLetter.textContent =
        displayName
            .trim()
            .charAt(0)
            .toUpperCase() ||
        "R";
}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

    statusEl.textContent =
        text;

    audioStatus.textContent =
        text;
}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;

    toast.style.display =
        "block";


    clearTimeout(
        showToast.timer
    );


    showToast.timer =
        setTimeout(
            ()=>{
                toast.style.display =
                    "none";
            },
            2500
        );
}


/* =====================================================
   GET LOCAL MEDIA
===================================================== */

async function getLocalMedia(){

    if(localStream){
        return localStream;
    }


    const constraints = {

        audio:true,

        video:
            callType === "video"
                ? {
                    facingMode:
                        usingFrontCamera
                            ? "user"
                            : "environment"
                }
                : false

    };


    try{

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        if(callType === "video"){

            localVideo.srcObject =
                localStream;

            localVideo.style.display =
                "block";


            try{
                await localVideo.play();
            }catch(e){
                console.log(
                    "Local video play:",
                    e
                );
            }
        }


        return localStream;

    }catch(error){

        console.error(
            "getUserMedia:",
            error
        );


        if(
            error.name ===
            "NotAllowedError"
        ){

            showToast(
                "Camera/Microphone permission দিন"
            );

        }else{

            showToast(
                error.message ||
                "Camera/Microphone চালু করা যায়নি"
            );
        }


        throw error;
    }
}


/* =====================================================
   CREATE PEER
===================================================== */

function createPeer(){

    if(peerConnection){
        return peerConnection;
    }


    peerConnection =
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                    "stun:stun1.l.google.com:19302"
                }

            ]

        });


    remoteStream =
        new MediaStream();


    /* =========================
       LOCAL TRACKS
    ========================= */

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );

    }


    /* =========================
       REMOTE TRACK
    ========================= */

    peerConnection.ontrack =
        async event => {

            const stream =
                event.streams &&
                event.streams[0]
                    ? event.streams[0]
                    : null;


            if(stream){

                remoteStream =
                    stream;

            }else{

                remoteStream.addTrack(
                    event.track
                );

            }


            if(callType === "video"){

                remoteVideo.srcObject =
                    remoteStream;

                remoteVideo.style.display =
                    "block";

                audioAvatar.style.display =
                    "none";


                try{

                    await remoteVideo.play();

                }catch(error){

                    console.log(
                        "Remote video play:",
                        error
                    );
                }

            }else{

                remoteAudio.srcObject =
                    remoteStream;

                audioAvatar.style.display =
                    "flex";


                try{

                    await remoteAudio.play();

                }catch(error){

                    console.log(
                        "Remote audio play:",
                        error
                    );
                }

            }

        };


    /* =========================
       ICE
    ========================= */

    peerConnection.onicecandidate =
        event => {

            if(
                event.candidate &&
                !ended
            ){

                sendSignal(
                    "ice",
                    event.candidate.toJSON()
                );

            }

        };


    /* =========================
       CONNECTION STATE
    ========================= */

    peerConnection.onconnectionstatechange =
        () => {

            if(!peerConnection){
                return;
            }


            const state =
                peerConnection
                    .connectionState;


            console.log(
                "Connection state:",
                state
            );


            if(
                state ===
                "connected"
            ){

                setStatus(
                    "Connected"
                );

            }

            else if(
                state ===
                "connecting"
            ){

                setStatus(
                    "Connecting..."
                );

            }

            else if(
                state ===
                "disconnected"
            ){

                setStatus(
                    "Disconnected"
                );

            }

            else if(
                state ===
                "failed"
            ){

                setStatus(
                    "Connection failed"
                );

                showToast(
                    "Connection failed"
                );

            }

        };


    /* =========================
       ICE CONNECTION STATE
    ========================= */

    peerConnection.oniceconnectionstatechange =
        () => {

            if(!peerConnection){
                return;
            }


            console.log(
                "ICE:",
                peerConnection
                    .iceConnectionState
            );

        };


    return peerConnection;
}


/* =====================================================
   SEND SIGNAL
===================================================== */

async function sendSignal(
    type,
    payload
){

    if(
        !conversationId ||
        !currentUser ||
        !callId
    ){

        console.error(
            "Missing signal data"
        );

        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("call_signals")
            .insert({

                conversation_id:
                    conversationId,

                sender_id:
                    currentUser.id,

                signal_type:
                    type,

                payload:{
                    call_id:
                        callId,

                    data:
                        payload
                }

            });


    if(error){

        console.error(
            "Signal error:",
            error
        );

        showToast(
            "Call signal error"
        );

    }

}


/* =====================================================
   SUBSCRIBE SIGNALS
===================================================== */

function subscribeSignals(){

    return new Promise(
        (resolve,reject)=>{

            signalChannel =
                supabaseClient
                    .channel(
                        "call-signals-" +
                        callId
                    )
                    .on(

                        "postgres_changes",

                        {
                            event:
                                "INSERT",

                            schema:
                                "public",

                            table:
                                "call_signals"
                        },

                        async payload => {

                            const signal =
                                payload.new;


                            if(
                                signal.conversation_id !==
                                conversationId
                            ){

                                return;
                            }


                            if(
                                signal.sender_id ===
                                currentUser.id
                            ){

                                return;
                            }


                            /* =========================
                               CALL ID CHECK
                            ========================= */

                            if(
                                signal.payload?.call_id !==
                                callId
                            ){

                                return;
                            }


                            await handleSignal(
                                signal
                            );

                        }

                    )

                    .subscribe(
                        status => {

                            console.log(
                                "Signal channel:",
                                status
                            );


                            if(
                                status ===
                                "SUBSCRIBED"
                            ){

                                resolve();

                            }


                            if(
                                status ===
                                "CHANNEL_ERROR" ||
                                status ===
                                "TIMED_OUT"
                            ){

                                reject(
                                    new Error(
                                        "Realtime signal connection failed"
                                    )
                                );

                            }

                        }
                    );

        }
    );

}


/* =====================================================
   HANDLE SIGNAL
===================================================== */

async function handleSignal(
    signal
){

    if(!signal){
        return;
    }


    /* =========================
       DUPLICATE CHECK
    ========================= */

    if(
        signal.id &&
        handledSignalIds.has(
            signal.id
        )
    ){

        return;
    }


    /* =========================
       HANGUP
    ========================= */

    if(
        signal.signal_type ===
        "hangup"
    ){

        if(signal.id){

            handledSignalIds.add(
                signal.id
            );

        }


        finishCall(false);

        return;
    }


    /* =========================
       REJECT
    ========================= */

    if(
        signal.signal_type ===
        "reject"
    ){

        if(signal.id){

            handledSignalIds.add(
                signal.id
            );

        }


        showToast(
            "Call rejected"
        );


        finishCall(false);

        return;
    }


    /* =========================
       PEER NOT READY
    ========================= */

    if(!peerConnection){

        if(
            signal.id &&
            !queuedSignalIds.has(
                signal.id
            )
        ){

            pendingSignals.push(
                signal
            );

            queuedSignalIds.add(
                signal.id
            );

        }


        return;
    }


    const signalData =
        signal.payload?.data;


    if(!signalData){
        return;
    }


    try{

        /* =================================================
           OFFER
        ================================================= */

        if(
            signal.signal_type ===
            "offer"
        ){

            /*
             * যদি আগেই remote description থাকে
             * তাহলে একই offer আবার process করবে না
             */

            if(
                remoteDescriptionSet
            ){

                if(signal.id){

                    handledSignalIds.add(
                        signal.id
                    );

                }

                return;
            }


            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        signalData
                    )
                );


            remoteDescriptionSet =
                true;


            const answer =
                await peerConnection
                    .createAnswer();


            await peerConnection
                .setLocalDescription(
                    answer
                );


            await sendSignal(
                "answer",
                answer
            );


            if(signal.id){

                handledSignalIds.add(
                    signal.id
                );

                queuedSignalIds.delete(
                    signal.id
                );

            }


            setStatus(
                "Connected"
            );


            await flushPendingIce();

        }


        /* =================================================
           ANSWER
        ================================================= */

        else if(
            signal.signal_type ===
            "answer"
        ){

            if(
                remoteDescriptionSet
            ){

                if(signal.id){

                    handledSignalIds.add(
                        signal.id
                    );

                }

                return;
            }


            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        signalData
                    )
                );


            remoteDescriptionSet =
                true;


            if(signal.id){

                handledSignalIds.add(
                    signal.id
                );

                queuedSignalIds.delete(
                    signal.id
                );

            }


            setStatus(
                "Connected"
            );


            await flushPendingIce();

        }


        /* =================================================
           ICE
        ================================================= */

        else if(
            signal.signal_type ===
            "ice"
        ){

            /*
             * Remote description না আসা পর্যন্ত
             * ICE queue হবে
             */

            if(
                !remoteDescriptionSet
            ){

                pendingIceCandidates.push(
                    {
                        id:
                            signal.id,

                        candidate:
                            signalData
                    }
                );


                if(signal.id){

                    handledSignalIds.add(
                        signal.id
                    );

                    queuedSignalIds.delete(
                        signal.id
                    );

                }

                return;
            }


            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        signalData
                    )
                );


            if(signal.id){

                handledSignalIds.add(
                    signal.id
                );

                queuedSignalIds.delete(
                    signal.id
                );

            }

        }

    }catch(error){

        console.error(
            "Signal handling:",
            error
        );

    }

}


/* =====================================================
   FLUSH PENDING ICE
===================================================== */

async function flushPendingIce(){

    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){

        return;
    }


    const candidates =
        [...pendingIceCandidates];


    pendingIceCandidates =
        [];


    for(
        const item of candidates
    ){

        try{

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        item.candidate
                    )
                );

        }catch(error){

            console.error(
                "Queued ICE error:",
                error
            );

        }

    }

}


/* =====================================================
   PROCESS PENDING SIGNALS
===================================================== */

async function processPendingSignals(){

    if(!peerConnection){
        return;
    }


    const signals =
        [...pendingSignals];


    pendingSignals =
        [];


    for(
        const signal of signals
    ){

        try{

            await handleSignal(
                signal
            );

        }catch(error){

            console.error(
                "Pending signal:",
                error
            );

        }

    }

}


/* =====================================================
   LOAD OLD SIGNALS
===================================================== */

async function loadExistingSignals(){

    if(
        !conversationId ||
        !callId
    ){

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("call_signals")
            .select(`
                id,
                conversation_id,
                sender_id,
                signal_type,
                payload,
                created_at
            `)
            .eq(
                "conversation_id",
                conversationId
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(
            "Load old signals:",
            error
        );

        return;
    }


    if(!data){
        return;
    }


    for(
        const signal of data
    ){

        if(
            signal.sender_id ===
            currentUser.id
        ){

            continue;
        }


        if(
            signal.payload?.call_id !==
            callId
        ){

            continue;
        }


        await handleSignal(
            signal
        );

    }

}


/* =====================================================
   SUBSCRIBE CALL STATUS
===================================================== */

function subscribeCallStatus(){

    return new Promise(
        resolve => {

            callChannel =
                supabaseClient
                    .channel(
                        "call-status-" +
                        callId
                    )
                    .on(

                        "postgres_changes",

                        {
                            event:
                                "UPDATE",

                            schema:
                                "public",

                            table:
                                "calls",

                            filter:
                                "id=eq." +
                                callId
                        },

                        payload => {

                            const updated =
                                payload.new;


                            if(
                                updated.status ===
                                "accepted"
                            ){

                                setStatus(
                                    "Connected"
                                );

                            }


                            if(
                                updated.status ===
                                "rejected"
                            ){

                                showToast(
                                    "Call rejected"
                                );

                                finishCall(
                                    false
                                );

                            }


                            if(
                                updated.status ===
                                "ended"
                            ){

                                finishCall(
                                    false
                                );

                            }

                        }

                    )

                    .subscribe(
                        status => {

                            console.log(
                                "Call status:",
                                status
                            );


                            if(
                                status ===
                                "SUBSCRIBED"
                            ){

                                resolve();

                            }

                            if(
                                status ===
                                "CHANNEL_ERROR" ||
                                status ===
                                "TIMED_OUT"
                            ){

                                resolve();

                            }

                        }
                    );

        }
    );

}


/* =====================================================
   OUTGOING CALL
===================================================== */

async function startOutgoingCall(){

    try{

        setStatus(
            "Calling..."
        );


        await getLocalMedia();


        createPeer();


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await sendSignal(
            "offer",
            offer
        );


        await supabaseClient
            .from("calls")
            .update({
                status:
                    "ringing"
            })
            .eq(
                "id",
                callId
            );


    }catch(error){

        console.error(
            "Outgoing call:",
            error
        );

        showToast(
            "Call শুরু করা যায়নি"
        );

    }

}


/* =====================================================
   SHOW INCOMING CALL
===================================================== */

function showIncomingCall(){

    setStatus(
        "Incoming call..."
    );


    incomingBox.style.display =
        "flex";

}


/* =====================================================
   ACCEPT CALL
===================================================== */

async function acceptCall(){

    try{

        incomingBox.style.display =
            "none";


        setStatus(
            "Connecting..."
        );


        /* =========================
           UPDATE CALL
        ========================= */

        const {
            error
        } =
            await supabaseClient
                .from("calls")
                .update({
                    status:
                        "accepted"
                })
                .eq(
                    "id",
                    callId
                );


        if(error){

            console.error(
                "Accept update:",
                error
            );

        }


        /* =========================
           MEDIA
        ========================= */

        await getLocalMedia();


        /* =========================
           PEER
        ========================= */

        createPeer();


        /*
         * প্রথমে Realtime থেকে আসা
         * pending offer process করবে
         */

        await processPendingSignals();


        /*
         * এরপর database থেকে
         * পুরোনো offer/ICE/answer খুঁজবে
         */

        await loadExistingSignals();


        /*
         * আবার pending থাকলে process
         */

        await processPendingSignals();


    }catch(error){

        console.error(
            "Accept call:",
            error
        );

        showToast(
            error.message ||
            "Call accept করা যায়নি"
        );

    }

}


/* =====================================================
   REJECT CALL
===================================================== */

async function rejectCall(){

    try{

        incomingBox.style.display =
            "none";


        await sendSignal(
            "reject",
            {}
        );


        await supabaseClient
            .from("calls")
            .update({
                status:
                    "rejected"
            })
            .eq(
                "id",
                callId
            );


    }catch(error){

        console.error(
            "Reject:",
            error
        );

    }


    finishCall(
        false
    );

}


/* =====================================================
   MUTE
===================================================== */

function toggleMute(){

    if(!localStream){
        return;
    }


    const audioTracks =
        localStream.getAudioTracks();


    if(!audioTracks.length){
        return;
    }


    isMuted =
        !isMuted;


    audioTracks.forEach(
        track => {

            track.enabled =
                !isMuted;

        }
    );


    const btn =
        document.getElementById(
            "muteBtn"
        );


    btn.textContent =
        isMuted
            ? "🔇"
            : "🎤";


    btn.classList.toggle(
        "active",
        isMuted
    );

}


/* =====================================================
   CAMERA ON/OFF
===================================================== */

function toggleCamera(){

    if(
        callType !== "video" ||
        !localStream
    ){

        return;
    }


    const videoTracks =
        localStream.getVideoTracks();


    if(!videoTracks.length){
        return;
    }


    isCameraOff =
        !isCameraOff;


    videoTracks.forEach(
        track => {

            track.enabled =
                !isCameraOff;

        }
    );


    const btn =
        document.getElementById(
            "cameraBtn"
        );


    btn.textContent =
        isCameraOff
            ? "🚫"
            : "📹";


    btn.classList.toggle(
        "active",
        isCameraOff
    );

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

    if(
        callType !== "video"
    ){

        return;
    }


    try{

        usingFrontCamera =
            !usingFrontCamera;


        const newStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{
                        facingMode:
                            usingFrontCamera
                                ? "user"
                                : "environment"
                    }

                });


        const newVideoTrack =
            newStream
                .getVideoTracks()[0];


        if(!newVideoTrack){
            return;
        }


        const sender =
            peerConnection
                ? peerConnection
                    .getSenders()
                    .find(
                        s =>
                            s.track &&
                            s.track.kind ===
                            "video"
                    )
                : null;


        if(sender){

            await sender
                .replaceTrack(
                    newVideoTrack
                );

        }


        if(localStream){

            const oldTrack =
                localStream
                    .getVideoTracks()[0];


            if(oldTrack){

                localStream.removeTrack(
                    oldTrack
                );

                oldTrack.stop();

            }


            localStream.addTrack(
                newVideoTrack
            );

        }


        localVideo.srcObject =
            localStream;


        try{

            await localVideo.play();

        }catch(error){

            console.log(
                "Camera play:",
                error
            );

        }


    }catch(error){

        console.error(
            "Switch camera:",
            error
        );

        showToast(
            "Camera switch করা যায়নি"
        );

    }

}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

    if(ended){
        return;
    }


    ended = true;


    try{

        await sendSignal(
            "hangup",
            {}
        );

    }catch(error){

        console.error(
            "Hangup signal:",
            error
        );

    }


    try{

        await supabaseClient
            .from("calls")
            .update({
                status:
                    "ended"
            })
            .eq(
                "id",
                callId
            );

    }catch(error){

        console.error(
            "End call update:",
            error
        );

    }


    cleanup();


    setTimeout(
        goBack,
        300
    );

}


/* =====================================================
   FINISH CALL
===================================================== */

function finishCall(
    redirect = true
){

    if(
        ended &&
        redirect
    ){

        return;
    }


    ended = true;


    cleanup();


    if(redirect){

        setTimeout(
            goBack,
            300
        );

    }else{

        setTimeout(
            goBack,
            500
        );

    }

}


/* =====================================================
   CLEANUP
===================================================== */

function cleanup(){

    /* =========================
       LOCAL STREAM
    ========================= */

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;

    }


    /* =========================
       PEER
    ========================= */

    if(peerConnection){

        try{
            peerConnection.close();
        }catch(e){}

        peerConnection =
            null;

    }


    /* =========================
       REMOTE
    ========================= */

    remoteVideo.srcObject =
        null;

    remoteAudio.srcObject =
        null;

    localVideo.srcObject =
        null;


    /* =========================
       CHANNELS
    ========================= */

    if(signalChannel){

        try{

            supabaseClient
                .removeChannel(
                    signalChannel
                );

        }catch(e){}

        signalChannel =
            null;

    }


    if(callChannel){

        try{

            supabaseClient
                .removeChannel(
                    callChannel
                );

        }catch(e){}

        callChannel =
            null;

    }


    pendingSignals =
        [];

    pendingIceCandidates =
        [];

    queuedSignalIds.clear();

    handledSignalIds.clear();


    remoteDescriptionSet =
        false;

}


/* =====================================================
   GO BACK
===================================================== */

function goBack(){

    if(
        window.history.length > 1
    ){

        window.history.back();

    }else{

        window.location.href =
            "chat.html";

    }

}


/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);


/* =====================================================
   START
===================================================== */

init();

</script>
