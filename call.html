<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>RAZTARA — Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

html,body{
  width:100%;
  height:100%;
  background:#101b20;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  overflow:hidden
}

button{
  font:inherit;
  cursor:pointer
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:linear-gradient(180deg,#18343a,#071014)
}

.remote{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#152328
}

.remote.hidden{
  display:none
}

.remote-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:radial-gradient(circle at 50% 38%,#28545a,#0a171b 58%);
  z-index:1
}

.remote-placeholder.hidden{
  display:none
}

.avatar{
  width:112px;
  height:112px;
  border-radius:50%;
  object-fit:cover;
  background:#075e54;
  border:3px solid #ffffff30;
  box-shadow:0 12px 35px #0006
}

.caller-name{
  font-size:24px;
  font-weight:750;
  max-width:85%;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.state{
  font-size:14px;
  color:#d7e5e2
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:calc(14px + env(safe-area-inset-top)) 16px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  z-index:5;
  background:linear-gradient(#0008,transparent)
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#0005;
  color:#fff;
  font-size:28px
}

.top-name{
  font-size:16px;
  font-weight:700;
  flex:1
}

.top-type{
  font-size:11px;
  opacity:.75
}

.local-wrap{
  position:absolute;
  right:14px;
  top:calc(74px + env(safe-area-inset-top));
  width:108px;
  height:152px;
  border-radius:14px;
  overflow:hidden;
  background:#1a2a2f;
  border:1px solid #ffffff44;
  box-shadow:0 6px 20px #0006;
  z-index:6
}

.local{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1)
}

.local-off{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9fb0b4;
  font-size:12px;
  background:#152328
}

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  z-index:7;
  background:linear-gradient(transparent,#000b 70%);
  flex-wrap:wrap
}

.control{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:#ffffff20;
  color:#fff;
  font-size:23px;
  backdrop-filter:blur(10px)
}

.control.on{
  background:#fff;
  color:#172126
}

.end{
  width:66px;
  height:66px;
  border:0;
  border-radius:50%;
  background:#e53935;
  color:#fff;
  font-size:27px;
  box-shadow:0 5px 18px #0007
}

.incoming{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:20;
  background:linear-gradient(180deg,#18343a,#071014)
}

.incoming.show{
  display:flex
}

.incoming .avatar{
  width:126px;
  height:126px;
  margin-bottom:20px
}

.incoming h1{
  font-size:26px;
  margin-bottom:7px
}

.incoming p{
  color:#c5d2d4;
  font-size:14px
}

.incoming-actions{
  display:flex;
  gap:58px;
  margin-top:58px
}

.in-btn{
  width:66px;
  height:66px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:28px
}

.accept{
  background:#20a464
}

.decline{
  background:#e53935
}

.in-label{
  font-size:11px;
  color:#d0dcde;
  text-align:center;
  margin-top:8px
}

.toast{
  position:absolute;
  left:50%;
  bottom:calc(104px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:#26383a;
  color:#fff;
  padding:9px 15px;
  border-radius:22px;
  font-size:12px;
  z-index:30;
  opacity:0;
  transition:.2s;
  pointer-events:none;
  white-space:nowrap
}

.toast.show{
  opacity:1
}

.hidden{
  display:none!important
}

@media(min-width:700px){
  .app{
    max-width:520px;
    margin:auto;
    box-shadow:0 0 50px #0008
  }

  .top{
    max-width:520px;
    left:50%;
    right:auto;
    width:520px;
    transform:translateX(-50%)
  }

  .controls{
    max-width:520px;
    left:50%;
    right:auto;
    width:520px;
    transform:translateX(-50%)
  }
}
</style>
</head>

<body>

<main class="app">

  <video
    id="remoteVideo"
    class="remote hidden"
    autoplay
    playsinline
    webkit-playsinline>
  </video>

  <div id="remotePlaceholder" class="remote-placeholder">

    <img id="bigAvatar" class="avatar" src="" alt="">

    <div id="callerName" class="caller-name">
      RAZTARA User
    </div>

    <div id="state" class="state">
      Connecting...
    </div>

    <div id="duration" class="state hidden">
      00:00
    </div>

  </div>

  <header class="top">

    <button class="back" onclick="leaveCall()">
      ‹
    </button>

    <div class="top-name" id="topName">
      RAZTARA User
    </div>

    <div class="top-type" id="topType">
      Audio call
    </div>

  </header>

  <div id="localWrap" class="local-wrap hidden">

    <video
      id="localVideo"
      class="local"
      autoplay
      muted
      playsinline
      webkit-playsinline>
    </video>

    <div id="localOff" class="local-off hidden">
      Camera off
    </div>

  </div>

  <div id="controls" class="controls hidden">

    <button
      id="speakerBtn"
      class="control"
      onclick="toggleSpeaker()">
      🔊
    </button>

    <button
      id="muteBtn"
      class="control"
      onclick="toggleMute()">
      🎤
    </button>

    <button
      id="cameraBtn"
      class="control hidden"
      onclick="toggleCamera()">
      📹
    </button>

    <button
      id="switchCameraBtn"
      class="control hidden"
      onclick="switchCamera()">
      🔄
    </button>

    <button
      id="modeBtn"
      class="control hidden"
      onclick="toggleCallMode()">
      🔊
    </button>

    <button
      class="end"
      onclick="leaveCall()">
      ☎
    </button>

  </div>

  <section id="incoming" class="incoming">

    <img id="incomingAvatar" class="avatar" src="" alt="">

    <h1 id="incomingName">
      RAZTARA User
    </h1>

    <p id="incomingType">
      Incoming audio call
    </p>

    <div class="incoming-actions">

      <div>
        <button
          class="in-btn decline"
          onclick="rejectCall()">
          ☎
        </button>

        <div class="in-label">
          Decline
        </div>
      </div>

      <div>
        <button
          class="in-btn accept"
          onclick="acceptCall()">
          ☎
        </button>

        <div class="in-label">
          Accept
        </div>
      </div>

    </div>

  </section>

  <div id="toast" class="toast"></div>

</main>

<script>

/* =========================================================
   RAZTARA REAL CALL SYSTEM
   Supabase + WebRTC + Database Signalling
========================================================= */

const SUPABASE_URL =
  "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let me = null;
let other = null;

let conversationId = "";
let callId = "";

let type = "audio";
let callMode = "audio";

let incoming = false;
let accepted = false;
let finished = false;

let pc = null;
let localStream = null;

let muted = false;
let cameraOff = false;
let speakerOn = true;

let remoteReady = false;

let callStartedAt = 0;
let durationTimer = null;

let signalChannel = null;
let pendingIce = [];

let facingMode = "user";

let incomingPoll = null;


/* =========================================================
   URL
========================================================= */

const qs = name =>
  new URLSearchParams(location.search).get(name) || "";


/* =========================================================
   AVATAR
========================================================= */

function avatar(u){

  if(u?.avatar_url){
    return u.avatar_url;
  }

  const n =
    (
      u?.full_name ||
      u?.username ||
      "R"
    ).slice(0,1);

  return (
    "https://ui-avatars.com/api/?name=" +
    encodeURIComponent(n) +
    "&background=075e54&color=fff&bold=true"
  );
}


/* =========================================================
   UI
========================================================= */

function toast(message){

  const e =
    document.getElementById("toast");

  e.textContent = message;

  e.classList.add("show");

  clearTimeout(e._timer);

  e._timer =
    setTimeout(
      () => e.classList.remove("show"),
      2400
    );
}


function setState(message){

  document.getElementById("state")
    .textContent = message;
}


function setProfile(p){

  other = p;

  const a = avatar(p);

  const n =
    p.full_name ||
    p.username ||
    "RAZTARA User";

  document.getElementById("bigAvatar").src = a;

  document.getElementById("incomingAvatar").src = a;

  document.getElementById("callerName").textContent = n;

  document.getElementById("incomingName").textContent = n;

  document.getElementById("topName").textContent = n;

  document.getElementById("topType").textContent =
    callMode === "video"
      ? "Video call"
      : "Audio call";

  document.getElementById("incomingType").textContent =
    "Incoming " +
    (
      type === "video"
        ? "video"
        : "audio"
    ) +
    " call";
}


function showControls(){

  document
    .getElementById("controls")
    .classList.remove("hidden");
}


/* =========================================================
   PROFILE
========================================================= */

async function profile(id){

  const {data,error} =
    await sb
      .from("profiles")
      .select(
        "id,username,full_name,avatar_url"
      )
      .eq("id",id)
      .maybeSingle();

  if(error){
    console.error(error);
    return null;
  }

  return data;
}


/* =========================================================
   INIT
========================================================= */

async function init(){

  const auth =
    await sb.auth.getUser();

  if(
    auth.error ||
    !auth.data.user
  ){

    location.href = "login.html";
    return;
  }

  me = auth.data.user;

  conversationId =
    qs("conversation");

  type =
    qs("type") === "video"
      ? "video"
      : "audio";

  callMode = type;

  callId =
    qs("call_id");

  incoming =
    qs("incoming") === "1";


  /* -------------------------------------------------------
     OUTGOING
  ------------------------------------------------------- */

  const userId =
    qs("user") ||
    qs("user_id");


  /* -------------------------------------------------------
     INCOMING WITH CALL ID
  ------------------------------------------------------- */

  if(incoming && callId){

    await loadIncomingCall(callId);

    return;
  }


  /* -------------------------------------------------------
     INCOMING WITHOUT CALL ID
     Try to find ringing call
  ------------------------------------------------------- */

  if(incoming){

    const found =
      await findPendingCall();

    if(found){

      await loadIncomingCall(found.id);

      return;
    }

    toast("কোনো incoming call পাওয়া যায়নি");

    return;
  }


  /* -------------------------------------------------------
     OUTGOING
  ------------------------------------------------------- */

  if(!userId || !conversationId){

    toast("Call information পাওয়া যায়নি");

    return;
  }


  other =
    await profile(userId);

  if(!other){

    toast("User profile পাওয়া যায়নি");

    return;
  }


  setProfile(other);

  await setupSignalChannel();

  await startOutgoing();

}


/* =========================================================
   FIND PENDING CALL
========================================================= */

async function findPendingCall(){

  const {data,error} =
    await sb
      .from("calls")
      .select(
        "id,conversation_id,caller_id,receiver_id,call_type,status"
      )
      .eq("receiver_id",me.id)
      .eq("status","ringing")
      .order("started_at",{ascending:false})
      .limit(1)
      .maybeSingle();

  if(error){

    console.error(
      "pending call error",
      error
    );

    return null;
  }

  return data;
}


/* =========================================================
   LOAD INCOMING CALL
========================================================= */

async function loadIncomingCall(id){

  const {data,error} =
    await sb
      .from("calls")
      .select(
        "id,conversation_id,caller_id,receiver_id,call_type,status"
      )
      .eq("id",id)
      .maybeSingle();

  if(error || !data){

    toast("Call পাওয়া যায়নি");

    return;
  }


  if(data.receiver_id !== me.id){

    toast("এই Call আপনার জন্য নয়");

    return;
  }


  if(
    ![
      "ringing",
      "answered"
    ].includes(data.status)
  ){

    toast("Call আর active নেই");

    return;
  }


  callId =
    data.id;

  conversationId =
    data.conversation_id;

  type =
    data.call_type === "video"
      ? "video"
      : "audio";

  callMode =
    type;


  other =
    await profile(data.caller_id);

  if(!other){

    toast("Caller profile পাওয়া যায়নি");

    return;
  }


  setProfile(other);

  await setupSignalChannel();

  showIncoming();

  /* -------------------------------------------------------
     Existing offer already inserted before page opened
  ------------------------------------------------------- */

  setTimeout(
    loadExistingSignals,
    300
  );
}


/* =========================================================
   SETUP DATABASE REALTIME
========================================================= */

async function setupSignalChannel(){

  if(signalChannel){

    await sb.removeChannel(
      signalChannel
    );

    signalChannel = null;
  }


  signalChannel =
    sb
      .channel(
        "raztara-call-" +
        conversationId +
        "-" +
        me.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"call_signals",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        async payload => {

          await handleSignal(
            payload.new
          );

        }
      );


  const status =
    await new Promise(resolve => {

      signalChannel.subscribe(
        s => {

          if(
            s === "SUBSCRIBED"
          ){

            resolve(true);

          }

          if(
            s === "CHANNEL_ERROR" ||
            s === "TIMED_OUT"
          ){

            resolve(false);

          }

        }
      );

    });


  if(!status){

    toast("Call connection channel চালু হয়নি");

    console.error(
      "Realtime subscription failed"
    );

  }

}


/* =========================================================
   SEND SIGNAL TO DATABASE
========================================================= */

async function sendSignal(
  signalType,
  payload={}
){

  if(
    !me ||
    !conversationId
  ){

    return null;
  }


  const row = {

    conversation_id:
      conversationId,

    sender_id:
      me.id,

    signal_type:
      signalType,

    payload:
      {
        ...payload,
        call_id:
          callId
      }

  };


  const {data,error} =
    await sb
      .from("call_signals")
      .insert(row)
      .select()
      .maybeSingle();


  if(error){

    console.error(
      "Signal insert error:",
      error
    );

    toast(
      "Call signal পাঠানো যায়নি"
    );

    return null;
  }


  return data;
}


/* =========================================================
   HANDLE SIGNAL
========================================================= */

async function handleSignal(signal){

  if(!signal){
    return;
  }


  if(signal.sender_id === me.id){
    return;
  }


  const p =
    signal.payload || {};


  if(
    p.call_id &&
    p.call_id !== callId
  ){

    return;
  }


  switch(signal.signal_type){

    case "offer":

      await receiveOffer(
        p.offer
      );

      break;


    case "answer":

      await receiveAnswer(
        p.answer
      );

      break;


    case "ice":

      await receiveIce(
        p.candidate
      );

      break;


    case "hangup":

      finish(
        p.reason ||
        "Call ended",
        false
      );

      break;


    case "reject":

      finish(
        "Call declined",
        false
      );

      break;

  }

}


/* =========================================================
   LOAD OLD SIGNALS
========================================================= */

async function loadExistingSignals(){

  if(!callId){
    return;
  }


  const {data,error} =
    await sb
      .from("call_signals")
      .select(
        "id,sender_id,signal_type,payload,created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "signal load error",
      error
    );

    return;
  }


  for(
    const signal of data || []
  ){

    if(
      signal.sender_id === me.id
    ){

      continue;
    }


    const p =
      signal.payload || {};


    if(
      p.call_id !== callId
    ){

      continue;
    }


    await handleSignal(signal);

  }

}


/* =========================================================
   START OUTGOING
========================================================= */

async function startOutgoing(){

  /* -------------------------------------------------------
     Create actual call row
  ------------------------------------------------------- */

  const {data,error} =
    await sb
      .from("calls")
      .insert({

        conversation_id:
          conversationId,

        caller_id:
          me.id,

        receiver_id:
          other.id,

        call_type:
          type,

        status:
          "ringing"

      })
      .select()
      .single();


  if(error){

    console.error(
      "Call create error:",
      error
    );

    toast(
      "Call শুরু করা যায়নি"
    );

    return;
  }


  callId =
    data.id;


  await ensureMedia();

  await createPeer(true);

  await sendSignal(
    "offer",
    {
      offer:
        pc.localDescription
    }
  );


  setState("Ringing...");

}


/* =========================================================
   MEDIA
========================================================= */

async function ensureMedia(){

  if(localStream){

    return true;
  }


  try{

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:true,

          video:
            type === "video"
              ? {
                  facingMode:{
                    ideal:
                      facingMode
                  }
                }
              : false

        });


    const localVideo =
      document.getElementById(
        "localVideo"
      );


    localVideo.srcObject =
      localStream;


    showControls();


    if(type === "video"){

      document
        .getElementById(
          "localWrap"
        )
        .classList
        .remove("hidden");


      document
        .getElementById(
          "cameraBtn"
        )
        .classList
        .remove("hidden");


      document
        .getElementById(
          "switchCameraBtn"
        )
        .classList
        .remove("hidden");


      document
        .getElementById(
          "modeBtn"
        )
        .classList
        .remove("hidden");

    }


    return true;

  }catch(e){

    console.error(e);


    toast(
      e.name === "NotAllowedError"
        ? "Microphone/Camera permission দিন"
        : "Microphone/Camera চালু করা যায়নি"
    );


    throw e;
  }

}


/* =========================================================
   CREATE WEBRTC PEER
========================================================= */

async function createPeer(
  offerer
){

  if(pc){

    return;
  }


  pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        },

        {
          urls:
            "stun:stun2.l.google.com:19302"
        }

      ]

    });


  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  pc.ontrack =
    event => {

      const stream =
        event.streams[0];


      const remoteVideo =
        document.getElementById(
          "remoteVideo"
        );


      remoteVideo.srcObject =
        stream;


      if(callMode === "video"){

        document
          .getElementById(
            "remotePlaceholder"
          )
          .classList
          .add("hidden");


        remoteVideo
          .classList
          .remove("hidden");

      }else{

        remoteVideo
          .classList
          .add("hidden");


        document
          .getElementById(
            "remotePlaceholder"
          )
          .classList
          .remove("hidden");

      }


      remoteReady =
        true;


      setState(
        "Connected"
      );


      startDuration();

      updateCallAnswered();

    };


  pc.onicecandidate =
    async event => {

      if(
        event.candidate
      ){

        await sendSignal(
          "ice",
          {
            candidate:
              event.candidate
          }
        );

      }

    };


  pc.onconnectionstatechange =
    async () => {

      const state =
        pc.connectionState;


      if(state === "connected"){

        setState(
          "Connected"
        );

        startDuration();

      }


      if(
        state === "connecting"
      ){

        setState(
          "Connecting..."
        );

      }


      if(
        state === "failed"
      ){

        setState(
          "Connection failed"
        );

        toast(
          "Call connection failed"
        );

      }


      if(
        state === "disconnected"
      ){

        setState(
          "Connection lost"
        );

      }

    };


  if(offerer){

    const offer =
      await pc.createOffer({

        offerToReceiveAudio:true,

        offerToReceiveVideo:
          type === "video"

      });


    await pc.setLocalDescription(
      offer
    );

  }

}


/* =========================================================
   RECEIVE OFFER
========================================================= */

async function receiveOffer(
  offer
){

  if(!offer){
    return;
  }


  if(!incoming && !accepted){

    return;
  }


  try{

    await ensureMedia();


    if(!pc){

      await createPeer(false);

    }


    if(
      pc.signalingState !==
      "stable"
    ){

      return;
    }


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );


    await flushIce();


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    await sendSignal(
      "answer",
      {
        answer:
          pc.localDescription
      }
    );


    await updateCallAnswered();


    setState(
      "Connecting..."
    );


  }catch(e){

    console.error(
      "offer error",
      e
    );

    toast(
      "Call connection error"
    );

  }

}


/* =========================================================
   RECEIVE ANSWER
========================================================= */

async function receiveAnswer(
  answer
){

  if(!answer || !pc){

    return;
  }


  try{

    if(
      pc.signalingState ===
      "have-local-offer"
    ){

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );


      await flushIce();

      setState(
        "Connected"
      );

    }

  }catch(e){

    console.error(
      "answer error",
      e
    );

  }

}


/* =========================================================
   ICE
========================================================= */

async function receiveIce(
  candidate
){

  if(!candidate){
    return;
  }


  try{

    if(
      pc &&
      pc.remoteDescription
    ){

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    }else{

      pendingIce.push(
        candidate
      );

    }

  }catch(e){

    console.warn(
      "ICE error",
      e
    );

  }

}


async function flushIce(){

  if(
    !pc ||
    !pc.remoteDescription
  ){

    return;
  }


  for(
    const candidate
    of pendingIce
  ){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

    }catch(e){}

  }


  pendingIce = [];

}


/* =========================================================
   INCOMING SCREEN
========================================================= */

function showIncoming(){

  document
    .getElementById(
      "incoming"
    )
    .classList
    .add("show");


  document
    .getElementById(
      "controls"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "remotePlaceholder"
    )
    .classList
    .remove("hidden");


  setState(
    "Incoming " +
    (
      type === "video"
        ? "video"
        : "audio"
    ) +
    " call"
  );

}


/* =========================================================
   ACCEPT
========================================================= */

async function acceptCall(){

  if(accepted){
    return;
  }


  accepted = true;


  document
    .getElementById(
      "incoming"
    )
    .classList
    .remove("show");


  try{

    await ensureMedia();


    if(!pc){

      await createPeer(false);

    }


    await updateCallStatus(
      "answered"
    );


    setState(
      "Connecting..."
    );


    /*
      Offer may already be in database.
      Load it again after accepting.
    */

    await loadExistingSignals();


  }catch(e){

    console.error(e);

    accepted = false;

    await rejectCall();

  }

}


/* =========================================================
   REJECT
========================================================= */

async function rejectCall(){

  try{

    await sendSignal(
      "reject",
      {
        reason:
          "rejected"
      }
    );


    await updateCallStatus(
      "rejected"
    );

  }catch(e){

    console.error(e);

  }


  finish(
    "Call declined",
    false
  );

}


/* =========================================================
   CALL STATUS
========================================================= */

async function updateCallStatus(
  status
){

  if(!callId){
    return;
  }


  const update = {
    status
  };


  if(status === "answered"){

    update.answered_at =
      new Date().toISOString();

  }


  if(
    status === "ended" ||
    status === "rejected" ||
    status === "missed" ||
    status === "failed"
  ){

    update.ended_at =
      new Date().toISOString();

  }


  const {error} =
    await sb
      .from("calls")
      .update(update)
      .eq(
        "id",
        callId
      );


  if(error){

    console.error(
      "call status error",
      error
    );

  }

}


/* =========================================================
   ANSWERED
========================================================= */

async function updateCallAnswered(){

  if(!callId){
    return;
  }


  const {data} =
    await sb
      .from("calls")
      .select(
        "status,answered_at"
      )
      .eq(
        "id",
        callId
      )
      .maybeSingle();


  if(
    data &&
    !data.answered_at
  ){

    await updateCallStatus(
      "answered"
    );

  }

}


/* =========================================================
   DURATION
========================================================= */

function startDuration(){

  if(callStartedAt){
    return;
  }


  callStartedAt =
    Date.now();


  document
    .getElementById(
      "duration"
    )
    .classList
    .remove("hidden");


  updateDuration();


  durationTimer =
    setInterval(
      updateDuration,
      1000
    );

}


function updateDuration(){

  if(!callStartedAt){
    return;
  }


  const seconds =
    Math.floor(
      (
        Date.now() -
        callStartedAt
      ) / 1000
    );


  const minutes =
    String(
      Math.floor(
        seconds / 60
      )
    ).padStart(2,"0");


  const sec =
    String(
      seconds % 60
    ).padStart(2,"0");


  document
    .getElementById(
      "duration"
    )
    .textContent =
      minutes +
      ":" +
      sec;

}


/* =========================================================
   CALL HISTORY
========================================================= */

async function logCall(){

  if(
    !conversationId ||
    !me
  ){

    return;
  }


  const seconds =
    callStartedAt
      ? Math.floor(
          (
            Date.now() -
            callStartedAt
          ) / 1000
        )
      : 0;


  const minutes =
    String(
      Math.floor(
        seconds / 60
      )
    ).padStart(2,"0");


  const sec =
    String(
      seconds % 60
    ).padStart(2,"0");


  const label =
    callMode === "video"
      ? "Video call"
      : "Audio call";


  const {error} =
    await sb
      .from("messages")
      .insert({

        conversation_id:
          conversationId,

        sender_id:
          me.id,

        content:
          "📞 " +
          label +
          " • " +
          minutes +
          ":" +
          sec +
          " • Call ended",

        message_type:
          "call"

      });


  if(error){

    console.error(
      "call history error",
      error
    );

  }

}


/* =========================================================
   MUTE
========================================================= */

function toggleMute(){

  if(!localStream){
    return;
  }


  muted =
    !muted;


  localStream
    .getAudioTracks()
    .forEach(
      track => {
        track.enabled =
          !muted;
      }
    );


  const button =
    document.getElementById(
      "muteBtn"
    );


  button
    .classList
    .toggle(
      "on",
      muted
    );


  button.textContent =
    muted
      ? "🔇"
      : "🎤";

}


/* =========================================================
   CAMERA
========================================================= */

function toggleCamera(){

  if(
    !localStream ||
    type !== "video"
  ){

    return;
  }


  cameraOff =
    !cameraOff;


  localStream
    .getVideoTracks()
    .forEach(
      track => {
        track.enabled =
          !cameraOff;
      }
    );


  document
    .getElementById(
      "localOff"
    )
    .classList
    .toggle(
      "hidden",
      !cameraOff
    );


  document
    .getElementById(
      "localVideo"
    )
    .classList
    .toggle(
      "hidden",
      cameraOff
    );


  document
    .getElementById(
      "cameraBtn"
    )
    .textContent =
      cameraOff
        ? "📷"
        : "📹";

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera(){

  if(
    !localStream ||
    type !== "video"
  ){

    return;
  }


  const oldTrack =
    localStream
      .getVideoTracks()[0];


  try{

    const nextMode =
      facingMode === "user"
        ? "environment"
        : "user";


    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              exact:
                nextMode
            }
          },

          audio:false

        });


    const newTrack =
      stream
        .getVideoTracks()[0];


    const sender =
      pc?.getSenders()
        .find(
          s =>
            s.track &&
            s.track.kind ===
              "video"
        );


    if(sender){

      await sender.replaceTrack(
        newTrack
      );

    }


    if(oldTrack){

      oldTrack.stop();

      localStream.removeTrack(
        oldTrack
      );

    }


    localStream.addTrack(
      newTrack
    );


    facingMode =
      nextMode;


    document
      .getElementById(
        "localVideo"
      )
      .srcObject =
        localStream;


    newTrack.enabled =
      !cameraOff;


    toast(
      facingMode === "environment"
        ? "Back camera"
        : "Front camera"
    );


  }catch(e){

    console.error(e);

    toast(
      "Back camera চালু করা যায়নি"
    );

  }

}


/* =========================================================
   VIDEO → AUDIO
========================================================= */

async function toggleCallMode(){

  if(
    !localStream ||
    !pc ||
    type !== "video"
  ){

    return;
  }


  if(callMode === "video"){

    callMode =
      "audio";


    cameraOff =
      true;


    localStream
      .getVideoTracks()
      .forEach(
        track => {
          track.enabled =
            false;
        }
      );


    document
      .getElementById(
        "localWrap"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "remoteVideo"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "remotePlaceholder"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "cameraBtn"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "switchCameraBtn"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "modeBtn"
      )
      .textContent =
        "📹";


    document
      .getElementById(
        "topType"
      )
      .textContent =
        "Audio call";


    setState(
      "Connected"
    );


    await sendSignal(
      "mode",
      {
        mode:"audio"
      }
    );


    toast(
      "Audio call চালু হয়েছে"
    );

  }

}


/* =========================================================
   SPEAKER
========================================================= */

function toggleSpeaker(){

  const remoteVideo =
    document.getElementById(
      "remoteVideo"
    );


  speakerOn =
    !speakerOn;


  remoteVideo.muted =
    !speakerOn;


  document
    .getElementById(
      "speakerBtn"
    )
    .classList
    .toggle(
      "on",
      !speakerOn
    );

}


/* =========================================================
   END CALL
========================================================= */

async function leaveCall(){

  if(finished){
    return;
  }


  try{

    await sendSignal(
      "hangup",
      {
        reason:
          "ended"
      }
    );

  }catch(e){}


  await finish(
    "Call ended",
    true
  );

}


/* =========================================================
   FINISH
========================================================= */

async function finish(
  message,
  writeHistory=true
){

  if(finished){
    return;
  }


  finished =
    true;


  if(durationTimer){

    clearInterval(
      durationTimer
    );

    durationTimer =
      null;

  }


  if(writeHistory){

    await logCall();

  }


  if(callId){

    await updateCallStatus(
      "ended"
    );

  }


  if(pc){

    try{
      pc.close();
    }catch(e){}

    pc = null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => {
          try{
            track.stop();
          }catch(e){}
        }
      );

    localStream =
      null;

  }


  if(signalChannel){

    try{

      await sb.removeChannel(
        signalChannel
      );

    }catch(e){}

    signalChannel =
      null;

  }


  if(incomingPoll){

    clearInterval(
      incomingPoll
    );

    incomingPoll =
      null;

  }


  toast(message);


  setTimeout(
    () => {

      if(
        history.length > 1
      ){

        history.back();

      }else{

        location.href =
          "index.html";

      }

    },
    700
  );

}


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
  "pagehide",
  async () => {

    if(
      !finished &&
      callId
    ){

      try{

        await sb
          .from("call_signals")
          .insert({

            conversation_id:
              conversationId,

            sender_id:
              me?.id,

            signal_type:
              "hangup",

            payload:{
              call_id:
                callId,
              reason:
                "pagehide"
            }

          });

      }catch(e){}

    }

  }
);


/* =========================================================
   START
========================================================= */

init();

</script>
