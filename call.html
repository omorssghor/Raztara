<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RAZTARA — Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,
                 "Segoe UI",Roboto,Arial,sans-serif;
    background:#111b21;
    color:#fff;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
    color:#fff;
}

/* =========================
   MAIN CALL SCREEN
========================= */

.call-screen{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 25%,
        rgba(30,120,90,.28),
        transparent 38%),
        linear-gradient(180deg,#17252b 0%,#071014 100%);
    display:flex;
    flex-direction:column;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:relative;
    z-index:20;
    width:100%;
    min-height:72px;
    padding:
        max(12px,env(safe-area-inset-top))
        16px
        10px
        16px;

    display:flex;
    align-items:center;
    gap:13px;

    background:rgba(0,0,0,.20);
    backdrop-filter:blur(12px);
}

.back-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.profile{
    display:flex;
    align-items:center;
    gap:11px;
    flex:1;
    min-width:0;
}

.profile-img{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    background:#26343a;
    border:2px solid rgba(255,255,255,.18);
}

.profile-info{
    min-width:0;
}

.profile-name{
    font-size:17px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.call-status{
    margin-top:3px;
    color:#b8c4c8;
    font-size:13px;
}

/* =========================
   VIDEO AREA
========================= */

.video-area{
    position:absolute;
    inset:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.remote-video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
    display:none;
}

.remote-video.active{
    display:block;
}

.avatar-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.big-avatar{
    width:132px;
    height:132px;
    border-radius:50%;
    object-fit:cover;
    background:#26343a;
    border:4px solid rgba(255,255,255,.15);
    box-shadow:0 12px 40px rgba(0,0,0,.4);
}

.big-name{
    font-size:25px;
    font-weight:500;
}

.connecting{
    color:#c2cccf;
    font-size:14px;
}

/* =========================
   LOCAL VIDEO
========================= */

.local-video{
    position:absolute;
    z-index:10;
    right:15px;
    top:90px;

    width:105px;
    height:145px;

    object-fit:cover;
    background:#000;

    border-radius:13px;
    border:2px solid rgba(255,255,255,.5);

    display:none;
    box-shadow:0 7px 20px rgba(0,0,0,.45);
}

.local-video.active{
    display:block;
}

/* =========================
   CONTROLS
========================= */

.bottom-area{
    position:absolute;
    z-index:30;
    left:0;
    right:0;
    bottom:0;

    padding:
        18px
        18px
        max(22px,env(safe-area-inset-bottom))
        18px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;

    background:linear-gradient(
        to top,
        rgba(0,0,0,.72),
        rgba(0,0,0,0)
    );
}

.control-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
}

.control{
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(255,255,255,.16);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    backdrop-filter:blur(10px);
    transition:.15s;
}

.control:active{
    transform:scale(.91);
}

.control.active{
    background:#fff;
    color:#111;
}

.end-call{
    width:68px;
    height:68px;
    border-radius:50%;
    background:#e53935;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;
    transform:rotate(135deg);

    box-shadow:0 7px 25px rgba(229,57,53,.35);
}

.end-call:active{
    transform:rotate(135deg) scale(.91);
}

/* =========================
   INCOMING CALL
========================= */

.incoming-overlay{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;
    flex-direction:column;
    align-items:center;

    padding:
        max(40px,env(safe-area-inset-top))
        25px
        max(30px,env(safe-area-inset-bottom));

    background:
        linear-gradient(
            180deg,
            #182a30,
            #081115
        );
}

.incoming-overlay.show{
    display:flex;
}

.incoming-label{
    margin-top:10px;
    color:#aebabe;
    font-size:15px;
}

.incoming-avatar{
    width:125px;
    height:125px;
    border-radius:50%;
    object-fit:cover;
    margin-top:95px;

    border:4px solid rgba(255,255,255,.15);
}

.incoming-name{
    margin-top:20px;
    font-size:27px;
    font-weight:500;
}

.incoming-type{
    margin-top:8px;
    color:#b6c2c6;
}

.incoming-actions{
    margin-top:auto;
    width:100%;

    display:flex;
    justify-content:space-around;
    align-items:center;
}

.incoming-action{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;

    background:none;
}

.incoming-circle{
    width:67px;
    height:67px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
}

.decline-circle{
    background:#e53935;
    transform:rotate(135deg);
}

.accept-circle{
    background:#28c76f;
    transform:rotate(135deg);
}

.incoming-action span{
    font-size:13px;
    color:#d4dcde;
}

/* =========================
   ERROR / MESSAGE
========================= */

.message-box{
    position:fixed;
    z-index:200;
    left:50%;
    bottom:120px;

    transform:translateX(-50%);

    width:calc(100% - 35px);
    max-width:420px;

    padding:13px 16px;

    border-radius:12px;

    background:rgba(20,20,20,.92);
    color:#fff;

    text-align:center;
    font-size:14px;

    display:none;
}

.message-box.show{
    display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .local-video{
        width:92px;
        height:125px;
        top:82px;
        right:10px;
    }

    .control-row{
        gap:12px;
    }

    .control{
        width:54px;
        height:54px;
        font-size:22px;
    }

    .end-call{
        width:64px;
        height:64px;
    }
}
</style>
</head>

<body>

<div class="call-screen">

    <!-- VIDEO -->
    <div class="video-area">

        <video
            id="remoteVideo"
            class="remote-video"
            autoplay
            playsinline>
        </video>

        <div id="avatarArea" class="avatar-area">

            <img
                id="bigAvatar"
                class="big-avatar"
                src=""
                alt="Profile">

            <div id="bigName" class="big-name">
                RAZTARA User
            </div>

            <div id="connectingText" class="connecting">
                Calling…
            </div>

        </div>

        <video
            id="localVideo"
            class="local-video"
            autoplay
            muted
            playsinline>
        </video>

    </div>

    <!-- TOP -->
    <div class="topbar">

        <button
            class="back-btn"
            onclick="goBack()">
            ‹
        </button>

        <div class="profile">

            <img
                id="profileImg"
                class="profile-img"
                src=""
                alt="">

            <div class="profile-info">

                <div
                    id="profileName"
                    class="profile-name">
                    RAZTARA User
                </div>

                <div
                    id="callStatus"
                    class="call-status">
                    Calling…
                </div>

            </div>

        </div>

    </div>

    <!-- CONTROLS -->
    <div class="bottom-area">

        <div class="control-row">

            <button
                id="muteBtn"
                class="control"
                onclick="toggleMute()">
                🎙️
            </button>

            <button
                id="speakerBtn"
                class="control"
                onclick="toggleSpeaker()">
                🔊
            </button>

            <button
                id="cameraBtn"
                class="control"
                onclick="toggleCamera()">
                📷
            </button>

            <button
                id="switchBtn"
                class="control"
                onclick="switchCamera()">
                🔄
            </button>

            <button
                id="modeBtn"
                class="control"
                onclick="toggleCallMode()">
                🎥
            </button>

        </div>

        <button
            class="end-call"
            onclick="endCall()">
            📞
        </button>

    </div>

</div>


<!-- INCOMING -->
<div
    id="incomingOverlay"
    class="incoming-overlay">

    <div class="incoming-label">
        Incoming call
    </div>

    <img
        id="incomingAvatar"
        class="incoming-avatar"
        src=""
        alt="">

    <div
        id="incomingName"
        class="incoming-name">
        RAZTARA User
    </div>

    <div
        id="incomingType"
        class="incoming-type">
        Incoming video call
    </div>

    <div class="incoming-actions">

        <button
            class="incoming-action"
            onclick="rejectIncoming()">

            <div class="incoming-circle decline-circle">
                📞
            </div>

            <span>Decline</span>

        </button>

        <button
            class="incoming-action"
            onclick="acceptIncoming()">

            <div class="incoming-circle accept-circle">
                📞
            </div>

            <span>Accept</span>

        </button>

    </div>

</div>


<div
    id="messageBox"
    class="message-box">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let callId = null;
let conversationId = null;

let callerId = null;
let receiverId = null;

let callType = "video";

let pc = null;

let localStream = null;

let remoteStream = null;

let isMuted = false;
let isSpeaker = true;
let cameraEnabled = true;

let isIncoming = false;
let isConnected = false;

let seconds = 0;
let timer = null;

let channel = null;

let activeCamera = "user";


/* =====================================================
   DOM
===================================================== */

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const avatarArea =
    document.getElementById("avatarArea");

const bigAvatar =
    document.getElementById("bigAvatar");

const bigName =
    document.getElementById("bigName");

const profileImg =
    document.getElementById("profileImg");

const profileName =
    document.getElementById("profileName");

const callStatus =
    document.getElementById("callStatus");

const connectingText =
    document.getElementById("connectingText");

const incomingOverlay =
    document.getElementById("incomingOverlay");

const incomingAvatar =
    document.getElementById("incomingAvatar");

const incomingName =
    document.getElementById("incomingName");

const incomingType =
    document.getElementById("incomingType");


/* =====================================================
   HELPERS
===================================================== */

function showMessage(message){

    const box =
        document.getElementById("messageBox");

    box.textContent = message;

    box.classList.add("show");

    setTimeout(()=>{
        box.classList.remove("show");
    },3000);
}


function setStatus(text){

    callStatus.textContent = text;
    connectingText.textContent = text;
}


function setProfile(name, photo){

    name =
        name ||
        "RAZTARA User";

    photo =
        photo ||
        "https://via.placeholder.com/300";

    profileName.textContent = name;
    bigName.textContent = name;

    profileImg.src = photo;
    bigAvatar.src = photo;

    incomingName.textContent = name;
    incomingAvatar.src = photo;
}


/* =====================================================
   GET URL
===================================================== */

function getParams(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    callId =
        params.get("call") ||
        params.get("call_id");

    conversationId =
        params.get("conversation") ||
        params.get("conversation_id");

    callType =
        params.get("type") ||
        "video";

    isIncoming =
        params.get("incoming") === "1";

}


/* =====================================================
   USER
===================================================== */

async function loadUser(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();

    if(error || !data.user){

        showMessage("Login required");

        return false;
    }

    currentUser =
        data.user;

    return true;
}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(userId){

    if(!userId) return;

    const {
        data,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",userId)
        .maybeSingle();

    if(error || !data){

        setProfile(
            "RAZTARA User",
            ""
        );

        return;
    }

    const name =
        data.name ||
        data.full_name ||
        data.username ||
        "RAZTARA User";

    const photo =
        data.avatar_url ||
        data.profile_photo ||
        data.photo_url ||
        "";

    setProfile(name,photo);
}


/* =====================================================
   WEBRTC
===================================================== */

function createPeer(){

    pc =
        new RTCPeerConnection({

            iceServers:[
                {
                    urls:[
                        "stun:stun.l.google.com:19302",
                        "stun:stun1.l.google.com:19302"
                    ]
                }
            ]
        });


    pc.ontrack = event => {

        if(!remoteStream){

            remoteStream =
                new MediaStream();

            remoteVideo.srcObject =
                remoteStream;
        }

        event.streams[0]
            .getTracks()
            .forEach(track => {

                if(
                    !remoteStream
                    .getTracks()
                    .includes(track)
                ){

                    remoteStream.addTrack(track);
                }

            });


        remoteVideo.classList.add("active");

        avatarArea.style.display =
            "none";
    };


    pc.onicecandidate =
        async event => {

            if(!event.candidate)
                return;

            await sendSignal(
                "ice",
                event.candidate
            );
        };


    pc.onconnectionstatechange =
        () => {

            if(!pc)
                return;

            const state =
                pc.connectionState;

            if(state === "connected"){

                isConnected = true;

                setStatus("Connected");

                startTimer();

            }

            if(
                state === "failed" ||
                state === "disconnected"
            ){

                setStatus(
                    "Connection lost"
                );
            }

        };


    if(localStream){

        localStream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    localStream
                );

            });

    }
}


/* =====================================================
   MEDIA
===================================================== */

async function getMedia(){

    try{

        const constraints = {

            audio:true,

            video:
                callType === "video"
        };


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia(
                constraints
            );


        localVideo.srcObject =
            localStream;


        if(
            callType === "video"
        ){

            localVideo.classList.add(
                "active"
            );

        }else{

            localVideo.classList.remove(
                "active"
            );
        }


    }catch(error){

        console.error(error);

        showMessage(
            "Camera/Microphone permission দিন"
        );

        throw error;
    }
}


/* =====================================================
   SIGNALING
===================================================== */

async function sendSignal(
    signalType,
    payload
){

    if(
        !conversationId ||
        !currentUser
    ){

        return;
    }


    const { error } =
        await supabaseClient
        .from("call_signals")
        .insert({

            conversation_id:
                conversationId,

            sender_id:
                currentUser.id,

            signal_type:
                signalType,

            payload:
                payload

        });


    if(error){

        console.error(
            "Signal error:",
            error
        );
    }
}


/* =====================================================
   HANDLE SIGNAL
===================================================== */

async function handleSignal(row){

    if(!row)
        return;

    if(
        row.sender_id ===
        currentUser.id
    ){

        return;
    }


    const type =
        row.signal_type;

    const payload =
        row.payload;


    try{

        if(type === "offer"){

            await handleOffer(
                payload
            );

        }

        else if(type === "answer"){

            await handleAnswer(
                payload
            );

        }

        else if(type === "ice"){

            if(
                pc &&
                payload
            ){

                await pc.addIceCandidate(
                    new RTCIceCandidate(
                        payload
                    )
                );
            }

        }

        else if(type === "hangup"){

            finishCall(false);

        }

        else if(type === "reject"){

            setStatus(
                "Call declined"
            );

            setTimeout(
                ()=>finishCall(false),
                800
            );

        }

        else if(type === "mode"){

            callType =
                payload.mode ||
                callType;

        }

    }catch(error){

        console.error(
            "Signal handling error",
            error
        );

    }

}


/* =====================================================
   OFFER
===================================================== */

async function createOffer(){

    const offer =
        await pc.createOffer();

    await pc.setLocalDescription(
        offer
    );

    await sendSignal(
        "offer",
        offer
    );

}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(
    offer
){

    if(!pc){

        await getMedia();

        createPeer();
    }


    await pc.setRemoteDescription(
        new RTCSessionDescription(
            offer
        )
    );


    const answer =
        await pc.createAnswer();

    await pc.setLocalDescription(
        answer
    );


    await sendSignal(
        "answer",
        answer
    );

}


/* =====================================================
   HANDLE ANSWER
===================================================== */

async function handleAnswer(
    answer
){

    if(!pc)
        return;

    await pc.setRemoteDescription(
        new RTCSessionDescription(
            answer
        )
    );

}


/* =====================================================
   REALTIME
===================================================== */

function subscribeSignals(){

    if(!conversationId)
        return;


    channel =
        supabaseClient
        .channel(
            "raztara-call-" +
            conversationId +
            "-" +
            currentUser.id
        );


    channel
    .on(
        "postgres_changes",
        {
            event:"INSERT",
            schema:"public",
            table:"call_signals",
            filter:
                "conversation_id=eq." +
                conversationId
        },
        payload => {

            handleSignal(
                payload.new
            );

        }
    )
    .subscribe(
        status => {

            console.log(
                "Call channel:",
                status
            );

        }
    );
}


/* =====================================================
   LOAD OLD SIGNALS
===================================================== */

async function loadSignals(){

    if(
        !conversationId ||
        !currentUser
    ){

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
        .from("call_signals")
        .select("*")
        .eq(
            "conversation_id",
            conversationId
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        return;
    }


    for(
        const row of data || []
    ){

        await handleSignal(row);

    }
}


/* =====================================================
   OUTGOING CALL
===================================================== */

async function startOutgoing(){

    isIncoming = false;

    setStatus("Calling…");


    await getMedia();

    createPeer();

    subscribeSignals();


    if(!callId){

        const {
            data,
            error
        } =
            await supabaseClient
            .from("calls")
            .insert({

                conversation_id:
                    conversationId,

                caller_id:
                    currentUser.id,

                receiver_id:
                    receiverId,

                call_type:
                    callType,

                status:
                    "ringing"

            })
            .select()
            .single();


        if(error){

            console.error(error);

            showMessage(
                "Call শুরু করা যায়নি"
            );

            return;
        }


        callId =
            data.id;
    }


    await createOffer();

}


/* =====================================================
   INCOMING CALL
===================================================== */

async function prepareIncoming(){

    isIncoming = true;


    if(!callId){

        showMessage(
            "Incoming call information পাওয়া যায়নি"
        );

        return;
    }


    const {
        data:call,
        error
    } =
        await supabaseClient
        .from("calls")
        .select("*")
        .eq("id",callId)
        .maybeSingle();


    if(error || !call){

        showMessage(
            "Call পাওয়া যায়নি"
        );

        return;
    }


    callerId =
        call.caller_id;

    receiverId =
        call.receiver_id;

    conversationId =
        call.conversation_id;

    callType =
        call.call_type ||
        "video";


    await loadProfile(
        callerId
    );


    incomingType.textContent =
        callType === "video"
        ? "Incoming video call"
        : "Incoming audio call";


    incomingOverlay.classList.add(
        "show"
    );


    subscribeSignals();

}


/* =====================================================
   ACCEPT
===================================================== */

async function acceptIncoming(){

    incomingOverlay.classList.remove(
        "show"
    );


    setStatus("Connecting…");


    await getMedia();

    createPeer();


    if(callId){

        await supabaseClient
        .from("calls")
        .update({

            status:"answered",

            answered_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            callId
        );

    }


    /*
       Incoming page-এ offer আগে থেকেই
       database-এ থাকলে এটি load করবে।
    */

    await loadSignals();

}


/* =====================================================
   REJECT
===================================================== */

async function rejectIncoming(){

    incomingOverlay.classList.remove(
        "show"
    );


    await sendSignal(
        "reject",
        {
            reason:"declined"
        }
    );


    if(callId){

        await supabaseClient
        .from("calls")
        .update({
            status:"rejected",
            ended_at:
                new Date().toISOString()
        })
        .eq(
            "id",
            callId
        );

    }


    setTimeout(
        ()=>goBack(),
        500
    );
}


/* =====================================================
   MUTE
===================================================== */

function toggleMute(){

    if(!localStream)
        return;


    const tracks =
        localStream.getAudioTracks();


    if(!tracks.length)
        return;


    isMuted =
        !isMuted;


    tracks.forEach(
        track => {
            track.enabled =
                !isMuted;
        }
    );


    const btn =
        document.getElementById(
            "muteBtn"
        );


    btn.classList.toggle(
        "active",
        isMuted
    );


    btn.textContent =
        isMuted
        ? "🔇"
        : "🎙️";
}


/* =====================================================
   SPEAKER
===================================================== */

async function toggleSpeaker(){

    isSpeaker =
        !isSpeaker;


    const btn =
        document.getElementById(
            "speakerBtn"
        );


    btn.classList.toggle(
        "active",
        !isSpeaker
    );


    /*
       Browser/iPhone-এ speaker routing
       সবসময় JavaScript দিয়ে control করা যায় না।
       এখানে remote audio mute/unmute রাখা হলো।
    */

    try{

        if(
            "setSinkId" in remoteVideo
        ){

            await remoteVideo.setSinkId(
                isSpeaker
                ? "default"
                : "default"
            );

        }

    }catch(error){

        console.log(error);

    }
}


/* =====================================================
   CAMERA
===================================================== */

function toggleCamera(){

    if(!localStream)
        return;


    const tracks =
        localStream.getVideoTracks();


    if(!tracks.length)
        return;


    cameraEnabled =
        !cameraEnabled;


    tracks.forEach(
        track => {
            track.enabled =
                cameraEnabled;
        }
    );


    const btn =
        document.getElementById(
            "cameraBtn"
        );


    btn.classList.toggle(
        "active",
        !cameraEnabled
    );


    btn.textContent =
        cameraEnabled
        ? "📷"
        : "🚫";
}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

    if(!localStream)
        return;


    const videoTrack =
        localStream.getVideoTracks()[0];


    if(!videoTrack)
        return;


    activeCamera =
        activeCamera === "user"
        ? "environment"
        : "user";


    try{

        const newStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio:false,

                video:{
                    facingMode:{
                        exact:
                            activeCamera
                    }
                }

            });


        const newTrack =
            newStream
            .getVideoTracks()[0];


        const sender =
            pc
            ?.getSenders()
            .find(
                s =>
                s.track &&
                s.track.kind === "video"
            );


        if(sender){

            await sender.replaceTrack(
                newTrack
            );

        }


        videoTrack.stop();


        localStream.removeTrack(
            videoTrack
        );

        localStream.addTrack(
            newTrack
        );


        localVideo.srcObject =
            localStream;


    }catch(error){

        console.error(error);

        showMessage(
            "Camera switch করা যায়নি"
        );
    }
}


/* =====================================================
   VIDEO / AUDIO MODE
===================================================== */

async function toggleCallMode(){

    if(!localStream)
        return;


    const newMode =
        callType === "video"
        ? "audio"
        : "video";


    callType =
        newMode;


    if(newMode === "audio"){

        localStream
        .getVideoTracks()
        .forEach(
            track => {
                track.enabled = false;
            }
        );


        localVideo.classList.remove(
            "active"
        );


        remoteVideo.classList.remove(
            "active"
        );


        avatarArea.style.display =
            "flex";

    }else{

        try{

            const video =
                await navigator
                .mediaDevices
                .getUserMedia({
                    video:true
                });


            const track =
                video.getVideoTracks()[0];


            const sender =
                pc
                ?.getSenders()
                .find(
                    s =>
                    s.track &&
                    s.track.kind === "video"
                );


            if(sender){

                await sender.replaceTrack(
                    track
                );

            }


            localStream.addTrack(
                track
            );


            localVideo.srcObject =
                localStream;

            localVideo.classList.add(
                "active"
            );


        }catch(error){

            showMessage(
                "Camera চালু করা যায়নি"
            );

            return;
        }

    }


    document
    .getElementById("modeBtn")
    .textContent =
        newMode === "video"
        ? "🎥"
        : "📞";


    await sendSignal(
        "mode",
        {
            mode:newMode
        }
    );
}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    if(timer)
        return;


    seconds = 0;


    timer =
        setInterval(
            ()=>{

                seconds++;

                const min =
                    String(
                        Math.floor(
                            seconds / 60
                        )
                    ).padStart(2,"0");

                const sec =
                    String(
                        seconds % 60
                    ).padStart(2,"0");


                callStatus.textContent =
                    `${min}:${sec}`;

            },
            1000
        );
}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

    try{

        await sendSignal(
            "hangup",
            {
                reason:"ended"
            }
        );


        if(callId){

            await supabaseClient
            .from("calls")
            .update({

                status:"ended",

                ended_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                callId
            );

        }

    }catch(error){

        console.error(error);

    }


    finishCall(true);
}


/* =====================================================
   FINISH
===================================================== */

function finishCall(goBackAfter){

    if(timer){

        clearInterval(timer);

        timer = null;
    }


    if(localStream){

        localStream
        .getTracks()
        .forEach(
            track =>
            track.stop()
        );

        localStream = null;
    }


    if(remoteStream){

        remoteStream
        .getTracks()
        .forEach(
            track =>
            track.stop()
        );

        remoteStream = null;
    }


    if(pc){

        pc.close();

        pc = null;
    }


    if(channel){

        supabaseClient
        .removeChannel(channel);

        channel = null;
    }


    if(goBackAfter){

        goBack();

    }
}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    finishCall(false);

    if(
        document.referrer
    ){

        history.back();

    }else{

        window.location.href =
            "chat.html";
    }
}


/* =====================================================
   INIT
===================================================== */

async function init(){

    getParams();


    const logged =
        await loadUser();

    if(!logged)
        return;


    /*
       URL-এ incoming=1 থাকলে
       Incoming screen দেখাবে।
    */

    if(isIncoming){

        await prepareIncoming();

        return;
    }


    /*
       Outgoing call-এর receiver
       আপনার chat page থেকে URL-এ
       receiver parameter পাঠাতে হবে।
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    receiverId =
        params.get("receiver") ||
        params.get("receiver_id");


    if(receiverId){

        await loadProfile(
            receiverId
        );

    }


    await startOutgoing();
}


init();

</script>
