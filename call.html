<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let callId = null;

let callData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let signalChannel = null;

let callChannel = null;

let pendingIceCandidates = [];

let pendingSignals = [];

let isAccepted = false;

let isMuted = false;

let isCameraOff = false;

let currentFacingMode = "user";

let initialized = false;


/* =====================================================
   DOM
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const audioScreen =
    document.getElementById(
        "audioScreen"
    );

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const localVideo =
    document.getElementById(
        "localVideo"
    );

const remoteAudio =
    document.getElementById(
        "remoteAudio"
    );

const incoming =
    document.getElementById(
        "incoming"
    );

const callStatus =
    document.getElementById(
        "callStatus"
    );

const incomingType =
    document.getElementById(
        "incomingType"
    );

const cameraBtn =
    document.getElementById(
        "cameraBtn"
    );

const muteBtn =
    document.getElementById(
        "muteBtn"
    );


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            ()=>{
                toast.style.display =
                    "none";
            },
            3000
        );
}


/* =====================================================
   GET CALL ID
===================================================== */

function getCallId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("call") ||
        params.get("call_id") ||
        params.get("callId") ||
        params.get("id")
    );
}


/* =====================================================
   GET CURRENT USER
===================================================== */

async function loadCurrentUser(){

    try{

        const {
            data:sessionData,
            error:sessionError
        } =
            await supabaseClient
                .auth
                .getSession();


        if(
            !sessionError &&
            sessionData?.session?.user
        ){

            currentUser =
                sessionData.session.user;

        }else{

            const {
                data:userData,
                error:userError
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if(
                userError ||
                !userData?.user
            ){

                throw new Error(
                    "User ID পাওয়া যায়নি"
                );
            }

            currentUser =
                userData.user;
        }


        console.log(
            "CURRENT USER ID:",
            currentUser.id
        );

        return true;

    }catch(error){

        console.error(
            "AUTH ERROR:",
            error
        );

        showToast(
            "User ID পাওয়া যায়নি। আবার Login করুন।"
        );

        setTimeout(
            ()=>{
                window.location.href =
                    "index.html";
            },
            1500
        );

        return false;
    }
}


/* =====================================================
   LOAD CALL
===================================================== */

async function loadCall(){

    if(!callId){

        showToast(
            "Call ID পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1500
        );

        return false;
    }


    console.log(
        "CALL ID:",
        callId
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("calls")
            .select(`
                id,
                conversation_id,
                caller_id,
                receiver_id,
                call_type,
                status
            `)
            .eq(
                "id",
                callId
            )
            .single();


    if(error){

        console.error(
            "CALL LOAD ERROR:",
            error
        );

        showToast(
            error.message ||
            "Call তথ্য পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1800
        );

        return false;
    }


    callData =
        data;


    console.log(
        "CALL DATA:",
        callData
    );


    if(
        currentUser.id !==
            callData.caller_id &&
        currentUser.id !==
            callData.receiver_id
    ){

        showToast(
            "এই Call-এর সাথে আপনার সম্পর্ক নেই।"
        );

        setTimeout(
            goBack,
            1800
        );

        return false;
    }


    return true;
}


/* =====================================================
   IS CALLER
===================================================== */

function isCaller(){

    return (
        currentUser.id ===
        callData.caller_id
    );
}


/* =====================================================
   IS RECEIVER
===================================================== */

function isReceiver(){

    return (
        currentUser.id ===
        callData.receiver_id
    );
}


/* =====================================================
   WEBRTC CONFIG
===================================================== */

const rtcConfig = {

    iceServers:[

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =====================================================
   CREATE PEER
===================================================== */

function createPeerConnection(){

    if(peerConnection){

        return peerConnection;
    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    remoteAudio.srcObject =
        remoteStream;


    remoteVideo.srcObject =
        remoteStream;


    peerConnection
        .onicecandidate =
        async event => {

            if(
                event.candidate
            ){

                await sendSignal(
                    "ice",
                    event.candidate
                );
            }
        };


    peerConnection
        .ontrack =
        event => {

            console.log(
                "REMOTE TRACK"
            );


            event.streams[0]
                ?.getTracks()
                .forEach(
                    track => {

                        if(
                            !remoteStream
                                .getTracks()
                                .some(
                                    t =>
                                        t.id ===
                                        track.id
                                )
                        ){

                            remoteStream
                                .addTrack(
                                    track
                                );
                        }

                    }
                );


            if(
                callData.call_type ===
                "video"
            ){

                remoteVideo.style.display =
                    "block";

                audioScreen.style.display =
                    "none";

                remoteVideo.play()
                    .catch(
                        ()=>{}
                    );

            }else{

                remoteAudio.play()
                    .catch(
                        ()=>{}
                    );
            }


            callStatus.textContent =
                "Connected";
        };


    peerConnection
        .onconnectionstatechange =
        () => {

            console.log(
                "Connection:",
                peerConnection
                    .connectionState
            );


            if(
                peerConnection
                    .connectionState ===
                "connected"
            ){

                callStatus.textContent =
                    "Connected";

            }


            if(
                peerConnection
                    .connectionState ===
                    "disconnected" ||
                peerConnection
                    .connectionState ===
                    "failed"
            ){

                callStatus.textContent =
                    "Connection lost";
            }


            if(
                peerConnection
                    .connectionState ===
                    "closed"
            ){

                callStatus.textContent =
                    "Call ended";
            }
        };


    return peerConnection;
}


/* =====================================================
   GET MEDIA
===================================================== */

async function getLocalMedia(){

    if(localStream){

        return localStream;
    }


    const isVideo =
        callData.call_type ===
        "video";


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        isVideo
                            ? {
                                facingMode:
                                    currentFacingMode
                              }
                            : false
                });


        localStream
            .getTracks()
            .forEach(
                track => {

                    createPeerConnection()
                        .addTrack(
                            track,
                            localStream
                        );
                }
            );


        if(isVideo){

            localVideo.srcObject =
                localStream;

            localVideo.style.display =
                "block";

            cameraBtn.style.display =
                "flex";

            switchBtnShow(true);

        }else{

            cameraBtn.style.display =
                "none";

            switchBtnShow(false);
        }


        return localStream;

    }catch(error){

        console.error(
            "MEDIA ERROR:",
            error
        );


        if(
            error.name ===
            "NotAllowedError"
        ){

            showToast(
                "Microphone/Camera permission দিন।"
            );

        }else{

            showToast(
                "Microphone/Camera চালু করা যায়নি।"
            );
        }


        throw error;
    }
}


/* =====================================================
   SWITCH BUTTON
===================================================== */

function switchBtnShow(show){

    const btn =
        document.getElementById(
            "switchBtn"
        );

    if(btn){

        btn.style.display =
            show
                ? "flex"
                : "none";
    }
}


/* =====================================================
   SEND SIGNAL
===================================================== */

async function sendSignal(
    type,
    data
){

    if(!callData){

        return;
    }


    try{

        const {
            error
        } =
            await supabaseClient
                .from("call_signals")
                .insert({

                    conversation_id:
                        callData.conversation_id,

                    sender_id:
                        currentUser.id,

                    signal_type:
                        type,

                    payload:{

                        call_id:
                            callId,

                        data:
                            data
                    }
                });


        if(error){

            console.error(
                "SEND SIGNAL ERROR:",
                error
            );
        }

    }catch(error){

        console.error(
            error
        );
    }
}


/* =====================================================
   SUBSCRIBE SIGNALS
===================================================== */

function subscribeSignals(){

    signalChannel =
        supabaseClient
            .channel(
                "call-signals-" +
                callId
            );


    signalChannel
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"call_signals",
                filter:
                    "conversation_id=eq." +
                    callData.conversation_id
            },
            payload => {

                const row =
                    payload.new;


                if(
                    row.sender_id ===
                    currentUser.id
                ){

                    return;
                }


                const rowCallId =
                    row.payload?.call_id;


                if(
                    rowCallId !==
                    callId
                ){

                    return;
                }


                handleSignal(
                    row
                );
            }
        )
        .subscribe(
            status => {

                console.log(
                    "SIGNAL CHANNEL:",
                    status
                );
            }
        );
}


/* =====================================================
   HANDLE SIGNAL
===================================================== */

async function handleSignal(
    signal
){

    const type =
        signal.signal_type;

    const data =
        signal.payload?.data;


    console.log(
        "SIGNAL:",
        type,
        data
    );


    if(
        type === "hangup"
    ){

        endCallLocal(
            "Call ended"
        );

        return;
    }


    if(
        type === "reject"
    ){

        endCallLocal(
            "Call rejected"
        );

        return;
    }


    if(
        type === "offer"
    ){

        if(!isAccepted){

            pendingSignals.push(
                signal
            );

            return;
        }


        await handleOffer(
            data
        );

        return;
    }


    if(
        type === "answer"
    ){

        await handleAnswer(
            data
        );

        return;
    }


    if(
        type === "ice"
    ){

        if(
            !peerConnection ||
            !peerConnection
                .remoteDescription
        ){

            pendingIceCandidates
                .push(data);

            return;
        }


        try{

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        data
                    )
                );

        }catch(error){

            console.error(
                "ICE ERROR:",
                error
            );
        }

        return;
    }
}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(
    offer
){

    try{

        createPeerConnection();


        await getLocalMedia();


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );


        await flushPendingIce();


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await sendSignal(
            "answer",
            answer
        );


        callStatus.textContent =
            "Connected";

    }catch(error){

        console.error(
            "OFFER ERROR:",
            error
        );
    }
}


/* =====================================================
   HANDLE ANSWER
===================================================== */

async function handleAnswer(
    answer
){

    try{

        if(!peerConnection){

            return;
        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );


        await flushPendingIce();


        callStatus.textContent =
            "Connected";

    }catch(error){

        console.error(
            "ANSWER ERROR:",
            error
        );
    }
}


/* =====================================================
   FLUSH ICE
===================================================== */

async function flushPendingIce(){

    if(
        !peerConnection ||
        !peerConnection.remoteDescription
    ){

        return;
    }


    const list =
        [
            ...pendingIceCandidates
        ];


    pendingIceCandidates = [];


    for(
        const candidate of list
    ){

        try{

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }catch(error){

            console.error(
                "PENDING ICE ERROR:",
                error
            );
        }
    }
}


/* =====================================================
   OUTGOING CALL
===================================================== */

async function startOutgoingCall(){

    try{

        isAccepted = true;


        incoming.style.display =
            "none";


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";


        createPeerConnection();


        await getLocalMedia();


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await sendSignal(
            "offer",
            offer
        );

    }catch(error){

        console.error(
            "OUTGOING CALL ERROR:",
            error
        );

        showToast(
            "Call শুরু করা যায়নি।"
        );
    }
}


/* =====================================================
   ACCEPT CALL
===================================================== */

async function acceptCall(){

    try{

        isAccepted = true;


        incoming.style.display =
            "none";


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Connecting video..."
                : "Connecting...";


        createPeerConnection();


        await getLocalMedia();


        /*
           Receiver আগে থেকে পাঠানো
           offer এখন process করবে।
        */

        const offers =
            [
                ...pendingSignals
            ];

        pendingSignals = [];


        for(
            const signal of offers
        ){

            if(
                signal.signal_type ===
                "offer"
            ){

                await handleOffer(
                    signal.payload?.data
                );
            }
        }


        /*
           পুরোনো offer database
           থেকেও খুঁজে নেওয়া হবে।
        */

        await loadExistingSignals();

    }catch(error){

        console.error(
            "ACCEPT ERROR:",
            error
        );

        showToast(
            "Call গ্রহণ করা যায়নি।"
        );
    }
}


/* =====================================================
   LOAD OLD SIGNALS
===================================================== */

async function loadExistingSignals(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("call_signals")
                .select(`
                    id,
                    conversation_id,
                    sender_id,
                    signal_type,
                    payload,
                    created_at
                `)
                .eq(
                    "conversation_id",
                    callData.conversation_id
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );


        if(error){

            console.error(
                "OLD SIGNAL ERROR:",
                error
            );

            return;
        }


        if(!data){

            return;
        }


        for(
            const signal of data
        ){

            if(
                signal.sender_id ===
                currentUser.id
            ){

                continue;
            }


            if(
                signal.payload?.call_id !==
                callId
            ){

                continue;
            }


            if(
                signal.signal_type ===
                "offer"
            ){

                await handleOffer(
                    signal.payload?.data
                );

            }else if(
                signal.signal_type ===
                "ice"
            ){

                if(
                    peerConnection?.remoteDescription
                ){

                    try{

                        await peerConnection
                            .addIceCandidate(
                                new RTCIceCandidate(
                                    signal.payload.data
                                )
                            );

                    }catch(error){

                        console.error(
                            error
                        );
                    }

                }else{

                    pendingIceCandidates
                        .push(
                            signal.payload.data
                        );
                }
            }
        }

    }catch(error){

        console.error(
            error
        );
    }
}


/* =====================================================
   CALL STATUS
===================================================== */

function subscribeCallStatus(){

    callChannel =
        supabaseClient
            .channel(
                "call-status-" +
                callId
            );


    callChannel
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"calls",
                filter:
                    "id=eq." +
                    callId
            },
            payload => {

                const newData =
                    payload.new;


                console.log(
                    "CALL STATUS:",
                    newData.status
                );


                if(
                    newData.status ===
                    "rejected"
                ){

                    endCallLocal(
                        "Call rejected"
                    );
                }


                if(
                    newData.status ===
                    "ended"
                ){

                    endCallLocal(
                        "Call ended"
                    );
                }
            }
        )
        .subscribe();
}


/* =====================================================
   UPDATE CALL STATUS
===================================================== */

async function updateCallStatus(
    status
){

    try{

        await supabaseClient
            .from("calls")
            .update({
                status:status
            })
            .eq(
                "id",
                callId
            );

    }catch(error){

        console.error(
            error
        );
    }
}


/* =====================================================
   REJECT CALL
===================================================== */

async function rejectCall(){

    await sendSignal(
        "reject",
        {
            rejected:true
        }
    );


    await updateCallStatus(
        "rejected"
    );


    endCallLocal(
        "Call rejected"
    );
}


/* =====================================================
   HANGUP
===================================================== */

async function hangup(){

    try{

        await sendSignal(
            "hangup",
            {
                ended:true
            }
        );

        await updateCallStatus(
            "ended"
        );

    }catch(error){

        console.error(
            error
        );
    }


    endCallLocal(
        "Call ended"
    );
}


/* =====================================================
   END LOCAL
===================================================== */

function endCallLocal(
    message
){

    callStatus.textContent =
        message;


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;
    }


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(error){}

        peerConnection = null;
    }


    if(signalChannel){

        try{

            supabaseClient
                .removeChannel(
                    signalChannel
                );

        }catch(error){}
    }


    if(callChannel){

        try{

            supabaseClient
                .removeChannel(
                    callChannel
                );

        }catch(error){}
    }


    setTimeout(
        goBack,
        1200
    );
}


/* =====================================================
   MUTE
===================================================== */

function toggleMute(){

    if(!localStream){

        return;
    }


    const tracks =
        localStream
            .getAudioTracks();


    if(!tracks.length){

        return;
    }


    isMuted =
        !isMuted;


    tracks.forEach(
        track => {

            track.enabled =
                !isMuted;
        }
    );


    muteBtn.textContent =
        isMuted
            ? "🔇"
            : "🎙️";


    muteBtn.classList.toggle(
        "off",
        isMuted
    );
}


/* =====================================================
   CAMERA
===================================================== */

function toggleCamera(){

    if(!localStream){

        return;
    }


    const tracks =
        localStream
            .getVideoTracks();


    if(!tracks.length){

        return;
    }


    isCameraOff =
        !isCameraOff;


    tracks.forEach(
        track => {

            track.enabled =
                !isCameraOff;
        }
    );


    cameraBtn.textContent =
        isCameraOff
            ? "🚫"
            : "📹";


    cameraBtn.classList.toggle(
        "off",
        isCameraOff
    );
}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

    if(
        callData.call_type !==
        "video"
    ){

        return;
    }


    currentFacingMode =
        currentFacingMode ===
        "user"
            ? "environment"
            : "user";


    try{

        const newStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{
                        facingMode:
                            currentFacingMode
                    }
                });


        const newTrack =
            newStream
                .getVideoTracks()[0];


        const sender =
            peerConnection
                ?.getSenders()
                .find(
                    s =>
                        s.track &&
                        s.track.kind ===
                        "video"
                );


        if(sender){

            await sender
                .replaceTrack(
                    newTrack
                );
        }


        const oldTrack =
            localStream
                ?.getVideoTracks()[0];


        if(oldTrack){

            oldTrack.stop();
        }


        if(localStream){

            localStream.removeTrack(
                oldTrack
            );

            localStream.addTrack(
                newTrack
            );
        }


        localVideo.srcObject =
            localStream;


    }catch(error){

        console.error(
            "SWITCH CAMERA ERROR:",
            error
        );

        showToast(
            "Camera পরিবর্তন করা যায়নি।"
        );
    }
}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        window.history.back();

    }else{

        window.location.href =
            "chat.html";
    }
}


/* =====================================================
   PREPARE UI
===================================================== */

function prepareUI(){

    if(
        callData.call_type ===
        "video"
    ){

        cameraBtn.style.display =
            "flex";

        switchBtnShow(true);

    }else{

        cameraBtn.style.display =
            "none";

        switchBtnShow(false);
    }


    if(
        isCaller()
    ){

        incoming.style.display =
            "none";

        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";

    }else{

        incoming.style.display =
            "flex";

        incomingType.textContent =
            callData.call_type ===
            "video"
                ? "Incoming video call"
                : "Incoming audio call";

        callStatus.textContent =
            "Incoming call...";
    }
}


/* =====================================================
   INIT
===================================================== */

async function init(){

    if(initialized){

        return;
    }

    initialized = true;


    loading.style.display =
        "flex";


    callId =
        getCallId();


    console.log(
        "CALL PARAM:",
        callId
    );


    if(!callId){

        loading.style.display =
            "none";

        showToast(
            "Call ID পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1500
        );

        return;
    }


    const userLoaded =
        await loadCurrentUser();


    if(!userLoaded){

        return;
    }


    const callLoaded =
        await loadCall();


    if(!callLoaded){

        return;
    }


    prepareUI();


    subscribeSignals();

    subscribeCallStatus();


    loading.style.display =
        "none";


    /*
       Caller সরাসরি offer পাঠাবে।
       Receiver Accept না করা পর্যন্ত
       offer process করবে না।
    */

    if(isCaller()){

        await startOutgoingCall();

    }else{

        callStatus.textContent =
            "Incoming call...";
    }
}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    init
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{
        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

        if(peerConnection){

            try{
                peerConnection.close();
            }catch(error){}
        }
    }
);

</script>
