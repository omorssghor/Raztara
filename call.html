<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pqyicaqpmojijjskpzcp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5hti2G5K2GLJIa24hClLww_dRL7i4ho";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let callId = null;

let callData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let signalChannel = null;

let callChannel = null;

let pendingIceCandidates = [];

let pendingSignals = [];

let isAccepted = false;

let isMuted = false;

let isCameraOff = false;

let currentFacingMode = "user";

let initialized = false;

let signalSubscribed = false;

let callStatusSubscribed = false;

let startingCall = false;

let remoteDescriptionSet = false;


/* =====================================================
   DOM
===================================================== */

const loading =
    document.getElementById("loading");

const audioScreen =
    document.getElementById("audioScreen");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const remoteAudio =
    document.getElementById("remoteAudio");

const incoming =
    document.getElementById("incoming");

const callStatus =
    document.getElementById("callStatus");

const incomingType =

const cameraBtn =

const muteBtn =

const switchBtn =
    document.getElementById("switchBtn");


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            ()=>{
                toast.style.display =
                    "none";
            },
            3000
        );
}


/* =====================================================
   CALL ID
===================================================== */

function getCallId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("call") ||
        params.get("call_id") ||
        params.get("callId") ||
        params.get("id")
    );
}


/* =====================================================
   CURRENT USER
===================================================== */

async function loadCurrentUser(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();

        if(
            !error &&
            data?.session?.user
        ){

            currentUser =
                data.session.user;

            return true;
        }


        const {
            data:userData,
            error:userError
        } =
            await supabaseClient
                .auth
                .getUser();


        if(
            userError ||
            !userData?.user
        ){

            throw new Error(
                "User ID পাওয়া যায়নি"
            );
        }


        currentUser =
            userData.user;

        return true;

    }catch(error){

        console.error(
            "AUTH ERROR:",
            error
        );

        showToast(
            "User ID পাওয়া যায়নি। আবার Login করুন।"
        );

        setTimeout(
            ()=>{
                window.location.href =
                    "index.html";
            },
            1500
        );

        return false;
    }
}


/* =====================================================
   LOAD CALL
===================================================== */

async function loadCall(){

    if(!callId){

        showToast(
            "Call ID পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1500
        );

        return false;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("calls")
            .select(`
                id,
                conversation_id,
                caller_id,
                receiver_id,
                call_type,
                status
            `)
            .eq(
                "id",
                callId
            )
            .single();


    if(error){

        console.error(
            "CALL LOAD ERROR:",
            error
        );

        showToast(
            error.message ||
            "Call তথ্য পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1800
        );

        return false;
    }


    callData =
        data;


    if(
        currentUser.id !== callData.caller_id &&
        currentUser.id !== callData.receiver_id
    ){

        showToast(
            "এই Call-এর সাথে আপনার সম্পর্ক নেই।"
        );

        setTimeout(
            goBack,
            1800
        );

        return false;
    }


    return true;
}


/* =====================================================
   ROLE
===================================================== */

function isCaller(){

    return (
        currentUser.id ===
        callData.caller_id
    );
}


function isReceiver(){

    return (
        currentUser.id ===
        callData.receiver_id
    );
}


/* =====================================================
   WEBRTC
===================================================== */

const rtcConfig = {

    iceServers:[
        {
            urls:
                "stun:stun.l.google.com:19302"
        },
        {
            urls:
                "stun:stun1.l.google.com:19302"
        }
    ]
};


/* =====================================================
   CREATE PEER
===================================================== */

function createPeerConnection(){

    if(peerConnection){

        return peerConnection;
    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    remoteAudio.srcObject =
        remoteStream;

    remoteVideo.srcObject =
        remoteStream;


    peerConnection.onicecandidate =
        async event => {

            if(
                event.candidate
            ){

                await sendSignal(
                    "ice",
                    event.candidate.toJSON
                        ? event.candidate.toJSON()
                        : event.candidate
                );
            }
        };


    peerConnection.ontrack =
        event => {

            const stream =
                event.streams &&
                event.streams[0];


            if(stream){

                stream
                    .getTracks()
                    .forEach(
                        track => {

                            if(
                                !remoteStream
                                    .getTracks()
                                    .some(
                                        t =>
                                            t.id ===
                                            track.id
                                    )
                            ){

                                remoteStream
                                    .addTrack(
                                        track
                                    );
                            }
                        }
                    );

            }else{

                if(
                    !remoteStream
                        .getTracks()
                        .some(
                            t =>
                                t.id ===
                                event.track.id
                        )
                ){

                    remoteStream.addTrack(
                        event.track
                    );
                }
            }


            if(
                callData.call_type ===
                "video"
            ){

                remoteVideo.style.display =
                    "block";

                audioScreen.style.display =
                    "none";

                remoteVideo.play()
                    .catch(
                        ()=>{}
                    );

            }else{

                remoteAudio.play()
                    .catch(
                        ()=>{}
                    );
            }


            callStatus.textContent =
                "Connected";
        };


    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection
                    ?.connectionState;


            console.log(
                "WEBRTC CONNECTION:",
                state
            );


            if(
                state ===
                "connected"
            ){

                callStatus.textContent =
                    "Connected";
            }


            if(
                state === "connecting"
            ){

                callStatus.textContent =
                    "Connecting...";
            }


            if(
                state === "disconnected"
            ){

                callStatus.textContent =
                    "Connection lost";
            }


            if(
                state === "failed"
            ){

                callStatus.textContent =
                    "Connection failed";

                showToast(
                    "Call connection failed।"
                );
            }


            if(
                state === "closed"
            ){

                callStatus.textContent =
                    "Call ended";
            }
        };


    peerConnection.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE STATE:",
                peerConnection
                    ?.iceConnectionState
            );
        };


    return peerConnection;
}


/* =====================================================
   LOCAL MEDIA
===================================================== */

async function getLocalMedia(){

    if(localStream){

        return localStream;
    }


    const isVideo =
        callData.call_type ===
        "video";


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        isVideo
                            ? {
                                facingMode:
                                    currentFacingMode
                              }
                            : false
                });


        const pc =
            createPeerConnection();


        localStream
            .getTracks()
            .forEach(
                track => {

                    pc.addTrack(
                        track,
                        localStream
                    );
                }
            );


        if(isVideo){

            localVideo.srcObject =
                localStream;

            localVideo.style.display =
                "block";

            cameraBtn.style.display =
                "flex";

            switchBtnShow(true);

            localVideo.play()
                .catch(
                    ()=>{}
                );

        }else{

            cameraBtn.style.display =
                "none";

            switchBtnShow(false);
        }


        return localStream;

    }catch(error){

        console.error(
            "MEDIA ERROR:",
            error
        );


        if(
            error.name ===
            "NotAllowedError"
        ){

            showToast(
                "Microphone/Camera permission দিন।"
            );

        }else if(
            error.name ===
            "NotFoundError"
        ){

            showToast(
                "Microphone/Camera পাওয়া যায়নি।"
            );

        }else{

            showToast(
                "Microphone/Camera চালু করা যায়নি।"
            );
        }


        throw error;
    }
}


/* =====================================================
   SWITCH BUTTON
===================================================== */

function switchBtnShow(show){

    switchBtn.style.display =
        show
            ? "flex"
            : "none";
}


/* =====================================================
   SEND SIGNAL
===================================================== */

async function sendSignal(
    type,
    data
){

    if(
        !callData ||
        !currentUser
    ){

        return false;
    }


    try{

        const {
            error
        } =
            await supabaseClient
                .from("call_signals")
                .insert({

                    conversation_id:
                        callData.conversation_id,

                    sender_id:
                        currentUser.id,

                    signal_type:
                        type,

                    payload:{
                        call_id:
                            callId,

                        data:
                            data
                    }
                });


        if(error){

            console.error(
                "SEND SIGNAL ERROR:",
                error
            );

            return false;
        }


        return true;

    }catch(error){

        console.error(
            "SEND SIGNAL ERROR:",
            error
        );

        return false;
    }
}


/* =====================================================
   SUBSCRIBE SIGNALS
===================================================== */

function subscribeSignals(){

    return new Promise(
        resolve => {

            signalChannel =
                supabaseClient
                    .channel(
                        "call-signals-" +
                        callId +
                        "-" +
                        currentUser.id
                    );


            signalChannel
                .on(
                    "postgres_changes",
                    {
                        event:"INSERT",
                        schema:"public",
                        table:"call_signals",
                        filter:
                            "conversation_id=eq." +
                            callData.conversation_id
                    },
                    payload => {

                        const row =
                            payload.new;


                        if(
                            row.sender_id ===
                            currentUser.id
                        ){

                            return;
                        }


                        if(
                            row.payload?.call_id !==
                            callId
                        ){

                            return;
                        }


                        handleSignal(
                            row
                        );
                    }
                )
                .subscribe(
                    status => {

                        console.log(
                            "SIGNAL CHANNEL:",
                            status
                        );


                        if(
                            status ===
                            "SUBSCRIBED"
                        ){

                            signalSubscribed =
                                true;

                            resolve(true);
                        }


                        if(
                            status ===
                            "CHANNEL_ERROR" ||
                            status ===
                            "TIMED_OUT"
                        ){

                            signalSubscribed =
                                false;

                            resolve(false);
                        }
                    }
                );
        }
    );
}


/* =====================================================
   HANDLE SIGNAL
===================================================== */

async function handleSignal(
    signal
){

    const type =
        signal.signal_type;

    const data =
        signal.payload?.data;


    console.log(
        "RECEIVED SIGNAL:",
        type
    );


    if(
        type === "hangup"
    ){

        endCallLocal(
            "Call ended"
        );

        return;
    }


    if(
        type === "reject"
    ){

        endCallLocal(
            "Call rejected"
        );

        return;
    }


    if(
        type === "offer"
    ){

        if(!isAccepted){

            pendingSignals.push(
                signal
            );

            return;
        }


        await handleOffer(
            data
        );

        return;
    }


    if(
        type === "answer"
    ){

        await handleAnswer(
            data
        );

        return;
    }


    if(
        type === "ice"
    ){

        if(
            !peerConnection ||
            !remoteDescriptionSet
        ){

            pendingIceCandidates.push(
                data
            );

            return;
        }


        await addIceCandidateSafe(
            data
        );

        return;
    }
}


/* =====================================================
   ADD ICE SAFELY
===================================================== */

async function addIceCandidateSafe(
    candidate
){

    if(!candidate){

        return;
    }


    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){

        pendingIceCandidates.push(
            candidate
        );

        return;
    }


    try{

        await peerConnection
            .addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

    }catch(error){

        console.error(
            "ICE ERROR:",
            error
        );
    }
}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(
    offer
){

    if(!offer){

        return;
    }


    try{

        createPeerConnection();


        await getLocalMedia();


        if(
            remoteDescriptionSet
        ){

            return;
        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );


        remoteDescriptionSet =
            true;


        await flushPendingIce();


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await sendSignal(
            "answer",
            peerConnection.localDescription
                .toJSON
                    ? peerConnection.localDescription.toJSON()
                    : peerConnection.localDescription
        );


        callStatus.textContent =
            "Connecting...";

    }catch(error){

        console.error(
            "OFFER ERROR:",
            error
        );

        showToast(
            "Call connection তৈরি করা যায়নি।"
        );
    }
}


/* =====================================================
   HANDLE ANSWER
===================================================== */

async function handleAnswer(
    answer
){

    try{

        if(!peerConnection){

            return;
        }


        if(
            peerConnection
                .signalingState !==
            "have-local-offer"
        ){

            return;
        }


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );


        remoteDescriptionSet =
            true;


        await flushPendingIce();


        callStatus.textContent =
            "Connecting...";

    }catch(error){

        console.error(
            "ANSWER ERROR:",
            error
        );
    }
}


/* =====================================================
   FLUSH ICE
===================================================== */

async function flushPendingIce(){

    if(
        !peerConnection ||
        !remoteDescriptionSet
    ){

        return;
    }


    const list =
        [
            ...pendingIceCandidates
        ];


    pendingIceCandidates = [];


    for(
        const candidate of list
    ){

        await addIceCandidateSafe(
            candidate
        );
    }
}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =====================================================
   LOAD EXISTING SIGNALS
===================================================== */

async function loadExistingSignals(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("call_signals")
                .select(`
                    id,
                    conversation_id,
                    sender_id,
                    signal_type,
                    payload,
                    created_at
                `)
                .eq(
                    "conversation_id",
                    callData.conversation_id
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );


        if(error){

            console.error(
                "OLD SIGNAL ERROR:",
                error
            );

            return;
        }


        if(!data){

            return;
        }


        for(
            const signal of data
        ){

            if(
                signal.sender_id ===
                currentUser.id
            ){

                continue;
            }


            if(
                signal.payload?.call_id !==
                callId
            ){

                continue;
            }


            if(
                signal.signal_type ===
                "offer"
            ){

                if(
                    isAccepted &&
                    !remoteDescriptionSet
                ){

                    await handleOffer(
                        signal.payload?.data
                    );
                }

            }else if(
                signal.signal_type ===
                "ice"
            ){

                await addIceCandidateSafe(
                    signal.payload?.data
                );
            }

        }

    }catch(error){

        console.error(
            "LOAD SIGNAL ERROR:",
            error
        );
    }
}


/* =====================================================
   OUTGOING CALL
===================================================== */

async function startOutgoingCall(){

    if(startingCall){

        return;
    }


    startingCall =
        true;


    try{

        isAccepted =
            true;


        incoming.style.display =
            "none";


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";


        createPeerConnection();


        await getLocalMedia();


        /*
          Realtime SUBSCRIBED হওয়া
          পর্যন্ত অপেক্ষা।
        */

        if(
            !signalSubscribed
        ){

            const ready =
                await waitForSignalSubscription();

            if(!ready){

                throw new Error(
                    "Signal connection failed"
                );
            }
        }


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        const offerData =
            peerConnection.localDescription;


        await sendSignal(
            "offer",
            offerData?.toJSON
                ? offerData.toJSON()
                : offerData
        );


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";

    }catch(error){

        console.error(
            "OUTGOING CALL ERROR:",
            error
        );

        showToast(
            "Call শুরু করা যায়নি।"
        );

    }finally{

        startingCall =
            false;
    }
}


/* =====================================================
   WAIT SIGNAL SUBSCRIPTION
===================================================== */

function waitForSignalSubscription(){

    return new Promise(
        resolve => {

            let count = 0;


            const timer =
                setInterval(
                    ()=>{

                        if(
                            signalSubscribed
                        ){

                            clearInterval(
                                timer
                            );

                            resolve(true);

                            return;
                        }


                        count++;


                        if(
                            count >= 60
                        ){

                            clearInterval(
                                timer
                            );

                            resolve(false);
                        }

                    },
                    100
                );
        }
    );
}


/* =====================================================
   ACCEPT CALL
===================================================== */

async function acceptCall(){

    try{

        isAccepted =
            true;


        incoming.style.display =
            "none";


        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Connecting video..."
                : "Connecting...";


        createPeerConnection();


        await getLocalMedia();


        /*
          আগে pending offer process।
        */

        const offers =
            [
                ...pendingSignals
            ];

        pendingSignals = [];


        for(
            const signal of offers
        ){

            if(
                signal.signal_type ===
                "offer"
            ){

                await handleOffer(
                    signal.payload?.data
                );
            }
        }


        /*
          তারপর database থেকে
          হারানো signal খুঁজে নেওয়া।
        */

        if(
            !remoteDescriptionSet
        ){

            await loadExistingSignals();
        }

    }catch(error){

        console.error(
            "ACCEPT ERROR:",
            error
        );

        showToast(
            "Call গ্রহণ করা যায়নি।"
        );
    }
}


/* =====================================================
   CALL STATUS
===================================================== */

function subscribeCallStatus(){

    callChannel =
        supabaseClient
            .channel(
                "call-status-" +
                callId +
                "-" +
                currentUser.id
            );


    callChannel
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:"calls",
                filter:
                    "id=eq." +
                    callId
            },
            payload => {

                const status =
                    payload.new?.status;


                console.log(
                    "CALL STATUS:",
                    status
                );


                if(
                    status ===
                    "rejected"
                ){

                    endCallLocal(
                        "Call rejected"
                    );
                }


                if(
                    status ===
                    "ended"
                ){

                    endCallLocal(
                        "Call ended"
                    );
                }
            }
        )
        .subscribe(
            status => {

                console.log(
                    "CALL STATUS CHANNEL:",
                    status
                );

                if(
                    status ===
                    "SUBSCRIBED"
                ){

                    callStatusSubscribed =
                        true;
                }
            }
        );
}


/* =====================================================
   UPDATE CALL STATUS
===================================================== */

async function updateCallStatus(
    status
){

    try{

        const {
            error
        } =
            await supabaseClient
                .from("calls")
                .update({
                    status:status
                })
                .eq(
                    "id",
                    callId
                );


        if(error){

            console.error(
                "UPDATE CALL ERROR:",
                error
            );
        }

    }catch(error){

        console.error(
            "UPDATE CALL ERROR:",
            error
        );
    }
}


/* =====================================================
   REJECT
===================================================== */

async function rejectCall(){

    try{

        await sendSignal(
            "reject",
            {
                rejected:true
            }
        );

        await updateCallStatus(
            "rejected"
        );

    }catch(error){

        console.error(
            error
        );
    }


    endCallLocal(
        "Call rejected"
    );
}


/* =====================================================
   HANGUP
===================================================== */

async function hangup(){

    try{

        await sendSignal(
            "hangup",
            {
                ended:true
            }
        );

        await updateCallStatus(
            "ended"
        );

    }catch(error){

        console.error(
            error
        );
    }


    endCallLocal(
        "Call ended"
    );
}


/* =====================================================
   END LOCAL
===================================================== */

function endCallLocal(
    message
){

    if(
        callStatus
    ){

        callStatus.textContent =
            message;
    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;
    }


    if(remoteStream){

        remoteStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );
    }


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(error){}

        peerConnection =
            null;
    }


    remoteDescriptionSet =
        false;


    if(signalChannel){

        try{

            supabaseClient
                .removeChannel(
                    signalChannel
                );

        }catch(error){}

        signalChannel =
            null;
    }


    if(callChannel){

        try{

            supabaseClient
                .removeChannel(
                    callChannel
                );

        }catch(error){}

        callChannel =
            null;
    }


    setTimeout(
        goBack,
        1200
    );
}


/* =====================================================
   MUTE
===================================================== */

function toggleMute(){

    if(!localStream){

        return;
    }


    const tracks =
        localStream
            .getAudioTracks();


    if(!tracks.length){

        return;
    }


    isMuted =
        !isMuted;


    tracks.forEach(
        track => {

            track.enabled =
                !isMuted;
        }
    );


    muteBtn.textContent =
        isMuted
            ? "🔇"
            : "🎙️";


    muteBtn.classList.toggle(
        "off",
        isMuted
    );
}


/* =====================================================
   CAMERA
===================================================== */

function toggleCamera(){

    if(!localStream){

        return;
    }


    const tracks =
        localStream
            .getVideoTracks();


    if(!tracks.length){

        return;
    }


    isCameraOff =
        !isCameraOff;


    tracks.forEach(
        track => {

            track.enabled =
                !isCameraOff;
        }
    );


    cameraBtn.textContent =
        isCameraOff
            ? "🚫"
            : "📹";


    cameraBtn.classList.toggle(
        "off",
        isCameraOff
    );
}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

    if(
        callData.call_type !==
        "video"
    ){

        return;
    }


    if(!peerConnection){

        return;
    }


    currentFacingMode =
        currentFacingMode ===
        "user"
            ? "environment"
            : "user";


    try{

        const newStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{
                        facingMode:
                            currentFacingMode
                    }
                });


        const newTrack =
            newStream
                .getVideoTracks()[0];


        const sender =
            peerConnection
                .getSenders()
                .find(
                    s =>
                        s.track &&
                        s.track.kind ===
                        "video"
                );


        if(sender){

            await sender
                .replaceTrack(
                    newTrack
                );
        }


        const oldTrack =
            localStream
                ?.getVideoTracks()[0];


        if(oldTrack){

            oldTrack.stop();

            localStream.removeTrack(
                oldTrack
            );
        }


        if(localStream){

            localStream.addTrack(
                newTrack
            );
        }


        localVideo.srcObject =
            localStream;


        localVideo.play()
            .catch(
                ()=>{}
            );

    }catch(error){

        console.error(
            "SWITCH CAMERA ERROR:",
            error
        );

        showToast(
            "Camera পরিবর্তন করা যায়নি।"
        );
    }
}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    if(
        document.referrer &&
        document.referrer !==
        window.location.href
    ){

        window.history.back();

    }else{

        window.location.href =
            "chat.html";
    }
}


/* =====================================================
   PREPARE UI
===================================================== */

function prepareUI(){

    if(
        callData.call_type ===
        "video"
    ){

        cameraBtn.style.display =
            "flex";

        switchBtnShow(true);

    }else{

        cameraBtn.style.display =
            "none";

        switchBtnShow(false);
    }


    if(
        isCaller()
    ){

        incoming.style.display =
            "none";

        callStatus.textContent =
            callData.call_type ===
            "video"
                ? "Video calling..."
                : "Calling...";

    }else{

        incoming.style.display =
            "flex";

        incomingType.textContent =
            callData.call_type ===
            "video"
                ? "Incoming video call"
                : "Incoming audio call";

        callStatus.textContent =
            "Incoming call...";
    }
}


/* =====================================================
   INIT
===================================================== */

async function init(){

    if(initialized){

        return;
    }


    initialized =
        true;


    loading.style.display =
        "flex";


    callId =
        getCallId();


    if(!callId){

        loading.style.display =
            "none";

        showToast(
            "Call ID পাওয়া যায়নি।"
        );

        setTimeout(
            goBack,
            1500
        );

        return;
    }


    const userLoaded =
        await loadCurrentUser();


    if(!userLoaded){

        return;
    }


    const callLoaded =
        await loadCall();


    if(!callLoaded){

        return;
    }


    prepareUI();


    /*
      প্রথমে Realtime channel তৈরি হবে।
      তারপর caller offer পাঠাবে।
    */

    const signalReady =
        await subscribeSignals();


    if(!signalReady){

        loading.style.display =
            "none";

        showToast(
            "Call signal connection তৈরি হয়নি।"
        );

        return;
    }


    subscribeCallStatus();


    loading.style.display =
        "none";


    if(isCaller()){

        await startOutgoingCall();

    }else{

        callStatus.textContent =
            "Incoming call...";
    }
}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    init
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        if(peerConnection){

            try{
                peerConnection.close();
            }catch(error){}
        }
    }
);

</script>
